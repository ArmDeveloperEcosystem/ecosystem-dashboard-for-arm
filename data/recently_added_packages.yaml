- File:
    Path: linux/opensource_packages/nvidia-gpu-driver-container.md
  Params:
    category: Containers and Orchestration
    description: The NVIDIA GPU Driver Container is a containerised packaging of the
      NVIDIA kernel driver and CUDA runtime components that enables GPU support on
      Linux systems through containers, simplifying deployment, updates, and reproducibility
      across various environments.
    download_url: https://catalog.ngc.nvidia.com/orgs/nvidia/containers/driver
    name: NVIDIA GPU Driver Container
    optional_hidden_info:
      other_info: Release notes for the initial Linux/Arm64 support isn't available.
        GPU Driver container images for Arm64 are available from version 535.288.01
        onwards, with tags - 535.288.01-rhel8.10 and 535.288.01-ubuntu22.04.

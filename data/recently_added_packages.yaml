  Params:
    category: Agent Orchestration
    description: Open WebUI is a self-hosted, offline-capable AI platform with an
      extensible interface that supports multiple LLM runtimes and includes built-in
      RAG capabilities for deploying powerful local AI applications.
    download_url: https://pypi.org/project/open-webui/#history
    name: Open WebUI
    optional_hidden_info:
      other_info: Previous automated evidence for 0.1.124 is no longer reproducible
        through pip because its pinned litellm 1.35.28 dependency is unavailable on

- File:
    Path: linux/opensource_packages/cutile-python.md
  Params:
    category: Languages and Frameworks
    description: CuTile Python is a CUDA-based Python DSL that enables writing high-performance,
      tile-oriented GPU kernels while automatically leveraging advanced NVIDIA GPU
      hardware features.
    download_url: https://pypi.org/project/cuda-tile/#history
    name: CuTile Python
    optional_hidden_info:
      other_info: The release notes for the initial Linux/Arm64 support isn't available.
        However, Pypi releases manylinux Aarch64 wheels from version 1.0.0 onwards.
        Please see [this](https://pypi.org/project/cuda-tile/1.0.0/#files).
      release_notes__recommended_minimum: null
      release_notes__supported_minimum: null
    optional_info:
      alternative_options: null
      arm_recommended_minimum_version:
        rationale: null
        reference_content: null
        release_date: null
        version_number: null
      getting_started_resources:
        arm_content: null
        official_docs: https://docs.nvidia.com/cuda/cutile-python/quickstart.html#installing-cutile-python
        partner_content: null
      homepage_url: https://docs.nvidia.com/cuda/cutile-python/
      support_caveats: CuTile Python supports Linux Aarch64 with official manylinux
        Aarch64 wheels. GPU execution requires CUDA Toolkit 13.1+, NVIDIA driver R580
        or later, and an NVIDIA GPU with compute capability in the 10.x or 12.x series.
        Users should validate on their target Arm64 platform. Please refer [this](https://docs.nvidia.com/cuda/cutile-python/quickstart.html#prerequisites).
    supported_minimum_version:
      release_date: 2025/12/05
      version_number: 1.0.0
    works_on_arm: true

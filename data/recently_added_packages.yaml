- File:
    Path: linux/opensource_packages/ampere-ai-text-to-sql.md
  Params:
    category: Tool / Action Execution
    description: Ampere AI Text-to-SQL is a reference AI application that enables
      users to query databases using natural language by integrating large language
      models with Open WebUI and LlamaIndex, optimized for deployment on Ampere CPU-based
      systems using Docker.
    download_url: https://github.com/orgs/AmpereComputingAI/packages/container/package/ampere-ai-text2sql
    name: Ampere AI Text-to-SQL
    optional_hidden_info:
      other_info: Although the repository does not explicitly state Arm64 support,
        the prerequisite requirement for Ampere Altra or AmpereOne systems, both Arm64-only
        processors, indicates that the package is designed for and supports Linux
        Arm64 starting from its initial release (v0.1).

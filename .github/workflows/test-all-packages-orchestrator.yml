name: Test All Packages (Orchestrator) on Arm64

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly main-branch validation run: Friday night in US Central time.
    # 03:00 UTC Saturday is 10 PM CDT / 9 PM CST Friday.
    - cron: '0 3 * * 6'

jobs:
  scope:
    name: Check smoke change scope
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      smoke: ${{ steps.scope.outputs.smoke }}
    steps:
      - name: Check out exact main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify authenticated changes
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$HEAD_SHA" ]]
          if [[ "$EVENT_NAME" == "push" ]]; then
            python3 .github/scripts/ci_change_scope.py \
              --base "$BASE_SHA" --head "$HEAD_SHA" \
              --github-output "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            printf '%s\n' 'smoke=true' >> "$GITHUB_OUTPUT"
          else
            exit 1
          fi

  orchestrate-batches:
    name: Trigger and Wait for All Batches
    needs: scope
    if: needs.scope.outputs.smoke == 'true'
    concurrency:
      group: orchestrator
      cancel-in-progress: false
      queue: max
    outputs:
      run_attempt: ${{ steps.budget.outputs.run_attempt }}
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - name: Reserve time for Global Summary and evidence upload
        id: budget
        run: |
          printf 'deadline_epoch=%s\n' "$(( $(date +%s) + 285 * 60 ))" >> "$GITHUB_OUTPUT"
          printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact orchestration context
        id: context
        env:
          EXPECTED_BRANCH: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          helper=".github/scripts/orchestration_contract.py"
          orchestration_id="orchestration-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          actual_sha="$(git rev-parse HEAD)"
          [[ "$actual_sha" == "$EXPECTED_SHA" ]]
          [[ "$GITHUB_REF" == "refs/heads/${EXPECTED_BRANCH}" ]]
          python3 "$helper" validate-context \
            --orchestration-id "$orchestration_id" \
            --expected-sha "$EXPECTED_SHA" \
            --branch "$EXPECTED_BRANCH" \
            --repository "$REPOSITORY"
          python3 "$helper" init-records \
            --output .orchestration/batch-records.json
          gh api "repos/${REPOSITORY}/git/ref/heads/${EXPECTED_BRANCH}" \
            > .orchestration/current-main-ref.json
          python3 "$helper" validate-current-ref \
            --payload .orchestration/current-main-ref.json \
            --expected-sha "$EXPECTED_SHA" --branch "$EXPECTED_BRANCH"
          {
            printf 'orchestration_id=%s\n' "$orchestration_id"
            printf 'expected_sha=%s\n' "$EXPECTED_SHA"
            printf 'branch=%s\n' "$EXPECTED_BRANCH"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch and capture exact batch runs
        timeout-minutes: 75
        env:
          DEADLINE_EPOCH: ${{ steps.budget.outputs.deadline_epoch }}
          BRANCH: ${{ steps.context.outputs.branch }}
          EXPECTED_SHA: ${{ steps.context.outputs.expected_sha }}
          GH_TOKEN: ${{ github.token }}
          ORCHESTRATION_ID: ${{ steps.context.outputs.orchestration_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          helper=".github/scripts/orchestration_contract.py"
          records=".orchestration/batch-records.json"

          for i in {1..22}; do
            [[ "$(date +%s)" -lt "$DEADLINE_EPOCH" ]] || { echo "Shared batch time budget exhausted." >&2; exit 1; }
            gh api "repos/${REPOSITORY}/git/ref/heads/${BRANCH}" \
              > .orchestration/current-main-ref.json
            python3 "$helper" validate-current-ref \
              --payload .orchestration/current-main-ref.json \
              --expected-sha "$EXPECTED_SHA" --branch "$BRANCH"
            WORKFLOW="test-all-packages-batch${i}.yml"
            nonce_file=".orchestration/dispatch-nonce-${i}"
            payload=".orchestration/dispatch-${i}.json"
            runs_payload=".orchestration/registration-${i}.json"
            endpoint="$(python3 "$helper" runs-endpoint \
              --batch "$i" \
              --branch "$BRANCH" \
              --expected-sha "$EXPECTED_SHA" \
              --repository "$REPOSITORY")"
            python3 "$helper" generate-dispatch-nonce \
              --output "$nonce_file"
            python3 "$helper" prepare-record \
              --records "$records" \
              --batch "$i" \
              --dispatch-nonce-file "$nonce_file"
            python3 "$helper" batch-dispatch-payload \
              --batch "$i" \
              --orchestration-id "$ORCHESTRATION_ID" \
              --dispatch-nonce-file "$nonce_file" \
              --expected-sha "$EXPECTED_SHA" \
              --branch "$BRANCH" \
              --output "$payload"

            dispatch_reported_success=true
            if gh api --method POST \
              "repos/${REPOSITORY}/actions/workflows/${WORKFLOW}/dispatches" \
              --input "$payload"; then
              echo "Dispatched $WORKFLOW for $ORCHESTRATION_ID."
            else
              dispatch_reported_success=false
              echo "Dispatch API returned an error for $WORKFLOW; checking exact registration once visible."
            fi

            RUN_ID=""
            api_failures=0
            for attempt in {1..18}; do
              [[ "$(date +%s)" -lt "$DEADLINE_EPOCH" ]] || { echo "Shared batch time budget exhausted." >&2; exit 1; }
              gh api "repos/${REPOSITORY}/git/ref/heads/${BRANCH}" \
                > .orchestration/current-main-ref.json
              python3 "$helper" validate-current-ref \
                --payload .orchestration/current-main-ref.json \
                --expected-sha "$EXPECTED_SHA" --branch "$BRANCH"
              if gh api --paginate --slurp "$endpoint" > "$runs_payload"; then
                api_failures=0
                RUN_ID="$(python3 "$helper" select-registration \
                  --payload "$runs_payload" \
                  --batch "$i" \
                  --orchestration-id "$ORCHESTRATION_ID" \
                  --dispatch-nonce-file "$nonce_file" \
                  --expected-sha "$EXPECTED_SHA" \
                  --branch "$BRANCH" \
                  --repository "$REPOSITORY")"
                if [[ -n "$RUN_ID" ]]; then
                  break
                fi
              else
                api_failures=$((api_failures + 1))
                if [[ "$api_failures" -ge 5 ]]; then
                  echo "Infrastructure lookup failed repeatedly for $WORKFLOW."
                  exit 1
                fi
              fi
              echo "Exact run for $WORKFLOW is not visible yet (attempt $attempt/18)."
              sleep 10
            done

            if [[ -z "$RUN_ID" ]]; then
              echo "No unique exact run registered for $WORKFLOW."
              if [[ "$dispatch_reported_success" != "true" ]]; then
                echo "The dispatch API also reported failure; no automatic redispatch was attempted."
              fi
              exit 1
            fi
            python3 "$helper" bind-record-run \
              --records "$records" \
              --batch "$i" \
              --dispatch-nonce-file "$nonce_file" \
              --run-id "$RUN_ID" \
              --run-attempt 1
            rm -f "$nonce_file"
            echo "Captured immutable run $RUN_ID for $WORKFLOW."
          done

          python3 "$helper" build-manifest \
            --records "$records" \
            --orchestration-id "$ORCHESTRATION_ID" \
            --expected-sha "$EXPECTED_SHA" \
            --branch "$BRANCH" \
            --output .orchestration/run-manifest.json

      - name: Wait for captured batch runs
        timeout-minutes: 285
        env:
          DEADLINE_EPOCH: ${{ steps.budget.outputs.deadline_epoch }}
          BRANCH: ${{ steps.context.outputs.branch }}
          EXPECTED_SHA: ${{ steps.context.outputs.expected_sha }}
          GH_TOKEN: ${{ github.token }}
          ORCHESTRATION_ID: ${{ steps.context.outputs.orchestration_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          helper=".github/scripts/orchestration_contract.py"
          manifest=".orchestration/run-manifest.json"
          failed_batches=()

          for i in {1..22}; do
            WORKFLOW="test-all-packages-batch${i}.yml"
            runtime="$(python3 "$helper" record-runtime \
              --manifest "$manifest" \
              --batch "$i")"
            IFS=$'\t' read -r DISPATCH_NONCE RUN_ID RUN_ATTEMPT <<< "$runtime"
            [[ "$RUN_ATTEMPT" == "1" ]]
            run_payload=".orchestration/run-${i}.json"
            api_failures=0
            completed=false

            for attempt in {1..330}; do
              [[ "$(date +%s)" -lt "$DEADLINE_EPOCH" ]] || { echo "Shared batch time budget exhausted." >&2; exit 1; }
              gh api "repos/${REPOSITORY}/git/ref/heads/${BRANCH}" \
                > .orchestration/current-main-ref.json
              python3 "$helper" validate-current-ref \
                --payload .orchestration/current-main-ref.json \
                --expected-sha "$EXPECTED_SHA" --branch "$BRANCH"
              if ! gh api \
                "repos/${REPOSITORY}/actions/runs/${RUN_ID}" \
                > "$run_payload"; then
                api_failures=$((api_failures + 1))
                if [[ "$api_failures" -ge 5 ]]; then
                  echo "Infrastructure lookup failed repeatedly for run $RUN_ID."
                  exit 1
                fi
                sleep 15
                continue
              fi
              api_failures=0
              state="$(python3 "$helper" validate-run \
                --payload "$run_payload" \
                --batch "$i" \
                --orchestration-id "$ORCHESTRATION_ID" \
                --dispatch-nonce "$DISPATCH_NONCE" \
                --expected-sha "$EXPECTED_SHA" \
                --branch "$BRANCH" \
                --repository "$REPOSITORY" \
                --expected-run-id "$RUN_ID" \
                --allow-incomplete)"
              IFS=$'\t' read -r STATUS CONCLUSION <<< "$state"
              if [[ "$STATUS" == "completed" ]]; then
                completed=true
                if [[ "$CONCLUSION" == "success" ]]; then
                  echo "$WORKFLOW completed successfully."
                else
                  echo "$WORKFLOW run $RUN_ID completed with conclusion ${CONCLUSION:-unknown}."
                  failed_batches+=("$WORKFLOW run $RUN_ID concluded ${CONCLUSION:-unknown}")
                fi
                break
              fi
              echo "$WORKFLOW run $RUN_ID is $STATUS (attempt $attempt/330)."
              sleep 60
            done

            if [[ "$completed" != "true" ]]; then
              echo "Run $RUN_ID did not complete within the bounded wait."
              exit 1
            fi
          done

          if [[ "${#failed_batches[@]}" -gt 0 ]]; then
            echo "One or more captured batch runs failed:"
            printf ' - %s\n' "${failed_batches[@]}"
            echo "The bounded recovery step will classify these failures."
          fi

      - name: Install pinned recovery parser
        timeout-minutes: 5
        run: >-
          python3 -m pip install --disable-pip-version-check --no-deps
          --only-binary=:all: --require-hashes
          --requirement .github/scripts/requirements-exact-run.txt

      - name: Confirm failed batches once with fresh exact runs
        timeout-minutes: 95
        env:
          DEADLINE_EPOCH: ${{ steps.budget.outputs.deadline_epoch }}
          BRANCH: ${{ steps.context.outputs.branch }}
          EXPECTED_SHA: ${{ steps.context.outputs.expected_sha }}
          ORCHESTRATION_ID: ${{ steps.context.outputs.orchestration_id }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 .github/scripts/smoke_recovery.py \
            --manifest .orchestration/run-manifest.json \
            --repository "$REPOSITORY" --branch "$BRANCH" \
            --expected-sha "$EXPECTED_SHA" \
            --orchestration-id "$ORCHESTRATION_ID" \
            --deadline-epoch "$DEADLINE_EPOCH" \
            --audit .orchestration/recovery-audit.json

      - name: Dispatch exact global summary
        timeout-minutes: 65
        env:
          BRANCH: ${{ steps.context.outputs.branch }}
          EXPECTED_SHA: ${{ steps.context.outputs.expected_sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          helper=".github/scripts/orchestration_contract.py"
          gh api "repos/${REPOSITORY}/git/ref/heads/${BRANCH}" \
            > .orchestration/current-main-ref.json
          python3 "$helper" validate-current-ref \
            --payload .orchestration/current-main-ref.json \
            --expected-sha "$EXPECTED_SHA" --branch "$BRANCH"
          summary_nonce_file=".orchestration/summary-dispatch-nonce"
          summary_registration_payload=".orchestration/summary-registration.json"
          summary_run_payload=".orchestration/summary-run.json"
          python3 "$helper" generate-dispatch-nonce \
            --output "$summary_nonce_file"
          python3 "$helper" summary-dispatch-payload \
            --manifest .orchestration/run-manifest.json \
            --ref "$BRANCH" \
            --dispatch-nonce-file "$summary_nonce_file" \
            --output .orchestration/summary-dispatch.json
          summary_endpoint="$(python3 "$helper" summary-runs-endpoint \
            --branch "$BRANCH" \
            --expected-sha "$EXPECTED_SHA" \
            --repository "$REPOSITORY")"
          gh api --method POST \
            "repos/${REPOSITORY}/actions/workflows/test-all-packages-summary.yml/dispatches" \
            --input .orchestration/summary-dispatch.json

          summary_run_id=""
          for attempt in {1..18}; do
            gh api "repos/${REPOSITORY}/git/ref/heads/${BRANCH}" \
              > .orchestration/current-main-ref.json
            python3 "$helper" validate-current-ref \
              --payload .orchestration/current-main-ref.json \
              --expected-sha "$EXPECTED_SHA" --branch "$BRANCH"
            if gh api --paginate --slurp "$summary_endpoint" > "$summary_registration_payload"; then
              summary_run_id="$(python3 "$helper" select-summary-registration \
                --payload "$summary_registration_payload" \
                --manifest .orchestration/run-manifest.json \
                --dispatch-nonce-file "$summary_nonce_file" \
                --expected-sha "$EXPECTED_SHA" \
                --branch "$BRANCH" \
                --repository "$REPOSITORY")"
              if [[ -n "$summary_run_id" ]]; then
                break
              fi
            fi
            echo "Exact Global Summary run is not visible yet (attempt $attempt/18)."
            sleep 10
          done

          if [[ -z "$summary_run_id" ]]; then
            echo "No exact Global Summary run registered for ${EXPECTED_SHA} on ${BRANCH}."
            exit 1
          fi

          echo "Tracking Global Summary run $summary_run_id."
          for attempt in {1..120}; do
            gh api "repos/${REPOSITORY}/git/ref/heads/${BRANCH}" \
              > .orchestration/current-main-ref.json
            python3 "$helper" validate-current-ref \
              --payload .orchestration/current-main-ref.json \
              --expected-sha "$EXPECTED_SHA" --branch "$BRANCH"
            gh api \
              "repos/${REPOSITORY}/actions/runs/${summary_run_id}" \
              > "$summary_run_payload"
            run_state="$(python3 "$helper" validate-summary-run \
              --payload "$summary_run_payload" \
              --manifest .orchestration/run-manifest.json \
              --dispatch-nonce-file "$summary_nonce_file" \
              --expected-sha "$EXPECTED_SHA" \
              --branch "$BRANCH" \
              --repository "$REPOSITORY" \
              --expected-run-id "$summary_run_id" \
              --allow-incomplete)"
            IFS=$'\t' read -r STATUS CONCLUSION <<< "$run_state"
            if [[ "$STATUS" == "completed" ]]; then
              if [[ "$CONCLUSION" != "success" ]]; then
                echo "Global Summary run $summary_run_id completed with conclusion ${CONCLUSION:-unknown}."
                exit 1
              fi
              echo "Global Summary completed successfully."
              exit 0
            fi
            echo "Global Summary run $summary_run_id is $STATUS (attempt $attempt/120)."
            sleep 30
          done

          echo "Global Summary run $summary_run_id did not complete within the bounded wait."
          exit 1

      - name: Preserve original failures and accepted run identities
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: smoke-orchestration-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .orchestration/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  notify:
    name: Report smoke validation outcome
    needs: [scope, orchestrate-batches]
    if: always() && needs.scope.result == 'success' && needs.scope.outputs.smoke == 'true'
    permissions:
      contents: read
      actions: read
      issues: write
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Check out exact notification implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Notify the smoke-run owner
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          ORCHESTRATION_ATTEMPT: ${{ needs.orchestrate-batches.outputs.run_attempt || github.run_attempt }}
          EXPECTED_SHA: ${{ github.sha }}
          OUTCOME: ${{ needs.orchestrate-batches.result }}
          RECIPIENT: ${{ vars.SMOKE_NOTIFICATION_LOGIN || github.actor }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 .github/scripts/smoke_recovery.py notify \
            --repository "$REPOSITORY" --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" --expected-sha "$EXPECTED_SHA" \
            --orchestration-attempt "$ORCHESTRATION_ATTEMPT" \
            --outcome "$OUTCOME" --recipient "$RECIPIENT"

name: Test Kerberos (krb5) on Arm64
permissions:
  contents: read

on:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-krb5.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-krb5.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-krb5.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-krb5.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-krb5.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-krb5.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-krb5.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-krb5.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-krb5.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-krb5.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-krb5.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-krb5.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-krb5.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-krb5.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-krb5.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-krb5.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-krb5.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-krb5.outputs.regression_next_installed_version }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-krb5.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-krb5.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-krb5.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-krb5.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-krb5.outputs.timestamp }}
jobs:
  test-krb5:
    runs-on: ubuntu-24.04-arm
    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'Kerberos (krb5)'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # original: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=krb5" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/opensource_packages/krb5" >> "$GITHUB_OUTPUT"
      - name: Install Kerberos
        id: install
        run: |
          echo "Installing Kerberos..."
          
          # Install via apt
          sudo apt-get update
          
          # Set DEBIAN_FRONTEND=noninteractive to avoid prompts for default realm
          if sudo DEBIAN_FRONTEND=noninteractive apt-get install -y krb5-user krb5-config; then
             echo "Kerberos installed successfully"
             echo "install_status=success" >> $GITHUB_OUTPUT
          else
             echo "Kerberos installation failed"
             echo "install_status=failed" >> $GITHUB_OUTPUT
             exit 1
          fi

      # ============================================================
      # CUSTOMIZE THIS: Get the package version
      # ============================================================
      - name: Get Kerberos version
        id: version
        continue-on-error: true
        run: |
          set -euo pipefail
          trap 'echo "status=failed" >> "$GITHUB_OUTPUT"' ERR
          export LC_ALL=C
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess

          def run(*args):
              return subprocess.run(args, check=True, stdout=subprocess.PIPE,
                                    stderr=subprocess.STDOUT, text=True).stdout

          binary = shutil.which("klist")
          if not binary:
              raise SystemExit("klist is missing")
          banner = run(binary, "-V")
          match = re.fullmatch(r"Kerberos 5 version ([0-9]+(?:\.[0-9]+){1,2})\n?", banner)
          if not match:
              raise SystemExit(f"Invalid MIT Kerberos version output: {banner!r}")
          version = match[1]
          package = run("dpkg-query", "-W", "-f=${Package}\t${Status}\t${Version}\t${Architecture}\t${source:Upstream-Version}\n", "krb5-user")
          installed = re.fullmatch(r"krb5-user\tinstall ok installed\t([0-9][0-9A-Za-z.+:~\-]*)\tarm64\t([0-9]+(?:\.[0-9]+){1,2})\n", package)
          if not installed or installed[2] != version:
              raise SystemExit(f"MIT Kerberos package/CLI version mismatch: {package!r}, {version!r}")
          files = run("dpkg-query", "-L", "krb5-user").splitlines()
          if Path(binary).resolve() not in {Path(p).resolve() for p in files if p.startswith("/")}:
              raise SystemExit(f"Executable is not owned by krb5-user: {binary}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\npackage_version={installed[1]}\nstatus=passed\n")
          print(f"Verified MIT Kerberos {version}: krb5-user {installed[1]} (arm64), {binary}")
          PY

      # ============================================================
      # ADD YOUR TESTS BELOW
      # Each test should:
      # 1. Have a unique id (test1, test2, etc.)
      # 2. Track start/end time for duration
      # 3. Set status=passed or status=failed
      # 4. Exit 1 on failure
      # ============================================================

      - name: Test 1 - Check kinit binary
        id: test1
        continue-on-error: true
        run: |
          START_TIME=$(date +%s)
          
          if command -v kinit &> /dev/null; then
            echo "✓ kinit binary found"
            echo "status=passed" >> $GITHUB_OUTPUT
          else
            echo "✗ kinit binary not found"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
            fi
          
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT

      - name: Test 2 - Check klist binary
        id: test2
        continue-on-error: true
        run: |
          START_TIME=$(date +%s)
          
          if command -v klist &> /dev/null; then
            echo "✓ klist binary found"
            echo "status=passed" >> $GITHUB_OUTPUT
          else
            echo "✗ klist binary not found"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
            fi
          
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT

      - name: Test 3 - Check version command
        id: test3
        continue-on-error: true
        env:
          DETECTED_VERSION: ${{ steps.version.outputs.version }}
          VERSION_STATUS: ${{ steps.version.outputs.status }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          trap 'echo "status=failed" >> "$GITHUB_OUTPUT"; echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"' ERR
          export LC_ALL=C
          python3 - <<'PY'
          import os
          import re
          import subprocess

          version = os.environ["DETECTED_VERSION"]
          if os.environ["VERSION_STATUS"] != "passed" or not re.fullmatch(r"[0-9]+(?:\.[0-9]+){1,2}", version):
              raise SystemExit("MIT Kerberos package identity was not verified")
          banner = subprocess.run(["klist", "-V"], check=True, stdout=subprocess.PIPE,
                                  stderr=subprocess.STDOUT, text=True).stdout
          if not re.fullmatch(r"Kerberos 5 version " + re.escape(version) + r"\n?", banner):
              raise SystemExit(f"MIT Kerberos version changed or is malformed: {banner!r}")
          PY
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 4 - Check help command
        id: test4
        continue-on-error: true
        run: |
          START_TIME=$(date +%s)
          
          if kinit --help 2>&1 | grep -q "Usage"; then
             echo "✓ kinit help command works"
             echo "status=passed" >> $GITHUB_OUTPUT
          else
             echo "✗ kinit help command failed"
             echo "status=failed" >> $GITHUB_OUTPUT
             exit 1
            fi
          
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT

      - name: Test 5 - Check klist execution (empty cache)
        id: test5
        continue-on-error: true
        run: |
          START_TIME=$(date +%s)
          # Functional Validation
          
          # klist should run but report no credentials cache found
          if klist 2>&1 | grep -q "No credentials cache found" || klist 2>&1 | grep -q "Credentials cache"; then
             echo "✓ klist ran successfully"
             echo "status=passed" >> $GITHUB_OUTPUT
          else
             echo "✗ klist failed to run"
             echo "status=failed" >> $GITHUB_OUTPUT
             exit 1
            fi
          
          # Architecture Verification
          ARCH=$(uname -m)
          if [ "$ARCH" != "aarch64" ]; then
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT

            # ============================================================
      # UPDATE THIS: Calculate summary based on your number of tests
      # Add/remove test result checks to match your tests above

      - name: Regression applicability - package manager installed
        id: test6
        if: always()
        run: |
          set -euo pipefail
          CURRENT="${{ steps.version.outputs.version || 'unknown' }}"
          echo "current_version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest_version=not_applicable" >> "$GITHUB_OUTPUT"
          echo "next_installed_version=not_applicable" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.install.outcome }}" != success ]; then
            echo "decision=baseline_install_failed" >> "$GITHUB_OUTPUT"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "regression_result=Regression skipped: the Kerberos package installation did not succeed." >> "$GITHUB_OUTPUT"
            echo "comparison=No successfully installed baseline is available for comparison." >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.version.outcome }}" = success ] && [ "${{ steps.version.outputs.status }}" = passed ] && \
               [ "$CURRENT" != unknown ] && [ -n "$CURRENT" ] && \
               [ "${{ steps.test1.outcome }}" = success ] && [ "${{ steps.test1.outputs.status }}" = passed ] && \
               [ "${{ steps.test2.outcome }}" = success ] && [ "${{ steps.test2.outputs.status }}" = passed ] && \
               [ "${{ steps.test3.outcome }}" = success ] && [ "${{ steps.test3.outputs.status }}" = passed ] && \
               [ "${{ steps.test4.outcome }}" = success ] && [ "${{ steps.test4.outputs.status }}" = passed ] && \
               [ "${{ steps.test5.outcome }}" = success ] && [ "${{ steps.test5.outputs.status }}" = passed ]; then
            echo "decision=not_applicable_package_manager" >> "$GITHUB_OUTPUT"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "regression_result=Regression validation not applicable: tested package installed via package manager in Tests 1-5" >> "$GITHUB_OUTPUT"
            echo "comparison=The tested package is installed via a package manager in Tests 1-5, so version-to-version regression validation is not shown under the current policy." >> "$GITHUB_OUTPUT"
          else
            echo "decision=baseline_failed" >> "$GITHUB_OUTPUT"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "regression_result=Regression skipped: Kerberos baseline validation did not succeed." >> "$GITHUB_OUTPUT"
            echo "comparison=All five core checks must pass before a baseline can be compared." >> "$GITHUB_OUTPUT"
          fi
          echo "duration=0" >> "$GITHUB_OUTPUT"

      - name: Calculate test summary
        if: always()
        id: summary
        run: |
          set -euo pipefail
          PASSED=0
          FAILED=0
          SKIPPED=0
          TOTAL_DURATION=0
          check_core() {
            local status="$1" outcome="$2" duration="$3"
            if [[ "$duration" =~ ^[0-9]{1,6}$ ]]; then
              TOTAL_DURATION=$((TOTAL_DURATION + 10#$duration))
            else
              status=failed
            fi
            if [ "$status" = passed ] && [ "$outcome" = success ]; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
            fi
          }
          check_core "${{ steps.test1.outputs.status }}" "${{ steps.test1.outcome }}" "${{ steps.test1.outputs.duration }}"
          check_core "${{ steps.test2.outputs.status }}" "${{ steps.test2.outcome }}" "${{ steps.test2.outputs.duration }}"
          check_core "${{ steps.test3.outputs.status }}" "${{ steps.test3.outcome }}" "${{ steps.test3.outputs.duration }}"
          check_core "${{ steps.test4.outputs.status }}" "${{ steps.test4.outcome }}" "${{ steps.test4.outputs.duration }}"
          check_core "${{ steps.test5.outputs.status }}" "${{ steps.test5.outcome }}" "${{ steps.test5.outputs.duration }}"
          CORE_FAILED=$FAILED
          DURATION6="${{ steps.test6.outputs.duration }}"
          EXPECTED_DECISION=not_applicable_package_manager
          if [ "${{ steps.install.outcome }}" != success ]; then
            EXPECTED_DECISION=baseline_install_failed
          elif [ "$CORE_FAILED" -gt 0 ] || [ "${{ steps.version.outcome }}" != success ] || \
               [ "${{ steps.version.outputs.status }}" != passed ] || \
               [ -z "${{ steps.version.outputs.version }}" ] || \
               [ "${{ steps.version.outputs.version }}" = unknown ]; then
            EXPECTED_DECISION=baseline_failed
          fi
          if [ "${{ steps.test6.outputs.status }}" = skipped ] &&
             [ "${{ steps.test6.outputs.decision }}" = "$EXPECTED_DECISION" ] &&
             { { [ "$CORE_FAILED" -eq 0 ] && [ "$EXPECTED_DECISION" = not_applicable_package_manager ]; } ||
               { [ "$CORE_FAILED" -gt 0 ] && [ "$EXPECTED_DECISION" != not_applicable_package_manager ]; }; } &&
             [ "${{ steps.test6.outcome }}" = success ] &&
             [[ "$DURATION6" =~ ^[0-9]{1,6}$ ]]; then
            SKIPPED=1
          else
            FAILED=$((FAILED + 1))
          fi
          if [[ "$DURATION6" =~ ^[0-9]{1,6}$ ]]; then
            TOTAL_DURATION=$((TOTAL_DURATION + 10#$DURATION6))
          fi
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "core_failed=$CORE_FAILED" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
          echo "duration=$TOTAL_DURATION" >> "$GITHUB_OUTPUT"
          if [ "$FAILED" -eq 0 ]; then
            echo "overall_status=success" >> "$GITHUB_OUTPUT"
            echo "badge_status=passing" >> "$GITHUB_OUTPUT"
          else
            echo "overall_status=failure" >> "$GITHUB_OUTPUT"
            echo "badge_status=failing" >> "$GITHUB_OUTPUT"
            exit 1
          fi
      - name: Create test summary
        if: always()
        run: |
          echo "## Kerberos (krb5) Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ steps.summary.outputs.overall_status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests Passed:** ${{ steps.summary.outputs.passed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests Failed:** ${{ steps.summary.outputs.failed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Duration:** ${{ steps.summary.outputs.duration || 0 }}s" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner:** ubuntu-24.04 (arm64)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Details" >> $GITHUB_STEP_SUMMARY
          echo "1. Test 1 - Check kinit binary: ${{ steps.test1.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "2. Test 2 - Check klist binary: ${{ steps.test2.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "3. Test 3 - Check version command: ${{ steps.test3.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "4. Test 4 - Check help command: ${{ steps.test4.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "5. Test 5 - Check klist execution (empty cache): ${{ steps.test5.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY

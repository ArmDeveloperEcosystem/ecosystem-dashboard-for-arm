name: Test Microsoft ML.NET on Arm64

permissions:
  contents: read

on:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-mlnet.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-mlnet.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-mlnet.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-mlnet.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-mlnet.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-mlnet.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-mlnet.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-mlnet.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-mlnet.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-mlnet.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-mlnet.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-mlnet.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-mlnet.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-mlnet.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-mlnet.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-mlnet.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-mlnet.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-mlnet.outputs.regression_next_installed_version }}
      regression_policy:
        description: Regression applicability policy classification
        value: ${{ jobs.test-mlnet.outputs.regression_policy }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-mlnet.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-mlnet.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-mlnet.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-mlnet.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-mlnet.outputs.timestamp }}

jobs:
  test-mlnet:
    runs-on: ubuntu-24.04-arm
    env:
      BASELINE_VERSION: "1.6.0"
      PACKAGE_SLUG: "mlnet"
      LANE_KIND: "github release / source-build-or-tarball"
      DOWNLOAD_URL: "https://github.com/dotnet/machinelearning/releases"
      HOMEPAGE_URL: "https://dotnet.microsoft.com/en-us/apps/ai/ml-dotnet"
      OFFICIAL_DOCS: "https://dotnet.microsoft.com/en-us/learn/ml-dotnet/get-started-tutorial/install"
      GITHUB_REPO: "dotnet/machinelearning"
      TEST1_COMMAND: >-
        test -f README.md && test -f Microsoft.ML.sln && test -d src && test -d test && test "$RESOLVED_TAG" = "v1.6.0"
      TEST2_COMMAND: >-
        test "$RESOLVED_TAG" = "v1.6.0" && grep -Fq "Machine Learning for .NET" README.md
      TEST3_COMMAND: >-
        test -d docs && test -d src && grep -Fq 'dotnet add package Microsoft.ML' README.md

      MLNET_SMOKE_COMMAND: |
        export SMOKE_VERSION="${1:?Missing Microsoft.ML version}"
        test "$(uname -m)" = aarch64
        export DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_NOLOGO=1
        SMOKE_DIR=$(mktemp -d)
        cd "$SMOKE_DIR"
        dotnet --info
        dotnet new console --framework net8.0 --no-restore
        dotnet add package Microsoft.ML --version "$SMOKE_VERSION"
        cat > Program.cs <<'CS'
        using System;
        using System.IO;
        using System.Linq;
        using System.Runtime.InteropServices;
        using Microsoft.ML;

        if (RuntimeInformation.ProcessArchitecture != Architecture.Arm64)
            throw new Exception("The ML.NET smoke must execute in an Arm64 process.");
        var ml = new MLContext(seed: 1);
        var data = ml.Data.LoadFromEnumerable(new[] {
            new Input { Value = 2 }, new Input { Value = 4 }, new Input { Value = 6 }
        });
        var model = ml.Transforms.NormalizeMinMax("Normalized", "Value", fixZero: false).Fit(data);
        var values = ml.Data.CreateEnumerable<Output>(model.Transform(data), false)
            .Select(row => row.Normalized).ToArray();
        var expected = new[] { 0f, 0.5f, 1f };
        if (values.Length != expected.Length || values.Where((value, i) =>
            !float.IsFinite(value) || Math.Abs(value - expected[i]) > 0.00001f).Any())
            throw new Exception("Learned normalization produced incorrect values.");
        using var saved = new MemoryStream();
        ml.Model.Save(model, data.Schema, saved);
        saved.Position = 0;
        var restored = ml.Model.Load(saved, out _);
        using var predictor = ml.Model.CreatePredictionEngine<Input, Output>(restored);
        var prediction = predictor.Predict(new Input { Value = 3 }).Normalized;
        if (!float.IsFinite(prediction) || Math.Abs(prediction - 0.25f) > 0.00001f)
            throw new Exception("Restored model produced an incorrect prediction.");
        Console.WriteLine($"ML.NET assembly: {typeof(MLContext).Assembly.Location}; version={typeof(MLContext).Assembly.GetName().Version}");
        Console.WriteLine($"ML.NET Arm64 managed transform passed: [{string.Join(", ", values)}]; restored prediction={prediction}");
        public sealed class Input { public float Value { get; set; } }
        public sealed class Output { public float Normalized { get; set; } }
        CS
        python3 - <<'PY'
        import json, os
        with open("obj/project.assets.json") as source:
            assets = json.load(source)
        expected = "Microsoft.ML/" + os.environ["SMOKE_VERSION"]
        assert [name for name in assets["libraries"] if name.startswith("Microsoft.ML/")] == [expected]
        print("Restored exact package:", expected)
        PY
        dotnet build --no-restore --configuration Release
        python3 - <<'PY'
        import json, os
        from pathlib import Path
        deps_files = list(Path("bin/Release/net8.0").glob("*.deps.json"))
        assert len(deps_files) == 1
        with deps_files[0].open() as source:
            libraries = json.load(source)["libraries"]
        expected = "Microsoft.ML/" + os.environ["SMOKE_VERSION"]
        assert [name for name in libraries if name.startswith("Microsoft.ML/")] == [expected]
        print("Built runtime dependency:", expected)
        PY
        timeout 60 dotnet run --no-build --configuration Release

    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'Microsoft ML.NET'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      regression_policy: "applicable"
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=mlnet" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/linux/opensource_packages/mlnet" >> "$GITHUB_OUTPUT"

      - name: Bootstrap baseline dependencies
        uses: ./.github/actions/apt-bootstrap
        with:
          packages: "git curl jq tar unzip file ca-certificates"
          extra_packages: "dotnet-sdk-8.0"
          quiet: "true"

      - name: Install baseline source or artifact
        id: install
        run: |
          set -euo pipefail
          rm -rf baseline-src baseline-external
          mkdir -p baseline-src baseline-external
          if [ -n "$GITHUB_REPO" ]; then
            RESOLVED_TAG=""
            CANDIDATE_TAGS="$BASELINE_VERSION|v$BASELINE_VERSION"
            if [ -n "${EXTRA_TAG_CANDIDATES:-}" ]; then
              CANDIDATE_TAGS="${CANDIDATE_TAGS}|${EXTRA_TAG_CANDIDATES}"
            fi
            OLD_IFS="$IFS"
            IFS='|'
            for CANDIDATE in $CANDIDATE_TAGS; do
              [ -n "$CANDIDATE" ] || continue
              if git ls-remote --tags --refs "https://github.com/$GITHUB_REPO.git" "refs/tags/$CANDIDATE" | grep -q .; then
                RESOLVED_TAG="$CANDIDATE"
                break
              fi
            done
            IFS="$OLD_IFS"
            if [ -n "$RESOLVED_TAG" ]; then
              git clone --depth 1 --branch "$RESOLVED_TAG" "https://github.com/$GITHUB_REPO.git" baseline-src >/dev/null 2>&1 || true
              echo "resolved_tag=$RESOLVED_TAG" >> "$GITHUB_OUTPUT"
            else
              git clone --depth 1 "https://github.com/$GITHUB_REPO.git" baseline-src >/dev/null 2>&1 || true
              echo "resolved_tag=default_branch" >> "$GITHUB_OUTPUT"
            fi
            if [ -d baseline-src/.git ] || [ -f baseline-src/README.md ] || [ -n "$(find baseline-src -mindepth 1 -maxdepth 2 -print -quit 2>/dev/null)" ]; then
              echo "install_mode=github_source" >> "$GITHUB_OUTPUT"
              echo "install_status=success" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if curl -fsLI "$DOWNLOAD_URL" >/dev/null 2>&1 || curl -fsLI "$HOMEPAGE_URL" >/dev/null 2>&1; then
            {
              echo "download=$DOWNLOAD_URL"
              echo "homepage=$HOMEPAGE_URL"
              echo "docs=$OFFICIAL_DOCS"
            } > baseline-external/metadata.txt
            echo "resolved_tag=external_artifact" >> "$GITHUB_OUTPUT"
            echo "install_mode=external_artifact" >> "$GITHUB_OUTPUT"
            echo "install_status=success" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "install_mode=unresolved" >> "$GITHUB_OUTPUT"
          echo "install_status=failed" >> "$GITHUB_OUTPUT"
          exit 1
      - name: Get baseline version
        id: version
        run: |
          echo "version=$BASELINE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected baseline version: $BASELINE_VERSION"

      - name: Test 1 - Check package-specific baseline markers
        id: test1
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          MODE="${{ steps.install.outputs.install_mode || '' }}"
          RESOLVED_TAG="${{ steps.install.outputs.resolved_tag || '' }}"
          INSTALL_STATUS="${{ steps.install.outputs.install_status || 'failed' }}"
          DOC_PATH="content/linux/opensource_packages/${PACKAGE_SLUG}.md"
          if [ "$INSTALL_STATUS" != "success" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$MODE" = "github_source" ]; then
            cd baseline-src
          fi
          eval "$TEST1_COMMAND"
          if [ "$MODE" = "github_source" ] && [ "$RESOLVED_TAG" = "default_branch" ]; then
            echo "note=Upstream source smoke used the default branch because no exact source tag matched the published baseline version." >> "$GITHUB_OUTPUT"
          fi
          echo "status=passed" >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
      - name: Test 2 - Check package-specific version and release evidence
        id: test2
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          MODE="${{ steps.install.outputs.install_mode || '' }}"
          RESOLVED_TAG="${{ steps.install.outputs.resolved_tag || '' }}"
          DOC_PATH="content/linux/opensource_packages/${PACKAGE_SLUG}.md"
          if [ "$MODE" = "github_source" ]; then
            cd baseline-src
          fi
          if [ -n "${TEST2_COMMAND:-}" ]; then
            eval "$TEST2_COMMAND"
          else
            export DOC_PATH BASELINE_VERSION DOWNLOAD_URL
            python3 -c "from pathlib import Path; import os; text=Path(os.environ['DOC_PATH']).read_text(); version=os.environ['BASELINE_VERSION']; download=os.environ['DOWNLOAD_URL']; assert f'version_number: {version}' in text; assert f'download_url: {download}' in text"
          fi
          echo "status=passed" >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
      - name: Test 3 - Check package-specific docs and entrypoints
        id: test3
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          MODE="${{ steps.install.outputs.install_mode || '' }}"
          DOC_PATH="content/linux/opensource_packages/${PACKAGE_SLUG}.md"
          if [ "$MODE" = "github_source" ]; then
            cd baseline-src
          fi
          eval "$TEST3_COMMAND"
          echo "status=passed" >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
      - name: Test 4 - Architecture Verification
        id: test4
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          DOC_PATH="content/linux/opensource_packages/${PACKAGE_SLUG}.md"
          test "$(uname -m)" = "aarch64"
          grep -Fq "works_on_arm: true" "$DOC_PATH"
          if [ -n "${TEST4_COMMAND:-}" ]; then
            eval "$TEST4_COMMAND"
          fi
          echo "status=passed" >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
      - name: Test 5 - Run bounded package-specific smoke
        id: test5
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then echo "status=failed" >> "$GITHUB_OUTPUT"; fi; echo "duration=$(($(date +%s) - $START_TIME))" >> "$GITHUB_OUTPUT"' EXIT
          bash -euo pipefail -c "$MLNET_SMOKE_COMMAND" -- "$BASELINE_VERSION"
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "note=Restored and built Microsoft.ML ${BASELINE_VERSION}; executed a learned managed normalization transform, checked numeric outputs, and saved/reloaded the model on Arm64. Native trainers and GPU workloads are outside this smoke." >> "$GITHUB_OUTPUT"
      - name: Test 6 - Regression Validation
        id: test6
        uses: ./.github/actions/generic-source-regression-check
        with:
          baseline_version: ${{ steps.version.outputs.version || env.BASELINE_VERSION }}
          github_repo: ${{ env.GITHUB_REPO }}
          lane_kind: ${{ env.LANE_KIND }}
          defer_on_limited_cpu_probe_failure: "false"
          limited_cpu_probe: |
            test "$CURRENT_VERSION" = "$BASELINE_VERSION"
            test "$LATEST_VERSION" != "$BASELINE_VERSION"
            test "${CANDIDATE_TAG#v}" = "$LATEST_VERSION"
            test "$(git -C next-src describe --tags --exact-match)" = "$CANDIDATE_TAG"
            test -f next-src/Microsoft.ML.sln
            test -d next-src/src
            python3 - <<'PY'
            from pathlib import Path
            readme = Path("next-src/README.md").read_text(encoding="utf-8", errors="ignore")
            sln = Path("next-src/Microsoft.ML.sln").read_text(encoding="utf-8", errors="ignore")
            assert "Machine Learning for .NET" in readme
            assert "Microsoft.ML" in sln
            PY
            bash -euo pipefail -c "$MLNET_SMOKE_COMMAND" -- "$LATEST_VERSION"
          limited_cpu_description: "Restored, built, and ran the exact resolved Microsoft.ML candidate on Arm64: learned normalization with checked numeric outputs and model save/reload. Native trainers and GPU workloads are outside this bounded CPU smoke."
      - name: Calculate test summary
        id: summary
        if: always()
        run: |
          set -euo pipefail
          T1="${{ steps.test1.outputs.status || 'failed' }}"
          T2="${{ steps.test2.outputs.status || 'failed' }}"
          T3="${{ steps.test3.outputs.status || 'failed' }}"
          T4="${{ steps.test4.outputs.status || 'failed' }}"
          T5="${{ steps.test5.outputs.status || 'failed' }}"
          T6="${{ steps.test6.outputs.status || 'failed' }}"
          O1="${{ steps.test1.outcome || 'failure' }}"
          O2="${{ steps.test2.outcome || 'failure' }}"
          O3="${{ steps.test3.outcome || 'failure' }}"
          O4="${{ steps.test4.outcome || 'failure' }}"
          O5="${{ steps.test5.outcome || 'failure' }}"
          O6="${{ steps.test6.outcome || 'failure' }}"
          DECISION="${{ steps.test6.outputs.decision || '' }}"
          D1="${{ steps.test1.outputs.duration || '0' }}"
          D2="${{ steps.test2.outputs.duration || '0' }}"
          D3="${{ steps.test3.outputs.duration || '0' }}"
          D4="${{ steps.test4.outputs.duration || '0' }}"
          D5="${{ steps.test5.outputs.duration || '0' }}"
          D6="${{ steps.test6.outputs.duration || '0' }}"
          PASSED=0
          FAILED=0
          SKIPPED=0
          CORE_FAILED=0
          for RESULT in "$T1:$O1" "$T2:$O2" "$T3:$O3" "$T4:$O4" "$T5:$O5"; do
            if [ "$RESULT" = "passed:success" ]; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
              CORE_FAILED=$((CORE_FAILED + 1))
            fi
          done
          if [ "$T6" = "passed" ] && [ "$O6" = "success" ]; then
            PASSED=$((PASSED + 1))
          elif [ "$T6" = "skipped" ] && [ "$O6" = "success" ] && [ "$DECISION" = "no_newer_stable_available" ]; then
            SKIPPED=1
          else
            FAILED=$((FAILED + 1))
          fi
          DURATION=$((D1 + D2 + D3 + D4 + D5 + D6))
          if [ "$FAILED" -eq 0 ]; then
            OVERALL_STATUS="success"
          else
            OVERALL_STATUS="failure"
          fi
          if [ "$CORE_FAILED" -eq 0 ]; then
            BADGE_STATUS="passing"
          else
            BADGE_STATUS="failing"
          fi
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"
          echo "core_failed=$CORE_FAILED" >> "$GITHUB_OUTPUT"
          echo "overall_status=$OVERALL_STATUS" >> "$GITHUB_OUTPUT"
          echo "badge_status=$BADGE_STATUS" >> "$GITHUB_OUTPUT"
          test "$FAILED" -eq 0

      - name: Create test summary
        if: always()
        uses: ./.github/actions/write-package-job-summary
        with:
          package_name: 'Microsoft ML.NET'
          version: ${{ steps.version.outputs.version || 'unknown' }}
          overall_status: ${{ steps.summary.outputs.overall_status || 'unknown' }}
          tests_passed: ${{ steps.summary.outputs.passed || '0' }}
          tests_failed: ${{ steps.summary.outputs.failed || '0' }}
          tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
          duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
          test1_status: ${{ steps.test1.outputs.status || 'skipped' }}
          test2_status: ${{ steps.test2.outputs.status || 'skipped' }}
          test3_status: ${{ steps.test3.outputs.status || 'skipped' }}
          test4_status: ${{ steps.test4.outputs.status || 'skipped' }}
          test5_status: ${{ steps.test5.outputs.status || 'skipped' }}
          test6_status: ${{ steps.test6.outputs.status || 'skipped' }}
          test6_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
          regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
          regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
          regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
          regression_result: ${{ steps.test6.outputs.regression_result || 'Regression result unavailable.' }}
          regression_details: ${{ steps.test6.outputs.comparison || steps.test6.outputs.note || 'Regression comparison summary unavailable.' }}

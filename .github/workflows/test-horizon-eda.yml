name: Test Horizon EDA on Arm64

permissions:
  contents: read

on:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-horizon-eda.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-horizon-eda.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-horizon-eda.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-horizon-eda.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-horizon-eda.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-horizon-eda.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-horizon-eda.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-horizon-eda.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-horizon-eda.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-horizon-eda.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-horizon-eda.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-horizon-eda.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-horizon-eda.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-horizon-eda.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-horizon-eda.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-horizon-eda.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-horizon-eda.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-horizon-eda.outputs.regression_next_installed_version }}
      regression_policy:
        description: Regression applicability policy classification
        value: ${{ jobs.test-horizon-eda.outputs.regression_policy }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-horizon-eda.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-horizon-eda.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-horizon-eda.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-horizon-eda.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-horizon-eda.outputs.timestamp }}

jobs:
  test-horizon-eda:
    runs-on: ubuntu-24.04-arm
    env:
      BASELINE_VERSION: "1.0.0-1build1"
      PACKAGE_SLUG: "horizon-eda"
      LANE_KIND: "github release / source-build-or-tarball"
      DOWNLOAD_URL: "https://flathub.org/en/apps/org.horizon_eda.HorizonEDA"
      HOMEPAGE_URL: "https://horizon-eda.org/"
      OFFICIAL_DOCS: "https://horizon-eda.readthedocs.io/en/latest/installation.html#linux"
      GITHUB_REPO: "horizon-eda/horizon"
      EXTRA_TAG_CANDIDATES: "v1.0.0"
      TEST1_COMMAND: >-
        test -f README.md && test -f Makefile && grep -Fq 'Horizon EDA' README.md && test "$RESOLVED_TAG" = "v1.0.0"
      TEST3_COMMAND: |
        DOC_FILE=$(mktemp "$RUNNER_TEMP/horizon-docs.XXXXXX")
        curl -fsL "$OFFICIAL_DOCS" -o "$DOC_FILE"
        grep -Eqi 'linux|flatpak|installation' "$DOC_FILE"
      TEST5_COMMAND: |
        test "$(uname -m)" = "aarch64"
        cat > "$SMOKE_LOG_DIR/stm32.xml" <<'XML'
        <Mcu xmlns="http://mcd.rou.st.com/modules.php?name=mcu">
          <Pin Name="PA0" Position="1" Type="I/O">
            <Signal Name="GPIO"/>
            <Signal Name="USART2_CTS"/>
          </Pin>
          <Pin Name="VDD" Position="2" Type="Power"/>
          <Pin Name="NRST" Position="3" Type="Reset"/>
        </Mcu>
        XML
        python3 scripts/stm32_to_json.py "$SMOKE_LOG_DIR/stm32.xml" > "$SMOKE_LOG_DIR/stm32.json"
        python3 - <<'PY'
        import json
        import os
        from pathlib import Path

        data = json.loads((Path(os.environ["SMOKE_LOG_DIR"]) / "stm32.json").read_text())
        assert data["1"] == {"pin": "PA0", "direction": "bidirectional", "alt": ["USART2_CTS"]}
        assert data["2"]["direction"] == "power_input"
        assert data["3"]["direction"] == "input"
        PY
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends xvfb xauth xdotool x11-utils dbus-x11 \
          libgtkmm-3.0-1t64 libcurl3t64-gnutls libdxflib3 libepoxy0 librsvg2-2 \
          libsqlite3-0 libzmq5 libhttp-parser2.9 libssh2-1t64 libfreeimage3 libglu1-mesa libgl2ps1.4 \
          > "$SMOKE_LOG_DIR/apt.log" 2>&1
        RUNTIME_DIR=$(mktemp -d "$RUNNER_TEMP/horizon-runtime.XXXXXX")
        mkdir -p "$RUNTIME_DIR/apt/lists/partial" "$RUNTIME_DIR/apt/cache/archives/partial" "$RUNTIME_DIR/archives"
        # Keep the historical archive and missing SONAMEs private; never replace Noble's libraries.
        printf '%s\n' 'deb https://ports.ubuntu.com/ubuntu-ports focal main universe' > "$RUNTIME_DIR/apt/sources.list"
        APT_OPTIONS=(-o "Dir::Etc::sourcelist=$RUNTIME_DIR/apt/sources.list" -o Dir::Etc::sourceparts=-
          -o "Dir::State::lists=$RUNTIME_DIR/apt/lists" -o "Dir::Cache=$RUNTIME_DIR/apt/cache")
        sudo apt-get "${APT_OPTIONS[@]}" update > "$SMOKE_LOG_DIR/archive-index.log" 2>&1
        cd "$RUNTIME_DIR/archives"
        apt-get "${APT_OPTIONS[@]}" download "horizon-eda=$BASELINE_VERSION" \
          libgit2-28 liboce-foundation11 liboce-modeling11 liboce-ocaf-lite11 liboce-ocaf11 \
          liboce-visualization11 libpodofo0.9.6 libyaml-cpp0.6 libzip5 libmbedcrypto3 \
          libmbedx509-0 libmbedtls12 libssl1.1 libtiff5 libidn11 libunistring2 libwebp6 \
          > "$SMOKE_LOG_DIR/archive-download.log" 2>&1
        HORIZON_DEB="$RUNTIME_DIR/archives/horizon-eda_${BASELINE_VERSION}_arm64.deb"
        test "$(dpkg-deb -f "$HORIZON_DEB" Package)" = horizon-eda
        test "$(dpkg-deb -f "$HORIZON_DEB" Version)" = "$BASELINE_VERSION"
        test "$(dpkg-deb -f "$HORIZON_DEB" Architecture)" = arm64
        dpkg-deb -f "$HORIZON_DEB" Package Version Architecture > "$SMOKE_LOG_DIR/package.txt"
        sha256sum ./*.deb > "$SMOKE_LOG_DIR/archive-sha256.txt"
        for ARCHIVE in ./*.deb; do dpkg-deb -x "$ARCHIVE" "$RUNTIME_DIR/root"; done
        dpkg-deb -e "$HORIZON_DEB" "$RUNTIME_DIR/control"
        (cd "$RUNTIME_DIR/root" && md5sum -c "$RUNTIME_DIR/control/md5sums") > "$SMOKE_LOG_DIR/payload-verification.txt"
        HORIZON_IMP="$RUNTIME_DIR/root/usr/bin/horizon-imp"
        HORIZON_EDA="$RUNTIME_DIR/root/usr/bin/horizon-eda"
        test -x "$HORIZON_IMP" && test -x "$HORIZON_EDA"
        export LD_LIBRARY_PATH="$RUNTIME_DIR/root/lib/aarch64-linux-gnu:$RUNTIME_DIR/root/usr/lib/aarch64-linux-gnu:$RUNTIME_DIR/root/usr/lib"
        file "$HORIZON_IMP" | tee "$SMOKE_LOG_DIR/imp-file.txt"
        grep -Eiq 'ELF 64-bit.*(aarch64|ARM aarch64)' "$SMOKE_LOG_DIR/imp-file.txt"
        file "$HORIZON_EDA" | tee "$SMOKE_LOG_DIR/eda-file.txt"
        grep -Eiq 'ELF 64-bit.*(aarch64|ARM aarch64)' "$SMOKE_LOG_DIR/eda-file.txt"
        export HOME="$(mktemp -d "$RUNNER_TEMP/horizon-home.XXXXXX")"
        export XDG_CONFIG_HOME="$HOME/.config" XDG_CACHE_HOME="$HOME/.cache" XDG_RUNTIME_DIR="$HOME/runtime"
        # horizon-imp opens automatic_prefs.db before parsing --help.
        mkdir -p "$XDG_CONFIG_HOME/horizon" "$XDG_CACHE_HOME" "$XDG_RUNTIME_DIR"
        chmod 700 "$XDG_RUNTIME_DIR"
        timeout --kill-after=3s 30s xvfb-run -a -s '-screen 0 1280x1024x24 -nolisten tcp' \
          dbus-run-session -- "$HORIZON_IMP" --help > "$SMOKE_LOG_DIR/help.txt" 2>&1
        grep -Eiq 'interactive manipulator|schematic|symbol|package|board' "$SMOKE_LOG_DIR/help.txt"
        if timeout --kill-after=5s 15s xvfb-run -a -s '-screen 0 1280x1024x24 -nolisten tcp' \
          dbus-run-session -- bash -eu -o pipefail -c '
            "$1" &
            GUI_PID=$!
            trap '\''if kill -0 "$GUI_PID" 2>/dev/null; then kill "$GUI_PID"; fi'\'' EXIT
            for ATTEMPT in $(seq 1 50); do
              kill -0 "$GUI_PID"
              if WINDOWS=$(xdotool search --onlyvisible --pid "$GUI_PID"); then
                for WINDOW in $WINDOWS; do
                  TITLE=$(xdotool getwindowname "$WINDOW")
                  case "$TITLE" in *Horizon*) ;; *) continue ;; esac
                  test "$(xdotool getwindowpid "$WINDOW")" = "$GUI_PID"
                  xprop -id "$WINDOW" _NET_WM_PID WM_CLASS WM_NAME > "$2"
                  printf "window_verified pid=%s id=%s title=%s\n" "$GUI_PID" "$WINDOW" "$TITLE" >> "$2"
                  wait "$GUI_PID"
                  exit 0
                done
              fi
              sleep 0.2
            done
            exit 1
          ' gui-window "$HORIZON_EDA" "$SMOKE_LOG_DIR/window.txt" > "$SMOKE_LOG_DIR/gui-launch.log" 2>&1; then
          LAUNCH_RC=0
        else
          LAUNCH_RC=$?
        fi
        test "$LAUNCH_RC" -eq 124
        grep -Eq '^window_verified pid=[0-9]+ id=[0-9]+ title=.*Horizon' "$SMOKE_LOG_DIR/window.txt"
        echo "installed_version=$BASELINE_VERSION" >> "$GITHUB_OUTPUT"
        echo "note=Ran Horizon v1.0.0 STM32 pin-conversion tooling and the authenticated Ubuntu ${BASELINE_VERSION} Arm64 archive with privately extracted legacy libraries: verified its payload, ELF architecture, help, and GUI liveness under Xvfb. No full PCB editing workflow is claimed." >> "$GITHUB_OUTPUT"

    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'Horizon EDA'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      # Test 6 executes candidate source tools, not an installed candidate GUI package.
      regression_next_installed_version: 'not_installed'
      regression_policy: "applicable"
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          {
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "package_slug=horizon-eda"
            echo "dashboard_link=/linux/opensource_packages/horizon-eda"
          } >> "$GITHUB_OUTPUT"

      - name: Bootstrap baseline dependencies
        uses: ./.github/actions/apt-bootstrap
        with:
          packages: "git curl jq tar unzip file ca-certificates"
          extra_packages: "${{ env.EXTRA_APT_PACKAGES }}"
          quiet: "true"

      - name: Install baseline source or artifact
        id: install
        run: |
          set -euo pipefail
          rm -rf baseline-src baseline-external
          mkdir -p baseline-src baseline-external
          if [ -n "$GITHUB_REPO" ]; then
            RESOLVED_TAG=""
            CANDIDATE_TAGS="$BASELINE_VERSION|v$BASELINE_VERSION"
            if [ -n "${EXTRA_TAG_CANDIDATES:-}" ]; then
              CANDIDATE_TAGS="${CANDIDATE_TAGS}|${EXTRA_TAG_CANDIDATES}"
            fi
            OLD_IFS="$IFS"
            IFS='|'
            for CANDIDATE in $CANDIDATE_TAGS; do
              [ -n "$CANDIDATE" ] || continue
              if git ls-remote --tags --refs "https://github.com/$GITHUB_REPO.git" "refs/tags/$CANDIDATE" | grep -q .; then
                RESOLVED_TAG="$CANDIDATE"
                break
              fi
            done
            IFS="$OLD_IFS"
            if [ -n "$RESOLVED_TAG" ]; then
              git clone --depth 1 --branch "$RESOLVED_TAG" "https://github.com/$GITHUB_REPO.git" baseline-src >/dev/null 2>&1 || true
              RESOLVED_OUTPUT="$RESOLVED_TAG"
            else
              git clone --depth 1 "https://github.com/$GITHUB_REPO.git" baseline-src >/dev/null 2>&1 || true
              RESOLVED_OUTPUT="default_branch"
            fi
            echo "resolved_tag=$RESOLVED_OUTPUT" >> "$GITHUB_OUTPUT"
            if [ -d baseline-src/.git ] || [ -f baseline-src/README.md ] || [ -n "$(find baseline-src -mindepth 1 -maxdepth 2 -print -quit 2>/dev/null)" ]; then
              {
                echo "install_mode=github_source"
                echo "install_status=success"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if curl -fsLI "$DOWNLOAD_URL" >/dev/null 2>&1 || curl -fsLI "$HOMEPAGE_URL" >/dev/null 2>&1; then
            {
              echo "download=$DOWNLOAD_URL"
              echo "homepage=$HOMEPAGE_URL"
              echo "docs=$OFFICIAL_DOCS"
            } > baseline-external/metadata.txt
            {
              echo "resolved_tag=external_artifact"
              echo "install_mode=external_artifact"
              echo "install_status=success"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "install_mode=unresolved"
            echo "install_status=failed"
          } >> "$GITHUB_OUTPUT"
          exit 1
      - name: Get baseline version
        id: version
        run: |
          echo "version=$BASELINE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected baseline version: $BASELINE_VERSION"

      - name: Test 1 - Baseline package evidence
        id: test1
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          MODE="${{ steps.install.outputs.install_mode || '' }}"
          RESOLVED_TAG="${{ steps.install.outputs.resolved_tag || '' }}"
          INSTALL_STATUS="${{ steps.install.outputs.install_status || 'failed' }}"
          if [ "$INSTALL_STATUS" != "success" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$MODE" = "github_source" ]; then
            cd baseline-src
          fi
          eval "$TEST1_COMMAND"
          if [ "$MODE" = "github_source" ] && [ "$RESOLVED_TAG" = "default_branch" ]; then
            echo "note=Upstream source smoke used the default branch because no exact source tag matched the published baseline version." >> "$GITHUB_OUTPUT"
          fi
          echo "status=passed" >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
      - name: Test 2 - Baseline version and release alignment
        id: test2
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          DOC_PATH="content/linux/opensource_packages/${PACKAGE_SLUG}.md"
          export DOC_PATH BASELINE_VERSION DOWNLOAD_URL
          python3 -c "from pathlib import Path; import os; text=Path(os.environ['DOC_PATH']).read_text(); version=os.environ['BASELINE_VERSION']; download=os.environ['DOWNLOAD_URL']; assert f'version_number: {version}' in text; assert f'download_url: {download}' in text"
          echo "status=passed" >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
      - name: Test 3 - Package-specific source or docs evidence
        id: test3
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          MODE="${{ steps.install.outputs.install_mode || '' }}"
          if [ "$MODE" = "github_source" ]; then
            cd baseline-src
          fi
          eval "$TEST3_COMMAND"
          echo "status=passed" >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
      - name: Test 4 - Arm64 support gate
        id: test4
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          DOC_PATH="content/linux/opensource_packages/${PACKAGE_SLUG}.md"
          test "$(uname -m)" = "aarch64"
          grep -Fq "works_on_arm: true" "$DOC_PATH"
          if [ -n "${TEST4_COMMAND:-}" ]; then
            eval "$TEST4_COMMAND"
          fi
          echo "status=passed" >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
      - name: Test 5 - Bounded package-specific smoke
        id: test5
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          SMOKE_LOG_DIR=$(mktemp -d "$RUNNER_TEMP/${PACKAGE_SLUG}-logs.XXXXXX")
          export SMOKE_LOG_DIR
          finish_smoke() {
            RC=$?
            trap - EXIT
            if [ "$RC" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            if [ "$RC" -ne 0 ]; then
              for LOG in "$SMOKE_LOG_DIR"/*; do
                if [ -f "$LOG" ]; then
                  printf '%s\n' "Diagnostic: $LOG"
                  tail -100 "$LOG"
                fi
              done
            fi
            exit "$RC"
          }
          trap finish_smoke EXIT
          MODE="${{ steps.install.outputs.install_mode || '' }}"
          if [ "$MODE" = "github_source" ]; then
            cd baseline-src
          fi
          eval "$TEST5_COMMAND"
          echo "status=passed" >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
      - name: Test 6 - Regression Validation
        id: test6
        uses: ./.github/actions/generic-source-regression-check
        with:
          baseline_version: ${{ steps.version.outputs.version || env.BASELINE_VERSION }}
          github_repo: ${{ env.GITHUB_REPO }}
          lane_kind: ${{ env.LANE_KIND }}
          limited_cpu_probe: |
            test "$(uname -m)" = "aarch64"
            cd next-src
            SMOKE_LOG_DIR=$(mktemp -d "$RUNNER_TEMP/horizon-next-logs.XXXXXX")
            export SMOKE_LOG_DIR
            cat > "$SMOKE_LOG_DIR/stm32.xml" <<'XML'
            <Mcu xmlns="http://mcd.rou.st.com/modules.php?name=mcu">
              <Pin Name="PB7" Position="11" Type="I/O">
                <Signal Name="GPIO"/>
                <Signal Name="I2C1_SDA"/>
                <Signal Name="USART1_RX"/>
              </Pin>
              <Pin Name="VDDA" Position="12" Type="Power"/>
            </Mcu>
            XML
            python3 scripts/stm32_to_json.py "$SMOKE_LOG_DIR/stm32.xml" > "$SMOKE_LOG_DIR/stm32.json"
            python3 - <<'PY'
            import json
            import os
            from pathlib import Path

            data = json.loads((Path(os.environ["SMOKE_LOG_DIR"]) / "stm32.json").read_text())
            assert data["11"] == {"pin": "PB7", "direction": "bidirectional", "alt": ["I2C1_SDA", "USART1_RX"]}
            assert data["12"]["direction"] == "power_input"
            PY
            HELP_BUILD_DIR="$(mktemp -d)"
            python3 scripts/make_help.py src/help_texts.txt "$HELP_BUILD_DIR/help_texts.hpp" "$HELP_BUILD_DIR/help_texts.cpp"
            grep -Fq 'class HelpTexts' "$HELP_BUILD_DIR/help_texts.hpp"
            test -s "$HELP_BUILD_DIR/help_texts.cpp"
            if ! command -v g++ >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo apt-get install -y --no-install-recommends g++ >/dev/null
            fi
            g++ -std=c++17 -I"$HELP_BUILD_DIR" -fsyntax-only "$HELP_BUILD_DIR/help_texts.cpp"
          limited_cpu_description: "Ran the next Horizon EDA candidate's STM32 pin-conversion tooling and generated plus syntax-compiled its help catalog C++ on Arm64. Full GUI project editing remains outside this bounded preflight."
          next_version_override: "2.7.2"
          candidate_tag_override: "v2.7.2"

      - name: Calculate test summary
        id: summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          T1="${{ steps.test1.outputs.status || 'failed' }}"
          T2="${{ steps.test2.outputs.status || 'failed' }}"
          T3="${{ steps.test3.outputs.status || 'failed' }}"
          T4="${{ steps.test4.outputs.status || 'failed' }}"
          T5="${{ steps.test5.outputs.status || 'failed' }}"
          T6="${{ steps.test6.outputs.status || 'failed' }}"
          O1="${{ steps.test1.outcome || 'failure' }}"
          O2="${{ steps.test2.outcome || 'failure' }}"
          O3="${{ steps.test3.outcome || 'failure' }}"
          O4="${{ steps.test4.outcome || 'failure' }}"
          O5="${{ steps.test5.outcome || 'failure' }}"
          O6="${{ steps.test6.outcome || 'failure' }}"
          DECISION="${{ steps.test6.outputs.decision || '' }}"
          D1="${{ steps.test1.outputs.duration || '0' }}"
          D2="${{ steps.test2.outputs.duration || '0' }}"
          D3="${{ steps.test3.outputs.duration || '0' }}"
          D4="${{ steps.test4.outputs.duration || '0' }}"
          D5="${{ steps.test5.outputs.duration || '0' }}"
          D6="${{ steps.test6.outputs.duration || '0' }}"
          PASSED=0
          FAILED=0
          SKIPPED=0
          CORE_FAILED=0
          for RESULT in "$T1:$O1" "$T2:$O2" "$T3:$O3" "$T4:$O4" "$T5:$O5"; do
            if [ "$RESULT" = "passed:success" ]; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
              CORE_FAILED=$((CORE_FAILED + 1))
            fi
          done
          if [ "$T6:$O6" = "passed:success" ]; then
            PASSED=$((PASSED + 1))
          elif [ "$T6:$O6" = "skipped:success" ] && [ "$DECISION" = "no_newer_stable_available" ]; then
            SKIPPED=1
          else
            FAILED=$((FAILED + 1))
          fi
          DURATION=$((D1 + D2 + D3 + D4 + D5 + D6))
          if [ "$FAILED" -eq 0 ]; then
            OVERALL_STATUS="success"
          else
            OVERALL_STATUS="failure"
          fi
          if [ "$CORE_FAILED" -eq 0 ]; then
            BADGE_STATUS="passing"
          else
            BADGE_STATUS="failing"
          fi
          {
            echo "passed=$PASSED"
            echo "failed=$FAILED"
            echo "skipped=$SKIPPED"
            echo "duration=$DURATION"
            echo "core_failed=$CORE_FAILED"
            echo "overall_status=$OVERALL_STATUS"
            echo "badge_status=$BADGE_STATUS"
          } >> "$GITHUB_OUTPUT"
          test "$FAILED" -eq 0

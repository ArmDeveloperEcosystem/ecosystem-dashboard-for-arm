name: Test Ampere Optimized Llama.cpp on Arm64

permissions:
  contents: read

on:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-ampere-optimized-llama.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-ampere-optimized-llama.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-ampere-optimized-llama.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-ampere-optimized-llama.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-ampere-optimized-llama.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-ampere-optimized-llama.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-ampere-optimized-llama.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-ampere-optimized-llama.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-ampere-optimized-llama.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-ampere-optimized-llama.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-ampere-optimized-llama.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-ampere-optimized-llama.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-ampere-optimized-llama.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-ampere-optimized-llama.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-ampere-optimized-llama.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-ampere-optimized-llama.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-ampere-optimized-llama.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-ampere-optimized-llama.outputs.regression_next_installed_version }}
      regression_policy:
        description: Regression applicability policy classification
        value: ${{ jobs.test-ampere-optimized-llama.outputs.regression_policy }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-ampere-optimized-llama.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-ampere-optimized-llama.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-ampere-optimized-llama.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-ampere-optimized-llama.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-ampere-optimized-llama.outputs.timestamp }}

jobs:
  test-ampere-optimized-llama:
    runs-on: ubuntu-24.04-arm
    env:
      BASELINE_VERSION: "1.2.0"
      PACKAGE_SLUG: "ampere-optimized-llama"
      LANE_KIND: "docker/image-or-cluster"
      DOWNLOAD_URL: "https://github.com/AmpereComputingAI/llama.cpp/releases"
      HOMEPAGE_URL: "https://github.com/AmpereComputingAI/llama.cpp"
      OFFICIAL_DOCS: "https://github.com/AmpereComputingAI/llama.cpp#starting-container"
      GITHUB_REPO: "AmpereComputingAI/llama.cpp"
      GH_TOKEN: ${{ github.token }}
      # Official 1.2.0 Docker release; there is no matching source tag.
      # https://hub.docker.com/v2/repositories/amperecomputingai/llama.cpp/tags/1.2.0
      BASELINE_IMAGE_REPO: "amperecomputingai/llama.cpp"
      BASELINE_IMAGE_DIGEST: "sha256:603a1e9b0165593ce2b930557760c15244236fc579920cc1ad078aa5a166d21e"
      PINNED_CONTAINER_IMAGE_LLAMA: amperecomputingai/llama.cpp@sha256:603a1e9b0165593ce2b930557760c15244236fc579920cc1ad078aa5a166d21e # original: amperecomputingai/llama.cpp:1.2.0
      BASELINE_PROBE_COMMAND: |
        set -euo pipefail
        [ "$BASELINE_VERSION" = "1.2.0" ]
        IMAGE="$PINNED_CONTAINER_IMAGE_LLAMA"
        [ "$IMAGE" = "$BASELINE_IMAGE_REPO@$BASELINE_IMAGE_DIGEST" ]
        WORK_DIR=$(mktemp -d)
        CONTAINER="ampere-llama-$(basename "$WORK_DIR")"
        cleanup() {
          RC=$?
          trap - EXIT
          if docker container inspect "$CONTAINER" >/dev/null 2>&1; then
            if ! docker rm -f "$CONTAINER"; then RC=1; fi
          fi
          if [ -f "$WORK_DIR/probe.log" ]; then
            if ! cat "$WORK_DIR/probe.log"; then RC=1; fi
          fi
          if ! rm -rf "$WORK_DIR"; then RC=1; fi
          exit "$RC"
        }
        trap cleanup EXIT
        timeout 420 docker run --rm --pull never --name "$CONTAINER" --platform linux/arm64 \
          --cpus 1 --memory 2g --network none --env OMP_NUM_THREADS=1 \
          --entrypoint /bin/bash "$IMAGE" -euo pipefail -c "$PROBE_COMMAND" > "$WORK_DIR/probe.log" 2>&1

    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'Ampere Optimized Llama.cpp'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      regression_policy: "applicable"
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          {
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "package_slug=ampere-optimized-llama"
            echo "dashboard_link=/linux/opensource_packages/ampere-optimized-llama"
          } >> "$GITHUB_OUTPUT"

      - name: Bootstrap baseline dependencies
        uses: ./.github/actions/apt-bootstrap
        with:
          packages: "git curl python3 ca-certificates"
          quiet: "true"

      - name: Install exact baseline image
        id: install
        run: |
          set -euo pipefail
          echo "install_status=failed" >> "$GITHUB_OUTPUT"
          echo "install_mode=unresolved" >> "$GITHUB_OUTPUT"
          WORK_DIR=$(mktemp -d)
          finish_install() {
            RC=$?
            trap - EXIT
            if ! rm -rf "$WORK_DIR"; then RC=1; fi
            if [ "$RC" -ne 0 ]; then
              echo "install_status=failed" >> "$GITHUB_OUTPUT"
              echo "artifact_version=unknown" >> "$GITHUB_OUTPUT"
            fi
            exit "$RC"
          }
          trap finish_install EXIT
          export WORK_DIR
          [ "$BASELINE_VERSION" = "1.2.0" ]
          docker manifest inspect --verbose "$BASELINE_IMAGE_REPO:$BASELINE_VERSION" > "$WORK_DIR/manifest.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          manifest = json.loads((Path(os.environ["WORK_DIR"]) / "manifest.json").read_text())
          descriptor = manifest["Descriptor"]
          assert descriptor["digest"] == os.environ["BASELINE_IMAGE_DIGEST"], "Baseline tag no longer resolves to the reviewed image"
          assert descriptor["platform"]["architecture"] == "arm64"
          assert descriptor["platform"]["os"] == "linux"
          print(json.dumps(descriptor, sort_keys=True))
          PY
          IMAGE="$PINNED_CONTAINER_IMAGE_LLAMA"
          [ "$IMAGE" = "$BASELINE_IMAGE_REPO@$BASELINE_IMAGE_DIGEST" ]
          docker pull --platform linux/arm64 "$IMAGE"
          docker image inspect "$IMAGE" > "$WORK_DIR/image.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          image, = json.loads((Path(os.environ["WORK_DIR"]) / "image.json").read_text())
          expected = os.environ["BASELINE_IMAGE_REPO"] + "@" + os.environ["BASELINE_IMAGE_DIGEST"]
          assert expected in image["RepoDigests"], "Pulled image is not the reviewed baseline"
          assert image["Architecture"] == "arm64" and image["Os"] == "linux"
          PY
          {
            echo "image_digest=$BASELINE_IMAGE_DIGEST"
            echo "artifact_version=$BASELINE_VERSION"
            echo "install_mode=docker_image"
            echo "install_status=success"
          } >> "$GITHUB_OUTPUT"

      - name: Get verified baseline package version
        id: version
        run: |
          set -euo pipefail
          echo "version=unknown" >> "$GITHUB_OUTPUT"
          [ "${{ steps.install.outputs.install_status || 'failed' }}" = "success" ]
          [ "${{ steps.install.outputs.image_digest || '' }}" = "$BASELINE_IMAGE_DIGEST" ]
          VERSION="${{ steps.install.outputs.artifact_version || '' }}"
          [ "$VERSION" = "$BASELINE_VERSION" ]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_basis=official_image_tag_and_reviewed_digest; embedded_build_version_is_0_unknown" >> "$GITHUB_OUTPUT"

      - name: Test 1 - Check packaged baseline executables
        id: test1
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"
          finish() {
            RC=$?
            trap - EXIT
            if ! END_TIME=$(date +%s); then END_TIME=$START_TIME; RC=1; fi
            if [ "$RC" -ne 0 ]; then echo "status=failed" >> "$GITHUB_OUTPUT"; fi
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap finish EXIT
          PROBE_COMMAND='
          for binary in main server test-sampling test-quantize-fns; do
            test -x "/llm/$binary"
          done
          grep -F "/llm/server" /start.sh
          ' bash -euo pipefail -c "$BASELINE_PROBE_COMMAND"
          echo "note=Verified executable CLI, server, sampling and quantization tests and the server entrypoint in the pinned 1.2.0 image." >> "$GITHUB_OUTPUT"
          echo "status=passed" >> "$GITHUB_OUTPUT"

      - name: Test 2 - Check package version and embedded build identity
        id: test2
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"
          finish() {
            RC=$?
            trap - EXIT
            if ! END_TIME=$(date +%s); then END_TIME=$START_TIME; RC=1; fi
            if [ "$RC" -ne 0 ]; then echo "status=failed" >> "$GITHUB_OUTPUT"; fi
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap finish EXIT
          [ "${{ steps.version.outputs.version || 'unknown' }}" = "$BASELINE_VERSION" ]
          PROBE_COMMAND='
          /llm/main --version > /tmp/main-version.txt 2>&1
          cat /tmp/main-version.txt
          grep -Fx "version: 0 (unknown)" /tmp/main-version.txt
          grep -F "for aarch64-unknown-linux-gnu" /tmp/main-version.txt
          ' bash -euo pipefail -c "$BASELINE_PROBE_COMMAND"
          echo "note=Package 1.2.0 is identified by its official image tag and reviewed digest. CLI version executes and reports build 0 (unknown), not an embedded package semver." >> "$GITHUB_OUTPUT"
          echo "status=passed" >> "$GITHUB_OUTPUT"

      - name: Test 3 - Execute CLI and server help
        id: test3
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"
          finish() {
            RC=$?
            trap - EXIT
            if ! END_TIME=$(date +%s); then END_TIME=$START_TIME; RC=1; fi
            if [ "$RC" -ne 0 ]; then echo "status=failed" >> "$GITHUB_OUTPUT"; fi
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap finish EXIT
          PROBE_COMMAND='
          /llm/main --help > /tmp/main-help.txt 2>&1
          /llm/server --help > /tmp/server-help.txt 2>&1
          cat /tmp/main-help.txt /tmp/server-help.txt
          grep -F "usage: /llm/main" /tmp/main-help.txt
          grep -F -- "--model" /tmp/main-help.txt
          grep -F "usage: /llm/server" /tmp/server-help.txt
          grep -F -- "--host" /tmp/server-help.txt
          ' bash -euo pipefail -c "$BASELINE_PROBE_COMMAND"
          echo "note=Executed both packaged baseline entrypoints successfully and checked their model/server options." >> "$GITHUB_OUTPUT"
          echo "status=passed" >> "$GITHUB_OUTPUT"

      - name: Test 4 - Verify native Arm64 executable architecture
        id: test4
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"
          finish() {
            RC=$?
            trap - EXIT
            if ! END_TIME=$(date +%s); then END_TIME=$START_TIME; RC=1; fi
            if [ "$RC" -ne 0 ]; then echo "status=failed" >> "$GITHUB_OUTPUT"; fi
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap finish EXIT
          [ "$(uname -m)" = "aarch64" ]
          PROBE_COMMAND='
          [ "$(uname -m)" = "aarch64" ]
          for binary in main server test-sampling test-quantize-fns; do
            HEADER=$(od -An -tx1 -N20 "/llm/$binary" | tr -d " \n")
            printf "%s %s\n" "$binary" "$HEADER"
            [[ "$HEADER" =~ ^7f454c460201[0-9a-f]{24}b700$ ]]
          done
          ' bash -euo pipefail -c "$BASELINE_PROBE_COMMAND"
          echo "note=Verified native aarch64 runner and ELF64 little-endian AArch64 machine headers for all four executed baseline binaries." >> "$GITHUB_OUTPUT"
          echo "status=passed" >> "$GITHUB_OUTPUT"

      - name: Test 5 - Run packaged sampling and quantization tests
        id: test5
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"
          finish() {
            RC=$?
            trap - EXIT
            if ! END_TIME=$(date +%s); then END_TIME=$START_TIME; RC=1; fi
            if [ "$RC" -ne 0 ]; then echo "status=failed" >> "$GITHUB_OUTPUT"; fi
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap finish EXIT
          if [ "${{ steps.install.outputs.install_mode || '' }}" != "docker_image" ]; then
            echo "note=The exact packaged baseline is required; source checkout metadata cannot prove the installed runtime." >> "$GITHUB_OUTPUT"
            exit 1
          fi
          PROBE_COMMAND='
          timeout 180 /llm/test-sampling
          timeout 180 /llm/test-quantize-fns
          ' bash -euo pipefail -c "$BASELINE_PROBE_COMMAND"
          echo "note=The official 1.2.0 image passed its shipped sampling and quantization tests on Arm64. No source build, GGUF model inference, model quality or performance claim is made." >> "$GITHUB_OUTPUT"
          echo "status=passed" >> "$GITHUB_OUTPUT"
      - name: Test 6 - Regression Validation
        id: test6
        if: always()
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          FAILURE_DECISION=baseline_failed
          {
            echo "status=failed"
            echo "duration=0"
            echo "current_version=$BASELINE_VERSION"
            echo "latest_version=unknown"
            echo "next_installed_version=not_installed"
            echo "decision=limited_cpu_smoke_failed"
            echo "regression_result=Candidate packaged runtime validation failed"
            echo "comparison=Candidate resolution, artifact verification, or a required runtime check did not complete."
          } >> "$GITHUB_OUTPUT"
          WORK_DIR=""
          cleanup() {
            RC=$?
            trap - EXIT
            if [ -n "$WORK_DIR" ]; then
              if ! rm -rf "$WORK_DIR"; then RC=1; fi
            fi
            if ! END_TIME=$(date +%s); then END_TIME=$START_TIME; RC=1; fi
            if [ "$RC" -ne 0 ]; then
              if [ "$FAILURE_DECISION" = "baseline_failed" ]; then
                {
                  echo "status=skipped"
                  echo "decision=baseline_failed"
                  echo "regression_result=Candidate not attempted because baseline validation failed"
                  echo "comparison=All five baseline statuses and outcomes must pass before candidate work can begin."
                } >> "$GITHUB_OUTPUT"
              else
                {
                  echo "status=failed"
                  echo "decision=limited_cpu_smoke_failed"
                  echo "regression_result=Candidate runtime validation or cleanup failed"
                  echo "comparison=Candidate resolution, verification, execution, or cleanup failed; see the step log."
                } >> "$GITHUB_OUTPUT"
              fi
            fi
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap cleanup EXIT
          for RESULT in \
            "${{ steps.test1.outputs.status || 'failed' }}:${{ steps.test1.outcome || 'failure' }}" \
            "${{ steps.test2.outputs.status || 'failed' }}:${{ steps.test2.outcome || 'failure' }}" \
            "${{ steps.test3.outputs.status || 'failed' }}:${{ steps.test3.outcome || 'failure' }}" \
            "${{ steps.test4.outputs.status || 'failed' }}:${{ steps.test4.outcome || 'failure' }}" \
            "${{ steps.test5.outputs.status || 'failed' }}:${{ steps.test5.outcome || 'failure' }}"; do
            if [ "$RESULT" != "passed:success" ]; then
              {
                echo "decision=baseline_failed"
                echo "status=skipped"
                echo "regression_result=Candidate not attempted because baseline validation failed"
                echo "comparison=All five baseline statuses and outcomes must pass before candidate work can begin."
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          FAILURE_DECISION=limited_cpu_smoke_failed
          echo "decision=limited_cpu_smoke_failed" >> "$GITHUB_OUTPUT"
          [ "$(uname -m)" = "aarch64" ]
          WORK_DIR=$(mktemp -d)
          export WORK_DIR
          NEXT_VERSION=$(python3 - <<'PY'
          import os
          import re
          import subprocess
          tags = subprocess.check_output(["git", "ls-remote", "--tags", "--refs",
                                          "https://github.com/" + os.environ["GITHUB_REPO"] + ".git"], text=True)
          versions = {tuple(map(int, match[1].split("."))): match[1]
                      for line in tags.splitlines()
                      if (match := re.search(r"refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$", line))}
          assert versions, "No stable upstream versions resolved"
          baseline = tuple(map(int, os.environ["BASELINE_VERSION"].split(".")))
          newest = max(versions)
          assert newest >= baseline, "Stable lookup did not establish the baseline or a newer release"
          print(versions[newest])
          PY
          )
          echo "latest_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$NEXT_VERSION" = "$BASELINE_VERSION" ]; then
            {
              echo "next_installed_version=n/a"
              echo "regression_result=No newer stable release is available"
              echo "comparison=The complete stable-tag lookup contained the baseline and no newer candidate."
            } >> "$GITHUB_OUTPUT"
            {
              echo "decision=no_newer_stable_available"
              echo "status=skipped"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export NEXT_VERSION
          AUTH_ARGS=(-H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          if [ -n "${GH_TOKEN:-}" ]; then AUTH_ARGS+=(-H "Authorization: Bearer $GH_TOKEN"); fi
          curl --retry 3 --connect-timeout 20 --max-time 180 -fsSL "${AUTH_ARGS[@]}" \
            "https://api.github.com/repos/$GITHUB_REPO/releases/tags/v$NEXT_VERSION" -o "$WORK_DIR/release.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          root = Path(os.environ["WORK_DIR"])
          release = json.loads((root / "release.json").read_text())
          tag = "v" + os.environ["NEXT_VERSION"]
          assert release["tag_name"] == tag and release["draft"] is False and release["prerelease"] is False
          asset, = [asset for asset in release["assets"]
                    if re.fullmatch(r"llama_aio_" + re.escape(tag) + r"_([0-9a-f]{7,40})\.tar\.gz", asset["name"])]
          expected_url = "https://github.com/" + os.environ["GITHUB_REPO"] + "/releases/download/" + tag + "/" + asset["name"]
          assert asset["browser_download_url"] == expected_url, "Candidate asset URL is not the selected official release"
          assert re.fullmatch(r"sha256:[0-9a-f]{64}", asset.get("digest") or ""), "Candidate publisher checksum is missing"
          assert isinstance(asset["size"], int) and asset["size"] > 0
          (root / "asset.json").write_text(json.dumps(asset))
          (root / "asset-url").write_text(expected_url)
          PY
          ASSET_URL=$(<"$WORK_DIR/asset-url")
          curl --retry 3 --connect-timeout 20 --max-time 900 -fsSL "$ASSET_URL" -o "$WORK_DIR/candidate.tar.gz"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import tarfile
          root = Path(os.environ["WORK_DIR"])
          asset = json.loads((root / "asset.json").read_text())
          archive = root / "candidate.tar.gz"
          assert archive.stat().st_size == asset["size"], "Candidate download size mismatch"
          with archive.open("rb") as stream:
              digest = "sha256:" + hashlib.file_digest(stream, "sha256").hexdigest()
          assert digest == asset["digest"], "Candidate checksum mismatch"
          with tarfile.open(archive) as package:
              package.extractall(root, filter="data")
          binaries = root / asset["name"].removesuffix(".tar.gz")
          for name in ("llama-cli", "llama-server", "test-sampling", "test-quantize-fns"):
              binary = binaries / name
              assert binary.is_file() and os.access(binary, os.X_OK), f"Missing executable: {name}"
              with binary.open("rb") as stream:
                  header = stream.read(20)
              assert header[:6] == b"\x7fELF\x02\x01" and header[18:20] == b"\xb7\x00", f"Not AArch64 ELF64: {name}"
          environment = dict(os.environ, LD_LIBRARY_PATH=str(binaries), OMP_NUM_THREADS="1")
          def run(name, *args):
              result = subprocess.run([str(binaries / name), *args], env=environment, cwd=root,
                                      stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, timeout=180)
              print(result.stdout, end="", flush=True)
              result.check_returncode()
              return result.stdout
          version_output = run("llama-cli", "--version")
          build = re.search(r"^version:\s+\d+ \(([0-9a-f]{7,40})\)$", version_output, re.M)
          asset_commit = asset["name"].removesuffix(".tar.gz").rsplit("_", 1)[1]
          assert build and build[1].startswith(asset_commit), "CLI build does not match the release artifact commit"
          for name, option in (("llama-cli", "--model"), ("llama-server", "--host")):
              help_output = run(name, "--help")
              assert "--help" in help_output and option in help_output, f"Missing help options: {name}"
          run("test-sampling")
          run("test-quantize-fns")
          print(json.dumps({"package_version": os.environ["NEXT_VERSION"], "version_basis": "official_release_asset_and_publisher_digest",
                            "embedded_build": build[0], "asset": asset["name"], "digest": digest}, sort_keys=True))
          PY
          {
            echo "next_installed_version=$NEXT_VERSION"
            echo "regression_result=Arm preflight proof passed on Arm64"
            echo "comparison=Verified the official candidate AIO tarball, publisher checksum and CLI build commit; executed Arm64 CLI/server help and shipped sampling/quantization tests. Package version is release-artifact identity; no source build, GGUF inference, model quality or performance claim is made."
          } >> "$GITHUB_OUTPUT"
          {
            echo "decision=limited_cpu_smoke_validated"
            echo "status=passed"
          } >> "$GITHUB_OUTPUT"
      - name: Calculate test summary
        id: summary
        if: always()
        run: |
          set -euo pipefail
          T1="${{ steps.test1.outputs.status || 'failed' }}"
          T2="${{ steps.test2.outputs.status || 'failed' }}"
          T3="${{ steps.test3.outputs.status || 'failed' }}"
          T4="${{ steps.test4.outputs.status || 'failed' }}"
          T5="${{ steps.test5.outputs.status || 'failed' }}"
          T6="${{ steps.test6.outputs.status || 'failed' }}"
          O1="${{ steps.test1.outcome || 'failure' }}"
          O2="${{ steps.test2.outcome || 'failure' }}"
          O3="${{ steps.test3.outcome || 'failure' }}"
          O4="${{ steps.test4.outcome || 'failure' }}"
          O5="${{ steps.test5.outcome || 'failure' }}"
          O6="${{ steps.test6.outcome || 'failure' }}"
          DECISION="${{ steps.test6.outputs.decision || '' }}"
          D1="${{ steps.test1.outputs.duration || '0' }}"
          D2="${{ steps.test2.outputs.duration || '0' }}"
          D3="${{ steps.test3.outputs.duration || '0' }}"
          D4="${{ steps.test4.outputs.duration || '0' }}"
          D5="${{ steps.test5.outputs.duration || '0' }}"
          D6="${{ steps.test6.outputs.duration || '0' }}"
          PASSED=0
          FAILED=0
          SKIPPED=0
          CORE_FAILED=0
          for RESULT in "$T1:$O1" "$T2:$O2" "$T3:$O3" "$T4:$O4" "$T5:$O5"; do
            if [ "$RESULT" = "passed:success" ]; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
              CORE_FAILED=$((CORE_FAILED + 1))
            fi
          done
          if [ "$T6" = "passed" ] && [ "$O6" = "success" ]; then
            PASSED=$((PASSED + 1))
          elif [ "$CORE_FAILED" -gt 0 ] && [ "$T6" = "skipped" ] && [ "$O6" = "success" ] && [ "$DECISION" = "baseline_failed" ]; then
            SKIPPED=1
          elif [ "$T6" = "skipped" ] && [ "$O6" = "success" ] && [ "$DECISION" = "no_newer_stable_available" ]; then
            SKIPPED=1
          else
            FAILED=$((FAILED + 1))
          fi
          DURATION=$((D1 + D2 + D3 + D4 + D5 + D6))
          if [ "$FAILED" -eq 0 ]; then
            OVERALL_STATUS="success"
          else
            OVERALL_STATUS="failure"
          fi
          if [ "$CORE_FAILED" -eq 0 ]; then
            BADGE_STATUS="passing"
          else
            BADGE_STATUS="failing"
          fi
          {
            echo "passed=$PASSED"
            echo "failed=$FAILED"
            echo "skipped=$SKIPPED"
            echo "duration=$DURATION"
            echo "core_failed=$CORE_FAILED"
            echo "overall_status=$OVERALL_STATUS"
            echo "badge_status=$BADGE_STATUS"
          } >> "$GITHUB_OUTPUT"
          test "$FAILED" -eq 0

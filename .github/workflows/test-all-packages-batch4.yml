name: Test All Packages (Batch 4) on Arm64
run-name: Arm64 Batch 4 [${{ inputs.orchestration_id || format('manual-{0}-{1}', github.run_id, github.run_attempt) }}] [nonce:${{ inputs.dispatch_nonce || 'manual-only' }}]

on:
  workflow_dispatch:
    inputs:
      orchestration_id:
        description: Exact orchestrator identity; blank uses a safe manual fallback
        required: false
        default: ""
        type: string
      dispatch_nonce:
        description: Secret exact-dispatch nonce; blank is manual-only and not publishable
        required: false
        default: ""
        type: string
      expected_sha:
        description: Exact commit expected by the orchestrator
        required: false
        default: ""
        type: string
      expected_branch:
        description: Exact branch expected by the orchestrator
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      orchestration_id:
        required: true
        type: string
      dispatch_nonce:
        required: true
        type: string
      expected_sha:
        required: true
        type: string
      expected_branch:
        required: true
        type: string

permissions:
  contents: read

jobs:

  test-0xffff:
    uses: ./.github/workflows/test-0xffff.yml

  test-openstack-masakari:
    uses: ./.github/workflows/test-openstack-masakari.yml

  test-spire:
    uses: ./.github/workflows/test-spire.yml

  test-icu:
    uses: ./.github/workflows/test-icu.yml

  test-mesh:
    uses: ./.github/workflows/test-mesh.yml

  test-harness-go-sdk:
    uses: ./.github/workflows/test-harness-go-sdk.yml

  test-openblas:
    uses: ./.github/workflows/test-openblas.yml

  test-logzio:
    uses: ./.github/workflows/test-logzio.yml

  test-longhorn:
    uses: ./.github/workflows/test-longhorn.yml

  test-netdata:
    uses: ./.github/workflows/test-netdata.yml

  test-ultralytics:
    uses: ./.github/workflows/test-ultralytics.yml

  test-harbor:
    uses: ./.github/workflows/test-harbor.yml

  test-domo-java-sdk:
    uses: ./.github/workflows/test-domo-java-sdk.yml

  test-rinetd:
    uses: ./.github/workflows/test-rinetd.yml

  test-tdengine:
    uses: ./.github/workflows/test-tdengine.yml

  test-m4:
    uses: ./.github/workflows/test-m4.yml

  test-groff:
    uses: ./.github/workflows/test-groff.yml

  test-neuvector:
    uses: ./.github/workflows/test-neuvector.yml

  test-kubeedge:
    uses: ./.github/workflows/test-kubeedge.yml

  test-openh264:
    uses: ./.github/workflows/test-OpenH264.yml

  test-ray:
    uses: ./.github/workflows/test-ray.yml

  test-freetype:
    uses: ./.github/workflows/test-freetype.yml

  test-wrk:
    uses: ./.github/workflows/test-wrk.yml

  test-boost:
    uses: ./.github/workflows/test-boost.yml

  test-llamaindex:
    uses: ./.github/workflows/test-llamaindex.yml

  test-solr:
    uses: ./.github/workflows/test-solr.yml

  test-eigen:
    uses: ./.github/workflows/test-eigen.yml

  test-freetype2:
    uses: ./.github/workflows/test-freetype2.yml

  test-contour:
    uses: ./.github/workflows/test-contour.yml

  test-elastic-ebpf:
    uses: ./.github/workflows/test-elastic-ebpf.yml

  test-glance:
    uses: ./.github/workflows/test-glance.yml

  test-seata:
    uses: ./.github/workflows/test-seata.yml

  test-cert-manager:
    uses: ./.github/workflows/test-cert-manager.yml

  test-python-dlpy:
    uses: ./.github/workflows/test-python-dlpy.yml

  test-chisel-operator:
    uses: ./.github/workflows/test-chisel-operator.yml

  test-psutil:
    uses: ./.github/workflows/test-psutil.yml

  test-obs:
    uses: ./.github/workflows/test-obs.yml

  test-jaeger:
    uses: ./.github/workflows/test-jaeger.yml

  test-opensearch-data-prepper:
    uses: ./.github/workflows/test-opensearch-data-prepper.yml

  test-ultramarine-linux:
    uses: ./.github/workflows/test-ultramarine-linux.yml

  test-pyzmq:
    uses: ./.github/workflows/test-pyzmq.yml

  test-libx264:
    uses: ./.github/workflows/test-libx264.yml

  test-torchtune:
    uses: ./.github/workflows/test-torchtune.yml

  test-blobfuse2:
    uses: ./.github/workflows/test-blobfuse2.yml

  test-canonical-ceph:
    uses: ./.github/workflows/test-canonical-ceph.yml

  summary:
    permissions:
      actions: read
      contents: read
    needs:
      [
        test-0xffff,
        test-openstack-masakari,
        test-spire,
        test-icu,
        test-mesh,
        test-harness-go-sdk,
        test-openblas,
        test-logzio,
        test-longhorn,
        test-netdata,
        test-ultralytics,
        test-harbor,
        test-domo-java-sdk,
        test-rinetd,
        test-tdengine,
        test-m4,
        test-groff,
        test-neuvector,
        test-kubeedge,
        test-openh264,
        test-ray,
        test-freetype,
        test-wrk,
        test-boost,
        test-llamaindex,
        test-solr,
        test-eigen,
        test-freetype2,
        test-contour,
        test-elastic-ebpf,
        test-glance,
        test-seata,
        test-cert-manager,
        test-python-dlpy,
        test-chisel-operator,
        test-psutil,
        test-obs,
        test-jaeger,
        test-opensearch-data-prepper,
        test-ultramarine-linux,
        test-pyzmq,
        test-libx264,
        test-torchtune,
        test-blobfuse2,
        test-canonical-ceph
      ]
    runs-on: ubuntu-24.04-arm
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # original: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Collect batch results
        id: collect
        uses: ./.github/actions/collect-batch-results
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        with:
          batch_number: "4"
          batch_title: "Batch 4"

      - name: Attest complete batch results
        id: attest
        if: steps.collect.outcome == 'success'
        env:
          ARTIFACT_NAME: batch4-test-results
          BATCH_NUMBER: "4"
          COLLECTOR_JSON_COUNT: ${{ steps.collect.outputs.json_count }}
          CURRENT_BRANCH: ${{ github.ref_name }}
          DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
          EXPECTED_BRANCH: ${{ inputs.expected_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          NEEDS_JSON: ${{ toJson(needs) }}
          ORCHESTRATION_ID: ${{ inputs.orchestration_id }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/batch_artifact_attestation.py create \
            --results-root test-results \
            --workflow-file ".github/workflows/test-all-packages-batch4.yml" \
            --batch "$BATCH_NUMBER" \
            --repository "$REPOSITORY" \
            --expected-branch "$EXPECTED_BRANCH" \
            --current-branch "$CURRENT_BRANCH" \
            --expected-sha "$EXPECTED_SHA" \
            --workflow-sha "$WORKFLOW_SHA" \
            --orchestration-id "$ORCHESTRATION_ID" \
            --dispatch-nonce "$DISPATCH_NONCE" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --artifact-name "$ARTIFACT_NAME" \
            --collector-json-count "$COLLECTOR_JSON_COUNT" \
            --needs-environment-variable NEEDS_JSON

      - name: Upload batch test results
        if: steps.collect.outcome == 'success' && steps.attest.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # original: actions/upload-artifact@v4.6.2
        with:
          name: batch4-test-results
          path: test-results
          retention-days: 90

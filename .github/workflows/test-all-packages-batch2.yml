name: Test All Packages (Batch 2) on Arm64
run-name: Arm64 Batch 2 [${{ inputs.orchestration_id || format('manual-{0}-{1}', github.run_id, github.run_attempt) }}] [nonce:${{ inputs.dispatch_nonce || 'manual-only' }}] [prefetch:${{ (inputs.prefetch_run_id == '' && inputs.prefetch_artifact_name == '') && 'none' || 'present' }}]

on:
  workflow_dispatch:
    inputs:
      orchestration_id:
        description: Exact orchestrator identity; blank uses a safe manual fallback
        required: false
        default: ""
        type: string
      dispatch_nonce:
        description: Secret exact-dispatch nonce; blank is manual-only and not publishable
        required: false
        default: ""
        type: string
      expected_sha:
        description: Exact commit expected by the orchestrator
        required: false
        default: ""
        type: string
      expected_branch:
        description: Exact branch expected by the orchestrator
        required: false
        default: ""
        type: string
      prefetch_run_id:
        description: Orchestrator prefetch run id
        required: false
        default: ""
        type: string
      prefetch_artifact_name:
        description: Orchestrator prefetch artifact name
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      orchestration_id:
        required: true
        type: string
      dispatch_nonce:
        required: true
        type: string
      expected_sha:
        required: true
        type: string
      expected_branch:
        required: true
        type: string
      prefetch_run_id:
        required: false
        type: string
        default: ""
      prefetch_artifact_name:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:

  test-arangodb:
    uses: ./.github/workflows/test-arangodb.yml

  test-archiconda3:
    uses: ./.github/workflows/test-archiconda3.yml

  test-argo:
    uses: ./.github/workflows/test-argo.yml

  test-arthas:
    uses: ./.github/workflows/test-arthas.yml

  test-auditbeat:
    uses: ./.github/workflows/test-auditbeat.yml

  test-avahi:
    uses: ./.github/workflows/test-avahi.yml

  test-avro_py:
    uses: ./.github/workflows/test-avro_py.yml

  test-avxtoneon:
    uses: ./.github/workflows/test-AvxToNeon.yml

  test-httpcomponents-client:
    uses: ./.github/workflows/test-httpcomponents-client.yml

  test-velocity:
    uses: ./.github/workflows/test-velocity.yml

  test-tinker:
    uses: ./.github/workflows/test-tinker.yml

  test-ubuntu:
    uses: ./.github/workflows/test-ubuntu.yml

  test-sqlite:
    uses: ./.github/workflows/test-sqlite.yml

  test-rqlite:
    uses: ./.github/workflows/test-rqlite.yml

  test-keras:
    uses: ./.github/workflows/test-keras.yml

  test-pcre:
    uses: ./.github/workflows/test-pcre.yml

  test-robot-framework:
    uses: ./.github/workflows/test-robot-framework.yml

  test-netty:
    uses: ./.github/workflows/test-netty.yml

  test-haproxy:
    uses: ./.github/workflows/test-haproxy.yml

  test-bcrypt:
    uses: ./.github/workflows/test-bcrypt.yml

  test-powershell:
    uses: ./.github/workflows/test-powershell.yml

  test-spark-sql-kinesis:
    uses: ./.github/workflows/test-spark-sql-kinesis.yml

  test-centos:
    uses: ./.github/workflows/test-centos.yml

  test-daytona:
    uses: ./.github/workflows/test-daytona.yml

  test-spring-cloud-sleuth:
    uses: ./.github/workflows/test-spring-cloud-sleuth.yml

  test-madoguchi:
    uses: ./.github/workflows/test-madoguchi.yml

  test-gardener:
    uses: ./.github/workflows/test-gardener.yml

  test-tbb:
    uses: ./.github/workflows/test-tbb.yml

  test-pinot:
    uses: ./.github/workflows/test-pinot.yml
    with:
      prefetch_run_id: ${{ inputs.prefetch_run_id || '' }}
      prefetch_artifact_name: ${{ inputs.prefetch_artifact_name || '' }}

  test-clickhouse:
    uses: ./.github/workflows/test-clickhouse.yml

  test-nextflow:
    uses: ./.github/workflows/test-nextflow.yml

  test-python-xmlsec:
    uses: ./.github/workflows/test-python-xmlsec.yml

  test-5g-ral:
    uses: ./.github/workflows/test-5G-RAL.yml

  test-libunwind:
    uses: ./.github/workflows/test-libunwind.yml

  test-libaom:
    uses: ./.github/workflows/test-libaom.yml

  test-volcano:
    uses: ./.github/workflows/test-volcano.yml

  test-katsu:
    uses: ./.github/workflows/test-katsu.yml

  test-repeatafterme:
    uses: ./.github/workflows/test-repeatafterme.yml

  test-dhcp:
    uses: ./.github/workflows/test-dhcp.yml

  test-cloud-hypervisor:
    uses: ./.github/workflows/test-cloud-hypervisor.yml

  test-nova:
    uses: ./.github/workflows/test-nova.yml

  test-onnx:
    uses: ./.github/workflows/test-onnx.yml

  test-geos:
    uses: ./.github/workflows/test-geos.yml

  test-ampere-optimized-tensorflow:
    uses: ./.github/workflows/test-ampere-optimized-tensorflow.yml

  test-ant:
    uses: ./.github/workflows/test-ant.yml

  summary:
    permissions:
      actions: read
      contents: read
    needs:
      [
        test-arangodb,
        test-archiconda3,
        test-argo,
        test-arthas,
        test-auditbeat,
        test-avahi,
        test-avro_py,
        test-avxtoneon,
        test-httpcomponents-client,
        test-velocity,
        test-tinker,
        test-ubuntu,
        test-sqlite,
        test-rqlite,
        test-keras,
        test-pcre,
        test-robot-framework,
        test-netty,
        test-haproxy,
        test-bcrypt,
        test-powershell,
        test-spark-sql-kinesis,
        test-centos,
        test-daytona,
        test-spring-cloud-sleuth,
        test-madoguchi,
        test-gardener,
        test-tbb,
        test-pinot,
        test-clickhouse,
        test-nextflow,
        test-python-xmlsec,
        test-5g-ral,
        test-libunwind,
        test-libaom,
        test-volcano,
        test-katsu,
        test-repeatafterme,
        test-dhcp,
        test-cloud-hypervisor,
        test-nova,
        test-onnx,
        test-geos,
        test-ampere-optimized-tensorflow,
        test-ant
      ]
    runs-on: ubuntu-24.04-arm
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # original: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Collect batch results
        id: collect
        uses: ./.github/actions/collect-batch-results
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        with:
          batch_number: "2"
          batch_title: "Batch 2"

      - name: Attest complete batch results
        id: attest
        if: steps.collect.outcome == 'success'
        env:
          ARTIFACT_NAME: batch2-test-results
          BATCH_NUMBER: "2"
          COLLECTOR_JSON_COUNT: ${{ steps.collect.outputs.json_count }}
          CURRENT_BRANCH: ${{ github.ref_name }}
          DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
          EXPECTED_BRANCH: ${{ inputs.expected_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          NEEDS_JSON: ${{ toJson(needs) }}
          ORCHESTRATION_ID: ${{ inputs.orchestration_id }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/batch_artifact_attestation.py create \
            --results-root test-results \
            --workflow-file ".github/workflows/test-all-packages-batch2.yml" \
            --batch "$BATCH_NUMBER" \
            --repository "$REPOSITORY" \
            --expected-branch "$EXPECTED_BRANCH" \
            --current-branch "$CURRENT_BRANCH" \
            --expected-sha "$EXPECTED_SHA" \
            --workflow-sha "$WORKFLOW_SHA" \
            --orchestration-id "$ORCHESTRATION_ID" \
            --dispatch-nonce "$DISPATCH_NONCE" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --artifact-name "$ARTIFACT_NAME" \
            --collector-json-count "$COLLECTOR_JSON_COUNT" \
            --needs-environment-variable NEEDS_JSON

      - name: Upload batch test results
        if: steps.collect.outcome == 'success' && steps.attest.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # original: actions/upload-artifact@v4.6.2
        with:
          name: batch2-test-results
          path: test-results
          retention-days: 90

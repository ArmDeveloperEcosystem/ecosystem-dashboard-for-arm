name: Test Mesa on Arm64
permissions:
  contents: read

on:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-mesa.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-mesa.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-mesa.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-mesa.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-mesa.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-mesa.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-mesa.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-mesa.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-mesa.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-mesa.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-mesa.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-mesa.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-mesa.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-mesa.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-mesa.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-mesa.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-mesa.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-mesa.outputs.regression_next_installed_version }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-mesa.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-mesa.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-mesa.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-mesa.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-mesa.outputs.timestamp }}
jobs:
  test-mesa:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'Mesa'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # original: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=mesa" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/linux/opensource_packages/mesa" >> "$GITHUB_OUTPUT"
      - name: Install Python Mesa from PyPI
        id: install
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local RC="$1"
            trap - EXIT
            if [ "$RC" -eq 0 ]; then
              echo "install_status=success" >> "$GITHUB_OUTPUT"
            else
              echo "install_status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap 'finish "$?"' EXIT
          sudo timeout --kill-after=10s 180s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo timeout --kill-after=10s 180s apt-get install -y --no-install-recommends python3-venv
          VENV=$(mktemp -d "$RUNNER_TEMP/mesa-venv.XXXXXX")
          timeout --kill-after=5s 60s python3 -I -m venv "$VENV"
          # Mesa imports its network-space module during package import.
          timeout --kill-after=10s 300s "$VENV/bin/python" -I -m pip --isolated install --index-url https://pypi.org/simple --only-binary=:all: --disable-pip-version-check --no-input --retries 2 --timeout 30 'mesa[network]'
          echo "MESA_PYTHON=$VENV/bin/python" >> "$GITHUB_ENV"
          finish 0

      - name: Get owned Python Mesa version
        id: version
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local RC="$1"
            trap - EXIT
            if [ "$RC" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap 'finish "$?"' EXIT
          [ "${{ steps.install.outputs.install_status }}" = success ]
          VERSION=$(timeout --kill-after=5s 30s "$MESA_PYTHON" -I - <<'PY'
          import importlib.metadata as metadata
          import inspect
          import os
          from pathlib import Path
          import re
          import sys
          import mesa

          dist = metadata.distribution("mesa")
          assert dist.metadata["Name"].lower() == "mesa", "Wrong distribution name"
          version = dist.version
          assert re.fullmatch(r"[0-9]+(?:\.[0-9]+){1,3}(?:(?:a|b|rc)[0-9]+)?(?:\.post[0-9]+)?(?:\.dev[0-9]+)?", version or ""), "Invalid Mesa version"
          assert mesa.__version__ == version, "Import/distribution version mismatch"
          assert dist.files, "Missing Mesa installation records"
          owned = {Path(dist.locate_file(item)).resolve() for item in dist.files}
          for path in (mesa.__file__, inspect.getfile(mesa.Model), inspect.getfile(mesa.Agent)):
              assert Path(path).resolve() in owned, "Imported Mesa code is not owned by distribution"
              print(f"Mesa owns {Path(path).resolve()}", file=sys.stderr)
          assert {"mesa"} == {name.lower() for name in metadata.packages_distributions().get("mesa", [])}, "Ambiguous Mesa import owner"
          if "EXPECTED_MESA_VERSION" in os.environ:
              assert os.environ["EXPECTED_MESA_VERSION"] == version, "Missing or changed Mesa baseline"
          print(version)
          PY
          )
          if [[ "$VERSION" == *$'\n'* || "$VERSION" == *$'\r'* ]] || \
             ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}((a|b|rc)[0-9]+)?(\.post[0-9]+)?(\.dev[0-9]+)?$ ]]; then
            finish 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          finish 0

      - name: Test 1 - Import Mesa and register an agent
        id: test1
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local RC="$1"
            trap - EXIT
            if [ "$RC" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap 'finish "$?"' EXIT
          [ "${{ steps.install.outputs.install_status }}" = success ]
          [ "${{ steps.version.outputs.status }}" = passed ]
          timeout --kill-after=5s 30s "$MESA_PYTHON" -I - <<'PY'
          import mesa

          model = mesa.Model(seed=7)
          agent = mesa.Agent(model)
          assert agent.model is model, "Agent has wrong model"
          assert isinstance(agent.unique_id, int) and agent.unique_id > 0, "Invalid agent ID"
          assert len(model.agents) == 1 and agent in model.agents, "Agent registration failed"
          agent.remove()
          assert len(model.agents) == 0, "Agent removal failed"
          print("Mesa import, agent registration and removal passed")
          PY
          finish 0

      - name: Test 2 - Verify distribution ownership and baseline version
        id: test2
        if: always()
        continue-on-error: true
        env:
          EXPECTED_MESA_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local RC="$1"
            trap - EXIT
            if [ "$RC" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap 'finish "$?"' EXIT
          [ "${{ steps.install.outputs.install_status }}" = success ]
          [ "${{ steps.version.outputs.status }}" = passed ]
          VERSION=$(timeout --kill-after=5s 30s "$MESA_PYTHON" -I - <<'PY'
          import importlib.metadata as metadata
          import inspect
          import os
          from pathlib import Path
          import re
          import sys
          import mesa

          dist = metadata.distribution("mesa")
          assert dist.metadata["Name"].lower() == "mesa", "Wrong distribution name"
          version = dist.version
          assert re.fullmatch(r"[0-9]+(?:\.[0-9]+){1,3}(?:(?:a|b|rc)[0-9]+)?(?:\.post[0-9]+)?(?:\.dev[0-9]+)?", version or ""), "Invalid Mesa version"
          assert mesa.__version__ == version, "Import/distribution version mismatch"
          assert dist.files, "Missing Mesa installation records"
          owned = {Path(dist.locate_file(item)).resolve() for item in dist.files}
          for path in (mesa.__file__, inspect.getfile(mesa.Model), inspect.getfile(mesa.Agent)):
              assert Path(path).resolve() in owned, "Imported Mesa code is not owned by distribution"
              print(f"Mesa owns {Path(path).resolve()}", file=sys.stderr)
          assert {"mesa"} == {name.lower() for name in metadata.packages_distributions().get("mesa", [])}, "Ambiguous Mesa import owner"
          if "EXPECTED_MESA_VERSION" in os.environ:
              assert os.environ["EXPECTED_MESA_VERSION"] == version, "Missing or changed Mesa baseline"
          print(version)
          PY
          )
          if [[ "$VERSION" == *$'\n'* || "$VERSION" == *$'\r'* ]] || \
             ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}((a|b|rc)[0-9]+)?(\.post[0-9]+)?(\.dev[0-9]+)?$ ]]; then
            finish 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "installed_version=$VERSION" >> "$GITHUB_OUTPUT"
          finish 0

      - name: Test 3 - Verify pip installation and dependencies
        id: test3
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local RC="$1"
            trap - EXIT
            if [ "$RC" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap 'finish "$?"' EXIT
          [ "${{ steps.install.outputs.install_status }}" = success ]
          [ "${{ steps.version.outputs.status }}" = passed ]
          timeout --kill-after=5s 30s "$MESA_PYTHON" -I -m pip check
          timeout --kill-after=5s 30s "$MESA_PYTHON" -I - <<'PY'
          from importlib.metadata import distribution

          dist = distribution("mesa")
          assert (dist.read_text("INSTALLER") or "").strip() == "pip", "Mesa was not installed by pip"
          assert dist.read_text("direct_url.json") is None, "Expected Mesa from the PyPI index"
          print("Mesa pip installation and dependency checks passed")
          PY
          finish 0

      - name: Test 4 - Verify native Arm64 Python
        id: test4
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local RC="$1"
            trap - EXIT
            if [ "$RC" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap 'finish "$?"' EXIT
          [ "${{ steps.install.outputs.install_status }}" = success ]
          [ "${{ steps.version.outputs.status }}" = passed ]
          [ "$(uname -m)" = aarch64 ]
          timeout --kill-after=5s 30s "$MESA_PYTHON" -I - <<'PY'
          import platform
          import struct
          import sys

          assert sys.platform == "linux", "Expected Linux"
          assert platform.machine() == "aarch64", "Expected aarch64 runtime"
          assert struct.calcsize("P") == 8, "Expected 64-bit Python"
          with open(sys.executable, "rb") as executable:
              header = executable.read(20)
          assert header[:6] == b"\x7fELF\x02\x01", "Expected ELF64 little-endian Python"
          assert int.from_bytes(header[18:20], "little") == 183, "Python executable is not AArch64"
          print("Native Linux AArch64 Python verified")
          PY
          finish 0

      - name: Test 5 - Run deterministic Mesa model
        id: test5
        if: always()
        continue-on-error: true
        env:
          EXPECTED_MESA_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local RC="$1"
            trap - EXIT
            if [ "$RC" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap 'finish "$?"' EXIT
          [ "${{ steps.install.outputs.install_status }}" = success ]
          [ "${{ steps.version.outputs.status }}" = passed ]
          [ "$(uname -m)" = aarch64 ]
          timeout --kill-after=5s 30s "$MESA_PYTHON" -I - <<'PY'
          import importlib.metadata as metadata
          import inspect
          import os
          from pathlib import Path
          import re
          import sys
          import mesa

          dist = metadata.distribution("mesa")
          assert dist.metadata["Name"].lower() == "mesa", "Wrong distribution name"
          version = dist.version
          assert re.fullmatch(r"[0-9]+(?:\.[0-9]+){1,3}(?:(?:a|b|rc)[0-9]+)?(?:\.post[0-9]+)?(?:\.dev[0-9]+)?", version or ""), "Invalid Mesa version"
          assert mesa.__version__ == version, "Import/distribution version mismatch"
          assert dist.files, "Missing Mesa installation records"
          owned = {Path(dist.locate_file(item)).resolve() for item in dist.files}
          for path in (mesa.__file__, inspect.getfile(mesa.Model), inspect.getfile(mesa.Agent)):
              assert Path(path).resolve() in owned, "Imported Mesa code is not owned by distribution"
              print(f"Mesa owns {Path(path).resolve()}", file=sys.stderr)
          assert {"mesa"} == {name.lower() for name in metadata.packages_distributions().get("mesa", [])}, "Ambiguous Mesa import owner"
          if "EXPECTED_MESA_VERSION" in os.environ:
              assert os.environ["EXPECTED_MESA_VERSION"] == version, "Missing or changed Mesa baseline"
          import platform
          import struct
          import sys

          assert sys.platform == "linux", "Expected Linux"
          assert platform.machine() == "aarch64", "Expected aarch64 runtime"
          assert struct.calcsize("P") == 8, "Expected 64-bit Python"
          with open(sys.executable, "rb") as executable:
              header = executable.read(20)
          assert header[:6] == b"\x7fELF\x02\x01", "Expected ELF64 little-endian Python"
          assert int.from_bytes(header[18:20], "little") == 183, "Python executable is not AArch64"

          class CounterAgent(mesa.Agent):
              def __init__(self, model, initial):
                  super().__init__(model)
                  self.value = initial
                  self.activations = 0

              def step(self):
                  self.value += 2
                  self.activations += 1
                  self.model.order.append(self.unique_id)

          class CounterModel(mesa.Model):
              def __init__(self):
                  super().__init__(seed=42)
                  self.order = []
                  for initial in range(4):
                      CounterAgent(self, initial)

              def step(self):
                  self.agents.shuffle_do("step")

          traces = []
          for repeat in range(2):
              model = CounterModel()
              agents = list(model.agents)
              ids = {agent.unique_id for agent in agents}
              assert len(agents) == len(ids) == 4, "Expected four distinct registered agents"
              assert model.steps == 0, "Incorrect initial model step"
              assert [agent.value for agent in agents] == [0, 1, 2, 3], "Incorrect initial state"
              trace = []
              for tick in range(1, 4):
                  model.order.clear()
                  model.step()
                  values = [agent.value for agent in agents]
                  assert model.steps == tick, "Model step did not advance"
                  assert values == [initial + 2 * tick for initial in range(4)], "Incorrect agent state"
                  assert sum(values) == 6 + 8 * tick, "Incorrect model total"
                  assert all(agent.activations == tick for agent in agents), "Incorrect activation count"
                  assert len(model.agents) == 4 and set(model.order) == ids and len(model.order) == 4, "Agents not activated exactly once"
                  trace.append((list(model.order), values))
              traces.append(trace)
          assert traces[0] == traces[1], "Seeded model is not deterministic"
          print(f"Mesa {version}: two seeded models, three steps, four agents; final values={traces[0][-1][1]}")
          PY
          finish 0

      - name: Regression applicability - package manager installed
        id: test6
        if: always()
        env:
          CURRENT: ${{ steps.version.outputs.version || 'unknown' }}
        run: |
          set -euo pipefail
          echo "current_version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest_version=not_applicable" >> "$GITHUB_OUTPUT"
          echo "next_installed_version=not_applicable" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.install.outcome }}" != success ] || [ "${{ steps.install.outputs.install_status }}" != success ]; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "decision=baseline_install_failed" >> "$GITHUB_OUTPUT"
            echo "regression_result=Regression skipped: the Python Mesa pip installation failed." >> "$GITHUB_OUTPUT"
            echo "comparison=No valid installed baseline is available for comparison." >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.version.outcome }}" = success ] && [ "${{ steps.version.outputs.status }}" = passed ] && \
               [ -n "${{ steps.version.outputs.version }}" ] && \
               [ "${{ steps.test1.outcome }}" = success ] && [ "${{ steps.test1.outputs.status }}" = passed ] && \
               [ "${{ steps.test2.outcome }}" = success ] && [ "${{ steps.test2.outputs.status }}" = passed ] && \
               [ "${{ steps.test3.outcome }}" = success ] && [ "${{ steps.test3.outputs.status }}" = passed ] && \
               [ "${{ steps.test4.outcome }}" = success ] && [ "${{ steps.test4.outputs.status }}" = passed ] && \
               [ "${{ steps.test5.outcome }}" = success ] && [ "${{ steps.test5.outputs.status }}" = passed ]; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "decision=not_applicable_package_manager" >> "$GITHUB_OUTPUT"
            echo "regression_result=Regression validation not applicable: Python Mesa is installed from PyPI using pip in Tests 1-5" >> "$GITHUB_OUTPUT"
            echo "comparison=The baseline uses the pip package manager; no next-version artifact was installed or compared." >> "$GITHUB_OUTPUT"
          else
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "decision=baseline_failed" >> "$GITHUB_OUTPUT"
            echo "regression_result=Regression skipped: Python Mesa baseline validation failed." >> "$GITHUB_OUTPUT"
            echo "comparison=Version detection and all five core checks must pass before a baseline can be compared." >> "$GITHUB_OUTPUT"
          fi
          echo "duration=0" >> "$GITHUB_OUTPUT"

      - name: Calculate test summary
        if: always()
        id: summary
        run: |
          set -euo pipefail
          PASSED=0
          FAILED=0
          SKIPPED=0
          TOTAL_DURATION=0

          if [ "${{ steps.test1.outcome }}" = "success" ] && [ "${{ steps.test1.outputs.status }}" = "passed" ]; then
            PASSED=$((PASSED + 1))
          else
            FAILED=$((FAILED + 1))
          fi
          TOTAL_DURATION=$((TOTAL_DURATION + ${{ steps.test1.outputs.duration || 0 }}))

          if [ "${{ steps.test2.outcome }}" = "success" ] && [ "${{ steps.test2.outputs.status }}" = "passed" ]; then
            PASSED=$((PASSED + 1))
          else
            FAILED=$((FAILED + 1))
          fi
          TOTAL_DURATION=$((TOTAL_DURATION + ${{ steps.test2.outputs.duration || 0 }}))

          if [ "${{ steps.test3.outcome }}" = "success" ] && [ "${{ steps.test3.outputs.status }}" = "passed" ]; then
            PASSED=$((PASSED + 1))
          else
            FAILED=$((FAILED + 1))
          fi
          TOTAL_DURATION=$((TOTAL_DURATION + ${{ steps.test3.outputs.duration || 0 }}))

          if [ "${{ steps.test4.outcome }}" = "success" ] && [ "${{ steps.test4.outputs.status }}" = "passed" ]; then
            PASSED=$((PASSED + 1))
          else
            FAILED=$((FAILED + 1))
          fi
          TOTAL_DURATION=$((TOTAL_DURATION + ${{ steps.test4.outputs.duration || 0 }}))

          if [ "${{ steps.test5.outcome }}" = "success" ] && [ "${{ steps.test5.outputs.status }}" = "passed" ]; then
            PASSED=$((PASSED + 1))
          else
            FAILED=$((FAILED + 1))
          fi
          TOTAL_DURATION=$((TOTAL_DURATION + ${{ steps.test5.outputs.duration || 0 }}))

          CORE_FAILED=$FAILED
          EXPECTED_DECISION=not_applicable_package_manager
          if [ "${{ steps.install.outcome }}" != success ] || [ "${{ steps.install.outputs.install_status }}" != success ]; then
            EXPECTED_DECISION=baseline_install_failed
          elif [ "$CORE_FAILED" -gt 0 ] || [ "${{ steps.version.outcome }}" != success ] || \
               [ "${{ steps.version.outputs.status }}" != passed ] || [ -z "${{ steps.version.outputs.version }}" ]; then
            EXPECTED_DECISION=baseline_failed
          fi
          if [ "${{ steps.test6.outcome }}" = "success" ] && \
             [ "${{ steps.test6.outputs.status }}" = "skipped" ] && \
             [ "${{ steps.test6.outputs.decision }}" = "$EXPECTED_DECISION" ] && \
             { [ "$CORE_FAILED" -gt 0 ] || [ "$EXPECTED_DECISION" = not_applicable_package_manager ]; }; then
            SKIPPED=$((SKIPPED + 1))
          else
            FAILED=$((FAILED + 1))
          fi
          TOTAL_DURATION=$((TOTAL_DURATION + ${{ steps.test6.outputs.duration || 0 }}))

          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "core_failed=$CORE_FAILED" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
          echo "duration=$TOTAL_DURATION" >> "$GITHUB_OUTPUT"
          if [ "$FAILED" -eq 0 ]; then
            echo "overall_status=success" >> "$GITHUB_OUTPUT"
            echo "badge_status=passing" >> "$GITHUB_OUTPUT"
          else
            echo "overall_status=failure" >> "$GITHUB_OUTPUT"
            echo "badge_status=failing" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Create test summary
        if: always()
        run: |
          echo "## Mesa Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** ${{ steps.version.outputs.version || 'unknown' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status:** ${{ steps.summary.outputs.overall_status || 'failure' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tests Passed:** ${{ steps.summary.outputs.passed || 0 }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tests Failed:** ${{ steps.summary.outputs.failed || 0 }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tests Skipped:** ${{ steps.summary.outputs.skipped || 0 }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Duration:** ${{ steps.summary.outputs.duration || 0 }}s" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Runner:** ubuntu-24.04 (arm64)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Test Details" >> "$GITHUB_STEP_SUMMARY"
          echo "1. Test 1 - Import Mesa and register an agent: ${{ steps.test1.outputs.status || 'failed' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "2. Test 2 - Verify distribution ownership and baseline version: ${{ steps.test2.outputs.status || 'failed' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "3. Test 3 - Verify pip installation and dependencies: ${{ steps.test3.outputs.status || 'failed' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "4. Test 4 - Verify native Arm64 Python: ${{ steps.test4.outputs.status || 'failed' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "5. Test 5 - Run deterministic Mesa model: ${{ steps.test5.outputs.status || 'failed' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "6. Package-manager regression applicability: ${{ steps.test6.outputs.status || 'failed' }}" >> "$GITHUB_STEP_SUMMARY"

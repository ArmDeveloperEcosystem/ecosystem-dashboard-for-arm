name: Test Robot Framework on Arm64

# This is a TEMPLATE - it has no triggers and will not run.
# When you copy this file, uncomment the appropriate triggers below:
permissions:
  contents: read

on:
  # workflow_dispatch:  # Uncomment for manual testing
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-robot-framework.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-robot-framework.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-robot-framework.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-robot-framework.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-robot-framework.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-robot-framework.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-robot-framework.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-robot-framework.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-robot-framework.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-robot-framework.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-robot-framework.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-robot-framework.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-robot-framework.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-robot-framework.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-robot-framework.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-robot-framework.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-robot-framework.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-robot-framework.outputs.regression_next_installed_version }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-robot-framework.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-robot-framework.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-robot-framework.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-robot-framework.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-robot-framework.outputs.timestamp }}
jobs:
  test-robot-framework:
    runs-on: ubuntu-24.04-arm
    env:
      ROBOT_VERSION_PROBE: |
        import importlib.metadata as metadata
        from pathlib import Path
        import re
        import subprocess
        import sys

        import robot
        from robot.version import get_full_version

        cli = Path(sys.argv[1]).resolve(strict=True)
        distribution = metadata.distribution("robotframework")
        version = distribution.version
        if distribution.metadata["Name"] != "robotframework" or not re.fullmatch(
            r"[0-9]+(\.[0-9]+)+((a|b|rc|\.dev)[0-9]+)?", version or ""
        ):
            raise SystemExit("Invalid Robot Framework distribution identity/version")
        if robot.__version__ != version:
            raise SystemExit("Robot Framework package/distribution version mismatch")

        # Both the imported package and the selected CLI must belong to this installation.
        files = distribution.files or ()
        owned = {Path(distribution.locate_file(file)).resolve() for file in files}
        module = Path(distribution.locate_file("robot/__init__.py")).resolve()
        if cli not in owned or module not in owned or Path(robot.__file__).resolve() != module:
            raise SystemExit("Robot Framework package/CLI installation mismatch")
        entry_points = [entry for entry in distribution.entry_points
                        if entry.group == "console_scripts" and entry.name == "robot"]
        if len(entry_points) != 1 or entry_points[0].value != "robot:run_cli" or entry_points[0].load() is not robot.run_cli:
            raise SystemExit("Invalid Robot Framework CLI entry point")

        result = subprocess.run([str(cli), "--version", "--nostatusrc"],
                                check=True, capture_output=True, text=True, timeout=15)
        if result.stderr or result.stdout != get_full_version("Robot Framework") + "\n":
            raise SystemExit("Robot Framework CLI/package version banner mismatch")
        print(version)
    
    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'Robot Framework'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false
      
      - name: Set test metadata
        id: metadata
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=robot-framework" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/opensource_packages/robot-framework" >> "$GITHUB_OUTPUT"
      - name: Install Robot Framework
        id: install
        run: |
          echo "Installing Robot Framework..."
          
          bash .github/actions/apt-bootstrap/bootstrap.sh --packages "python3-pip python3-venv"
          # Use a virtual environment or --break-system-packages for Ubuntu 24.04
          pip install --break-system-packages robotframework
          
          if command -v robot &> /dev/null; then
            echo "Robot Framework installed successfully"
            echo "install_status=success" >> $GITHUB_OUTPUT
          else
            echo "Robot Framework installation failed"
            echo "install_status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi
      
      - name: Get Robot Framework version
        id: version
        run: |
          set -euo pipefail
          ROBOT_CLI=$(command -v robot)
          # Query metadata with the interpreter used by the installed console script.
          ROBOT_PYTHON=$(sed -n '1s/^#!//p' "$ROBOT_CLI")
          test -n "$ROBOT_PYTHON"
          test -x "$ROBOT_PYTHON"
          VERSION=$("$ROBOT_PYTHON" -c "$ROBOT_VERSION_PROBE" "$ROBOT_CLI")
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)+((a|b|rc|\.dev)[0-9]+)?$ ]]; then
            echo "Invalid Robot Framework version probe output" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected Robot Framework version: $VERSION"
      
      - name: Test 1 - Check robot binary exists
        id: test1
        continue-on-error: true
        run: |
          START_TIME=$(date +%s)
          
          if command -v robot &> /dev/null; then
            echo "✓ robot binary found"
            echo "status=passed" >> $GITHUB_OUTPUT
          else
            echo "✗ robot binary not found"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT
      
      - name: Test 2 - Check installed Robot Framework identity and version
        id: test2
        continue-on-error: true
        env:
          EXPECTED_ROBOT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local rc="$1"
            trap - EXIT
            if [ "$rc" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish "$?"' EXIT
          test -n "$EXPECTED_ROBOT_VERSION"
          ROBOT_CLI=$(command -v robot)
          ROBOT_PYTHON=$(sed -n '1s/^#!//p' "$ROBOT_CLI")
          test -n "$ROBOT_PYTHON"
          test -x "$ROBOT_PYTHON"
          VERSION=$("$ROBOT_PYTHON" -c "$ROBOT_VERSION_PROBE" "$ROBOT_CLI")
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)+((a|b|rc|\.dev)[0-9]+)?$ ]]; then
            echo "Invalid Robot Framework version probe output" >&2
            exit 1
          fi
          test "$VERSION" = "$EXPECTED_ROBOT_VERSION"
          echo "Verified installed Robot Framework version: $VERSION"
          echo "installed_version=$VERSION" >> "$GITHUB_OUTPUT"
          finish 0
      
      - name: Test 3 - Check robot help output
        id: test3
        continue-on-error: true
        run: |
          START_TIME=$(date +%s)
          
          if robot --help --nostatusrc 2>&1 | grep -qi "usage\|help\|options"; then
            echo "✓ robot help command works"
            echo "status=passed" >> $GITHUB_OUTPUT
          else
            echo "✗ robot help command failed"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT
      
      # Add more tests as needed (test4, test5, etc.)
      # Examples:
      # - Run a simple command
      # - Check configuration files
      # - Start/stop a service
      # - Test basic functionality
      
      # ============================================================
      # UPDATE THIS: Calculate summary based on your number of tests
      # Add/remove test result checks to match your tests above
      # ============================================================
      
      - name: Test 4 - Architecture Verification
        id: test4
        continue-on-error: true
        run: |
          START_TIME=$(date +%s)
          
          echo "Checking system architecture..."
          ARCH=$(uname -m)
          if [ "$ARCH" = "aarch64" ]; then
            echo "✓ System architecture is ARM64 ($ARCH)"
            echo "status=passed" >> $GITHUB_OUTPUT
          else
            echo "✗ System architecture is NOT ARM64 ($ARCH)"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT

      - name: Test 5 - Functional Validation (Real Test Execution)
        id: test5
        continue-on-error: true
        run: |
          START_TIME=$(date +%s)
          
          echo "Creating a simple Robot Framework test file..."
          cat > smoke_test.robot << EOF
          *** Settings ***
          Documentation     Simple smoke test for Robot Framework
          
          *** Test Cases ***
          ARM64 Arithmetic Check
              \${result} =    Evaluate    1 + 1
              Should Be Equal As Integers    \${result}    2
          EOF
          
          echo "Executing the test case..."
          if robot --outputdir results smoke_test.robot; then
            echo "✓ Robot Framework test execution passed"
            echo "status=passed" >> $GITHUB_OUTPUT
          else
            echo "✗ Robot Framework test execution failed"
            cat results/log.html || true
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT

      - name: Regression applicability - package manager installed
        id: test6
        if: always()
        env:
          CURRENT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          CURRENT="${CURRENT_VERSION:-unknown}"
          echo "current_version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest_version=not_applicable" >> "$GITHUB_OUTPUT"
          echo "next_installed_version=not_applicable" >> "$GITHUB_OUTPUT"
          core_passed() {
            [ "$1" = passed ] && [ "$2" = success ] && [[ "$3" =~ ^[0-9]{1,6}$ ]]
          }
          if [ "${{ steps.install.outcome }}" != success ] || [ "${{ steps.install.outputs.install_status }}" != success ]; then
            echo "decision=baseline_install_failed" >> "$GITHUB_OUTPUT"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "regression_result=Regression skipped: Robot Framework package installation did not succeed." >> "$GITHUB_OUTPUT"
            echo "comparison=No successfully installed baseline is available for comparison." >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.version.outcome }}" = success ] &&
               [[ "$CURRENT" =~ ^[0-9]+(\.[0-9]+)+((a|b|rc|\.dev)[0-9]+)?$ ]] &&
               core_passed "${{ steps.test1.outputs.status }}" "${{ steps.test1.outcome }}" "${{ steps.test1.outputs.duration }}" &&
               core_passed "${{ steps.test2.outputs.status }}" "${{ steps.test2.outcome }}" "${{ steps.test2.outputs.duration }}" &&
               core_passed "${{ steps.test3.outputs.status }}" "${{ steps.test3.outcome }}" "${{ steps.test3.outputs.duration }}" &&
               core_passed "${{ steps.test4.outputs.status }}" "${{ steps.test4.outcome }}" "${{ steps.test4.outputs.duration }}" &&
               core_passed "${{ steps.test5.outputs.status }}" "${{ steps.test5.outcome }}" "${{ steps.test5.outputs.duration }}"; then
            echo "decision=not_applicable_package_manager" >> "$GITHUB_OUTPUT"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "regression_result=Regression validation not applicable: tested package installed via package manager in Tests 1-5" >> "$GITHUB_OUTPUT"
            echo "comparison=The tested package is installed via a package manager in Tests 1-5, so version-to-version regression validation is not shown under the current policy." >> "$GITHUB_OUTPUT"
          else
            echo "decision=baseline_failed" >> "$GITHUB_OUTPUT"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "regression_result=Regression skipped: Robot Framework baseline validation did not succeed." >> "$GITHUB_OUTPUT"
            echo "comparison=All five core checks and the baseline version must be valid before a baseline can be compared." >> "$GITHUB_OUTPUT"
          fi
          echo "duration=0" >> "$GITHUB_OUTPUT"

      - name: Calculate test summary
        if: always()
        id: summary
        env:
          CURRENT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          PASSED=0
          FAILED=0
          SKIPPED=0
          TOTAL_DURATION=0
          check_core() {
            local status="$1" outcome="$2" duration="$3"
            if [[ "$duration" =~ ^[0-9]{1,6}$ ]]; then
              TOTAL_DURATION=$((TOTAL_DURATION + 10#$duration))
            else
              status=failed
            fi
            if [ "$status" = passed ] && [ "$outcome" = success ]; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
            fi
          }
          check_core "${{ steps.test1.outputs.status }}" "${{ steps.test1.outcome }}" "${{ steps.test1.outputs.duration }}"
          check_core "${{ steps.test2.outputs.status }}" "${{ steps.test2.outcome }}" "${{ steps.test2.outputs.duration }}"
          check_core "${{ steps.test3.outputs.status }}" "${{ steps.test3.outcome }}" "${{ steps.test3.outputs.duration }}"
          check_core "${{ steps.test4.outputs.status }}" "${{ steps.test4.outcome }}" "${{ steps.test4.outputs.duration }}"
          check_core "${{ steps.test5.outputs.status }}" "${{ steps.test5.outcome }}" "${{ steps.test5.outputs.duration }}"
          CORE_FAILED=$FAILED
          DURATION6="${{ steps.test6.outputs.duration }}"
          EXPECTED_DECISION=not_applicable_package_manager
          if [ "${{ steps.install.outcome }}" != success ] || [ "${{ steps.install.outputs.install_status }}" != success ]; then
            EXPECTED_DECISION=baseline_install_failed
          elif [ "$CORE_FAILED" -gt 0 ] || [ "${{ steps.version.outcome }}" != success ] ||
               ! [[ "$CURRENT_VERSION" =~ ^[0-9]+(\.[0-9]+)+((a|b|rc|\.dev)[0-9]+)?$ ]]; then
            EXPECTED_DECISION=baseline_failed
          fi
          if [ "${{ steps.test6.outputs.status }}" = skipped ] &&
             [ "${{ steps.test6.outputs.decision }}" = "$EXPECTED_DECISION" ] &&
             { { [ "$CORE_FAILED" -eq 0 ] && [ "$EXPECTED_DECISION" = not_applicable_package_manager ]; } ||
               { [ "$CORE_FAILED" -gt 0 ] && [ "$EXPECTED_DECISION" != not_applicable_package_manager ]; }; } &&
             [ "${{ steps.test6.outcome }}" = success ] &&
             [[ "$DURATION6" =~ ^[0-9]{1,6}$ ]]; then
            SKIPPED=1
          else
            FAILED=$((FAILED + 1))
          fi
          if [[ "$DURATION6" =~ ^[0-9]{1,6}$ ]]; then
            TOTAL_DURATION=$((TOTAL_DURATION + 10#$DURATION6))
          fi
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
          echo "core_failed=$CORE_FAILED" >> "$GITHUB_OUTPUT"
          echo "duration=$TOTAL_DURATION" >> "$GITHUB_OUTPUT"
          if [ "$FAILED" -eq 0 ]; then
            echo "overall_status=success" >> "$GITHUB_OUTPUT"
            echo "badge_status=passing" >> "$GITHUB_OUTPUT"
          else
            echo "overall_status=failure" >> "$GITHUB_OUTPUT"
            echo "badge_status=failing" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Create test summary
        if: always()
        run: |
          echo "## Robot Framework Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ steps.summary.outputs.overall_status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests Passed:** ${{ steps.summary.outputs.passed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests Failed:** ${{ steps.summary.outputs.failed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests Skipped:** ${{ steps.summary.outputs.skipped }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Core Failed:** ${{ steps.summary.outputs.core_failed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Duration:** ${{ steps.summary.outputs.duration || 0 }}s" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner:** ubuntu-24.04 (arm64)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Details" >> $GITHUB_STEP_SUMMARY
          echo "1. Check robot-framework binary exists: ${{ steps.test1.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "2. Check robot-framework version command: ${{ steps.test2.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "3. Check robot-framework help output: ${{ steps.test3.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY

          echo "4. Test 4 - Architecture Verification: ${{ steps.test4.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "5. Test 5 - Functional Validation: ${{ steps.test5.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "6. Package manager regression applicability: ${{ steps.test6.outputs.status }} (${{ steps.test6.outputs.decision }})" >> $GITHUB_STEP_SUMMARY

name: Conversational search PoC

on:
  pull_request:
    paths:
      - 'poc/**'
      - 'assets/**'
      - 'layouts/**'
      - 'themes/arm-design-system-hugo-theme/**'
      - 'content/linux/**'
      - 'content/windows/**'
      - 'data/**'
      - 'config.toml'
      - '.github/workflows/conversational-search-poc-ci.yml'
      - '.github/workflows/search-staging-preflight.yml'

permissions:
  contents: read

concurrency:
  group: conversational-search-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  search-contract:
    name: Conversational search regression tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      # Unit tests use controlled KB evidence. Do not call the live corpus in CI.
      ARM_KB_SEARCH_URL: http://127.0.0.1:9
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out candidate without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Record tested revision
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p .poc/ci-results
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          Path('.poc/ci-results/revision.json').write_text(json.dumps({
              'pr_head_sha': os.environ['PR_HEAD_SHA'],
              'tested_merge_sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
          }, indent=2) + '\n')
          PY

      - name: Install checksum-pinned Hugo
        shell: bash
        env:
          HUGO_VERSION: '0.130.0'
          HUGO_ARM64_ARCHIVE_SHA256: 025785b56d6217d2528ad8782680332851acae0d78cc9f86a27f8e03ec1afa3c
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          archive="hugo_extended_${HUGO_VERSION}_linux-arm64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          install_dir="${RUNNER_TEMP}/search-poc-hugo"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "$archive_path" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${archive}"
          printf '%s  %s\n' "$HUGO_ARM64_ARCHIVE_SHA256" "$archive_path" \
            | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xzf "$archive_path" -C "$install_dir" hugo
          chmod 0755 "$install_dir/hugo"
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

      - name: Install search-only dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          python3 -m venv "$RUNNER_TEMP/search-poc-venv"
          "$RUNNER_TEMP/search-poc-venv/bin/python" -m pip install \
            --disable-pip-version-check -r poc/requirements.lock.txt
          "$RUNNER_TEMP/search-poc-venv/bin/python" -m pip check
          printf '%s\n' "$RUNNER_TEMP/search-poc-venv/bin" >> "$GITHUB_PATH"

      - name: Build dashboard and exact catalog
        run: hugo --config config.toml,poc/config.local.toml --destination .poc/public

      - name: Install nginx for staging routing checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y nginx
          nginx -v

      - name: Test scoped identity, HTTP integration and API boundaries
        run: python -m pytest poc/tests -q --junitxml=.poc/ci-results/python-tests.xml

      - name: Test browser interaction contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=tap poc/tests/ui_search.test.cjs \
            | tee .poc/ci-results/javascript-tests.tap

      - name: Validate staging systemd service on the ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          test ! -e /opt/arm-dashboard-search
          trap 'sudo systemctl stop arm-dashboard-search.service || true' EXIT
          sudo install -d /opt/arm-dashboard-search/current/poc /opt/arm-dashboard-search/current/site /etc/arm-dashboard-search
          sudo cp -a "$RUNNER_TEMP/search-poc-venv" /opt/arm-dashboard-search/current/.venv
          sudo cp poc/*.py /opt/arm-dashboard-search/current/poc/
          sudo cp .poc/public/poc-catalog.json /opt/arm-dashboard-search/current/site/
          sudo install -m 0600 poc/deploy/staging.env.example /etc/arm-dashboard-search/staging.env
          sudo install -m 0644 poc/deploy/arm-dashboard-search.service /etc/systemd/system/
          sudo systemd-analyze verify /etc/systemd/system/arm-dashboard-search.service
          sudo systemctl daemon-reload
          sudo systemctl start arm-dashboard-search.service
          python - <<'PY'
          import json, time, urllib.error, urllib.request
          origin = "https://d1jmgdpytvgwdc.cloudfront.net"
          headers = {"Host": origin.split("//", 1)[1]}
          ready = urllib.request.Request("http://127.0.0.1:8080/api/ready", headers=headers)
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(ready, timeout=1) as response:
                      body = json.load(response)
                  assert body["catalog_count"] > 0 and body["scope_configured"] is False
                  break
              except urllib.error.URLError:
                  time.sleep(0.2)
          else:
              raise SystemExit("Staging systemd service did not become ready")
          request = urllib.request.Request("http://127.0.0.1:8080/api/search",
              data=b'{"query":"fixture"}', headers={**headers, "Origin": origin,
                  "Content-Type": "application/json"})
          try:
              urllib.request.urlopen(request, timeout=3)
          except urllib.error.HTTPError as response:
              assert response.code == 503 and json.load(response)["mode"] == "kb_unavailable"
          else:
              raise SystemExit("Scope-disabled service unexpectedly allowed KB retrieval")
          print("Staging systemd startup, catalog loading and scope gate passed")
          PY

      - name: Build production-path catalog and API image
        run: |
          hugo --config config.toml,poc/deploy/config.production.toml \
            --baseURL https://developer.arm.com/ecosystem-dashboard/ \
            --destination .poc/public
          docker build -f poc/deploy/Dockerfile -t arm-dashboard-search:ci .

      - name: Exercise nonroot API image with production settings
        run: |
          python poc/deploy/smoke.py --image arm-dashboard-search:ci \
            --output .poc/ci-results/container-smoke.json

      - name: Attach controlled test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conversational-search-${{ github.event.pull_request.head.sha }}
          retention-days: 30
          if-no-files-found: warn
          # Only these controlled reports are uploaded, never the whole .poc directory.
          include-hidden-files: true
          path: |
            .poc/ci-results/revision.json
            .poc/ci-results/python-tests.xml
            .poc/ci-results/javascript-tests.tap
            .poc/ci-results/container-smoke.json

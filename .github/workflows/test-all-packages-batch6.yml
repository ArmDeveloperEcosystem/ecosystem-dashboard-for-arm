name: Test All Packages (Batch 6) on Arm64
run-name: Arm64 Batch 6 [${{ inputs.orchestration_id || format('manual-{0}-{1}', github.run_id, github.run_attempt) }}] [nonce:${{ inputs.dispatch_nonce || 'manual-only' }}]

on:
  workflow_dispatch:
    inputs:
      orchestration_id:
        description: Exact orchestrator identity; blank uses a safe manual fallback
        required: false
        default: ""
        type: string
      dispatch_nonce:
        description: Secret exact-dispatch nonce; blank is manual-only and not publishable
        required: false
        default: ""
        type: string
      expected_sha:
        description: Exact commit expected by the orchestrator
        required: false
        default: ""
        type: string
      expected_branch:
        description: Exact branch expected by the orchestrator
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      orchestration_id:
        required: true
        type: string
      dispatch_nonce:
        required: true
        type: string
      expected_sha:
        required: true
        type: string
      expected_branch:
        required: true
        type: string

permissions:
  contents: read

jobs:

  test-perf:
    uses: ./.github/workflows/test-perf.yml

  test-cni:
    uses: ./.github/workflows/test-cni.yml

  test-kube-bench:
    uses: ./.github/workflows/test-kube-bench.yml

  test-buildkite-elastic-ci-stack-for-aws:
    uses: ./.github/workflows/test-buildkite-elastic-ci-stack-for-aws.yml

  test-xxhash:
    uses: ./.github/workflows/test-xxhash.yml

  test-suse:
    uses: ./.github/workflows/test-suse.yml

  test-relion:
    uses: ./.github/workflows/test-relion.yml

  test-repeatmasker:
    uses: ./.github/workflows/test-repeatmasker.yml

  test-figtree:
    uses: ./.github/workflows/test-figtree.yml

  test-janusgraph:
    uses: ./.github/workflows/test-janusgraph.yml

  test-fedora:
    uses: ./.github/workflows/test-fedora.yml

  test-sqoop:
    uses: ./.github/workflows/test-sqoop.yml

  test-timber:
    uses: ./.github/workflows/test-timber.yml

  test-rke2:
    uses: ./.github/workflows/test-rke2.yml

  test-reveal:
    uses: ./.github/workflows/test-reveal.yml

  test-libxml2:
    uses: ./.github/workflows/test-libxml2.yml

  test-elastic-defend:
    uses: ./.github/workflows/test-elastic-defend.yml

  test-hbase:
    uses: ./.github/workflows/test-hbase.yml

  test-prometheus:
    uses: ./.github/workflows/test-prometheus.yml

  test-kubernetes:
    uses: ./.github/workflows/test-kubernetes.yml

  test-hdfs:
    uses: ./.github/workflows/test-hdfs.yml

  test-flume:
    uses: ./.github/workflows/test-Flume.yml

  test-expat:
    uses: ./.github/workflows/test-expat.yml

  test-sennajs:
    uses: ./.github/workflows/test-sennajs.yml

  test-impala:
    uses: ./.github/workflows/test-impala.yml

  test-libhelium:
    uses: ./.github/workflows/test-libhelium.yml

  test-backstage:
    uses: ./.github/workflows/test-backstage.yml

  test-tinyxml:
    uses: ./.github/workflows/test-tinyxml.yml

  test-opensearch-cli:
    uses: ./.github/workflows/test-opensearch-cli.yml

  test-font-awesome:
    uses: ./.github/workflows/test-font-awesome.yml

  test-bamtools:
    uses: ./.github/workflows/test-bamtools.yml

  test-wave:
    uses: ./.github/workflows/test-wave.yml

  test-apache_tomcat:
    uses: ./.github/workflows/test-apache_tomcat.yml

  test-keda:
    uses: ./.github/workflows/test-keda.yml

  test-hazelcast:
    uses: ./.github/workflows/test-hazelcast.yml

  test-exechealthz:
    uses: ./.github/workflows/test-exechealthz.yml

  test-cf-cli:
    uses: ./.github/workflows/test-cf-cli.yml

  test-elastic-fleet-server:
    uses: ./.github/workflows/test-elastic-fleet-server.yml

  test-canu:
    uses: ./.github/workflows/test-canu.yml

  test-ganglia:
    uses: ./.github/workflows/test-ganglia.yml

  test-dgraph-labs:
    uses: ./.github/workflows/test-Dgraph-Labs.yml

  test-spring-cloud-gateway:
    uses: ./.github/workflows/test-spring-cloud-gateway.yml

  test-cloud-native-stack:
    uses: ./.github/workflows/test-cloud-native-stack.yml

  test-cloudypad:
    uses: ./.github/workflows/test-cloudypad.yml

  test-cocotb:
    uses: ./.github/workflows/test-cocotb.yml

  summary:
    permissions:
      actions: read
      contents: read
    needs:
      [
        test-perf,
        test-cni,
        test-kube-bench,
        test-buildkite-elastic-ci-stack-for-aws,
        test-xxhash,
        test-suse,
        test-relion,
        test-repeatmasker,
        test-figtree,
        test-janusgraph,
        test-fedora,
        test-sqoop,
        test-timber,
        test-rke2,
        test-reveal,
        test-libxml2,
        test-elastic-defend,
        test-hbase,
        test-prometheus,
        test-kubernetes,
        test-hdfs,
        test-flume,
        test-expat,
        test-sennajs,
        test-impala,
        test-libhelium,
        test-backstage,
        test-tinyxml,
        test-opensearch-cli,
        test-font-awesome,
        test-bamtools,
        test-wave,
        test-apache_tomcat,
        test-keda,
        test-hazelcast,
        test-exechealthz,
        test-cf-cli,
        test-elastic-fleet-server,
        test-canu,
        test-ganglia,
        test-dgraph-labs,
        test-spring-cloud-gateway,
        test-cloud-native-stack,
        test-cloudypad,
        test-cocotb
      ]
    runs-on: ubuntu-24.04-arm
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # original: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Collect batch results
        id: collect
        uses: ./.github/actions/collect-batch-results
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        with:
          batch_number: "6"
          batch_title: "Batch 6"

      - name: Attest complete batch results
        id: attest
        if: steps.collect.outcome == 'success'
        env:
          ARTIFACT_NAME: batch6-test-results
          BATCH_NUMBER: "6"
          COLLECTOR_JSON_COUNT: ${{ steps.collect.outputs.json_count }}
          CURRENT_BRANCH: ${{ github.ref_name }}
          DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
          EXPECTED_BRANCH: ${{ inputs.expected_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          NEEDS_JSON: ${{ toJson(needs) }}
          ORCHESTRATION_ID: ${{ inputs.orchestration_id }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/batch_artifact_attestation.py create \
            --results-root test-results \
            --workflow-file ".github/workflows/test-all-packages-batch6.yml" \
            --batch "$BATCH_NUMBER" \
            --repository "$REPOSITORY" \
            --expected-branch "$EXPECTED_BRANCH" \
            --current-branch "$CURRENT_BRANCH" \
            --expected-sha "$EXPECTED_SHA" \
            --workflow-sha "$WORKFLOW_SHA" \
            --orchestration-id "$ORCHESTRATION_ID" \
            --dispatch-nonce "$DISPATCH_NONCE" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --artifact-name "$ARTIFACT_NAME" \
            --collector-json-count "$COLLECTOR_JSON_COUNT" \
            --needs-environment-variable NEEDS_JSON

      - name: Upload batch test results
        if: steps.collect.outcome == 'success' && steps.attest.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # original: actions/upload-artifact@v4.6.2
        with:
          name: batch6-test-results
          path: test-results
          retention-days: 90

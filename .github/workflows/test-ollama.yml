name: Test Ollama on Arm64

permissions:
  contents: read

on:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-ollama.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-ollama.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-ollama.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-ollama.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-ollama.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-ollama.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-ollama.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-ollama.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-ollama.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-ollama.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-ollama.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-ollama.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-ollama.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-ollama.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-ollama.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-ollama.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-ollama.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-ollama.outputs.regression_next_installed_version }}
      regression_policy:
        description: Regression applicability policy classification
        value: ${{ jobs.test-ollama.outputs.regression_policy }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-ollama.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-ollama.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-ollama.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-ollama.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-ollama.outputs.timestamp }}

jobs:
  test-ollama:
    runs-on: ubuntu-24.04-arm
    env:
      BASELINE_VERSION: "0.1.0"
      OLLAMA_SMOKE_COMMAND: |
        test "$(uname -m)" = aarch64
        WORKDIR=$(mktemp -d "$PWD/ollama-smoke.XXXXXX")
        export WORKDIR
        if [ -n "${OLLAMA_RELEASE_JSON:-}" ]; then
          cp "$OLLAMA_RELEASE_JSON" "$WORKDIR/release.json"
        else
          curl -fsSL --retry 3 --max-time 60 "https://api.github.com/repos/ollama/ollama/releases/tags/v${SMOKE_VERSION}" -o "$WORKDIR/release.json"
        fi
        python3 - <<'PY'
        import json
        import os
        from pathlib import Path
        import re
        root = Path(os.environ["WORKDIR"])
        expected = os.environ["SMOKE_VERSION"]
        release = json.loads((root / "release.json").read_text())
        assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", expected), expected
        assert release["tag_name"] == f"v{expected}", release["tag_name"]
        assert release["draft"] is False and release["prerelease"] is False, f"Not a stable published release: {release['tag_name']} draft={release['draft']} prerelease={release['prerelease']}"
        assert release["published_at"], "Release has no publication timestamp"
        names = ("ollama-linux-arm64",) if expected == "0.1.0" else (
            "ollama-linux-arm64.tgz", "ollama-linux-arm64.tar.zst", "ollama-linux-arm64")
        for name in names:
            assets = [asset for asset in release["assets"] if asset["name"] == name]
            if not assets:
                continue
            assert len(assets) == 1, f"Ambiguous release asset: {name}"
            asset = assets[0]
            assert asset["browser_download_url"] == f"https://github.com/ollama/ollama/releases/download/v{expected}/{name}", asset
            assert asset["size"] > 0, asset
            if expected != "0.1.0":
                assert re.fullmatch(r"sha256:[0-9a-f]{64}", asset.get("digest") or ""), "Candidate requires a publisher SHA256 digest"
            (root / "asset-name.txt").write_text(name)
            print(json.dumps({"release_id": release["id"], "tag": release["tag_name"],
                              "published_at": release["published_at"], "asset": asset["name"],
                              "publisher_digest": asset.get("digest")}), flush=True)
            break
        else:
            raise AssertionError("Stable release has no supported Linux Arm64 asset")
        PY
        ASSET=$(<"$WORKDIR/asset-name.txt")
        ASSET_URL="https://github.com/ollama/ollama/releases/download/v${SMOKE_VERSION}/$ASSET"
        export ASSET_URL ASSET
        curl -fsSL --retry 3 --max-time 600 "$ASSET_URL" -o "$WORKDIR/$ASSET"
        python3 - <<'PY'
        import hashlib
        import json
        import os
        from pathlib import Path
        root = Path(os.environ["WORKDIR"])
        expected = os.environ["SMOKE_VERSION"]
        release = json.loads((root / "release.json").read_text())
        assert release["tag_name"] == f"v{expected}", release["tag_name"]
        assert release["draft"] is False and release["prerelease"] is False, f"Not a stable published release: {release['tag_name']} draft={release['draft']} prerelease={release['prerelease']}"
        assets = [asset for asset in release["assets"] if asset["name"] == os.environ["ASSET"]]
        assert len(assets) == 1
        asset = assets[0]
        url = f"https://github.com/ollama/ollama/releases/download/v{expected}/{asset['name']}"
        assert asset["browser_download_url"] == os.environ["ASSET_URL"] == url
        archive = root / asset["name"]
        assert archive.stat().st_size == asset["size"] > 0
        digest = hashlib.sha256()
        with archive.open("rb") as source:
            for chunk in iter(lambda: source.read(1024 * 1024), b""):
                digest.update(chunk)
        if expected == "0.1.0":
            assert asset["name"] == "ollama-linux-arm64", asset["name"]
            # This historical release has no embedded version or publisher digest.
            assert digest.hexdigest() == "16cb9f8021f79cae616e0a34959d827972f6805a2cf6a36f55e66b37d5e4d572", "Baseline release asset differs from the reviewed bytes"
        if expected != "0.1.0" or asset.get("digest"):
            assert asset.get("digest") == f"sha256:{digest.hexdigest()}", "Publisher SHA256 digest is missing or does not match the downloaded asset"
        proof = {"release_tag": release["tag_name"], "asset_id": asset["id"], "url": url,
                 "size": asset["size"], "sha256": digest.hexdigest(), "publisher_digest": asset.get("digest")}
        (root / "artifact-proof.json").write_text(json.dumps(proof, indent=2))
        print(json.dumps(proof), flush=True)
        PY
        case "$ASSET" in
          *.tgz) tar -xzf "$WORKDIR/$ASSET" -C "$WORKDIR" ;;
          *.tar.zst) tar --zstd -xf "$WORKDIR/$ASSET" -C "$WORKDIR" ;;
          ollama-linux-arm64) mv "$WORKDIR/$ASSET" "$WORKDIR/ollama"; chmod +x "$WORKDIR/ollama" ;;
        esac
        if [ -x "$WORKDIR/bin/ollama" ]; then
          OLLAMA_BIN="$WORKDIR/bin/ollama"
        else
          OLLAMA_BIN="$WORKDIR/ollama"
        fi
        test -x "$OLLAMA_BIN"
        export OLLAMA_BIN
        file "$OLLAMA_BIN" | tee "$WORKDIR/binary-file.txt"
        grep -Eiq 'aarch64|arm64' "$WORKDIR/binary-file.txt"
        sha256sum "$OLLAMA_BIN" | tee "$WORKDIR/binary-sha256.txt"
        if [ "$SMOKE_VERSION" = "0.1.0" ]; then
          readelf -p .go.buildinfo "$OLLAMA_BIN" | tee "$WORKDIR/binary-buildinfo.txt"
        fi
        python3 - <<'PY'
        import json
        import os
        from pathlib import Path
        import re
        import signal
        import socket
        import subprocess
        import time
        import urllib.error
        import urllib.request
        root = Path(os.environ["WORKDIR"])
        expected = os.environ["SMOKE_VERSION"]
        binary = os.environ["OLLAMA_BIN"]
        artifact = json.loads((root / "artifact-proof.json").read_text())
        assert artifact["release_tag"] == f"v{expected}"
        with socket.socket() as listener:
            listener.bind(("127.0.0.1", 0))
            port = listener.getsockname()[1]
        environment = dict(os.environ, HOME=str(root / "home"), OLLAMA_MODELS=str(root / "models"),
                           OLLAMA_HOST=f"127.0.0.1:{port}", OLLAMA_NO_CLOUD="true")
        Path(environment["HOME"]).mkdir()
        log_path = root / "server.log"
        process = None
        try:
            with log_path.open("w") as log:
                process = subprocess.Popen([binary, "serve"], env=environment, stdout=log,
                                           stderr=subprocess.STDOUT, start_new_session=True)
                base = f"http://127.0.0.1:{port}"
                for _ in range(30):
                    assert process.poll() is None, f"Ollama exited early: {process.returncode}"
                    try:
                        with urllib.request.urlopen(base + "/", timeout=2) as response:
                            body = response.read().decode()
                            assert response.status == 200 and body.strip() == "Ollama is running", body
                        break
                    except (urllib.error.URLError, TimeoutError):
                        time.sleep(1)
                else:
                    raise AssertionError("Ollama root endpoint never became ready")
                version_basis = "cli_and_release_asset"
                try:
                    cli = subprocess.check_output([binary, "--version"], env=environment, text=True,
                                                  stderr=subprocess.STDOUT, timeout=30)
                except subprocess.CalledProcessError as error:
                    # The official 0.1.0 ELF has an empty version linker value.
                    assert expected == "0.1.0" and error.output.strip() == "Error: unknown flag: --version", error.output
                    cli = error.output
                    version_basis = "official_release_asset_only; embedded_version_unavailable"
                else:
                    versions = set(re.findall(r"\bversion(?: is)?\s+v?(\S+)", cli))
                    assert versions == {expected}, cli
                with urllib.request.urlopen(base + "/api/tags", timeout=5) as response:
                    tags = json.load(response)
                    assert response.status == 200
                assert isinstance(tags, dict) and "models" in tags, tags
                assert tags["models"] == [] or (expected == "0.1.0" and tags["models"] is None), tags
                listing = subprocess.check_output([binary, "list"], env=environment, text=True,
                                                  stderr=subprocess.STDOUT, timeout=30)
                assert re.search(r"^NAME\s+.*SIZE\s+MODIFIED", listing, re.M), listing
                api_version = None
                if expected != "0.1.0":
                    with urllib.request.urlopen(base + "/api/version", timeout=5) as response:
                        api_version = json.load(response)
                        assert response.status == 200 and api_version["version"] == expected, api_version
                assert process.poll() is None, "Ollama exited during its runtime checks"
                proof = {"version": expected, "asset_url": os.environ["ASSET_URL"], "binary": binary,
                         "cli": cli, "root": body, "tags": tags, "list": listing,
                         "api_version": api_version, "host": base, "version_basis": version_basis,
                         "artifact": artifact}
                (root / "runtime-proof.json").write_text(json.dumps(proof, indent=2))
                print(json.dumps(proof), flush=True)
        finally:
            if process is not None:
                try:
                    os.killpg(process.pid, signal.SIGTERM)
                except ProcessLookupError:
                    pass
                try:
                    process.wait(timeout=10)
                except subprocess.TimeoutExpired:
                    os.killpg(process.pid, signal.SIGKILL)
                    process.wait(timeout=10)
            if log_path.exists():
                print(log_path.read_text(), flush=True)
        PY
      PACKAGE_SLUG: "ollama"
      LANE_KIND: "github release / source-build-or-tarball"
      DOWNLOAD_URL: "https://github.com/ollama/ollama/releases"
      HOMEPAGE_URL: "https://ollama.com/"
      OFFICIAL_DOCS: "https://docs.ollama.com/quickstart"
      GITHUB_REPO: "ollama/ollama"

    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'Ollama'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      regression_policy: "applicable"
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=ollama" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/linux/opensource_packages/ollama" >> "$GITHUB_OUTPUT"

      - name: Bootstrap baseline dependencies
        uses: ./.github/actions/apt-bootstrap
        with:
          packages: "git curl jq tar unzip file ca-certificates zstd binutils"
          quiet: "true"

      - name: Install baseline source or artifact
        id: install
        run: |
          set -euo pipefail
          rm -rf baseline-src baseline-external
          mkdir -p baseline-src baseline-external
          if [ -n "$GITHUB_REPO" ]; then
            RESOLVED_TAG=""
            for CANDIDATE in "$BASELINE_VERSION" "v$BASELINE_VERSION"; do
              if git ls-remote --tags --refs "https://github.com/$GITHUB_REPO.git" "refs/tags/$CANDIDATE" | grep -q .; then
                RESOLVED_TAG="$CANDIDATE"
                break
              fi
            done
            if [ -n "$RESOLVED_TAG" ]; then
              git clone --filter=blob:none --depth 1 --branch "$RESOLVED_TAG" "https://github.com/$GITHUB_REPO.git" baseline-src >/dev/null 2>&1 || true
              echo "resolved_tag=$RESOLVED_TAG" >> "$GITHUB_OUTPUT"
            else
              git clone --filter=blob:none --depth 1 "https://github.com/$GITHUB_REPO.git" baseline-src >/dev/null 2>&1 || true
              echo "resolved_tag=default_branch" >> "$GITHUB_OUTPUT"
            fi
            if [ -d baseline-src/.git ] || [ -f baseline-src/README.md ] || [ -n "$(find baseline-src -mindepth 1 -maxdepth 2 -print -quit 2>/dev/null)" ]; then
              echo "install_mode=github_source" >> "$GITHUB_OUTPUT"
              echo "install_status=success" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if curl -fsLI "$DOWNLOAD_URL" >/dev/null 2>&1 || curl -fsLI "$HOMEPAGE_URL" >/dev/null 2>&1; then
            printf 'download=%s\nhomepage=%s\ndocs=%s\n' "$DOWNLOAD_URL" "$HOMEPAGE_URL" "$OFFICIAL_DOCS" > baseline-external/metadata.txt
            echo "resolved_tag=external_artifact" >> "$GITHUB_OUTPUT"
            echo "install_mode=external_artifact" >> "$GITHUB_OUTPUT"
            echo "install_status=success" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "install_mode=unresolved" >> "$GITHUB_OUTPUT"
          echo "install_status=failed" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Get baseline version
        id: version
        run: |
          echo "version=$BASELINE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected baseline version: $BASELINE_VERSION"

      - name: Define package-specific expectations
        id: expectations
        run: |
          set -euo pipefail
          CONTENT_PAGE="content/linux/opensource_packages/${PACKAGE_SLUG}.md"
          echo "content_page=$CONTENT_PAGE" >> "$GITHUB_OUTPUT"
          case "$PACKAGE_SLUG" in
            ngspice)
              echo "source_markers=ANALYSES|DEVICES|src|README|man" >> "$GITHUB_OUTPUT"
              echo "doc_markers=README|README.adms|README.tcl|src" >> "$GITHUB_OUTPUT"
              echo "identity_kind=grep_file" >> "$GITHUB_OUTPUT"
              echo "identity_target=README" >> "$GITHUB_OUTPUT"
              echo "identity_expect=ngspice" >> "$GITHUB_OUTPUT"
              echo "external_expect=ngspice" >> "$GITHUB_OUTPUT"
              ;;
            nvidia-container-toolkit)
              echo "source_markers=cmd/nvidia-ctk|cmd/nvidia-container-runtime|go.mod|pkg" >> "$GITHUB_OUTPUT"
              echo "doc_markers=README.md|cmd/nvidia-container-runtime|CHANGELOG.md|go.mod" >> "$GITHUB_OUTPUT"
              echo "identity_kind=go_module" >> "$GITHUB_OUTPUT"
              echo "identity_target=go.mod" >> "$GITHUB_OUTPUT"
              echo "identity_expect=github.com/NVIDIA/nvidia-container-toolkit" >> "$GITHUB_OUTPUT"
              echo "external_expect=nvidia-container-toolkit|NVIDIA Container Toolkit" >> "$GITHUB_OUTPUT"
              ;;
            nvidia-gpu-driver-container)
              echo "source_markers=base|Makefile|README.md|centos7|vgpu" >> "$GITHUB_OUTPUT"
              echo "doc_markers=README.md|base|azurelinux|centos7" >> "$GITHUB_OUTPUT"
              echo "identity_kind=grep_file" >> "$GITHUB_OUTPUT"
              echo "identity_target=README.md" >> "$GITHUB_OUTPUT"
              echo "identity_expect=driver container" >> "$GITHUB_OUTPUT"
              echo "external_expect=gpu driver container|NVIDIA driver" >> "$GITHUB_OUTPUT"
              ;;
            nvidia-gpu-operator)
              echo "source_markers=deployments/gpu-operator|go.mod|PROJECT|README.md" >> "$GITHUB_OUTPUT"
              echo "doc_markers=README.md|deployments/gpu-operator/Chart.yaml|tests|go.mod" >> "$GITHUB_OUTPUT"
              echo "identity_kind=chart_name" >> "$GITHUB_OUTPUT"
              echo "identity_target=deployments/gpu-operator/Chart.yaml" >> "$GITHUB_OUTPUT"
              echo "identity_expect=gpu-operator" >> "$GITHUB_OUTPUT"
              echo "external_expect=gpu-operator|GPU Operator" >> "$GITHUB_OUTPUT"
              ;;
            nvimagecodec)
              echo "source_markers=CMakeLists.txt|README.md|example|cmake" >> "$GITHUB_OUTPUT"
              echo "doc_markers=README.md|CMakeLists.txt|example" >> "$GITHUB_OUTPUT"
              echo "identity_kind=grep_file" >> "$GITHUB_OUTPUT"
              echo "identity_target=README.md" >> "$GITHUB_OUTPUT"
              echo "identity_expect=nvImageCodec" >> "$GITHUB_OUTPUT"
              echo "external_expect=nvImageCodec|nvimgcodec" >> "$GITHUB_OUTPUT"
              ;;
            nvsentinel)
              echo "source_markers=distros/kubernetes/nvsentinel|api|commons|Makefile" >> "$GITHUB_OUTPUT"
              echo "doc_markers=README.md|distros/kubernetes/nvsentinel/Chart.yaml|preflight-checks|health-monitors" >> "$GITHUB_OUTPUT"
              echo "identity_kind=chart_name" >> "$GITHUB_OUTPUT"
              echo "identity_target=distros/kubernetes/nvsentinel/Chart.yaml" >> "$GITHUB_OUTPUT"
              echo "identity_expect=nvsentinel" >> "$GITHUB_OUTPUT"
              echo "external_expect=nvsentinel" >> "$GITHUB_OUTPUT"
              ;;
            nvshmem)
              echo "source_markers=CMakeLists.txt|README.md|examples|cmake_config" >> "$GITHUB_OUTPUT"
              echo "doc_markers=README.md|examples|CMakeLists.txt|nvshmem4py" >> "$GITHUB_OUTPUT"
              echo "identity_kind=grep_file" >> "$GITHUB_OUTPUT"
              echo "identity_target=README.md" >> "$GITHUB_OUTPUT"
              echo "identity_expect=NVSHMEM" >> "$GITHUB_OUTPUT"
              echo "external_expect=NVSHMEM|nvshmem" >> "$GITHUB_OUTPUT"
              ;;
            nx-cugraph)
              echo "source_markers=_nx_cugraph|pyproject.toml|VERSION|README.md|benchmarks" >> "$GITHUB_OUTPUT"
              echo "doc_markers=README.md|pyproject.toml|_nx_cugraph/VERSION|VERSION" >> "$GITHUB_OUTPUT"
              echo "identity_kind=toml_name" >> "$GITHUB_OUTPUT"
              echo "identity_target=pyproject.toml" >> "$GITHUB_OUTPUT"
              echo "identity_expect=nx-cugraph" >> "$GITHUB_OUTPUT"
              echo "external_expect=nx-cugraph|cugraph" >> "$GITHUB_OUTPUT"
              ;;
            ocm)
              echo "source_markers=go.mod|api|README.md|VERSION" >> "$GITHUB_OUTPUT"
              echo "doc_markers=README.md|api|VERSION|cmds" >> "$GITHUB_OUTPUT"
              echo "identity_kind=go_module" >> "$GITHUB_OUTPUT"
              echo "identity_target=go.mod" >> "$GITHUB_OUTPUT"
              echo "identity_expect=ocm.software/ocm" >> "$GITHUB_OUTPUT"
              echo "external_expect=Open Component Model|open component model|OCM" >> "$GITHUB_OUTPUT"
              ;;
            ollama)
              echo "source_markers=go.mod|README.md|app|docs|CMakeLists.txt" >> "$GITHUB_OUTPUT"
              echo "doc_markers=README.md|docs|app|go.mod" >> "$GITHUB_OUTPUT"
              echo "identity_kind=grep_file" >> "$GITHUB_OUTPUT"
              echo "identity_target=README.md" >> "$GITHUB_OUTPUT"
              echo "identity_expect=ollama run" >> "$GITHUB_OUTPUT"
              echo "external_expect=ollama" >> "$GITHUB_OUTPUT"
              ;;
            openfpgaloader)
              echo "source_markers=CMakeLists.txt|src|scripts|70-openfpgaloader.rules|README.md" >> "$GITHUB_OUTPUT"
              echo "doc_markers=README.md|doc|CMakeLists.txt|scripts" >> "$GITHUB_OUTPUT"
              echo "identity_kind=grep_file" >> "$GITHUB_OUTPUT"
              echo "identity_target=CMakeLists.txt" >> "$GITHUB_OUTPUT"
              echo "identity_expect=openFPGALoader" >> "$GITHUB_OUTPUT"
              echo "external_expect=openFPGALoader|openfpgaloader" >> "$GITHUB_OUTPUT"
              ;;
            openlane)
              echo "source_markers=Makefile|configuration|dependencies|scripts/tcl_commands|README.md" >> "$GITHUB_OUTPUT"
              echo "doc_markers=README.md|configuration|dependencies|scripts/tcl_commands" >> "$GITHUB_OUTPUT"
              echo "identity_kind=grep_file" >> "$GITHUB_OUTPUT"
              echo "identity_target=README.md" >> "$GITHUB_OUTPUT"
              echo "identity_expect=OpenLane" >> "$GITHUB_OUTPUT"
              echo "external_expect=OpenLane|openlane" >> "$GITHUB_OUTPUT"
              ;;
            opennow)
              echo "source_markers=package.json|opennow-stable/package.json|README.md|opennow-stable" >> "$GITHUB_OUTPUT"
              echo "doc_markers=README.md|package.json|opennow-stable/package.json|opennow-stable" >> "$GITHUB_OUTPUT"
              echo "identity_kind=package_json_name" >> "$GITHUB_OUTPUT"
              echo "identity_target=opennow-stable/package.json" >> "$GITHUB_OUTPUT"
              echo "identity_expect=opennow-stable" >> "$GITHUB_OUTPUT"
              echo "external_expect=OpenNOW|opennow" >> "$GITHUB_OUTPUT"
              ;;
            ord-provider-server)
              echo "source_markers=package.json|src|Dockerfile|README.md" >> "$GITHUB_OUTPUT"
              echo "doc_markers=README.md|package.json|Dockerfile|src" >> "$GITHUB_OUTPUT"
              echo "identity_kind=package_json_name" >> "$GITHUB_OUTPUT"
              echo "identity_target=package.json" >> "$GITHUB_OUTPUT"
              echo "identity_expect=@open-resource-discovery/provider-server" >> "$GITHUB_OUTPUT"

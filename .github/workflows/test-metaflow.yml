name: Test Metaflow on Arm64

permissions:
  contents: read

on:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-metaflow.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-metaflow.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-metaflow.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-metaflow.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-metaflow.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-metaflow.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-metaflow.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-metaflow.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-metaflow.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-metaflow.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-metaflow.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-metaflow.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-metaflow.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-metaflow.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-metaflow.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-metaflow.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-metaflow.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-metaflow.outputs.regression_next_installed_version }}
      regression_policy:
        description: Regression applicability policy classification
        value: ${{ jobs.test-metaflow.outputs.regression_policy }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-metaflow.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-metaflow.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-metaflow.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-metaflow.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-metaflow.outputs.timestamp }}

jobs:
  test-metaflow:
    runs-on: ubuntu-24.04-arm
    env:
      BASELINE_VERSION: "2.0.0"
      DIST_NAME: "metaflow"

    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'Metaflow'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      regression_policy: "applicable"
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=metaflow" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/linux/opensource_packages/metaflow" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # original: actions/setup-python@v5
        with:
          # Metaflow 2.0 uses collections.Sequence, removed in Python 3.10.
          python-version: '3.9.25'

      - name: Install baseline package
        id: install
        run: |
          set -euo pipefail
          python -m venv .venv-current
          . .venv-current/bin/activate
          # Metaflow 2.0 also imports the legacy pkg_resources API.
          python -m pip install --upgrade "pip<24.1" packaging "setuptools==80.9.0"
          python -m pip install "$DIST_NAME==$BASELINE_VERSION"
          python - <<'PY2'
          import importlib.metadata as im, json, os
          dist_name = os.environ['DIST_NAME']
          top_levels = []
          version = im.version(dist_name)
          for dist in im.distributions():
              name = (dist.metadata.get('Name') or '').strip()
              if name.lower() == dist_name.lower():
                  txt = dist.read_text('top_level.txt')
                  if txt:
                      top_levels = [x.strip() for x in txt.splitlines() if x.strip()]
                  break
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f"install_status=success\n")
              fh.write(f"baseline_version={version}\n")
              fh.write("top_levels_json=" + json.dumps(top_levels) + "\n")
          PY2

      - name: Get package version
        id: version
        run: |
          set -euo pipefail
          . .venv-current/bin/activate
          VERSION=$(python - <<'PY2'
          import importlib.metadata as im, os
          print(im.version(os.environ['DIST_NAME']))
          PY2
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Test 1 - Package installed
        id: test1
        continue-on-error: true
        run: |
          START_TIME=$(date +%s)
          . .venv-current/bin/activate
          if python -m pip show "$DIST_NAME" >/dev/null 2>&1; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 2 - Version metadata matches baseline
        id: test2
        continue-on-error: true
        run: |
          START_TIME=$(date +%s)
          . .venv-current/bin/activate
          VERSION=$(python - <<'PY2'
          import importlib.metadata as im, os
          print(im.version(os.environ['DIST_NAME']))
          PY2
          )
          if [ "$VERSION" = "$BASELINE_VERSION" ]; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 3 - Installed files metadata
        id: test3
        continue-on-error: true
        run: |
          START_TIME=$(date +%s)
          . .venv-current/bin/activate
          if python - <<'PY2'
          import importlib.metadata as im, os
          files = list(im.files(os.environ['DIST_NAME']) or [])
          raise SystemExit(0 if files else 1)
          PY2
          then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 4 - Architecture Verification
        id: test4
        continue-on-error: true
        run: |
          START_TIME=$(date +%s)
          if [ "$(uname -m)" = "aarch64" ]; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 5 - Functional Validation
        id: test5
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          . .venv-current/bin/activate
          if python - <<'PY2'
          import os
          import metaflow
          from metaflow import FlowSpec, Parameter, step
          assert metaflow.__version__ == os.environ['BASELINE_VERSION']
          assert callable(FlowSpec) and callable(Parameter) and callable(step)
          print(f"Metaflow {metaflow.__version__}: public flow API import passed")
          PY2
          then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 6 - Regression Validation
        id: test6
        env:
          CURRENT_VERSION: ${{ steps.version.outputs.version || env.BASELINE_VERSION }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          . .venv-current/bin/activate
          CURRENT="${CURRENT_VERSION}"
          echo "current_version=$CURRENT" >> "$GITHUB_OUTPUT"
          LATEST=$(
            python -c "import textwrap; exec(textwrap.dedent('''
              import json, os, urllib.request
              from packaging.version import Version, InvalidVersion
              dist = os.environ['DIST_NAME']
              current = os.environ['CURRENT_VERSION']
              def is_stable(v: str) -> bool:
                  s = v.lower()
                  return not any(x in s for x in ['a','b','rc','dev','post'])
              try:
                  current_v = Version(current)
              except InvalidVersion:
                  print('lookup_failed')
                  raise SystemExit(0)
              try:
                  with urllib.request.urlopen(f'https://pypi.org/pypi/{dist}/json', timeout=30) as r:
                      data = json.load(r)
              except Exception:
                  print('lookup_failed')
                  raise SystemExit(0)
              versions = []
              for v in data.get('releases', {}).keys():
                  try:
                      vv = Version(v)
                  except InvalidVersion:
                      continue
                  if is_stable(v) and vv > current_v:
                      versions.append(vv)
              print(str(sorted(versions)[0]) if versions else '')
            '''))"
          )
          if [ "$LATEST" = "lookup_failed" ]; then
            echo "latest_version=lookup_failed" >> "$GITHUB_OUTPUT"
            echo "next_installed_version=lookup_failed" >> "$GITHUB_OUTPUT"
            echo "decision=next_lookup_failed" >> "$GITHUB_OUTPUT"
            echo "regression_result=Next version lookup failed" >> "$GITHUB_OUTPUT"
            echo "comparison=The next PyPI regression candidate after baseline $CURRENT could not be resolved automatically." >> "$GITHUB_OUTPUT"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            END_TIME=$(date +%s)
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ -z "$LATEST" ]; then
            echo "latest_version=$CURRENT" >> "$GITHUB_OUTPUT"
            echo "next_installed_version=$CURRENT" >> "$GITHUB_OUTPUT"
            echo "decision=no_newer_stable_available" >> "$GITHUB_OUTPUT"
            echo "regression_result=No newer stable release is available for Arm64 validation" >> "$GITHUB_OUTPUT"
            echo "comparison=Configured baseline version $CURRENT already matches the newest stable PyPI release available for this package." >> "$GITHUB_OUTPUT"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            END_TIME=$(date +%s)
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "latest_version=$LATEST" >> "$GITHUB_OUTPUT"
          python -m venv .venv-next
          . .venv-next/bin/activate
          python -m pip install --upgrade "pip<24.1" packaging "setuptools==80.9.0"
          if python -m pip install "$DIST_NAME==$LATEST"; then
            NEXT_VERSION=$(python -c 'import importlib.metadata as im, os; print(im.version(os.environ["DIST_NAME"]))')
            echo "next_installed_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
            if [ "$NEXT_VERSION" = "$LATEST" ] && python -c 'from metaflow import FlowSpec, Parameter, step'; then
              echo "decision=next_install_validated" >> "$GITHUB_OUTPUT"
              echo "regression_result=Next version installed and public flow API imported on Arm64" >> "$GITHUB_OUTPUT"
              echo "comparison=The newer stable PyPI candidate $LATEST installed at the expected version and imported FlowSpec, Parameter and step on Arm64 using Python 3.9.25, the runtime used for baseline $CURRENT." >> "$GITHUB_OUTPUT"
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "decision=next_install_failed" >> "$GITHUB_OUTPUT"
              echo "regression_result=Next version or public flow API validation failed on Arm64" >> "$GITHUB_OUTPUT"
              echo "comparison=The regression candidate $LATEST did not report the expected installed version or failed to import its public flow API on Arm64." >> "$GITHUB_OUTPUT"
              echo "status=failed" >> "$GITHUB_OUTPUT"
              END_TIME=$(date +%s)
              echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          else
            echo "next_installed_version=install_failed" >> "$GITHUB_OUTPUT"
            echo "decision=next_install_failed" >> "$GITHUB_OUTPUT"
            echo "regression_result=Next version install failed on Arm64" >> "$GITHUB_OUTPUT"
            echo "comparison=The regression candidate $LATEST after baseline $CURRENT could not be installed on Arm64." >> "$GITHUB_OUTPUT"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            END_TIME=$(date +%s)
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Calculate test summary
        id: summary
        if: always()
        run: |
          set -euo pipefail
          PASSED=0
          FAILED=0
          SKIPPED=0
          CORE_FAILED=0
          DURATION=0
          check_core_test() {
            if [ "$1" = "passed" ] && [ "$3" = "success" ]; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
              CORE_FAILED=$((CORE_FAILED + 1))
            fi
            DURATION=$((DURATION + $2))
          }
          check_core_test "${{ steps.test1.outputs.status || 'failed' }}" "${{ steps.test1.outputs.duration || '0' }}" "${{ steps.test1.outcome }}"
          check_core_test "${{ steps.test2.outputs.status || 'failed' }}" "${{ steps.test2.outputs.duration || '0' }}" "${{ steps.test2.outcome }}"
          check_core_test "${{ steps.test3.outputs.status || 'failed' }}" "${{ steps.test3.outputs.duration || '0' }}" "${{ steps.test3.outcome }}"
          check_core_test "${{ steps.test4.outputs.status || 'failed' }}" "${{ steps.test4.outputs.duration || '0' }}" "${{ steps.test4.outcome }}"
          check_core_test "${{ steps.test5.outputs.status || 'failed' }}" "${{ steps.test5.outputs.duration || '0' }}" "${{ steps.test5.outcome }}"
          T6="${{ steps.test6.outputs.status || 'failed' }}"
          O6="${{ steps.test6.outcome }}"
          if [ "$T6" = "passed" ] && [ "$O6" = "success" ]; then
            PASSED=$((PASSED + 1))
          elif [ "$T6" = "skipped" ] && [ "$O6" = "success" ]; then
            SKIPPED=$((SKIPPED + 1))
          else
            FAILED=$((FAILED + 1))
          fi
          DURATION=$((DURATION + ${{ steps.test6.outputs.duration || '0' }}))
          OVERALL_STATUS=failure
          BADGE_STATUS=failing
          if [ "$FAILED" -eq 0 ]; then
            OVERALL_STATUS=success
            BADGE_STATUS=passing
          fi
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"
          echo "core_failed=$CORE_FAILED" >> "$GITHUB_OUTPUT"
          echo "overall_status=$OVERALL_STATUS" >> "$GITHUB_OUTPUT"
          echo "badge_status=$BADGE_STATUS" >> "$GITHUB_OUTPUT"
          test "$FAILED" -eq 0

      - name: Cleanup
        if: always()
        run: |
          rm -rf .venv-current .venv-next || true

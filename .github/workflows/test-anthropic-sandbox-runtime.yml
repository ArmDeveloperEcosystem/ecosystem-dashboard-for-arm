# Historical public Arm-support minimum is 0.0.1; this tests npm 0.0.81.
# Only the immutable baseline is tested; Test 6 explicitly defers upgrade validation.
name: Test Anthropic Sandbox Runtime Arm64 sandbox enforcement

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      contract_version:
        description: contract version
        value: ${{ jobs.test-anthropic-sandbox-runtime.outputs.contract_version }}
      package_slug:
        description: package slug
        value: ${{ jobs.test-anthropic-sandbox-runtime.outputs.package_slug }}
      package_name:
        description: package name
        value: ${{ jobs.test-anthropic-sandbox-runtime.outputs.package_name }}
      package_version:
        description: package version
        value: ${{ jobs.test-anthropic-sandbox-runtime.outputs.package_version }}
      run_status:
        description: run status
        value: ${{ jobs.test-anthropic-sandbox-runtime.outputs.run_status }}
      badge_status:
        description: badge status
        value: ${{ jobs.test-anthropic-sandbox-runtime.outputs.badge_status }}
      core_failed:
        description: core failed
        value: ${{ jobs.test-anthropic-sandbox-runtime.outputs.core_failed }}
      tests_passed:
        description: tests passed
        value: ${{ jobs.test-anthropic-sandbox-runtime.outputs.tests_passed }}
      tests_failed:
        description: tests failed
        value: ${{ jobs.test-anthropic-sandbox-runtime.outputs.tests_failed }}
      tests_skipped:
        description: tests skipped
        value: ${{ jobs.test-anthropic-sandbox-runtime.outputs.tests_skipped }}
      duration_seconds:
        description: duration seconds
        value: ${{ jobs.test-anthropic-sandbox-runtime.outputs.duration_seconds }}
      regression_status:
        description: regression status
        value: ${{ jobs.test-anthropic-sandbox-runtime.outputs.regression_status }}
      regression_decision:
        description: regression decision
        value: ${{ jobs.test-anthropic-sandbox-runtime.outputs.regression_decision }}
      regression_result:
        description: regression result
        value: ${{ jobs.test-anthropic-sandbox-runtime.outputs.regression_result }}
      regression_comparison:
        description: regression comparison
        value: ${{ jobs.test-anthropic-sandbox-runtime.outputs.regression_comparison }}
      regression_current_version:
        description: regression current version
        value: ${{ jobs.test-anthropic-sandbox-runtime.outputs.regression_current_version }}
      regression_latest_version:
        description: regression latest version
        value: ${{ jobs.test-anthropic-sandbox-runtime.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: regression next installed version
        value: ${{ jobs.test-anthropic-sandbox-runtime.outputs.regression_next_installed_version }}
      regression_applicability:
        description: regression applicability
        value: ${{ jobs.test-anthropic-sandbox-runtime.outputs.regression_applicability }}
      run_id:
        description: run id
        value: ${{ jobs.test-anthropic-sandbox-runtime.outputs.run_id }}
      run_attempt:
        description: run attempt
        value: ${{ jobs.test-anthropic-sandbox-runtime.outputs.run_attempt }}
      job_name:
        description: job name
        value: ${{ jobs.test-anthropic-sandbox-runtime.outputs.job_name }}
      dashboard_link:
        description: dashboard link
        value: ${{ jobs.test-anthropic-sandbox-runtime.outputs.dashboard_link }}
      timestamp:
        description: timestamp
        value: ${{ jobs.test-anthropic-sandbox-runtime.outputs.timestamp }}

jobs:
  test-anthropic-sandbox-runtime:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      LC_ALL: C
    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: "Anthropic Sandbox Runtime"
      package_version: ${{ steps.version.outputs.version }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '5' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '5' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status }}
      regression_decision: ${{ steps.test6.outputs.decision || 'baseline_failed' }}
      regression_result: ${{ steps.test6.outputs.regression_result }}
      regression_comparison: ${{ steps.test6.outputs.comparison }}
      regression_current_version: ${{ steps.test6.outputs.current_version }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version }}
      regression_applicability: ${{ steps.test6.outputs.applicability }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set package metadata
        id: metadata
        run: |
          set -euo pipefail
          {
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "package_slug=anthropic-sandbox-runtime"
            echo "dashboard_link=/opensource_packages/anthropic-sandbox-runtime"
          } >> "$GITHUB_OUTPUT"

      - name: Install SRI-verified published npm baseline
        id: install
        continue-on-error: true
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64
          bash .github/actions/apt-bootstrap/bootstrap.sh \
            --packages "ca-certificates curl xz-utils binutils bubblewrap socat ripgrep python3" \
            --no-install-recommends true
          TOOLS="$RUNNER_TEMP/srt-tools"
          PREFIX="$TOOLS/install"
          mkdir -p "$TOOLS/node" "$PREFIX" "$RUNNER_TEMP/srt-fixture"
          curl -fLsS --retry 3 --connect-timeout 20 --max-time 180 -o "$TOOLS/node.tar.xz" \
            https://nodejs.org/dist/v22.21.1/node-v22.21.1-linux-arm64.tar.xz
          echo "e660365729b434af422bcd2e8e14228637ecf24a1de2cd7c916ad48f2a0521e1  $TOOLS/node.tar.xz" | sha256sum -c -
          tar -xJf "$TOOLS/node.tar.xz" --strip-components=1 -C "$TOOLS/node"
          curl -fLsS --retry 3 --connect-timeout 20 --max-time 180 -o "$TOOLS/sandbox-runtime-0.0.81.tgz" \
            https://registry.npmjs.org/@anthropic-ai/sandbox-runtime/-/sandbox-runtime-0.0.81.tgz
          # Registry dist.integrity captured by native evidence run 40566400512.
          python3 - <<'PY'
          import base64, hashlib, os
          from pathlib import Path
          archive = Path(os.environ["RUNNER_TEMP"]) / "srt-tools/sandbox-runtime-0.0.81.tgz"
          expected = "sha512-bjHDu87gjIR7+Oxy9jPiK3v8CvSELCzfpXa3fjqfSKdvlZET2iF51xcXILWPayTpowB3xtZeQVf2JR916nVW/w=="
          actual = "sha512-" + base64.b64encode(hashlib.sha512(archive.read_bytes()).digest()).decode("ascii")
          if actual != expected:
              raise SystemExit("Sandbox Runtime npm tarball SRI mismatch")
          print("Verified Sandbox Runtime 0.0.81 npm tarball SRI")
          PY
          export PATH="$TOOLS/node/bin:$PATH"
          test "$(node --version)" = v22.21.1
          # Install the verified local artifact without lifecycle scripts, outside
          # all sandbox-writable paths. npm resolves its declared dependencies.
          timeout 480s npm install --prefix "$PREFIX" --ignore-scripts --no-audit --no-fund --save-exact \
            "$TOOLS/sandbox-runtime-0.0.81.tgz"
          PACKAGE_ROOT="$PREFIX/node_modules/@anthropic-ai/sandbox-runtime"
          test -x "$PACKAGE_ROOT/vendor/seccomp/arm64/apply-seccomp"
          test -f "$PACKAGE_ROOT/dist/cli.js"
          {
            echo "SRT_ROOT=$PACKAGE_ROOT"
            echo "SRT_CLI=$PACKAGE_ROOT/dist/cli.js"
            echo "SRT_FIXTURE=$RUNNER_TEMP/srt-fixture"
            echo "SRT_SETTINGS=$RUNNER_TEMP/srt-settings.json"
          } >> "$GITHUB_ENV"
          echo "$TOOLS/node/bin" >> "$GITHUB_PATH"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          fixture = root / "srt-fixture"
          (fixture / "secret").write_text("private-arm-smoke-data")
          (fixture / "protected").write_text("unchanged")
          settings = {"network": {"allowedDomains": [], "deniedDomains": []},
                      "filesystem": {"denyRead": [str(fixture / "secret")],
                                     "allowWrite": [str(fixture)],
                                     "denyWrite": [str(fixture / "protected")]}}
          (root / "srt-settings.json").write_text(json.dumps(settings))
          PY
          echo "install_status=success" >> "$GITHUB_OUTPUT"

      - name: Verify exact installed baseline version
        id: version
        if: always() && steps.install.outcome == 'success' && steps.install.outputs.install_status == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          VERSION=$(node "$SRT_CLI" --version)
          test "$VERSION" = 0.0.81
          test "$(node -p 'require(process.env.SRT_ROOT + "/package.json").version')" = "$VERSION"
          test "$(node -p 'require(process.env.SRT_ROOT + "/package.json").name')" = @anthropic-ai/sandbox-runtime
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test 1 - Published npm package and native Arm64 seccomp helper
        id: test1
        if: always()
        continue-on-error: true
        env:
          BASELINE_READY: "${{ steps.install.outcome }}:${{ steps.install.outputs.install_status }}:${{ steps.version.outcome }}"
        run: |
          set -euo pipefail
          START_TIME=$SECONDS
          finish_test() {
            local rc=$? status=failed
            trap - EXIT
            if [ "$rc" -eq 0 ]; then status=passed; fi
            echo "status=$status" >> "$GITHUB_OUTPUT"
            echo "duration=$((SECONDS - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish_test EXIT
          test "$BASELINE_READY" = success:success:success
          test "$(uname -m)" = aarch64
          test "$(node --version)" = v22.21.1
          test "$(node -p 'process.arch')" = arm64
          readelf -h "$SRT_ROOT/vendor/seccomp/arm64/apply-seccomp" | grep -Eq 'Machine: +AArch64'
          node --input-type=module -e 'const m = await import(process.env.SRT_ROOT + "/dist/index.js"); if (typeof m.SandboxManager.initialize !== "function") process.exit(1)'

      - name: Test 2 - Required unprivileged namespaces on disposable runner
        id: test2
        if: always()
        continue-on-error: true
        env:
          BASELINE_READY: "${{ steps.install.outcome }}:${{ steps.install.outputs.install_status }}:${{ steps.version.outcome }}"
        run: |
          set -euo pipefail
          START_TIME=$SECONDS
          finish_test() {
            local rc=$? status=failed
            trap - EXIT
            if [ "$rc" -eq 0 ]; then status=passed; fi
            echo "status=$status" >> "$GITHUB_OUTPUT"
            echo "duration=$((SECONDS - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish_test EXIT
          test "$BASELINE_READY" = success:success:success
          uname -a
          bwrap --version
          sysctl kernel.unprivileged_userns_clone
          # Upstream requires capability-bearing namespaces on Ubuntu 24.04.
          # Change only this disposable job host and restore the original value.
          sysctl -n kernel.apparmor_restrict_unprivileged_userns > "$RUNNER_TEMP/srt-apparmor-original"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 0
          timeout 20s bwrap --unshare-pid --unshare-user --cap-drop ALL --ro-bind / / --proc /proc true

      - name: Test 3 - Real sandbox execution and exit propagation
        id: test3
        if: always()
        continue-on-error: true
        env:
          BASELINE_READY: "${{ steps.install.outcome }}:${{ steps.install.outputs.install_status }}:${{ steps.version.outcome }}"
        run: |
          set -euo pipefail
          START_TIME=$SECONDS
          finish_test() {
            local rc=$? status=failed
            trap - EXIT
            if [ "$rc" -eq 0 ]; then status=passed; fi
            echo "status=$status" >> "$GITHUB_OUTPUT"
            echo "duration=$((SECONDS - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish_test EXIT
          test "$BASELINE_READY" = success:success:success
          cd "$SRT_FIXTURE"
          RESULT=$(timeout 45s node "$SRT_CLI" --settings "$SRT_SETTINGS" -c 'printf ARM_SMOKE_OK')
          test "$RESULT" = ARM_SMOKE_OK
          set +e
          timeout 45s node "$SRT_CLI" --settings "$SRT_SETTINGS" -c 'exit 37'
          RC=$?
          set -e
          test "$RC" -eq 37

      - name: Test 4 - Filesystem allow-write, deny-read and deny-write enforcement
        id: test4
        if: always()
        continue-on-error: true
        env:
          BASELINE_READY: "${{ steps.install.outcome }}:${{ steps.install.outputs.install_status }}:${{ steps.version.outcome }}"
        run: |
          set -euo pipefail
          START_TIME=$SECONDS
          finish_test() {
            local rc=$? status=failed
            trap - EXIT
            if [ "$rc" -eq 0 ]; then status=passed; fi
            echo "status=$status" >> "$GITHUB_OUTPUT"
            echo "duration=$((SECONDS - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish_test EXIT
          test "$BASELINE_READY" = success:success:success
          cd "$SRT_FIXTURE"
          test "$(cat secret)" = private-arm-smoke-data
          test -w protected
          timeout 45s node "$SRT_CLI" --settings "$SRT_SETTINGS" -- python3 -c '
          import errno, pathlib, sys
          p = pathlib.Path(sys.argv[1])
          (p / "allowed").write_text("allowed")
          assert (p / "allowed").read_text() == "allowed"
          for filename, mode in (("secret", "r"), ("protected", "w")):
              try:
                  with (p / filename).open(mode):
                      pass
              except OSError as error:
                  allowed = (errno.EACCES, errno.EPERM) if mode == "r" else (errno.EACCES, errno.EPERM, errno.EROFS)
                  assert error.errno in allowed, error
              else:
                  raise AssertionError(filename + " restriction was bypassed")
          print("FILESYSTEM_ENFORCEMENT_OK")
          ' "$SRT_FIXTURE"
          test "$(cat allowed)" = allowed
          test "$(cat protected)" = unchanged

      - name: Test 5 - Seccomp Unix-socket denial and HTTP proxy deny-all enforcement
        id: test5
        if: always()
        continue-on-error: true
        env:
          BASELINE_READY: "${{ steps.install.outcome }}:${{ steps.install.outputs.install_status }}:${{ steps.version.outcome }}"
        run: |
          set -euo pipefail
          START_TIME=$SECONDS
          finish_test() {
            local rc=$? status=failed
            trap - EXIT
            if [ "$rc" -eq 0 ]; then status=passed; fi
            echo "status=$status" >> "$GITHUB_OUTPUT"
            echo "duration=$((SECONDS - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish_test EXIT
          test "$BASELINE_READY" = success:success:success
          cd "$SRT_FIXTURE"
          timeout 45s node "$SRT_CLI" --settings "$SRT_SETTINGS" -- python3 -c '
          import errno, socket, urllib.request, urllib.error
          try:
              sock = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          except OSError as error:
              assert error.errno == errno.EPERM, error
          else:
              sock.close()
              raise AssertionError("AF_UNIX socket creation escaped seccomp")
          try:
              urllib.request.urlopen("http://arm-smoke.invalid/", timeout=10)
          except urllib.error.HTTPError as error:
              assert error.code == 403, error
          else:
              raise AssertionError("deny-all proxy accepted an unlisted host")
          print("NETWORK_AND_SECCOMP_ENFORCEMENT_OK")
          '

      - name: Restore disposable runner state
        id: cleanup
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/srt-apparmor-original" ]; then
            ORIGINAL=$(cat "$RUNNER_TEMP/srt-apparmor-original")
            [[ "$ORIGINAL" =~ ^[01]$ ]]
            sudo sysctl -w "kernel.apparmor_restrict_unprivileged_userns=$ORIGINAL"
          fi

      - name: Test 6 - Newer-version runtime validation explicitly deferred
        id: test6
        if: always()
        continue-on-error: true
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, ".github/scripts")
          from package_result_policy import expected_regression_metadata
          steps = json.loads(os.environ["STEPS_JSON"])
          core_failed = sum(steps.get(f"test{i}", {}).get("outcome") != "success" or
                            steps.get(f"test{i}", {}).get("outputs", {}).get("status") != "passed"
                            for i in range(1, 6))
          installed = (steps.get("install", {}).get("outcome") == "success" and
                       steps.get("install", {}).get("outputs", {}).get("install_status") == "success" and
                       steps.get("version", {}).get("outcome") == "success" and
                       bool(steps.get("version", {}).get("outputs", {}).get("version")))
          decision = ("baseline_install_failed" if not installed else
                      "baseline_failed" if core_failed else "runtime_validation_not_automated")
          semantic = expected_regression_metadata(decision=decision, core_failed=core_failed)
          values = {
              "status": "skipped", "duration": "0", "decision": decision,
              "applicability": semantic["applicability"],
              "current_version": steps.get("version", {}).get("outputs", {}).get("version", ""),
              "latest_version": "not_evaluated", "next_installed_version": "not_installed",
              "regression_result": "No newer-version runtime comparison was executed.",
              "comparison": "Only the pinned baseline is exercised. Upgrades need a separate artifact and full enforcement run; no regression pass is asserted.",
          }
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for key, value in values.items():
                  print(f"{key}={value}", file=output)
          PY

      - name: Validate fail-closed six-test result
        id: summary
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          PACKAGE_NAME: "Anthropic Sandbox Runtime"
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          sys.path.insert(0, ".github/scripts")
          from package_result_policy import validate_six_test_result, expected_regression_metadata
          steps = json.loads(os.environ["STEPS_JSON"])
          details, duration, malformed = [], 0, False
          for i in range(1, 7):
              step = steps.get(f"test{i}", {})
              values = step.get("outputs", {})
              seconds = values.get("duration", "")
              valid_duration = isinstance(seconds, str) and re.fullmatch(r"[0-9]+", seconds)
              if not valid_duration:
                  malformed = True
              else:
                  duration += int(seconds)
              status = "passed" if step.get("outcome") == "success" and values.get("status") == "passed" and valid_duration else "failed"
              if i == 6 and step.get("outcome") == "success" and values.get("status") == "skipped" and valid_duration:
                  status = "skipped"
              detail = {"name": f"Test {i}", "status": status}
              if i == 6:
                  detail["decision"] = values.get("decision", "")
              details.append(detail)
          statuses = [detail["status"] for detail in details]
          passed, failed, skipped = (statuses.count(value) for value in ("passed", "failed", "skipped"))
          core_failed = statuses[:5].count("failed")
          decision = details[-1]["decision"]
          run_status = "failure"
          try:
              required = validate_six_test_result(details=details, passed=passed, failed=failed,
                                                skipped=skipped, core_failed=core_failed, decision=decision)
              semantic = expected_regression_metadata(decision=decision, core_failed=core_failed)
              prerequisites = (steps.get("metadata", {}).get("outcome") == "success" and
                               steps.get("install", {}).get("outcome") == "success" and
                               steps.get("install", {}).get("outputs", {}).get("install_status") == "success" and
                               steps.get("version", {}).get("outcome") == "success" and
                               bool(steps.get("version", {}).get("outputs", {}).get("version")) and
                               steps.get("cleanup", {}).get("outcome") == "success")
              if required == "success" and prerequisites and not malformed:
                  run_status = "success"
          except ValueError as error:
              print(f"Result policy rejected evidence: {error}", file=sys.stderr)
          outputs = {
              "overall_status": run_status, "badge_status": "passing" if run_status == "success" else "failing",
              "passed": passed, "failed": failed, "skipped": skipped,
              "core_failed": core_failed, "duration": duration,
          }
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for key, value in outputs.items():
                  print(f"{key}={value}", file=output)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as report:
              print(f"## {os.environ['PACKAGE_NAME']} Arm64 baseline", file=report)
              print(f"Status: {run_status}; passed: {passed}; failed: {failed}; skipped: {skipped}.", file=report)
              print("Mandatory runtime/enforcement checks fail when prerequisites are unavailable.", file=report)
              print(f"Regression decision: {decision}. No newer-version runtime comparison.", file=report)
              print("Historical public Arm-support minimum: 0.0.1; tested baseline: 0.0.81. No performance recommendation is asserted.", file=report)
          sys.exit(0 if run_status == "success" else 1)
          PY

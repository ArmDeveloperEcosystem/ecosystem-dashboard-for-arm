name: Test Chef Infra on Arm64

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-chef-infra.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-chef-infra.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-chef-infra.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-chef-infra.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-chef-infra.outputs.run_status }}
      badge_status:
        description: Badge status for all required source checks
        value: ${{ jobs.test-chef-infra.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-chef-infra.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-chef-infra.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-chef-infra.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-chef-infra.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-chef-infra.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-chef-infra.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-chef-infra.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-chef-infra.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-chef-infra.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-chef-infra.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-chef-infra.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version loaded from the isolated source bundle
        value: ${{ jobs.test-chef-infra.outputs.regression_next_installed_version }}
      regression_policy:
        description: Regression applicability policy classification
        value: ${{ jobs.test-chef-infra.outputs.regression_policy }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-chef-infra.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-chef-infra.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-chef-infra.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-chef-infra.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-chef-infra.outputs.timestamp }}
jobs:
  test-chef-infra:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    env:
      CHEF_VERSION: "18.8.54"
      CHEF_NEXT_VERSION: "18.10.17"
      CHEF_WORK_ROOT: ${{ github.workspace }}/chef-source-validation
      GEM_HOME: ${{ github.workspace }}/chef-source-tools
    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'Chef Infra (source file-resource API only)'
      package_version: ${{ steps.test1.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '5' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '6' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'failed' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'next_regression_failed' }}
      regression_result: ${{ steps.test6.outputs.regression_result || 'Source API validation did not complete.' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'No completed source API comparison; not vendor installer or CLI coverage.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.test1.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      regression_policy: "applicable"
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set test metadata
        id: metadata
        run: |
          {
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "package_slug=chef-infra"
            echo "dashboard_link=/opensource_packages/chef-infra"
          } >> "$GITHUB_OUTPUT"
          {
            echo '## Chef Infra source API validation'
            echo 'Scope: pinned upstream source, real file-resource API operations and applicable upstream file specs. Not vendor installer, CLI equivalence, or all Chef tests.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install native source build prerequisites
        id: dependencies
        run: |
          set -euo pipefail
          bash .github/actions/apt-bootstrap/bootstrap.sh --packages "ruby-full ruby-dev build-essential pkg-config libffi-dev libssl-dev zlib1g-dev libarchive-dev libyaml-dev cmake git file"
          gem install bundler --version 2.3.27 --no-document
          echo "$GEM_HOME/bin" >> "$GITHUB_PATH"
      - name: Prepare pinned baseline source and frozen dependencies
        id: install
        run: bash .github/scripts/chef_source_setup.sh baseline
      - name: Test 1 - Exact source identity and loaded version
        id: test1
        if: always()
        env:
          CHEF_SETUP_OUTCOME: ${{ steps.install.outcome }}
        run: |
          source .github/scripts/chef_source_setup.sh baseline
          chef_start_check
          chef_require_setup
          bundle _2.3.27_ exec ruby "$GITHUB_WORKSPACE/.github/scripts/chef_source_probe.rb" identity
      - name: Test 2 - Ohai source API platform detection
        id: test2
        if: always()
        env:
          CHEF_SETUP_OUTCOME: ${{ steps.install.outcome }}
        run: |
          source .github/scripts/chef_source_setup.sh baseline
          chef_start_check
          chef_require_setup
          bundle _2.3.27_ exec ruby "$GITHUB_WORKSPACE/.github/scripts/chef_source_probe.rb" ohai
      - name: Test 3 - Real file-resource API operations
        id: test3
        if: always()
        env:
          CHEF_SETUP_OUTCOME: ${{ steps.install.outcome }}
        run: |
          source .github/scripts/chef_source_setup.sh baseline
          chef_start_check
          chef_require_setup
          bundle _2.3.27_ exec ruby "$GITHUB_WORKSPACE/.github/scripts/chef_source_probe.rb" resource
      - name: Test 4 - Applicable upstream functional file specs
        id: test4
        if: always()
        env:
          CHEF_SETUP_OUTCOME: ${{ steps.install.outcome }}
        run: |
          source .github/scripts/chef_source_setup.sh baseline
          chef_start_check
          chef_require_setup
          bundle _2.3.27_ exec ruby "$GITHUB_WORKSPACE/.github/scripts/chef_upstream_file_specs.rb"
          chef_assert_source
      - name: Test 5 - Native Arm64 Ruby and dependency objects
        id: test5
        if: always()
        env:
          CHEF_SETUP_OUTCOME: ${{ steps.install.outcome }}
        run: |
          source .github/scripts/chef_source_setup.sh baseline
          chef_start_check
          chef_require_setup
          bundle _2.3.27_ exec ruby "$GITHUB_WORKSPACE/.github/scripts/chef_source_probe.rb" native
      - name: Test 6 - Regression Validation
        id: test6
        if: always()
        env:
          BASELINE_VERSION: ${{ steps.test1.outputs.version || 'unknown' }}
          BASELINE_READY: ${{ steps.dependencies.outcome == 'success' && steps.install.outcome == 'success' && steps.test1.outcome == 'success' && steps.test1.outputs.status == 'passed' && steps.test2.outcome == 'success' && steps.test2.outputs.status == 'passed' && steps.test3.outcome == 'success' && steps.test3.outputs.status == 'passed' && steps.test4.outcome == 'success' && steps.test4.outputs.status == 'passed' && steps.test5.outcome == 'success' && steps.test5.outputs.status == 'passed' }}
        run: |
          source .github/scripts/chef_source_setup.sh candidate
          CHEF_REGRESSION=true
          chef_start_check
          if [ "$BASELINE_READY" != true ]; then
            CHEF_TEST_STATUS=skipped
            CHEF_DECISION=baseline_failed
            CHEF_RESULT='Candidate not executed because required baseline source checks failed.'
            CHEF_COMPARISON='Baseline source API validation failed; no successful regression comparison is claimed.'
            exit 0
          fi
          chef_setup
          chef_require_setup
          bundle _2.3.27_ exec ruby "$GITHUB_WORKSPACE/.github/scripts/chef_source_probe.rb" all
          CHEF_NEXT_OBSERVED=$(cat "$EVIDENCE_DIR/source-version.txt")
          test "$CHEF_NEXT_OBSERVED" = "$CHEF_NEXT_VERSION"
          bundle _2.3.27_ exec ruby "$GITHUB_WORKSPACE/.github/scripts/chef_upstream_file_specs.rb"
          chef_assert_source
          CHEF_RESULT="Candidate source API identity, Ohai, file operations, native objects and upstream specs passed: $(cat "$EVIDENCE_DIR/spec-summary.txt")."
          CHEF_COMPARISON="Baseline $BASELINE_VERSION: $(cat "$CHEF_WORK_ROOT/baseline/evidence/spec-summary.txt"). Candidate $CHEF_NEXT_OBSERVED: $(cat "$EVIDENCE_DIR/spec-summary.txt"). Source file-resource API coverage only; filtered examples were not executed; vendor CLI and .deb distributions were not tested."
          CHEF_DECISION=validated_next_release
      - name: Calculate test summary
        id: summary
        if: always()
        env:
          T1: ${{ steps.test1.outputs.status }}:${{ steps.test1.outcome }}:${{ steps.test1.outputs.duration || '0' }}
          T2: ${{ steps.test2.outputs.status }}:${{ steps.test2.outcome }}:${{ steps.test2.outputs.duration || '0' }}
          T3: ${{ steps.test3.outputs.status }}:${{ steps.test3.outcome }}:${{ steps.test3.outputs.duration || '0' }}
          T4: ${{ steps.test4.outputs.status }}:${{ steps.test4.outcome }}:${{ steps.test4.outputs.duration || '0' }}
          T5: ${{ steps.test5.outputs.status }}:${{ steps.test5.outcome }}:${{ steps.test5.outputs.duration || '0' }}
          T6: ${{ steps.test6.outputs.status }}:${{ steps.test6.outcome }}:${{ steps.test6.outputs.duration || '0' }}
          DECISION: ${{ steps.test6.outputs.decision }}
          SETUP_OK: ${{ steps.dependencies.outcome == 'success' && steps.install.outcome == 'success' }}
        run: |
          set -euo pipefail
          PASSED=0 FAILED=0 SKIPPED=0 CORE_FAILED=0 TOTAL_DURATION=0
          INDEX=0
          for CHECK in "$T1" "$T2" "$T3" "$T4" "$T5" "$T6"; do
            INDEX=$((INDEX + 1))
            IFS=: read -r STATUS OUTCOME DURATION <<< "$CHECK"
            if [ "$STATUS" = passed ] && [ "$OUTCOME" = success ]; then
              PASSED=$((PASSED + 1))
            elif [ "$INDEX" -eq 6 ] && [ "$STATUS" = skipped ] && [ "$OUTCOME" = success ] && [ "$DECISION" = baseline_failed ] && [ "$CORE_FAILED" -gt 0 ]; then
              SKIPPED=$((SKIPPED + 1))
            else
              FAILED=$((FAILED + 1))
              if [ "$INDEX" -le 5 ]; then CORE_FAILED=$((CORE_FAILED + 1)); fi
            fi
            if [[ "$DURATION" =~ ^[0-9]+$ ]]; then TOTAL_DURATION=$((TOTAL_DURATION + 10#$DURATION)); fi
          done
          {
            echo "passed=$PASSED"
            echo "failed=$FAILED"
            echo "skipped=$SKIPPED"
            echo "core_failed=$CORE_FAILED"
            echo "duration=$TOTAL_DURATION"
          } >> "$GITHUB_OUTPUT"
          if [ "$PASSED" -eq 6 ] && [ "$SETUP_OK" = true ] && [ "$DECISION" = validated_next_release ]; then
            echo 'overall_status=success' >> "$GITHUB_OUTPUT"
            echo 'badge_status=passing' >> "$GITHUB_OUTPUT"
          else
            echo 'overall_status=failure' >> "$GITHUB_OUTPUT"
            echo 'badge_status=failing' >> "$GITHUB_OUTPUT"
            exit 1
          fi
      - name: Report source validation scope and outcomes
        if: always()
        env:
          VERSION: ${{ steps.test1.outputs.version || 'unknown' }}
          RUN_STATUS: ${{ steps.summary.outputs.overall_status || 'failure' }}
          PASSED: ${{ steps.summary.outputs.passed || '0' }}
          FAILED: ${{ steps.summary.outputs.failed || '6' }}
          SKIPPED: ${{ steps.summary.outputs.skipped || '0' }}
          COMPARISON: ${{ steps.test6.outputs.comparison || 'Source comparison did not complete.' }}
        run: |
          {
            printf '\nBaseline source version: %s; outcome: %s.\n' "$VERSION" "$RUN_STATUS"
            printf 'Six workflow checks: %s passed, %s failed, %s skipped.\n' "$PASSED" "$FAILED" "$SKIPPED"
            printf '%s\n' "$COMPARISON"
            printf 'Detailed source identity, native objects, filesystem assertions and RSpec selection JSON are retained in job logs. No vendor CLI or installer equivalence is claimed.\n'
          } >> "$GITHUB_STEP_SUMMARY"

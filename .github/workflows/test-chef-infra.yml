name: Experimental Chef source functionality on Arm64

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  source-functionality:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '18.8.54'
            revision: d28f552c2b23b738d670d348d3c19d24e3c874e8
          - version: '18.10.17'
            revision: dad75f495067c88d1e07c3f5999d88ef8b3f3cf9
    env:
      EXPECTED_CHEF_VERSION: ${{ matrix.version }}
      EXPECTED_CHEF_REVISION: ${{ matrix.revision }}
      EVIDENCE_DIR: ${{ github.workspace }}/chef-evidence
      GEM_HOME: ${{ github.workspace }}/chef-poc-tools
      BUNDLE_PATH: ${{ github.workspace }}/chef-poc-bundle
      BUNDLE_FROZEN: 'true'
      BUNDLE_FORCE_RUBY_PLATFORM: 'true'
      BUNDLE_DISABLE_SHARED_GEMS: 'true'
      BUNDLE_WITHOUT: omnibus_package:pry:ruby_shadow:knife_windows_deps
    steps:
      - name: Checkout experimental harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout unmodified upstream Chef source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: chef/chef
          ref: ${{ matrix.revision }}
          path: chef-source
          persist-credentials: false
      - name: Record source and native runner identity
        working-directory: chef-source
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test "$(uname -m)" = aarch64
          test "$(git rev-parse HEAD)" = "$EXPECTED_CHEF_REVISION"
          test -z "${CHEF_LICENSE:-}"
          test -z "${CHEF_LICENSE_KEY:-}"
          {
            printf 'Scope: upstream source file-resource functionality; not vendor installer or CLI validation.\n'
            uname -a
            cat /etc/os-release
            git rev-parse HEAD
            sha256sum Gemfile Gemfile.lock chef.gemspec
          } | tee "$EVIDENCE_DIR/source-and-host.txt"
      - name: Install native build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ruby-full ruby-dev build-essential pkg-config libffi-dev libssl-dev zlib1g-dev libarchive-dev libyaml-dev cmake
          ruby --version
          gem install bundler --version 2.3.27 --no-document
          echo "$GEM_HOME/bin" >> "$GITHUB_PATH"
      - name: Install locked source dependencies without invoking Rake
        working-directory: chef-source
        run: |
          set -euo pipefail
          bundle _2.3.27_ install --jobs 4 --retry 2 2>&1 | tee "$EVIDENCE_DIR/bundle-install.log"
          bundle _2.3.27_ check
          git diff --exit-code
      - name: Execute real file-resource smoke proof
        working-directory: chef-source
        run: |
          set -euo pipefail
          bundle _2.3.27_ exec ruby ../.github/scripts/chef_source_probe.rb | tee "$EVIDENCE_DIR/resource-probe.log"
      - name: Run unmodified upstream functional file tests
        working-directory: chef-source
        run: |
          set -euo pipefail
          bundle _2.3.27_ exec rspec spec/functional/resource/file_spec.rb --format progress --format json --out "$EVIDENCE_DIR/upstream-rspec.json" 2>&1 | tee "$EVIDENCE_DIR/upstream-rspec.log"
      - name: Verify evidence and unchanged upstream sources
        working-directory: chef-source
        run: |
          set -euo pipefail
          git diff --exit-code
          ruby -rjson -e 's = JSON.parse(File.read(ARGV[0])).fetch("summary"); puts JSON.pretty_generate(s); abort "No functional examples executed" unless s.fetch("example_count") > 0; abort "Upstream examples failed" unless s.fetch("failure_count") == 0; abort "Pending examples require explicit review" unless s.fetch("pending_count") == 0' "$EVIDENCE_DIR/upstream-rspec.json"
          {
            printf 'Native dependency objects:\n'
            find "$BUNDLE_PATH" -type f -name '*.so' -exec file {} +
            printf '\nUnchanged upstream source files:\n'
            git status --short
          } | tee "$EVIDENCE_DIR/native-objects.txt"
      - name: Retain proof including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chef-source-proof-${{ matrix.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: chef-evidence/
          if-no-files-found: error
          retention-days: 14

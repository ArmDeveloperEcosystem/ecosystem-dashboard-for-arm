name: Test GDB on Arm64
permissions:
  contents: read

on:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-gdb.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-gdb.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-gdb.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-gdb.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-gdb.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-gdb.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-gdb.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-gdb.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-gdb.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-gdb.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-gdb.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-gdb.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-gdb.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-gdb.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-gdb.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-gdb.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-gdb.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-gdb.outputs.regression_next_installed_version }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-gdb.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-gdb.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-gdb.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-gdb.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-gdb.outputs.timestamp }}
jobs:
  test-gdb:
    runs-on: ubuntu-24.04-arm
    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'GDB'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=gdb" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/opensource_packages/gdb" >> "$GITHUB_OUTPUT"
      - name: Install GDB
        id: install
        run: |
          echo "Installing GDB..."
          
          # Install using apt-get
          sudo apt-get update
          if sudo apt-get install -y gdb gcc; then
             echo "GDB installed successfully"
             echo "install_status=success" >> $GITHUB_OUTPUT
          else
             echo "GDB installation failed"
             echo "install_status=failed" >> $GITHUB_OUTPUT
             exit 1
          fi

      # ============================================================
      # CUSTOMIZE THIS: Get the package version
      # ============================================================
      - name: Get GDB version
        id: version
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          trap 'echo "status=failed" >> "$GITHUB_OUTPUT"; echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"' ERR
          export LC_ALL=C
          IDENTITY=$(python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil
          import subprocess
          import sys

          def run(*args):
              result = subprocess.run(args, capture_output=True, text=True, timeout=30)
              print(f"{args!r} (exit {result.returncode}):\n{result.stdout}{result.stderr}", file=sys.stderr)
              result.check_returncode()
              if result.stderr:
                  raise SystemExit("Unexpected diagnostic from GDB identity probe")
              return result.stdout

          binary = shutil.which("gdb")
          if not binary:
              raise SystemExit("GDB executable is missing")
          lines = run(binary, "--version").splitlines()
          match = re.fullmatch(
              r"GNU gdb \((?:GDB|(?:Ubuntu|Debian) ([0-9][0-9A-Za-z.+:~\-]*))\) "
              r"([0-9]+(?:\.[0-9]+)+)", lines[0] if lines else "")
          if not match or sum(line.startswith("GNU gdb") for line in lines) != 1:
              raise SystemExit("Malformed, duplicate, or wrong-product GDB banner")
          revision, version = match.groups()
          package = run("dpkg-query", "-W",
                        "-f=${Package}\t${Status}\t${Version}\t${Architecture}\t${source:Package}\t${source:Upstream-Version}\n", "gdb")
          installed = re.fullmatch(
              r"gdb\tinstall ok installed\t([0-9][0-9A-Za-z.+:~\-]*)\tarm64\tgdb\t"
              r"([0-9]+(?:\.[0-9]+)+)\n", package)
          if not installed or installed[2] != version:
              raise SystemExit("GDB Arm64 package and banner versions disagree")
          package_version = installed[1]
          if not re.fullmatch(r"(?:[0-9]+:)?" + re.escape(version) + r"-[0-9A-Za-z.+~]+", package_version):
              raise SystemExit("GDB package revision disagrees with upstream version")
          if revision and revision != package_version:
              raise SystemExit("GDB banner package revision disagrees with dpkg")
          files = run("dpkg-query", "-L", "gdb").splitlines()
          if Path(binary).resolve() not in {Path(p).resolve() for p in files if p.startswith("/")}:
              raise SystemExit("GDB executable is not owned by the installed package")
          print(f"{version}\t{package_version}")
          PY
          )
          IFS=$'\t' read -r VERSION PACKAGE_VERSION <<< "$IDENTITY"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"

      # ============================================================
      # ADD YOUR TESTS BELOW
      # Each test should:
      # 1. Have a unique id (test1, test2, etc.)
      # 2. Track start/end time for duration
      # 3. Set status=passed or status=failed
      # 4. Exit 1 on failure
      # ============================================================

      - name: Test 1 - Check gdb binary exists
        id: test1
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          trap 'echo "status=failed" >> "$GITHUB_OUTPUT"; echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"' ERR
          test -x "$(command -v gdb)"
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 2 - Check gdb version command
        id: test2
        continue-on-error: true
        env:
          VERSION_STATUS: ${{ steps.version.outputs.status }}
          VERSION_OUTCOME: ${{ steps.version.outcome }}
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          trap 'echo "status=failed" >> "$GITHUB_OUTPUT"; echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"' ERR
          export LC_ALL=C
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess

          def run(*args):
              result = subprocess.run(args, capture_output=True, text=True, timeout=30)
              result.check_returncode()
              if result.stderr:
                  raise SystemExit("Unexpected diagnostic from GDB identity probe")
              return result.stdout

          version = os.environ["EXPECTED_VERSION"]
          package_version = os.environ["EXPECTED_PACKAGE_VERSION"]
          if (os.environ["VERSION_STATUS"] != "passed" or os.environ["VERSION_OUTCOME"] != "success"
                  or not re.fullmatch(r"[0-9]+(?:\.[0-9]+)+", version)):
              raise SystemExit("GDB baseline identity was not verified")
          binary = shutil.which("gdb")
          if not binary:
              raise SystemExit("GDB executable is missing")
          lines = run(binary, "--version").splitlines()
          match = re.fullmatch(
              r"GNU gdb \((?:GDB|(?:Ubuntu|Debian) ([0-9][0-9A-Za-z.+:~\-]*))\) "
              r"([0-9]+(?:\.[0-9]+)+)", lines[0] if lines else "")
          if (not match or sum(line.startswith("GNU gdb") for line in lines) != 1
                  or match[2] != version or (match[1] and match[1] != package_version)):
              raise SystemExit("GDB banner changed or is malformed")
          package = run("dpkg-query", "-W",
                        "-f=${Package}\t${Status}\t${Version}\t${Architecture}\t${source:Package}\t${source:Upstream-Version}\n", "gdb")
          if (package != f"gdb\tinstall ok installed\t{package_version}\tarm64\tgdb\t{version}\n"
                  or not re.fullmatch(r"(?:[0-9]+:)?" + re.escape(version) + r"-[0-9A-Za-z.+~]+", package_version)):
              raise SystemExit("GDB Arm64 package identity changed")
          files = run("dpkg-query", "-L", "gdb").splitlines()
          if Path(binary).resolve() not in {Path(p).resolve() for p in files if p.startswith("/")}:
              raise SystemExit("GDB executable is not owned by the installed package")
          print(lines[0])
          PY
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 3 - Check gdb help output
        id: test3
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          trap 'echo "status=failed" >> "$GITHUB_OUTPUT"; echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"' ERR
          export LC_ALL=C
          HELP=$(gdb --help 2>&1)
          printf '%s\n' "$HELP"
          grep -Fx 'This is the GNU debugger.  Usage:' <<< "$HELP"
          grep -Fx '    gdb [options] [executable-file [core-file or process-id]]' <<< "$HELP"
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 4 - Debug simple C program (batch mode)
        id: test4
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          trap 'echo "status=failed" >> "$GITHUB_OUTPUT"; echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"' ERR
          export LC_ALL=C
          cat > debug_test.c <<'EOF'
          #include <stdio.h>
          int main(void) {
              int x = 42;
              printf("x is %d\n", x);
              return 0;
          }
          EOF
          gcc -g -O0 -o debug_test debug_test.c
          # Stop after x is initialized, inspect it, then finish the inferior.
          cat > gdb_cmds.txt <<'EOF'
          set debuginfod enabled off
          break debug_test.c:4
          run
          print x
          continue
          EOF
          DEBUG_OUTPUT=$(gdb --nx --batch --return-child-result -x gdb_cmds.txt ./debug_test 2>&1)
          printf '%s\n' "$DEBUG_OUTPUT"
          grep -E '^Breakpoint 1, main \(\) at debug_test.c:4$' <<< "$DEBUG_OUTPUT"
          grep -Fx '$1 = 42' <<< "$DEBUG_OUTPUT"
          grep -Fx 'x is 42' <<< "$DEBUG_OUTPUT"
          rm debug_test.c debug_test gdb_cmds.txt
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 5 - Check gdbserver and Arm64 architecture
        id: test5
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          trap 'echo "status=failed" >> "$GITHUB_OUTPUT"; echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"' ERR
          export LC_ALL=C
          sudo apt-get install -y gdbserver
          test -x "$(command -v gdbserver)"
          SERVER_VERSION=$(gdbserver --version 2>&1)
          printf '%s\n' "$SERVER_VERSION"
          grep -E '^GNU gdbserver \([^()]+\) [0-9]+(\.[0-9]+)+$' <<< "$SERVER_VERSION"
          test "$(uname -m)" = aarch64
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"

            # ============================================================
      # UPDATE THIS: Calculate summary based on your number of tests
      # Add/remove test result checks to match your tests above

      - name: Regression applicability - package manager installed
        id: test6
        if: always()
        run: |
          set -euo pipefail
          CURRENT="${{ steps.version.outputs.version || 'unknown' }}"
          echo "current_version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest_version=not_applicable" >> "$GITHUB_OUTPUT"
          echo "next_installed_version=not_applicable" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.install.outcome }}" != success ]; then
            echo "decision=baseline_install_failed" >> "$GITHUB_OUTPUT"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "regression_result=Regression skipped: the GDB package installation did not succeed." >> "$GITHUB_OUTPUT"
            echo "comparison=No successfully installed baseline is available for comparison." >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.version.outcome }}" = success ] && [ "${{ steps.version.outputs.status }}" = passed ] && \
               [ "$CURRENT" != unknown ] && [ -n "$CURRENT" ] && \
               [ "${{ steps.test1.outcome }}" = success ] && [ "${{ steps.test1.outputs.status }}" = passed ] && \
               [ "${{ steps.test2.outcome }}" = success ] && [ "${{ steps.test2.outputs.status }}" = passed ] && \
               [ "${{ steps.test3.outcome }}" = success ] && [ "${{ steps.test3.outputs.status }}" = passed ] && \
               [ "${{ steps.test4.outcome }}" = success ] && [ "${{ steps.test4.outputs.status }}" = passed ] && \
               [ "${{ steps.test5.outcome }}" = success ] && [ "${{ steps.test5.outputs.status }}" = passed ]; then
            echo "decision=not_applicable_package_manager" >> "$GITHUB_OUTPUT"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "regression_result=Regression validation not applicable: tested package installed via package manager in Tests 1-5" >> "$GITHUB_OUTPUT"
            echo "comparison=The tested package is installed via a package manager in Tests 1-5, so version-to-version regression validation is not shown under the current policy." >> "$GITHUB_OUTPUT"
          else
            echo "decision=baseline_failed" >> "$GITHUB_OUTPUT"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "regression_result=Regression skipped: GDB baseline validation did not succeed." >> "$GITHUB_OUTPUT"
            echo "comparison=All five core checks must pass before a baseline can be compared." >> "$GITHUB_OUTPUT"
          fi
          echo "duration=0" >> "$GITHUB_OUTPUT"

      - name: Calculate test summary
        if: always()
        id: summary
        run: |
          set -euo pipefail
          PASSED=0
          FAILED=0
          SKIPPED=0
          TOTAL_DURATION=0
          check_core() {
            local status="$1" outcome="$2" duration="$3"
            if [[ "$duration" =~ ^[0-9]{1,6}$ ]]; then
              TOTAL_DURATION=$((TOTAL_DURATION + 10#$duration))
            else
              status=failed
            fi
            if [ "$status" = "passed" ] && [ "$outcome" = "success" ]; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
            fi
          }
          check_core "${{ steps.test1.outputs.status }}" "${{ steps.test1.outcome }}" "${{ steps.test1.outputs.duration || 0 }}"
          check_core "${{ steps.test2.outputs.status }}" "${{ steps.test2.outcome }}" "${{ steps.test2.outputs.duration || 0 }}"
          check_core "${{ steps.test3.outputs.status }}" "${{ steps.test3.outcome }}" "${{ steps.test3.outputs.duration || 0 }}"
          check_core "${{ steps.test4.outputs.status }}" "${{ steps.test4.outcome }}" "${{ steps.test4.outputs.duration || 0 }}"
          check_core "${{ steps.test5.outputs.status }}" "${{ steps.test5.outcome }}" "${{ steps.test5.outputs.duration || 0 }}"
          CORE_FAILED=$FAILED
          DURATION6="${{ steps.test6.outputs.duration || 0 }}"
          EXPECTED_DECISION=not_applicable_package_manager
          if [ "${{ steps.install.outcome }}" != success ]; then
            EXPECTED_DECISION=baseline_install_failed
          elif [ "$CORE_FAILED" -gt 0 ] || [ "${{ steps.version.outcome }}" != success ] || \
               [ "${{ steps.version.outputs.status }}" != passed ] || \
               [ -z "${{ steps.version.outputs.version }}" ] || \
               [ "${{ steps.version.outputs.version }}" = unknown ]; then
            EXPECTED_DECISION=baseline_failed
          fi
          if [ "${{ steps.test6.outputs.status }}" = "skipped" ] &&
             [ "${{ steps.test6.outputs.decision }}" = "$EXPECTED_DECISION" ] &&
             { { [ "$CORE_FAILED" -eq 0 ] && [ "$EXPECTED_DECISION" = not_applicable_package_manager ]; } ||
               { [ "$CORE_FAILED" -gt 0 ] && [ "$EXPECTED_DECISION" != not_applicable_package_manager ]; }; } &&
             [ "${{ steps.test6.outcome }}" = "success" ] &&
             [[ "$DURATION6" =~ ^[0-9]{1,6}$ ]]; then
            SKIPPED=1
          else
            FAILED=$((FAILED + 1))
          fi
          if [[ "$DURATION6" =~ ^[0-9]{1,6}$ ]]; then
            TOTAL_DURATION=$((TOTAL_DURATION + 10#$DURATION6))
          fi
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
          echo "core_failed=$CORE_FAILED" >> "$GITHUB_OUTPUT"
          echo "duration=$TOTAL_DURATION" >> "$GITHUB_OUTPUT"
          if [ "$FAILED" -eq 0 ]; then
            echo "overall_status=success" >> "$GITHUB_OUTPUT"
            echo "badge_status=passing" >> "$GITHUB_OUTPUT"
          else
            echo "overall_status=failure" >> "$GITHUB_OUTPUT"
            echo "badge_status=failing" >> "$GITHUB_OUTPUT"
            exit 1
          fi
      - name: Create test summary
        if: always()
        run: |
          echo "## GDB Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ steps.summary.outputs.overall_status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests Passed:** ${{ steps.summary.outputs.passed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests Failed:** ${{ steps.summary.outputs.failed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests Skipped:** ${{ steps.summary.outputs.skipped }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Duration:** ${{ steps.summary.outputs.duration || 0 }}s" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner:** ubuntu-24.04 (arm64)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Details" >> $GITHUB_STEP_SUMMARY
          echo "1. Test 1 - Check gdb binary exists: ${{ steps.test1.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "2. Test 2 - Check gdb version command: ${{ steps.test2.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "3. Test 3 - Check gdb help output: ${{ steps.test3.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "4. Test 4 - Debug simple C program (batch mode): ${{ steps.test4.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "5. Test 5 - Check gdbserver and Arm64 architecture: ${{ steps.test5.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "6. Package manager regression applicability: ${{ steps.test6.outputs.status }} (${{ steps.test6.outputs.decision }})" >> $GITHUB_STEP_SUMMARY

name: Test Katalis on Arm64

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-katalis.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-katalis.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-katalis.outputs.package_name }}
      package_version:
        description: Verified baseline version of both components
        value: ${{ jobs.test-katalis.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-katalis.outputs.run_status }}
      badge_status:
        description: Badge status derived from baseline checks
        value: ${{ jobs.test-katalis.outputs.badge_status }}
      core_failed:
        description: Failed baseline checks
        value: ${{ jobs.test-katalis.outputs.core_failed }}
      tests_passed:
        description: Passed tests
        value: ${{ jobs.test-katalis.outputs.tests_passed }}
      tests_failed:
        description: Failed tests
        value: ${{ jobs.test-katalis.outputs.tests_failed }}
      tests_skipped:
        description: Skipped tests
        value: ${{ jobs.test-katalis.outputs.tests_skipped }}
      duration_seconds:
        description: Total test duration
        value: ${{ jobs.test-katalis.outputs.duration_seconds }}
      regression_policy:
        description: Source installation requires Test 6
        value: ${{ jobs.test-katalis.outputs.regression_policy }}
      regression_status:
        description: Regression status
        value: ${{ jobs.test-katalis.outputs.regression_status }}
      regression_decision:
        description: Regression decision
        value: ${{ jobs.test-katalis.outputs.regression_decision }}
      regression_result:
        description: Regression result
        value: ${{ jobs.test-katalis.outputs.regression_result }}
      regression_comparison:
        description: Component versions and source evidence
        value: ${{ jobs.test-katalis.outputs.regression_comparison }}
      regression_current_version:
        description: Verified shared baseline version
        value: ${{ jobs.test-katalis.outputs.regression_current_version }}
      regression_latest_version:
        description: Selected stable candidate pair, not a product release
        value: ${{ jobs.test-katalis.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Verified installed candidate component versions
        value: ${{ jobs.test-katalis.outputs.regression_next_installed_version }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-katalis.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-katalis.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-katalis.outputs.job_name }}
      dashboard_link:
        description: Dashboard route
        value: ${{ jobs.test-katalis.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp
        value: ${{ jobs.test-katalis.outputs.timestamp }}

jobs:
  test-katalis:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      BASELINE_VERSION: '0.0.2'
      OPERATOR_BASELINE_SHA: c6ace450c401e49c51bf094dbbf3293ba3816c7f
      API_BASELINE_SHA: b1d5afc62f94d19fdd9c4d7e415f3ad6bc6a05d6
      OPERATOR_NEXT_VERSION: '1.0.2'
      OPERATOR_NEXT_SHA: 1f03f8b668677498aff372b8f576c8fefa48e408
      API_NEXT_VERSION: '1.0.3'
      API_NEXT_SHA: f5cd16c722a20eeb1eb49f455802257e2d57d74f
      PINNED_CONTAINER_IMAGE_GOLANG: golang@sha256:cbff9d1a9041b316010f2da6b701b6c0d597718cb90928c85eb597334a0d23d4 # original: golang:1.25.13
      ENVTEST_SHA512: ce6e44c5a3e99b595138cde396c1b179095db477be8ccd9f05cbd135bc15c391000d6e146907922872f0199b9c13a7e8ab6b5402f8cae3522514f0ef65914000
    outputs:
      contract_version: '2.0'
      package_slug: katalis
      package_name: Katalis
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '5' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '6' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_policy: applicable
      regression_status: ${{ steps.test6.outputs.status || 'failed' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'next_install_failed' }}
      regression_result: ${{ steps.test6.outputs.regression_result || 'Candidate installation did not complete.' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'No verified candidate pair was produced.' }}
      regression_current_version: ${{ steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'operator=1.0.2;api=1.0.3' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'operator=not_installed;api=not_installed' }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          set -euo pipefail
          {
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo 'package_slug=katalis'
            echo 'dashboard_link=/opensource_packages/katalis'
            echo "current_version=$BASELINE_VERSION"
          } >> "$GITHUB_OUTPUT"
          uname -a
          cat /etc/os-release
          lscpu

      - name: Prepare isolated native tools
        id: prepare
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          for tool in docker git curl file python3 timeout sha512sum; do command -v "$tool"; done
          KATALIS_ROOT=$(mktemp -d /tmp/katalis-smoke.XXXXXXXX)
          echo "KATALIS_ROOT=$KATALIS_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$KATALIS_ROOT/work/fixtures" "$KATALIS_ROOT/work/cache" "$KATALIS_ROOT/runtime"
          cp .github/scripts/tests/fixtures/katalis_smoke.go "$KATALIS_ROOT/work/fixtures/"
          cat > "$KATALIS_ROOT/katalis-lib.sh" <<'KATALIS_LIB'
          set -euo pipefail

          finish_test() {
            local rc=$1 status=failed
            trap - EXIT
            if [ "$rc" -eq 0 ]; then status=passed; fi
            echo "status=$status" >> "$GITHUB_OUTPUT"
            echo "duration=$(($(date +%s) - TEST_START))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          source_ref() {
            local lane=$1 component=$2 version=$3 sha=$4
            local src="$KATALIS_ROOT/work/$lane/$component"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
            mkdir -p "$src"
            git -C "$src" init -q
            git -C "$src" remote add origin "https://github.com/neonephos-katalis/opg-ewbi-$component.git"
            GIT_TERMINAL_PROMPT=0 timeout --kill-after=10s 120s git -c credential.helper= -C "$src" fetch --depth=1 origin "refs/tags/v$version:refs/tags/v$version"
            test "$(git -C "$src" rev-parse "v$version^{commit}")" = "$sha"
            git -C "$src" -c advice.detachedHead=false checkout -q --detach "$sha"
            test "$(git -C "$src" rev-parse HEAD)" = "$sha"
            echo "$component source: v$version $sha"
          }
          go_container() {
            local lane=$1 component=$2 network=$3 command=$4
            local workspace=off
            if [ "$lane" = baseline ]; then workspace=/work/baseline/go.work; fi
            timeout --signal=TERM --kill-after=20s 10m sudo -n docker run --rm \
              --name "$(basename "$KATALIS_ROOT")-$component-build" \
              --label "katalis.smoke=$(basename "$KATALIS_ROOT")" \
              --network "$network" --user "$(id -u):$(id -g)" \
              --cap-drop ALL --security-opt no-new-privileges --cpus 4 --memory 8g \
              -e GOTOOLCHAIN=local -e GOWORK="$workspace" -e CGO_ENABLED=0 \
              -e GOPROXY=https://proxy.golang.org -e GOSUMDB=sum.golang.org \
              -e GOCACHE=/work/cache/build -e GOMODCACHE=/work/cache/modules \
              -v "$KATALIS_ROOT/work:/work" -w "/work/$lane/$component" \
              "$PINNED_CONTAINER_IMAGE_GOLANG" bash -euo pipefail -c "$command"
          }
          build_component() {
            local lane=$1 component=$2 target=./cmd
            if [ "$component" = api ]; then target=./cmd/app; fi
            mkdir -p "$KATALIS_ROOT/work/bin/$lane"
            # The downloaded module graph is checksum-verified before an offline build.
            go_container "$lane" "$component" bridge 'go version; go mod download; go mod verify'
            go_container "$lane" "$component" none \
              "go mod verify; go build -mod=readonly -buildvcs=true -o /work/bin/$lane/$component $target"
            test -x "$KATALIS_ROOT/work/bin/$lane/$component"
            test -z "$(git -C "$KATALIS_ROOT/work/$lane/$component" status --porcelain)"
          }
          identity() {
            local lane=$1 component=$2 expected=$3 sha=$4
            local src="$KATALIS_ROOT/work/$lane/$component" binary="$KATALIS_ROOT/work/bin/$lane/$component"
            local tag info module_path
            test -x "$binary"
            test "$(git -C "$src" rev-parse HEAD)" = "$sha"
            test "$(git -C "$src" rev-parse "v$expected^{commit}")" = "$sha"
            test -z "$(git -C "$src" status --porcelain)"
            tag=$(git -C "$src" describe --tags --exact-match HEAD)
            test "$tag" = "v$expected"
            info=$(go_container "$lane" "$component" none "go version -m /work/bin/$lane/$component")
            printf '%s\n' "$info" > "$KATALIS_ROOT/work/bin/$lane/$component.buildinfo"
            module_path="github.com/neonephos-katalis/opg-ewbi-$component/cmd"
            if [ "$component" = api ]; then module_path="$module_path/app"; fi
            test "$(printf '%s\n' "$info" | awk '$1 == "path" {print $2}')" = "$module_path"
            for field in "vcs.revision=$sha" vcs.modified=false GOOS=linux GOARCH=arm64 CGO_ENABLED=0; do
              printf '%s\n' "$info" | awk -v wanted="$field" '$1 == "build" && $2 == wanted {found=1} END {exit !found}'
            done
            file "$binary"
            file "$binary" | grep -Eq 'ELF 64-bit.*ARM aarch64'
            sha256sum "$binary"
            echo "$component detected: ${tag#v} from $sha, clean Go VCS metadata"
            echo "${tag#v}" > "$KATALIS_ROOT/work/bin/$lane/$component.version"
          }
          interface_check() {
            local lane=$1
            timeout --kill-after=5s 10s "$KATALIS_ROOT/work/bin/$lane/operator" --help > "$KATALIS_ROOT/$lane-help.log" 2>&1
            grep -q -- '-health-probe-bind-address' "$KATALIS_ROOT/$lane-help.log"
            grep -q -- '-metrics-bind-address' "$KATALIS_ROOT/$lane-help.log"
            # The API has no help/version flags. Its required envconfig input is the interface.
            local rc=0
            timeout --kill-after=5s 10s env -i PATH=/usr/bin:/bin "$KATALIS_ROOT/work/bin/$lane/api" > "$KATALIS_ROOT/$lane-config.log" 2>&1 || rc=$?
            test "$rc" -eq 1
            grep -Fq 'required key CONTROLLER_NAMESPACE missing value' "$KATALIS_ROOT/$lane-config.log"
          }
          functional() (
            local lane=$1
            local state
            state=$(mktemp -d "$KATALIS_ROOT/runtime/$lane.XXXXXXXX")
            cleanup_runtime() {
              local rc=$?
              trap - EXIT
              if sudo -n docker container inspect "$(basename "$KATALIS_ROOT")-runtime" >/dev/null 2>&1; then
                sudo -n docker rm -f "$(basename "$KATALIS_ROOT")-runtime" || rc=1
              fi
              rm -rf "$state" || rc=1
              exit "$rc"
            }
            trap cleanup_runtime EXIT
            local rc=0
            timeout --signal=TERM --kill-after=20s 4m sudo -n docker run --rm \
              --name "$(basename "$KATALIS_ROOT")-runtime" \
              --label "katalis.smoke=$(basename "$KATALIS_ROOT")" \
              --init --network none --user "$(id -u):$(id -g)" \
              --cap-drop ALL --security-opt no-new-privileges --cpus 2 --memory 4g \
              -e TMPDIR=/state -v "$KATALIS_ROOT/work:/work:ro" \
              -v "$KATALIS_ROOT/assets:/assets:ro" -v "$state:/state" \
              "$PINNED_CONTAINER_IMAGE_GOLANG" /work/bin/katalis-smoke \
              -operator "/work/bin/$lane/operator" -api "/work/bin/$lane/api" \
              -crds "/work/$lane/operator/config/crd/bases" \
              -assets /assets/controller-tools/envtest -state /state || rc=$?
            if [ "$rc" -ne 0 ]; then
              for log in "$state"/*.log; do [ ! -f "$log" ] || tail -n 60 "$log"; done
            fi
            return "$rc"
          )
          if [ "$#" -gt 0 ]; then "$@"; fi
          KATALIS_LIB
          timeout --kill-after=20s 3m sudo -n docker pull "$PINNED_CONTAINER_IMAGE_GOLANG"
          test "$(sudo -n docker image inspect --format '{{.Architecture}}' "$PINNED_CONTAINER_IMAGE_GOLANG")" = arm64
          mkdir -p "$KATALIS_ROOT/assets"
          curl --proto '=https' --tlsv1.2 -fSL --connect-timeout 15 --max-time 120 --retry 2 \
            https://github.com/kubernetes-sigs/controller-tools/releases/download/envtest-v1.32.0/envtest-v1.32.0-linux-arm64.tar.gz \
            -o "$KATALIS_ROOT/envtest.tar.gz"
          echo "$ENVTEST_SHA512  $KATALIS_ROOT/envtest.tar.gz" | sha512sum -c -
          tar -xzf "$KATALIS_ROOT/envtest.tar.gz" -C "$KATALIS_ROOT/assets"
          for binary in etcd kube-apiserver kubectl; do
            file "$KATALIS_ROOT/assets/controller-tools/envtest/$binary" | grep -Eq 'ELF 64-bit.*ARM aarch64'
          done
          "$KATALIS_ROOT/assets/controller-tools/envtest/kube-apiserver" --version
          "$KATALIS_ROOT/assets/controller-tools/envtest/etcd" --version

      - name: Install Katalis baseline pair
        id: install
        continue-on-error: true
        run: |
          set -euo pipefail
          source "$KATALIS_ROOT/katalis-lib.sh"
          source_ref baseline operator "$BASELINE_VERSION" "$OPERATOR_BASELINE_SHA"
          source_ref baseline api "$BASELINE_VERSION" "$API_BASELINE_SHA"
          # The public v0.0.2 Go proxy snapshots differ from these Git tags. Build the
          # two exact, mutually required source modules together, without go.mod edits.
          cat > "$KATALIS_ROOT/work/baseline/go.work" <<'WORKSPACE'
          go 1.25.13
          use (
            ./operator
            ./api
          )
          WORKSPACE
          failed=0
          for component in operator api; do
            if ! bash "$KATALIS_ROOT/katalis-lib.sh" build_component baseline "$component"; then failed=1; fi
          done
          go_container baseline operator none 'go build -mod=readonly -o /work/bin/katalis-smoke /work/fixtures/katalis_smoke.go'
          test "$failed" -eq 0
          echo 'install_status=success' >> "$GITHUB_OUTPUT"

      - name: Get verified Katalis version
        id: version
        continue-on-error: true
        run: |
          set -euo pipefail
          source "$KATALIS_ROOT/katalis-lib.sh"
          identity baseline operator "$BASELINE_VERSION" "$OPERATOR_BASELINE_SHA"
          identity baseline api "$BASELINE_VERSION" "$API_BASELINE_SHA"
          operator=$(cat "$KATALIS_ROOT/work/bin/baseline/operator.version")
          api=$(cat "$KATALIS_ROOT/work/bin/baseline/api.version")
          test "$operator" = "$api"
          echo "version=$operator" >> "$GITHUB_OUTPUT"

      - name: Test 1 - Installed binaries for both components
        id: test1
        if: always()
        continue-on-error: true
        env:
          INSTALL_STATUS: ${{ steps.install.outputs.install_status }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            rc=$1
            trap - EXIT
            if [ "$rc" -eq 0 ]; then echo 'status=passed' >> "$GITHUB_OUTPUT"
            else echo 'status=failed' >> "$GITHUB_OUTPUT"; fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish "$?"' EXIT
          test -f "$KATALIS_ROOT/katalis-lib.sh"
          source "$KATALIS_ROOT/katalis-lib.sh"
          test "$INSTALL_STATUS" = success
          test -x "$KATALIS_ROOT/work/bin/baseline/operator"
          test -x "$KATALIS_ROOT/work/bin/baseline/api"
          finish 0

      - name: Test 2 - Version and source provenance
        id: test2
        if: always()
        continue-on-error: true
        env:
          DETECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            rc=$1
            trap - EXIT
            if [ "$rc" -eq 0 ]; then echo 'status=passed' >> "$GITHUB_OUTPUT"
            else echo 'status=failed' >> "$GITHUB_OUTPUT"; fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish "$?"' EXIT
          test -f "$KATALIS_ROOT/katalis-lib.sh"
          source "$KATALIS_ROOT/katalis-lib.sh"
          test "$DETECTED_VERSION" = "$BASELINE_VERSION"
          identity baseline operator "$BASELINE_VERSION" "$OPERATOR_BASELINE_SHA"
          identity baseline api "$BASELINE_VERSION" "$API_BASELINE_SHA"

          finish 0

      - name: Test 3 - Operator help and API configuration interface
        id: test3
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            rc=$1
            trap - EXIT
            if [ "$rc" -eq 0 ]; then echo 'status=passed' >> "$GITHUB_OUTPUT"
            else echo 'status=failed' >> "$GITHUB_OUTPUT"; fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish "$?"' EXIT
          test -f "$KATALIS_ROOT/katalis-lib.sh"
          source "$KATALIS_ROOT/katalis-lib.sh"
          interface_check baseline
          finish 0

      - name: Test 4 - Native host and artifact architectures
        id: test4
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            rc=$1
            trap - EXIT
            if [ "$rc" -eq 0 ]; then echo 'status=passed' >> "$GITHUB_OUTPUT"
            else echo 'status=failed' >> "$GITHUB_OUTPUT"; fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish "$?"' EXIT
          test -f "$KATALIS_ROOT/katalis-lib.sh"
          source "$KATALIS_ROOT/katalis-lib.sh"
          test "$(uname -m)" = aarch64
          for component in operator api; do
            file "$KATALIS_ROOT/work/bin/baseline/$component" | grep -Eq 'ELF 64-bit.*ARM aarch64'
          done
          finish 0

      - name: Test 5 - Federation API and operator reconciliation
        id: test5
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            rc=$1
            trap - EXIT
            if [ "$rc" -eq 0 ]; then echo 'status=passed' >> "$GITHUB_OUTPUT"
            else echo 'status=failed' >> "$GITHUB_OUTPUT"; fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish "$?"' EXIT
          test -f "$KATALIS_ROOT/katalis-lib.sh"
          source "$KATALIS_ROOT/katalis-lib.sh"
          functional baseline
          finish 0

      - name: Test 6 - Install and exercise newer component versions
        id: test6
        if: always()
        continue-on-error: true
        env:
          CURRENT_VERSION: ${{ steps.version.outputs.version || 'unknown' }}
          BASELINE_STATUS_1: ${{ steps.test1.outputs.status }}
          BASELINE_STATUS_2: ${{ steps.test2.outputs.status }}
          BASELINE_STATUS_3: ${{ steps.test3.outputs.status }}
          BASELINE_STATUS_4: ${{ steps.test4.outputs.status }}
          BASELINE_STATUS_5: ${{ steps.test5.outputs.status }}
          BASELINE_OUTCOME_1: ${{ steps.test1.outcome }}
          BASELINE_OUTCOME_2: ${{ steps.test2.outcome }}
          BASELINE_OUTCOME_3: ${{ steps.test3.outcome }}
          BASELINE_OUTCOME_4: ${{ steps.test4.outcome }}
          BASELINE_OUTCOME_5: ${{ steps.test5.outcome }}
        run: |
          set -euo pipefail
          for number in 1 2 3 4 5; do
            status="BASELINE_STATUS_$number" outcome="BASELINE_OUTCOME_$number"
            if [ "${!status:-}" != passed ] || [ "${!outcome:-}" != success ]; then
              {
                echo 'status=skipped'
                echo 'duration=0'
                echo 'decision=baseline_failed'
                echo "current_version=$CURRENT_VERSION"
                echo "latest_version=operator=$OPERATOR_NEXT_VERSION;api=$API_NEXT_VERSION"
                echo 'next_installed_version=operator=not_installed;api=not_installed'
                echo 'regression_result=Candidate installation was not attempted because baseline checks failed.'
                echo "comparison=Baseline $CURRENT_VERSION did not pass all five checks. Operator $OPERATOR_BASELINE_SHA and API $API_BASELINE_SHA were targeted; neither newer component was fetched or installed."
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          source "$KATALIS_ROOT/katalis-lib.sh"
          TEST_START=$(date +%s)
          export TEST_START
          decision=next_install_failed
          result='Candidate pair installation or identity verification failed on native Arm64.'
          operator=not_installed
          api=not_installed
          finish_regression() {
            rc=$?
            {
              echo "current_version=$CURRENT_VERSION"
              echo "latest_version=operator=$OPERATOR_NEXT_VERSION;api=$API_NEXT_VERSION"
              echo "next_installed_version=operator=$operator;api=$api"
              echo "decision=$decision"
              echo "regression_result=$result"
              echo "comparison=Baseline $CURRENT_VERSION (operator $OPERATOR_BASELINE_SHA; API $API_BASELINE_SHA). Candidates operator v$OPERATOR_NEXT_VERSION@$OPERATOR_NEXT_SHA and API v$API_NEXT_VERSION@$API_NEXT_SHA. Observed installs: operator=$operator;api=$api. $result"
            } >> "$GITHUB_OUTPUT"
            finish_test "$rc"
          }
          trap finish_regression EXIT
          python3 - <<'PY'
          import os, re
          def stable(name):
              value = os.environ[name]
              if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', value):
                  raise SystemExit(f'{name} is not a stable version: {value}')
              return tuple(map(int, value.split('.')))
          assert stable('OPERATOR_NEXT_VERSION') > stable('BASELINE_VERSION')
          assert stable('API_NEXT_VERSION') > stable('BASELINE_VERSION')
          PY
          # These are separate stable tags, not a shared Katalis release. Do not
          # override the candidate's API v1.0.8 dependency with the v1.0.3 source.
          # The published Go module remains available through the checksum database.
          failed=0
          for component in operator api; do
            if [ "$component" = operator ]; then version=$OPERATOR_NEXT_VERSION; sha=$OPERATOR_NEXT_SHA
            else version=$API_NEXT_VERSION; sha=$API_NEXT_SHA; fi
            if bash "$KATALIS_ROOT/katalis-lib.sh" source_ref candidate "$component" "$version" "$sha" && \
               bash "$KATALIS_ROOT/katalis-lib.sh" build_component candidate "$component" && \
               bash "$KATALIS_ROOT/katalis-lib.sh" identity candidate "$component" "$version" "$sha"; then
              detected=$(cat "$KATALIS_ROOT/work/bin/candidate/$component.version")
              if [ "$component" = operator ]; then operator=$detected; else api=$detected; fi
            else
              failed=1
            fi
          done
          test "$failed" -eq 0
          decision=next_regression_failed
          result='Both candidate binaries installed with verified identities; paired runtime validation failed.'
          interface_check candidate
          functional candidate
          decision=next_install_validated
          result='Both candidate versions built and installed natively; federation reads, zone subscription, deletion and operator reconciliation passed with both processes alive.'

      - name: Calculate test summary
        id: summary
        if: always()
        run: |
          set -euo pipefail
          statuses=(
            '${{ steps.test1.outputs.status }}' '${{ steps.test2.outputs.status }}'
            '${{ steps.test3.outputs.status }}' '${{ steps.test4.outputs.status }}'
            '${{ steps.test5.outputs.status }}' '${{ steps.test6.outputs.status }}'
          )
          outcomes=(
            '${{ steps.test1.outcome }}' '${{ steps.test2.outcome }}'
            '${{ steps.test3.outcome }}' '${{ steps.test4.outcome }}'
            '${{ steps.test5.outcome }}' '${{ steps.test6.outcome }}'
          )
          durations=(
            '${{ steps.test1.outputs.duration || '0' }}' '${{ steps.test2.outputs.duration || '0' }}'
            '${{ steps.test3.outputs.duration || '0' }}' '${{ steps.test4.outputs.duration || '0' }}'
            '${{ steps.test5.outputs.duration || '0' }}' '${{ steps.test6.outputs.duration || '0' }}'
          )
          decision='${{ steps.test6.outputs.decision }}'
          passed=0 failed=0 skipped=0 core_failed=0 duration=0
          for number in 1 2 3 4 5 6; do
            index=$((number - 1))
            if [ "${statuses[$index]}" = passed ] && [ "${outcomes[$index]}" = success ]; then
              passed=$((passed + 1))
            elif [ "$number" -eq 6 ] && [ "$core_failed" -gt 0 ] && \
                 [ "${statuses[$index]}" = skipped ] && [ "${outcomes[$index]}" = success ] && \
                 [ "$decision" = baseline_failed ] && [ "${durations[5]}" = 0 ]; then
              skipped=$((skipped + 1))
            else
              failed=$((failed + 1))
              if [ "$number" -le 5 ]; then core_failed=$((core_failed + 1)); fi
            fi
            value=${durations[$index]}
            if [[ "$value" =~ ^[0-9]{1,6}$ ]]; then duration=$((duration + 10#$value)); fi
          done
          overall=failure badge=failing
          if [ "$failed" -eq 0 ]; then overall=success; fi
          if [ "$core_failed" -eq 0 ]; then badge=passing; fi
          {
            echo "passed=$passed"
            echo "failed=$failed"
            echo "core_failed=$core_failed"
            echo "skipped=$skipped"
            echo "duration=$duration"
            echo "overall_status=$overall"
            echo "badge_status=$badge"
          } >> "$GITHUB_OUTPUT"
          test "$failed" -eq 0

      - name: Create test summary
        if: always()
        env:
          VERSION: ${{ steps.version.outputs.version || 'unknown' }}
          STATUS: ${{ steps.summary.outputs.overall_status || 'failure' }}
          PASSED: ${{ steps.summary.outputs.passed || '0' }}
          FAILED: ${{ steps.summary.outputs.failed || '6' }}
          SKIPPED: ${{ steps.summary.outputs.skipped || '0' }}
          DURATION: ${{ steps.summary.outputs.duration || '0' }}
          REGRESSION: ${{ steps.test6.outputs.comparison || 'Candidate pair validation did not complete.' }}
        run: |
          set -euo pipefail
          {
            echo '## Katalis Native Arm64 Test Results'
            echo "- Baseline (both components): $VERSION"
            echo "- Operator source: $OPERATOR_BASELINE_SHA"
            echo "- API source: $API_BASELINE_SHA"
            echo "- Status: $STATUS; passed: $PASSED; failed: $FAILED; skipped: $SKIPPED; duration: ${DURATION}s"
            echo '- Runner: ubuntu-24.04-arm; Kubernetes 1.32.0 disposable control plane'
            echo "- Regression: $REGRESSION"
            echo '- Scope: federation resource lifecycle with real API and operator processes. External orchestrators, identity-provider integration, and application deployment are not exercised.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean isolated Katalis resources
        if: always()
        run: |
          set -euo pipefail
          if [[ "${KATALIS_ROOT:-}" =~ ^/tmp/katalis-smoke\.[a-zA-Z0-9]+$ ]]; then
            mapfile -t containers < <(sudo -n docker ps -aq --filter "label=katalis.smoke=$(basename "$KATALIS_ROOT")")
            if [ "${#containers[@]}" -gt 0 ]; then sudo -n docker rm -f "${containers[@]}"; fi
            if [ -d "$KATALIS_ROOT/work/cache" ]; then chmod -R u+w "$KATALIS_ROOT/work/cache"; fi
            rm -rf "$KATALIS_ROOT"
          fi

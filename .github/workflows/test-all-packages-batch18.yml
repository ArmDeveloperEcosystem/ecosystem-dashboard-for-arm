name: Test All Packages (Batch 18) on Arm64
run-name: Arm64 Batch 18 [${{ inputs.orchestration_id || format('manual-{0}-{1}', github.run_id, github.run_attempt) }}] [nonce:${{ inputs.dispatch_nonce || 'manual-only' }}]

on:
  workflow_dispatch:
    inputs:
      orchestration_id:
        description: Exact orchestrator identity; blank uses a safe manual fallback
        required: false
        default: ""
        type: string
      dispatch_nonce:
        description: Secret exact-dispatch nonce; blank is manual-only and not publishable
        required: false
        default: ""
        type: string
      expected_sha:
        description: Exact commit expected by the orchestrator
        required: false
        default: ""
        type: string
      expected_branch:
        description: Exact branch expected by the orchestrator
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      orchestration_id:
        required: true
        type: string
      dispatch_nonce:
        required: true
        type: string
      expected_sha:
        required: true
        type: string
      expected_branch:
        required: true
        type: string

permissions:
  contents: read

jobs:

  test-qdrant:
    uses: ./.github/workflows/test-qdrant.yml

  test-libjpeg:
    uses: ./.github/workflows/test-libjpeg.yml

  test-signalfx-agent:
    uses: ./.github/workflows/test-signalfx-agent.yml

  test-libevent:
    uses: ./.github/workflows/test-libevent.yml

  test-smcpp:
    uses: ./.github/workflows/test-smcpp.yml

  test-pilon:
    uses: ./.github/workflows/test-pilon.yml

  test-dronecli:
    uses: ./.github/workflows/test-DroneCli.yml

  test-nmon:
    uses: ./.github/workflows/test-nmon.yml

  test-sensu:
    uses: ./.github/workflows/test-sensu.yml

  test-milvus:
    uses: ./.github/workflows/test-milvus.yml

  test-nextjs:
    uses: ./.github/workflows/test-nextjs.yml

  test-figlet:
    uses: ./.github/workflows/test-figlet.yml

  test-nemo:
    uses: ./.github/workflows/test-nemo.yml

  test-nfs:
    uses: ./.github/workflows/test-nfs.yml

  test-ruby:
    uses: ./.github/workflows/test-ruby.yml

  test-neo4j:
    uses: ./.github/workflows/test-neo4j.yml

  test-kvm:
    uses: ./.github/workflows/test-kvm.yml

  test-gerrit:
    uses: ./.github/workflows/test-gerrit.yml

  test-grafana:
    uses: ./.github/workflows/test-grafana.yml

  test-kunpeng_acceleration_engine:
    uses: ./.github/workflows/test-Kunpeng_Acceleration_Engine.yml

  test-deepstreamhub:
    uses: ./.github/workflows/test-deepstreamHub.yml

  test-snappy-java:
    uses: ./.github/workflows/test-snappy-java.yml

  test-itp:
    uses: ./.github/workflows/test-itp.yml

  test-bazel:
    uses: ./.github/workflows/test-bazel.yml

  test-ssdb:
    uses: ./.github/workflows/test-ssdb.yml

  test-vvdec:
    uses: ./.github/workflows/test-vvdec.yml

  test-brotli:
    uses: ./.github/workflows/test-brotli.yml

  test-libgav1:
    uses: ./.github/workflows/test-libgav1.yml

  test-trivy:
    uses: ./.github/workflows/test-trivy.yml

  test-spinnaker:
    uses: ./.github/workflows/test-spinnaker.yml

  test-gcc:
    uses: ./.github/workflows/test-gcc.yml

  test-etcd:
    uses: ./.github/workflows/test-etcd.yml

  test-sas-kernel:
    uses: ./.github/workflows/test-SAS-Kernel.yml

  test-ramalama:
    uses: ./.github/workflows/test-ramalama.yml

  test-pmdk:
    uses: ./.github/workflows/test-pmdk.yml

  test-cadvisor:
    uses: ./.github/workflows/test-cadvisor.yml

  test-bytebase:
    uses: ./.github/workflows/test-bytebase.yml

  test-mojo:
    uses: ./.github/workflows/test-mojo.yml

  test-kubeflow:
    uses: ./.github/workflows/test-kubeflow.yml

  test-krb5:
    uses: ./.github/workflows/test-krb5.yml

  test-openhpc:
    uses: ./.github/workflows/test-openHPC.yml

  test-dot-net:
    uses: ./.github/workflows/test-dot-net.yml

  test-deeptools:
    uses: ./.github/workflows/test-deeptools.yml

  test-nmap:
    uses: ./.github/workflows/test-nmap.yml

  test-lammps:
    uses: ./.github/workflows/test-lammps.yml

  summary:
    permissions:
      actions: read
      contents: read
    needs:
      [
        test-qdrant,
        test-libjpeg,
        test-signalfx-agent,
        test-libevent,
        test-smcpp,
        test-pilon,
        test-dronecli,
        test-nmon,
        test-sensu,
        test-milvus,
        test-nextjs,
        test-figlet,
        test-nemo,
        test-nfs,
        test-ruby,
        test-neo4j,
        test-kvm,
        test-gerrit,
        test-grafana,
        test-kunpeng_acceleration_engine,
        test-deepstreamhub,
        test-snappy-java,
        test-itp,
        test-bazel,
        test-ssdb,
        test-vvdec,
        test-brotli,
        test-libgav1,
        test-trivy,
        test-spinnaker,
        test-gcc,
        test-etcd,
        test-sas-kernel,
        test-ramalama,
        test-pmdk,
        test-cadvisor,
        test-bytebase,
        test-mojo,
        test-kubeflow,
        test-krb5,
        test-openhpc,
        test-dot-net,
        test-deeptools,
        test-nmap,
        test-lammps
      ]
    runs-on: ubuntu-24.04-arm
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect batch results
        id: collect
        uses: ./.github/actions/collect-batch-results
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        with:
          batch_number: "18"
          batch_title: "Batch 18"

      - name: Attest complete batch results
        id: attest
        if: steps.collect.outcome == 'success'
        env:
          ARTIFACT_NAME: batch18-test-results
          BATCH_NUMBER: "18"
          COLLECTOR_JSON_COUNT: ${{ steps.collect.outputs.json_count }}
          CURRENT_BRANCH: ${{ github.ref_name }}
          DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
          EXPECTED_BRANCH: ${{ inputs.expected_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          NEEDS_JSON: ${{ toJson(needs) }}
          ORCHESTRATION_ID: ${{ inputs.orchestration_id }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/batch_artifact_attestation.py create \
            --results-root test-results \
            --workflow-file ".github/workflows/test-all-packages-batch18.yml" \
            --batch "$BATCH_NUMBER" \
            --repository "$REPOSITORY" \
            --expected-branch "$EXPECTED_BRANCH" \
            --current-branch "$CURRENT_BRANCH" \
            --expected-sha "$EXPECTED_SHA" \
            --workflow-sha "$WORKFLOW_SHA" \
            --orchestration-id "$ORCHESTRATION_ID" \
            --dispatch-nonce "$DISPATCH_NONCE" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --artifact-name "$ARTIFACT_NAME" \
            --collector-json-count "$COLLECTOR_JSON_COUNT" \
            --needs-environment-variable NEEDS_JSON

      - name: Upload batch test results
        if: steps.collect.outcome == 'success' && steps.attest.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: batch18-test-results
          path: test-results
          retention-days: 90

name: Test Apache Iceberg on Arm64

permissions:
  contents: read

on:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-iceberg.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-iceberg.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-iceberg.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-iceberg.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-iceberg.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-iceberg.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-iceberg.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-iceberg.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-iceberg.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-iceberg.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-iceberg.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-iceberg.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-iceberg.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-iceberg.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-iceberg.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-iceberg.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-iceberg.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-iceberg.outputs.regression_next_installed_version }}
      regression_policy:
        description: Regression applicability policy classification
        value: ${{ jobs.test-iceberg.outputs.regression_policy }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-iceberg.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-iceberg.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-iceberg.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-iceberg.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-iceberg.outputs.timestamp }}

jobs:
  test-iceberg:
    runs-on: ubuntu-24.04-arm
    env:
      BASELINE_VERSION: "1.1.0"
      PACKAGE_SLUG: "iceberg"
      LANE_KIND: "github release / source-build-or-tarball"
      DOWNLOAD_URL: "https://github.com/apache/iceberg/releases"
      HOMEPAGE_URL: "https://iceberg.apache.org/"
      OFFICIAL_DOCS: "https://iceberg.apache.org/docs/nightly/"
      GITHUB_REPO: "apache/iceberg"
      EXTRA_TAG_CANDIDATES: "apache-iceberg-1.1.0"
      TEST1_COMMAND: >-
        test -f README.md && test -f build.gradle && test -f settings.gradle && test -f gradlew && test -d core && test "$RESOLVED_TAG" = "apache-iceberg-1.1.0"
      TEST3_COMMAND: >-
        test -d docs && test -d examples && grep -Fq './gradlew build' README.md
      TEST5_COMMAND: |
        test "$(uname -m)" = "aarch64"
        SMOKE_DIR=$(mktemp -d "$RUNNER_TEMP/iceberg-smoke.XXXXXX")
        trap 'rm -rf "$SMOKE_DIR"' EXIT
        cd "$SMOKE_DIR"
        cat > pom.xml <<XML
        <project xmlns="http://maven.apache.org/POM/4.0.0">
          <modelVersion>4.0.0</modelVersion>
          <groupId>arm.smoke</groupId><artifactId>iceberg-smoke</artifactId><version>1</version>
          <dependencies>
            <dependency><groupId>org.apache.iceberg</groupId><artifactId>iceberg-core</artifactId><version>$BASELINE_VERSION</version></dependency>
            <dependency><groupId>org.apache.hadoop</groupId><artifactId>hadoop-common</artifactId><version>3.3.4</version></dependency>
            <dependency><groupId>org.slf4j</groupId><artifactId>slf4j-simple</artifactId><version>1.7.36</version></dependency>
          </dependencies>
        </project>
        XML
        timeout 300s mvn -B -ntp org.apache.maven.plugins:maven-dependency-plugin:3.6.1:build-classpath -Dmdep.outputFile=classpath.txt
        cat > IcebergSmoke.java <<'JAVA'
        import java.nio.file.Paths;
        import org.apache.iceberg.IcebergBuild;
        import org.apache.iceberg.Schema;
        import org.apache.iceberg.Table;
        import org.apache.iceberg.hadoop.HadoopTables;
        import org.apache.iceberg.types.Types;

        public class IcebergSmoke {
          public static void main(String[] args) {
            if (!IcebergBuild.version().equals(args[0])) {
              throw new AssertionError("Unexpected Iceberg version: " + IcebergBuild.version());
            }
            String location = Paths.get("table").toAbsolutePath().toUri().toString();
            HadoopTables tables = new HadoopTables();
            Schema schema = new Schema(Types.NestedField.required(1, "id", Types.LongType.get()));
            Table table = tables.create(schema, location);
            if (!tables.exists(location) || !table.schema().sameSchema(schema)) {
              throw new AssertionError("Created table schema did not match");
            }
            table.updateSchema().addColumn("value", Types.StringType.get()).commit();
            table.updateProperties().set("arm.smoke", "committed").commit();
            Table reopened = new HadoopTables().load(location);
            if (reopened.schema().columns().size() != 2
                || !Types.StringType.get().equals(reopened.schema().findType("value"))
                || !"committed".equals(reopened.properties().get("arm.smoke"))) {
              throw new AssertionError("Committed table metadata did not survive reload");
            }
            if (!tables.dropTable(location) || tables.exists(location)) {
              throw new AssertionError("Table was not dropped");
            }
            System.out.println("Iceberg " + IcebergBuild.version() + ": create, alter, reload and drop passed");
          }
        }
        JAVA
        CLASSPATH=$(cat classpath.txt)
        timeout 60s javac -cp "$CLASSPATH" IcebergSmoke.java
        timeout 60s java -cp ".:$CLASSPATH" IcebergSmoke "$BASELINE_VERSION"
        echo "note=Compiled and executed Iceberg $BASELINE_VERSION on Arm64: created a local HadoopTables table, committed schema and property changes, reloaded and verified them, then dropped the table. No engine integration or data-file read/write is claimed." >> "$GITHUB_OUTPUT"

    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'Apache Iceberg'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      regression_policy: "applicable"
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=iceberg" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/linux/opensource_packages/iceberg" >> "$GITHUB_OUTPUT"

      - name: Bootstrap baseline dependencies
        uses: ./.github/actions/apt-bootstrap
        with:
          packages: "git curl jq tar unzip file ca-certificates openjdk-17-jdk-headless maven"
          extra_packages: "${{ env.EXTRA_APT_PACKAGES }}"
          quiet: "true"

      - name: Install baseline source or artifact
        id: install
        run: |
          set -euo pipefail
          rm -rf baseline-src baseline-external
          mkdir -p baseline-src baseline-external
          if [ -n "$GITHUB_REPO" ]; then
            RESOLVED_TAG=""
            CANDIDATE_TAGS="$BASELINE_VERSION|v$BASELINE_VERSION"
            if [ -n "${EXTRA_TAG_CANDIDATES:-}" ]; then
              CANDIDATE_TAGS="${CANDIDATE_TAGS}|${EXTRA_TAG_CANDIDATES}"
            fi
            OLD_IFS="$IFS"
            IFS='|'
            for CANDIDATE in $CANDIDATE_TAGS; do
              [ -n "$CANDIDATE" ] || continue
              if git ls-remote --tags --refs "https://github.com/$GITHUB_REPO.git" "refs/tags/$CANDIDATE" | grep -q .; then
                RESOLVED_TAG="$CANDIDATE"
                break
              fi
            done
            IFS="$OLD_IFS"
            if [ -n "$RESOLVED_TAG" ]; then
              git clone --depth 1 --branch "$RESOLVED_TAG" "https://github.com/$GITHUB_REPO.git" baseline-src >/dev/null 2>&1 || true
              echo "resolved_tag=$RESOLVED_TAG" >> "$GITHUB_OUTPUT"
            else
              git clone --depth 1 "https://github.com/$GITHUB_REPO.git" baseline-src >/dev/null 2>&1 || true
              echo "resolved_tag=default_branch" >> "$GITHUB_OUTPUT"
            fi
            if [ -d baseline-src/.git ] || [ -f baseline-src/README.md ] || [ -n "$(find baseline-src -mindepth 1 -maxdepth 2 -print -quit 2>/dev/null)" ]; then
              echo "install_mode=github_source" >> "$GITHUB_OUTPUT"
              echo "install_status=success" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if curl -fsLI "$DOWNLOAD_URL" >/dev/null 2>&1 || curl -fsLI "$HOMEPAGE_URL" >/dev/null 2>&1; then
            {
              echo "download=$DOWNLOAD_URL"
              echo "homepage=$HOMEPAGE_URL"
              echo "docs=$OFFICIAL_DOCS"
            } > baseline-external/metadata.txt
            echo "resolved_tag=external_artifact" >> "$GITHUB_OUTPUT"
            echo "install_mode=external_artifact" >> "$GITHUB_OUTPUT"
            echo "install_status=success" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "install_mode=unresolved" >> "$GITHUB_OUTPUT"
          echo "install_status=failed" >> "$GITHUB_OUTPUT"
          exit 1
      - name: Get baseline version
        id: version
        run: |
          echo "version=$BASELINE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected baseline version: $BASELINE_VERSION"

      - name: Test 1 - Baseline package evidence
        id: test1
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          MODE="${{ steps.install.outputs.install_mode || '' }}"
          RESOLVED_TAG="${{ steps.install.outputs.resolved_tag || '' }}"
          INSTALL_STATUS="${{ steps.install.outputs.install_status || 'failed' }}"
          DOC_PATH="content/linux/opensource_packages/${PACKAGE_SLUG}.md"
          if [ "$INSTALL_STATUS" != "success" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$MODE" = "github_source" ]; then
            cd baseline-src
          fi
          eval "$TEST1_COMMAND"
          if [ "$MODE" = "github_source" ] && [ "$RESOLVED_TAG" = "default_branch" ]; then
            echo "note=Upstream source smoke used the default branch because no exact source tag matched the published baseline version." >> "$GITHUB_OUTPUT"
          fi
          echo "status=passed" >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
      - name: Test 2 - Baseline version and release alignment
        id: test2
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          DOC_PATH="content/linux/opensource_packages/${PACKAGE_SLUG}.md"
          export DOC_PATH BASELINE_VERSION DOWNLOAD_URL
          python3 -c "from pathlib import Path; import os; text=Path(os.environ['DOC_PATH']).read_text(); version=os.environ['BASELINE_VERSION']; download=os.environ['DOWNLOAD_URL']; assert f'version_number: {version}' in text; assert f'download_url: {download}' in text"
          echo "status=passed" >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
      - name: Test 3 - Package-specific source or docs evidence
        id: test3
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          MODE="${{ steps.install.outputs.install_mode || '' }}"
          DOC_PATH="content/linux/opensource_packages/${PACKAGE_SLUG}.md"
          if [ "$MODE" = "github_source" ]; then
            cd baseline-src
          fi
          eval "$TEST3_COMMAND"
          echo "status=passed" >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
      - name: Test 4 - Arm64 support gate
        id: test4
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          DOC_PATH="content/linux/opensource_packages/${PACKAGE_SLUG}.md"
          test "$(uname -m)" = "aarch64"
          grep -Fq "works_on_arm: true" "$DOC_PATH"
          if [ -n "${TEST4_COMMAND:-}" ]; then
            eval "$TEST4_COMMAND"
          fi
          echo "status=passed" >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
      - name: Test 5 - Bounded package-specific smoke
        id: test5
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          trap 'echo "status=failed" >> "$GITHUB_OUTPUT"; echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"' ERR
          MODE="${{ steps.install.outputs.install_mode || '' }}"
          DOC_PATH="content/linux/opensource_packages/${PACKAGE_SLUG}.md"
          if [ "$MODE" = "github_source" ]; then
            cd baseline-src
          fi
          eval "$TEST5_COMMAND"
          trap - ERR
          echo "status=passed" >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
      - name: Test 6 - Regression Validation
        id: test6
        uses: ./.github/actions/generic-source-regression-check
        with:
          baseline_version: ${{ steps.version.outputs.version || env.BASELINE_VERSION }}
          github_repo: ${{ env.GITHUB_REPO }}
          lane_kind: ${{ env.LANE_KIND }}
          next_version_override: "1.10.1"
          candidate_tag_override: "apache-iceberg-1.10.1"
          limited_cpu_probe: |
            test "$CANDIDATE_TAG" = "apache-iceberg-$LATEST_VERSION"
            test -d next-src/core
            test -f next-src/build.gradle
            test -f next-src/settings.gradle
            python3 - <<'PY'
            from pathlib import Path
            settings = Path("next-src/settings.gradle").read_text(encoding="utf-8", errors="ignore")
            assert Path("next-src/core").is_dir()
            assert "iceberg-core" in settings or "core" in settings
            PY
            BASELINE_VERSION="$LATEST_VERSION" bash -euo pipefail -c "$TEST5_COMMAND"
          limited_cpu_description: "Candidate validation requires the Apache Iceberg 1.10.1 checkout and a compiled Arm64 smoke against its Maven artifact that verifies runtime version and local HadoopTables create, alter, reload and drop. No full Gradle build, engine integration, or data-file read/write is claimed."
      - name: Calculate test summary
        id: summary
        if: always()
        run: |
          set -euo pipefail
          PASSED=0
          FAILED=0
          SKIPPED=0
          CORE_FAILED=0
          DURATION=0
          check_core_test() {
            if [ "$1" = "passed" ] && [ "$3" = "success" ]; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
              CORE_FAILED=$((CORE_FAILED + 1))
            fi
            DURATION=$((DURATION + $2))
          }
          check_core_test "${{ steps.test1.outputs.status || 'failed' }}" "${{ steps.test1.outputs.duration || '0' }}" "${{ steps.test1.outcome }}"
          check_core_test "${{ steps.test2.outputs.status || 'failed' }}" "${{ steps.test2.outputs.duration || '0' }}" "${{ steps.test2.outcome }}"
          check_core_test "${{ steps.test3.outputs.status || 'failed' }}" "${{ steps.test3.outputs.duration || '0' }}" "${{ steps.test3.outcome }}"
          check_core_test "${{ steps.test4.outputs.status || 'failed' }}" "${{ steps.test4.outputs.duration || '0' }}" "${{ steps.test4.outcome }}"
          check_core_test "${{ steps.test5.outputs.status || 'failed' }}" "${{ steps.test5.outputs.duration || '0' }}" "${{ steps.test5.outcome }}"
          T6="${{ steps.test6.outputs.status || 'failed' }}"
          O6="${{ steps.test6.outcome }}"
          if [ "$T6" = "passed" ] && [ "$O6" = "success" ]; then
            PASSED=$((PASSED + 1))
          elif [ "$T6" = "skipped" ] && [ "$O6" = "success" ]; then
            SKIPPED=$((SKIPPED + 1))
          else
            FAILED=$((FAILED + 1))
          fi
          DURATION=$((DURATION + ${{ steps.test6.outputs.duration || '0' }}))
          OVERALL_STATUS=failure
          BADGE_STATUS=failing
          if [ "$FAILED" -eq 0 ]; then
            OVERALL_STATUS=success
            BADGE_STATUS=passing
          fi
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"
          echo "core_failed=$CORE_FAILED" >> "$GITHUB_OUTPUT"
          echo "overall_status=$OVERALL_STATUS" >> "$GITHUB_OUTPUT"
          echo "badge_status=$BADGE_STATUS" >> "$GITHUB_OUTPUT"
          test "$FAILED" -eq 0

name: Test All Packages (Batch 5) on Arm64
run-name: Arm64 Batch 5 [${{ inputs.orchestration_id || format('manual-{0}-{1}', github.run_id, github.run_attempt) }}] [nonce:${{ inputs.dispatch_nonce || 'manual-only' }}]

on:
  workflow_dispatch:
    inputs:
      orchestration_id:
        description: Exact orchestrator identity; blank uses a safe manual fallback
        required: false
        default: ""
        type: string
      dispatch_nonce:
        description: Secret exact-dispatch nonce; blank is manual-only and not publishable
        required: false
        default: ""
        type: string
      expected_sha:
        description: Exact commit expected by the orchestrator
        required: false
        default: ""
        type: string
      expected_branch:
        description: Exact branch expected by the orchestrator
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      orchestration_id:
        required: true
        type: string
      dispatch_nonce:
        required: true
        type: string
      expected_sha:
        required: true
        type: string
      expected_branch:
        required: true
        type: string

permissions:
  contents: read

jobs:

  test-split-evaluator:
    uses: ./.github/workflows/test-split-evaluator.yml

  test-vtk:
    uses: ./.github/workflows/test-vtk.yml

  test-cinder:
    uses: ./.github/workflows/test-cinder.yml

  test-tornado:
    uses: ./.github/workflows/test-tornado.yml

  test-boringssl:
    uses: ./.github/workflows/test-boringssl.yml

  test-libx265:
    uses: ./.github/workflows/test-libx265.yml

  test-monkey:
    uses: ./.github/workflows/test-monkey.yml

  test-keepalived:
    uses: ./.github/workflows/test-keepalived.yml

  test-rocksdbjni:
    uses: ./.github/workflows/test-rocksdbjni.yml

  test-scikit-learn:
    uses: ./.github/workflows/test-scikit-learn.yml

  test-quartz:
    uses: ./.github/workflows/test-quartz.yml

  test-chromium:
    uses: ./.github/workflows/test-chromium.yml

  test-kolla:
    uses: ./.github/workflows/test-kolla.yml

  test-snapcraft:
    uses: ./.github/workflows/test-snapcraft.yml

  test-flink:
    uses: ./.github/workflows/test-flink.yml

  test-debian_elts:
    uses: ./.github/workflows/test-debian_elts.yml

  test-uv:
    uses: ./.github/workflows/test-uv.yml

  test-squid:
    uses: ./.github/workflows/test-squid.yml

  test-buildkite-agent:
    uses: ./.github/workflows/test-buildkite-agent.yml

  test-istio:
    uses: ./.github/workflows/test-istio.yml

  test-evalml:
    uses: ./.github/workflows/test-evalml.yml

  test-redundans:
    uses: ./.github/workflows/test-Redundans.yml

  test-lightgbm:
    uses: ./.github/workflows/test-lightgbm.yml

  test-xerces:
    uses: ./.github/workflows/test-xerces.yml

  test-rethinkdb:
    uses: ./.github/workflows/test-rethinkdb.yml

  test-tensorflow-serving:
    uses: ./.github/workflows/test-tensorflow-serving.yml

  test-horovod-uber:
    uses: ./.github/workflows/test-horovod-uber.yml

  test-fftw:
    uses: ./.github/workflows/test-fftw.yml

  test-unleash:
    uses: ./.github/workflows/test-unleash.yml

  test-cp2k:
    uses: ./.github/workflows/test-CP2K.yml

  test-yarn:
    uses: ./.github/workflows/test-yarn.yml

  test-multipass:
    uses: ./.github/workflows/test-multipass.yml

  test-rancher:
    uses: ./.github/workflows/test-rancher.yml

  test-fltk:
    uses: ./.github/workflows/test-fltk.yml

  test-flux:
    uses: ./.github/workflows/test-flux.yml

  test-hping:
    uses: ./.github/workflows/test-hping.yml

  test-freebsd:
    uses: ./.github/workflows/test-freebsd.yml

  test-nfcore:
    uses: ./.github/workflows/test-nfcore.yml

  test-v8-javascript:
    uses: ./.github/workflows/test-v8-javascript.yml

  test-openfeature_go:
    uses: ./.github/workflows/test-openfeature_go.yml

  test-apache_knox:
    uses: ./.github/workflows/test-apache_knox.yml

  test-cccl:
    uses: ./.github/workflows/test-cccl.yml

  test-chiaki-ng:
    uses: ./.github/workflows/test-chiaki-ng.yml

  test-clara-viz:
    uses: ./.github/workflows/test-clara-viz.yml

  summary:
    permissions:
      actions: read
      contents: read
    needs:
      [
        test-split-evaluator,
        test-vtk,
        test-cinder,
        test-tornado,
        test-boringssl,
        test-libx265,
        test-monkey,
        test-keepalived,
        test-rocksdbjni,
        test-scikit-learn,
        test-quartz,
        test-chromium,
        test-kolla,
        test-snapcraft,
        test-flink,
        test-debian_elts,
        test-uv,
        test-squid,
        test-buildkite-agent,
        test-istio,
        test-evalml,
        test-redundans,
        test-lightgbm,
        test-xerces,
        test-rethinkdb,
        test-tensorflow-serving,
        test-horovod-uber,
        test-fftw,
        test-unleash,
        test-cp2k,
        test-yarn,
        test-multipass,
        test-rancher,
        test-fltk,
        test-flux,
        test-hping,
        test-freebsd,
        test-nfcore,
        test-v8-javascript,
        test-openfeature_go,
        test-apache_knox,
        test-cccl,
        test-chiaki-ng,
        test-clara-viz
      ]
    runs-on: ubuntu-24.04-arm
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # original: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Collect batch results
        id: collect
        uses: ./.github/actions/collect-batch-results
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        with:
          batch_number: "5"
          batch_title: "Batch 5"

      - name: Attest complete batch results
        id: attest
        if: steps.collect.outcome == 'success'
        env:
          ARTIFACT_NAME: batch5-test-results
          BATCH_NUMBER: "5"
          COLLECTOR_JSON_COUNT: ${{ steps.collect.outputs.json_count }}
          CURRENT_BRANCH: ${{ github.ref_name }}
          DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
          EXPECTED_BRANCH: ${{ inputs.expected_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          NEEDS_JSON: ${{ toJson(needs) }}
          ORCHESTRATION_ID: ${{ inputs.orchestration_id }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/batch_artifact_attestation.py create \
            --results-root test-results \
            --workflow-file ".github/workflows/test-all-packages-batch5.yml" \
            --batch "$BATCH_NUMBER" \
            --repository "$REPOSITORY" \
            --expected-branch "$EXPECTED_BRANCH" \
            --current-branch "$CURRENT_BRANCH" \
            --expected-sha "$EXPECTED_SHA" \
            --workflow-sha "$WORKFLOW_SHA" \
            --orchestration-id "$ORCHESTRATION_ID" \
            --dispatch-nonce "$DISPATCH_NONCE" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --artifact-name "$ARTIFACT_NAME" \
            --collector-json-count "$COLLECTOR_JSON_COUNT" \
            --needs-environment-variable NEEDS_JSON

      - name: Upload batch test results
        if: steps.collect.outcome == 'success' && steps.attest.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # original: actions/upload-artifact@v4.6.2
        with:
          name: batch5-test-results
          path: test-results
          retention-days: 90

name: Dashboard CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dashboard-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dashboard-build:
    name: Dashboard build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the proposed merge without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          submodules: true
          fetch-depth: 0
          persist-credentials: false

      - name: Bind the authenticated pull-request merge and detect scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$(git rev-parse --verify 'HEAD^{commit}')" == "$GITHUB_SHA" ]] || exit 1
          [[ "$(git rev-parse HEAD^1)" == "$BASE_SHA" ]] || exit 1
          [[ "$(git rev-parse HEAD^2)" == "$HEAD_SHA" ]] || exit 1
          python3 .github/scripts/ci_change_scope.py \
            --base "$BASE_SHA" --head "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Test dashboard routing and reviewed-data gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/scripts/tests -p 'test_ci_change_scope.py' -v
          python3 -m unittest discover -s .github/scripts/tests -p 'test_generated_site_data_review_contract.py' -v

      - name: Set up pinned preprocessing Python
        if: steps.scope.outputs.dashboard == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install hash-locked preprocessing dependency
        if: steps.scope.outputs.dashboard == 'true'
        run: >-
          python3 -m pip install
          --disable-pip-version-check
          --no-deps
          --only-binary=:all:
          --require-hashes
          --requirement .github/scripts/generated-site-data-requirements.txt

      - name: Setup Hugo
        if: steps.scope.outputs.dashboard == 'true'
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: '0.130.0'
          extended: true

      - name: Python pre-processing
        if: steps.scope.outputs.dashboard == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 ./build_steps/update_category_mappings.py
          python3 ./build_steps/update_recently_added_json.py
          python3 ./build_steps/validate_package_catagories.py

      - name: Require reviewed generated site data
        if: steps.scope.outputs.dashboard == 'true'
        shell: bash
        run: |
          set -euo pipefail
          generated_paths=(
            data/category_data.yml
            data/category_data_windows.yml
            data/recently_added_packages.yaml
          )
          if ! git diff --quiet HEAD -- "${generated_paths[@]}"; then
            git diff -- "${generated_paths[@]}"
            echo "Generated site data differs from the reviewed repository bytes." >&2
            echo "Include reviewed generated site data in this pull request before merging." >&2
            exit 1
          fi
          [[ -z "$(git ls-files --others --exclude-standard -- "${generated_paths[@]}")" ]] || {
            echo "Generated site data contains an unreviewed untracked file." >&2
            exit 1
          }
          if ! git diff --quiet HEAD -- || [[ -n "$(git ls-files --others --exclude-standard)" ]]; then
            git status --short
            echo "Preprocessing left unexpected repository changes." >&2
            exit 1
          fi

      - name: Build the proposed dashboard without deployment credentials
        if: steps.scope.outputs.dashboard == 'true'
        run: hugo --minify --config config.toml,config.cloudfront.toml

      - name: Report smoke-only scope
        if: steps.scope.outputs.dashboard == 'false'
        run: echo 'Smoke-only change; dashboard build is not needed.'

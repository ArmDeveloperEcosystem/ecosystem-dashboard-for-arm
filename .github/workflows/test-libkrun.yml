name: Test libkrun native Arm64 library and API health

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-libkrun.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-libkrun.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-libkrun.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-libkrun.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-libkrun.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-libkrun.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-libkrun.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-libkrun.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-libkrun.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-libkrun.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-libkrun.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-libkrun.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-libkrun.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-libkrun.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-libkrun.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-libkrun.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-libkrun.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-libkrun.outputs.regression_next_installed_version }}
      regression_policy:
        description: Explicit newer-version runtime validation policy
        value: ${{ jobs.test-libkrun.outputs.regression_policy }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-libkrun.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-libkrun.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-libkrun.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-libkrun.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-libkrun.outputs.timestamp }}
jobs:
  test-libkrun:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    env:
      LC_ALL: C
      BASELINE_VERSION: "1.19.7"
      SOURCE_COMMIT: "43b2f5aadeebb90f42053c9df2ec8b16583e554f"
      SOURCE_SHA256: "7c31a3c62e696efbf13268ee6f37eb4740d82ea599dcd724525fe8f8f72729b0"
      RUST_TOOLCHAIN: "1.94.0"
      FIRMWARE_SHA256: "dea7905a167eee17d482200ea2fe15871aceb293b0674ac825ed7ae69759399f"
    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: "libkrun"
      package_version: ${{ steps.version.outputs.version }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '5' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '5' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'failed' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'baseline_failed' }}
      regression_result: ${{ steps.test6.outputs.regression_result || 'No regression validation evidence.' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'No regression validation evidence.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'not_selected' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      regression_policy: runtime_validation_not_automated
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          # shellcheck disable=SC2129
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=libkrun" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/linux/opensource_packages/libkrun" >> "$GITHUB_OUTPUT"

      - name: Build and install pinned native libkrun and firmware
        id: install
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          bash .github/actions/apt-bootstrap/bootstrap.sh \
            --packages "build-essential pkg-config patchelf python3 curl ca-certificates binutils libc6-dev" \
            --no-install-recommends true
          timeout --kill-after=30s 600s rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          BUILD="$RUNNER_TEMP/libkrun-source"
          PREFIX="$RUNNER_TEMP/libkrun-install"
          mkdir -p "$BUILD" "$PREFIX"
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 \
            --output "$RUNNER_TEMP/libkrun.tar.gz" \
            "https://codeload.github.com/libkrun/libkrun/tar.gz/$SOURCE_COMMIT"
          echo "$SOURCE_SHA256  $RUNNER_TEMP/libkrun.tar.gz" | sha256sum --check --strict
          timeout 60s tar -xzf "$RUNNER_TEMP/libkrun.tar.gz" --strip-components=1 -C "$BUILD"
          mkdir -p "$RUNNER_TEMP/libkrun-firmware"
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 \
            --output "$RUNNER_TEMP/libkrunfw.tgz" \
            "https://github.com/libkrun/libkrunfw/releases/download/v5.6.2/libkrunfw-aarch64.tgz"
          echo "$FIRMWARE_SHA256  $RUNNER_TEMP/libkrunfw.tgz" | sha256sum --check --strict
          timeout 60s tar -xzf "$RUNNER_TEMP/libkrunfw.tgz" -C "$RUNNER_TEMP/libkrun-firmware"
          test -f "$RUNNER_TEMP/libkrun-firmware/lib/aarch64-linux-gnu/libkrunfw.so.5.6.2"
          echo "LIBKRUNFW_DIR=$RUNNER_TEMP/libkrun-firmware/lib/aarch64-linux-gnu" >> "$GITHUB_ENV"
          echo "LIBKRUNFW_PATH=$RUNNER_TEMP/libkrun-firmware/lib/aarch64-linux-gnu/libkrunfw.so.5.6.2" >> "$GITHUB_ENV"
          cd "$BUILD"
          timeout --kill-after=30s 1200s cargo +"$RUST_TOOLCHAIN" build --release --locked -p libkrun
          cp target/release/libkrun.so "target/release/libkrun.so.$BASELINE_VERSION"
          timeout --kill-after=30s 300s make PREFIX="$PREFIX" install
          {
            echo "LIBKRUN_PREFIX=$PREFIX"
            echo "LIBKRUN_SOURCE=$BUILD"
            echo "LIBKRUN_PATH=$PREFIX/lib64/libkrun.so.$BASELINE_VERSION"
            echo "PKG_CONFIG_PATH=$PREFIX/lib64/pkgconfig"
            echo "LD_LIBRARY_PATH=$PREFIX/lib64:$RUNNER_TEMP/libkrun-firmware/lib/aarch64-linux-gnu"
          } >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/libkrun-api.py" <<'PY'
          import ctypes
          import errno
          import os
          from pathlib import Path
          import sys
          import tempfile

          path = Path(os.environ["LIBKRUN_PATH"]).resolve(strict=True)
          lib = ctypes.CDLL(str(path))
          def check(condition, message):
              if not condition:
                  raise RuntimeError(message)
          check(str(path) in Path("/proc/self/maps").read_text(), "Pinned library not mapped")
          lib.krun_create_ctx.argtypes = []
          lib.krun_create_ctx.restype = ctypes.c_int32
          lib.krun_free_ctx.argtypes = [ctypes.c_uint32]
          lib.krun_free_ctx.restype = ctypes.c_int32
          lib.krun_set_vm_config.argtypes = [ctypes.c_uint32, ctypes.c_uint8, ctypes.c_uint32]
          lib.krun_set_vm_config.restype = ctypes.c_int32
          for symbol in ("krun_set_root", "krun_set_workdir"):
              fn = getattr(lib, symbol)
              fn.argtypes = [ctypes.c_uint32, ctypes.c_char_p]
              fn.restype = ctypes.c_int32
          def create():
              ctx = lib.krun_create_ctx()
              check(ctx >= 0, "Context creation failed")
              return ctx
          mode = sys.argv[1]
          if mode == "lifecycle":
              contexts = [create() for _ in range(64)]
              check(len(set(contexts)) == 64, "Live context IDs collided")
              for ctx in contexts:
                  check(lib.krun_free_ctx(ctx) == 0, "Context free failed")
                  check(lib.krun_free_ctx(ctx) == -errno.ENOENT, "Double free not rejected")
          elif mode in ("configure", "invalid"):
              ctx = create()
              try:
                  if mode == "invalid":
                      check(lib.krun_set_vm_config(ctx, 0, 256) == -errno.EINVAL, "Zero CPUs accepted")
                      check(lib.krun_set_vm_config(ctx, 1, 0) == -errno.EINVAL, "Zero RAM accepted")
                  check(lib.krun_set_vm_config(ctx, 1, 256) == 0, "Valid configuration rejected")
                  check(lib.krun_set_vm_config(ctx, 2, 512) == 0, "Reconfiguration rejected")
                  with tempfile.TemporaryDirectory() as root:
                      check(lib.krun_set_root(ctx, os.fsencode(root)) == 0, "Root configuration rejected")
                      check(lib.krun_set_workdir(ctx, b"/") == 0, "Workdir configuration rejected")
              finally:
                  check(lib.krun_free_ctx(ctx) == 0, "Context cleanup failed")
          elif mode == "stale":
              live, dead = create(), create()
              check(lib.krun_free_ctx(dead) == 0, "Free failed")
              for ctx in (dead, 0xffffffff):
                  check(lib.krun_set_vm_config(ctx, 1, 256) == -errno.ENOENT, "Invalid context accepted")
                  check(lib.krun_set_workdir(ctx, b"/") == -errno.ENOENT, "Invalid workdir context accepted")
              check(lib.krun_set_vm_config(live, 1, 256) == 0, "Other context corrupted")
              check(lib.krun_free_ctx(live) == 0, "Live context cleanup failed")
          else:
              raise RuntimeError("Unknown probe mode")
          print("LIBKRUN_API_OK " + mode)
          print("library/API smoke; guest execution not tested")
          PY
          echo "install_status=success" >> "$GITHUB_OUTPUT"

      - name: Record installed library metadata version (not guest execution)
        id: version
        run: |
          set -euo pipefail
          VERSION=$(pkg-config --modversion libkrun)
          test "$VERSION" = "$BASELINE_VERSION"
          test "$(pkg-config --variable=libdir libkrun)" = "$LIBKRUN_PREFIX/lib64"
          test -f "$LIBKRUN_PATH"
          grep -Fx "FULL_VERSION=$VERSION" "$LIBKRUN_SOURCE/Makefile"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test 1 - Native library identity
        id: test1
        if: always()
        continue-on-error: true
        env:
          BASELINE_READY: "${{ steps.install.outcome }}:${{ steps.install.outputs.install_status }}:${{ steps.version.outcome }}"
        run: |
          set -euo pipefail
          START_TIME=$SECONDS
          finish_test() {
            local rc=$? status=failed
            trap - EXIT
            if [ "$rc" -eq 0 ]; then status=passed; fi
            echo "status=$status" >> "$GITHUB_OUTPUT"
            echo "duration=$((SECONDS - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish_test EXIT
          test "$BASELINE_READY" = success:success:success
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64
          readelf -h "$LIBKRUN_PATH" | grep -Eq 'Machine: +AArch64'
          readelf -d "$LIBKRUN_PATH" | grep -F 'Library soname: [libkrun.so.1]'
          readelf -h "$LIBKRUNFW_PATH" | grep -Eq 'Machine: +AArch64'
          test "$(realpath "$LIBKRUN_PREFIX/lib64/libkrun.so")" = "$LIBKRUN_PATH"

      - name: Test 2 - Load actual library and exercise context lifecycle
        id: test2
        if: always()
        continue-on-error: true
        env:
          BASELINE_READY: "${{ steps.install.outcome }}:${{ steps.install.outputs.install_status }}:${{ steps.version.outcome }}"
        run: |
          set -euo pipefail
          START_TIME=$SECONDS
          finish_test() {
            local rc=$? status=failed
            trap - EXIT
            if [ "$rc" -eq 0 ]; then status=passed; fi
            echo "status=$status" >> "$GITHUB_OUTPUT"
            echo "duration=$((SECONDS - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish_test EXIT
          test "$BASELINE_READY" = success:success:success
          timeout 30s python3 "$RUNNER_TEMP/libkrun-api.py" lifecycle

      - name: Test 3 - Accept valid configuration and reject invalid/stale contexts
        id: test3
        if: always()
        continue-on-error: true
        env:
          BASELINE_READY: "${{ steps.install.outcome }}:${{ steps.install.outputs.install_status }}:${{ steps.version.outcome }}"
        run: |
          set -euo pipefail
          START_TIME=$SECONDS
          finish_test() {
            local rc=$? status=failed
            trap - EXIT
            if [ "$rc" -eq 0 ]; then status=passed; fi
            echo "status=$status" >> "$GITHUB_OUTPUT"
            echo "duration=$((SECONDS - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish_test EXIT
          test "$BASELINE_READY" = success:success:success
          timeout 30s python3 "$RUNNER_TEMP/libkrun-api.py" configure
          timeout 30s python3 "$RUNNER_TEMP/libkrun-api.py" invalid
          timeout 30s python3 "$RUNNER_TEMP/libkrun-api.py" stale

      - name: Test 4 - Installed ABI, headers and dependency closure
        id: test4
        if: always()
        continue-on-error: true
        env:
          BASELINE_READY: "${{ steps.install.outcome }}:${{ steps.install.outputs.install_status }}:${{ steps.version.outcome }}"
        run: |
          set -euo pipefail
          START_TIME=$SECONDS
          finish_test() {
            local rc=$? status=failed
            trap - EXIT
            if [ "$rc" -eq 0 ]; then status=passed; fi
            echo "status=$status" >> "$GITHUB_OUTPUT"
            echo "duration=$((SECONDS - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish_test EXIT
          test "$BASELINE_READY" = success:success:success
          test "$(pkg-config --variable=includedir libkrun)" = "$LIBKRUN_PREFIX/include"
          test "$(pkg-config --variable=libdir libkrun)" = "$LIBKRUN_PREFIX/lib64"
          test -r "$LIBKRUN_PREFIX/include/libkrun.h"
          cmp "$LIBKRUN_SOURCE/include/libkrun.h" "$LIBKRUN_PREFIX/include/libkrun.h"
          nm -D --defined-only "$LIBKRUN_PATH" | awk '{print $3}' > "$RUNNER_TEMP/libkrun-symbols"
          for symbol in \
            krun_create_ctx krun_free_ctx krun_set_vm_config krun_set_root \
            krun_set_workdir krun_has_feature krun_get_default_init; do
            grep -Fx "$symbol" "$RUNNER_TEMP/libkrun-symbols"
          done
          ldd "$LIBKRUN_PATH" | tee "$RUNNER_TEMP/libkrun-ldd"
          if grep -F 'not found' "$RUNNER_TEMP/libkrun-ldd"; then
            echo "libkrun has an unresolved runtime dependency" >&2
            exit 1
          fi
          grep -F 'libc.so.6' "$RUNNER_TEMP/libkrun-ldd"

      - name: Test 5 - Compile, link and run a native C API consumer
        id: test5
        if: always()
        continue-on-error: true
        env:
          BASELINE_READY: "${{ steps.install.outcome }}:${{ steps.install.outputs.install_status }}:${{ steps.version.outcome }}"
        run: |
          set -euo pipefail
          START_TIME=$SECONDS
          finish_test() {
            local rc=$? status=failed
            trap - EXIT
            if [ "$rc" -eq 0 ]; then status=passed; fi
            echo "status=$status" >> "$GITHUB_OUTPUT"
            echo "duration=$((SECONDS - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish_test EXIT
          test "$BASELINE_READY" = success:success:success
          cat > "$RUNNER_TEMP/libkrun-consumer.c" <<'C'
          #include <errno.h>
          #include <inttypes.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <sys/types.h>
          #include <libkrun.h>

          static void require(int condition, const char *message) {
              if (!condition) {
                  fprintf(stderr, "%s\n", message);
                  exit(1);
              }
          }

          int main(int argc, char **argv) {
              require(argc == 2, "expected one root path");
              int32_t first = krun_create_ctx();
              int32_t second = krun_create_ctx();
              require(first >= 0 && second >= 0 && first != second,
                      "context creation or isolation failed");
              require(krun_set_vm_config((uint32_t)first, 1, 256) == 0,
                      "first VM configuration failed");
              require(krun_set_vm_config((uint32_t)second, 2, 512) == 0,
                      "second VM configuration failed");
              require(krun_set_root((uint32_t)first, argv[1]) == 0,
                      "root configuration failed");
              require(krun_set_workdir((uint32_t)first, "/") == 0,
                      "workdir configuration failed");
              require(krun_disable_implicit_console((uint32_t)first) == 0,
                      "console configuration failed");

              require(krun_has_feature(KRUN_FEATURE_INIT_BLOB) == 1,
                      "pinned build does not expose its init blob");
              require(krun_has_feature(UINT64_MAX) == -EINVAL,
                      "unknown feature was not rejected");
              const uint8_t *init_data = NULL;
              size_t init_length = 0;
              require(krun_get_default_init(&init_data, &init_length) == 0,
                      "default init retrieval failed");
              require(init_data != NULL && init_length > 64,
                      "default init payload is empty");
              require(init_data[0] == 0x7f && init_data[1] == 'E' &&
                      init_data[2] == 'L' && init_data[3] == 'F',
                      "default init is not ELF");
              require(init_data[4] == 2 && init_data[5] == 1,
                      "default init is not little-endian ELF64");
              uint16_t machine = (uint16_t)init_data[18] |
                                 ((uint16_t)init_data[19] << 8);
              require(machine == 183, "default init is not AArch64");
              require(krun_get_default_init(NULL, &init_length) == -EINVAL,
                      "null init output was not rejected");

              require(krun_free_ctx((uint32_t)first) == 0,
                      "first context cleanup failed");
              require(krun_set_vm_config((uint32_t)first, 1, 256) == -ENOENT,
                      "freed context remained usable");
              require(krun_set_vm_config((uint32_t)second, 1, 256) == 0,
                      "first cleanup corrupted the second context");
              require(krun_free_ctx((uint32_t)second) == 0,
                      "second context cleanup failed");
              puts("LIBKRUN_NATIVE_C_API_OK");
              return 0;
          }
          C
          read -r -a KRUN_CFLAGS <<< "$(pkg-config --cflags libkrun)"
          read -r -a KRUN_LIBS <<< "$(pkg-config --libs libkrun)"
          timeout --kill-after=5s 60s cc \
            -std=c11 -Wall -Wextra -Werror \
            "${KRUN_CFLAGS[@]}" "$RUNNER_TEMP/libkrun-consumer.c" \
            "${KRUN_LIBS[@]}" -Wl,-rpath,"$LIBKRUN_PREFIX/lib64" \
            -o "$RUNNER_TEMP/libkrun-consumer"
          readelf -h "$RUNNER_TEMP/libkrun-consumer" | grep -Eq 'Machine: +AArch64'
          ldd "$RUNNER_TEMP/libkrun-consumer" | tee "$RUNNER_TEMP/libkrun-consumer-ldd"
          if grep -F 'not found' "$RUNNER_TEMP/libkrun-consumer-ldd"; then
            echo "native C consumer has an unresolved runtime dependency" >&2
            exit 1
          fi
          timeout 30s "$RUNNER_TEMP/libkrun-consumer" "$RUNNER_TEMP" \
            | tee "$RUNNER_TEMP/libkrun-consumer-output"
          grep -Fx LIBKRUN_NATIVE_C_API_OK "$RUNNER_TEMP/libkrun-consumer-output"

      - name: Test 6 - Regression policy - explicit runtime-validation deferral
        id: test6
        if: always()
        continue-on-error: true
        env:
          CURRENT_VERSION: ${{ steps.version.outputs.version }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          INSTALL_STATUS: ${{ steps.install.outputs.install_status }}
          VERSION_OUTCOME: ${{ steps.version.outcome }}
          CORE_RESULTS: "${{ steps.test1.outcome }}:${{ steps.test1.outputs.status }} ${{ steps.test2.outcome }}:${{ steps.test2.outputs.status }} ${{ steps.test3.outcome }}:${{ steps.test3.outputs.status }} ${{ steps.test4.outcome }}:${{ steps.test4.outputs.status }} ${{ steps.test5.outcome }}:${{ steps.test5.outputs.status }}"
        run: |
          set -euo pipefail
          DECISION=runtime_validation_not_automated
          RESULT="Newer-version runtime validation not automated; no candidate installed or compared"
          COMPARISON="Recurring hosted validation covers pinned native Arm64 library, firmware, ABI, headers and API behavior. Real guest boot, filesystem I/O and exit propagation are validated separately by the protected supplemental KVM workflow; no latest-version pass is inferred."
          if [ "$INSTALL_OUTCOME" != success ] || [ "$INSTALL_STATUS" != success ] \
            || [ "$VERSION_OUTCOME" != success ] || [ -z "$CURRENT_VERSION" ] || [ "$CURRENT_VERSION" = unknown ]; then
            DECISION=baseline_install_failed
            RESULT="Baseline installation or package version verification failed"
            COMPARISON="Baseline evidence is incomplete; no passing smoke result or next-version comparison is asserted."
          elif [ "$CORE_RESULTS" != "success:passed success:passed success:passed success:passed success:passed" ]; then
            DECISION=baseline_failed
            RESULT="Baseline smoke validation failed or is incomplete"
            COMPARISON="Tests 1-5 did not all pass; the workflow remains failed and incomplete evidence cannot be published."
          fi
          {
            echo "current_version=$CURRENT_VERSION"
            echo "latest_version=not_checked"
            echo "next_installed_version=not_installed"
            echo "decision=$DECISION"
            echo "regression_result=$RESULT"
            echo "comparison=$COMPARISON"
            echo "status=skipped"
            echo "duration=0"
          } >> "$GITHUB_OUTPUT"

      - name: Calculate test summary
        if: always()
        id: summary
        run: |
          set -euo pipefail
          # shellcheck disable=SC2129
          PASSED=0
          FAILED=0
          SKIPPED=0
          CORE_FAILED=0
          CORE_PASSED=0
          TOTAL_DURATION=0

          check_test() {
            local status="$1" outcome="$2" duration="$3" core="$4"
            if { [ "$outcome" = skipped ] || [ -z "$outcome" ]; } && [ "$core" -eq 0 ]; then
              SKIPPED=$((SKIPPED + 1))
            elif [ "$outcome" = success ] && [ "$core" -eq 0 ] \
              && [ "$status" = skipped ] \
              && [[ "${{ steps.test6.outputs.decision }}" =~ ^(runtime_validation_not_automated|baseline_failed|baseline_install_failed)$ ]]; then
              SKIPPED=$((SKIPPED + 1))
            elif [ "$outcome" = success ] && [ "$status" = passed ] && [ "$core" -eq 1 ]; then
              PASSED=$((PASSED + 1))
              CORE_PASSED=$((CORE_PASSED + 1))
            else
              FAILED=$((FAILED + 1))
              CORE_FAILED=$((CORE_FAILED + core))
            fi
            [[ "$duration" =~ ^[0-9]+$ ]] || duration=0
            TOTAL_DURATION=$((TOTAL_DURATION + 10#$duration))
          }

          check_test "${{ steps.test1.outputs.status }}" "${{ steps.test1.outcome }}" "${{ steps.test1.outputs.duration || 0 }}" 1
          check_test "${{ steps.test2.outputs.status }}" "${{ steps.test2.outcome }}" "${{ steps.test2.outputs.duration || 0 }}" 1
          check_test "${{ steps.test3.outputs.status }}" "${{ steps.test3.outcome }}" "${{ steps.test3.outputs.duration || 0 }}" 1
          check_test "${{ steps.test4.outputs.status }}" "${{ steps.test4.outcome }}" "${{ steps.test4.outputs.duration || 0 }}" 1
          check_test "${{ steps.test5.outputs.status }}" "${{ steps.test5.outcome }}" "${{ steps.test5.outputs.duration || 0 }}" 1
          check_test "${{ steps.test6.outputs.status }}" "${{ steps.test6.outcome }}" "${{ steps.test6.outputs.duration || 0 }}" 0

          {
            echo "passed=$PASSED"
            echo "failed=$FAILED"
            echo "skipped=$SKIPPED"
            echo "core_failed=$CORE_FAILED"
            echo "duration=$TOTAL_DURATION"
          } >> "$GITHUB_OUTPUT"

          if [ "$CORE_PASSED" -eq 5 ] && [ "$FAILED" -eq 0 ] \
            && [ "${{ steps.install.outcome }}" = success ] \
            && [ "${{ steps.install.outputs.install_status }}" = success ] \
            && [ "${{ steps.version.outcome }}" = success ] \
            && [ "${{ steps.version.outputs.version }}" = "$BASELINE_VERSION" ] \
            && [ "${{ steps.test6.outcome }}" = success ] \
            && [ "${{ steps.test6.outputs.status }}" = skipped ] \
            && [ "${{ steps.test6.outputs.decision }}" = runtime_validation_not_automated ]; then
            {
              echo "overall_status=success"
              echo "badge_status=passing"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "overall_status=failure"
              echo "badge_status=failing"
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Create test summary
        if: always()
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version || 'unknown' }}
          STATUS: ${{ steps.summary.outputs.overall_status || 'failure' }}
          PASSED: ${{ steps.summary.outputs.passed || '0' }}
          FAILED: ${{ steps.summary.outputs.failed || '0' }}
          SKIPPED: ${{ steps.summary.outputs.skipped || '0' }}
          REGRESSION_DECISION: ${{ steps.test6.outputs.decision || 'unknown' }}
        run: |
          {
            echo "## libkrun recurring native Arm64 library and API health"
            echo "- Installed package version: $PACKAGE_VERSION"
            echo "- Status: $STATUS"
            echo "- Passed: $PASSED; failed: $FAILED; skipped: $SKIPPED"
            echo "- Recurring scope: pinned native Arm64 library and firmware identity, installed ABI/header/dependency closure, context lifecycle, configuration rejection behavior and a compiled C consumer."
            echo "- Supplemental scope: real guest boot, guest Arm64 identity, filesystem I/O and exit propagation run manually on the protected disposable KVM lane. Hosted success does not claim that a guest boot occurred."
            echo "- Not tested here: guest execution, networking, GPU, confidential computing or guest performance."
            echo "- Regression decision: $REGRESSION_DECISION"
          } >> "$GITHUB_STEP_SUMMARY"

name: Test Cobbler on Arm64

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-cobbler.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-cobbler.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-cobbler.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-cobbler.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-cobbler.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-cobbler.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-cobbler.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-cobbler.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-cobbler.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-cobbler.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-cobbler.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-cobbler.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-cobbler.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-cobbler.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-cobbler.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-cobbler.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-cobbler.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-cobbler.outputs.regression_next_installed_version }}
      regression_policy:
        description: Regression applicability policy classification
        value: ${{ jobs.test-cobbler.outputs.regression_policy }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-cobbler.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-cobbler.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-cobbler.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-cobbler.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-cobbler.outputs.timestamp }}
jobs:
  test-cobbler:
    runs-on: ubuntu-24.04-arm
    env:
      COBBLER_BASELINE_VERSION: "v3.3.6"
      COBBLER_NEXT_VERSION: "v3.3.7"
      COBBLER_CLI_SMOKE: |
        set -euo pipefail
        : "${VENV:?}"
        : "${EXPECTED_VERSION:?}"
        WORKDIR=$(mktemp -d)
        DAEMON_PID=
        APACHE_PID=
        CREATED=0
        finish() {
          RC=$?
          trap - EXIT
          for PID in "$APACHE_PID" "$DAEMON_PID"; do
            if [ -n "$PID" ]; then kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true; fi
          done
          for LOG in "$WORKDIR"/*.log; do if [ -f "$LOG" ]; then cat "$LOG"; fi; done
          if [ "$CREATED" = 1 ]; then rm -rf /etc/cobbler /var/lib/cobbler /var/log/cobbler; fi
          rm -rf "$WORKDIR"
          exit "$RC"
        }
        trap finish EXIT
        trap 'exit 143' TERM
        trap 'exit 130' INT
        for DIRECTORY in /etc/cobbler /var/lib/cobbler /var/log/cobbler; do
          test ! -e "$DIRECTORY"
          test ! -L "$DIRECTORY"
        done
        CREATED=1
        export EXPECTED_VERSION
        "$VENV/bin/python3" - <<'PY'
        import importlib.metadata
        from pathlib import Path
        import os
        import shutil
        import socket
        import yaml

        d = importlib.metadata.distribution("cobbler")
        assert d.version == os.environ["EXPECTED_VERSION"], d.version
        site = Path(d.locate_file("."))
        for relative in ("etc/cobbler", "var/lib/cobbler"):
            source = site / relative
            assert source.is_dir(), source
            shutil.copytree(source, Path("/") / relative)
        Path("/var/log/cobbler/tasks").mkdir(parents=True)
        Path("/var/lib/cobbler/collections").mkdir(exist_ok=True)
        settings = Path("/etc/cobbler/settings.yaml")
        data = yaml.safe_load(settings.read_text())
        with socket.socket() as http, socket.socket() as rpc:
            http.bind(("127.0.0.1", 0))
            rpc.bind(("127.0.0.1", 0))
            data["http_port"] = http.getsockname()[1]
            data["xmlrpc_port"] = rpc.getsockname()[1]
        data.update(server="127.0.0.1", client_use_localhost=True, client_use_https=False)
        for flag in ("manage_dhcp", "manage_dhcp_v4", "manage_dhcp_v6", "manage_dns", "manage_tftpd", "manage_rsync", "restart_dhcp", "restart_dns"):
            if flag in data:
                data[flag] = False
        settings.write_text(yaml.safe_dump(data))
        print("cobbler-installed-config version=%s path=%s" % (d.version, site))
        PY
        HTTP_PORT=$("$VENV/bin/python3" -c 'import yaml; print(yaml.safe_load(open("/etc/cobbler/settings.yaml"))["http_port"])')
        XMLRPC_PORT=$("$VENV/bin/python3" -c 'import yaml; print(yaml.safe_load(open("/etc/cobbler/settings.yaml"))["xmlrpc_port"])')
        cat > "$WORKDIR/httpd.conf" <<CONF
        ServerRoot "$WORKDIR"
        DefaultRuntimeDir "$WORKDIR"
        PidFile "$WORKDIR/apache.pid"
        ServerName localhost
        Listen 127.0.0.1:$HTTP_PORT
        LoadModule mpm_event_module /usr/lib/apache2/modules/mod_mpm_event.so
        LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
        LoadModule proxy_module /usr/lib/apache2/modules/mod_proxy.so
        LoadModule proxy_http_module /usr/lib/apache2/modules/mod_proxy_http.so
        User www-data
        Group www-data
        ErrorLog "$WORKDIR/apache-error.log"
        ProxyPass /cobbler_api http://127.0.0.1:$XMLRPC_PORT/
        <Location /cobbler_api>
          Require all granted
        </Location>
        CONF
        "$VENV/bin/cobblerd" -F > "$WORKDIR/daemon.log" 2>&1 &
        DAEMON_PID=$!
        /usr/sbin/apache2 -f "$WORKDIR/httpd.conf" -DFOREGROUND > "$WORKDIR/apache.log" 2>&1 &
        APACHE_PID=$!
        READY=0
        for ATTEMPT in {1..30}; do
          kill -0 "$DAEMON_PID"
          kill -0 "$APACHE_PID"
          if "$VENV/bin/cobbler" signature report --help > "$WORKDIR/signature-help.log" 2>&1; then READY=1; break; fi
          sleep 1
        done
        test "$READY" = 1
        "$VENV/bin/python3" - "$HTTP_PORT" "$XMLRPC_PORT" <<'PY'
        from pathlib import Path
        import sys

        for role, port in zip(("http", "xmlrpc"), map(int, sys.argv[1:])):
            listeners = []
            for family in ("tcp", "tcp6"):
                for row in Path("/proc/net", family).read_text().splitlines()[1:]:
                    fields = row.split()
                    address, local_port = fields[1].split(":")
                    if fields[3] == "0A" and int(local_port, 16) == port:
                        listeners.append((family, address))
            assert listeners == [("tcp", "0100007F")], (role, port, listeners)
            print("cobbler-listener role=%s address=127.0.0.1 port=%s" % (role, port))
        PY
        grep -Fq -- '--name' "$WORKDIR/signature-help.log"
        "$VENV/bin/cobbler" --version > "$WORKDIR/version.log"
        grep -Fxq "Cobbler $EXPECTED_VERSION" "$WORKDIR/version.log"
        HELP_RC=0
        "$VENV/bin/cobbler" signature --help > "$WORKDIR/signature-commands.log" 2>&1 || HELP_RC=$?
        test "$HELP_RC" = 2
        for COMMAND in reload report update; do
          grep -Fxq "cobbler signature $COMMAND" "$WORKDIR/signature-commands.log"
        done
        echo "cobbler-signature-cli-ok version=$EXPECTED_VERSION commands=reload,report,update loopback-only"
    
    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'Cobbler'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      regression_policy: "applicable"
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false
      
      - name: Set test metadata
        id: metadata
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=cobbler" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/opensource_packages/cobbler" >> "$GITHUB_OUTPUT"
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-venv git apache2-dev libsystemd-dev libsasl2-dev
      
      - name: Install Cobbler
        id: install
        run: |
          set -euo pipefail
          echo "Installing Cobbler from source..."
          python3 -m venv "$GITHUB_WORKSPACE/venv"
          source "$GITHUB_WORKSPACE/venv/bin/activate"
          
          git clone --depth 1 --branch "${COBBLER_BASELINE_VERSION}" https://github.com/cobbler/cobbler.git
          cd cobbler
          sudo apt-get update
          sudo apt-get install -y make gcc python3-dev libapache2-mod-wsgi-py3
          pip install --upgrade pip setuptools wheel
          pip install coverage
          pip install --no-build-isolation .[cli]

          if [ ! -x "$GITHUB_WORKSPACE/venv/bin/cobbler" ]; then
            echo "Could not find cobbler CLI in venv after install."
            echo "install_status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if ! python3 -c "import cobbler" >/dev/null 2>&1; then
            echo "Cobbler Python module import failed after install."
            echo "install_status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "install_status=success" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_WORKSPACE/venv/bin" >> "$GITHUB_PATH"

      
      - name: Get installed Cobbler version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$("$GITHUB_WORKSPACE/venv/bin/python3" -c 'import importlib.metadata; print(importlib.metadata.version("cobbler"))')
          test "$VERSION" = "${COBBLER_BASELINE_VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Installed Cobbler version: $VERSION"

      - name: Test 1 - Check installed binary
        id: test1
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"
          START_TIME=$(date +%s)
          STATUS=failed
          finish() {
            RC=$?
            trap - EXIT
            if [ "$RC" -ne 0 ]; then STATUS=failed; fi
            echo "status=$STATUS" >> "$GITHUB_OUTPUT"
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap finish EXIT
          test -x "$GITHUB_WORKSPACE/venv/bin/cobbler"
          REPORTED_VERSION=$("$GITHUB_WORKSPACE/venv/bin/python3" -c 'import importlib.metadata; print(importlib.metadata.version("cobbler"))')
          test -n "$REPORTED_VERSION"
          echo "cobbler binary=$GITHUB_WORKSPACE/venv/bin/cobbler metadata=$REPORTED_VERSION"
          STATUS=passed
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 2 - Check package version metadata
        id: test2
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"
          START_TIME=$(date +%s)
          STATUS=failed
          finish() {
            RC=$?
            trap - EXIT
            if [ "$RC" -ne 0 ]; then STATUS=failed; fi
            echo "status=$STATUS" >> "$GITHUB_OUTPUT"
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap finish EXIT
          REPORTED_VERSION=$("$GITHUB_WORKSPACE/venv/bin/python3" -c 'import importlib.metadata; print(importlib.metadata.version("cobbler"))')
          test "$REPORTED_VERSION" = "${COBBLER_BASELINE_VERSION#v}"
          echo "cobbler installed version=$REPORTED_VERSION"
          STATUS=passed
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 3 - Check installed Python module
        id: test3
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"
          START_TIME=$(date +%s)
          STATUS=failed
          finish() {
            RC=$?
            trap - EXIT
            if [ "$RC" -ne 0 ]; then STATUS=failed; fi
            echo "status=$STATUS" >> "$GITHUB_OUTPUT"
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap finish EXIT
          "$GITHUB_WORKSPACE/venv/bin/python3" -c "import cobbler; print('Import successful:', cobbler.__file__)"
          STATUS=passed
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 4 - Check local signature CLI help
        id: test4
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"
          START_TIME=$(date +%s)
          STATUS=failed
          finish() {
            RC=$?
            trap - EXIT
            if [ "$RC" -ne 0 ]; then STATUS=failed; fi
            echo "status=$STATUS" >> "$GITHUB_OUTPUT"
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap finish EXIT
          timeout --signal=TERM --kill-after=15s 180s sudo env VENV="$GITHUB_WORKSPACE/venv" EXPECTED_VERSION="${COBBLER_BASELINE_VERSION#v}" bash -e -o pipefail -c "$COBBLER_CLI_SMOKE"
          STATUS=passed
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 5 - Architecture Verification
        id: test5
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"
          START_TIME=$(date +%s)
          STATUS=failed
          finish() {
            RC=$?
            trap - EXIT
            if [ "$RC" -ne 0 ]; then STATUS=failed; fi
            echo "status=$STATUS" >> "$GITHUB_OUTPUT"
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap finish EXIT
          test "$(uname -m)" = "aarch64"
          STATUS=passed
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 6 - Regression Validation
        id: test6
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "decision=next_install_failed"
            echo "status=failed"
            echo "duration=0"
          } >> "$GITHUB_OUTPUT"
          START_TIME=$(date +%s)
          STATUS=failed
          WORKDIR=""
          finish() {
            RC=$?
            trap - EXIT
            if [ -n "$WORKDIR" ]; then rm -rf "$WORKDIR"; fi
            if [ "$RC" -ne 0 ]; then STATUS=failed; fi
            echo "status=$STATUS" >> "$GITHUB_OUTPUT"
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap finish EXIT
          CURRENT_VERSION="${{ steps.version.outputs.version || 'unknown' }}"
          LATEST_VERSION="${COBBLER_NEXT_VERSION#v}"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "latest_version=$LATEST_VERSION" >> "$GITHUB_OUTPUT"
          echo "next_installed_version=not_validated" >> "$GITHUB_OUTPUT"
          for RESULT in \
            "${{ steps.test1.outputs.status || 'failed' }}:${{ steps.test1.outcome || 'failure' }}" \
            "${{ steps.test2.outputs.status || 'failed' }}:${{ steps.test2.outcome || 'failure' }}" \
            "${{ steps.test3.outputs.status || 'failed' }}:${{ steps.test3.outcome || 'failure' }}" \
            "${{ steps.test4.outputs.status || 'failed' }}:${{ steps.test4.outcome || 'failure' }}" \
            "${{ steps.test5.outputs.status || 'failed' }}:${{ steps.test5.outcome || 'failure' }}"; do
            if [ "$RESULT" != "passed:success" ]; then
              STATUS=skipped
              {
                echo "decision=baseline_failed"
                echo "status=skipped"
                echo "duration=$(($(date +%s) - START_TIME))"
              } >> "$GITHUB_OUTPUT"
              echo "regression_result=Baseline CPU checks failed; candidate was not validated." >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          python3 - "$CURRENT_VERSION" "$LATEST_VERSION" <<'PY'
          import re
          import sys

          def numeric_version(value):
              if re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", value) is None:
                  raise SystemExit("Invalid configured Cobbler version: " + value)
              return tuple(int(part) for part in value.split("."))

          current, candidate = map(numeric_version, sys.argv[1:])
          if candidate <= current:
              raise SystemExit("Configured Cobbler candidate must be newer than the baseline")
          PY
          WORKDIR=$(mktemp -d)
          python3 -m venv "$WORKDIR/next-venv"
          source "$WORKDIR/next-venv/bin/activate"
          git clone --depth 1 --branch "$COBBLER_NEXT_VERSION" https://github.com/cobbler/cobbler.git "$WORKDIR/cobbler-next"
          git -C "$WORKDIR/cobbler-next" rev-parse HEAD
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install coverage
          python -m pip install --no-build-isolation "$WORKDIR/cobbler-next[cli]"
          NEXT_VERSION_REPORTED=$(python -c 'import importlib.metadata; print(importlib.metadata.version("cobbler"))')
          echo "next_installed_version=$NEXT_VERSION_REPORTED" >> "$GITHUB_OUTPUT"
          test "$NEXT_VERSION_REPORTED" = "$LATEST_VERSION"
          python -c "import cobbler; print(cobbler.__file__)"
          timeout --signal=TERM --kill-after=15s 180s sudo env VENV="$WORKDIR/next-venv" EXPECTED_VERSION="$LATEST_VERSION" bash -e -o pipefail -c "$COBBLER_CLI_SMOKE"
          STATUS=passed
          {
            echo "decision=next_install_validated"
            echo "status=passed"
            echo "duration=$(($(date +%s) - START_TIME))"
          } >> "$GITHUB_OUTPUT"
          echo "regression_result=Exact candidate installed and local signature CLI help passed on Arm64." >> "$GITHUB_OUTPUT"
          echo "comparison=Baseline $CURRENT_VERSION and candidate $LATEST_VERSION passed package version/import and real signature help against temporary loopback-only Cobbler services. No provisioning, DHCP, DNS, TFTP or external credentials were used." >> "$GITHUB_OUTPUT"

      - name: Calculate test summary
        id: summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          T1="${{ steps.test1.outputs.status || 'failed' }}"
          T2="${{ steps.test2.outputs.status || 'failed' }}"
          T3="${{ steps.test3.outputs.status || 'failed' }}"
          T4="${{ steps.test4.outputs.status || 'failed' }}"
          T5="${{ steps.test5.outputs.status || 'failed' }}"
          T6="${{ steps.test6.outputs.status || 'failed' }}"
          O1="${{ steps.test1.outcome || 'failure' }}"
          O2="${{ steps.test2.outcome || 'failure' }}"
          O3="${{ steps.test3.outcome || 'failure' }}"
          O4="${{ steps.test4.outcome || 'failure' }}"
          O5="${{ steps.test5.outcome || 'failure' }}"
          O6="${{ steps.test6.outcome || 'failure' }}"
          DECISION="${{ steps.test6.outputs.decision || '' }}"
          D1="${{ steps.test1.outputs.duration || '0' }}"
          D2="${{ steps.test2.outputs.duration || '0' }}"
          D3="${{ steps.test3.outputs.duration || '0' }}"
          D4="${{ steps.test4.outputs.duration || '0' }}"
          D5="${{ steps.test5.outputs.duration || '0' }}"
          D6="${{ steps.test6.outputs.duration || '0' }}"
          PASSED=0
          FAILED=0
          SKIPPED=0
          CORE_FAILED=0
          for RESULT in "$T1:$O1" "$T2:$O2" "$T3:$O3" "$T4:$O4" "$T5:$O5"; do
            if [ "$RESULT" = "passed:success" ]; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
              CORE_FAILED=$((CORE_FAILED + 1))
            fi
          done
          if [ "$T6:$O6" = "passed:success" ]; then
            PASSED=$((PASSED + 1))
          elif [ "$T6:$O6" = "skipped:success" ] && [ "$DECISION" = "baseline_failed" ] && [ "$CORE_FAILED" -gt 0 ]; then
            SKIPPED=1
          else
            FAILED=$((FAILED + 1))
          fi
          DURATION=$((D1 + D2 + D3 + D4 + D5 + D6))
          if [ "$FAILED" -eq 0 ]; then
            OVERALL_STATUS="success"
          else
            OVERALL_STATUS="failure"
          fi
          if [ "$CORE_FAILED" -eq 0 ]; then
            BADGE_STATUS="passing"
          else
            BADGE_STATUS="failing"
          fi
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"
          echo "core_failed=$CORE_FAILED" >> "$GITHUB_OUTPUT"
          echo "overall_status=$OVERALL_STATUS" >> "$GITHUB_OUTPUT"
          echo "badge_status=$BADGE_STATUS" >> "$GITHUB_OUTPUT"
          test "$FAILED" -eq 0
      - name: Create test summary
        if: always()
        run: |
          echo "## Cobbler Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ steps.summary.outputs.overall_status }}" >> $GITHUB_STEP_SUMMARY

                  raise ArtifactDownloadFailure("artifact_policy_failure")
              if RECIPE["kind"] == "pip":
                  if not parsed.path.startswith("/packages/") or not re.fullmatch(
                      r"[0-9a-f]{64}", record.get("sha256", "")
                  ) or record.get("integrity") is not None:

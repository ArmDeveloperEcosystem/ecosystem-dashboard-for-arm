                      )
                  ),
                  extra={
                      "regression_decision": "candidate_passed" if passed else "candidate_failed",
                      "functional_profile": FUNCTIONAL_PROFILE or "none",
                      "regression_result": (
                          "Candidate passed native Arm64 validation."
                          if passed
                          else (
                              "Candidate functional validation requires human review; "
                              "import-only diagnostics are insufficient."
                              if review_required
                              else "Candidate failed native Arm64 validation."
                          )
                      ),
                      "regression_latest_version": candidate,
                      "regression_next_installed_version": (
                          candidate if version_passed else "not_verified"
                      ),
                      "failure_class": (
                          "none"
                          if passed
                          else (
                              install_failure_class
                              if not installed
                              else (
                                  "functional_review_required"
                                  if review_required
                                  else "package_validation_failure"
                              )
                          )
                      ),
                  },
              )


          def main(argv: list[str]) -> int:
              if len(argv) != 3:
                  raise ValueError("usage: smoke-executor TEST_NUMBER GITHUB_OUTPUT")
              output = Path(argv[2])
              try:
                  run_test(int(argv[1]), output)
              except SmokeTestFailure:
                  return 1
              except Exception as exc:
                  traceback.print_exc()
                  write_outputs(
                      output,
                      {
                          "status": "failed",
                          "duration": "0",
                          "details": f"Trusted smoke controller failed safely: {type(exc).__name__}.",
                      },
                  )
                  return 1
              return 0


          if __name__ == "__main__":
              raise SystemExit(main(sys.argv))
          PY
          chmod 0500 "$smoke_harness"

      - name: "Test 1 - Install exact baseline package"
        id: test1
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/timeout --signal=TERM --kill-after=10s 600s /usr/bin/python3 "$SMOKE_HARNESS" 1 "$GITHUB_OUTPUT"

      - name: "Test 2 - Verify exact baseline version"
        id: test2
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/timeout --signal=TERM --kill-after=10s 600s /usr/bin/python3 "$SMOKE_HARNESS" 2 "$GITHUB_OUTPUT"

      - name: "Test 3 - Validate installed artifact metadata"
        id: test3
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/timeout --signal=TERM --kill-after=10s 600s /usr/bin/python3 "$SMOKE_HARNESS" 3 "$GITHUB_OUTPUT"

      - name: "Test 4 - Verify native Arm64 architecture"
        id: test4
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/timeout --signal=TERM --kill-after=10s 600s /usr/bin/python3 "$SMOKE_HARNESS" 4 "$GITHUB_OUTPUT"

      - name: "Test 5 - Validate orjson encode/decode observations"
        id: test5
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/timeout --signal=TERM --kill-after=10s 600s /usr/bin/python3 "$SMOKE_HARNESS" 5 "$GITHUB_OUTPUT"

      - name: "Test 6 - Validate isolated candidate or explicit deferral"
        id: test6
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/timeout --signal=TERM --kill-after=10s 900s /usr/bin/python3 "$SMOKE_HARNESS" 6 "$GITHUB_OUTPUT"

      - name: "Emit canonical six-test result"
        id: summary
        if: always()
        shell: bash
        env:
          PACKAGE_SLUG: "orjson"
          PACKAGE_NAME: "orjson"
          VERSION: "2.5.2"
          INSTALL_STATUS: "${{ steps.test1.outputs.status == 'passed' && 'success' || 'failed' }}"
          RUNNER_LABEL: "ubuntu-24.04 (arm64)"
          SUMMARY_STYLE: "baseline-artifact"
          TEST1_LABEL: "Install exact baseline package"
          TEST2_LABEL: "Verify exact baseline version"
          TEST3_LABEL: "Validate installed artifact metadata"
          TEST4_LABEL: "Verify native Arm64 architecture"
          TEST5_LABEL: "Validate orjson encode/decode observations"
          TEST1_STATUS: "${{ steps.test1.outputs.status || 'skipped' }}"
          TEST2_STATUS: "${{ steps.test2.outputs.status || 'skipped' }}"
          TEST3_STATUS: "${{ steps.test3.outputs.status || 'skipped' }}"
          TEST4_STATUS: "${{ steps.test4.outputs.status || 'skipped' }}"
          TEST5_STATUS: "${{ steps.test5.outputs.status || 'skipped' }}"
          TEST6_STATUS: "${{ steps.test6.outputs.status || 'skipped' }}"
          TEST1_DURATION: "${{ steps.test1.outputs.duration || '0' }}"
          TEST2_DURATION: "${{ steps.test2.outputs.duration || '0' }}"
          TEST3_DURATION: "${{ steps.test3.outputs.duration || '0' }}"
          TEST4_DURATION: "${{ steps.test4.outputs.duration || '0' }}"
          TEST5_DURATION: "${{ steps.test5.outputs.duration || '0' }}"
          TEST6_DURATION: "${{ steps.test6.outputs.duration || '0' }}"
          REGRESSION_DECISION: "${{ steps.test6.outputs.emitter_regression_decision || steps.test6.outputs.regression_decision || 'candidate_failed' }}"
          REGRESSION_CURRENT_VERSION: "2.5.2"
          REGRESSION_LATEST_VERSION: "${{ steps.test6.outputs.regression_latest_version || '3.12.0' }}"
          REGRESSION_NEXT_INSTALLED_VERSION: "${{ steps.test6.outputs.regression_next_installed_version || 'not_installed' }}"
          REGRESSION_RESULT: "${{ steps.test6.outputs.regression_result || 'Regression validation did not complete.' }}"
          REGRESSION_DETAILS: "${{ steps.test6.outputs.details || 'Regression comparison unavailable because validation did not complete.' }}"
          RESULT_PATH: ".package-result.json"
          FAIL_ON_TEST6: "true"
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          from pathlib import Path


          def environment(name: str, default: str = "") -> str:
              return os.environ.get(name, default)


          def normalize_status(value: str) -> str:
              normalized = value.lower()
              if normalized in {"passed", "pass", "success"}:
                  return "passed"
              if normalized in {
                  "failed",
                  "fail",
                  "failure",
                  "cancelled",
                  "canceled",
                  "timed_out",
                  "timedout",
              }:
                  return "failed"
              return "skipped"


          def as_int(value: str) -> int:
              return int(value) if re.fullmatch(r"[0-9]+", value) else 0


          def escape_markdown_cell(value: str) -> str:
              return value.replace("\n", " ").replace("|", r"\|")


          statuses = [
              normalize_status(environment(f"TEST{number}_STATUS"))
              for number in range(1, 7)
          ]
          durations = [
              as_int(environment(f"TEST{number}_DURATION", "0"))
              for number in range(1, 7)
          ]
          regression_decision = environment("REGRESSION_DECISION", "not_configured")
          safe_regression_decisions = {
              "not_applicable_package_manager",
              "package_manager_regression_safe_skip",
              "no_newer_stable_available",
              "current_is_latest_stable",
              "pinned_is_latest",
              "already_current",
              "already_at_latest",
              "at_latest",
              "current_is_latest",
              "metadata_review_required",
              "runtime_validation_not_automated",
              "bounded_runtime_deferred",
              "arm64_desktop_artifact_unavailable",
              "hold_current_arm_dependency_gap",
          }

          passed = sum(status == "passed" for status in statuses[:5])
          failed = sum(status == "failed" for status in statuses[:5])
          skipped = sum(status == "skipped" for status in statuses[:5])
          core_failed = failed + skipped

          if statuses[5] == "passed":
              passed += 1
          elif statuses[5] == "failed":
              failed += 1
          else:
              skipped += 1

          duration = sum(durations)
          should_fail = int(
              core_failed != 0
              or (
                  environment("FAIL_ON_TEST6", "true") == "true"
                  and statuses[5] == "failed"
              )
          )
          if (
              core_failed == 0
              and statuses[5] == "skipped"
              and regression_decision not in safe_regression_decisions
          ):
              should_fail = 1
          overall_status = "failure" if should_fail else "success"
          badge_status = "passing" if core_failed == 0 else "failing"

          if environment("SUMMARY_STYLE", "baseline-artifact") == "python-package":
              default_labels = (
                  "Test 1 - Package installed",
                  "Test 2 - Version metadata matches baseline",
                  "Test 3 - Installed files metadata",
                  "Test 4 - Architecture Verification",
                  "Test 5 - Functional Validation",
              )
          else:
              default_labels = (
                  "Test 1 - Baseline artifact exists",
                  "Test 2 - Baseline metadata check",
                  "Test 3 - Source or documentation presence",
                  "Test 4 - Architecture Verification",
                  "Test 5 - Bounded functional validation",
              )
          labels = [
              environment(f"TEST{number}_LABEL") or default_labels[number - 1]
              for number in range(1, 6)
          ]

          regression_current = environment("REGRESSION_CURRENT_VERSION", "unknown")
          regression_latest_raw = environment("REGRESSION_LATEST_VERSION", "unknown")
          regression_latest = regression_latest_raw
          if not regression_latest or regression_latest in {"n/a", "unknown"}:
              if regression_decision in {
                  "metadata_review_required",
                  "current_is_latest_stable",
                  "pinned_is_latest",
                  "already_current",
                  "already_at_latest",
                  "at_latest",
                  "current_is_latest",
                  "no_newer_stable_available",
                  "runtime_validation_not_automated",
                  "bounded_runtime_deferred",
                  "arm64_desktop_artifact_unavailable",
                  "hold_current_arm_dependency_gap",
                  "baseline_failed",
                  "baseline_install_failed",
              }:
                  regression_latest = regression_current
              elif regression_decision in {
                  "not_applicable_package_manager",
                  "package_manager_regression_safe_skip",
              }:
                  regression_latest = "package-manager installed"
              elif regression_decision == "not_configured":
                  regression_latest = "not configured"
              else:
                  regression_latest = regression_latest_raw or "unknown"

          regression_result = environment(
              "REGRESSION_RESULT",
              "Regression result unavailable.",
          )
          regression_details = environment(
              "REGRESSION_DETAILS",
              "Regression comparison summary unavailable.",
          )
          regression_reason = regression_details
          if regression_reason in {
              "",
              "Regression comparison summary unavailable.",
              "No regression note recorded.",
          }:
              regression_reason = regression_result
          if not regression_reason:
              regression_reason = "Regression comparison summary unavailable."

          if regression_decision in {
              "not_applicable_package_manager",
              "package_manager_regression_safe_skip",
          }:
              test6_line = "6. Regression applicability: package-manager installed (not applicable)"
          elif regression_decision == "limited_cpu_smoke_validated":
              test6_line = f"6. Test 6 - Arm preflight proof: {statuses[5]}"
          elif regression_decision == "not_configured":
              test6_line = "6. Regression applicability: not configured"
          else:
              test6_line = f"6. Test 6 - Regression Validation: {statuses[5]}"

          summary_lines = [
              f"## {environment('PACKAGE_NAME')} Test Results",
              "",
              f"- **Version:** {environment('VERSION', 'unknown')}",
              f"- **Status:** {overall_status}",
              f"- **Tests Passed:** {passed}",
              f"- **Tests Failed:** {failed}",
              f"- **Tests Skipped:** {skipped}",
              f"- **Duration:** {duration}s",
              f"- **Runner:** {environment('RUNNER_LABEL')}",
              "",
              "### Test Details",
              *(f"{number}. {labels[number - 1]}: {statuses[number - 1]}" for number in range(1, 6)),
              test6_line,
              "",
              "### Regression Validation (Next Version Install)",
              "| Current tested | Next candidate | Decision | Reason |",
              "| :--- | :--- | :--- | :--- |",
              "| "
              + " | ".join(
                  (
                      escape_markdown_cell(regression_current),
                      escape_markdown_cell(regression_latest),
                      escape_markdown_cell(regression_decision),
                      escape_markdown_cell(regression_reason),
                  )
              )
              + " |",
              "",
          ]
          if regression_decision in {
              "not_applicable_package_manager",
              "package_manager_regression_safe_skip",
          }:
              summary_lines.append(
                  "> Badge policy: passing means Tests 1-5 passed. Test 6 is an approved "
                  "not-applicable package-manager skip, not a claimed newer-version runtime comparison."
              )
          else:
              summary_lines.append(
                  "> Support badge remains tied to package-specific Arm checks. For scoped lanes, "
                  "passing means an Arm preflight proof ran successfully; full end-to-end validation "
                  "can still require GPU, Kubernetes, OS boot, cloud, GUI, model, or device infrastructure."
              )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary_file:
              summary_file.write("\n".join(summary_lines) + "\n")

          payload = {
              "contract_version": "2.0",
              "metadata": {
                  "package_slug": environment("PACKAGE_SLUG").strip(),
                  "package_name": environment("PACKAGE_NAME").strip(),
                  "version": environment("VERSION", "unknown").strip(),
                  "runner": environment("RUNNER_LABEL").strip(),
              },
              "run": {
                  "status": overall_status,
                  "badge_status": badge_status,
              },
              "tests": {
                  "passed": passed,
                  "failed": failed,
                  "skipped": skipped,
                  "core_failed": core_failed,
                  "duration_seconds": duration,
                  "details": {
                      f"test{number}": statuses[number - 1]
                      for number in range(1, 7)
                  },
              },
              "regression": {
                  "decision": regression_decision,
                  "current_version": regression_current,
                  "latest_version": regression_latest_raw,
                  "next_installed_version": environment(
                      "REGRESSION_NEXT_INSTALLED_VERSION",
                      "not_installed",
                  ),
                  "result": regression_result,
                  "details": regression_details,
              },
          }
          result_path = Path(environment("RESULT_PATH", ".package-result.json"))
          result_path.parent.mkdir(parents=True, exist_ok=True)
          result_path.write_text(
              json.dumps(payload, indent=2) + "\n",
              encoding="utf-8",
          )

          outputs = (
              ("passed", passed),
              ("failed", failed),
              ("skipped", skipped),
              ("core_failed", core_failed),
              ("duration", duration),
              ("overall_status", overall_status),
              ("badge_status", badge_status),
              ("should_fail", should_fail),
              ("result_path", str(result_path)),
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output_file:
              for name, value in outputs:
                  output_file.write(f"{name}={value}\n")
          PY

      - name: "Enforce strict smoke-test result"
        id: enforce
        if: always()
        shell: bash
        env:
          SHOULD_FAIL: "${{ steps.summary.outputs.should_fail || '1' }}"
          RUN_STATUS: "${{ steps.summary.outputs.overall_status || 'failure' }}"
          PASSED: "${{ steps.summary.outputs.passed || '0' }}"
          FAILED: "${{ steps.summary.outputs.failed || '0' }}"
          SKIPPED: "${{ steps.summary.outputs.skipped || '6' }}"
          TEST1_STATUS: "${{ steps.test1.outputs.status || 'skipped' }}"
          TEST2_STATUS: "${{ steps.test2.outputs.status || 'skipped' }}"
          TEST3_STATUS: "${{ steps.test3.outputs.status || 'skipped' }}"
          TEST4_STATUS: "${{ steps.test4.outputs.status || 'skipped' }}"
          TEST5_STATUS: "${{ steps.test5.outputs.status || 'skipped' }}"
        run: |
          set -euo pipefail
          TOTAL=$((PASSED + FAILED + SKIPPED))
          if [ "$TOTAL" -ne 6 ]; then
            printf '%s\n' 'Invalid smoke accounting: expected exactly six tests.' >&2
            exit 1
          fi
          for status in "$TEST1_STATUS" "$TEST2_STATUS" "$TEST3_STATUS" "$TEST4_STATUS" "$TEST5_STATUS"; do
            if [ "$status" != "passed" ]; then
              printf '%s\n' 'A required baseline test did not pass.' >&2
              exit 1
            fi
          done
          if [ "$SHOULD_FAIL" != "0" ] || [ "$RUN_STATUS" != "success" ]; then
            printf '%s\n' 'Canonical smoke policy rejected this result.' >&2
            exit 1
          fi

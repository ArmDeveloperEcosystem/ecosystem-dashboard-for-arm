          def import_diagnostic_observed(result: Result) -> bool:
              """Observe package-process output without claiming that import returned."""
              assertions = PLAN["functional_probe"]["assertions"]
              expected_exit = [
                  item["expected"] for item in assertions if item["kind"] == "exit_code"
              ]
              expected_markers = [
                  item["value"] for item in assertions if item["kind"] == "output_contains"
              ]
              if any(item["kind"] not in {"exit_code", "output_contains"} for item in assertions):
                  return False
              if len(expected_exit) > 1 or len(expected_markers) != 1:
                  return False
              exit_code = expected_exit[0] if expected_exit else 0
              lines = (result.stdout + result.stderr).splitlines()
              return result.returncode == exit_code and expected_markers[0] in lines



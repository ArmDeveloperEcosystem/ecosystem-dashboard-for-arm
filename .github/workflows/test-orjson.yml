name: "Test orjson on Arm64"

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      contract_version:
        description: "Output contract version"
        value: "${{ jobs.test-orjson.outputs.contract_version }}"
      package_slug:
        description: "Canonical package slug"
        value: "${{ jobs.test-orjson.outputs.package_slug }}"
      package_name:
        description: "Display package name"
        value: "${{ jobs.test-orjson.outputs.package_name }}"
      package_version:
        description: "Baseline version tested in this run"
        value: "${{ jobs.test-orjson.outputs.package_version }}"
      run_status:
        description: "Overall package run status"
        value: "${{ jobs.test-orjson.outputs.run_status }}"
      badge_status:
        description: "Badge status derived from all required checks"
        value: "${{ jobs.test-orjson.outputs.badge_status }}"
      core_failed:
        description: "Number of failed or skipped baseline checks"
        value: "${{ jobs.test-orjson.outputs.core_failed }}"
      tests_passed:
        description: "Count of passed tests"
        value: "${{ jobs.test-orjson.outputs.tests_passed }}"
      tests_failed:
        description: "Count of failed tests"
        value: "${{ jobs.test-orjson.outputs.tests_failed }}"
      tests_skipped:
        description: "Count of skipped or deferred tests"
        value: "${{ jobs.test-orjson.outputs.tests_skipped }}"
      duration_seconds:
        description: "Total duration across tests"
        value: "${{ jobs.test-orjson.outputs.duration_seconds }}"
      regression_status:
        description: "Regression test status"
        value: "${{ jobs.test-orjson.outputs.regression_status }}"
      regression_decision:
        description: "Regression decision label"
        value: "${{ jobs.test-orjson.outputs.regression_decision }}"
      regression_result:
        description: "Human-readable regression result"
        value: "${{ jobs.test-orjson.outputs.regression_result }}"
      regression_comparison:
        description: "Regression comparison note"
        value: "${{ jobs.test-orjson.outputs.regression_comparison }}"
      regression_current_version:
        description: "Baseline version used for comparison"
        value: "${{ jobs.test-orjson.outputs.regression_current_version }}"
      regression_latest_version:
        description: "Candidate version selected for validation"
        value: "${{ jobs.test-orjson.outputs.regression_latest_version }}"
      regression_next_installed_version:
        description: "Candidate version verified after installation"
        value: "${{ jobs.test-orjson.outputs.regression_next_installed_version }}"
      regression_policy:
        description: "Regression applicability policy"
        value: "${{ jobs.test-orjson.outputs.regression_policy }}"
      run_id:
        description: "GitHub run id"
        value: "${{ jobs.test-orjson.outputs.run_id }}"
      run_attempt:
        description: "GitHub run attempt"
        value: "${{ jobs.test-orjson.outputs.run_attempt }}"
      job_name:
        description: "GitHub job display name"
        value: "${{ jobs.test-orjson.outputs.job_name }}"
      dashboard_link:
        description: "Dashboard route for this package"
        value: "${{ jobs.test-orjson.outputs.dashboard_link }}"
      timestamp:
        description: "UTC timestamp for this package run"
        value: "${{ jobs.test-orjson.outputs.timestamp }}"

permissions: {}

env:
  SMOKE_PACKAGE_SLUG: "orjson"
  SMOKE_PACKAGE_NAME_B64: "b3Jqc29u"
  SMOKE_PACKAGE_REPOSITORY: "https://github.com/ijl/orjson"
  SMOKE_ARTIFACT_PINS_B64: ""
  SMOKE_ARTIFACT_PINS_DIGEST: "dcb8e28a2ef3bd6038c92dacb887b4bd1312dbaf21a116522f11ebe68fe66521"
  SMOKE_PIP_RUNTIME_BINDINGS_B64: ""
  SMOKE_PIP_RUNTIME_BINDINGS_DIGEST: "12e2794cb060a92786aad9ab88faab3499f6ff3fbd15004b2c53ffbc7364006f"
  SMOKE_PLAN_B64: ""
  SMOKE_PLAN_DIGEST: "adc3efc87ce8d0cd0e50ae111c069d9fc4af27669a2b34d212cbd9bc6e899400"

jobs:
  test-orjson:
    name: "Native Arm64 smoke validation"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions: {}
    outputs:
      contract_version: "2.0"
      package_slug: "orjson"
      package_name: "orjson"
      package_version: "2.5.2"
      run_status: "${{ steps.summary.outputs.overall_status || 'failure' }}"
      badge_status: "${{ steps.summary.outputs.badge_status || 'failing' }}"
      core_failed: "${{ steps.summary.outputs.core_failed || '5' }}"
      tests_passed: "${{ steps.summary.outputs.passed || '0' }}"
      tests_failed: "${{ steps.summary.outputs.failed || '0' }}"
      tests_skipped: "${{ steps.summary.outputs.skipped || '6' }}"
      duration_seconds: "${{ steps.summary.outputs.duration || '0' }}"
      regression_status: "${{ steps.test6.outputs.status || 'failed' }}"
      regression_decision: "${{ steps.test6.outputs.regression_decision || 'candidate_failed' }}"
      regression_result: "${{ steps.test6.outputs.regression_result || 'Regression validation did not complete.' }}"
      regression_comparison: "${{ steps.test6.outputs.details || 'Regression comparison unavailable because validation did not complete.' }}"
      regression_current_version: "2.5.2"
      regression_latest_version: "${{ steps.test6.outputs.regression_latest_version || '3.12.0' }}"
      regression_next_installed_version: "${{ steps.test6.outputs.regression_next_installed_version || 'not_installed' }}"
      regression_policy: "strict"
      run_id: "${{ github.run_id }}"
      run_attempt: "${{ github.run_attempt }}"
      job_name: "Native Arm64 smoke validation"
      dashboard_link: "/opensource_packages/orjson"
      timestamp: "${{ steps.metadata.outputs.timestamp || '' }}"
    steps:
      - name: "Record immutable run metadata"
        id: metadata
        shell: bash
        env:
          TRUSTED_RUNNER_ENVIRONMENT: "${{ runner.environment }}"
          TRUSTED_RUNNER_ARCH: "${{ runner.arch }}"
        run: |
          set -euo pipefail
          trusted_machine="$(/usr/bin/uname -m)"
          printf 'trusted_runner_environment=%s\n' "$TRUSTED_RUNNER_ENVIRONMENT"
          printf 'trusted_runner_arch=%s\n' "$TRUSTED_RUNNER_ARCH"
          printf 'trusted_runner_machine=%s\n' "$trusted_machine"
          [[ "$TRUSTED_RUNNER_ENVIRONMENT" == "github-hosted" ]]
          [[ "$TRUSTED_RUNNER_ARCH" == "ARM64" ]]
          [[ "$trusted_machine" == "aarch64" ]]
          printf 'timestamp=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: "Prepare trusted bounded smoke executor"
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          install -d -m 0700 "$RUNNER_TEMP"
          smoke_root="$RUNNER_TEMP/arm-smoke-orjson"
          smoke_harness="$RUNNER_TEMP/arm-smoke-orjson-executor.py"
          printf 'SMOKE_ROOT=%s\n' "$smoke_root" >> "$GITHUB_ENV"
          printf 'SMOKE_HARNESS=%s\n' "$smoke_harness" >> "$GITHUB_ENV"
          cat > "$smoke_harness" <<'PY'
          #!/usr/bin/env python3
          """Trusted host controller for isolated pip/npm smoke validation.

          Package-controlled code runs only in Docker containers. The controller and its
          GitHub output file are never mounted into those containers. This boundary
          reduces host exposure; it is not a defense against Docker daemon or kernel
          vulnerabilities.
          """

          from __future__ import annotations

          import base64
          import hashlib
          import json
          import os
          import re
          import selectors
          import shutil
          import signal
          import socket
          import subprocess
          import sys
          import time
          import traceback
          import urllib.error
          import urllib.request
          from dataclasses import dataclass
          from pathlib import Path
          from typing import Any
          from urllib.parse import unquote, urlsplit

          MAX_CAPTURE = 65536
          MAX_OUTPUT = 1048576
          MAX_ARTIFACT_BYTES = 268435456
          DOCKER = "/usr/bin/docker"
          UBUNTU_IMAGE = (
              "docker.io/library/ubuntu@"
              "sha256:4fbb8e6a8395de5a7550b33509421a2bafbc0aab6c06ba2cef9ebffbc7092d90"
          )
          IMAGE_ID_RE = re.compile(r"^sha256:[0-9a-f]{64}$")
          ROOT = Path(os.environ["SMOKE_ROOT"]).resolve()
          PLAN_BYTES = base64.b64decode(os.environ["SMOKE_PLAN_B64"], validate=True)
          PLAN = json.loads(PLAN_BYTES)
          EXPECTED_DIGEST = os.environ["SMOKE_PLAN_DIGEST"]
          ACTUAL_DIGEST = hashlib.sha256(
              json.dumps(PLAN, sort_keys=True, separators=(",", ":")).encode()
          ).hexdigest()
          if ACTUAL_DIGEST != EXPECTED_DIGEST:
              raise RuntimeError("embedded smoke plan digest mismatch")
          ARTIFACT_BYTES = base64.b64decode(
              os.environ["SMOKE_ARTIFACT_PINS_B64"],
              validate=True,
          )
          ARTIFACT_PINS = json.loads(ARTIFACT_BYTES)
          EXPECTED_ARTIFACT_DIGEST = os.environ["SMOKE_ARTIFACT_PINS_DIGEST"]
          ACTUAL_ARTIFACT_DIGEST = hashlib.sha256(
              json.dumps(ARTIFACT_PINS, sort_keys=True, separators=(",", ":")).encode()
          ).hexdigest()
          if ACTUAL_ARTIFACT_DIGEST != EXPECTED_ARTIFACT_DIGEST:
              raise RuntimeError("embedded registry artifact pin digest mismatch")
          RUNTIME_BYTES = base64.b64decode(
              os.environ["SMOKE_PIP_RUNTIME_BINDINGS_B64"],
              validate=True,
          )
          RUNTIME_BINDINGS = json.loads(RUNTIME_BYTES)
          EXPECTED_RUNTIME_DIGEST = os.environ["SMOKE_PIP_RUNTIME_BINDINGS_DIGEST"]
          ACTUAL_RUNTIME_DIGEST = hashlib.sha256(
              json.dumps(RUNTIME_BINDINGS, sort_keys=True, separators=(",", ":")).encode()
          ).hexdigest()
          if ACTUAL_RUNTIME_DIGEST != EXPECTED_RUNTIME_DIGEST:
              raise RuntimeError("embedded pip runtime binding digest mismatch")
          RECIPE = PLAN["recipe"]
          SLUG = os.environ["SMOKE_PACKAGE_SLUG"]
          if RECIPE.get("kind") not in {"pip", "npm"}:
              raise RuntimeError("only isolated pip/npm recipes are executable")
          if not isinstance(ARTIFACT_PINS, list) or not ARTIFACT_PINS:
              raise RuntimeError("registry artifact pins are missing")
          ARTIFACTS_BY_VERSION = {
              pin["version"]: pin
              for pin in ARTIFACT_PINS
              if isinstance(pin, dict) and isinstance(pin.get("version"), str)
          }
          if len(ARTIFACTS_BY_VERSION) != len(ARTIFACT_PINS):
              raise RuntimeError("registry artifact pins are malformed or duplicated")
          if (
              not isinstance(RUNTIME_BINDINGS, dict)
              or set(RUNTIME_BINDINGS) != {"schema_version", "bindings"}
              or RUNTIME_BINDINGS.get("schema_version") != "1.1"
              or not isinstance(RUNTIME_BINDINGS.get("bindings"), list)
          ):
              raise RuntimeError("pip runtime bindings are malformed")
          RUNTIMES_BY_VERSION = {}
          for binding in RUNTIME_BINDINGS["bindings"]:
              if (
                  not isinstance(binding, dict)
                  or set(binding) != {
                      "artifact_filename",
                      "artifact_sha256",
                      "artifact_url",
                      "glibc_major",
                      "glibc_minor",
                      "image",
                      "profile",
                      "python_executable",
                      "python_major",
                      "python_minor",
                      "python_patch",
                      "version",
                  }
                  or not isinstance(binding.get("version"), str)
                  or binding["version"] in RUNTIMES_BY_VERSION
                  or not re.fullmatch(r"cp3(?:8|9|10|11|12|13|14)", binding.get("profile", ""))
                  or not re.fullmatch(
                      r"docker\.io/library/python@sha256:[0-9a-f]{64}",
                      binding.get("image", ""),
                  )
                  or binding.get("python_executable") != "/usr/local/bin/python3"
                  or binding.get("python_major") != 3
                  or not isinstance(binding.get("python_minor"), int)
                  or not isinstance(binding.get("python_patch"), int)
                  or binding["python_patch"] < 0
                  or binding["profile"] != f"cp3{binding['python_minor']}"
                  or binding.get("glibc_major") != 2
                  or binding.get("glibc_minor") != 36
                  or not isinstance(binding.get("artifact_filename"), str)
                  or not binding["artifact_filename"]
                  or not isinstance(binding.get("artifact_url"), str)
                  or not re.fullmatch(r"[0-9a-f]{64}", binding.get("artifact_sha256", ""))
              ):
                  raise RuntimeError("pip runtime binding record is malformed")
              pin = ARTIFACTS_BY_VERSION.get(binding["version"])
              pinned_artifacts = {
                  (record.get("filename"), record.get("url"), record.get("sha256"))
                  for record in pin.get("artifacts", [])
                  if isinstance(record, dict)
              } if isinstance(pin, dict) else set()
              selected_artifact = (
                  binding["artifact_filename"],
                  binding["artifact_url"],
                  binding["artifact_sha256"],
              )
              if selected_artifact not in pinned_artifacts:
                  raise RuntimeError("pip runtime binding references an unpinned artifact")
              RUNTIMES_BY_VERSION[binding["version"]] = binding
          if RECIPE["kind"] == "pip" and set(RUNTIMES_BY_VERSION) != set(ARTIFACTS_BY_VERSION):
              raise RuntimeError("pip runtime bindings do not cover every package lane")
          if RECIPE["kind"] == "npm" and RUNTIMES_BY_VERSION:
              raise RuntimeError("npm recipes cannot contain pip runtime bindings")
          if ROOT == Path("/") or len(ROOT.parts) < 3:
              raise RuntimeError("unsafe smoke controller root")
          LAST_INSTALL_FAILURE_CLASS = "not_run"


          @dataclass(frozen=True)
          class Result:
              argv: tuple[str, ...]
              returncode: int
              stdout: str
              stderr: str


          class SmokeTestFailure(RuntimeError):
              """A test already emitted deterministic failure outputs."""


          def safe_host_environment() -> dict[str, str]:
              home = ROOT / "controller-home"
              docker_config = ROOT / "empty-docker-config"
              temp = ROOT / "controller-tmp"
              for directory in (home, docker_config, temp):
                  directory.mkdir(parents=True, exist_ok=True, mode=0o700)
              return {
                  "PATH": "/usr/sbin:/usr/bin:/sbin:/bin",
                  "HOME": str(home),
                  "DOCKER_CONFIG": str(docker_config),
                  "TMPDIR": str(temp),
                  "LANG": "C.UTF-8",
                  "LC_ALL": "C.UTF-8",
              }


          def append_tail(target: bytearray, chunk: bytes) -> None:
              target.extend(chunk)
              if len(target) > MAX_CAPTURE:
                  del target[: len(target) - MAX_CAPTURE]


          def terminate_group(process: subprocess.Popen[bytes]) -> None:
              if process.poll() is not None:
                  return
              try:
                  os.killpg(process.pid, signal.SIGTERM)
                  process.wait(timeout=2)
              except (OSError, subprocess.TimeoutExpired):
                  try:
                      os.killpg(process.pid, signal.SIGKILL)
                  except OSError:
                      process.kill()
                  try:
                      process.wait(timeout=2)
                  except subprocess.TimeoutExpired:
                      process.kill()


          def run(argv: list[str], *, timeout: int = 300, max_output: int = MAX_OUTPUT) -> Result:
              if (not argv or argv[0] != DOCKER or timeout < 1 or timeout > 900
                      or not 1 <= max_output <= MAX_OUTPUT):
                  raise ValueError("invalid bounded Docker invocation")
              process = subprocess.Popen(
                  argv,
                  env=safe_host_environment(),
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  start_new_session=True,
              )
              if process.stdout is None or process.stderr is None:
                  terminate_group(process)
                  raise RuntimeError("subprocess pipes unavailable")
              selector = selectors.DefaultSelector()
              selector.register(process.stdout, selectors.EVENT_READ, "stdout")
              selector.register(process.stderr, selectors.EVENT_READ, "stderr")
              tails = {"stdout": bytearray(), "stderr": bytearray()}
              total = 0
              deadline = time.monotonic() + timeout
              try:
                  while selector.get_map():
                      remaining = deadline - time.monotonic()
                      if remaining <= 0:
                          terminate_group(process)
                          return Result(tuple(argv), 124, "", "Docker command timed out")
                      for key, _ in selector.select(min(remaining, 0.2)):
                          chunk = os.read(key.fd, 8192)
                          if not chunk:
                              selector.unregister(key.fileobj)
                              continue
                          total += len(chunk)
                          append_tail(tails[str(key.data)], chunk)
                          if total > max_output:
                              terminate_group(process)
                              return Result(tuple(argv), 125, "", "Docker output limit exceeded")
                  returncode = process.wait(timeout=max(0.1, deadline - time.monotonic()))
              finally:
                  selector.close()
                  if process.poll() is None:
                      terminate_group(process)
                  process.stdout.close()
                  process.stderr.close()
              try:
                  errors = "strict" if max_output <= MAX_CAPTURE else "replace"
                  result = Result(
                      tuple(argv),
                      returncode,
                      bytes(tails["stdout"]).decode("utf-8", errors=errors),
                      bytes(tails["stderr"]).decode("utf-8", errors=errors),
                  )
              except UnicodeDecodeError:
                  return Result(tuple(argv), 125, "", "Docker output is not UTF-8")
              print(
                  "bounded_docker_command="
                  + json.dumps(
                      {"argv": logged_argv(argv), "returncode": returncode},
                      separators=(",", ":"),
                  )
              )
              if returncode != 0:
                  if result.stdout:
                      print(result.stdout)
                  if result.stderr:
                      print(result.stderr, file=sys.stderr)
              return result


          def succeeded(result: Result) -> bool:
              return result.returncode == 0


          def logged_argv(argv: list[str]) -> list[str]:
              logged: list[str] = []
              for value in [Path(argv[0]).name, *argv[1:]]:
                  if len(value) <= 200:
                      logged.append(value)
                      continue
                  digest = hashlib.sha256(value.encode("utf-8")).hexdigest()
                  logged.append(f"<arg bytes={len(value)} sha256={digest}>")
              return logged


          def write_outputs(path: Path, values: dict[str, str | int]) -> None:
              with path.open("a", encoding="utf-8") as handle:
                  for key, raw_value in values.items():
                      value = str(raw_value).replace("\r", " ").replace("\n", " ")[:2000]
                      handle.write(f"{key}={value}\n")


          def complete(
              output_path: Path,
              *,
              passed: bool,
              started: float,
              details: str,
              extra: dict[str, str | int] | None = None,
          ) -> None:
              values: dict[str, str | int] = {
                  "status": "passed" if passed else "failed",
                  "duration": max(0, int(time.monotonic() - started)),
                  "details": details,
              }
              if extra:
                  values.update(extra)
              print(details)
              write_outputs(output_path, values)
              if not passed:
                  raise SmokeTestFailure(details)


          def lane_dir(lane: str) -> Path:
              if lane not in {"baseline", "candidate"}:
                  raise ValueError("invalid package lane")
              return ROOT / lane


          def dockerfile_run(argv: list[str]) -> str:
              return "RUN " + json.dumps(argv, separators=(",", ":"))


          def runtime_binding(version: str) -> dict[str, Any]:
              binding = RUNTIMES_BY_VERSION.get(version)
              if not isinstance(binding, dict):
                  raise RuntimeError("requested version has no trusted pip runtime binding")
              return binding


          def runtime_dockerfile(version: str) -> str:
              if RECIPE["kind"] == "pip":
                  binding = runtime_binding(version)
                  base_image = binding["image"]
                  packages: list[str] = []
              else:
                  base_image = UBUNTU_IMAGE
                  packages = ["ca-certificates", "passwd", "python3", "python3-pip", "nodejs", "npm"]
              lines = [f"FROM {base_image}"]
              if packages:
                  lines.extend(
                      [
                          dockerfile_run(["apt-get", "update"]),
                          dockerfile_run(
                              ["apt-get", "install", "-y", "--no-install-recommends", *packages]
                          ),
                          dockerfile_run(["groupadd", "--gid", "65532", "smoke"]),
                          dockerfile_run(
                              [
                                  "useradd",
                                  "--uid",
                                  "65532",
                                  "--gid",
                                  "65532",
                                  "--home-dir",
                                  "/opt/smoke/home",
                                  "--no-create-home",
                                  "--shell",
                                  "/usr/sbin/nologin",
                                  "smoke",
                              ]
                          ),
                      ]
                  )
              lines.extend(
                  [
                      dockerfile_run(
                          [
                              "install",
                              "-d",
                              "-m",
                              "0755",
                              "-o",
                              "65532",
                              "-g",
                              "65532",
                              "/opt/smoke",
                              "/opt/smoke/home",
                              "/opt/smoke/artifact",
                              "/opt/smoke/prefix",
                              "/opt/smoke/work",
                          ]
                      ),
                  "ENV HOME=/opt/smoke/home",
                  "ENV LANG=C.UTF-8",
                  "ENV LC_ALL=C.UTF-8",
                  "ENV CI=true",
                  "ENV PIP_DISABLE_PIP_VERSION_CHECK=1",
                  "ENV PIP_NO_INPUT=1",
                  "ENV NPM_CONFIG_AUDIT=false",
                  "ENV NPM_CONFIG_FUND=false",
                  "USER 65532:65532",
                  "WORKDIR /opt/smoke/work",
                  "ENTRYPOINT []",
                  ]
              )
              return "\n".join(lines) + "\n"


          def inspect_image(reference: str) -> str | None:
              inspected = run(
                  [
                      DOCKER,
                      "image",
                      "inspect",
                      "--format",
                      "{{.Id}} {{.Architecture}}",
                      reference,
                  ],
                  timeout=60,
              )
              fields = inspected.stdout.strip().split()
              if (
                  not succeeded(inspected)
                  or len(fields) != 2
                  or not IMAGE_ID_RE.fullmatch(fields[0])
                  or fields[1] != "arm64"
              ):
                  return None
              return fields[0]


          def ensure_runtime_image(version: str) -> str | None:
              profile = runtime_binding(version)["profile"] if RECIPE["kind"] == "pip" else "npm"
              marker = ROOT / f"runtime-image-{profile}"
              if marker.is_file():
                  image = marker.read_text(encoding="utf-8").strip()
                  return image if inspect_image(image) == image else None
              context = ROOT / f"controller-build-context-{profile}"
              if context.exists():
                  shutil.rmtree(context)
              context.mkdir(parents=True, mode=0o700)
              dockerfile = context / "Dockerfile"
              dockerfile.write_text(runtime_dockerfile(version), encoding="utf-8")
              dockerfile.chmod(0o400)
              tag = (
                  f"arm-smoke-runtime-{RECIPE['kind']}-{profile}:"
                  f"{os.getpid()}-{EXPECTED_DIGEST[:12]}"
              )
              built = run(
                  [
                      DOCKER,
                      "build",
                      "--no-cache",
                      "--pull",
                      "--network",
                      "default",
                      "--build-arg",
                      "HTTP_PROXY=",
                      "--build-arg",
                      "HTTPS_PROXY=",
                      "--build-arg",
                      "NO_PROXY=",
                      "--build-arg",
                      "ALL_PROXY=",
                      "--tag",
                      tag,
                      "--file",
                      str(dockerfile),
                      str(context),
                  ],
                  timeout=900,
              )
              image = inspect_image(tag) if succeeded(built) else None
              if image is None:
                  return None
              marker.write_text(image + "\n", encoding="utf-8")
              marker.chmod(0o600)
              return image


          PIP_RUNTIME_PROBE_SCRIPT = r"""
          import json
          import platform
          import sys

          libc_name, libc_version = platform.libc_ver()
          print(
              json.dumps(
                  {
                      "implementation": platform.python_implementation(),
                      "python_major": sys.version_info.major,
                      "python_minor": sys.version_info.minor,
                      "python_patch": sys.version_info.micro,
                      "machine": platform.machine(),
                      "libc_name": libc_name,
                      "libc_version": libc_version,
                  },
                  sort_keys=True,
                  separators=(",", ":"),
              )
          )
          """


          def verify_pip_runtime(image: str, version: str) -> bool:
              binding = runtime_binding(version)
              observed = run(
                  [
                      DOCKER,
                      "run",
                      "--rm",
                      "--user",
                      "65532:65532",
                      "--read-only",
                      "--cap-drop",
                      "ALL",
                      "--security-opt",
                      "no-new-privileges",
                      "--pids-limit",
                      "64",
                      "--memory",
                      "128m",
                      "--memory-swap",
                      "128m",
                      "--cpus",
                      "1",
                      "--network",
                      "none",
                      "--entrypoint",
                      binding["python_executable"],
                      image,
                      "-I",
                      "-S",
                      "-c",
                      PIP_RUNTIME_PROBE_SCRIPT,
                  ],

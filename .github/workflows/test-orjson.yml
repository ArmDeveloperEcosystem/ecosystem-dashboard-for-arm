                  payload: Any = json.loads(observed.stdout)
              except ValueError:
                  return False
              expected = {
                  "implementation": "CPython",
                  "python_major": binding["python_major"],
                  "python_minor": binding["python_minor"],
                  "python_patch": binding["python_patch"],
                  "machine": "aarch64",
                  "libc_name": "glibc",
                  "libc_version": f"{binding['glibc_major']}.{binding['glibc_minor']}",
              }

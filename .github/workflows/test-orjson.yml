          def probe_strict_json(raw, limit):
              if not isinstance(raw, str) or len(raw.encode("utf-8")) > limit:
                  raise ValueError("probe JSON exceeds byte limit")
              # Bound nesting before the recursive JSON parser sees untrusted data.
              depth = 0
              quoted = escaped = False
              for char in raw:
                  if quoted:
                      if escaped:
                          escaped = False
                      elif char == "\\":
                          escaped = True
                      elif char == '"':
                          quoted = False
                  elif char == '"':
                      quoted = True
                  elif char in "[{":
                      depth += 1
                      if depth > 16:
                          raise ValueError("probe JSON exceeds depth limit")
                  elif char in "]}":
                      depth -= 1

              def pairs(items):
                  result = {}
                  for key, value in items:
                      if key in result:
                          raise ValueError("duplicate probe JSON field")
                      result[key] = value
                  return result

              def constant(value):
                  raise ValueError("nonfinite probe JSON number")

              def number(value):
                  if len(value) > 64:
                      raise ValueError("probe JSON number exceeds bound")
                  parsed = float(value) if any(c in value for c in ".eE") else int(value)
                  if isinstance(parsed, float) and not math.isfinite(parsed):
                      raise ValueError("nonfinite probe JSON number")
                  return parsed

              parsed = json.loads(raw, object_pairs_hook=pairs, parse_constant=constant,
                                  parse_int=number, parse_float=number)
              pending = [parsed]
              count = 0
              while pending:
                  value = pending.pop()
                  count += 1
                  if count > 2048:
                      raise ValueError("probe JSON exceeds node limit")
                  if isinstance(value, dict):
                      pending.extend(value.keys())
                      pending.extend(value.values())
                  elif isinstance(value, list):
                      pending.extend(value)
                  elif isinstance(value, str):
                      value.encode("utf-8", errors="strict")
              return parsed


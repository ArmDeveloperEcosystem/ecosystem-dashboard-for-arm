          FUNCTIONAL_ATTEMPTS = {}


          def orjson_challenge(binding, nonce):
              if not re.fullmatch(r"[0-9a-f]{32}", nonce):
                  raise ValueError("invalid probe nonce")
              salt = hashlib.sha256((probe_json(binding) + nonce).encode()).hexdigest()
              integer = int(salt[:8], 16)
              encode_values = [
                  {"unicode": "caf\u00e9 \u6771\u4eac \U0001f680 " + salt[:16],
                   "nested": [None, True, False, {"n": integer, "escaped": "\n\t\"\\"}]},
                  [integer, -integer, [], {}],
                  None, True, False, "scalar-" + salt[16:32], 1.5,
                  -9223372036854775808, 18446744073709551615,
                  -9223372036854775809, 18446744073709551616,
              ]
              # Decoding inputs are independent JSON texts, never outputs of package.dumps.
              decode_texts = [
                  ' { "items" : [null, true, false, {"n": ' + str(integer + 1) + '}], '
                  '"text": "\\u6771\\u4eac-' + salt[32:48] + '" } ',
                  '"caf\\u00e9 \\ud83d\\ude80"',
                  "null", "true", "false", "1.5", "-9223372036854775808",
                  "18446744073709551615", "[1,]", '{"a":}', "", "NaN", "Infinity",
                  "-Infinity", '{"a":1} trailing', '"\\ud800"',
              ]
              operations = [
                  {"id": "encode-" + str(i), "operation": "dumps", "input": value}
                  for i, value in enumerate(encode_values)
              ] + [
                  {"id": "decode-" + str(i), "operation": "loads", "input": value}
                  for i, value in enumerate(decode_texts)
              ]
              request = {"profile": "orjson-json-v1", "binding": binding,
                         "challenge": nonce, "operations": operations}
              if len(operations) > ORJSON_MAX_OPERATIONS:
                  raise ValueError("probe operation limit exceeded")
              return probe_strict_json(probe_json(request), ORJSON_MAX_REQUEST)


          def orjson_expected(request):
              results = []
              # Historical 2.5.2 uses PyLong_AsLongLong; modern releases also encode u64.
              # Select from the controller-held release binding, never package observations.
              max_encode_integer = (
                  9223372036854775807
                  if request["binding"]["version"] == "2.5.2"
                  else 18446744073709551615
              )
              for operation in request["operations"]:
                  value = operation["input"]
                  result = {"id": operation["id"], "operation": operation["operation"]}
                  if operation["operation"] == "dumps":
                      if type(value) is int and not -9223372036854775808 <= value <= max_encode_integer:
                          result.update(status="error", result={"exception": "JSONEncodeError"})
                      else:
                          # Common JSON subset only: no float-format equivalence assumptions.
                          encoded = json.dumps(value, ensure_ascii=False, allow_nan=False,
                                               separators=(",", ":"))
                          result.update(status="ok", result={"type": "bytes", "utf8": encoded})
                  else:
                      try:
                          decoded = probe_strict_json(value, ORJSON_MAX_REQUEST)
                          result.update(status="ok", result={"type": "json", "value": decoded})
                      except ValueError:
                          result.update(status="error", result={"exception": "JSONDecodeError"})
                  results.append(result)
              return {"profile": request["profile"], "binding": request["binding"],
                      "challenge": request["challenge"], "status": "complete", "results": results}


          def orjson_response_ok(stdout, expected):
              try:
                  observed = probe_strict_json(stdout, ORJSON_MAX_RESPONSE)
                  # Exact full schema/value equality, including every operation and outcome.
                  # Canonical serialization distinguishes bool/int/float, unlike Python ==.
                  matched = probe_json(observed) == probe_json(expected)
                  if not matched:
                      differences = []
                      rows = observed.get("results") if isinstance(observed, dict) else None
                      if isinstance(rows, list) and len(rows) == len(expected["results"]):
                          for wanted, actual in zip(expected["results"], rows):
                              if probe_json(wanted) != probe_json(actual):
                                  differences.append({
                                      "id": wanted["id"],
                                      "expected_json": probe_json(wanted)[:512],
                                      "observed_json": probe_json(actual)[:512],
                                  })
                                  if len(differences) == 3:
                                      break
                      # Bounded, escaped observations aid diagnosis; never authorize a result.
                      print("orjson_comparison_diagnostic=" + probe_json({"differences": differences}))
                  return matched
              except (ValueError, TypeError, RecursionError):
                  return False


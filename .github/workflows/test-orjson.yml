          class ArtifactDownloadFailure(RuntimeError):
              """Trusted artifact acquisition failed before package code could execute."""

              def __init__(self, failure_class: str) -> None:
                  super().__init__(failure_class)
                  self.failure_class = failure_class


          class NoArtifactRedirect(urllib.request.HTTPRedirectHandler):
              """Exact registry artifact URLs cannot redirect to a different resource."""

              def redirect_request(
                  self,
                  req: urllib.request.Request,
                  fp: Any,
                  code: int,
                  msg: str,
                  headers: Any,
                  newurl: str,
              ) -> None:
                  return None


          def selected_artifact_record(version: str) -> dict[str, Any]:
              pin = ARTIFACTS_BY_VERSION.get(version)
              if (
                  not isinstance(pin, dict)
                  or pin.get("schema_version") != "1.3"
                  or pin.get("recipe_kind") != RECIPE["kind"]
                  or pin.get("version") != version
              ):
                  raise ArtifactDownloadFailure("artifact_policy_failure")
              records = pin.get("artifacts")
              if not isinstance(records, list) or not records:
                  raise ArtifactDownloadFailure("artifact_policy_failure")
              if RECIPE["kind"] == "pip":
                  binding = runtime_binding(version)
                  selected = [
                      record
                      for record in records
                      if isinstance(record, dict)
                      and record.get("filename") == binding["artifact_filename"]
                      and record.get("url") == binding["artifact_url"]
                      and record.get("sha256") == binding["artifact_sha256"]
                  ]
              else:
                  selected = records
              if len(selected) != 1 or not isinstance(selected[0], dict):
                  raise ArtifactDownloadFailure("artifact_policy_failure")
              record = selected[0]
              allowed_keys = {"filename", "integrity", "requires_python", "sha256", "url"}
              if not {"filename", "integrity", "sha256", "url"}.issubset(record) or not set(
                  record
              ).issubset(allowed_keys):
                  raise ArtifactDownloadFailure("artifact_policy_failure")
              artifact_url = record.get("url")
              filename = record.get("filename")
              try:
                  parsed = urlsplit(artifact_url) if isinstance(artifact_url, str) else None
                  port = parsed.port if parsed is not None else None
              except ValueError as exc:
                  raise ArtifactDownloadFailure("artifact_policy_failure") from exc
              expected_host = (
                  "files.pythonhosted.org" if RECIPE["kind"] == "pip" else "registry.npmjs.org"
              )
              if (
                  parsed is None
                  or parsed.scheme != "https"
                  or parsed.hostname != expected_host
                  or parsed.username is not None
                  or parsed.password is not None
                  or port not in (None, 443)
                  or parsed.query
                  or parsed.fragment
                  or not isinstance(filename, str)
                  or not filename
                  or unquote(parsed.path.rsplit("/", 1)[-1]) != filename

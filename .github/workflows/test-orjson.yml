              elif (
                  not parsed.path.endswith(".tgz")
                  or record.get("sha256") is not None
                  or not isinstance(record.get("integrity"), str)
                  or not record["integrity"].startswith("sha512-")
              ):
                  raise ArtifactDownloadFailure("artifact_policy_failure")
              return record


          def verified_artifact_directory(lane: str) -> Path:
              if lane not in {"baseline", "candidate"}:
                  raise ValueError("invalid package lane")
              return ROOT / "verified-artifacts" / lane


          def download_verified_artifact(version: str, lane: str) -> Path:
              record = selected_artifact_record(version)
              artifact_url = str(record["url"])
              filename = str(record["filename"])
              directory = verified_artifact_directory(lane)
              if directory.exists():
                  directory.chmod(0o700)
                  shutil.rmtree(directory)
              directory.mkdir(parents=True, mode=0o700)
              target = directory / filename
              request = urllib.request.Request(
                  artifact_url,
                  headers={
                      "Accept-Encoding": "identity",
                      "User-Agent": "arm-ecosystem-smoke-validator/2.0",
                  },
                  method="GET",
              )
              opener = urllib.request.build_opener(NoArtifactRedirect())
              digest = hashlib.sha256() if RECIPE["kind"] == "pip" else hashlib.sha512()
              total = 0
              try:
                  with opener.open(request, timeout=60) as response, target.open("xb") as handle:
                      status = getattr(response, "status", None)
                      final_url = response.geturl()
                      content_encoding = response.headers.get("Content-Encoding", "identity").casefold()
                      declared_length = response.headers.get("Content-Length")
                      if (
                          status != 200
                          or final_url != artifact_url
                          or content_encoding not in {"", "identity"}
                          or (
                              declared_length is not None
                              and (
                                  not declared_length.isdigit()
                                  or int(declared_length) > MAX_ARTIFACT_BYTES
                              )
                          )
                      ):
                          raise ArtifactDownloadFailure("artifact_response_policy_failure")
                      while True:
                          chunk = response.read(65536)
                          if not chunk:
                              break
                          total += len(chunk)
                          if total > MAX_ARTIFACT_BYTES:
                              raise ArtifactDownloadFailure("artifact_size_limit")
                          digest.update(chunk)
                          handle.write(chunk)
              except ArtifactDownloadFailure:
                  target.unlink(missing_ok=True)
                  raise
              except urllib.error.HTTPError as exc:
                  target.unlink(missing_ok=True)
                  raise ArtifactDownloadFailure("artifact_http_failure") from exc
              except (TimeoutError, socket.timeout) as exc:
                  target.unlink(missing_ok=True)
                  raise ArtifactDownloadFailure("artifact_download_timeout") from exc
              except (OSError, urllib.error.URLError) as exc:
                  target.unlink(missing_ok=True)
                  raise ArtifactDownloadFailure("artifact_download_failure") from exc
              if RECIPE["kind"] == "pip":
                  actual_digest = digest.hexdigest()
                  expected_digest = str(record["sha256"])
              else:
                  actual_digest = "sha512-" + base64.b64encode(digest.digest()).decode("ascii")
                  expected_digest = str(record["integrity"])
              if actual_digest != expected_digest:
                  target.unlink(missing_ok=True)
                  raise ArtifactDownloadFailure("artifact_digest_mismatch")
              target.chmod(0o444)
              directory.chmod(0o555)
              print(
                  "trusted_registry_artifact="
                  f"{RECIPE['kind']}|{version}|{filename}|{record.get('sha256') or record.get('integrity')}"
              )
              return target



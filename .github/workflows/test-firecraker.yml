name: Test Firecracker KVM guest smoke on Arm64

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      contract_version:
        description: contract version
        value: ${{ jobs.test-firecraker.outputs.contract_version }}
      package_slug:
        description: package slug
        value: ${{ jobs.test-firecraker.outputs.package_slug }}
      package_name:
        description: package name
        value: ${{ jobs.test-firecraker.outputs.package_name }}
      package_version:
        description: package version
        value: ${{ jobs.test-firecraker.outputs.package_version }}
      run_status:
        description: run status
        value: ${{ jobs.test-firecraker.outputs.run_status }}
      badge_status:
        description: badge status
        value: ${{ jobs.test-firecraker.outputs.badge_status }}
      core_failed:
        description: core failed
        value: ${{ jobs.test-firecraker.outputs.core_failed }}
      tests_passed:
        description: tests passed
        value: ${{ jobs.test-firecraker.outputs.tests_passed }}
      tests_failed:
        description: tests failed
        value: ${{ jobs.test-firecraker.outputs.tests_failed }}
      tests_skipped:
        description: tests skipped
        value: ${{ jobs.test-firecraker.outputs.tests_skipped }}
      duration_seconds:
        description: duration seconds
        value: ${{ jobs.test-firecraker.outputs.duration_seconds }}
      regression_status:
        description: regression status
        value: ${{ jobs.test-firecraker.outputs.regression_status }}
      regression_decision:
        description: regression decision
        value: ${{ jobs.test-firecraker.outputs.regression_decision }}
      regression_result:
        description: regression result
        value: ${{ jobs.test-firecraker.outputs.regression_result }}
      regression_comparison:
        description: regression comparison
        value: ${{ jobs.test-firecraker.outputs.regression_comparison }}
      regression_current_version:
        description: regression current version
        value: ${{ jobs.test-firecraker.outputs.regression_current_version }}
      regression_latest_version:
        description: regression latest version
        value: ${{ jobs.test-firecraker.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: regression next installed version
        value: ${{ jobs.test-firecraker.outputs.regression_next_installed_version }}
      regression_policy:
        description: regression policy
        value: ${{ jobs.test-firecraker.outputs.regression_policy }}
      run_id:
        description: run id
        value: ${{ jobs.test-firecraker.outputs.run_id }}
      run_attempt:
        description: run attempt
        value: ${{ jobs.test-firecraker.outputs.run_attempt }}
      job_name:
        description: job name
        value: ${{ jobs.test-firecraker.outputs.job_name }}
      dashboard_link:
        description: dashboard link
        value: ${{ jobs.test-firecraker.outputs.dashboard_link }}
      timestamp:
        description: timestamp
        value: ${{ jobs.test-firecraker.outputs.timestamp }}
jobs:
  test-firecraker:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      BASELINE_TAG: "v1.17.0"
      # Publisher SHA256SUMS / release asset digest, verified 2026-10-27.
      BASELINE_SHA256: "e351ebe4f7a16b5873bbd51005d2e6767103cff4d5ebc829df2d3f95a93e2256"
    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: "Firecracker"
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '5' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '5' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'failed' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'baseline_failed' }}
      regression_result: ${{ steps.test6.outputs.regression_result || 'No regression validation evidence.' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'No regression validation evidence.' }}
      regression_current_version: ${{ steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'not_selected' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      regression_policy: "applicable"
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=firecraker" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/linux/opensource_packages/firecraker" >> "$GITHUB_OUTPUT"

      - name: Install verified Firecracker bundle
        id: install
        run: |
          set -euo pipefail
          [ "$(uname -m)" = aarch64 ]
          sudo apt-get update
          sudo apt-get install -y file jq cpio
          WORK_DIR=$(mktemp -d "$RUNNER_TEMP/firecracker-install.XXXXXX")
          ARCHIVE="$WORK_DIR/firecracker-$BASELINE_TAG-aarch64.tgz"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 \
            "https://github.com/firecracker-microvm/firecracker/releases/download/$BASELINE_TAG/firecracker-$BASELINE_TAG-aarch64.tgz" -o "$ARCHIVE"
          printf '%s  %s\n' "$BASELINE_SHA256" "$ARCHIVE" | sha256sum -c -
          tar -xzf "$ARCHIVE" -C "$WORK_DIR"
          EXTRACT="$WORK_DIR/release-$BASELINE_TAG-aarch64"
          [ -x "$EXTRACT/firecracker-$BASELINE_TAG-aarch64" ]
          [ -x "$EXTRACT/jailer-$BASELINE_TAG-aarch64" ]
          printf 'binary_path=%s\njailer_path=%s\narchive=%s\n' \
            "$EXTRACT/firecracker-$BASELINE_TAG-aarch64" "$EXTRACT/jailer-$BASELINE_TAG-aarch64" "$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Read exact installed version
        id: version
        env:
          BINARY: ${{ steps.install.outputs.binary_path }}
        run: |
          set -euo pipefail
          REPORTED=$(timeout --kill-after=2s 10s "$BINARY" --version)
          printf '%s\n' "$REPORTED"
          [ "$REPORTED" = "Firecracker $BASELINE_TAG" ]
          VERSION=${REPORTED#Firecracker }
          [ "$VERSION" = "$BASELINE_TAG" ]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test 1 - Firecracker and jailer executables
        id: test1
        continue-on-error: true
        env:
          BINARY: ${{ steps.install.outputs.binary_path }}
          ARCHIVE: ${{ steps.install.outputs.archive }}
          REPORTED_VERSION: ${{ steps.version.outputs.version }}
          JAILER: ${{ steps.install.outputs.jailer_path }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            rc=$?
            trap - EXIT
            status=failed
            [ "$rc" -ne 0 ] || status=passed
            printf 'status=%s\nduration=%s\n' "$status" "$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish EXIT
          [ -x "$BINARY" ]
          [ -x "$JAILER" ]

      - name: Test 2 - Exact Firecracker version
        id: test2
        continue-on-error: true
        env:
          BINARY: ${{ steps.install.outputs.binary_path }}
          ARCHIVE: ${{ steps.install.outputs.archive }}
          REPORTED_VERSION: ${{ steps.version.outputs.version }}
          JAILER: ${{ steps.install.outputs.jailer_path }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            rc=$?
            trap - EXIT
            status=failed
            [ "$rc" -ne 0 ] || status=passed
            printf 'status=%s\nduration=%s\n' "$status" "$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish EXIT
          [ "$REPORTED_VERSION" = "$BASELINE_TAG" ]
          OUTPUT=$(timeout --kill-after=2s 10s "$BINARY" --version)
          [ "$OUTPUT" = "Firecracker $BASELINE_TAG" ]

      - name: Test 3 - Pinned archive checksum and matching jailer version
        id: test3
        continue-on-error: true
        env:
          BINARY: ${{ steps.install.outputs.binary_path }}
          ARCHIVE: ${{ steps.install.outputs.archive }}
          REPORTED_VERSION: ${{ steps.version.outputs.version }}
          JAILER: ${{ steps.install.outputs.jailer_path }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            rc=$?
            trap - EXIT
            status=failed
            [ "$rc" -ne 0 ] || status=passed
            printf 'status=%s\nduration=%s\n' "$status" "$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish EXIT
          printf '%s  %s\n' "$BASELINE_SHA256" "$ARCHIVE" | sha256sum -c -
          OUTPUT=$(timeout --kill-after=2s 10s "$JAILER" --version)
          [ "$OUTPUT" = "Jailer $BASELINE_TAG" ]

      - name: Test 4 - Native Arm64 executables and mandatory KVM preflight
        id: test4
        continue-on-error: true
        env:
          BINARY: ${{ steps.install.outputs.binary_path }}
          ARCHIVE: ${{ steps.install.outputs.archive }}
          REPORTED_VERSION: ${{ steps.version.outputs.version }}
          JAILER: ${{ steps.install.outputs.jailer_path }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            rc=$?
            trap - EXIT
            status=failed
            [ "$rc" -ne 0 ] || status=passed
            printf 'status=%s\nduration=%s\n' "$status" "$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish EXIT
          [ "$(uname -m)" = aarch64 ]
          file "$BINARY" | grep -Eqi 'aarch64|arm64'
          file "$JAILER" | grep -Eqi 'aarch64|arm64'
          [ "$(getconf PAGESIZE)" = 4096 ]
          [ -c /dev/kvm ] && sudo test -r /dev/kvm && sudo test -w /dev/kvm

      - name: Test 5 - KVM microVM boot, guest file I/O and child exit propagation
        id: test5
        continue-on-error: true
        env:
          BINARY: ${{ steps.install.outputs.binary_path }}
          ARCHIVE: ${{ steps.install.outputs.archive }}
          REPORTED_VERSION: ${{ steps.version.outputs.version }}
          JAILER: ${{ steps.install.outputs.jailer_path }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            rc=$?
            trap - EXIT
            status=failed
            [ "$rc" -ne 0 ] || status=passed
            printf 'status=%s\nduration=%s\n' "$status" "$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish EXIT
          timeout --kill-after=10s 360s sudo bash .github/scripts/tests/firecracker_guest_smoke.sh "$BINARY" "$BASELINE_TAG"

      - name: Test 6 - Newer-release runtime validation explicitly deferred
        id: test6
        if: always()
        continue-on-error: true
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          VERSION_OUTCOME: ${{ steps.version.outcome }}
          S1: ${{ steps.test1.outputs.status }}
          O1: ${{ steps.test1.outcome }}
          S2: ${{ steps.test2.outputs.status }}
          O2: ${{ steps.test2.outcome }}
          S3: ${{ steps.test3.outputs.status }}
          O3: ${{ steps.test3.outcome }}
          S4: ${{ steps.test4.outputs.status }}
          O4: ${{ steps.test4.outcome }}
          S5: ${{ steps.test5.outputs.status }}
          O5: ${{ steps.test5.outcome }}
        run: |
          set -euo pipefail
          STATUS=deferred
          DECISION=runtime_validation_not_automated
          if [ "$INSTALL_OUTCOME" != success ] || [ "$VERSION_OUTCOME" != success ]; then
            STATUS=skipped
            DECISION=baseline_failed
          fi
          for i in 1 2 3 4 5; do
            s="S$i"; o="O$i"
            if [ "${!s}" != passed ] || [ "${!o}" != success ]; then
              STATUS=skipped
              DECISION=baseline_failed
            fi
          done
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"
          echo "latest_version=not_selected" >> "$GITHUB_OUTPUT"
          echo "next_installed_version=not_installed" >> "$GITHUB_OUTPUT"
          echo "regression_result=Newer-release validation not automated; no candidate was installed or tested." >> "$GITHUB_OUTPUT"
          echo "comparison=Baseline requires Arm64 KVM guest boot and file I/O; consult baseline outcomes. No newer-release regression or upgrade safety claim." >> "$GITHUB_OUTPUT"

      - name: Calculate fail-closed test summary
        id: summary
        if: always()
        env:
          S1: ${{ steps.test1.outputs.status }}
          O1: ${{ steps.test1.outcome }}
          S2: ${{ steps.test2.outputs.status }}
          O2: ${{ steps.test2.outcome }}
          S3: ${{ steps.test3.outputs.status }}
          O3: ${{ steps.test3.outcome }}
          S4: ${{ steps.test4.outputs.status }}
          O4: ${{ steps.test4.outcome }}
          S5: ${{ steps.test5.outputs.status }}
          O5: ${{ steps.test5.outcome }}
          D1: ${{ steps.test1.outputs.duration || '0' }}
          D2: ${{ steps.test2.outputs.duration || '0' }}
          D3: ${{ steps.test3.outputs.duration || '0' }}
          D4: ${{ steps.test4.outputs.duration || '0' }}
          D5: ${{ steps.test5.outputs.duration || '0' }}
          D6: ${{ steps.test6.outputs.duration || '0' }}
          S6: ${{ steps.test6.outputs.status }}
          O6: ${{ steps.test6.outcome }}
          DECISION: ${{ steps.test6.outputs.decision }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          VERSION_OUTCOME: ${{ steps.version.outcome }}
        run: |
          set -euo pipefail
          PASSED=0
          FAILED=0
          SKIPPED=0
          CORE_FAILED=0
          TOTAL_DURATION=0
          for i in 1 2 3 4 5; do
            s="S$i"; o="O$i"; d="D$i"
            if [ "$INSTALL_OUTCOME" = success ] && [ "$VERSION_OUTCOME" = success ] && [ "${!s}" = passed ] && [ "${!o}" = success ]; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
              CORE_FAILED=$((CORE_FAILED + 1))
            fi
            value="${!d}"
            [[ "$value" =~ ^[0-9]+$ ]] || value=0
            TOTAL_DURATION=$((TOTAL_DURATION + value))
          done
          if [ "$O6" = success ] && {
            { [ "$CORE_FAILED" -eq 0 ] && [ "$S6" = deferred ] && [ "$DECISION" = runtime_validation_not_automated ]; } ||
            { [ "$CORE_FAILED" -gt 0 ] && [ "$S6" = skipped ] && [ "$DECISION" = baseline_failed ]; }
          }; then
            SKIPPED=1
          else
            FAILED=$((FAILED + 1))
          fi
          [[ "$D6" =~ ^[0-9]+$ ]] || D6=0
          TOTAL_DURATION=$((TOTAL_DURATION + D6))
          STATUS=failure
          BADGE=failing
          if [ "$FAILED" -eq 0 ] && [ "$CORE_FAILED" -eq 0 ] && [ "$INSTALL_OUTCOME" = success ] && [ "$VERSION_OUTCOME" = success ]; then
            STATUS=success
            BADGE=passing
          fi
          printf 'passed=%s\nfailed=%s\nskipped=%s\ncore_failed=%s\nduration=%s\noverall_status=%s\nbadge_status=%s\n' \
            "$PASSED" "$FAILED" "$SKIPPED" "$CORE_FAILED" "$TOTAL_DURATION" "$STATUS" "$BADGE" >> "$GITHUB_OUTPUT"
          [ "$STATUS" = success ]

      - name: Publish scoped summary
        if: always()
        env:
          VERSION: ${{ steps.version.outputs.version || 'unknown' }}
          STATUS: ${{ steps.summary.outputs.overall_status || 'failure' }}
          PASSED: ${{ steps.summary.outputs.passed || '0' }}
          FAILED: ${{ steps.summary.outputs.failed || '5' }}
          SKIPPED: ${{ steps.summary.outputs.skipped || '0' }}
          REGRESSION: ${{ steps.test6.outputs.status || 'failed' }}
          DECISION: ${{ steps.test6.outputs.decision || 'baseline_failed' }}
        run: |
          {
            echo "## Firecracker KVM guest smoke"
            echo "- Version: $VERSION"
            echo "- Baseline status: $STATUS; passed=$PASSED failed=$FAILED skipped/deferred=$SKIPPED"
            echo "- Runner: ubuntu-24.04-arm"
            echo "- Scope: mandatory /dev/kvm, pre-boot API round-trip/rejection, microVM guest file I/O and child exit 37."
            echo "- Guest success requires Test 5 success; missing KVM is a failure, never an API-only pass."
            echo "- Test 6: $REGRESSION ($DECISION). No candidate installed; no upgrade safety claim."
            echo "- Guest child exit is not mapped to VMM exit 37; VMM must shut down cleanly. Jailer isolation is NOT tested."
          } >> "$GITHUB_STEP_SUMMARY"

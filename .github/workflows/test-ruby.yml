name: Diagnostic - validate Garden Linux metadata and preflight on Arm64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  garden-linux:
    uses: ./.github/workflows/test-garden-linux.yml

  verify:
    needs: garden-linux
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require actual Garden Linux baseline and candidate preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          result = json.loads(os.environ['RESULTS'])['garden-linux']
          output = result['outputs']
          print(json.dumps(output, sort_keys=True))
          assert result['result'] == 'success'
          assert output['run_status'] == 'success'
          assert output['tests_passed'] == '6'
          assert output['tests_failed'] == '0'
          assert output['core_failed'] == '0'
          assert output['package_version'] == '934.0'
          assert output['regression_status'] == 'passed'
          assert output['regression_decision'] == 'limited_cpu_smoke_validated'
          assert output['regression_next_installed_version'] not in (
              '', 'unknown', 'not_installed', 'limited_cpu_probe_failed', '934.0'
          )
          PY

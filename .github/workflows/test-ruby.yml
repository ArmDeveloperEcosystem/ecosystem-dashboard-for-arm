name: Diagnostic - validate BoringSSL and EMQTT source recovery on Arm64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boringssl:
    uses: ./.github/workflows/test-boringssl.yml

  emqtt:
    uses: ./.github/workflows/test-emqtt.yml

  verify:
    needs: [boringssl, emqtt]
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require actual package checks and unchanged regression policies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          results = json.loads(os.environ['RESULTS'])
          for package, passed in [('boringssl', '5'), ('emqtt', '6')]:
              job = results[package]
              output = job['outputs']
              print(package, json.dumps(output, sort_keys=True))
              assert job['result'] == 'success', package
              assert output['run_status'] == 'success', package
              assert output['tests_passed'] == passed, package
              assert output['tests_failed'] == '0', package
              assert output['core_failed'] == '0', package

          boring = results['boringssl']['outputs']
          assert boring['package_version'] == '9d99d81'
          assert boring['regression_current_version'] == 'fips-20220613'
          assert boring['regression_status'] == 'skipped'
          assert boring['regression_decision'] == 'no_newer_stable_available'
          emqtt = results['emqtt']['outputs']
          assert emqtt['package_version'] == '1.4.4'
          assert emqtt['regression_status'] == 'passed'
          assert emqtt['regression_next_installed_version'] not in ('', 'unknown', 'not_installed', 'install_failed')
          PY

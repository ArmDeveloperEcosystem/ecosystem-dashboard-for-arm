name: Diagnostic - validate Submarine source recovery on Arm64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submarine:
    uses: ./.github/workflows/test-submarine.yml

  verify:
    needs: submarine
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require actual Submarine baseline and candidate image builds
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          result = json.loads(os.environ['RESULTS'])['submarine']
          output = result['outputs']
          print(json.dumps(output, sort_keys=True))
          assert result['result'] == 'success'
          assert output['run_status'] == 'success'
          assert output['tests_passed'] == '6'
          assert output['tests_failed'] == '0'
          assert output['core_failed'] == '0'
          assert output['package_version'] == '0.4.0'
          assert output['regression_status'] == 'passed'
          assert output['regression_decision'] == 'next_install_validated'
          assert output['regression_next_installed_version'] == '0.4.1'
          PY

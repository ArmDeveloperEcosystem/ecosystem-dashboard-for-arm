name: Diagnostic - validate Impala source recovery on Arm64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  impala:
    uses: ./.github/workflows/test-impala.yml

  verify:
    needs: impala
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require actual Impala baseline and candidate checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          result = json.loads(os.environ['RESULTS'])['impala']
          output = result['outputs']
          print(json.dumps(output, sort_keys=True))
          assert result['result'] == 'success'
          assert output['run_status'] == 'success'
          assert output['tests_passed'] == '6'
          assert output['tests_failed'] == '0'
          assert output['core_failed'] == '0'
          assert output['package_version'] == '4.5.0'
          assert output['regression_status'] == 'passed'
          assert output['regression_decision'] == 'next_install_validated'
          assert output['regression_next_installed_version'] not in (
              '', 'unknown', 'not_installed', 'install_failed', '4.5.0'
          )
          PY

name: build-and-deploy

# Controls when the workflow will run
on:
  # Triggers the workflow on push events but only for the default branch
  push:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build_and_deploy_s3:
    # The type of runner that the job will run on
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true  # Fetch Hugo Themes
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned preprocessing Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install hash-locked preprocessing dependency
        run: >-
          python3 -m pip install
          --disable-pip-version-check
          --no-deps
          --only-binary=:all:
          --require-hashes
          --requirement .github/scripts/generated-site-data-requirements.txt

      # Sets Up Hugo
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: '0.130.0'
          extended: true

      # Runs pre-processing Python scripts to ensure:
      # (1) date accuracy,
      # (2) category descriptions are always up-to-date,
      # (3) the packages have valid categories
      - name: Python pre-processing
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 ./build_steps/update_category_mappings.py
          python3 ./build_steps/update_recently_added_json.py
          python3 ./build_steps/validate_package_catagories.py

      - name: Require reviewed generated site data
        shell: bash
        run: |
          set -euo pipefail
          generated_paths=(
            data/category_data.yml
            data/category_data_windows.yml
            data/recently_added_packages.yaml
          )
          if ! git diff --quiet -- "${generated_paths[@]}"; then
            git diff -- "${generated_paths[@]}"
            echo "Generated site data differs from the reviewed repository bytes." >&2
            echo "Use the generated site data review workflow to open a draft PR." >&2
            exit 1
          fi
          [[ -z "$(git ls-files --others --exclude-standard -- "${generated_paths[@]}")" ]] || {
            echo "Generated site data contains an unreviewed untracked file." >&2
            exit 1
          }

      # Builds arm-software-developer repo
      - name: Build
        run: hugo --minify --config config.toml,config.cloudfront.toml

      # Deploys website to AWS S3
      - name: Deploy to S3
        run: hugo deploy --force --maxDeletes -1 --invalidateCDN --config config.toml,config.cloudfront.toml
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

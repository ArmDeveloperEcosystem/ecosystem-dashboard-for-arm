name: Test Chromium on Arm64

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-chromium.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-chromium.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-chromium.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-chromium.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-chromium.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-chromium.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-chromium.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-chromium.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-chromium.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-chromium.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-chromium.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-chromium.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-chromium.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-chromium.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-chromium.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-chromium.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-chromium.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-chromium.outputs.regression_next_installed_version }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-chromium.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-chromium.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-chromium.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-chromium.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-chromium.outputs.timestamp }}
jobs:
  test-chromium:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35

    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'Chromium'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '1' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '1' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '5' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          {
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "package_slug=chromium"
            echo "dashboard_link=/opensource_packages/chromium"
          } >> "$GITHUB_OUTPUT"
      - name: Install Chromium
        id: install
        timeout-minutes: 25
        continue-on-error: true
        env:
          APT_INSTALL_TIMEOUT_SECONDS: "300"
        run: |
          set -euo pipefail
          dependency_rc=0
          bash .github/actions/apt-bootstrap/bootstrap.sh \
            --packages "python3 binutils" \
            --retries 3 \
            --initial-backoff-seconds 10 \
            2>&1 | tee "$RUNNER_TEMP/chromium-dependencies.log" || dependency_rc="${PIPESTATUS[0]}"
          if [ "$dependency_rc" -ne 0 ]; then
            {
              echo "install_status=failed"
              echo "failure_kind=dependency_install_failed"
            } >> "$GITHUB_OUTPUT"
            exit "$dependency_rc"
          fi

          install_log="$RUNNER_TEMP/chromium-install.log"
          resolve_inflight_chromium_change() {
            local change_id=""
            change_id="$(timeout --kill-after=5s 30s sudo snap changes --abs-time 2>/dev/null | awk 'NR > 1 && /chromium/ && $2 != "Done" && $2 != "Error" && $2 != "Undone" { print $1; exit }' || true)"
            if [ -n "$change_id" ]; then
              echo "Found in-flight Chromium change ${change_id}; waiting for snapd to finish it."
              if ! timeout --kill-after=5s 120s sudo snap watch "$change_id"; then
                timeout --kill-after=5s 30s sudo snap change "$change_id" 2>&1 | tee -a "$install_log" || true
                timeout --kill-after=5s 30s sudo snap abort "$change_id" >/dev/null 2>&1 || true
              fi
            fi
          }

          timeout --kill-after=5s 30s sudo systemctl start snapd.socket snapd.service >/dev/null 2>&1 || true
          timeout --kill-after=5s 60s sudo snap wait system seed.loaded >/dev/null 2>&1 || true
          : > "$install_log"
          install_ok=0
          for attempt in 1 2 3; do
            echo "Chromium snap install attempt ${attempt}/3"
            if timeout --kill-after=5s 30s snap list chromium >/dev/null 2>&1; then
              install_ok=1
              break
            fi
            resolve_inflight_chromium_change
            if timeout --kill-after=5s 30s snap list chromium >/dev/null 2>&1; then
              install_ok=1
              break
            fi
            if timeout --kill-after=5s 180s sudo snap install chromium 2>&1 | tee -a "$install_log"; then
              install_ok=1
              break
            fi
            resolve_inflight_chromium_change
            if timeout --kill-after=5s 30s snap list chromium >/dev/null 2>&1; then
              install_ok=1
              break
            fi
            timeout --kill-after=5s 60s sudo snap remove --purge chromium >/dev/null 2>&1 || true
            timeout --kill-after=5s 30s sudo systemctl restart snapd.socket snapd.service >/dev/null 2>&1 || true
            timeout --kill-after=5s 60s sudo snap wait system seed.loaded >/dev/null 2>&1 || true
            sleep 15
          done

          if [ "$install_ok" -ne 1 ]; then
            failure_kind=package_install_failed
            if grep -Eqi 'api\.snapcraft\.io|unable to contact snap store|connection refused|timed out|timeout exceeded|Client\.Timeout|HTTP[^0-9]*408' "$install_log"; then
              failure_kind=snap_store_unavailable
            fi
            {
              echo "install_status=failed"
              echo "failure_kind=$failure_kind"
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi

          CHROMIUM_BIN="$(command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROMIUM_BIN" ] && [ -x /snap/bin/chromium ]; then
            CHROMIUM_BIN=/snap/bin/chromium
          fi
          if [ -n "$CHROMIUM_BIN" ]; then
            {
              echo "install_status=success"
              echo "failure_kind=none"
              echo "chromium_bin=$CHROMIUM_BIN"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "install_status=failed"
              echo "failure_kind=binary_missing"
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Get Chromium version
        id: version
        if: ${{ always() && steps.install.outputs.install_status == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          CHROMIUM_BIN="${{ steps.install.outputs.chromium_bin }}"
          VERSION="$("$CHROMIUM_BIN" --version 2>&1 | grep -oE '[0-9]+(\\.[0-9]+)+' | head -n1 || true)"
          if [ -z "$VERSION" ]; then
            VERSION="$(timeout --kill-after=5s 30s snap list chromium 2>/dev/null | awk 'NR == 2 { print $2 }' || true)"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="$(dpkg-query -W -f='${Version}' chromium 2>/dev/null | sed 's/-.*//' || true)"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="$(dpkg-query -W -f='${Version}' chromium-browser 2>/dev/null | sed 's/-.*//' || true)"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="unknown"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test 1 - Check Binary Existence
        id: test1
        if: always()
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local rc="$1"
            trap - EXIT
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish "$?"' EXIT
          CHROMIUM_BIN="${{ steps.install.outputs.chromium_bin }}"

          if [ "${{ steps.install.outputs.install_status || 'failed' }}" = success ] && \
             [ -n "$CHROMIUM_BIN" ] && [ -x "$CHROMIUM_BIN" ]; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          finish 0

      - name: Test 2 - Check Version Output
        id: test2
        if: ${{ always() && steps.install.outputs.install_status == 'success' }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local rc="$1"
            trap - EXIT
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish "$?"' EXIT
          CHROMIUM_BIN="${{ steps.install.outputs.chromium_bin }}"

          if timeout 60s "$CHROMIUM_BIN" --version 2>&1 | tee /tmp/chromium-version.log | grep -qE 'Chromium|[0-9]+\\.[0-9]+'; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            cat /tmp/chromium-version.log || true
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          finish 0

      - name: Test 3 - Check Headless Mode
        id: test3
        if: ${{ always() && steps.install.outputs.install_status == 'success' }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local rc="$1"
            trap - EXIT
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish "$?"' EXIT
          CHROMIUM_BIN="${{ steps.install.outputs.chromium_bin }}"

          if timeout 60s "$CHROMIUM_BIN" --headless=new --no-sandbox --disable-gpu --dump-dom about:blank >/tmp/chromium-headless.log 2>&1; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            cat /tmp/chromium-headless.log || true
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          finish 0

      - name: Test 4 - Architecture Verification
        id: test4
        if: ${{ always() && steps.install.outputs.install_status == 'success' }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local rc="$1"
            trap - EXIT
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish "$?"' EXIT
          [ "$(uname -m)" = aarch64 ]
          SNAP_MOUNT="$(readlink -f /snap/chromium/current)"
          [ -d "$SNAP_MOUNT" ]
          verified=0
          while IFS= read -r candidate; do
            if readelf -h "$candidate" 2>/dev/null | grep -Eq 'Machine:[[:space:]]+AArch64'; then
              echo "Verified AArch64 Chromium payload: $candidate"
              verified=1
              break
            fi
          done < <(find "$SNAP_MOUNT" -type f -perm -111 \( -name chromium -o -name chrome \) -print | LC_ALL=C sort)
          [ "$verified" -eq 1 ]
          echo "status=passed" >> "$GITHUB_OUTPUT"
          finish 0

      - name: Test 5 - Functional Validation
        id: test5
        if: ${{ always() && steps.install.outputs.install_status == 'success' }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          HTTP_PID=""
          finish() {
            local rc="$1"
            trap - EXIT
            if [ -n "$HTTP_PID" ]; then
              kill "$HTTP_PID" 2>/dev/null || true
              wait "$HTTP_PID" 2>/dev/null || true
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish "$?"' EXIT
          CHROMIUM_BIN="${{ steps.install.outputs.chromium_bin }}"

          cat > test.html <<'EOF'
          <html><body><h1>Hello World</h1></body></html>
          EOF

          python3 -m http.server 8000 > chromium-http.log 2>&1 &
          HTTP_PID=$!
          sleep 2

          if timeout 60s "$CHROMIUM_BIN" --headless=new --no-sandbox --disable-gpu --dump-dom http://127.0.0.1:8000/test.html > chromium-dom.txt 2>/tmp/chromium-functional.log && grep -q '<h1>Hello World</h1>' chromium-dom.txt; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            cat chromium-dom.txt || true
            cat /tmp/chromium-functional.log || true
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          finish 0


      - name: Regression applicability - package manager installed
        id: test6
        if: always()
        run: |
          set -euo pipefail
          CURRENT="${{ steps.version.outputs.version || 'unknown' }}"
          if [ "${{ steps.install.outputs.install_status || 'failed' }}" != success ]; then
            {
              echo "current_version=unknown"
              echo "latest_version=not_checked"
              echo "next_installed_version=not_installed"
              echo "decision=baseline_install_failed"
              echo "regression_result=Regression validation not run because Chromium installation failed."
              echo "comparison=The baseline package must install before a next-version comparison is trustworthy."
            } >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.test1.outputs.status }}" = passed ] && \
               [ "${{ steps.test2.outputs.status }}" = passed ] && \
               [ "${{ steps.test3.outputs.status }}" = passed ] && \
               [ "${{ steps.test4.outputs.status }}" = passed ] && \
               [ "${{ steps.test5.outputs.status }}" = passed ] && \
               [ "$CURRENT" != unknown ]; then
            {
              echo "current_version=$CURRENT"
              echo "latest_version=not_applicable"
              echo "next_installed_version=not_applicable"
              echo "decision=not_applicable_package_manager"
              echo "regression_result=Regression validation not applicable: tested package installed via package manager in Tests 1-5"
              echo "comparison=The tested package is installed via a package manager in Tests 1-5, so version-to-version regression validation is not shown under the current policy."
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "current_version=$CURRENT"
              echo "latest_version=not_checked"
              echo "next_installed_version=not_installed"
              echo "decision=baseline_failed"
              echo "regression_result=Regression validation not run because Chromium baseline validation failed."
              echo "comparison=All five baseline checks must pass before a next-version comparison is trustworthy."
            } >> "$GITHUB_OUTPUT"
          fi
          {
            echo "status=skipped"
            echo "duration=0"
          } >> "$GITHUB_OUTPUT"

      - name: Emit package result
        if: always()
        id: summary
        uses: ./.github/actions/emit-package-result
        with:
          package_slug: chromium
          package_name: Chromium
          version: ${{ steps.version.outputs.version || 'unknown' }}
          install_status: ${{ steps.install.outputs.install_status || 'failed' }}
          test1_label: Test 1 - Check Chromium binary existence
          test2_label: Test 2 - Check version output
          test3_label: Test 3 - Check headless mode
          test4_label: Test 4 - Verify installed AArch64 payload
          test5_label: Test 5 - Functional local-page validation
          test1_status: ${{ steps.test1.outputs.status || 'skipped' }}
          test2_status: ${{ steps.test2.outputs.status || 'skipped' }}
          test3_status: ${{ steps.test3.outputs.status || 'skipped' }}
          test4_status: ${{ steps.test4.outputs.status || 'skipped' }}
          test5_status: ${{ steps.test5.outputs.status || 'skipped' }}
          test6_status: ${{ steps.test6.outputs.status || 'skipped' }}
          test1_duration: ${{ steps.test1.outputs.duration || 0 }}
          test2_duration: ${{ steps.test2.outputs.duration || 0 }}
          test3_duration: ${{ steps.test3.outputs.duration || 0 }}
          test4_duration: ${{ steps.test4.outputs.duration || 0 }}
          test5_duration: ${{ steps.test5.outputs.duration || 0 }}
          test6_duration: ${{ steps.test6.outputs.duration || 0 }}
          regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
          regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
          regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
          regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
          regression_result: ${{ steps.test6.outputs.regression_result || 'Regression result unavailable.' }}
          regression_details: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}

      - name: Enforce failure status
        if: always()
        run: |
          if [ "${{ steps.summary.outputs.should_fail }}" = "1" ]; then
            exit 1
          fi

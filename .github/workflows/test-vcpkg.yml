name: Test Microsoft Vcpkg on Arm64

permissions:
  contents: read

on:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-vcpkg.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-vcpkg.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-vcpkg.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-vcpkg.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-vcpkg.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-vcpkg.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-vcpkg.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-vcpkg.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-vcpkg.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-vcpkg.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-vcpkg.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-vcpkg.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-vcpkg.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-vcpkg.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-vcpkg.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-vcpkg.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-vcpkg.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-vcpkg.outputs.regression_next_installed_version }}
      regression_policy:
        description: Regression applicability policy classification
        value: ${{ jobs.test-vcpkg.outputs.regression_policy }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-vcpkg.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-vcpkg.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-vcpkg.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-vcpkg.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-vcpkg.outputs.timestamp }}

jobs:
  test-vcpkg:
    runs-on: ubuntu-24.04-arm
    env:
      BASELINE_VERSION: "25.04.09"
      # The 2025.04.09 registry release pins this tool in scripts/vcpkg-tool-metadata.txt.
      BASELINE_REGISTRY_TAG: "2025.04.09"
      BASELINE_TOOL_TAG: "2025-04-07"
      BASELINE_TOOL_COMMIT: "b8b513ba8778c918cff49c3e837aae5999d5d2aa"
      PACKAGE_SLUG: "vcpkg"
      LANE_KIND: "github release / source-build-or-tarball"
      DOWNLOAD_URL: "https://github.com/microsoft/vcpkg-tool/releases"
      HOMEPAGE_URL: "https://learn.microsoft.com/en-us/vcpkg/get_started/overview"
      OFFICIAL_DOCS: "https://learn.microsoft.com/en-us/vcpkg/get_started/get-started"
      GITHUB_REPO: "microsoft/vcpkg-tool"

    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'Microsoft Vcpkg'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      regression_policy: "applicable"
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=vcpkg" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/linux/opensource_packages/vcpkg" >> "$GITHUB_OUTPUT"

      - name: Bootstrap baseline dependencies
        uses: ./.github/actions/apt-bootstrap
        with:
          packages: "git curl jq tar unzip file ca-certificates"
          quiet: "true"

      - name: Install baseline source or artifact
        id: install
        run: |
          set -euo pipefail
          test "$BASELINE_REGISTRY_TAG" = "20$BASELINE_VERSION"
          rm -rf baseline-src baseline-external
          mkdir -p baseline-external
          curl -fsSL --connect-timeout 20 --max-time 60 \
            "https://raw.githubusercontent.com/microsoft/vcpkg/$BASELINE_REGISTRY_TAG/scripts/vcpkg-tool-metadata.txt" \
            -o baseline-external/tool-metadata.txt
          python3 - <<'PY'
          import os
          from pathlib import Path

          metadata = dict(line.split('=', 1) for line in
                          Path('baseline-external/tool-metadata.txt').read_text().splitlines() if '=' in line)
          assert metadata.get('VCPKG_TOOL_RELEASE_TAG') == os.environ['BASELINE_TOOL_TAG'], metadata
          PY
          git clone --depth 1 --branch "$BASELINE_TOOL_TAG" "https://github.com/$GITHUB_REPO.git" baseline-src
          SOURCE_COMMIT=$(git -C baseline-src rev-parse HEAD)
          test "$SOURCE_COMMIT" = "$BASELINE_TOOL_COMMIT"
          {
            echo "resolved_tag=$BASELINE_TOOL_TAG"
            echo "source_commit=$SOURCE_COMMIT"
            echo "registry_release=$BASELINE_REGISTRY_TAG"
            echo "install_mode=github_source"
            echo "install_status=success"
          } >> "$GITHUB_OUTPUT"

      - name: Get baseline version
        id: version
        run: |
          echo "version=$BASELINE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected baseline version: $BASELINE_VERSION"

      - name: Define package-specific expectations
        id: expectations
        uses: ./.github/actions/derive-package-source-expectations
        with:
          package_slug: ${{ env.PACKAGE_SLUG }}

      - name: Test 1 - Check package-specific baseline markers
        id: test1
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          MODE="${{ steps.install.outputs.install_mode || '' }}"
          SOURCE_MARKERS="${{ steps.expectations.outputs.source_markers }}"
          if [ "${{ steps.install.outputs.install_status || 'failed' }}" != "success" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "note=Baseline source or external metadata could not be acquired." >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$MODE" = "github_source" ]; then
            cd baseline-src
            FOUND=0
            HITS=""
            IFS='|' read -r -a MARKERS <<< "$SOURCE_MARKERS"
            REQUIRED=${#MARKERS[@]}
            if [ "$REQUIRED" -gt 2 ]; then
              REQUIRED=2
            fi
            if [ "$REQUIRED" -lt 1 ]; then
              echo "status=failed" >> "$GITHUB_OUTPUT"
              echo "note=No package-specific source markers were derived for the baseline." >> "$GITHUB_OUTPUT"
              exit 1
            fi
            for marker in "${MARKERS[@]}"; do
              if [ -n "$marker" ] && [ -e "$marker" ]; then
                FOUND=$((FOUND + 1))
                if [ -z "$HITS" ]; then
                  HITS="$marker"
                else
                  HITS="$HITS, $marker"
                fi
              fi
            done
            if [ "$FOUND" -ge "$REQUIRED" ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
              echo "note=Found package-specific baseline markers: $HITS" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
              echo "note=Expected at least $REQUIRED package-specific markers from: $SOURCE_MARKERS" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          elif [ -f baseline-external/metadata.txt ]; then
            grep -Fx "download=$DOWNLOAD_URL" baseline-external/metadata.txt >/dev/null
            grep -Fx "homepage=$HOMEPAGE_URL" baseline-external/metadata.txt >/dev/null
            echo "status=passed" >> "$GITHUB_OUTPUT"
            echo "note=Validated external baseline metadata for the published source links." >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "note=External baseline metadata was not emitted." >> "$GITHUB_OUTPUT"
            exit 1
          fi
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 2 - Check package-specific version and release evidence
        id: test2
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          CONTENT_PAGE="${{ steps.expectations.outputs.content_page }}"
          [ -f "$CONTENT_PAGE" ]
          grep -Fx "works_on_arm: true" "$CONTENT_PAGE" >/dev/null
          grep -Fx "download_url: $DOWNLOAD_URL" "$CONTENT_PAGE" >/dev/null
          grep -Fx "    homepage_url: $HOMEPAGE_URL" "$CONTENT_PAGE" >/dev/null
          grep -Fx "        official_docs: $OFFICIAL_DOCS" "$CONTENT_PAGE" >/dev/null
          grep -F "version_number: $BASELINE_VERSION" "$CONTENT_PAGE" >/dev/null
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "note=Validated package metadata, baseline version, homepage, and docs alignment from the checked-in package page." >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 3 - Check package-specific docs and entrypoints
        id: test3
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          MODE="${{ steps.install.outputs.install_mode || '' }}"
          DOC_MARKERS="${{ steps.expectations.outputs.doc_markers }}"
          ENTRYPOINT_MARKERS="${{ steps.expectations.outputs.entrypoint_markers }}"
          IDENTITY_TARGET="${{ steps.expectations.outputs.identity_target }}"
          if [ "$MODE" = "github_source" ]; then
            cd baseline-src
            FOUND=0
            HITS=""
            IFS='|' read -r -a MARKERS <<< "$DOC_MARKERS"
            for marker in "${MARKERS[@]}"; do
              if [ -n "$marker" ] && [ -e "$marker" ]; then
                FOUND=$((FOUND + 1))
                if [ -z "$HITS" ]; then
                  HITS="$marker"
                else
                  HITS="$HITS, $marker"
                fi
              fi
            done
            if [ -n "$IDENTITY_TARGET" ]; then
              [ -e "$IDENTITY_TARGET" ]
            fi
            ENTRY_OK=0
            if [ -n "$ENTRYPOINT_MARKERS" ]; then
              IFS='|' read -r -a ENTRYPOINTS <<< "$ENTRYPOINT_MARKERS"
              for marker in "${ENTRYPOINTS[@]}"; do
                if [ -n "$marker" ] && [ -e "$marker" ]; then
                  ENTRY_OK=1
                  break
                fi
              done
            else
              ENTRY_OK=1
            fi
            if [ "$FOUND" -ge 1 ] && [ "$ENTRY_OK" -eq 1 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
              echo "note=Validated package-specific docs and entrypoint markers: $HITS" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
              echo "note=Expected package-specific docs and entrypoint markers from: $DOC_MARKERS / $ENTRYPOINT_MARKERS" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          elif [ -f baseline-external/metadata.txt ]; then
            grep -Fx "docs=$OFFICIAL_DOCS" baseline-external/metadata.txt >/dev/null
            grep -Fx "homepage=$HOMEPAGE_URL" baseline-external/metadata.txt >/dev/null
            echo "status=passed" >> "$GITHUB_OUTPUT"
            echo "note=Validated external documentation and homepage metadata for the baseline package." >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "note=External documentation metadata was not emitted." >> "$GITHUB_OUTPUT"
            exit 1
          fi
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 4 - Verify Arm64 runner and lane assumptions
        id: test4
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          CONTENT_PAGE="${{ steps.expectations.outputs.content_page }}"
          [ "$(uname -m)" = "aarch64" ]
          grep -Fx "works_on_arm: true" "$CONTENT_PAGE" >/dev/null
          echo "status=passed" >> "$GITHUB_OUTPUT"
          if echo "$LANE_KIND" | grep -Eiq 'gpu|specialized|manual-review'; then
            echo "note=Validated Arm64 support metadata on a generic Arm runner; deeper runtime checks for this lane still require the package-specific environment: $LANE_KIND." >> "$GITHUB_OUTPUT"
          else
            echo "note=Validated Arm64 runner architecture and published Arm support metadata." >> "$GITHUB_OUTPUT"
          fi
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 5 - Run bounded package-specific smoke
        id: test5
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          MODE="${{ steps.install.outputs.install_mode || '' }}"
          IDENTITY_KIND="${{ steps.expectations.outputs.identity_kind }}"
          IDENTITY_TARGET="${{ steps.expectations.outputs.identity_target }}"
          IDENTITY_EXPECT="${{ steps.expectations.outputs.identity_expect }}"
          EXTERNAL_EXPECT="${{ steps.expectations.outputs.external_expect }}"
          if [ "$MODE" = "github_source" ]; then
            cd baseline-src
            [ "$IDENTITY_KIND" = "package_json_name" ]
            [ "$IDENTITY_TARGET" = "vcpkg-artifacts/package.json" ]
            case "$IDENTITY_KIND" in
              go_module)
                grep -Fx "module $IDENTITY_EXPECT" "$IDENTITY_TARGET" >/dev/null
                RESULT="Verified go module identity in $IDENTITY_TARGET"
                ;;
              toml_name)
                python3 -c "import sys,tomllib; data=tomllib.load(open(sys.argv[1],'rb')); name=(data.get('project') or {}).get('name') or ((data.get('tool') or {}).get('poetry') or {}).get('name'); assert name == sys.argv[2], (name, sys.argv[2])" "$IDENTITY_TARGET" "$IDENTITY_EXPECT"
                RESULT="Verified TOML package identity in $IDENTITY_TARGET"
                ;;
              package_json_name)
                python3 - "$IDENTITY_TARGET" <<'PY'
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert data.get('name') == '@microsoft/vcpkg-ce', data.get('name')
          assert data.get('author') == 'Microsoft', data.get('author')
          assert data.get('description') == 'vcpkg-artifacts', data.get('description')
          repository = data.get('repository')
          assert isinstance(repository, dict), repository
          assert repository.get('type') == 'git', repository
          assert repository.get('url') == 'git+https://github.com/Microsoft/vcpkg-tool.git', repository
          keywords = data.get('keywords')
          assert isinstance(keywords, list) and {'vcpkg', 'vcpkg-artifacts'} <= set(keywords), keywords
          PY
                RESULT="Verified Microsoft vcpkg artifacts identity for registry $BASELINE_REGISTRY_TAG / tool $BASELINE_TOOL_TAG"
                ;;
              cargo_package)
                python3 -c "import sys,tomllib; data=tomllib.load(open(sys.argv[1],'rb')); assert (data.get('package') or {}).get('name') == sys.argv[2], ((data.get('package') or {}).get('name'), sys.argv[2])" "$IDENTITY_TARGET" "$IDENTITY_EXPECT"
                RESULT="Verified Cargo package identity in $IDENTITY_TARGET"
                ;;
              chart_name)
                python3 -c "from pathlib import Path; import sys; lines=Path(sys.argv[1]).read_text(encoding='utf-8').splitlines(); matches=[line.split(':', 1)[1].strip() for line in lines if line.startswith('name:')]; name=matches[0] if matches else ''; assert name == sys.argv[2], (name, sys.argv[2])" "$IDENTITY_TARGET" "$IDENTITY_EXPECT"
                RESULT="Verified chart identity in $IDENTITY_TARGET"
                ;;
              grep_file)
                grep -Eiq "$IDENTITY_EXPECT" "$IDENTITY_TARGET"
                RESULT="Verified package-specific content in $IDENTITY_TARGET"
                ;;
              *)
                echo "status=failed" >> "$GITHUB_OUTPUT"
                echo "note=No bounded identity check was configured for this package." >> "$GITHUB_OUTPUT"
                exit 1
                ;;
            esac
            echo "status=passed" >> "$GITHUB_OUTPUT"
            echo "note=$RESULT" >> "$GITHUB_OUTPUT"
          else
            TEMP_PAGE=$(mktemp)
            trap 'rm -f "$TEMP_PAGE"' EXIT
            if curl -fsSL "$OFFICIAL_DOCS" -o "$TEMP_PAGE" || curl -fsSL "$HOMEPAGE_URL" -o "$TEMP_PAGE" || curl -fsSL "$DOWNLOAD_URL" -o "$TEMP_PAGE"; then
              grep -Eiq "$EXTERNAL_EXPECT" "$TEMP_PAGE"
              echo "status=passed" >> "$GITHUB_OUTPUT"
              echo "note=Verified external package identity from published docs or homepage content using /$EXTERNAL_EXPECT/." >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
              echo "note=Could not fetch published docs or homepage content for bounded external validation." >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
      - name: Test 6 - Regression Validation
        id: test6
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          CURRENT="${{ steps.version.outputs.version || env.BASELINE_VERSION }}"
          END_TIME=$(date +%s)
          {
            echo "current_version=${CURRENT}"
            echo "latest_version=not_applicable"
            echo "next_installed_version=not_applicable"
            echo "decision=not_applicable_package_manager"
            echo "regression_result=Test 6 is not applicable for this package-manager workflow"
            echo "comparison=Tests 1-5 validate the pinned vcpkg tool/source metadata on the Arm64 runner. Because vcpkg is itself a package manager/bootstrap tool rather than a package with a meaningful next-version runtime upgrade candidate in this workflow, Test 6 is intentionally skipped instead of pretending to install a newer package payload."
            echo "status=skipped"
            echo "duration=$((END_TIME - START_TIME))"
          } >> "$GITHUB_OUTPUT"
      - name: Calculate test summary
        id: summary
        if: always()
        run: |
          set -euo pipefail
          T1="${{ steps.test1.outputs.status || 'failed' }}"
          T2="${{ steps.test2.outputs.status || 'failed' }}"
          T3="${{ steps.test3.outputs.status || 'failed' }}"
          T4="${{ steps.test4.outputs.status || 'failed' }}"
          T5="${{ steps.test5.outputs.status || 'failed' }}"
          T6="${{ steps.test6.outputs.status || 'failed' }}"
          O1="${{ steps.test1.outcome || 'failure' }}"
          O2="${{ steps.test2.outcome || 'failure' }}"
          O3="${{ steps.test3.outcome || 'failure' }}"
          O4="${{ steps.test4.outcome || 'failure' }}"
          O5="${{ steps.test5.outcome || 'failure' }}"
          O6="${{ steps.test6.outcome || 'failure' }}"
          DECISION="${{ steps.test6.outputs.decision || '' }}"
          D1="${{ steps.test1.outputs.duration || '0' }}"
          D2="${{ steps.test2.outputs.duration || '0' }}"
          D3="${{ steps.test3.outputs.duration || '0' }}"
          D4="${{ steps.test4.outputs.duration || '0' }}"
          D5="${{ steps.test5.outputs.duration || '0' }}"
          D6="${{ steps.test6.outputs.duration || '0' }}"
          PASSED=0
          FAILED=0
          SKIPPED=0
          CORE_FAILED=0
          for RESULT in "$T1:$O1" "$T2:$O2" "$T3:$O3" "$T4:$O4" "$T5:$O5"; do
            if [ "$RESULT" = "passed:success" ]; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
              CORE_FAILED=$((CORE_FAILED + 1))
            fi
          done
          if [ "$T6" = "passed" ] && [ "$O6" = "success" ]; then
            PASSED=$((PASSED + 1))
          elif [ "$T6" = "skipped" ] && [ "$O6" = "success" ] && [ "$DECISION" = "not_applicable_package_manager" ]; then
            SKIPPED=1
          else
            FAILED=$((FAILED + 1))
          fi
          DURATION=$((D1 + D2 + D3 + D4 + D5 + D6))
          if [ "$FAILED" -eq 0 ]; then
            OVERALL_STATUS="success"
          else
            OVERALL_STATUS="failure"
          fi
          if [ "$CORE_FAILED" -eq 0 ]; then
            BADGE_STATUS="passing"
          else
            BADGE_STATUS="failing"
          fi
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"
          echo "core_failed=$CORE_FAILED" >> "$GITHUB_OUTPUT"
          echo "overall_status=$OVERALL_STATUS" >> "$GITHUB_OUTPUT"
          echo "badge_status=$BADGE_STATUS" >> "$GITHUB_OUTPUT"
          test "$FAILED" -eq 0

      - name: Create test summary
        if: always()
        uses: ./.github/actions/write-package-job-summary
        with:
          package_name: 'Microsoft Vcpkg'
          version: ${{ steps.version.outputs.version || 'unknown' }}
          overall_status: ${{ steps.summary.outputs.overall_status || 'unknown' }}
          tests_passed: ${{ steps.summary.outputs.passed || '0' }}
          tests_failed: ${{ steps.summary.outputs.failed || '0' }}
          tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
          duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
          test1_status: ${{ steps.test1.outputs.status || 'skipped' }}
          test2_status: ${{ steps.test2.outputs.status || 'skipped' }}
          test3_status: ${{ steps.test3.outputs.status || 'skipped' }}
          test4_status: ${{ steps.test4.outputs.status || 'skipped' }}
          test5_status: ${{ steps.test5.outputs.status || 'skipped' }}
          test6_status: ${{ steps.test6.outputs.status || 'skipped' }}
          test6_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
          regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
          regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
          regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
          regression_result: ${{ steps.test6.outputs.regression_result || 'Regression result unavailable.' }}
          regression_details: ${{ steps.test6.outputs.comparison || steps.test6.outputs.note || 'Regression comparison summary unavailable.' }}

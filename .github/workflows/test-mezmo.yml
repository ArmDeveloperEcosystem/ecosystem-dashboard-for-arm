name: Test Mezmo on Arm64

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-mezmo.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-mezmo.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-mezmo.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-mezmo.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-mezmo.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-mezmo.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-mezmo.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-mezmo.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-mezmo.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-mezmo.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-mezmo.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-mezmo.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-mezmo.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-mezmo.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-mezmo.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-mezmo.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-mezmo.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-mezmo.outputs.regression_next_installed_version }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-mezmo.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-mezmo.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-mezmo.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-mezmo.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-mezmo.outputs.timestamp }}
jobs:
  test-mezmo:
    runs-on: ubuntu-24.04-arm

    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'Mezmo'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=mezmo" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/opensource_packages/mezmo" >> "$GITHUB_OUTPUT"
      - name: Install Mezmo
        id: install
        run: |
          set -euo pipefail
          sudo mkdir -p /usr/share/keyrings
          curl -fsSL https://assets.logdna.com/logdna.gpg | sudo gpg --dearmor -o /usr/share/keyrings/logdna-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/logdna-archive-keyring.gpg] https://assets.logdna.com stable main" | sudo tee /etc/apt/sources.list.d/logdna.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y logdna-agent python3-yaml
          echo "install_status=success" >> "$GITHUB_OUTPUT"

      - name: Get Mezmo version
        id: version
        run: |
          set -euo pipefail
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP" logdna-agent --version >"$RUNNER_TEMP/mezmo-version.log" 2>&1
          cat "$RUNNER_TEMP/mezmo-version.log"
          VERSION=$(grep -oE 'LogDNA Agent [0-9]+\.[0-9]+\.[0-9]+' "$RUNNER_TEMP/mezmo-version.log" | awk '{print $3}' | head -1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test 1 - Binary Existence
        id: test1
        continue-on-error: true
        run: |
          START_TIME=$(date +%s)
          if command -v logdna-agent >/dev/null 2>&1; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 2 - Version Check
        id: test2
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish_duration() {
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
          }
          trap finish_duration EXIT
          if env -i PATH="$PATH" HOME="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP" logdna-agent --version >"$RUNNER_TEMP/mezmo-version-check.log" 2>&1 && \
             grep -Fq "LogDNA Agent" "$RUNNER_TEMP/mezmo-version-check.log"; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/mezmo-version-check.log" || true
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          trap - EXIT
          finish_duration

      - name: Test 3 - Help Output Validation
        id: test3
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish_duration() {
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
          }
          trap finish_duration EXIT
          if env -i PATH="$PATH" HOME="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP" logdna-agent --help >"$RUNNER_TEMP/mezmo-help.log" 2>&1 && \
             grep -Fq "A resource-efficient log collection agent" "$RUNNER_TEMP/mezmo-help.log" && \
             grep -Fq "USAGE:" "$RUNNER_TEMP/mezmo-help.log"; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/mezmo-help.log" || true
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          trap - EXIT
          finish_duration

      - name: Test 4 - Architecture Verification
        id: test4
        continue-on-error: true
        run: |
          START_TIME=$(date +%s)
          if [ "$(uname -m)" = "aarch64" ]; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 5 - Functional Validation
        id: test5
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            RC=$?
            if [ "$RC" -eq 0 ]; then STATUS=passed; else STATUS=failed; fi
            echo "status=$STATUS" >> "$GITHUB_OUTPUT"
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap finish EXIT
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import socket
          import subprocess
          import tempfile
          import yaml

          # --list validates configuration and exits before creating ingestion clients or tailers.
          with tempfile.TemporaryDirectory(prefix="mezmo-list-", dir=os.environ["RUNNER_TEMP"]) as directory:
              root = Path(directory)
              for name in ("home", "fixtures", "retry", "state"):
                  (root / name).mkdir(mode=0o700)
              (root / "fixtures/synthetic.log").write_text("mezmo synthetic smoke fixture\n")
              with socket.socket() as receiver:
                  receiver.bind(("127.0.0.1", 0))
                  receiver.listen(1)
                  receiver.setblocking(False)
                  host = f"127.0.0.1:{receiver.getsockname()[1]}"
                  config = {
                      "http": {"host": host, "endpoint": "/logs/agent", "use_ssl": False,
                               "ingestion_key": "mezmo-local-smoke-not-a-real-key", "use_compression": False,
                               "gzip_level": 2, "timeout": 1000, "body_size": 4096,
                               "retry_dir": str(root / "retry"), "params": {"hostname": "mezmo-smoke-fixture"}},
                      "log": {"dirs": [str(root / "fixtures")], "db_path": str(root / "state"),
                              "include": {"glob": ["*.log"], "regex": []}, "use_k8s_enrichment": "never",
                              "log_k8s_events": "never", "log_metric_server_stats": "never"},
                      "journald": {"paths": [], "systemd_journal_tailer": False},
                  }
                  config_path = root / "config.yaml"
                  config_path.write_text(json.dumps(config))
                  child_env = {"PATH": os.environ["PATH"], "HOME": str(root / "home"), "TMPDIR": str(root)}
                  result = subprocess.run(["logdna-agent", "--config", str(config_path), "--list"],
                                          env=child_env, capture_output=True, text=True, timeout=30)
                  text = re.sub(r"\x1b\[[0-9;]*m", "", result.stdout + result.stderr)
                  (root / "producer.log").write_text(text)
                  print(f"Mezmo --list producer exit: {result.returncode}")
                  if result.returncode != 0:
                      raise RuntimeError("Mezmo --list failed configuration validation")
                  if re.search(r"\b(?:ERROR|FATAL)\b|configuration error:|panicked", text, re.IGNORECASE):
                      raise RuntimeError("Mezmo --list emitted an unexpected error")
                  marker = "effective configuration:\n"
                  if text.count(marker) != 1:
                      raise RuntimeError("Mezmo --list did not emit one effective configuration")
                  effective = yaml.safe_load(text.split(marker, 1)[1])
                  for section in ("http", "log", "journald"):
                      for key, expected in config[section].items():
                          if key == "ingestion_key":
                              expected = "REDACTED"
                          if key == "params":
                              if effective[section][key]["hostname"] != expected["hostname"]:
                                  raise RuntimeError("Unexpected fixture hostname")
                          elif effective[section][key] != expected:
                              raise RuntimeError(f"Unexpected effective configuration: {section}.{key}")
                  try:
                      connection, _ = receiver.accept()
                  except BlockingIOError:
                      pass
                  else:
                      connection.close()
                      raise RuntimeError("Mezmo --list unexpectedly attempted ingestion")
                  print("Validated isolated configuration-only dry run; no ingestion connection")
          PY
          trap - EXIT
          finish


      - name: Regression applicability - package manager installed
        id: test6
        run: |
          set -euo pipefail
          CURRENT="${{ steps.version.outputs.version || 'unknown' }}"
          echo "current_version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest_version=not_applicable" >> "$GITHUB_OUTPUT"
          echo "next_installed_version=not_applicable" >> "$GITHUB_OUTPUT"
          echo "decision=not_applicable_package_manager" >> "$GITHUB_OUTPUT"
          echo "regression_result=Regression validation not applicable: tested package installed via package manager in Tests 1-5" >> "$GITHUB_OUTPUT"
          echo "comparison=The tested package is installed via a package manager in Tests 1-5, so version-to-version regression validation is not shown under the current policy." >> "$GITHUB_OUTPUT"
          echo "status=skipped" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"

      - name: Calculate test summary
        if: always()
        id: summary
        run: |
          PASSED=0
          FAILED=0
          TOTAL_DURATION=0

          check_test() {
            local status="$1"
            local duration="$2"
            local outcome="$3"
            if [ "$status" = "passed" ] && [ "$outcome" = "success" ]; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
            fi
            TOTAL_DURATION=$((TOTAL_DURATION + duration))
          }

          check_test "${{ steps.test1.outputs.status || 'failed' }}" "${{ steps.test1.outputs.duration || 0 }}" "${{ steps.test1.outcome }}"
          check_test "${{ steps.test2.outputs.status || 'failed' }}" "${{ steps.test2.outputs.duration || 0 }}" "${{ steps.test2.outcome }}"
          check_test "${{ steps.test3.outputs.status || 'failed' }}" "${{ steps.test3.outputs.duration || 0 }}" "${{ steps.test3.outcome }}"
          check_test "${{ steps.test4.outputs.status || 'failed' }}" "${{ steps.test4.outputs.duration || 0 }}" "${{ steps.test4.outcome }}"
          check_test "${{ steps.test5.outputs.status || 'failed' }}" "${{ steps.test5.outputs.duration || 0 }}" "${{ steps.test5.outcome }}"
          echo "core_failed=$FAILED" >> "$GITHUB_OUTPUT"
          SKIPPED=0
          if [ "${{ steps.test6.outcome }}" = "success" ] && \
             [ "${{ steps.test6.outputs.status }}" = "skipped" ] && \
             [ "${{ steps.test6.outputs.decision }}" = "not_applicable_package_manager" ]; then
            SKIPPED=1
          else
            FAILED=$((FAILED + 1))
          fi

          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
          echo "duration=$TOTAL_DURATION" >> "$GITHUB_OUTPUT"

          if [ "$FAILED" -eq 0 ]; then
            echo "overall_status=success" >> "$GITHUB_OUTPUT"
            echo "badge_status=passing" >> "$GITHUB_OUTPUT"
          else
            echo "overall_status=failure" >> "$GITHUB_OUTPUT"
            echo "badge_status=failing" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Create test summary
        if: always()
        run: |
          {
            echo "## Mezmo Test Results"
            echo ""
            echo "- Installed version: \`${{ steps.version.outputs.version }}\`"
            echo "- Overall status: \`${{ steps.summary.outputs.overall_status || 'failure' }}\`"
            echo ""
            echo "| Test | Status | Duration (s) |"
            echo "| --- | --- | ---: |"
            echo "| Test 1 - Binary Existence | ${{ steps.test1.outputs.status || 'skipped' }} | ${{ steps.test1.outputs.duration || 0 }} |"
            echo "| Test 2 - Version Check | ${{ steps.test2.outputs.status || 'skipped' }} | ${{ steps.test2.outputs.duration || 0 }} |"
            echo "| Test 3 - Help Output Validation | ${{ steps.test3.outputs.status || 'skipped' }} | ${{ steps.test3.outputs.duration || 0 }} |"
            echo "| Test 4 - Architecture Verification | ${{ steps.test4.outputs.status || 'skipped' }} | ${{ steps.test4.outputs.duration || 0 }} |"
            echo "| Test 5 - Functional Validation | ${{ steps.test5.outputs.status || 'skipped' }} | ${{ steps.test5.outputs.duration || 0 }} |"
          } >> "$GITHUB_STEP_SUMMARY"

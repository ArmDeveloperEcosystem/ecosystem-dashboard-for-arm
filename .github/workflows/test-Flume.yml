name: Test Flume on Arm64

permissions:
  contents: read

on:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-flume.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-flume.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-flume.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-flume.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-flume.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-flume.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-flume.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-flume.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-flume.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-flume.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-flume.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-flume.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-flume.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-flume.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-flume.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-flume.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-flume.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-flume.outputs.regression_next_installed_version }}
      regression_policy:
        description: Regression applicability policy classification
        value: ${{ jobs.test-flume.outputs.regression_policy }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-flume.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-flume.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-flume.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-flume.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-flume.outputs.timestamp }}
jobs:
  test-flume:
    runs-on: ubuntu-24.04-arm
    env:
      FLUME_BASELINE_VERSION: "1.10.0"
      FLUME_NEXT_VERSION: "1.10.1"
    
    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'Flume'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      regression_policy: "applicable"
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false
      
      - name: Set test metadata
        id: metadata
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=Flume" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/opensource_packages/Flume" >> "$GITHUB_OUTPUT"
      - name: Prepare bounded Flume runtime probe
        id: probe
        run: |
          cat > "$RUNNER_TEMP/flume-smoke.py" <<'PY'
          import os
          from pathlib import Path
          import re
          import signal
          import subprocess
          import sys
          import tempfile
          import time
          import uuid

          mode, home, expected = sys.argv[1:]
          home = Path(home).resolve()
          command = str(home / "bin/flume-ng")
          env = dict(os.environ, FLUME_HOME=str(home))
          if mode == "version":
              result = subprocess.run([command, "version"], env=env, text=True,
                                      stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=30)
              print(result.stdout, file=sys.stderr, end="")
              versions = re.findall(r"(?m)^Flume ([0-9]+\.[0-9]+\.[0-9]+)\s*$", result.stdout)
              if result.returncode != 0 or versions != [expected]:
                  raise SystemExit("Flume version command failed or did not report the exact target")
              print(versions[0])
          elif mode == "event":
              # A private spool-to-file flow exercises the agent without opening a port.
              with tempfile.TemporaryDirectory(prefix="flume-smoke-", dir=os.environ["RUNNER_TEMP"]) as temp:
                  root = Path(temp)
                  spool, sink = root / "spool", root / "sink"
                  spool.mkdir()
                  sink.mkdir()
                  token = "flume-smoke-" + uuid.uuid4().hex
                  (spool / "event.txt").write_text(token + "\n")
                  config = root / "agent.conf"
                  config.write_text("\n".join([
                      "smoke.sources = source", "smoke.channels = channel", "smoke.sinks = sink",
                      "smoke.sources.source.type = spooldir", f"smoke.sources.source.spoolDir = {spool}",
                      "smoke.sources.source.channels = channel", "smoke.channels.channel.type = memory",
                      "smoke.channels.channel.capacity = 10", "smoke.channels.channel.transactionCapacity = 1",
                      "smoke.sources.source.batchSize = 1", "smoke.sinks.sink.type = file_roll",
                      "smoke.sinks.sink.channel = channel", f"smoke.sinks.sink.sink.directory = {sink}",
                      "smoke.sinks.sink.sink.rollInterval = 0", "smoke.sinks.sink.sink.batchSize = 1",
                  ]) + "\n")
                  log = root / "agent.log"
                  with log.open("w") as output:
                      process = subprocess.Popen([command, "agent", "--conf", str(home / "conf"),
                          "--conf-file", str(config), "--name", "smoke"], env=env,
                          stdout=output, stderr=subprocess.STDOUT, start_new_session=True)

                      def signal_owned_group(sig):
                          try:
                              os.killpg(process.pid, sig)
                          except ProcessLookupError:
                              pass

                      def wait_owned_group(timeout):
                          deadline = time.monotonic() + timeout
                          while True:
                              process.poll()
                              try:
                                  os.killpg(process.pid, 0)
                              except ProcessLookupError:
                                  return True
                              except PermissionError:
                                  # An uncertain group state is not proof of cleanup.
                                  pass
                              if time.monotonic() >= deadline:
                                  return False
                              time.sleep(0.05)

                      try:
                          deadline = time.monotonic() + 45
                          delivered = False
                          while time.monotonic() < deadline and process.poll() is None:
                              delivered = any(token.encode() in path.read_bytes().splitlines()
                                              for path in sink.iterdir() if path.is_file())
                              if delivered and (spool / "event.txt.COMPLETED").exists():
                                  break
                              delivered = False
                              time.sleep(0.25)
                          if not delivered or process.poll() is not None:
                              raise RuntimeError("Flume agent did not deliver and commit the exact event")
                      finally:
                          try:
                              # The new session is ours even after its leader exits.
                              signal_owned_group(signal.SIGTERM)
                              if not wait_owned_group(10):
                                  signal_owned_group(signal.SIGKILL)
                                  if not wait_owned_group(5):
                                      raise RuntimeError("Flume owned process group remained after forced shutdown")
                                  raise RuntimeError("Flume agent required forced shutdown")
                              returncode = process.wait(timeout=5)
                              if returncode not in (0, -signal.SIGTERM, 128 + signal.SIGTERM):
                                  raise RuntimeError(f"Flume agent shutdown returned unexpected exit {returncode}")
                          finally:
                              print(log.read_text(), file=sys.stderr, end="")
                      print(f"Flume {expected}: spool source -> memory channel -> file sink delivered {token}")
          else:
              raise SystemExit("Unknown Flume probe mode")
          PY
      - name: Install Flume (Tarball)
        id: install
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "Installing Flume (Tarball)..."
          
          # Install Java (required)
          bash .github/actions/apt-bootstrap/bootstrap.sh --packages "openjdk-11-jdk wget curl"
          FLUME_VERSION="${FLUME_BASELINE_VERSION}"
          if ! bash .github/scripts/download-with-fallback.sh \
            flume.tar.gz \
            "https://downloads.apache.org/flume/${FLUME_VERSION}/apache-flume-${FLUME_VERSION}-bin.tar.gz" \
            "https://archive.apache.org/dist/flume/${FLUME_VERSION}/apache-flume-${FLUME_VERSION}-bin.tar.gz"; then
            echo "baseline_version=$FLUME_VERSION" >> "$GITHUB_OUTPUT"
            echo "install_status=failed" >> "$GITHUB_OUTPUT"
            echo "install_blocker=download_failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          
          if ! tar -xzf flume.tar.gz; then
            echo "baseline_version=$FLUME_VERSION" >> "$GITHUB_OUTPUT"
            echo "install_status=failed" >> "$GITHUB_OUTPUT"
            echo "install_blocker=extract_failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          mv apache-flume-${FLUME_VERSION}-bin flume
          
          # Set up environment
          echo "FLUME_HOME=$(pwd)/flume" >> $GITHUB_ENV
          echo "$(pwd)/flume/bin" >> $GITHUB_PATH
          
          # Verify installation
          if [ -f "flume/bin/flume-ng" ]; then
             chmod +x flume/bin/flume-ng
             echo "Flume binary found"
             echo "baseline_version=$FLUME_VERSION" >> "$GITHUB_OUTPUT"
             echo "install_status=success" >> $GITHUB_OUTPUT
          else
             echo "Flume binary not found after extraction"
             echo "baseline_version=$FLUME_VERSION" >> "$GITHUB_OUTPUT"
             echo "install_status=failed" >> $GITHUB_OUTPUT
             echo "install_blocker=baseline_layout_missing" >> "$GITHUB_OUTPUT"
             exit 1
          fi
      
      - name: Resolve Flume install state
        id: install_state
        if: always()
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/flume"
          STATUS="failed"
          BLOCKER="${{ steps.install.outputs.install_blocker || '' }}"
          if [ "${{ steps.install.outcome }}" = "success" ] && \
             [ "${{ steps.install.outputs.install_status }}" = "success" ] && [ -x "$ROOT/bin/flume-ng" ]; then
            STATUS="success"
            BLOCKER=""
          fi
          echo "FLUME_HOME=$ROOT" >> "$GITHUB_ENV"
          echo "FLUME_INSTALL_STATUS=$STATUS" >> "$GITHUB_ENV"
          echo "FLUME_INSTALL_BLOCKER=$BLOCKER" >> "$GITHUB_ENV"
          echo "install_status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "install_blocker=$BLOCKER" >> "$GITHUB_OUTPUT"

      - name: Get Flume version
        id: version
        if: always() && steps.install_state.outputs.install_status == 'success'
        run: |
          set -euo pipefail
          if ! VERSION=$(python3 "$RUNNER_TEMP/flume-smoke.py" version "$FLUME_HOME" "$FLUME_BASELINE_VERSION"); then
            echo "version=unknown" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected Flume version: $VERSION"

      - name: Test 1 - Check flume-ng binary exists
        id: test1
        if: always()
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          if [ "${FLUME_INSTALL_STATUS:-failed}" != "success" ]; then
            echo "Baseline installation failed: ${FLUME_INSTALL_BLOCKER:-unknown}"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "duration=0" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          
          if [ -x "flume/bin/flume-ng" ]; then
            echo "✓ flume-ng binary found and executable"
            echo "status=passed" >> $GITHUB_OUTPUT
          else
            echo "✗ flume-ng binary check failed"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
            fi
          
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT
      
      - name: Test 2 - Check flume version command
        id: test2
        if: always() && steps.install_state.outputs.install_status == 'success'
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          if [ "${FLUME_INSTALL_STATUS:-failed}" != "success" ]; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "duration=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export PATH="${FLUME_HOME:-$PWD/flume}/bin:$PATH"
          
          if [ "${{ steps.version.outcome }}" = "success" ] && \
             [ "${{ steps.version.outputs.version }}" = "$FLUME_BASELINE_VERSION" ] && \
             python3 "$RUNNER_TEMP/flume-smoke.py" version "$FLUME_HOME" "$FLUME_BASELINE_VERSION"; then
            echo "✓ flume version command works"
            echo "status=passed" >> $GITHUB_OUTPUT
          else
            echo "✗ flume version command failed"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
            fi
          
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT
      
      - name: Test 3 - Check flume help output
        id: test3
        if: always() && steps.install_state.outputs.install_status == 'success'
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          if [ "${FLUME_INSTALL_STATUS:-failed}" != "success" ]; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "duration=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export PATH="${FLUME_HOME:-$PWD/flume}/bin:$PATH"
          
          if timeout 30 "$FLUME_HOME/bin/flume-ng" help > "$RUNNER_TEMP/flume-help.log" 2>&1 && \
             grep -Ei "usage|help" "$RUNNER_TEMP/flume-help.log"; then
            echo "✓ flume help command works"
            echo "status=passed" >> $GITHUB_OUTPUT
          else
            echo "✗ flume help command failed"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
            fi
          
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT
      
      - name: Test 4 - Architecture Verification
        id: test4
        if: always() && steps.install_state.outputs.install_status == 'success'
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          if [ "${FLUME_INSTALL_STATUS:-failed}" != "success" ]; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "duration=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          echo "Checking system architecture..."
          ARCH=$(uname -m)
          if [ "$ARCH" = "aarch64" ]; then
            echo "✓ System architecture is ARM64 ($ARCH)"
            echo "status=passed" >> $GITHUB_OUTPUT
          else
            echo "✗ System architecture is NOT ARM64 ($ARCH)"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT
      
      - name: Test 5 - Functional Validation (Event delivery)
        id: test5
        if: always() && steps.install_state.outputs.install_status == 'success'
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          if [ "${FLUME_INSTALL_STATUS:-failed}" != "success" ]; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "duration=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if python3 "$RUNNER_TEMP/flume-smoke.py" event "$FLUME_HOME" "$FLUME_BASELINE_VERSION"; then
             echo "Flume delivered the exact event through the configured agent"
             echo "status=passed" >> $GITHUB_OUTPUT
          else
             echo "Flume event delivery failed"
             echo "status=failed" >> $GITHUB_OUTPUT
             exit 1
          fi

          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT  
      - name: Test 6 - Regression Validation
        id: test6
        if: always()
        run: |
          START_TIME=$(date +%s)
          set -euo pipefail
          CURRENT="$(echo "${{ steps.version.outputs.version || 'unknown' }}" | tr -d '[:space:]' | sed 's/^v//')"
          LATEST="${FLUME_NEXT_VERSION}"

          if [ "${{ steps.install_state.outputs.install_status || 'failed' }}" != "success" ]; then
            echo "current_version=${CURRENT}" >> "$GITHUB_OUTPUT"
            echo "latest_version=${LATEST}" >> "$GITHUB_OUTPUT"
            echo "next_installed_version=not_installed" >> "$GITHUB_OUTPUT"
            echo "decision=baseline_failed" >> "$GITHUB_OUTPUT"
            echo "regression_result=Regression validation deferred because baseline install or core smoke checks failed" >> "$GITHUB_OUTPUT"
            echo "comparison=Current pinned Flume version ${CURRENT} did not complete baseline installation and core Tests 1-5 cleanly in this run, so next-version validation was not attempted on Arm64." >> "$GITHUB_OUTPUT"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            END_TIME=$(date +%s)
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NEXT_INSTALLED="not_installed"
          DECISION="next_lookup_failed"
          REGRESSION_RESULT="Next version install failed on Arm64"
          COMPARISON="Baseline Flume ${CURRENT} is checked separately by Tests 1-5; the next regression candidate could not be resolved."
          STATUS="failed"

          if [ -z "$LATEST" ]; then
            NEXT_INSTALLED="lookup_failed"
          elif [ "$CURRENT" = "$LATEST" ]; then
            NEXT_INSTALLED="$CURRENT"
            DECISION="no_newer_stable_available"
            REGRESSION_RESULT="No newer stable release available for Test 6"
            COMPARISON="Current pinned baseline already matches the newest public stable upstream release, so there is no newer stable Arm64 candidate for a genuine Test 6 upgrade check."
            STATUS="skipped"
          else
            NEXT_DIR=$(mktemp -d "$RUNNER_TEMP/flume-next-XXXXXX")
            trap 'rm -rf "$NEXT_DIR"' EXIT
            NEXT_TARBALL="$NEXT_DIR/flume.tar.gz"
            if bash .github/scripts/download-with-fallback.sh \
              "$NEXT_TARBALL" \
              "https://downloads.apache.org/flume/${LATEST}/apache-flume-${LATEST}-bin.tar.gz" \
              "https://archive.apache.org/dist/flume/${LATEST}/apache-flume-${LATEST}-bin.tar.gz"; then
              NEXT_HOME="$NEXT_DIR/apache-flume-${LATEST}-bin"
              NEXT_BIN="$NEXT_HOME/bin/flume-ng"
              if tar -xzf "$NEXT_TARBALL" -C "$NEXT_DIR" && [ -x "$NEXT_BIN" ]; then
                NEXT_INSTALLED_VERSION="unknown"
                if NEXT_INSTALLED_VERSION=$(python3 "$RUNNER_TEMP/flume-smoke.py" version "$NEXT_HOME" "$LATEST") && \
                   python3 "$RUNNER_TEMP/flume-smoke.py" event "$NEXT_HOME" "$LATEST"; then
                  NEXT_INSTALLED="$NEXT_INSTALLED_VERSION"
                  DECISION="next_install_validated"
                  REGRESSION_RESULT="Next version installed successfully on Arm64"
                  COMPARISON="Baseline Flume ${CURRENT} is checked separately by Tests 1-5. Candidate ${LATEST} reported the exact version with exit zero and delivered a unique event through a spool source, memory channel and file sink on Arm64."
                  STATUS="passed"
                else
                  NEXT_INSTALLED="${NEXT_INSTALLED_VERSION:-unknown}"
                  DECISION="next_install_failed"
                  REGRESSION_RESULT="Next version command or event delivery failed on Arm64"
                  COMPARISON="Baseline Flume ${CURRENT} is checked separately by Tests 1-5. Candidate ${LATEST} failed the exact zero-exit version command or bounded event-delivery check; a versioned JAR alone cannot pass."
                fi
              else
                NEXT_INSTALLED="install_failed"
                DECISION="next_install_failed"
                REGRESSION_RESULT="Next version install failed on Arm64"
                COMPARISON="Baseline Flume ${CURRENT} is checked separately by Tests 1-5. Candidate ${LATEST} did not extract a usable Flume distribution."
              fi
            else
              NEXT_INSTALLED="install_failed"
              DECISION="next_install_failed"
              REGRESSION_RESULT="Next version install failed on Arm64"
              COMPARISON="Baseline Flume ${CURRENT} is checked separately by Tests 1-5. Candidate ${LATEST} could not be downloaded on Arm64."
            fi
          fi

          echo "current_version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest_version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "next_installed_version=$NEXT_INSTALLED" >> "$GITHUB_OUTPUT"
          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"
          echo "regression_result=$REGRESSION_RESULT" >> "$GITHUB_OUTPUT"
          echo "comparison=$COMPARISON" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

          echo "=== Regression Validation (Next Version Install) ==="
          echo "Current version tested in Tests 1-5: $CURRENT"
          echo "Next version targeted for install validation: $LATEST"
          echo "Next version installed on Arm64: $NEXT_INSTALLED"
          echo "Regression install result: $REGRESSION_RESULT"
          echo "Details: $COMPARISON"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

          if [ "$STATUS" = "failed" ]; then
            exit 1
          fi

          last_status="$(grep '^status=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2- || true)"
          if [ "$last_status" = "failed" ]; then
            exit 1
          fi
      - name: Show regression validation details
        if: always()
        run: |
          DECISION="${{ steps.test6.outputs.decision || 'manual_review_needed' }}"
          REGRESSION_RESULT="${{ steps.test6.outputs.regression_result || '' }}"
          if [ -z "$REGRESSION_RESULT" ]; then
            case "$DECISION" in
              next_install_validated|safe_to_upgrade)
                REGRESSION_RESULT="Next version installed successfully on Arm64"
                ;;
              next_install_failed|next_lookup_failed)
                REGRESSION_RESULT="Next version install failed on Arm64"
                ;;
              no_newer_stable_available)
                REGRESSION_RESULT="No newer stable release available for Test 6"
                ;;
              current_is_latest_stable|pinned_is_latest|already_current|already_at_latest|at_latest|current_is_latest|current_is_latest_validated_release|current_is_latest_validated_3_2_x|pinned_latest_eol)
                REGRESSION_RESULT="Tests 1-5 baseline must be older than the latest stable release"
                ;;
              hold_current|hold_current_until_regression_run|hold_current_arm_dependency_gap|metadata_review_required|upgrade_candidate_available|manual_review_needed|manual_review_needed_for_product_upgrade|keep_current)
                REGRESSION_RESULT="Pending regression install validation"
                ;;
              *)
                if [ "${{ steps.test6.outputs.status || 'skipped' }}" = "passed" ]; then
                  REGRESSION_RESULT="Regression validation passed"
                else
                  REGRESSION_RESULT="Regression validation failed"
                fi
                ;;
            esac
          fi

          echo "=== Regression Validation (Next Version Install) ==="
          echo "Current version tested in Tests 1-5: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || steps.metadata.outputs.current_version || 'unknown' }}"
          echo "Next version targeted for install validation: ${{ steps.test6.outputs.latest_version || steps.metadata.outputs.latest_version || 'unknown' }}"
          echo "Next version installed on Arm64: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}"
          echo "Regression install result: ${REGRESSION_RESULT}"
          echo "Details: ${{ steps.test6.outputs.comparison || steps.test6.outputs.note || 'Regression comparison summary unavailable.' }}"

      - name: Emit package result
        if: always()
        id: summary
        uses: ./.github/actions/emit-package-result
        with:
          package_name: "Flume"
          version: ${{ steps.version.outputs.version }}
          install_status: ${{ steps.install_state.outputs.install_status || 'failed' }}
          test1_label: "Check flume-ng binary exists"
          test2_label: "Check flume version command"
          test3_label: "Check flume help output"
          test4_label: "Architecture Verification"
          test5_label: "Functional Validation (Event delivery)"
          test1_status: ${{ steps.test1.outcome == 'success' && steps.test1.outputs.status || steps.test1.outcome == 'skipped' && 'skipped' || 'failed' }}
          test2_status: ${{ steps.test2.outcome == 'success' && steps.test2.outputs.status || steps.test2.outcome == 'skipped' && 'skipped' || 'failed' }}
          test3_status: ${{ steps.test3.outcome == 'success' && steps.test3.outputs.status || steps.test3.outcome == 'skipped' && 'skipped' || 'failed' }}
          test4_status: ${{ steps.test4.outcome == 'success' && steps.test4.outputs.status || steps.test4.outcome == 'skipped' && 'skipped' || 'failed' }}
          test5_status: ${{ steps.test5.outcome == 'success' && steps.test5.outputs.status || steps.test5.outcome == 'skipped' && 'skipped' || 'failed' }}
          test6_status: ${{ steps.test6.outcome == 'success' && steps.test6.outputs.status || steps.test6.outcome == 'skipped' && 'skipped' || 'failed' }}
          test1_duration: ${{ steps.test1.outputs.duration || '0' }}
          test2_duration: ${{ steps.test2.outputs.duration || '0' }}
          test3_duration: ${{ steps.test3.outputs.duration || '0' }}
          test4_duration: ${{ steps.test4.outputs.duration || '0' }}
          test5_duration: ${{ steps.test5.outputs.duration || '0' }}
          test6_duration: ${{ steps.test6.outputs.duration || '0' }}
          regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || steps.install.outputs.baseline_version || env.FLUME_BASELINE_VERSION }}
          regression_latest_version: ${{ steps.test6.outputs.latest_version || env.FLUME_NEXT_VERSION }}
          regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
          regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
          regression_result: ${{ steps.test6.outputs.regression_result || '' }}
          regression_details: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
          runner_label: "ubuntu-24.04 (arm64)"

      - name: Finalize workflow status
        if: always()
        run: |
          if [ "${{ steps.summary.outcome }}" != "success" ] || \
             [ "${{ steps.summary.outputs.should_fail }}" != "0" ] || \
             [ "${{ steps.summary.outputs.overall_status }}" != "success" ] || \
             [ "${{ steps.version.outcome }}" != "success" ]; then
            exit 1
          fi

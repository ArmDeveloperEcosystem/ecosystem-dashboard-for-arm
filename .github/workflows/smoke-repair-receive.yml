name: Validate external smoke repair proposal

on:
  repository_dispatch:
    types: [smoke-repair-proposal]

permissions:
  contents: read

concurrency:
  group: smoke-repair-publication
  cancel-in-progress: false
  queue: max

jobs:
  receive:
    name: Authenticate data-only proposal
    if: >-
      github.ref == 'refs/heads/main' && vars.SMOKE_REPAIR_ENABLED == 'true' &&
      vars.SMOKE_REPAIR_BRIDGE_BOT_LOGIN != '' &&
      github.actor == vars.SMOKE_REPAIR_BRIDGE_BOT_LOGIN
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      base_sha: ${{ steps.admit.outputs.base_sha }}
      package_slug: ${{ steps.admit.outputs.package_slug }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out trusted callback implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned workflow parser
        run: |
          python3 -m pip install --disable-pip-version-check --no-deps --only-binary=:all: --require-hashes -r .github/scripts/requirements-exact-run.txt
      - name: Verify sender failure evidence and restricted proposal
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_REPAIR_ENABLED: ${{ vars.SMOKE_REPAIR_ENABLED }}
          SMOKE_REPAIR_BRIDGE_BOT_LOGIN: ${{ vars.SMOKE_REPAIR_BRIDGE_BOT_LOGIN }}
          SMOKE_REPAIR_BRIDGE_BOT_ID: ${{ vars.SMOKE_REPAIR_BRIDGE_BOT_ID }}
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/repair-admitted"
          python3 -I -B .github/scripts/smoke_repair_bridge.py \
            --event "$GITHUB_EVENT_PATH" --output-directory "$RUNNER_TEMP/repair-admitted"
      - name: Preserve admitted proposal as data only
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: smoke-repair-admitted-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/repair-admitted/context.json
            ${{ runner.temp }}/repair-admitted/proposal.json
          if-no-files-found: error
          retention-days: 30

  repair:
    name: Validate and publish admitted repair
    needs: receive
    permissions:
      contents: read
      actions: write
      issues: write
    uses: ./.github/workflows/smoke-repair-package.yml
    with:
      base_sha: ${{ needs.receive.outputs.base_sha }}
      package_slug: ${{ needs.receive.outputs.package_slug }}
      proposal_artifact_id: ${{ needs.receive.outputs.artifact_id }}

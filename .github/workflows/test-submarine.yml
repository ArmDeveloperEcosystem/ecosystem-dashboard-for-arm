name: Test Submarine on Arm64

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-submarine.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-submarine.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-submarine.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-submarine.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-submarine.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-submarine.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-submarine.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-submarine.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-submarine.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-submarine.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-submarine.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-submarine.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-submarine.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-submarine.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-submarine.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-submarine.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-submarine.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-submarine.outputs.regression_next_installed_version }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-submarine.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-submarine.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-submarine.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-submarine.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-submarine.outputs.timestamp }}
jobs:
  test-submarine:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    container:
      image: registry.fedoraproject.org/fedora-minimal@sha256:c8f378f1927145aa7cf5c4c5044ba13fbfc0725aa61b626eb05caa73eea9b86a # original: registry.fedoraproject.org/fedora-minimal:41
    env:
      SUBMARINE_VERSION: "0.4.0"
      SUBMARINE_SOURCE_COMMIT: "8e53f27f9f4b41ba4ea960ad7b8d3781eae6cb8d"
      SUBMARINE_NEXT_VERSION: "0.5.1"
      SUBMARINE_NEXT_SOURCE_COMMIT: "a2e60395030115263af276eabd6f8da0a21a84a9"
      SUBMARINE_NEXT_GO_VERSION: "1.26.6"
      SUBMARINE_NEXT_GO_ARCHIVE_URL: "https://go.dev/dl/go1.26.6.linux-arm64.tar.gz"
      SUBMARINE_NEXT_GO_ARCHIVE_SHA256: "d0507e9e9d7fe012aae570108cbd76c15de879e17130ab8cb90d4d7445cb1f2e"
      SUBMARINE_REPO: "https://github.com/FyraLabs/submarine.git"
      SUBMARINE_KERNEL_UPSTREAM: "https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git"
      SUBMARINE_KERNEL_MIRROR: "https://github.com/gregkh/linux.git"
      SUBMARINE_WORKROOT: "/tmp/submarine-smoke"
      SUBMARINE_VENV: "/tmp/submarine-smoke/venv"

    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'Submarine'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || steps.version.outputs.latest || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
    steps:
      - name: Bootstrap checkout prerequisites
        run: |
          set -euo pipefail
          dnf5 install -y bash git tar gzip findutils ca-certificates
          if [ ! -x /usr/bin/sh ]; then
            ln -sf "$(command -v bash)" /usr/bin/sh
          fi
          echo "/usr/sbin" >> "$GITHUB_PATH"
          echo "/sbin" >> "$GITHUB_PATH"
          echo "/usr/bin" >> "$GITHUB_PATH"
          echo "/bin" >> "$GITHUB_PATH"

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=submarine" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/opensource_packages/submarine" >> "$GITHUB_OUTPUT"
          echo "current_version=${SUBMARINE_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Install Submarine baseline
        id: install
        run: |
          set -euo pipefail
          dnf5 update -y
          dnf5 install -y bash git make gcc ccache awk patch flex bison elfutils-devel parted vboot-utils golang xz bc tar openssl-devel python3 python3-pip uboot-tools gzip file findutils util-linux dtc

          export PATH="/usr/sbin:/sbin:/usr/bin:/bin:$PATH:$HOME/go/bin"
          BASE_DIR="${SUBMARINE_WORKROOT}/current"
          rm -rf "${SUBMARINE_WORKROOT}"
          mkdir -p "${SUBMARINE_WORKROOT}"
          python3 -m venv "${SUBMARINE_VENV}"
          "${SUBMARINE_VENV}/bin/pip" install --upgrade pip
          # depthcharge-tools still imports pkg_resources on Fedora 41 / Python 3.13.
          "${SUBMARINE_VENV}/bin/pip" install "setuptools<81" depthcharge-tools
          echo "${SUBMARINE_VENV}/bin" >> "$GITHUB_PATH"
          export PATH="${SUBMARINE_VENV}/bin:/usr/sbin:/sbin:/usr/bin:/bin:$PATH:$HOME/go/bin"
          git clone --depth 1 --branch "v${SUBMARINE_VERSION}" "${SUBMARINE_REPO}" "${BASE_DIR}"
          git config --global --add safe.directory "${BASE_DIR}"
          test "$(git -C "${BASE_DIR}" rev-parse HEAD)" = "${SUBMARINE_SOURCE_COMMIT}"
          test "$(git -C "${BASE_DIR}" config -f .gitmodules --get submodule.kernel.url)" = "${SUBMARINE_KERNEL_UPSTREAM}"
          git -C "${BASE_DIR}" config submodule.kernel.url "${SUBMARINE_KERNEL_MIRROR}"
          git -C "${BASE_DIR}" submodule update --init --depth 1 --jobs 2 u-root kernel
          for SUBMODULE in u-root kernel; do
            EXPECTED_SUBMODULE_COMMIT=$(git -C "${BASE_DIR}" rev-parse "HEAD:${SUBMODULE}")
            ACTUAL_SUBMODULE_COMMIT=$(git -C "${BASE_DIR}/${SUBMODULE}" rev-parse HEAD)
            test "${ACTUAL_SUBMODULE_COMMIT}" = "${EXPECTED_SUBMODULE_COMMIT}"
          done

          UROOT_COMMIT=$(git -C "${BASE_DIR}" rev-parse HEAD:u-root)
          # Retry only dependency-download gateway failures, never the image build/tests.
          UROOT_LOG=$(mktemp)
          for ATTEMPT in 1 2 3; do
            if go install github.com/u-root/u-root@"${UROOT_COMMIT}" > "${UROOT_LOG}" 2>&1; then
              cat "${UROOT_LOG}"
              break
            else
              UROOT_STATUS=$?
            fi
            cat "${UROOT_LOG}" >&2
            if [ "${ATTEMPT}" -eq 3 ] || ! grep -Eq 'reading https://[^[:space:]]+: 50[234]([[:space:]]|$)' "${UROOT_LOG}"; then
              rm -f "${UROOT_LOG}"
              exit "${UROOT_STATUS}"
            fi
            echo "u-root dependency download failed; retrying setup ($((ATTEMPT + 1))/3)." >&2
            sleep "$((ATTEMPT * 5))"
          done
          rm -f "${UROOT_LOG}"

          JOBS=$(nproc)
          if ! timeout 30m bash -lc "make -C '${BASE_DIR}' -j'${JOBS}' arm64 > /tmp/submarine-build.log 2>&1"; then
            cat /tmp/submarine-build.log || true
            exit 1
          fi

          test -f "${BASE_DIR}/images/submarine-a64.bin"
          test -f "${BASE_DIR}/images/submarine-a64.kpart"
          test -f "${BASE_DIR}/build/bzImage.a64"

          echo "base_dir=${BASE_DIR}" >> "$GITHUB_OUTPUT"
          echo "install_status=success" >> "$GITHUB_OUTPUT"

      - name: Get Submarine version
        id: version
        run: |
          set -euo pipefail
          BASE_DIR="${{ steps.install.outputs.base_dir }}"
          CURRENT=$(git -C "${BASE_DIR}" describe --tags --exact-match | sed 's/^v//')
          echo "version=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "latest=${SUBMARINE_NEXT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Detected Submarine version: ${CURRENT}"
          echo "Pinned next validation release: ${SUBMARINE_NEXT_VERSION}"

      - name: Test 1 - Check build artifacts exist
        id: test1
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          BASE_DIR="${{ steps.install.outputs.base_dir }}"
          if [ -f "${BASE_DIR}/images/submarine-a64.bin" ] && \
             [ -f "${BASE_DIR}/images/submarine-a64.kpart" ] && \
             [ -f "${BASE_DIR}/build/bzImage.a64" ]; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            END_TIME=$(date +%s)
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 2 - Check version provenance
        id: test2
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          BASE_DIR="${{ steps.install.outputs.base_dir }}"
          TAG=$(git -C "${BASE_DIR}" describe --tags --exact-match | sed 's/^v//')
          SOURCE_COMMIT=$(git -C "${BASE_DIR}" rev-parse HEAD)
          if [ "${TAG}" = "${SUBMARINE_VERSION}" ] && [ "${SOURCE_COMMIT}" = "${SUBMARINE_SOURCE_COMMIT}" ]; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "Expected ${SUBMARINE_VERSION}, got ${TAG}"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            END_TIME=$(date +%s)
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 3 - Check build usage output
        id: test3
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          BASE_DIR="${{ steps.install.outputs.base_dir }}"
          make -C "${BASE_DIR}" usage > /tmp/submarine-usage.txt 2>&1
          if grep -Eq 'x86_64|arm64' /tmp/submarine-usage.txt; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            cat /tmp/submarine-usage.txt || true
            echo "status=failed" >> "$GITHUB_OUTPUT"
            END_TIME=$(date +%s)
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 4 - Architecture Verification
        id: test4
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          BASE_DIR="${{ steps.install.outputs.base_dir }}"
          gzip -cd "${BASE_DIR}/build/bzImage.a64" >/tmp/submarine-bzImage-test4 || true
          KERNEL_DESC=$(file /tmp/submarine-bzImage-test4 2>/dev/null || true)
          if [ "$(uname -m)" = "aarch64" ] && \
             printf '%s\n' "$KERNEL_DESC" | grep -Eqi 'ARM aarch64|ARM64|AArch64'; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            uname -m
            printf '%s\n' "$KERNEL_DESC" || true
            echo "status=failed" >> "$GITHUB_OUTPUT"
            END_TIME=$(date +%s)
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 5 - Functional image validation
        id: test5
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          BASE_DIR="${{ steps.install.outputs.base_dir }}"
          parted -s "${BASE_DIR}/images/submarine-a64.bin" unit s print > /tmp/submarine-parted.txt 2>&1
          IMAGE_SIZE=$(stat -c%s "${BASE_DIR}/images/submarine-a64.bin")
          if grep -q "Partition Table: gpt" /tmp/submarine-parted.txt && \
             grep -Eq '^ 1|^1 ' /tmp/submarine-parted.txt && \
             [ "${IMAGE_SIZE}" -gt 50000000 ]; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            cat /tmp/submarine-parted.txt || true
            echo "Image size: ${IMAGE_SIZE}"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            END_TIME=$(date +%s)
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 6 - Regression Validation
        id: test6
        if: always()
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          export PATH="${SUBMARINE_VENV}/bin:$PATH:$HOME/go/bin"
          CURRENT="${{ steps.version.outputs.version || steps.metadata.outputs.current_version || 'unknown' }}"
          LATEST="${{ steps.version.outputs.latest || env.SUBMARINE_NEXT_VERSION || 'unknown' }}"
          NEXT_DIR="${SUBMARINE_WORKROOT}/regression"

          fail_regression() {
            local decision="$1"
            local result="$2"
            local comparison="$3"
            local installed="${4:-not_installed}"
            echo "next_installed_version=${installed}" >> "$GITHUB_OUTPUT"
            echo "decision=${decision}" >> "$GITHUB_OUTPUT"
            echo "regression_result=${result}" >> "$GITHUB_OUTPUT"
            echo "comparison=${comparison}" >> "$GITHUB_OUTPUT"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            local end_time
            end_time=$(date +%s)
            echo "duration=$((end_time - START_TIME))" >> "$GITHUB_OUTPUT"
            exit 1
          }

          unexpected_regression_failure() {
            local failure_status=$?
            trap - ERR
            fail_regression \
              "next_install_failed" \
              "Unexpected next-version validation failure on Arm64" \
              "Candidate v${LATEST} stopped before completing its bounded Arm64 validation (exit ${failure_status})."
          }
          trap unexpected_regression_failure ERR

          echo "current_version=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "latest_version=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "=== Regression Validation (Next Version Install) ==="
          echo "Current version tested in Tests 1-5: ${CURRENT}"
          echo "Next version targeted for install validation: ${LATEST}"

          if [ "${{ steps.install.outputs.install_status || '' }}" != "success" ]; then
            echo "next_installed_version=not_installed" >> "$GITHUB_OUTPUT"
            echo "decision=baseline_install_failed" >> "$GITHUB_OUTPUT"
            echo "regression_result=Baseline install/build failed before regression validation" >> "$GITHUB_OUTPUT"
            echo "comparison=Current pinned Submarine version ${CURRENT} could not complete baseline install/build in this run, so a genuine Arm64 next-version regression validation was not possible." >> "$GITHUB_OUTPUT"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            END_TIME=$(date +%s)
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "${LATEST}" ] || [ "${LATEST}" = "unknown" ]; then
            echo "next_installed_version=not_installed" >> "$GITHUB_OUTPUT"
            echo "decision=next_lookup_failed" >> "$GITHUB_OUTPUT"
            echo "regression_result=Next version lookup failed on Arm64" >> "$GITHUB_OUTPUT"
            echo "comparison=Current pinned Submarine version ${CURRENT} completed the real Arm64 boot-image build path in this run, but the pinned next validation release was unavailable for isolated regression validation." >> "$GITHUB_OUTPUT"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            END_TIME=$(date +%s)
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          rm -rf "${NEXT_DIR}"
          if ! git clone --depth 1 --branch "v${LATEST}" "${SUBMARINE_REPO}" "${NEXT_DIR}"; then
            fail_regression \
              "next_download_failed" \
              "Next version source download failed on Arm64" \
              "Current pinned Submarine version ${CURRENT} completed the real Arm64 boot-image build path, but the exact candidate tag v${LATEST} could not be cloned."
          fi
          git config --global --add safe.directory "${NEXT_DIR}"
          if ! NEXT_SOURCE_COMMIT=$(git -C "${NEXT_DIR}" rev-parse HEAD) || [ "${NEXT_SOURCE_COMMIT}" != "${SUBMARINE_NEXT_SOURCE_COMMIT}" ]; then
            fail_regression \
              "next_source_preflight_failed" \
              "Next version source identity validation failed on Arm64" \
              "Candidate v${LATEST} did not resolve to the reviewed immutable Submarine commit ${SUBMARINE_NEXT_SOURCE_COMMIT}."
          fi
          if ! DECLARED_KERNEL_URL=$(git -C "${NEXT_DIR}" config -f .gitmodules --get submodule.kernel.url) || [ "${DECLARED_KERNEL_URL}" != "${SUBMARINE_KERNEL_UPSTREAM}" ]; then
            fail_regression \
              "next_source_preflight_failed" \
              "Next version kernel source identity validation failed on Arm64" \
              "Candidate v${LATEST} did not declare the reviewed Linux stable-tree source."
          fi
          if ! git -C "${NEXT_DIR}" config submodule.kernel.url "${SUBMARINE_KERNEL_MIRROR}"; then
            fail_regression \
              "next_source_preflight_failed" \
              "Next version mirror configuration failed on Arm64" \
              "The reviewed Linux stable-tree mirror could not be configured for candidate v${LATEST}."
          fi
          if ! git -C "${NEXT_DIR}" submodule update --init --depth 1 --jobs 2 u-root kernel; then
            fail_regression \
              "next_download_failed" \
              "Next version submodule download failed on Arm64" \
              "Candidate v${LATEST} could not fetch its exact reviewed u-root and Linux gitlinks through the approved transports."
          fi
          for SUBMODULE in u-root kernel; do
            if ! EXPECTED_SUBMODULE_COMMIT=$(git -C "${NEXT_DIR}" rev-parse "HEAD:${SUBMODULE}") || \
               ! ACTUAL_SUBMODULE_COMMIT=$(git -C "${NEXT_DIR}/${SUBMODULE}" rev-parse HEAD) || \
               [ "${ACTUAL_SUBMODULE_COMMIT}" != "${EXPECTED_SUBMODULE_COMMIT}" ]; then
              fail_regression \
                "next_source_preflight_failed" \
                "Next version submodule identity validation failed on Arm64" \
                "Candidate v${LATEST} did not check out the exact ${SUBMODULE} commit recorded by its reviewed parent source."
            fi
          done

          # Candidate v0.5.1 pins u-root to a module requiring Go 1.26.6.
          # Keep the baseline on Fedora's owned toolchain and provision the
          # exact official Linux Arm64 archive only inside Test 6.
          GO_ARCHIVE=$(mktemp)
          GO_ROOT="${SUBMARINE_WORKROOT}/go${SUBMARINE_NEXT_GO_VERSION}"
          if ! curl --fail --location --silent --show-error \
              --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --retry 3 --retry-all-errors --connect-timeout 20 --max-time 300 \
              --output "${GO_ARCHIVE}" "${SUBMARINE_NEXT_GO_ARCHIVE_URL}"; then
            rm -f "${GO_ARCHIVE}"
            fail_regression \
              "next_install_failed" \
              "Next version Go toolchain download failed on Arm64" \
              "Candidate v${LATEST} requires the reviewed Go ${SUBMARINE_NEXT_GO_VERSION} Linux Arm64 toolchain, but its official archive could not be downloaded."
          fi
          ACTUAL_GO_ARCHIVE_SHA256=$(sha256sum "${GO_ARCHIVE}" | awk '{print $1}')
          if [ "${ACTUAL_GO_ARCHIVE_SHA256}" != "${SUBMARINE_NEXT_GO_ARCHIVE_SHA256}" ]; then
            rm -f "${GO_ARCHIVE}"
            fail_regression \
              "next_install_failed" \
              "Next version Go toolchain integrity validation failed on Arm64" \
              "The official Go ${SUBMARINE_NEXT_GO_VERSION} Linux Arm64 archive did not match its reviewed SHA-256."
          fi
          rm -rf "${GO_ROOT}"
          mkdir -p "${GO_ROOT}"
          if ! tar --extract --gzip --file "${GO_ARCHIVE}" \
              --directory "${GO_ROOT}" --strip-components 1 \
              --no-same-owner --no-same-permissions; then
            rm -f "${GO_ARCHIVE}"
            fail_regression \
              "next_install_failed" \
              "Next version Go toolchain extraction failed on Arm64" \
              "The checksum-verified Go ${SUBMARINE_NEXT_GO_VERSION} Linux Arm64 archive could not be extracted."
          fi
          rm -f "${GO_ARCHIVE}"
          if ! NEXT_GO_ID=$("${GO_ROOT}/bin/go" version) || \
             [ "${NEXT_GO_ID}" != "go version go${SUBMARINE_NEXT_GO_VERSION} linux/arm64" ]; then
            fail_regression \
              "next_install_failed" \
              "Next version Go toolchain identity validation failed on Arm64" \
              "Candidate v${LATEST} did not receive the exact reviewed Go ${SUBMARINE_NEXT_GO_VERSION} Linux Arm64 toolchain."
          fi
          export PATH="${GO_ROOT}/bin:${PATH}"
          export GOTOOLCHAIN=local

          UROOT_BIN="${HOME}/go/bin/u-root"
          UROOT_LOG=$(mktemp)
          mkdir -p "$(dirname "${UROOT_BIN}")"
          if ! (
            cd "${NEXT_DIR}/u-root"
            go build -mod=vendor -trimpath -o "${UROOT_BIN}" .
          ) > "${UROOT_LOG}" 2>&1; then
            cat "${UROOT_LOG}" >&2
            rm -f "${UROOT_LOG}"
            fail_regression \
              "next_install_failed" \
              "Next version u-root build failed on Arm64" \
              "Candidate v${LATEST} could not compile its exact reviewed vendored u-root checkout on Arm64."
          fi
          cat "${UROOT_LOG}"
          rm -f "${UROOT_LOG}"
          if ! UROOT_BINARY_DESC=$(file "${UROOT_BIN}") || \
             ! printf '%s\n' "${UROOT_BINARY_DESC}" | grep -Eqi 'ARM aarch64|ARM64|AArch64'; then
            fail_regression \
              "next_install_failed" \
              "Next version u-root architecture validation failed on Arm64" \
              "Candidate v${LATEST} did not produce a native Arm64 u-root executable from its reviewed source checkout."
          fi
          JOBS=$(nproc)
          if ! timeout 30m bash -lc "make -C '${NEXT_DIR}' -j'${JOBS}' arm64 > /tmp/submarine-next-build.log 2>&1"; then
            cat /tmp/submarine-next-build.log || true
            fail_regression \
              "next_install_failed" \
              "Next version install failed on Arm64" \
              "Current pinned Submarine version ${CURRENT} completed the real Arm64 boot-image build path in this run, but candidate version ${LATEST} failed during the next-version build on Arm64." \
              "build_failed"
          fi
          if ! NEXT_VERSION=$(git -C "${NEXT_DIR}" describe --tags --exact-match | sed 's/^v//'); then
            fail_regression \
              "next_source_preflight_failed" \
              "Next version tag validation failed on Arm64" \
              "Candidate source did not retain the reviewed exact v${LATEST} tag identity after the Arm64 build."
          fi
          if ! parted -s "${NEXT_DIR}/images/submarine-a64.bin" unit s print > /tmp/submarine-next-parted.txt 2>&1 || \
             ! NEXT_IMAGE_SIZE=$(stat -c%s "${NEXT_DIR}/images/submarine-a64.bin"); then
            fail_regression \
              "next_artifact_validation_failed" \
              "Next version image validation failed on Arm64" \
              "Candidate v${LATEST} did not produce a readable Arm64 disk image for bounded validation." \
              "${NEXT_VERSION}"
          fi
          gzip -cd "${NEXT_DIR}/build/bzImage.a64" >/tmp/submarine-bzImage-next || true
          NEXT_KERNEL_DESC=$(file /tmp/submarine-bzImage-next 2>/dev/null || true)
          NEXT_GPT_OK=0
          if grep -q "Partition Table: gpt" /tmp/submarine-next-parted.txt; then
            NEXT_GPT_OK=1
          fi
          NEXT_ARTIFACTS_OK=0
          if [ -f "${NEXT_DIR}/images/submarine-a64.bin" ] && [ -f "${NEXT_DIR}/images/submarine-a64.kpart" ]; then
            NEXT_ARTIFACTS_OK=1
          fi

          if [ "${NEXT_VERSION}" = "${LATEST}" ] && \
             [ "${NEXT_ARTIFACTS_OK}" -eq 1 ] && \
             [ "${NEXT_GPT_OK}" -eq 1 ] && \
             printf '%s\n' "${NEXT_KERNEL_DESC}" | grep -Eqi 'ARM aarch64|ARM64|AArch64' && \
             [ "${NEXT_IMAGE_SIZE}" -gt 50000000 ]; then
            echo "next_installed_version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
            if [ "${CURRENT}" = "${LATEST}" ]; then
              echo "decision=metadata_review_required" >> "$GITHUB_OUTPUT"
              echo "regression_result=Pending regression install validation" >> "$GITHUB_OUTPUT"
              echo "comparison=Current pinned Submarine version ${CURRENT} already matches the pinned next validation release. Tests 1-5 validate the real Arm64 image-build path, but the dashboard anchor leaves no distinct upgrade step, so this package needs metadata or policy review before claiming a genuine Test 6 upgrade." >> "$GITHUB_OUTPUT"
              echo "status=failed" >> "$GITHUB_OUTPUT"
            else
              echo "decision=next_install_validated" >> "$GITHUB_OUTPUT"
              echo "regression_result=Next version installed successfully on Arm64" >> "$GITHUB_OUTPUT"
              echo "comparison=Current pinned Submarine version ${CURRENT} completed the real Arm64 boot-image build path in this run. Regression validation rebuilt candidate version ${LATEST} from a fresh isolated clone and reconfirmed the Arm64 image-generation path successfully." >> "$GITHUB_OUTPUT"
              echo "status=passed" >> "$GITHUB_OUTPUT"
            fi
          else
            cat /tmp/submarine-next-parted.txt || true
            echo "${NEXT_KERNEL_DESC:-kernel-description-unavailable}" || true
            echo "Next image size: ${NEXT_IMAGE_SIZE:-unknown}" || true
            echo "next_installed_version=${NEXT_VERSION:-not_installed}" >> "$GITHUB_OUTPUT"
            echo "decision=next_artifact_validation_failed" >> "$GITHUB_OUTPUT"
            echo "regression_result=Next version install failed on Arm64" >> "$GITHUB_OUTPUT"
            echo "comparison=Current pinned Submarine version ${CURRENT} completed the real Arm64 boot-image build path in this run, but candidate version ${LATEST} did not rebuild into a valid Arm64 image artifact set." >> "$GITHUB_OUTPUT"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            END_TIME=$(date +%s)
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
          last_status="$(grep '^status=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2- || true)"
          if [ "$last_status" = "failed" ]; then
            exit 1
          fi
      - name: Show regression validation details
        if: always()
        run: |
          echo "=== Regression Validation (Next Version Install) ==="
          echo "Current version tested in Tests 1-5: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}"
          echo "Next version targeted for install validation: ${{ steps.test6.outputs.latest_version || 'unknown' }}"
          echo "Next version installed on Arm64: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}"
          echo "Regression install result: ${{ steps.test6.outputs.regression_result || 'Regression result unavailable.' }}"
          echo "Details: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}"

      - name: Calculate test summary
        if: always()
        id: summary
        run: |
          set -euo pipefail
          PASSED=0
          FAILED=0
          SKIPPED=0
          CORE_FAILED=0
          TOTAL_DURATION=0

          check_core_test() {
            local status="$1"
            local duration="$2"
            if [ "$status" = "passed" ]; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
              CORE_FAILED=$((CORE_FAILED + 1))
            fi
            TOTAL_DURATION=$((TOTAL_DURATION + duration))
          }

          check_core_test "${{ steps.test1.outputs.status || 'failed' }}" "${{ steps.test1.outputs.duration || 0 }}"
          check_core_test "${{ steps.test2.outputs.status || 'failed' }}" "${{ steps.test2.outputs.duration || 0 }}"
          check_core_test "${{ steps.test3.outputs.status || 'failed' }}" "${{ steps.test3.outputs.duration || 0 }}"
          check_core_test "${{ steps.test4.outputs.status || 'failed' }}" "${{ steps.test4.outputs.duration || 0 }}"
          check_core_test "${{ steps.test5.outputs.status || 'failed' }}" "${{ steps.test5.outputs.duration || 0 }}"

          case "${{ steps.test6.outputs.status || 'failed' }}" in
            passed) PASSED=$((PASSED + 1)) ;;
            skipped) SKIPPED=$((SKIPPED + 1)) ;;
            *) FAILED=$((FAILED + 1)) ;;
          esac
          TOTAL_DURATION=$((TOTAL_DURATION + ${{ steps.test6.outputs.duration || 0 }}))

          echo "passed=${PASSED}" >> "$GITHUB_OUTPUT"
          echo "failed=${FAILED}" >> "$GITHUB_OUTPUT"
          echo "skipped=${SKIPPED}" >> "$GITHUB_OUTPUT"
          echo "core_failed=${CORE_FAILED}" >> "$GITHUB_OUTPUT"
          echo "duration=${TOTAL_DURATION}" >> "$GITHUB_OUTPUT"

          if [ "${FAILED}" -eq 0 ]; then
            echo "overall_status=success" >> "$GITHUB_OUTPUT"
            echo "badge_status=passing" >> "$GITHUB_OUTPUT"
          else
            echo "overall_status=failure" >> "$GITHUB_OUTPUT"
            echo "badge_status=failing" >> "$GITHUB_OUTPUT"
          fi

          if [ "${FAILED}" -ne 0 ]; then
            exit 1
          fi

      - name: Create test summary
        if: always()
        run: |
          {
            echo "## Submarine Test Results"
            echo ""
            echo "- **Version:** ${{ steps.version.outputs.version }}"
            echo "- **Status:** ${{ steps.summary.outputs.overall_status }}"
            echo "- **Tests Passed:** ${{ steps.summary.outputs.passed }}"
            echo "- **Tests Failed:** ${{ steps.summary.outputs.failed }}"
            echo "- **Tests Skipped:** ${{ steps.summary.outputs.skipped }}"
            echo "- **Duration:** ${{ steps.summary.outputs.duration || 0 }}s"
            echo "- **Runner:** ubuntu-24.04 (arm64)"
            echo ""
            echo "### Test Details"
            echo "1. Check build artifacts exist: ${{ steps.test1.outputs.status || 'skipped' }}"
            echo "2. Check version provenance: ${{ steps.test2.outputs.status || 'skipped' }}"
            echo "3. Check build usage output: ${{ steps.test3.outputs.status || 'skipped' }}"
            echo "4. Architecture Verification: ${{ steps.test4.outputs.status || 'skipped' }}"
            echo "5. Functional image validation: ${{ steps.test5.outputs.status || 'skipped' }}"
            echo "6. Regression Validation: ${{ steps.test6.outputs.status || 'skipped' }}"
            echo ""
            echo "### Regression Validation (Next Version Install)"
            echo "- **Current version tested in Tests 1-5:** ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}"
            echo "- **Next version targeted for install validation:** ${{ steps.test6.outputs.latest_version || 'unknown' }}"
            echo "- **Next version installed on Arm64:** ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}"
            echo "- **Regression install result:** ${{ steps.test6.outputs.regression_result || 'Regression result unavailable.' }}"
            echo "- **Details:** ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}"
          } >> "$GITHUB_STEP_SUMMARY"

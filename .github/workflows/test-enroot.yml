name: Test NVIDIA Enroot on Arm64

permissions:
  contents: read

on:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-enroot.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-enroot.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-enroot.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-enroot.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-enroot.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-enroot.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-enroot.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-enroot.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-enroot.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-enroot.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-enroot.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-enroot.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-enroot.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-enroot.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-enroot.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-enroot.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-enroot.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-enroot.outputs.regression_next_installed_version }}
      regression_policy:
        description: Regression applicability policy classification
        value: ${{ jobs.test-enroot.outputs.regression_policy }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-enroot.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-enroot.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-enroot.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-enroot.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-enroot.outputs.timestamp }}

jobs:
  test-enroot:
    runs-on: ubuntu-24.04-arm
    env:
      BASELINE_VERSION: "2.1.0"
      CANDIDATE_VERSION: "4.2.1"
      # Publisher digest for NVIDIA release asset 442243974 (enroot_4.2.1-1_arm64.deb).
      CANDIDATE_SHA256: "267018b335815a6b32a562915de1f3fad579f7c9d6748e98c62e7369b40be421"
      PACKAGE_SLUG: "enroot"
      LANE_KIND: "gpu/specialized/manual-review"
      DOWNLOAD_URL: "https://github.com/NVIDIA/enroot/releases"
      HOMEPAGE_URL: "https://github.com/NVIDIA/enroot"
      OFFICIAL_DOCS: "https://github.com/NVIDIA/enroot#documentation"
      GITHUB_REPO: "NVIDIA/enroot"
      PACKAGE_PAGE: "content/linux/opensource_packages/enroot.md"
      SOURCE_GLOBS: "src|conf|doc|Makefile.in|enroot.in"
      EVIDENCE_RE: "ENROOT|container|sandbox|HPC"
      TEST5_MODE: "source"
      PYTHON_TARGETS: ""
      ENROOT_SMOKE: |
        set -euo pipefail
        [ "$(uname -m)" = aarch64 ]
        cd "$SOURCE_DIR"
        [ "$(git describe --tags --exact-match HEAD)" = "v$EXPECTED_VERSION" ]
        # The old Freedesktop transport is unavailable. Keep the original gitlink.
        if git config -f .gitmodules --get submodule.deps/libbsd.url >/dev/null; then
          git config submodule.deps/libbsd.url https://git.hadrons.org/git/libbsd.git
        fi
        if git config -f .gitmodules --get submodule.deps/musl.url >/dev/null; then
          git config submodule.deps/musl.url https://git.musl-libc.org/git/musl
        fi
        timeout 240s git submodule update --init
        git submodule foreach 'test "$(git rev-parse HEAD)" = "$sha1"'
        git submodule status
        PREFIX="$PWD/_install"
        export XDG_RUNTIME_DIR="$PREFIX/runtime"
        export ENROOT_DATA_PATH="$PREFIX/data"
        mkdir -p "$XDG_RUNTIME_DIR" "$ENROOT_DATA_PATH"
        timeout 600s make -j2 DESTDIR="$PREFIX" prefix=/usr install
        ENROOT_BIN="$PREFIX/usr/bin/enroot"
        file "$PREFIX/usr/bin/enroot-mount" | tee "$PREFIX/elf.log"
        grep -Eiq 'aarch64|ARM aarch64|ARM64' "$PREFIX/elf.log"
        REPORTED=$(timeout 30s bash "$ENROOT_BIN" version)
        printf '%s\n' "$REPORTED" | tee "$PREFIX/version.log"
        [ "$REPORTED" = "$EXPECTED_VERSION" ]
        timeout 30s bash "$ENROOT_BIN" list > "$PREFIX/list.log"
        [ ! -s "$PREFIX/list.log" ]
        printf 'source=%s executable=%s version=%s list=empty\n' "$(git rev-parse HEAD)" "$ENROOT_BIN" "$EXPECTED_VERSION"

    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'NVIDIA Enroot'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      regression_policy: "applicable"
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=enroot" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/linux/opensource_packages/enroot" >> "$GITHUB_OUTPUT"

      - name: Bootstrap baseline dependencies
        uses: ./.github/actions/apt-bootstrap
        with:
          packages: "git curl jq tar unzip file ca-certificates build-essential pkg-config libbsd-dev squashfs-tools zstd autoconf automake libtool python3-yaml"
          quiet: "true"

      - name: Fetch exact baseline source
        id: install
        run: |
          set -euo pipefail
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then echo "install_status=failed" >> "$GITHUB_OUTPUT"; fi' EXIT
          timeout 240s git clone --depth 1 --branch "v$BASELINE_VERSION" "https://github.com/$GITHUB_REPO.git" baseline-src
          [ "$(git -C baseline-src describe --tags --exact-match HEAD)" = "v$BASELINE_VERSION" ]
          SOURCE_COMMIT=$(git -C baseline-src rev-parse HEAD)
          echo "resolved_tag=v$BASELINE_VERSION" >> "$GITHUB_OUTPUT"
          echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "install_mode=github_source" >> "$GITHUB_OUTPUT"
          echo "install_status=success" >> "$GITHUB_OUTPUT"

      - name: Get baseline version
        id: version
        run: |
          echo "version=$BASELINE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Selected baseline source version: $BASELINE_VERSION (runtime checked in Test 5)"

      - name: Test 1 - Baseline package evidence
        id: test1
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"
          START_TIME=$(date +%s)
          trap 'rc=$?; echo "duration=$(($(date +%s) - ${START_TIME}))" >> "$GITHUB_OUTPUT"; if [ "$rc" -ne 0 ]; then echo "status=failed" >> "$GITHUB_OUTPUT"; fi' EXIT
          MODE="${{ steps.install.outputs.install_mode || '' }}"
          [ "$MODE" = github_source ]
          if [ ! -f "$PACKAGE_PAGE" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "${{ steps.install.outputs.install_status || 'failed' }}" != "success" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$MODE" = "github_source" ]; then
            FOUND=0
            IFS='|' read -r -a PATTERNS <<< "$SOURCE_GLOBS"
            for PATTERN in "${PATTERNS[@]}"; do
              [ -z "$PATTERN" ] && continue
              if compgen -G "baseline-src/$PATTERN" > /dev/null; then
                FOUND=1
                break
              fi
            done
            if [ "$FOUND" -ne 1 ]; then
              echo "status=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi
          echo "status=passed" >> "$GITHUB_OUTPUT"

      - name: Test 2 - Baseline version and release alignment
        id: test2
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"
          START_TIME=$(date +%s)
          trap 'rc=$?; echo "duration=$(($(date +%s) - ${START_TIME}))" >> "$GITHUB_OUTPUT"; if [ "$rc" -ne 0 ]; then echo "status=failed" >> "$GITHUB_OUTPUT"; fi' EXIT
          MODE="${{ steps.install.outputs.install_mode || '' }}"
          [ "$MODE" = github_source ]
          python3 - "$PACKAGE_PAGE" "$BASELINE_VERSION" <<'PY'
          import sys
          import yaml

          with open(sys.argv[1]) as stream:
              page = next(yaml.safe_load_all(stream))
          assert str(page["supported_minimum_version"]["version_number"]) == sys.argv[2]
          PY
          if [ "$MODE" = "github_source" ]; then
            RESOLVED="${{ steps.install.outputs.resolved_tag || '' }}"
            if [ -z "$RESOLVED" ]; then
              echo "status=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            if [ "$RESOLVED" != "v$BASELINE_VERSION" ]; then
              echo "status=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi
          [ "$(git -C baseline-src describe --tags --exact-match HEAD)" = "v$BASELINE_VERSION" ]
          echo "status=passed" >> "$GITHUB_OUTPUT"

      - name: Test 3 - Package-specific source or docs evidence
        id: test3
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"
          START_TIME=$(date +%s)
          trap 'rc=$?; echo "duration=$(($(date +%s) - ${START_TIME}))" >> "$GITHUB_OUTPUT"; if [ "$rc" -ne 0 ]; then echo "status=failed" >> "$GITHUB_OUTPUT"; fi' EXIT
          MODE="${{ steps.install.outputs.install_mode || '' }}"
          [ "$MODE" = github_source ]
          if [ "$MODE" = "github_source" ]; then
            if ! grep -R -I -Eiq "$EVIDENCE_RE" baseline-src 2>/dev/null; then
              echo "status=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            DOC_FOUND=0
            for PATTERN in README* docs examples; do
              if compgen -G "baseline-src/$PATTERN" > /dev/null; then
                DOC_FOUND=1
                break
              fi
            done
            if [ "$DOC_FOUND" -ne 1 ]; then
              echo "status=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi
          echo "status=passed" >> "$GITHUB_OUTPUT"

      - name: Test 4 - Arm64 support gate
        id: test4
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"
          START_TIME=$(date +%s)
          trap 'rc=$?; echo "duration=$(($(date +%s) - ${START_TIME}))" >> "$GITHUB_OUTPUT"; if [ "$rc" -ne 0 ]; then echo "status=failed" >> "$GITHUB_OUTPUT"; fi' EXIT
          if [ "$(uname -m)" != "aarch64" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if ! grep -q '^works_on_arm: true' "$PACKAGE_PAGE"; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "status=passed" >> "$GITHUB_OUTPUT"

      - name: Test 5 - Bounded package-specific smoke
        id: test5
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"
          START_TIME=$(date +%s)
          trap 'rc=$?; echo "duration=$(($(date +%s) - ${START_TIME}))" >> "$GITHUB_OUTPUT"; if [ "$rc" -ne 0 ]; then echo "status=failed" >> "$GITHUB_OUTPUT"; fi' EXIT
          MODE="${{ steps.install.outputs.install_mode || '' }}"
          if [ "$MODE" != "github_source" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "note=Enroot runtime smoke requires the checked-out source tree." >> "$GITHUB_OUTPUT"
            exit 1
          fi

          SOURCE_DIR=baseline-src EXPECTED_VERSION="$BASELINE_VERSION" bash -euo pipefail -c "$ENROOT_SMOKE"
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "note=Built the exact Enroot baseline and pinned dependencies, verified an AArch64 helper and exact CLI version, and listed an empty isolated data directory. No container import/start or GPU hooks were tested." >> "$GITHUB_OUTPUT"

      - name: Test 6 - Regression Validation
        id: test6
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"
          echo "decision=next_install_failed" >> "$GITHUB_OUTPUT"
          START_TIME=$(date +%s)
          WORK_DIR=""
          STATUS=failed
          DECISION=next_install_failed
          NEXT_INSTALLED_VERSION=not_installed
          finish() {
            rc=$?
            trap - EXIT
            if [ -n "$WORK_DIR" ]; then rm -rf "$WORK_DIR" || rc=$?; fi
            if [ "$rc" -ne 0 ]; then
              if [ "$DECISION" = baseline_failed ]; then
                STATUS=skipped
              else
                STATUS=failed
                if [ "$DECISION" = limited_cpu_smoke_validated ]; then
                  DECISION=limited_cpu_smoke_failed
                fi
              fi
            fi
            echo "current_version=$BASELINE_VERSION" >> "$GITHUB_OUTPUT"
            echo "latest_version=$CANDIDATE_VERSION" >> "$GITHUB_OUTPUT"
            echo "next_installed_version=$NEXT_INSTALLED_VERSION" >> "$GITHUB_OUTPUT"
            echo "status=$STATUS" >> "$GITHUB_OUTPUT"
            echo "decision=$DECISION" >> "$GITHUB_OUTPUT"
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            echo "regression_result=Official Arm64 Debian package CPU smoke: $STATUS" >> "$GITHUB_OUTPUT"
            echo "comparison=Baseline $BASELINE_VERSION uses a source build; candidate $CANDIDATE_VERSION uses NVIDIA's digest-verified Debian package. Checks cover an AArch64 helper, exact installed CLI version, and an empty isolated directory listing. Candidate source compilation, container import/start, and GPU hooks are not tested." >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish EXIT
          for RESULT in \
            "${{ steps.test1.outputs.status || 'failed' }}:${{ steps.test1.outcome || 'failure' }}" \
            "${{ steps.test2.outputs.status || 'failed' }}:${{ steps.test2.outcome || 'failure' }}" \
            "${{ steps.test3.outputs.status || 'failed' }}:${{ steps.test3.outcome || 'failure' }}" \
            "${{ steps.test4.outputs.status || 'failed' }}:${{ steps.test4.outcome || 'failure' }}" \
            "${{ steps.test5.outputs.status || 'failed' }}:${{ steps.test5.outcome || 'failure' }}"; do
            if [ "$RESULT" != passed:success ]; then
              STATUS=skipped
              DECISION=baseline_failed
              echo "status=skipped" >> "$GITHUB_OUTPUT"
              echo "decision=baseline_failed" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          [ "$(uname -m)" = aarch64 ]
          WORK_DIR=$(mktemp -d "$RUNNER_TEMP/enroot-candidate.XXXXXX")
          ASSET="enroot_${CANDIDATE_VERSION}-1_arm64.deb"
          URL="https://github.com/NVIDIA/enroot/releases/download/v$CANDIDATE_VERSION/$ASSET"
          # v4.2.1's public source declares 4.2.0; validate the official package without rewriting it.
          curl --fail --show-error --silent --location --connect-timeout 20 --max-time 120 \
            "https://api.github.com/repos/NVIDIA/enroot/releases/tags/v$CANDIDATE_VERSION" -o "$WORK_DIR/release.json"
          jq -e --arg tag "v$CANDIDATE_VERSION" --arg asset "$ASSET" --arg url "$URL" --arg digest "sha256:$CANDIDATE_SHA256" \
            '.tag_name == $tag and .draft == false and .prerelease == false and
             ([.assets[] | select(.name == $asset and .browser_download_url == $url and .digest == $digest)] | length == 1)' \
            "$WORK_DIR/release.json"
          curl --fail --show-error --silent --location --connect-timeout 20 --max-time 120 "$URL" -o "$WORK_DIR/candidate.deb"
          printf '%s  %s\n' "$CANDIDATE_SHA256" "$WORK_DIR/candidate.deb" | sha256sum --check --strict
          [ "$(dpkg-deb -f "$WORK_DIR/candidate.deb" Package)" = enroot ]
          [ "$(dpkg-deb -f "$WORK_DIR/candidate.deb" Version)" = "$CANDIDATE_VERSION-1" ]
          [ "$(dpkg-deb -f "$WORK_DIR/candidate.deb" Architecture)" = arm64 ]
          timeout 240s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "$WORK_DIR/candidate.deb"
          [ "$(dpkg-query -W -f='${Status} ${Version} ${Architecture}' enroot)" = "install ok installed $CANDIDATE_VERSION-1 arm64" ]
          NEXT_INSTALLED_VERSION=unknown
          DECISION=limited_cpu_smoke_failed
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "decision=limited_cpu_smoke_failed" >> "$GITHUB_OUTPUT"
          file /usr/bin/enroot-mount | tee "$WORK_DIR/elf.log"
          grep -Eiq 'aarch64|ARM aarch64|ARM64' "$WORK_DIR/elf.log"
          export XDG_RUNTIME_DIR="$WORK_DIR/runtime"
          export ENROOT_DATA_PATH="$WORK_DIR/data"
          mkdir -p "$XDG_RUNTIME_DIR" "$ENROOT_DATA_PATH"
          REPORTED=$(timeout 30s bash /usr/bin/enroot version)
          NEXT_INSTALLED_VERSION="${REPORTED:-unknown}"
          printf 'installed_cli_version=%s\n' "$REPORTED"
          [ "$REPORTED" = "$CANDIDATE_VERSION" ]
          timeout 30s bash /usr/bin/enroot list > "$WORK_DIR/list.log"
          [ ! -s "$WORK_DIR/list.log" ]
          printf 'asset=%s sha256=%s installed=/usr/bin/enroot version=%s list=empty\n' "$URL" "$CANDIDATE_SHA256" "$REPORTED"
          STATUS=passed
          DECISION=limited_cpu_smoke_validated
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "decision=limited_cpu_smoke_validated" >> "$GITHUB_OUTPUT"
      - name: Calculate test summary
        id: summary
        if: always()
        run: |
          set -euo pipefail
          PASSED=0
          FAILED=0
          SKIPPED=0
          CORE_FAILED=0
          DURATION=0
          check_test() {
            if [ "$1" = passed ] && [ "$2" = success ]; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
              if [ "$4" = core ]; then
                CORE_FAILED=$((CORE_FAILED + 1))
              fi
            fi
            DURATION=$((DURATION + $3))
          }
          check_test "${{ steps.test1.outputs.status || 'failed' }}" "${{ steps.test1.outcome }}" "${{ steps.test1.outputs.duration || '0' }}" core
          check_test "${{ steps.test2.outputs.status || 'failed' }}" "${{ steps.test2.outcome }}" "${{ steps.test2.outputs.duration || '0' }}" core
          check_test "${{ steps.test3.outputs.status || 'failed' }}" "${{ steps.test3.outcome }}" "${{ steps.test3.outputs.duration || '0' }}" core
          check_test "${{ steps.test4.outputs.status || 'failed' }}" "${{ steps.test4.outcome }}" "${{ steps.test4.outputs.duration || '0' }}" core
          check_test "${{ steps.test5.outputs.status || 'failed' }}" "${{ steps.test5.outcome }}" "${{ steps.test5.outputs.duration || '0' }}" core
          # Only a failed baseline can prevent this pinned candidate from running.
          if [ "$CORE_FAILED" -gt 0 ] && \
             [ "${{ steps.test6.outputs.decision || '' }}" = baseline_failed ] && \
             [ "${{ steps.test6.outputs.status || 'failed' }}" = skipped ] && \
             [ "${{ steps.test6.outcome }}" = success ]; then
            SKIPPED=1
            DURATION=$((DURATION + ${{ steps.test6.outputs.duration || '0' }}))
          else
            check_test "${{ steps.test6.outputs.status || 'failed' }}" "${{ steps.test6.outcome }}" "${{ steps.test6.outputs.duration || '0' }}" candidate
          fi
          OVERALL_STATUS=failure
          BADGE_STATUS=failing
          if [ "$FAILED" -eq 0 ]; then
            OVERALL_STATUS=success
            BADGE_STATUS=passing
          fi
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"
          echo "core_failed=$CORE_FAILED" >> "$GITHUB_OUTPUT"
          echo "overall_status=$OVERALL_STATUS" >> "$GITHUB_OUTPUT"
          echo "badge_status=$BADGE_STATUS" >> "$GITHUB_OUTPUT"
          test "$FAILED" -eq 0

name: Test All Packages (Batch 10) on Arm64
run-name: Arm64 Batch 10 [${{ inputs.orchestration_id || format('manual-{0}-{1}', github.run_id, github.run_attempt) }}] [nonce:${{ inputs.dispatch_nonce || 'manual-only' }}]

on:
  workflow_dispatch:
    inputs:
      orchestration_id:
        description: Exact orchestrator identity; blank uses a safe manual fallback
        required: false
        default: ""
        type: string
      dispatch_nonce:
        description: Secret exact-dispatch nonce; blank is manual-only and not publishable
        required: false
        default: ""
        type: string
      expected_sha:
        description: Exact commit expected by the orchestrator
        required: false
        default: ""
        type: string
      expected_branch:
        description: Exact branch expected by the orchestrator
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      orchestration_id:
        required: true
        type: string
      dispatch_nonce:
        required: true
        type: string
      expected_sha:
        required: true
        type: string
      expected_branch:
        required: true
        type: string

permissions:
  contents: read

jobs:

  test-kubewarden-controller:
    uses: ./.github/workflows/test-kubewarden-controller.yml

  test-firecraker:
    uses: ./.github/workflows/test-firecraker.yml

  test-kangas:
    uses: ./.github/workflows/test-kangas.yml

  test-googletest:
    uses: ./.github/workflows/test-googletest.yml

  test-harness:
    uses: ./.github/workflows/test-harness.yml

  test-dragonflydb:
    uses: ./.github/workflows/test-dragonflydb.yml

  test-indigo-epam:
    uses: ./.github/workflows/test-Indigo-EPAM.yml

  test-django:
    uses: ./.github/workflows/test-django.yml

  test-shiny:
    uses: ./.github/workflows/test-shiny.yml

  test-gzip:
    uses: ./.github/workflows/test-gzip.yml

  test-tej_api:
    uses: ./.github/workflows/test-tej_api.yml

  test-metricbeat:
    uses: ./.github/workflows/test-metricbeat.yml

  test-opentelemetry-python:
    uses: ./.github/workflows/test-opentelemetry-python.yml

  test-supervisor:
    uses: ./.github/workflows/test-supervisor.yml

  test-macs2:
    uses: ./.github/workflows/test-macs2.yml

  test-clearml-open-source:
    uses: ./.github/workflows/test-clearml-open-source.yml

  test-xalan:
    uses: ./.github/workflows/test-xalan.yml

  test-epinio:
    uses: ./.github/workflows/test-epinio.yml

  test-mattermost:
    uses: ./.github/workflows/test-mattermost.yml

  test-fmt:
    uses: ./.github/workflows/test-fmt.yml

  test-openkruise:
    uses: ./.github/workflows/test-openkruise.yml

  test-spdk:
    uses: ./.github/workflows/test-spdk.yml

  test-uyuni:
    uses: ./.github/workflows/test-uyuni.yml

  test-sysbench:
    uses: ./.github/workflows/test-sysbench.yml

  test-leveldb:
    uses: ./.github/workflows/test-leveldb.yml

  test-cloudflare:
    uses: ./.github/workflows/test-cloudflare.yml

  test-plink:
    uses: ./.github/workflows/test-plink.yml

  test-valkey:
    uses: ./.github/workflows/test-valkey.yml

  test-telegraf:
    uses: ./.github/workflows/test-telegraf.yml

  test-python_swat:
    uses: ./.github/workflows/test-python_swat.yml

  test-checkov:
    uses: ./.github/workflows/test-checkov.yml

  test-raxml:
    uses: ./.github/workflows/test-raxml.yml

  test-openembedded:
    uses: ./.github/workflows/test-openembedded.yml

  test-flatbuffers:
    uses: ./.github/workflows/test-flatBuffers.yml

  test-orionsdk-python:
    uses: ./.github/workflows/test-orionsdk-python.yml

  test-rust:
    uses: ./.github/workflows/test-rust.yml

  test-buildkite-cli:
    uses: ./.github/workflows/test-buildkite-cli.yml

  test-dynatrace:
    uses: ./.github/workflows/test-dynatrace.yml

  test-lxd:
    uses: ./.github/workflows/test-lxd.yml

  test-bk_cmdb:
    uses: ./.github/workflows/test-bk_cmdb.yml

  test-spring_cloud_config:
    uses: ./.github/workflows/test-spring_cloud_config.yml

  test-moosefs:
    uses: ./.github/workflows/test-moosefs.yml

  test-cutlass:
    uses: ./.github/workflows/test-cutlass.yml

  test-cuvs:
    uses: ./.github/workflows/test-cuvs.yml

  test-cv-cuda:
    uses: ./.github/workflows/test-cv-cuda.yml

  summary:
    permissions:
      actions: read
      contents: read
    needs:
      [
        test-kubewarden-controller,
        test-firecraker,
        test-kangas,
        test-googletest,
        test-harness,
        test-dragonflydb,
        test-indigo-epam,
        test-django,
        test-shiny,
        test-gzip,
        test-tej_api,
        test-metricbeat,
        test-opentelemetry-python,
        test-supervisor,
        test-macs2,
        test-clearml-open-source,
        test-xalan,
        test-epinio,
        test-mattermost,
        test-fmt,
        test-openkruise,
        test-spdk,
        test-uyuni,
        test-sysbench,
        test-leveldb,
        test-cloudflare,
        test-plink,
        test-valkey,
        test-telegraf,
        test-python_swat,
        test-checkov,
        test-raxml,
        test-openembedded,
        test-flatbuffers,
        test-orionsdk-python,
        test-rust,
        test-buildkite-cli,
        test-dynatrace,
        test-lxd,
        test-bk_cmdb,
        test-spring_cloud_config,
        test-moosefs,
        test-cutlass,
        test-cuvs,
        test-cv-cuda
      ]
    runs-on: ubuntu-24.04-arm
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # original: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Collect batch results
        id: collect
        uses: ./.github/actions/collect-batch-results
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        with:
          batch_number: "10"
          batch_title: "Batch 10"

      - name: Attest complete batch results
        id: attest
        if: steps.collect.outcome == 'success'
        env:
          ARTIFACT_NAME: batch10-test-results
          BATCH_NUMBER: "10"
          COLLECTOR_JSON_COUNT: ${{ steps.collect.outputs.json_count }}
          CURRENT_BRANCH: ${{ github.ref_name }}
          DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
          EXPECTED_BRANCH: ${{ inputs.expected_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          NEEDS_JSON: ${{ toJson(needs) }}
          ORCHESTRATION_ID: ${{ inputs.orchestration_id }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/batch_artifact_attestation.py create \
            --results-root test-results \
            --workflow-file ".github/workflows/test-all-packages-batch10.yml" \
            --batch "$BATCH_NUMBER" \
            --repository "$REPOSITORY" \
            --expected-branch "$EXPECTED_BRANCH" \
            --current-branch "$CURRENT_BRANCH" \
            --expected-sha "$EXPECTED_SHA" \
            --workflow-sha "$WORKFLOW_SHA" \
            --orchestration-id "$ORCHESTRATION_ID" \
            --dispatch-nonce "$DISPATCH_NONCE" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --artifact-name "$ARTIFACT_NAME" \
            --collector-json-count "$COLLECTOR_JSON_COUNT" \
            --needs-environment-variable NEEDS_JSON

      - name: Upload batch test results
        if: steps.collect.outcome == 'success' && steps.attest.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # original: actions/upload-artifact@v4.6.2
        with:
          name: batch10-test-results
          path: test-results
          retention-days: 90

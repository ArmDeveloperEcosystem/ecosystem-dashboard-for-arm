name: Test Slurm on Arm64

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-slurm.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-slurm.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-slurm.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-slurm.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-slurm.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-slurm.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-slurm.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-slurm.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-slurm.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-slurm.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-slurm.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-slurm.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-slurm.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-slurm.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-slurm.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-slurm.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-slurm.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-slurm.outputs.regression_next_installed_version }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-slurm.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-slurm.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-slurm.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-slurm.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-slurm.outputs.timestamp }}
jobs:
  test-slurm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      SLURM_VERSION: "25.05.7"
      SLURM_BASE_COMMIT: "8548115d761223c8290e66b4fdddb198b289a61c"
      SLURM_BASE_SHA256: "747e1220ea9eae33e5472b4e582e4da8befb3b1edd49efe83a91c0923419bf7e"
      SLURM_NEXT_VERSION: "25.11.4"
      SLURM_NEXT_COMMIT: "bd3498744a425719542759c2618ba49e216e74b0"
      SLURM_NEXT_SHA256: "237f515adcb37b99ff6cb3e1fa81691a5f7188e94c3b6b495858b4eaecf6531d"
      SLURM_WORKDIR: "/tmp/slurm-smoke"

    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'Slurm'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # original: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=slurm" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/opensource_packages/slurm" >> "$GITHUB_OUTPUT"
      - name: Install Slurm baseline from official source
        id: install
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libjson-c-dev \
            libmunge-dev \
            libpam0g-dev \
            libssl-dev \
            libyaml-dev \
            pkg-config

          rm -rf "${SLURM_WORKDIR}"
          mkdir -p "${SLURM_WORKDIR}"
          BASE_DIR="${SLURM_WORKDIR}/slurm-${SLURM_VERSION}"
          PRIMARY_ARCHIVE="${SLURM_WORKDIR}/slurm-${SLURM_VERSION}.tar.bz2"
          FALLBACK_ARCHIVE="${SLURM_WORKDIR}/slurm-${SLURM_BASE_COMMIT}.tar.gz"
          if curl --fail --location --silent --show-error --ipv4 \
              --retry 2 --retry-all-errors --retry-delay 3 \
              --retry-max-time 60 \
              --connect-timeout 15 --max-time 300 \
              "https://download.schedmd.com/slurm/slurm-${SLURM_VERSION}.tar.bz2" \
              --output "${PRIMARY_ARCHIVE}"; then
            printf '%s  %s\n' "${SLURM_BASE_SHA256}" "${PRIMARY_ARCHIVE}" | sha256sum --check --strict -
            tar -xjf "${PRIMARY_ARCHIVE}" -C "${SLURM_WORKDIR}"
            echo "Installed Slurm ${SLURM_VERSION} from the official SchedMD release archive."
          else
            echo "::warning::SchedMD release archive unavailable; using the pinned official SchedMD GitHub commit ${SLURM_BASE_COMMIT}."
            rm -rf "${BASE_DIR}" "${PRIMARY_ARCHIVE}"
            mkdir -p "${BASE_DIR}"
            curl --fail --location --silent --show-error --ipv4 \
              --retry 5 --retry-all-errors --retry-delay 3 \
              --retry-max-time 180 \
              --connect-timeout 20 --max-time 600 \
              "https://github.com/SchedMD/slurm/archive/${SLURM_BASE_COMMIT}.tar.gz" \
              --output "${FALLBACK_ARCHIVE}"
            tar -xzf "${FALLBACK_ARCHIVE}" --strip-components=1 -C "${BASE_DIR}"
          fi

          test -x "${BASE_DIR}/configure"
          META_VERSION="$(awk '$1 == "Version:" {print $2; exit}' "${BASE_DIR}/META")"
          test "${META_VERSION}" = "${SLURM_VERSION}"
          cd "${BASE_DIR}"
          ./configure \
            --prefix="${SLURM_WORKDIR}/install-${SLURM_VERSION}" \
            --sysconfdir="${SLURM_WORKDIR}/install-${SLURM_VERSION}/etc" \
            >/tmp/slurm-configure-baseline.log 2>&1
          make -j2 >/tmp/slurm-make-baseline.log 2>&1
          make -j2 install >/tmp/slurm-install-baseline.log 2>&1

          BASE_PREFIX="${SLURM_WORKDIR}/install-${SLURM_VERSION}"
          BASE_BIN="${BASE_PREFIX}/bin/srun"
          BASE_RUNNER="${BASE_BIN}"
          BASE_CONF="${BASE_PREFIX}/etc/slurm.conf"
          mkdir -p "${BASE_PREFIX}/etc" "${SLURM_WORKDIR}/state" "${SLURM_WORKDIR}/spool"
          printf '%s\n' \
            'ClusterName=arm-smoke' \
            'SlurmctldHost=localhost' \
            'AuthType=auth/none' \
            'CredType=cred/none' \
            'SlurmctldPort=6817' \
            'SlurmdPort=6818' \
            "SlurmUser=$(id -un)" \
            "StateSaveLocation=${SLURM_WORKDIR}/state" \
            "SlurmdSpoolDir=${SLURM_WORKDIR}/spool" \
            'MpiDefault=none' \
            'ProctrackType=proctrack/linuxproc' \
            'SchedulerType=sched/builtin' \
            'SelectType=select/linear' \
            'SwitchType=switch/none' \
            'TaskPlugin=task/none' \
            'JobAcctGatherType=jobacct_gather/none' \
            'NodeName=localhost NodeAddr=127.0.0.1 CPUs=1 State=UNKNOWN' \
            'PartitionName=debug Nodes=localhost Default=YES MaxTime=INFINITE State=UP' \
            >"${BASE_CONF}"
          BASE_LIB="$(find "${BASE_PREFIX}" -type f \( -name 'libslurmfull.so' -o -name 'libslurmfull.so.*' \) -print -quit)"
          test -x "${BASE_BIN}"
          test -x "${BASE_RUNNER}"
          test -s "${BASE_CONF}"
          test -n "${BASE_LIB}"
          BASE_LIB_DIR="$(dirname "${BASE_LIB}")"
          test -n "${BASE_LIB_DIR}"
          if ! ldd "${BASE_BIN}" | tee /tmp/slurm-ldd-baseline.log; then
            echo "Unable to inspect installed Slurm baseline shared-library dependencies." >&2
            exit 1
          fi
          if grep -q 'not found' /tmp/slurm-ldd-baseline.log; then
            echo "Installed Slurm baseline has unresolved shared-library dependencies." >&2
            exit 1
          fi

          echo "base_dir=${BASE_DIR}" >> "$GITHUB_OUTPUT"
          echo "base_bin=${BASE_BIN}" >> "$GITHUB_OUTPUT"
          echo "base_runner=${BASE_RUNNER}" >> "$GITHUB_OUTPUT"
          echo "base_conf=${BASE_CONF}" >> "$GITHUB_OUTPUT"
          echo "base_lib_dir=${BASE_LIB_DIR}" >> "$GITHUB_OUTPUT"
          echo "install_status=success" >> "$GITHUB_OUTPUT"

      - name: Get Slurm versions
        id: version
        run: |
          set -euo pipefail
          BASE_RUNNER="${{ steps.install.outputs.base_runner }}"
          BASE_CONF="${{ steps.install.outputs.base_conf }}"
          if ! VERSION_OUTPUT="$(SLURM_CONF="${BASE_CONF}" "${BASE_RUNNER}" --version 2>&1)"; then
            printf '%s\n' "${VERSION_OUTPUT}" >&2
            echo "Installed Slurm baseline failed its version command." >&2
            exit 1
          fi
          printf '%s\n' "${VERSION_OUTPUT}"
          if [ "${VERSION_OUTPUT}" != "slurm ${SLURM_VERSION}" ]; then
            echo "Installed Slurm baseline reported an unexpected version string." >&2
            exit 1
          fi
          VERSION="${SLURM_VERSION}"
          LATEST="${SLURM_NEXT_VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "Detected Slurm version: ${VERSION}"
          echo "Detected latest stable release: ${LATEST}"

      - name: Test 1 - Check srun binary exists
        id: test1
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          BASE_BIN="${{ steps.install.outputs.base_bin }}"

          if [ -x "${BASE_BIN}" ]; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            END_TIME=$(date +%s)
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 2 - Check exact version output
        id: test2
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          VERSION="${{ steps.version.outputs.version }}"

          if [ "${VERSION}" = "${SLURM_VERSION}" ]; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "Resolved version: ${VERSION}"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            END_TIME=$(date +%s)
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 3 - Check help output
        id: test3
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          BASE_RUNNER="${{ steps.install.outputs.base_runner }}"
          BASE_CONF="${{ steps.install.outputs.base_conf }}"
          SLURM_CONF="${BASE_CONF}" "${BASE_RUNNER}" --help >/tmp/slurm-help.txt 2>&1

          if grep -Eqi "usage: srun|srun \[OPTIONS\]|usage|options" /tmp/slurm-help.txt; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            cat /tmp/slurm-help.txt || true
            echo "status=failed" >> "$GITHUB_OUTPUT"
            END_TIME=$(date +%s)
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 4 - Architecture verification
        id: test4
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          BASE_BIN="${{ steps.install.outputs.base_bin }}"

          if [ "$(uname -m)" = "aarch64" ] && file "${BASE_BIN}" | grep -qi "ARM aarch64"; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            uname -m
            file "${BASE_BIN}" || true
            echo "status=failed" >> "$GITHUB_OUTPUT"
            END_TIME=$(date +%s)
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 5 - Functional validation
        id: test5
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          BASE_RUNNER="${{ steps.install.outputs.base_runner }}"
          BASE_CONF="${{ steps.install.outputs.base_conf }}"

          set +e
          SLURM_CONF="${BASE_CONF}" timeout 10s "${BASE_RUNNER}" -N1 -n1 /bin/true >/tmp/slurm-functional.txt 2>&1
          RUN_RC=$?
          set -e
          if [ "${RUN_RC}" -ne 0 ] \
             && [ "${RUN_RC}" -ne 124 ] \
             && grep -Fqi "Unable to contact slurm controller (connect failure)" /tmp/slurm-functional.txt \
             && ! grep -Eqi "Munge|authentication error|Unable to establish configuration source|resolve_ctls_from_dns_srv|fetch_config|Could not establish a configuration source" /tmp/slurm-functional.txt; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            cat /tmp/slurm-functional.txt || true
            echo "status=failed" >> "$GITHUB_OUTPUT"
            END_TIME=$(date +%s)
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 6 - Regression Validation
        if: always()
        id: test6
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          CURRENT="${{ steps.version.outputs.version || env.SLURM_VERSION }}"
          LATEST="${{ steps.version.outputs.latest || env.SLURM_NEXT_VERSION }}"
          REGRESSION_WORKDIR="/tmp/slurm-regression"

          echo "current_version=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "latest_version=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "=== Regression Validation (Next Version Install) ==="
          echo "Current version tested in Tests 1-5: ${CURRENT}"
          echo "Next version targeted for install validation: ${LATEST}"

          if [ "${{ steps.test1.outputs.status || 'failed' }}" != "passed" ] || \
             [ "${{ steps.test2.outputs.status || 'failed' }}" != "passed" ] || \
             [ "${{ steps.test3.outputs.status || 'failed' }}" != "passed" ] || \
             [ "${{ steps.test4.outputs.status || 'failed' }}" != "passed" ] || \
             [ "${{ steps.test5.outputs.status || 'failed' }}" != "passed" ]; then
            echo "next_installed_version=not_installed" >> "$GITHUB_OUTPUT"
            echo "decision=baseline_failed" >> "$GITHUB_OUTPUT"
            echo "regression_result=Regression validation skipped because one or more baseline tests (1-5) failed." >> "$GITHUB_OUTPUT"
            echo "comparison=Current pinned Slurm version ${CURRENT} did not complete baseline smoke validation in this run, so next-version validation was not attempted." >> "$GITHUB_OUTPUT"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            END_TIME=$(date +%s)
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "${LATEST}" ] || [ "${LATEST}" = "unknown" ]; then
            echo "next_installed_version=not_installed" >> "$GITHUB_OUTPUT"
            echo "decision=next_lookup_failed" >> "$GITHUB_OUTPUT"
            echo "regression_result=Next version lookup failed on Arm64" >> "$GITHUB_OUTPUT"
            echo "comparison=Current pinned Slurm version ${CURRENT} passed smoke tests in this run, but the latest stable source tarball could not be resolved from the official SchedMD archive for Arm64 install validation." >> "$GITHUB_OUTPUT"
            echo "Next version installed on Arm64: not_installed"
            echo "Regression install result: Next version lookup failed on Arm64"
            echo "Details: Current pinned Slurm version ${CURRENT} passed smoke tests in this run, but the latest stable source tarball could not be resolved from the official SchedMD archive for Arm64 install validation."
            echo "status=failed" >> "$GITHUB_OUTPUT"
            END_TIME=$(date +%s)
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          rm -rf "${REGRESSION_WORKDIR}"
          mkdir -p "${REGRESSION_WORKDIR}"
          NEXT_DIR="${REGRESSION_WORKDIR}/slurm-${LATEST}"
          PRIMARY_ARCHIVE="${REGRESSION_WORKDIR}/slurm-${LATEST}.tar.bz2"
          FALLBACK_ARCHIVE="${REGRESSION_WORKDIR}/slurm-${SLURM_NEXT_COMMIT}.tar.gz"
          if curl --fail --location --silent --show-error --ipv4 \
              --retry 2 --retry-all-errors --retry-delay 3 \
              --retry-max-time 60 \
              --connect-timeout 15 --max-time 300 \
              "https://download.schedmd.com/slurm/slurm-${LATEST}.tar.bz2" \
              --output "${PRIMARY_ARCHIVE}"; then
            printf '%s  %s\n' "${SLURM_NEXT_SHA256}" "${PRIMARY_ARCHIVE}" | sha256sum --check --strict -
            tar -xjf "${PRIMARY_ARCHIVE}" -C "${REGRESSION_WORKDIR}"
            echo "Installed Slurm ${LATEST} from the official SchedMD release archive."
          else
            echo "::warning::SchedMD release archive unavailable; using the pinned official SchedMD GitHub commit ${SLURM_NEXT_COMMIT}."
            rm -rf "${NEXT_DIR}" "${PRIMARY_ARCHIVE}"
            mkdir -p "${NEXT_DIR}"
            curl --fail --location --silent --show-error --ipv4 \
              --retry 5 --retry-all-errors --retry-delay 3 \
              --retry-max-time 180 \
              --connect-timeout 20 --max-time 600 \
              "https://github.com/SchedMD/slurm/archive/${SLURM_NEXT_COMMIT}.tar.gz" \
              --output "${FALLBACK_ARCHIVE}"
            tar -xzf "${FALLBACK_ARCHIVE}" --strip-components=1 -C "${NEXT_DIR}"
          fi

          test -x "${NEXT_DIR}/configure"
          META_VERSION="$(awk '$1 == "Version:" {print $2; exit}' "${NEXT_DIR}/META")"
          test "${META_VERSION}" = "${LATEST}"
          cd "${NEXT_DIR}"
          ./configure \
            --prefix="${REGRESSION_WORKDIR}/install-${LATEST}" \
            --sysconfdir="${REGRESSION_WORKDIR}/install-${LATEST}/etc" \
            >/tmp/slurm-configure-next.log 2>&1
          make -j2 >/tmp/slurm-make-next.log 2>&1
          make -j2 install >/tmp/slurm-install-next.log 2>&1

          NEXT_PREFIX="${REGRESSION_WORKDIR}/install-${LATEST}"
          NEXT_BIN="${NEXT_PREFIX}/bin/srun"
          NEXT_RUNNER="${NEXT_BIN}"
          NEXT_CONF="${NEXT_PREFIX}/etc/slurm.conf"
          mkdir -p "${NEXT_PREFIX}/etc" "${REGRESSION_WORKDIR}/state" "${REGRESSION_WORKDIR}/spool"
          printf '%s\n' \
            'ClusterName=arm-smoke' \
            'SlurmctldHost=localhost' \
            'AuthType=auth/none' \
            'CredType=cred/none' \
            'SlurmctldPort=6817' \
            'SlurmdPort=6818' \
            "SlurmUser=$(id -un)" \
            "StateSaveLocation=${REGRESSION_WORKDIR}/state" \
            "SlurmdSpoolDir=${REGRESSION_WORKDIR}/spool" \
            'MpiDefault=none' \
            'ProctrackType=proctrack/linuxproc' \
            'SchedulerType=sched/builtin' \
            'SelectType=select/linear' \
            'SwitchType=switch/none' \
            'TaskPlugin=task/none' \
            'JobAcctGatherType=jobacct_gather/none' \
            'NodeName=localhost NodeAddr=127.0.0.1 CPUs=1 State=UNKNOWN' \
            'PartitionName=debug Nodes=localhost Default=YES MaxTime=INFINITE State=UP' \
            >"${NEXT_CONF}"
          NEXT_LIB="$(find "${NEXT_PREFIX}" -type f \( -name 'libslurmfull.so' -o -name 'libslurmfull.so.*' \) -print -quit)"
          if [ ! -x "${NEXT_BIN}" ] || [ ! -x "${NEXT_RUNNER}" ] || [ ! -s "${NEXT_CONF}" ] || [ -z "${NEXT_LIB}" ] || ! file "${NEXT_BIN}" | grep -qi "ARM aarch64"; then
            echo "next_installed_version=not_installed" >> "$GITHUB_OUTPUT"
            echo "decision=next_install_failed" >> "$GITHUB_OUTPUT"
            echo "regression_result=Next version install failed on Arm64" >> "$GITHUB_OUTPUT"
            echo "comparison=Current pinned Slurm version ${CURRENT} passed smoke tests in this run, but the candidate build from the official SchedMD source tarball did not produce a working Arm64 srun binary." >> "$GITHUB_OUTPUT"
            echo "Next version installed on Arm64: not_installed"
            echo "Regression install result: Next version install failed on Arm64"
            echo "Details: Current pinned Slurm version ${CURRENT} passed smoke tests in this run, but the candidate build from the official SchedMD source tarball did not produce a working Arm64 srun binary."
            echo "status=failed" >> "$GITHUB_OUTPUT"
            END_TIME=$(date +%s)
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if ! ldd "${NEXT_BIN}" | tee /tmp/slurm-ldd-next.log; then
            echo "next_installed_version=not_installed" >> "$GITHUB_OUTPUT"
            echo "decision=next_install_failed" >> "$GITHUB_OUTPUT"
            echo "regression_result=Next version install failed on Arm64" >> "$GITHUB_OUTPUT"
            echo "comparison=Current pinned Slurm version ${CURRENT} passed smoke tests in this run, but the candidate shared-library dependencies could not be inspected." >> "$GITHUB_OUTPUT"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            END_TIME=$(date +%s)
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if grep -q 'not found' /tmp/slurm-ldd-next.log; then
            echo "next_installed_version=not_installed" >> "$GITHUB_OUTPUT"
            echo "decision=next_install_failed" >> "$GITHUB_OUTPUT"
            echo "regression_result=Next version install failed on Arm64" >> "$GITHUB_OUTPUT"
            echo "comparison=Current pinned Slurm version ${CURRENT} passed smoke tests in this run, but the installed candidate has unresolved shared-library dependencies." >> "$GITHUB_OUTPUT"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            END_TIME=$(date +%s)
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if ! NEXT_VERSION_OUTPUT="$(SLURM_CONF="${NEXT_CONF}" "${NEXT_RUNNER}" --version 2>&1)"; then
            printf '%s\n' "${NEXT_VERSION_OUTPUT}" >&2
            echo "next_installed_version=version_command_failed" >> "$GITHUB_OUTPUT"
            echo "decision=next_install_failed" >> "$GITHUB_OUTPUT"
            echo "regression_result=Next version identity validation failed on Arm64" >> "$GITHUB_OUTPUT"
            echo "comparison=Current pinned Slurm version ${CURRENT} passed smoke tests in this run, but the installed candidate version command failed." >> "$GITHUB_OUTPUT"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            END_TIME=$(date +%s)
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          printf '%s\n' "${NEXT_VERSION_OUTPUT}"
          if [ "${NEXT_VERSION_OUTPUT}" != "slurm ${LATEST}" ]; then
            echo "next_installed_version=version_mismatch" >> "$GITHUB_OUTPUT"
            echo "decision=next_install_failed" >> "$GITHUB_OUTPUT"
            echo "regression_result=Next version identity validation failed on Arm64" >> "$GITHUB_OUTPUT"
            echo "comparison=Current pinned Slurm version ${CURRENT} passed smoke tests in this run, but the candidate binary did not report the expected version ${LATEST}." >> "$GITHUB_OUTPUT"
            echo "Next version installed on Arm64: version_mismatch"
            echo "Regression install result: Next version identity validation failed on Arm64"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            END_TIME=$(date +%s)
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          NEXT_VERSION="${LATEST}"
          SLURM_CONF="${NEXT_CONF}" "${NEXT_RUNNER}" --help >/tmp/slurm-next-help.txt 2>&1
          if ! grep -Eqi "usage: srun|srun \[OPTIONS\]|usage|options" /tmp/slurm-next-help.txt; then
            cat /tmp/slurm-next-help.txt || true
            echo "next_installed_version=not_installed" >> "$GITHUB_OUTPUT"
            echo "decision=next_install_failed" >> "$GITHUB_OUTPUT"
            echo "regression_result=Next version install failed on Arm64" >> "$GITHUB_OUTPUT"
            echo "comparison=Current pinned Slurm version ${CURRENT} passed smoke tests in this run, but the candidate Arm64 srun binary did not contain the expected embedded usage text." >> "$GITHUB_OUTPUT"
            echo "Next version installed on Arm64: not_installed"
            echo "Regression install result: Next version install failed on Arm64"
            echo "Details: Current pinned Slurm version ${CURRENT} passed smoke tests in this run, but the candidate Arm64 srun binary did not contain the expected embedded usage text."
            echo "status=failed" >> "$GITHUB_OUTPUT"
            END_TIME=$(date +%s)
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          set +e
          SLURM_CONF="${NEXT_CONF}" timeout 10s "${NEXT_RUNNER}" -N1 -n1 /bin/true >/tmp/slurm-next-functional.txt 2>&1
          NEXT_RUN_RC=$?
          set -e
          if [ "${NEXT_RUN_RC}" -eq 0 ] \
             || [ "${NEXT_RUN_RC}" -eq 124 ] \
             || ! grep -Fqi "Unable to contact slurm controller (connect failure)" /tmp/slurm-next-functional.txt \
             || grep -Eqi "Munge|authentication error|Unable to establish configuration source|resolve_ctls_from_dns_srv|fetch_config|Could not establish a configuration source" /tmp/slurm-next-functional.txt; then
            cat /tmp/slurm-next-functional.txt || true
            echo "next_installed_version=not_installed" >> "$GITHUB_OUTPUT"
            echo "decision=next_install_failed" >> "$GITHUB_OUTPUT"
            echo "regression_result=Next version install failed on Arm64" >> "$GITHUB_OUTPUT"
            echo "comparison=Current pinned Slurm version ${CURRENT} passed smoke tests in this run, but the candidate Arm64 srun binary failed the bounded runtime smoke." >> "$GITHUB_OUTPUT"
            echo "Next version installed on Arm64: not_installed"
            echo "Regression install result: Next version install failed on Arm64"
            echo "Details: Current pinned Slurm version ${CURRENT} passed smoke tests in this run, but the candidate Arm64 srun binary failed the bounded runtime smoke."
            echo "status=failed" >> "$GITHUB_OUTPUT"
            END_TIME=$(date +%s)
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "next_installed_version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
          if [ "${CURRENT}" = "${LATEST}" ]; then
            echo "decision=metadata_review_required" >> "$GITHUB_OUTPUT"
            echo "regression_result=Tests 1-5 baseline must be older than the latest stable release" >> "$GITHUB_OUTPUT"
            echo "comparison=Pinned baseline already matches the latest stable upstream release. Repin Tests 1-5 to an older dashboard-aligned baseline so Test 6 validates a newer Arm64 release." >> "$GITHUB_OUTPUT"
            echo "Next version installed on Arm64: ${NEXT_VERSION}"
            echo "Regression install result: Tests 1-5 baseline must be older than the latest stable release"
            echo "status=failed" >> "$GITHUB_OUTPUT"
          else
            echo "decision=next_install_validated" >> "$GITHUB_OUTPUT"
            echo "regression_result=Next version installed successfully on Arm64" >> "$GITHUB_OUTPUT"
            echo "comparison=Current pinned Slurm version ${CURRENT} passed smoke tests in this run. Regression validation rebuilt and executed the candidate official Slurm source ${LATEST} successfully on Arm64." >> "$GITHUB_OUTPUT"
            echo "Next version installed on Arm64: ${NEXT_VERSION}"
            echo "Regression install result: Next version installed successfully on Arm64"
            echo "status=passed" >> "$GITHUB_OUTPUT"
          fi
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
          last_status="$(grep '^status=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2- || true)"
          if [ "$last_status" = "failed" ]; then
            exit 1
          fi
      - name: Show regression validation details
        if: always()
        run: |
          DECISION="${{ steps.test6.outputs.decision || 'manual_review_needed' }}"
          REGRESSION_RESULT="${{ steps.test6.outputs.regression_result || '' }}"
          if [ -z "$REGRESSION_RESULT" ]; then
            case "$DECISION" in
              next_install_validated|safe_to_upgrade)
                REGRESSION_RESULT="Next version installed successfully on Arm64"
                ;;
              next_install_failed|next_lookup_failed)
                REGRESSION_RESULT="Next version install failed on Arm64"
                ;;
              metadata_review_required|current_is_latest_stable|pinned_is_latest|already_current|already_at_latest|at_latest|current_is_latest|current_is_latest_validated_release|current_is_latest_validated_3_2_x|pinned_latest_eol)
                REGRESSION_RESULT="Tests 1-5 baseline must be older than the latest stable release"
                ;;
              baseline_failed)
                REGRESSION_RESULT="Regression validation skipped because baseline validation failed"
                ;;
              hold_current|hold_current_until_regression_run|hold_current_arm_dependency_gap|upgrade_candidate_available|manual_review_needed|manual_review_needed_for_product_upgrade|keep_current)
                REGRESSION_RESULT="Pending regression install validation"
                ;;
              *)
                if [ "${{ steps.test6.outputs.status || 'skipped' }}" = "passed" ]; then
                  REGRESSION_RESULT="Regression validation passed"
                else
                  REGRESSION_RESULT="Regression validation failed"
                fi
                ;;
            esac
          fi

          echo "=== Regression Validation (Next Version Install) ==="
          echo "Current version tested in Tests 1-5: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || steps.metadata.outputs.current_version || 'unknown' }}"
          echo "Next version targeted for install validation: ${{ steps.test6.outputs.latest_version || steps.version.outputs.latest || 'unknown' }}"
          echo "Next version installed on Arm64: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}"
          echo "Regression install result: ${REGRESSION_RESULT}"
          echo "Details: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}"

      - name: Calculate test summary
        if: always()
        id: summary
        run: |
          PASSED=0
          FAILED=0
          SKIPPED=0
          CORE_FAILED=0
          TOTAL_DURATION=0

          check_core_test() {
            local status="$1"
            local duration="$2"
            if [ "$status" = "passed" ]; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
              CORE_FAILED=$((CORE_FAILED + 1))
            fi
            TOTAL_DURATION=$((TOTAL_DURATION + duration))
          }

          check_core_test "${{ steps.test1.outputs.status || 'failed' }}" "${{ steps.test1.outputs.duration || 0 }}"
          check_core_test "${{ steps.test2.outputs.status || 'failed' }}" "${{ steps.test2.outputs.duration || 0 }}"
          check_core_test "${{ steps.test3.outputs.status || 'failed' }}" "${{ steps.test3.outputs.duration || 0 }}"
          check_core_test "${{ steps.test4.outputs.status || 'failed' }}" "${{ steps.test4.outputs.duration || 0 }}"
          check_core_test "${{ steps.test5.outputs.status || 'failed' }}" "${{ steps.test5.outputs.duration || 0 }}"
          TEST6_STATUS="${{ steps.test6.outputs.status || 'skipped' }}"
          if [ "$TEST6_STATUS" = "passed" ]; then
            PASSED=$((PASSED + 1))
          elif [ "$TEST6_STATUS" = "failed" ]; then
            FAILED=$((FAILED + 1))
          else
            SKIPPED=$((SKIPPED + 1))
          fi
          TOTAL_DURATION=$((TOTAL_DURATION + ${{ steps.test6.outputs.duration || 0 }}))

          echo "passed=${PASSED}" >> "$GITHUB_OUTPUT"
          echo "failed=${FAILED}" >> "$GITHUB_OUTPUT"
          echo "skipped=${SKIPPED}" >> "$GITHUB_OUTPUT"
          echo "core_failed=${CORE_FAILED}" >> "$GITHUB_OUTPUT"
          echo "duration=${TOTAL_DURATION}" >> "$GITHUB_OUTPUT"

          if [ "${FAILED}" -eq 0 ]; then
            echo "overall_status=success" >> "$GITHUB_OUTPUT"
          else
            echo "overall_status=failure" >> "$GITHUB_OUTPUT"
          fi

          if [ "${CORE_FAILED}" -eq 0 ]; then
            echo "badge_status=passing" >> "$GITHUB_OUTPUT"
          else
            echo "badge_status=failing" >> "$GITHUB_OUTPUT"
          fi

          if [ "${CORE_FAILED}" -ne 0 ]; then
            exit 1
          fi

      - name: Create test summary
        if: always()
        run: |
          REGRESSION_RESULT="${{ steps.test6.outputs.regression_result || 'Regression result unavailable.' }}"
          {
            echo "## Slurm Test Results"
            echo ""
            echo "- Pinned version: \`${{ steps.version.outputs.version }}\`"
            echo "- Latest upstream: \`${{ steps.version.outputs.latest }}\`"
            echo "- Overall status: \`${{ steps.summary.outputs.overall_status || 'failure' }}\`"
            echo ""
            echo "| Test | Status | Duration (s) |"
            echo "| --- | --- | ---: |"
            echo "| Test 1 - Check srun binary exists | ${{ steps.test1.outputs.status || 'skipped' }} | ${{ steps.test1.outputs.duration || 0 }} |"
            echo "| Test 2 - Check exact version output | ${{ steps.test2.outputs.status || 'skipped' }} | ${{ steps.test2.outputs.duration || 0 }} |"
            echo "| Test 3 - Check help output | ${{ steps.test3.outputs.status || 'skipped' }} | ${{ steps.test3.outputs.duration || 0 }} |"
            echo "| Test 4 - Architecture verification | ${{ steps.test4.outputs.status || 'skipped' }} | ${{ steps.test4.outputs.duration || 0 }} |"
            echo "| Test 5 - Functional validation | ${{ steps.test5.outputs.status || 'skipped' }} | ${{ steps.test5.outputs.duration || 0 }} |"
            echo "| Test 6 - Regression Validation | ${{ steps.test6.outputs.status || 'skipped' }} | ${{ steps.test6.outputs.duration || 0 }} |"
            echo ""
            echo "### Regression Validation (Next Version Install)"
            echo "- Current pinned version: \`${{ steps.test6.outputs.current_version || steps.version.outputs.version }}\`"
            echo "- Next version targeted for install validation: \`${{ steps.test6.outputs.latest_version || steps.version.outputs.latest }}\`"
            echo "- Next version installed on Arm64: \`${{ steps.test6.outputs.next_installed_version || 'not_installed' }}\`"
            echo "- **Regression install result:** ${REGRESSION_RESULT}"
            echo "- Comparison: ${{ steps.test6.outputs.comparison || 'No regression comparison recorded.' }}"
          } >> "$GITHUB_STEP_SUMMARY"


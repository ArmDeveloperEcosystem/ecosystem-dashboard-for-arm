name: Test LibrePCB on Arm64

permissions:
  contents: read

on:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-librepcb.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-librepcb.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-librepcb.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-librepcb.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-librepcb.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-librepcb.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-librepcb.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-librepcb.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-librepcb.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-librepcb.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-librepcb.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-librepcb.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-librepcb.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-librepcb.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-librepcb.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-librepcb.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-librepcb.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-librepcb.outputs.regression_next_installed_version }}
      regression_policy:
        description: Regression applicability policy classification
        value: ${{ jobs.test-librepcb.outputs.regression_policy }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-librepcb.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-librepcb.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-librepcb.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-librepcb.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-librepcb.outputs.timestamp }}

jobs:
  test-librepcb:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    env:
      BASELINE_VERSION: "2.0.1-2"
      PACKAGE_SLUG: "librepcb"
      SNAP_NAME: "librepcb"
      SNAP_COMMAND: "/snap/bin/librepcb.librepcb-cli"
      DOWNLOAD_URL: "https://github.com/LibrePCB/LibrePCB/tags"
      HOMEPAGE_URL: "https://librepcb.org/"
      OFFICIAL_DOCS: "https://librepcb.org/docs/installation/build-from-sources/"

    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'LibrePCB'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '1' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '1' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '5' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Package-manager runtime smoke; source regression is not applicable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      regression_policy: ${{ steps.test6.outputs.policy || 'not_configured' }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          {
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "package_slug=librepcb"
            echo "dashboard_link=/linux/opensource_packages/librepcb"
          } >> "$GITHUB_OUTPUT"

      - name: Install LibrePCB snap
        id: install
        timeout-minutes: 25
        run: |
          set -uo pipefail
          install_log="$RUNNER_TEMP/librepcb-snap-install.log"
          resolve_inflight_librepcb_change() {
            local change_id=""
            change_id="$(timeout --kill-after=5s 30s sudo snap changes --abs-time 2>/dev/null | awk -v package="$SNAP_NAME" 'NR > 1 && index($0, package) && $2 != "Done" && $2 != "Error" && $2 != "Undone" { print $1; exit }' || true)"
            if [ -n "$change_id" ]; then
              echo "Found in-flight LibrePCB change ${change_id}; waiting for snapd to finish it."
              if ! timeout --kill-after=5s 120s sudo snap watch "$change_id"; then
                timeout --kill-after=5s 30s sudo snap change "$change_id" 2>&1 | tee -a "$install_log" || true
                timeout --kill-after=5s 30s sudo snap abort "$change_id" >/dev/null 2>&1 || true
              fi
            fi
          }

          sudo systemctl start snapd.socket snapd.service >/dev/null 2>&1 || true
          timeout --kill-after=5s 60s sudo snap wait system seed.loaded >/dev/null 2>&1 || true

          : > "$install_log"
          install_ok=0
          failure_kind="install_failed"
          for attempt in 1 2 3; do
            echo "LibrePCB snap install attempt ${attempt}/3"
            if timeout --kill-after=5s 30s snap list "$SNAP_NAME" >/dev/null 2>&1; then
              install_ok=1
              break
            fi

            resolve_inflight_librepcb_change
            if timeout --kill-after=5s 30s snap list "$SNAP_NAME" >/dev/null 2>&1; then
              install_ok=1
              break
            fi

            if timeout --kill-after=10s 600s sudo snap install "$SNAP_NAME" 2>&1 | tee -a "$install_log"; then
              install_ok=1
              break
            fi

            resolve_inflight_librepcb_change
            if timeout --kill-after=5s 30s snap list "$SNAP_NAME" >/dev/null 2>&1; then
              install_ok=1
              break
            fi
            if grep -Eqi 'api\.snapcraft\.io|connection refused|unable to contact snap store|cannot communicate with server|timed out|timeout exceeded|Client\.Timeout|HTTP[^0-9]*408' "$install_log"; then
              failure_kind="snap_store_unavailable"
            fi
            timeout --kill-after=5s 60s sudo snap remove --purge "$SNAP_NAME" >/dev/null 2>&1 || true
            sudo systemctl restart snapd.socket snapd.service >/dev/null 2>&1 || true
            timeout --kill-after=5s 60s sudo snap wait system seed.loaded >/dev/null 2>&1 || true
            sleep 15
          done

          if [ "$install_ok" -ne 1 ]; then
            {
              echo "status=failed"
              echo "install_status=failed"
              echo "failure_kind=$failure_kind"
              echo "version=unknown"
              echo "note=LibrePCB snap installation failed after three bounded attempts."
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SNAP_VERSION="$(timeout --kill-after=5s 30s snap list "$SNAP_NAME" | awk 'NR==2 {print $2}')"
          if [ -z "$SNAP_VERSION" ] || [ ! -x "$SNAP_COMMAND" ]; then
            {
              echo "status=failed"
              echo "install_status=failed"
              echo "failure_kind=install_verification_failed"
              echo "version=unknown"
              echo "note=LibrePCB snap installation completed without a verifiable CLI artifact."
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "status=passed"
            echo "install_status=success"
            echo "failure_kind=none"
            echo "version=$SNAP_VERSION"
            echo "note=Installed LibrePCB snap ${SNAP_VERSION} on the Arm64 runner."
          } >> "$GITHUB_OUTPUT"

      - name: Get installed package version
        id: version
        if: ${{ always() && steps.install.outputs.install_status == 'success' }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.install.outputs.version }}"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected LibrePCB snap version: $VERSION"

      - name: Test 1 - Package-manager install evidence
        id: test1
        if: always()
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          echo "status=failed" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.install.outputs.install_status || 'failed' }}" != "success" ]; then
            echo "note=LibrePCB installation failed: ${{ steps.install.outputs.failure_kind || 'install_failed' }}." >> "$GITHUB_OUTPUT"
            END_TIME=$(date +%s)
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          test -f "content/linux/opensource_packages/${PACKAGE_SLUG}.md"
          grep -Fq "works_on_arm: true" "content/linux/opensource_packages/${PACKAGE_SLUG}.md"
          grep -Fq "download_url: $DOWNLOAD_URL" "content/linux/opensource_packages/${PACKAGE_SLUG}.md"
          timeout --kill-after=5s 30s snap list "$SNAP_NAME" | grep -F "$SNAP_NAME"
          timeout --kill-after=5s 60s snap info "$SNAP_NAME" | grep -F "latest/stable:"
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "note=Validated LibrePCB snap install evidence on the Arm64 runner." >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 2 - Installed Arm64 snap metadata
        id: test2
        if: ${{ always() && steps.install.outputs.install_status == 'success' }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          echo "status=failed" >> "$GITHUB_OUTPUT"
          DOC_PATH="content/linux/opensource_packages/${PACKAGE_SLUG}.md"
          grep -Fq "works_on_arm: true" "$DOC_PATH"
          grep -Fq "download_url: $DOWNLOAD_URL" "$DOC_PATH"
          grep -Fq "supported_minimum_version:" "$DOC_PATH"
          SNAP_ARCH="$(timeout --kill-after=5s 30s snap version | awk '/architecture/ {print $2}')"
          test "$SNAP_ARCH" = "arm64"
          SNAP_VERSION="$(timeout --kill-after=5s 30s snap list "$SNAP_NAME" | awk 'NR==2 {print $2}')"
          test "$SNAP_VERSION" = "${{ steps.version.outputs.version }}"
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "note=Validated LibrePCB snap metadata on Ubuntu arm64." >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 3 - CLI version starts on Arm
        id: test3
        if: ${{ always() && steps.install.outputs.install_status == 'success' }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          echo "status=failed" >> "$GITHUB_OUTPUT"
          export SNAP="/snap/${SNAP_NAME}/current"
          export LD_LIBRARY_PATH="$SNAP/usr/lib:$SNAP/usr/lib/aarch64-linux-gnu:$SNAP/usr/lib/aarch64-linux-gnu/libproxy:$SNAP/usr/lib/aarch64-linux-gnu/pulseaudio:$SNAP/lib:$SNAP/lib/aarch64-linux-gnu"
          export PATH="$SNAP/usr/bin:$SNAP/bin:$PATH"
          export QT_PLUGIN_PATH="$SNAP/usr/lib/aarch64-linux-gnu/qt6/plugins:$SNAP/usr/lib/qt6/plugins"
          export QT_QPA_PLATFORM=offscreen
          "$SNAP/usr/bin/librepcb-cli" --version | tee librepcb-version.txt
          grep -Fq "LibrePCB CLI Version" librepcb-version.txt
          grep -Fq "Qt Version" librepcb-version.txt
          grep -Fq "OpenCascade OCCT" librepcb-version.txt
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "note=LibrePCB CLI started headlessly from the installed arm64 snap and reported its runtime stack." >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 4 - Arm64 runner gate
        id: test4
        if: ${{ always() && steps.install.outputs.install_status == 'success' }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          echo "status=failed" >> "$GITHUB_OUTPUT"
          test "$(uname -m)" = "aarch64"
          test "$(dpkg --print-architecture)" = "arm64"
          echo "status=passed" >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 5 - Headless runtime smoke
        id: test5
        if: ${{ always() && steps.install.outputs.install_status == 'success' }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          echo "status=failed" >> "$GITHUB_OUTPUT"
          export SNAP="/snap/${SNAP_NAME}/current"
          export LD_LIBRARY_PATH="$SNAP/usr/lib:$SNAP/usr/lib/aarch64-linux-gnu:$SNAP/usr/lib/aarch64-linux-gnu/libproxy:$SNAP/usr/lib/aarch64-linux-gnu/pulseaudio:$SNAP/lib:$SNAP/lib/aarch64-linux-gnu"
          export PATH="$SNAP/usr/bin:$SNAP/bin:$PATH"
          export QT_PLUGIN_PATH="$SNAP/usr/lib/aarch64-linux-gnu/qt6/plugins:$SNAP/usr/lib/qt6/plugins"
          export QT_QPA_PLATFORM=offscreen
          "$SNAP/usr/bin/librepcb-cli" --help | tee librepcb-help.txt
          grep -Eiq "usage|LibrePCB" librepcb-help.txt
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "note=LibrePCB CLI help executed headlessly on the Arm64 runner from the installed snap." >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 6 - Regression validation applicability
        id: test6
        if: always()
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          CURRENT_VERSION="${{ steps.version.outputs.version || 'unknown' }}"
          INSTALL_STATUS="${{ steps.install.outputs.install_status || 'failed' }}"

          if [ "$INSTALL_STATUS" != "success" ]; then
            END_TIME=$(date +%s)
            {
              echo "status=skipped"
              echo "decision=baseline_install_failed"
              echo "regression_result=Regression validation was not attempted because baseline installation failed"
              echo "comparison=The LibrePCB snap could not be installed, so package health and next-version validation could not be established."
              echo "current_version=unknown"
              echo "latest_version=unknown"
              echo "next_installed_version=not_installed"
              echo "policy=baseline_install_failed"
              echo "duration=$((END_TIME - START_TIME))"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ steps.test1.outputs.status || 'skipped' }}" != "passed" ] \
            || [ "${{ steps.test2.outputs.status || 'skipped' }}" != "passed" ] \
            || [ "${{ steps.test3.outputs.status || 'skipped' }}" != "passed" ] \
            || [ "${{ steps.test4.outputs.status || 'skipped' }}" != "passed" ] \
            || [ "${{ steps.test5.outputs.status || 'skipped' }}" != "passed" ]; then
            END_TIME=$(date +%s)
            {
              echo "status=skipped"
              echo "decision=baseline_failed"
              echo "regression_result=Regression validation was not attempted because a baseline test failed"
              echo "comparison=Tests 1-5 must all pass before a package-manager regression decision can be emitted."
              echo "current_version=$CURRENT_VERSION"
              echo "latest_version=unknown"
              echo "next_installed_version=not_installed"
              echo "policy=baseline_failed"
              echo "duration=$((END_TIME - START_TIME))"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          END_TIME=$(date +%s)
          {
            echo "status=skipped"
            echo "decision=not_applicable_package_manager"
            echo "regression_result=LibrePCB is validated through the package-manager snap runtime on Ubuntu Arm64"
            echo "comparison=LibrePCB is installed from the official stable snap and the CLI is executed headlessly on the Ubuntu Arm64 runner. Source-style next-version regression is not applicable for this package-manager lane."
            echo "current_version=$CURRENT_VERSION"
            echo "latest_version=not_applicable"
            echo "next_installed_version=not_applicable"
            echo "policy=package_manager_installed"
            echo "duration=$((END_TIME - START_TIME))"
          } >> "$GITHUB_OUTPUT"

      - name: Emit package result
        id: summary
        if: always()
        uses: ./.github/actions/emit-package-result
        with:
          package_slug: librepcb
          package_name: LibrePCB
          version: ${{ steps.version.outputs.version || 'unknown' }}
          install_status: ${{ steps.install.outputs.install_status || 'failed' }}
          test1_label: Test 1 - Package-manager install evidence
          test2_label: Test 2 - Installed Arm64 snap metadata
          test3_label: Test 3 - CLI version starts on Arm
          test4_label: Test 4 - Arm64 runner gate
          test5_label: Test 5 - Headless runtime smoke
          test1_status: ${{ steps.test1.outputs.status || 'skipped' }}
          test2_status: ${{ steps.test2.outputs.status || 'skipped' }}
          test3_status: ${{ steps.test3.outputs.status || 'skipped' }}
          test4_status: ${{ steps.test4.outputs.status || 'skipped' }}
          test5_status: ${{ steps.test5.outputs.status || 'skipped' }}
          test6_status: ${{ steps.test6.outputs.status || 'skipped' }}
          test1_duration: ${{ steps.test1.outputs.duration || 0 }}
          test2_duration: ${{ steps.test2.outputs.duration || 0 }}
          test3_duration: ${{ steps.test3.outputs.duration || 0 }}
          test4_duration: ${{ steps.test4.outputs.duration || 0 }}
          test5_duration: ${{ steps.test5.outputs.duration || 0 }}
          test6_duration: ${{ steps.test6.outputs.duration || 0 }}
          regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
          regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
          regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
          regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
          regression_result: ${{ steps.test6.outputs.regression_result || 'Regression result unavailable.' }}
          regression_details: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}

      - name: Enforce failure status
        if: always()
        run: |
          if [ "${{ steps.summary.outputs.should_fail }}" = "1" ]; then
            exit 1
          fi

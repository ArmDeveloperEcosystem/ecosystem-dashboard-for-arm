name: Test Restreamer on Arm64

permissions:
  contents: read

on:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-restreamer.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-restreamer.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-restreamer.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-restreamer.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-restreamer.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-restreamer.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-restreamer.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-restreamer.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-restreamer.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-restreamer.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-restreamer.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-restreamer.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-restreamer.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-restreamer.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-restreamer.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-restreamer.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-restreamer.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-restreamer.outputs.regression_next_installed_version }}
      regression_policy:
        description: Regression applicability policy classification
        value: ${{ jobs.test-restreamer.outputs.regression_policy }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-restreamer.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-restreamer.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-restreamer.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-restreamer.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-restreamer.outputs.timestamp }}

jobs:
  test-restreamer:
    runs-on: ubuntu-24.04-arm
    env:
      BASELINE_VERSION: "0.1.0"
      RESTREAMER_RUNTIME_VERSION: "2.12.0"
      PACKAGE_SLUG: "restreamer"
      LANE_KIND: "docker/image-or-cluster"
      DOWNLOAD_URL: "https://hub.docker.com/r/datarhei/restreamer/tags"
      HOMEPAGE_URL: "https://docs.datarhei.com/restreamer/"
      OFFICIAL_DOCS: "https://docs.datarhei.com/restreamer/installing/minimum-requirements"
      GITHUB_REPO: "datarhei/restreamer"
      RESTREAMER_SMOKE_COMMAND: |
        set -euo pipefail
        IMAGE="datarhei/restreamer:$1"
        SMOKE_DIR=$(mktemp -d)
        CONTAINER="restreamer-smoke-$(basename "$SMOKE_DIR")"
        STARTED=false
        cleanup() {
          if [ "$STARTED" = true ]; then
            docker logs "$CONTAINER" || true
            docker rm -f "$CONTAINER" >/dev/null || true
          fi
          rm -rf "$SMOKE_DIR"
        }
        trap cleanup EXIT
        test "$(uname -m)" = aarch64
        docker manifest inspect "$IMAGE" > "$SMOKE_DIR/manifest.json"
        jq -e '.manifests | any(.platform.architecture == "arm64" and .platform.os == "linux")' "$SMOKE_DIR/manifest.json"
        docker pull --platform linux/arm64 "$IMAGE"
        test "$(docker image inspect --format '{{.Architecture}}' "$IMAGE")" = arm64
        docker create --name "$CONTAINER" -p 127.0.0.1::8080 "$IMAGE"
        STARTED=true
        docker start "$CONTAINER"
        ADDRESS=$(docker port "$CONTAINER" 8080/tcp)
        test -n "$ADDRESS"
        READY=false
        for _ in {1..45}; do
          if curl --fail --silent --show-error --location --connect-timeout 2 --max-time 5 \
              "http://$ADDRESS/" --output "$SMOKE_DIR/http.out" && \
              grep -Eiq 'restreamer' "$SMOKE_DIR/http.out"; then
            READY=true
            break
          fi
          sleep 2
        done
        test "$READY" = true
        test "$(docker inspect --format '{{.State.Running}}' "$CONTAINER")" = true
        printf 'Restreamer Arm64 HTTP smoke passed: %s\n' "$IMAGE"

    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'Restreamer'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      regression_policy: "applicable"
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=restreamer" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/linux/opensource_packages/restreamer" >> "$GITHUB_OUTPUT"

      - name: Bootstrap baseline dependencies
        uses: ./.github/actions/apt-bootstrap
        with:
          packages: "git curl jq tar unzip file ca-certificates"
          quiet: "true"

      - name: Install baseline source or artifact
        id: install
        run: |
          set -euo pipefail
          rm -rf baseline-src baseline-external
          mkdir -p baseline-src baseline-external
          if [ -n "$GITHUB_REPO" ]; then
            RESOLVED_TAG=""
            for CANDIDATE in "$BASELINE_VERSION" "v$BASELINE_VERSION"; do
              if git ls-remote --tags --refs "https://github.com/$GITHUB_REPO.git" "refs/tags/$CANDIDATE" | grep -q .; then
                RESOLVED_TAG="$CANDIDATE"
                break
              fi
            done
            if [ -n "$RESOLVED_TAG" ]; then
              git clone --depth 1 --branch "$RESOLVED_TAG" "https://github.com/$GITHUB_REPO.git" baseline-src >/dev/null 2>&1 || true
              echo "resolved_tag=$RESOLVED_TAG" >> "$GITHUB_OUTPUT"
            else
              git clone --depth 1 "https://github.com/$GITHUB_REPO.git" baseline-src >/dev/null 2>&1 || true
              echo "resolved_tag=default_branch" >> "$GITHUB_OUTPUT"
            fi
            if [ -d baseline-src/.git ] || [ -f baseline-src/README.md ] || [ -n "$(find baseline-src -mindepth 1 -maxdepth 2 -print -quit 2>/dev/null)" ]; then
              echo "install_mode=github_source" >> "$GITHUB_OUTPUT"
              echo "install_status=success" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if curl -fsLI "$DOWNLOAD_URL" >/dev/null 2>&1 || curl -fsLI "$HOMEPAGE_URL" >/dev/null 2>&1; then
            printf 'download=%s\nhomepage=%s\ndocs=%s\n' "$DOWNLOAD_URL" "$HOMEPAGE_URL" "$OFFICIAL_DOCS" > baseline-external/metadata.txt
            echo "resolved_tag=external_artifact" >> "$GITHUB_OUTPUT"
            echo "install_mode=external_artifact" >> "$GITHUB_OUTPUT"
            echo "install_status=success" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "install_mode=unresolved" >> "$GITHUB_OUTPUT"
          echo "install_status=failed" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Get baseline version
        id: version
        run: |
          echo "version=$RESTREAMER_RUNTIME_VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected Restreamer Arm64 runtime version: $RESTREAMER_RUNTIME_VERSION"
          echo "Checked-in historical metadata version remains: $BASELINE_VERSION"

      - name: Define package-specific expectations
        id: expectations
        run: |
          set -euo pipefail
          CONTENT_PAGE="content/linux/opensource_packages/${PACKAGE_SLUG}.md"
          echo "content_page=$CONTENT_PAGE" >> "$GITHUB_OUTPUT"
          case "$PACKAGE_SLUG" in
            ngspice)
              echo "source_markers=ANALYSES|DEVICES|src|README|man" >> "$GITHUB_OUTPUT"
              echo "doc_markers=README|README.adms|README.tcl|src" >> "$GITHUB_OUTPUT"
              echo "identity_kind=grep_file" >> "$GITHUB_OUTPUT"
              echo "identity_target=README" >> "$GITHUB_OUTPUT"
              echo "identity_expect=ngspice" >> "$GITHUB_OUTPUT"
              echo "external_expect=ngspice" >> "$GITHUB_OUTPUT"
              ;;
            nvidia-container-toolkit)
              echo "source_markers=cmd/nvidia-ctk|cmd/nvidia-container-runtime|go.mod|pkg" >> "$GITHUB_OUTPUT"
              echo "doc_markers=README.md|cmd/nvidia-container-runtime|CHANGELOG.md|go.mod" >> "$GITHUB_OUTPUT"
              echo "identity_kind=go_module" >> "$GITHUB_OUTPUT"
              echo "identity_target=go.mod" >> "$GITHUB_OUTPUT"
              echo "identity_expect=github.com/NVIDIA/nvidia-container-toolkit" >> "$GITHUB_OUTPUT"
              echo "external_expect=nvidia-container-toolkit|NVIDIA Container Toolkit" >> "$GITHUB_OUTPUT"
              ;;
            nvidia-gpu-driver-container)
              echo "source_markers=base|Makefile|README.md|centos7|vgpu" >> "$GITHUB_OUTPUT"
              echo "doc_markers=README.md|base|azurelinux|centos7" >> "$GITHUB_OUTPUT"
              echo "identity_kind=grep_file" >> "$GITHUB_OUTPUT"
              echo "identity_target=README.md" >> "$GITHUB_OUTPUT"
              echo "identity_expect=driver container" >> "$GITHUB_OUTPUT"
              echo "external_expect=gpu driver container|NVIDIA driver" >> "$GITHUB_OUTPUT"
              ;;
            nvidia-gpu-operator)
              echo "source_markers=deployments/gpu-operator|go.mod|PROJECT|README.md" >> "$GITHUB_OUTPUT"
              echo "doc_markers=README.md|deployments/gpu-operator/Chart.yaml|tests|go.mod" >> "$GITHUB_OUTPUT"
              echo "identity_kind=chart_name" >> "$GITHUB_OUTPUT"
              echo "identity_target=deployments/gpu-operator/Chart.yaml" >> "$GITHUB_OUTPUT"
              echo "identity_expect=gpu-operator" >> "$GITHUB_OUTPUT"
              echo "external_expect=gpu-operator|GPU Operator" >> "$GITHUB_OUTPUT"
              ;;
            nvimagecodec)
              echo "source_markers=CMakeLists.txt|README.md|example|cmake" >> "$GITHUB_OUTPUT"
              echo "doc_markers=README.md|CMakeLists.txt|example" >> "$GITHUB_OUTPUT"
              echo "identity_kind=grep_file" >> "$GITHUB_OUTPUT"
              echo "identity_target=README.md" >> "$GITHUB_OUTPUT"
              echo "identity_expect=nvImageCodec" >> "$GITHUB_OUTPUT"
              echo "external_expect=nvImageCodec|nvimgcodec" >> "$GITHUB_OUTPUT"

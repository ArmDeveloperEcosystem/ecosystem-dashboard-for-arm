name: Test Canonical Snapcraft on Arm64

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-snapcraft.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-snapcraft.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-snapcraft.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-snapcraft.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-snapcraft.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-snapcraft.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-snapcraft.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-snapcraft.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-snapcraft.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-snapcraft.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-snapcraft.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-snapcraft.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-snapcraft.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-snapcraft.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-snapcraft.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-snapcraft.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-snapcraft.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-snapcraft.outputs.regression_next_installed_version }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-snapcraft.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-snapcraft.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-snapcraft.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-snapcraft.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-snapcraft.outputs.timestamp }}
jobs:
  test-snapcraft:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    
    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'Canonical Snapcraft'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '1' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '1' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '5' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false
      
      - name: Set test metadata
        id: metadata
        run: |
          {
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "package_slug=snapcraft"
            echo "dashboard_link=/opensource_packages/snapcraft"
          } >> "$GITHUB_OUTPUT"
      - name: Install Snapcraft
        id: install
        timeout-minutes: 16
        continue-on-error: true
        run: |
          set -euo pipefail
          install_log="$RUNNER_TEMP/snapcraft-install.log"
          resolve_inflight_snapcraft_change() {
            local change_id=""
            change_id="$(timeout --kill-after=5s 30s sudo snap changes --abs-time 2>/dev/null | awk 'NR > 1 && /snapcraft/ && $2 != "Done" && $2 != "Error" && $2 != "Undone" { print $1; exit }' || true)"
            if [ -n "$change_id" ]; then
              echo "Found in-flight Snapcraft change ${change_id}; waiting for snapd to finish it."
              if ! timeout --kill-after=5s 120s sudo snap watch "$change_id"; then
                timeout --kill-after=5s 30s sudo snap change "$change_id" 2>&1 | tee -a "$install_log" || true
                timeout --kill-after=5s 30s sudo snap abort "$change_id" >/dev/null 2>&1 || true
              fi
            fi
          }

          echo "Installing Snapcraft via Snap..."
          sudo systemctl start snapd.socket snapd.service >/dev/null 2>&1 || true
          timeout --kill-after=5s 60s sudo snap wait system seed.loaded >/dev/null 2>&1 || true
          : > "$install_log"
          install_ok=0
          for attempt in 1 2 3; do
            echo "Snapcraft install attempt ${attempt}/3"
            if timeout --kill-after=5s 30s snap list snapcraft >/dev/null 2>&1; then
              install_ok=1
              break
            fi
            resolve_inflight_snapcraft_change
            if timeout --kill-after=5s 30s snap list snapcraft >/dev/null 2>&1; then
              install_ok=1
              break
            fi
            if timeout --kill-after=5s 180s sudo snap install snapcraft --classic 2>&1 | tee -a "$install_log"; then
              install_ok=1
              break
            fi
            resolve_inflight_snapcraft_change
            if timeout --kill-after=5s 30s snap list snapcraft >/dev/null 2>&1; then
              install_ok=1
              break
            fi
            timeout --kill-after=5s 60s sudo snap remove --purge snapcraft >/dev/null 2>&1 || true
            sudo systemctl restart snapd.socket snapd.service >/dev/null 2>&1 || true
            timeout --kill-after=5s 60s sudo snap wait system seed.loaded >/dev/null 2>&1 || true
            sleep 15
          done

          if [ "$install_ok" -ne 1 ]; then
            failure_kind=package_install_failed
            if grep -Eqi 'api\.snapcraft\.io|connection refused|timed out|timeout exceeded|Client\.Timeout|unable to contact snap store|HTTP[^0-9]*408' "$install_log"; then
              failure_kind=snap_store_unavailable
            fi
            {
              echo "install_status=failed"
              echo "failure_kind=$failure_kind"
            } >> "$GITHUB_OUTPUT"
            echo "Snapcraft installation failed after three bounded attempts: $failure_kind" >&2
            exit 1
          fi

          echo "Snapcraft installed"
          {
            echo "install_status=success"
            echo "failure_kind=none"
          } >> "$GITHUB_OUTPUT"
      
      - name: Get Snapcraft version
        id: version
        if: ${{ always() && steps.install.outputs.install_status == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          VERSION="$(timeout 60s snapcraft --version | awk 'NR == 1 { print $2 }')"
          [[ "$VERSION" =~ ^[0-9]+([.][0-9A-Za-z]+)*([+-][0-9A-Za-z.-]+)?$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected Snapcraft version: $VERSION"
      
      - name: Test 1 - Check Binary Exists
        id: test1
        if: always()
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local rc="$1"
            trap - EXIT
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish "$?"' EXIT

          if [ "${{ steps.install.outputs.install_status || 'failed' }}" = success ] && command -v snapcraft > /dev/null 2>&1; then
            echo "✓ snapcraft binary found"
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "✗ snapcraft binary not found"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          finish 0
      
      - name: Test 2 - Check Version
        id: test2
        if: ${{ always() && steps.install.outputs.install_status == 'success' }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local rc="$1"
            trap - EXIT
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish "$?"' EXIT
          if timeout 60s snapcraft --version | grep -qi "snapcraft" && [ "${{ steps.version.outcome }}" = success ]; then
            echo "✓ snapcraft version works"
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "✗ snapcraft version failed"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          finish 0
      
      - name: Test 3 - Check Installed Snap Metadata
        id: test3
        if: ${{ always() && steps.install.outputs.install_status == 'success' }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local rc="$1"
            trap - EXIT
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish "$?"' EXIT
          SNAP_MOUNT="$(readlink -f /snap/snapcraft/current)"
          timeout --kill-after=5s 30s snap list snapcraft | tee "$RUNNER_TEMP/snapcraft-list.txt"
          [ -d "$SNAP_MOUNT" ]
          [ -s "$SNAP_MOUNT/meta/snap.yaml" ]
          grep -Eq '^snapcraft[[:space:]]' "$RUNNER_TEMP/snapcraft-list.txt"
          grep -Eq '^name:[[:space:]]+snapcraft$' "$SNAP_MOUNT/meta/snap.yaml"
          echo "status=passed" >> "$GITHUB_OUTPUT"
          finish 0
      
      
      - name: Test 4 - Architecture Verification
        id: test4
        if: ${{ always() && steps.install.outputs.install_status == 'success' }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local rc="$1"
            trap - EXIT
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish "$?"' EXIT
          [ "$(uname -m)" = aarch64 ]
          SNAP_MOUNT="$(readlink -f /snap/snapcraft/current)"
          [ -d "$SNAP_MOUNT" ]
          verified=0
          while IFS= read -r candidate; do
            if readelf -h "$candidate" 2>/dev/null | grep -Eq 'Machine:[[:space:]]+AArch64'; then
              echo "Verified AArch64 Snapcraft payload: $candidate"
              verified=1
              break
            fi
          done < <(find "$SNAP_MOUNT" -type f -perm -111 -print | LC_ALL=C sort)
          [ "$verified" -eq 1 ]
          echo "status=passed" >> "$GITHUB_OUTPUT"
          finish 0

      - name: Test 5 - Functional Validation
        id: test5
        if: ${{ always() && steps.install.outputs.install_status == 'success' }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local rc="$1"
            trap - EXIT
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish "$?"' EXIT
          if { timeout 60s snapcraft plugins > snapcraft-plugins.txt || timeout 60s snapcraft list-plugins > snapcraft-plugins.txt; } && [ -s snapcraft-plugins.txt ]; then
            echo "✓ snapcraft listed available plugins"
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "✗ snapcraft plugin listing failed"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          finish 0

      - name: Regression applicability - package manager installed
        id: test6
        if: always()
        run: |
          set -euo pipefail
          CURRENT="${{ steps.version.outputs.version || 'unknown' }}"
          if [ "${{ steps.install.outputs.install_status || 'failed' }}" != success ]; then
            {
              echo "current_version=unknown"
              echo "latest_version=not_checked"
              echo "next_installed_version=not_installed"
              echo "decision=baseline_install_failed"
              echo "regression_result=Regression validation not run because Snapcraft installation failed."
              echo "comparison=The baseline package must install before a next-version comparison is trustworthy."
            } >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.test1.outputs.status }}" = passed ] && \
               [ "${{ steps.test2.outputs.status }}" = passed ] && \
               [ "${{ steps.test3.outputs.status }}" = passed ] && \
               [ "${{ steps.test4.outputs.status }}" = passed ] && \
               [ "${{ steps.test5.outputs.status }}" = passed ] && \
               [ "$CURRENT" != unknown ]; then
            {
              echo "current_version=$CURRENT"
              echo "latest_version=not_applicable"
              echo "next_installed_version=not_applicable"
              echo "decision=not_applicable_package_manager"
              echo "regression_result=Regression validation not applicable: tested package installed via package manager in Tests 1-5"
              echo "comparison=The tested package is installed via a package manager in Tests 1-5, so version-to-version regression validation is not shown under the current policy."
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "current_version=$CURRENT"
              echo "latest_version=not_checked"
              echo "next_installed_version=not_installed"
              echo "decision=baseline_failed"
              echo "regression_result=Regression validation not run because Snapcraft baseline validation failed."
              echo "comparison=All five baseline checks must pass before a next-version comparison is trustworthy."
            } >> "$GITHUB_OUTPUT"
          fi
          {
            echo "status=skipped"
            echo "duration=0"
          } >> "$GITHUB_OUTPUT"

      - name: Emit package result
        if: always()
        id: summary
        uses: ./.github/actions/emit-package-result
        with:
          package_slug: snapcraft
          package_name: Canonical Snapcraft
          version: ${{ steps.version.outputs.version || 'unknown' }}
          install_status: ${{ steps.install.outputs.install_status || 'failed' }}
          test1_label: Test 1 - Check Snapcraft binary exists
          test2_label: Test 2 - Check Snapcraft version
          test3_label: Test 3 - Check installed Snap metadata
          test4_label: Test 4 - Verify installed AArch64 payload
          test5_label: Test 5 - Functional plugin listing
          test1_status: ${{ steps.test1.outputs.status || 'skipped' }}
          test2_status: ${{ steps.test2.outputs.status || 'skipped' }}
          test3_status: ${{ steps.test3.outputs.status || 'skipped' }}
          test4_status: ${{ steps.test4.outputs.status || 'skipped' }}
          test5_status: ${{ steps.test5.outputs.status || 'skipped' }}
          test6_status: ${{ steps.test6.outputs.status || 'skipped' }}
          test1_duration: ${{ steps.test1.outputs.duration || 0 }}
          test2_duration: ${{ steps.test2.outputs.duration || 0 }}
          test3_duration: ${{ steps.test3.outputs.duration || 0 }}
          test4_duration: ${{ steps.test4.outputs.duration || 0 }}
          test5_duration: ${{ steps.test5.outputs.duration || 0 }}
          test6_duration: ${{ steps.test6.outputs.duration || 0 }}
          regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
          regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
          regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
          regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
          regression_result: ${{ steps.test6.outputs.regression_result || 'Regression result unavailable.' }}
          regression_details: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}

      - name: Enforce failure status
        if: always()
        run: |
          if [ "${{ steps.summary.outputs.should_fail }}" = "1" ]; then
            exit 1
          fi

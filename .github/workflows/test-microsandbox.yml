name: Test Microsandbox hosted Arm64 health

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-microsandbox.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-microsandbox.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-microsandbox.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-microsandbox.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-microsandbox.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-microsandbox.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-microsandbox.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-microsandbox.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-microsandbox.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-microsandbox.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-microsandbox.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-microsandbox.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-microsandbox.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-microsandbox.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-microsandbox.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-microsandbox.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-microsandbox.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-microsandbox.outputs.regression_next_installed_version }}
      regression_policy:
        description: Explicit newer-version runtime validation policy
        value: ${{ jobs.test-microsandbox.outputs.regression_policy }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-microsandbox.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-microsandbox.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-microsandbox.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-microsandbox.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-microsandbox.outputs.timestamp }}
jobs:
  test-microsandbox:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    env:
      LC_ALL: C
      BASELINE_VERSION: "0.7.11"
      BUNDLE_SHA256: "ab1c371e85ff101581b7cf092dbaad6f5b720736ca042aa0d6d4b950f57d6709"
    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'Microsandbox'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '5' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '5' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'failed' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'baseline_failed' }}
      regression_result: ${{ steps.test6.outputs.regression_result || 'No regression validation evidence.' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'No regression validation evidence.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'not_selected' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      regression_policy: runtime_validation_not_automated
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          # shellcheck disable=SC2129
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=microsandbox" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/linux/opensource_packages/microsandbox" >> "$GITHUB_OUTPUT"

      - name: Install checksum-pinned native Microsandbox runtime pair
        id: install
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          bash .github/actions/apt-bootstrap/bootstrap.sh \
            --packages "curl ca-certificates binutils python3" --no-install-recommends true
          HOME_DIR="$RUNNER_TEMP/microsandbox-smoke"
          BUNDLE="$HOME_DIR/runtime"
          mkdir -p "$BUNDLE"
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 \
            --output "$RUNNER_TEMP/microsandbox.tar.gz" \
            "https://github.com/superradcompany/microsandbox/releases/download/v$BASELINE_VERSION/microsandbox-linux-aarch64.tar.gz"
          echo "$BUNDLE_SHA256  $RUNNER_TEMP/microsandbox.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/microsandbox.tar.gz" -C "$BUNDLE"
          test -x "$BUNDLE/msb"
          test -f "$BUNDLE/libkrunfw.so.5.6.1"
          {
            echo "MSB_HOME=$HOME_DIR"
            echo "MSB_PATH=$BUNDLE/msb"
            echo "MSB_LIBKRUNFW_PATH=$BUNDLE/libkrunfw.so.5.6.1"
          } >> "$GITHUB_ENV"
          echo "install_status=success" >> "$GITHUB_OUTPUT"

      - name: Verify installed executable version (not a runtime pass)
        id: version
        run: |
          set -euo pipefail
          REPORTED=$(timeout 15s "$MSB_PATH" --version)
          VERSION=$(printf '%s\n' "$REPORTED" | sed -nE 's/^(msb|microsandbox) ([0-9]+\.[0-9]+\.[0-9]+)$/\2/p')
          test "$VERSION" = "$BASELINE_VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test 1 - Native executable, firmware and ABI identity
        id: test1
        if: always() && steps.install.outcome == 'success' && steps.version.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$SECONDS
          finish_test() {
            local rc=$? status=failed
            trap - EXIT
            if declare -F cleanup >/dev/null; then cleanup; fi
            if [ "$rc" -eq 0 ]; then status=passed; fi
            echo "status=$status" >> "$GITHUB_OUTPUT"
            echo "duration=$((SECONDS - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish_test EXIT
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64
          for binary in "$MSB_PATH" "$MSB_LIBKRUNFW_PATH"; do
            readelf -h "$binary" | grep -Eq 'Machine: +AArch64'
          done
          readelf -l "$MSB_PATH" \
            | grep -F '[Requesting program interpreter: /lib/ld-linux-aarch64.so.1]'
          readelf -d "$MSB_LIBKRUNFW_PATH" | grep -F 'Library soname: [libkrunfw.so.5]'

      - name: Test 2 - Execute and verify the launch protocol contract
        id: test2
        if: always() && steps.install.outcome == 'success' && steps.version.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$SECONDS
          finish_test() {
            local rc=$? status=failed
            trap - EXIT
            if declare -F cleanup >/dev/null; then cleanup; fi
            if [ "$rc" -eq 0 ]; then status=passed; fi
            echo "status=$status" >> "$GITHUB_OUTPUT"
            echo "duration=$((SECONDS - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish_test EXIT
          PROTOCOL_JSON=$(timeout 15s "$MSB_PATH" __launch-protocol)
          python3 - "$PROTOCOL_JSON" <<'PY'
          import json
          import sys

          document = json.loads(sys.argv[1])
          if document.get("protocols") != [2, 1]:
              raise SystemExit("unexpected launch protocol versions")
          required_true = {
              "required_restore_backing",
              "tcp_accept_queue_size",
              "guest_clock",
              "fs_state_limit",
              "exec_limits",
          }
          if any(document.get(key) is not True for key in required_true):
              raise SystemExit("required launch capability is missing")
          if not all(isinstance(value, (bool, list)) for value in document.values()):
              raise SystemExit("launch capability document has an unexpected value type")
          PY

      - name: Test 3 - Execute and verify schema compatibility metadata
        id: test3
        if: always() && steps.install.outcome == 'success' && steps.version.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$SECONDS
          finish_test() {
            local rc=$? status=failed
            trap - EXIT
            if declare -F cleanup >/dev/null; then cleanup; fi
            if [ "$rc" -eq 0 ]; then status=passed; fi
            echo "status=$status" >> "$GITHUB_OUTPUT"
            echo "duration=$((SECONDS - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish_test EXIT
          SCHEMA_JSON=$(timeout 15s "$MSB_PATH" __schema-baseline --json)
          python3 - "$SCHEMA_JSON" "$BASELINE_VERSION" <<'PY'
          import json
          import re
          import sys

          document = json.loads(sys.argv[1])
          expected_version = sys.argv[2]
          if document.get("schema_baseline_version") != 1:
              raise SystemExit("unexpected schema baseline format")
          if document.get("msb_version") != expected_version:
              raise SystemExit("schema metadata does not match the installed release")
          if document.get("downgrade_floor") != "0.6.0":
              raise SystemExit("unexpected downgrade floor")
          migrations = document.get("migrations")
          if not isinstance(migrations, list) or not migrations:
              raise SystemExit("schema migration inventory is empty")
          if len(migrations) != len(set(migrations)):
              raise SystemExit("schema migration inventory contains duplicates")
          pattern = re.compile(r"^m[0-9]{8}_[0-9]{6}_[a-z0-9_]+$")
          if any(not isinstance(item, str) or not pattern.fullmatch(item) for item in migrations):
              raise SystemExit("schema migration inventory is malformed")
          PY

      - name: Test 4 - Create and observe persistent local volume state
        id: test4
        if: always() && steps.install.outcome == 'success' && steps.version.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$SECONDS
          finish_test() {
            local rc=$? status=failed
            trap - EXIT
            if declare -F cleanup >/dev/null; then cleanup; fi
            if [ "$rc" -eq 0 ]; then status=passed; fi
            echo "status=$status" >> "$GITHUB_OUTPUT"
            echo "duration=$((SECONDS - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish_test EXIT
          VOLUME_NAME=arm-hosted-smoke
          timeout 30s "$MSB_PATH" volume create --quiet "$VOLUME_NAME"
          VOLUMES_JSON=$(timeout 15s "$MSB_PATH" volume list --format json)
          python3 - "$VOLUMES_JSON" "$VOLUME_NAME" <<'PY'
          import json
          import sys

          volumes = json.loads(sys.argv[1])
          expected_name = sys.argv[2]
          matches = [item for item in volumes if item.get("name") == expected_name]
          if len(matches) != 1:
              raise SystemExit("created volume is not uniquely observable")
          volume = matches[0]
          if volume.get("kind") != "dir":
              raise SystemExit("created volume has the wrong storage kind")
          if volume.get("created_at") in (None, ""):
              raise SystemExit("created volume has no creation timestamp")
          PY

      - name: Test 5 - Remove local volume state and reject stale lookup
        id: test5
        if: always() && steps.install.outcome == 'success' && steps.version.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$SECONDS
          finish_test() {
            local rc=$? status=failed
            trap - EXIT
            if declare -F cleanup >/dev/null; then cleanup; fi
            if [ "$rc" -eq 0 ]; then status=passed; fi
            echo "status=$status" >> "$GITHUB_OUTPUT"
            echo "duration=$((SECONDS - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish_test EXIT
          VOLUME_NAME=arm-hosted-smoke
          BEFORE_JSON=$(timeout 15s "$MSB_PATH" volume list --format json)
          python3 - "$BEFORE_JSON" "$VOLUME_NAME" <<'PY'
          import json
          import sys

          matches = [item for item in json.loads(sys.argv[1]) if item.get("name") == sys.argv[2]]
          if len(matches) != 1:
              raise SystemExit("expected volume state from Test 4 is missing or duplicated")
          PY
          timeout 30s "$MSB_PATH" volume remove --quiet "$VOLUME_NAME"
          AFTER_JSON=$(timeout 15s "$MSB_PATH" volume list --format json)
          python3 - "$AFTER_JSON" "$VOLUME_NAME" <<'PY'
          import json
          import sys

          if any(item.get("name") == sys.argv[2] for item in json.loads(sys.argv[1])):
              raise SystemExit("removed volume remains observable")
          PY
          set +e
          timeout 15s "$MSB_PATH" volume remove --quiet "$VOLUME_NAME" \
            >"$RUNNER_TEMP/microsandbox-stale-volume.stdout" \
            2>"$RUNNER_TEMP/microsandbox-stale-volume.stderr"
          STALE_RC=$?
          set -e
          test "$STALE_RC" -ne 0

      - name: Regression policy - explicit runtime-validation deferral
        id: test6
        if: always()
        env:
          CURRENT_VERSION: ${{ steps.version.outputs.version || 'unknown' }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          INSTALL_STATUS: ${{ steps.install.outputs.install_status }}
          VERSION_OUTCOME: ${{ steps.version.outcome }}
          CORE_RESULTS: "${{ steps.test1.outcome }}:${{ steps.test1.outputs.status }} ${{ steps.test2.outcome }}:${{ steps.test2.outputs.status }} ${{ steps.test3.outcome }}:${{ steps.test3.outputs.status }} ${{ steps.test4.outcome }}:${{ steps.test4.outputs.status }} ${{ steps.test5.outcome }}:${{ steps.test5.outputs.status }}"
        run: |
          set -euo pipefail
          DECISION=runtime_validation_not_automated
          RESULT="Newer-version runtime validation not automated; no candidate installed or compared"
          COMPARISON="Hosted Arm64 validates the shipped bundle, executable protocol and schema contracts, and local volume state. Real guest behavior is validated separately by the protected supplemental KVM lane. No latest-version pass is inferred."
          if [ "$INSTALL_OUTCOME" != success ] || [ "$INSTALL_STATUS" != success ] \
            || [ "$VERSION_OUTCOME" != success ] || [ -z "$CURRENT_VERSION" ] || [ "$CURRENT_VERSION" = unknown ]; then
            DECISION=baseline_install_failed
            RESULT="Baseline installation or package version verification failed"
            COMPARISON="Baseline evidence is incomplete; no passing smoke result or next-version comparison is asserted."
          elif [ "$CORE_RESULTS" != "success:passed success:passed success:passed success:passed success:passed" ]; then
            DECISION=baseline_failed
            RESULT="Baseline smoke validation failed or is incomplete"
            COMPARISON="Tests 1-5 did not all pass; the workflow remains failed and incomplete evidence cannot be published."
          fi
          {
            echo "current_version=$CURRENT_VERSION"
            echo "latest_version=not_checked"
            echo "next_installed_version=not_installed"
            echo "decision=$DECISION"
            echo "regression_result=$RESULT"
            echo "comparison=$COMPARISON"
            echo "status=skipped"
            echo "duration=0"
          } >> "$GITHUB_OUTPUT"

      - name: Calculate test summary
        if: always()
        id: summary
        run: |
          set -euo pipefail
          # shellcheck disable=SC2129
          PASSED=0
          FAILED=0
          SKIPPED=0
          CORE_FAILED=0
          CORE_PASSED=0
          TOTAL_DURATION=0

          check_test() {
            local status="$1" outcome="$2" duration="$3" core="$4"
            if { [ "$outcome" = skipped ] || [ -z "$outcome" ]; } && [ "$core" -eq 0 ]; then
              SKIPPED=$((SKIPPED + 1))
            elif [ "$outcome" = success ] && [ "$core" -eq 0 ] \
              && [ "$status" = skipped ] \
              && [[ "${{ steps.test6.outputs.decision }}" =~ ^(runtime_validation_not_automated|baseline_failed|baseline_install_failed)$ ]]; then
              SKIPPED=$((SKIPPED + 1))
            elif [ "$outcome" = success ] && [ "$status" = passed ] && [ "$core" -eq 1 ]; then
              PASSED=$((PASSED + 1))
              CORE_PASSED=$((CORE_PASSED + 1))
            else
              FAILED=$((FAILED + 1))
              CORE_FAILED=$((CORE_FAILED + core))
            fi
            [[ "$duration" =~ ^[0-9]+$ ]] || duration=0
            TOTAL_DURATION=$((TOTAL_DURATION + 10#$duration))
          }

          check_test "${{ steps.test1.outputs.status }}" "${{ steps.test1.outcome }}" "${{ steps.test1.outputs.duration || 0 }}" 1
          check_test "${{ steps.test2.outputs.status }}" "${{ steps.test2.outcome }}" "${{ steps.test2.outputs.duration || 0 }}" 1
          check_test "${{ steps.test3.outputs.status }}" "${{ steps.test3.outcome }}" "${{ steps.test3.outputs.duration || 0 }}" 1
          check_test "${{ steps.test4.outputs.status }}" "${{ steps.test4.outcome }}" "${{ steps.test4.outputs.duration || 0 }}" 1
          check_test "${{ steps.test5.outputs.status }}" "${{ steps.test5.outcome }}" "${{ steps.test5.outputs.duration || 0 }}" 1
          check_test "${{ steps.test6.outputs.status }}" "${{ steps.test6.outcome }}" "${{ steps.test6.outputs.duration || 0 }}" 0

          {
            echo "passed=$PASSED"
            echo "failed=$FAILED"
            echo "skipped=$SKIPPED"
            echo "core_failed=$CORE_FAILED"
            echo "duration=$TOTAL_DURATION"
          } >> "$GITHUB_OUTPUT"

          if [ "$CORE_PASSED" -eq 5 ] && [ "$FAILED" -eq 0 ] \
            && [ "${{ steps.install.outcome }}" = success ] \
            && [ "${{ steps.install.outputs.install_status }}" = success ] \
            && [ "${{ steps.version.outcome }}" = success ] \
            && [ "${{ steps.version.outputs.version }}" = "$BASELINE_VERSION" ] \
            && [ "${{ steps.test6.outcome }}" = success ] \
            && [ "${{ steps.test6.outputs.status }}" = skipped ] \
            && [ "${{ steps.test6.outputs.decision }}" = runtime_validation_not_automated ]; then
            {
              echo "overall_status=success"
              echo "badge_status=passing"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "overall_status=failure"
              echo "badge_status=failing"
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Create test summary
        if: always()
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version || 'unknown' }}
          STATUS: ${{ steps.summary.outputs.overall_status || 'failure' }}
          PASSED: ${{ steps.summary.outputs.passed || '0' }}
          FAILED: ${{ steps.summary.outputs.failed || '0' }}
          SKIPPED: ${{ steps.summary.outputs.skipped || '0' }}
          REGRESSION_DECISION: ${{ steps.test6.outputs.decision || 'unknown' }}
        run: |
          {
            echo "## Microsandbox recurring hosted Arm64 health"
            echo "- Installed package version: $PACKAGE_VERSION"
            echo "- Status: $STATUS"
            echo "- Passed: $PASSED; failed: $FAILED; skipped: $SKIPPED"
            echo "- Scope: checksum-pinned AArch64 bundle and ABI, executable launch/schema contracts, and local volume state transitions."
            echo "- This recurring workflow does not claim a guest boot. Real guest execution is a separate protected-main supplemental KVM workflow."
            echo "- Regression decision: $REGRESSION_DECISION"
          } >> "$GITHUB_STEP_SUMMARY"

name: Test Apache Accumulo on Arm64

permissions:
  contents: read

on:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-accumulo.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-accumulo.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-accumulo.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-accumulo.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-accumulo.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-accumulo.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-accumulo.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-accumulo.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-accumulo.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-accumulo.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-accumulo.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-accumulo.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-accumulo.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-accumulo.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-accumulo.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-accumulo.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-accumulo.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-accumulo.outputs.regression_next_installed_version }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-accumulo.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-accumulo.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-accumulo.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-accumulo.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-accumulo.outputs.timestamp }}
jobs:
  test-accumulo:
    runs-on: ubuntu-24.04-arm
    env:
      ACCUMULO_VERSION: "2.1.4"
      ACCUMULO_NEXT_VERSION: "3.0.0"
    
    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'Apache Accumulo'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false
      
      - name: Set test metadata
        id: metadata
        run: |
          {
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "package_slug=accumulo"
            echo "dashboard_link=/opensource_packages/accumulo"
          } >> "$GITHUB_OUTPUT"
      - name: Prepare verified downloads and bounded CLI probes
        id: prepare
        run: |
          set -euo pipefail
          WORK=$(mktemp -d "$RUNNER_TEMP/accumulo-ci.XXXXXX")
          echo "ACCUMULO_WORK=$WORK" >> "$GITHUB_ENV"
          cat > "$WORK/AccumuloProbe.java" <<'JAVA'
          import java.io.*;
          import org.apache.accumulo.core.data.*;
          import org.apache.accumulo.core.security.ColumnVisibility;
          import org.apache.hadoop.io.Text;
          public class AccumuloProbe {
            public static void main(String[] args) throws Exception {
              Key key = new Key(new Text("row"), new Text("cf"), new Text("cq"));
              ByteArrayOutputStream bytes = new ByteArrayOutputStream();
              key.write(new DataOutputStream(bytes));
              Key copy = new Key();
              copy.readFields(new DataInputStream(new ByteArrayInputStream(bytes.toByteArray())));
              if (!key.equals(copy) || !new Range("row").contains(copy))
                throw new AssertionError("Key serialization/range failed");
              Mutation mutation = new Mutation("row");
              mutation.put("cf", "cq", new ColumnVisibility("A&B"), new Value("value"));
              bytes.reset();
              mutation.write(new DataOutputStream(bytes));
              Mutation restored = new Mutation();
              restored.readFields(new DataInputStream(new ByteArrayInputStream(bytes.toByteArray())));
              if (!mutation.equals(restored) || restored.size() != 1)
                throw new AssertionError("Mutation serialization failed");
              if (!"value".equals(new String(restored.getUpdates().get(0).getValue(),
                  java.nio.charset.StandardCharsets.UTF_8)))
                throw new AssertionError("Value round trip failed");
              System.out.println("Accumulo key/mutation round trip passed");
            }
          }
          JAVA
          cat > "$WORK/functions.sh" <<'BASH'
          download_verified() {
            local target="$1" digest="$2" url
            shift 2
            for url in "$@"; do
              echo "Downloading $url"
              if curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' \
                  --connect-timeout 10 --max-time 120 --retry 1 --retry-delay 2 \
                  --output "$target.part" "$url"; then
                if printf '%s  %s\n' "$digest" "$target.part" | sha512sum --check --status; then
                  mv "$target.part" "$target"
                  echo "Verified SHA-512: $digest"
                  return 0
                fi
                echo "::error::SHA-512 mismatch for $url"
                rm -f "$target.part"
                return 1
              fi
              rm -f "$target.part"
            done
            return 1
          }

          install_accumulo() {
            local version="$1" destination="$2" digest archive
            # SHA-512 values from https://archive.apache.org/dist/accumulo/<version>/
            # accumulo-<version>-bin.tar.gz.sha512. Central publishes the identical ASF release.
            case "$version" in
              2.1.4) digest=a752ff92e711ef09e07d34d4f0e18c51de67ef0b54d39470eda31dea4c2b40769efe35ef3a64b1706264493dfcacbfc0dfd2708bd54df1e9df110ad8d403c2c6 ;;
              3.0.0) digest=c992e7ce8073862057173bd1005af2c6b617e6ba2a1fb7f7f3e3aed0876dca6c87794257fe511863ffb9b7a641597bedad730673d4c504abc0ee88c78ecfed01 ;;
              *) echo "::error::No reviewed checksum for Accumulo $version"; return 1 ;;
            esac
            archive="$ACCUMULO_WORK/accumulo-$version-bin.tar.gz"
            download_verified "$archive" "$digest" \
              "https://archive.apache.org/dist/accumulo/$version/accumulo-$version-bin.tar.gz" \
              "https://repo.maven.apache.org/maven2/org/apache/accumulo/accumulo/$version/accumulo-$version-bin.tar.gz"
            mkdir -p "$destination"
            tar -xzf "$archive" --strip-components=1 -C "$destination"
            test -x "$destination/bin/accumulo"
            test -x "$destination/bin/accumulo-util"
          }

          probe() {
            local ordinal="$1" home="$2" version="$3" output properties
            # The upstream launcher uses ACCUMULO_CONF_DIR; isolate candidate configuration too.
            export ACCUMULO_HOME="$home" ACCUMULO_CONF_DIR="$home/conf"
            case "$ordinal" in
              1)
                test -x "$home/bin/accumulo"
                test -x "$home/bin/accumulo-util"
                properties=$(unzip -p "$home/lib/accumulo-core-$version.jar" \
                  META-INF/maven/org.apache.accumulo/accumulo-core/pom.properties)
                printf '%s\n' "$properties" | grep -Fx "version=$version"
                ;;
              2)
                output=$(timeout --kill-after=5s 30s "$home/bin/accumulo" version 2>&1) || { printf '%s\n' "$output"; return 1; }
                printf '%s\n' "$output"
                test "$output" = "$version"
                ;;
              3)
                output=$(timeout --kill-after=5s 30s "$home/bin/accumulo" help 2>&1) || { printf '%s\n' "$output"; return 1; }
                printf '%s\n' "$output"
                printf '%s\n' "$output" | grep -F 'Usage: accumulo'
                ;;
              4)
                timeout --kill-after=5s 90s "$home/bin/accumulo-util" build-native
                readelf -h "$home/lib/native/libaccumulo.so" | grep -E 'Machine:.*AArch64'
                ;;
              5)
                test "$(uname -m)" = aarch64
                mkdir -p "$home/probe"
                timeout --kill-after=5s 30s javac \
                  -cp "$home/lib/*:$HADOOP_HOME/share/hadoop/client/*" \
                  -d "$home/probe" "$ACCUMULO_WORK/AccumuloProbe.java"
                output=$(CLASSPATH="$home/probe" timeout --kill-after=5s 30s \
                  "$home/bin/accumulo" AccumuloProbe 2>&1) || { printf '%s\n' "$output"; return 1; }
                printf '%s\n' "$output"
                printf '%s\n' "$output" | grep -Fx 'Accumulo key/mutation round trip passed'
                ;;
              *) return 1 ;;
            esac
          }
          BASH

      - name: Install Apache Accumulo
        id: install
        continue-on-error: true
        run: |
          set -euo pipefail
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then echo "install_status=failed" >> "$GITHUB_OUTPUT"; fi' EXIT
          source "$ACCUMULO_WORK/functions.sh"
          bash .github/actions/apt-bootstrap/bootstrap.sh --packages \
            "openjdk-17-jdk-headless curl ca-certificates tar unzip build-essential libzookeeper-java libcommons-logging-java"
          export JAVA_HOME
          JAVA_HOME=$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")
          export HADOOP_HOME="$ACCUMULO_WORK/hadoop-client" ZOOKEEPER_HOME="$ACCUMULO_WORK/zookeeper"
          mkdir -p "$HADOOP_HOME/share/hadoop/client" "$HADOOP_HOME/etc/hadoop" "$ZOOKEEPER_HOME/lib"
          # The launcher needs the Hadoop client API/runtime, not a running HDFS server.
          # SHA-512 pins computed from Central's HTTPS artifacts and checked against its published .sha1 files.
          download_verified "$HADOOP_HOME/share/hadoop/client/hadoop-client-api-3.3.6.jar" \
            27de8c11698e9d4cc393c5854112a9e277b3e75b1e58ef3b559adbdcc33f29bcf37a23357c3d60efa402f5f2843e2130b83f8f14f0c80b450dadfdc4138788a7 \
            https://repo.maven.apache.org/maven2/org/apache/hadoop/hadoop-client-api/3.3.6/hadoop-client-api-3.3.6.jar
          download_verified "$HADOOP_HOME/share/hadoop/client/hadoop-client-runtime-3.3.6.jar" \
            edad3ff432785bb2ce50fa83431642fbbdb4c38d32d0df155c57b6ab81d1ad1773a3dc153a437367ce7745f3f6d0af6464b4ebbe1ffa5fe72d71e36170726bba \
            https://repo.maven.apache.org/maven2/org/apache/hadoop/hadoop-client-runtime/3.3.6/hadoop-client-runtime-3.3.6.jar
          for jar in zookeeper zookeeper-jute commons-logging; do
            test -r "/usr/share/java/$jar.jar"
            ln -s "/usr/share/java/$jar.jar" "$ZOOKEEPER_HOME/lib/$jar.jar"
          done
          {
            echo "JAVA_HOME=$JAVA_HOME"
            echo "HADOOP_HOME=$HADOOP_HOME"
            echo "ZOOKEEPER_HOME=$ZOOKEEPER_HOME"
          } >> "$GITHUB_ENV"
          install_accumulo "$ACCUMULO_VERSION" "$ACCUMULO_WORK/baseline"
          echo "install_status=success" >> "$GITHUB_OUTPUT"

      - name: Get Apache Accumulo version
        id: version
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "version=unknown" >> "$GITHUB_OUTPUT"
          test "${{ steps.install.outputs.install_status }}:${{ steps.install.outcome }}" = success:success
          source "$ACCUMULO_WORK/functions.sh"
          probe 2 "$ACCUMULO_WORK/baseline" "$ACCUMULO_VERSION"
          echo "version=$ACCUMULO_VERSION" >> "$GITHUB_OUTPUT"

      - name: Test 1 - Verify installed archive identity
        id: test1
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local rc="$1"
            trap - EXIT
            if [ "$rc" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish "$?"' EXIT
          test "${{ steps.install.outputs.install_status }}:${{ steps.install.outcome }}" = success:success
          source "$ACCUMULO_WORK/functions.sh"
          probe 1 "$ACCUMULO_WORK/baseline" "$ACCUMULO_VERSION"
          finish 0

      - name: Test 2 - Execute exact baseline version
        id: test2
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local rc="$1"
            trap - EXIT
            if [ "$rc" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish "$?"' EXIT
          test "${{ steps.install.outputs.install_status }}:${{ steps.install.outcome }}" = success:success
          source "$ACCUMULO_WORK/functions.sh"
          probe 2 "$ACCUMULO_WORK/baseline" "$ACCUMULO_VERSION"
          finish 0

      - name: Test 3 - Execute CLI help
        id: test3
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local rc="$1"
            trap - EXIT
            if [ "$rc" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish "$?"' EXIT
          test "${{ steps.install.outputs.install_status }}:${{ steps.install.outcome }}" = success:success
          source "$ACCUMULO_WORK/functions.sh"
          probe 3 "$ACCUMULO_WORK/baseline" "$ACCUMULO_VERSION"
          finish 0

      - name: Test 4 - Build Arm64 native library
        id: test4
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local rc="$1"
            trap - EXIT
            if [ "$rc" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish "$?"' EXIT
          test "${{ steps.install.outputs.install_status }}:${{ steps.install.outcome }}" = success:success
          source "$ACCUMULO_WORK/functions.sh"
          probe 4 "$ACCUMULO_WORK/baseline" "$ACCUMULO_VERSION"
          finish 0

      - name: Test 5 - Round-trip key and mutation data
        id: test5
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local rc="$1"
            trap - EXIT
            if [ "$rc" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish "$?"' EXIT
          test "${{ steps.install.outputs.install_status }}:${{ steps.install.outcome }}" = success:success
          source "$ACCUMULO_WORK/functions.sh"
          probe 5 "$ACCUMULO_WORK/baseline" "$ACCUMULO_VERSION"
          finish 0

      - name: Test 6 - Regression Validation
        id: test6
        if: always()
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          STATUS=failed
          DECISION=next_install_failed
          RESULT="Candidate installation or bounded runtime validation failed"
          COMPARISON="Candidate $ACCUMULO_NEXT_VERSION did not complete the five bounded CLI checks."
          NEXT_INSTALLED=not_installed
          finish() {
            local rc="$1"
            trap - EXIT
            if [ "$rc" -ne 0 ]; then
              STATUS=failed
              DECISION=next_install_failed
              RESULT="Candidate installation or bounded runtime validation failed"
              COMPARISON="Candidate $ACCUMULO_NEXT_VERSION did not complete the five bounded CLI checks."
            fi
            case "$DECISION:$STATUS" in
              baseline_failed:skipped)
                echo "decision=baseline_failed" >> "$GITHUB_OUTPUT"
                echo "status=skipped" >> "$GITHUB_OUTPUT"
                ;;
              next_install_validated:passed)
                echo "decision=next_install_validated" >> "$GITHUB_OUTPUT"
                echo "status=passed" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "decision=next_install_failed" >> "$GITHUB_OUTPUT"
                echo "status=failed" >> "$GITHUB_OUTPUT"
                ;;
            esac
            {
              echo "regression_result=$RESULT"
              echo "comparison=$COMPARISON"
              echo "next_installed_version=$NEXT_INSTALLED"
            } >> "$GITHUB_OUTPUT"
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish "$?"' EXIT
          echo "current_version=${{ steps.version.outputs.version || 'unknown' }}" >> "$GITHUB_OUTPUT"
          echo "latest_version=$ACCUMULO_NEXT_VERSION" >> "$GITHUB_OUTPUT"
          for status in \
            "${{ steps.install.outputs.install_status }}:${{ steps.install.outcome }}" \
            "${{ steps.test1.outputs.status }}:${{ steps.test1.outcome }}" \
            "${{ steps.test2.outputs.status }}:${{ steps.test2.outcome }}" \
            "${{ steps.test3.outputs.status }}:${{ steps.test3.outcome }}" \
            "${{ steps.test4.outputs.status }}:${{ steps.test4.outcome }}" \
            "${{ steps.test5.outputs.status }}:${{ steps.test5.outcome }}"; do
            if [ "$status" != success:success ] && [ "$status" != passed:success ]; then
              STATUS=skipped
              DECISION=baseline_failed
              RESULT="Candidate validation skipped because baseline checks failed"
              COMPARISON="Baseline $ACCUMULO_VERSION did not pass all five required checks; candidate was not installed."
              exit 0
            fi
          done
          test "${{ steps.version.outputs.version }}" = "$ACCUMULO_VERSION"
          test "$ACCUMULO_VERSION" != "$ACCUMULO_NEXT_VERSION"
          source "$ACCUMULO_WORK/functions.sh"
          install_accumulo "$ACCUMULO_NEXT_VERSION" "$ACCUMULO_WORK/candidate"
          for ordinal in 1 2 3 4 5; do
            probe "$ordinal" "$ACCUMULO_WORK/candidate" "$ACCUMULO_NEXT_VERSION"
            if [ "$ordinal" = 2 ]; then NEXT_INSTALLED="$ACCUMULO_NEXT_VERSION"; fi
          done
          STATUS=passed
          DECISION=next_install_validated
          RESULT="Candidate installed and passed bounded CLI validation on Arm64"
          COMPARISON="Baseline $ACCUMULO_VERSION and candidate $ACCUMULO_NEXT_VERSION passed identity, version, help, native build, and local key/mutation serialization checks. No cluster or upgrade compatibility was tested."
          finish 0

      - name: Calculate test summary
        id: summary
        if: always()
        run: |
          set -euo pipefail
          PASSED=0
          FAILED=0
          SKIPPED=0
          CORE_FAILED=0
          TOTAL_DURATION=0
          check_core_test() {
            if [ "$1" = passed ] && [ "$2" = success ]; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
              CORE_FAILED=$((CORE_FAILED + 1))
            fi
            TOTAL_DURATION=$((TOTAL_DURATION + $3))
          }
          check_core_test "${{ steps.test1.outputs.status }}" "${{ steps.test1.outcome }}" "${{ steps.test1.outputs.duration || 0 }}"
          check_core_test "${{ steps.test2.outputs.status }}" "${{ steps.test2.outcome }}" "${{ steps.test2.outputs.duration || 0 }}"
          check_core_test "${{ steps.test3.outputs.status }}" "${{ steps.test3.outcome }}" "${{ steps.test3.outputs.duration || 0 }}"
          check_core_test "${{ steps.test4.outputs.status }}" "${{ steps.test4.outcome }}" "${{ steps.test4.outputs.duration || 0 }}"
          check_core_test "${{ steps.test5.outputs.status }}" "${{ steps.test5.outcome }}" "${{ steps.test5.outputs.duration || 0 }}"
          if [ "${{ steps.test6.outputs.status }}" = passed ] && \
              [ "${{ steps.test6.outcome }}" = success ] && \
              [ "${{ steps.test6.outputs.decision }}" = next_install_validated ]; then
            PASSED=$((PASSED + 1))
          elif [ "${{ steps.test6.outputs.status }}" = skipped ] && \
              [ "${{ steps.test6.outcome }}" = success ] && \
              [ "${{ steps.test6.outputs.decision }}" = baseline_failed ] && [ "$CORE_FAILED" -gt 0 ]; then
            SKIPPED=1
          else
            FAILED=$((FAILED + 1))
          fi
          TOTAL_DURATION=$((TOTAL_DURATION + ${{ steps.test6.outputs.duration || 0 }}))
          {
            echo "passed=$PASSED"
            echo "failed=$FAILED"
            echo "skipped=$SKIPPED"
            echo "core_failed=$CORE_FAILED"
            echo "duration=$TOTAL_DURATION"
          } >> "$GITHUB_OUTPUT"
          if [ "$PASSED" -eq 6 ] && [ "${{ steps.install.outputs.install_status }}" = success ]; then
            echo "overall_status=success" >> "$GITHUB_OUTPUT"
            echo "badge_status=passing" >> "$GITHUB_OUTPUT"
          else
            echo "overall_status=failure" >> "$GITHUB_OUTPUT"
            echo "badge_status=failing" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Create test summary
        if: always()
        run: |
          {
            echo "## Apache Accumulo Test Results"
            echo "- Baseline requested: $ACCUMULO_VERSION"
            echo "- Baseline runtime version: ${{ steps.version.outputs.version || 'unknown' }}"
            echo "- Status: ${{ steps.summary.outputs.overall_status }}"
            echo "- Tests: ${{ steps.summary.outputs.passed }} passed, ${{ steps.summary.outputs.failed }} failed, ${{ steps.summary.outputs.skipped }} skipped"
            echo "- Core failures: ${{ steps.summary.outputs.core_failed }}"
            echo "- Test 6: ${{ steps.test6.outputs.status }} / ${{ steps.test6.outputs.decision }}"
            echo "- Candidate runtime version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}"
            echo "- Comparison: ${{ steps.test6.outputs.comparison }}"
            echo "- Scope: bounded CLI and local serialization checks; no cluster or upgrade compatibility claim."
          } >> "$GITHUB_STEP_SUMMARY"

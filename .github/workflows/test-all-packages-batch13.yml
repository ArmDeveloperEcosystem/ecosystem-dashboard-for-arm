name: Test All Packages (Batch 13) on Arm64
run-name: Arm64 Batch 13 [${{ inputs.orchestration_id || format('manual-{0}-{1}', github.run_id, github.run_attempt) }}] [nonce:${{ inputs.dispatch_nonce || 'manual-only' }}] [prefetch:${{ (inputs.prefetch_run_id == '' && inputs.prefetch_artifact_name == '') && 'none' || 'present' }}]

on:
  workflow_dispatch:
    inputs:
      orchestration_id:
        description: Exact orchestrator identity; blank uses a safe manual fallback
        required: false
        default: ""
        type: string
      dispatch_nonce:
        description: Secret exact-dispatch nonce; blank is manual-only and not publishable
        required: false
        default: ""
        type: string
      expected_sha:
        description: Exact commit expected by the orchestrator
        required: false
        default: ""
        type: string
      expected_branch:
        description: Exact branch expected by the orchestrator
        required: false
        default: ""
        type: string
      prefetch_run_id:
        description: Orchestrator prefetch run id
        required: false
        default: ""
        type: string
      prefetch_artifact_name:
        description: Orchestrator prefetch artifact name
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      orchestration_id:
        required: true
        type: string
      dispatch_nonce:
        required: true
        type: string
      expected_sha:
        required: true
        type: string
      expected_branch:
        required: true
        type: string
      prefetch_run_id:
        required: false
        type: string
        default: ""
      prefetch_artifact_name:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:

  test-coredns:
    uses: ./.github/workflows/test-coredns.yml

  test-pants:
    uses: ./.github/workflows/test-pants.yml

  test-openfeature_python:
    uses: ./.github/workflows/test-openfeature_python.yml

  test-split-python-sdk:
    uses: ./.github/workflows/test-Split-Python-SDK.yml

  test-dqlite:
    uses: ./.github/workflows/test-dqlite.yml

  test-storm:
    uses: ./.github/workflows/test-storm.yml
    with:
      prefetch_run_id: ${{ inputs.prefetch_run_id || '' }}
      prefetch_artifact_name: ${{ inputs.prefetch_artifact_name || '' }}

  test-h2:
    uses: ./.github/workflows/test-H2.yml

  test-cri-o:
    uses: ./.github/workflows/test-cri-o.yml

  test-spack:
    uses: ./.github/workflows/test-spack.yml

  test-apache_thrift:
    uses: ./.github/workflows/test-apache_thrift.yml

  test-rubyonrails:
    uses: ./.github/workflows/test-rubyonrails.yml

  test-llama-index:
    uses: ./.github/workflows/test-llama-index.yml

  test-alertmanager:
    uses: ./.github/workflows/test-alertmanager.yml

  test-curl:
    uses: ./.github/workflows/test-curl.yml

  test-elastic-enterprise-search:
    uses: ./.github/workflows/test-elastic-enterprise-search.yml

  test-libopus:
    uses: ./.github/workflows/test-libopus.yml

  test-redpanda:
    uses: ./.github/workflows/test-redpanda.yml

  test-saspy:
    uses: ./.github/workflows/test-saspy.yml

  test-busybox:
    uses: ./.github/workflows/test-busybox.yml

  test-joomla:
    uses: ./.github/workflows/test-joomla.yml

  test-libvpx:
    uses: ./.github/workflows/test-libvpx.yml

  test-weaviate:
    uses: ./.github/workflows/test-weaviate.yml

  test-edot-dotnet-sdk:
    uses: ./.github/workflows/test-edot-dotnet-sdk.yml

  test-pytorch:
    uses: ./.github/workflows/test-pytorch.yml

  test-corosync:
    uses: ./.github/workflows/test-corosync.yml

  test-weavenet:
    uses: ./.github/workflows/test-weavenet.yml

  test-mezmo:
    uses: ./.github/workflows/test-mezmo.yml

  test-docker-ce:
    uses: ./.github/workflows/test-docker-ce.yml

  test-onednn:
    uses: ./.github/workflows/test-onednn.yml

  test-rook:
    uses: ./.github/workflows/test-rook.yml

  test-log4cpp:
    uses: ./.github/workflows/test-log4cpp.yml

  test-paddlelite:
    uses: ./.github/workflows/test-paddlelite.yml

  test-bishengjdk:
    uses: ./.github/workflows/test-bishengjdk.yml

  test-hiredis:
    uses: ./.github/workflows/test-hiredis.yml

  test-zed:
    uses: ./.github/workflows/test-zed.yml

  test-openresty:
    uses: ./.github/workflows/test-openresty.yml

  test-double-conversion:
    uses: ./.github/workflows/test-double-conversion.yml

  test-gatsby:
    uses: ./.github/workflows/test-gatsby.yml

  test-minio-os:
    uses: ./.github/workflows/test-minio-os.yml

  test-mayastor:
    uses: ./.github/workflows/test-mayastor.yml

  test-spicedb:
    uses: ./.github/workflows/test-spicedb.yml

  test-iguazio_nuclio:
    uses: ./.github/workflows/test-Iguazio_Nuclio.yml

  test-camelk:
    uses: ./.github/workflows/test-camelk.yml

  test-filebeat:
    uses: ./.github/workflows/test-filebeat.yml

  test-zookeeper:
    uses: ./.github/workflows/test-zookeeper.yml

  summary:
    permissions:
      actions: read
      contents: read
    needs:
      [
        test-coredns,
        test-pants,
        test-openfeature_python,
        test-split-python-sdk,
        test-dqlite,
        test-storm,
        test-h2,
        test-cri-o,
        test-spack,
        test-apache_thrift,
        test-rubyonrails,
        test-llama-index,
        test-alertmanager,
        test-curl,
        test-elastic-enterprise-search,
        test-libopus,
        test-redpanda,
        test-saspy,
        test-busybox,
        test-joomla,
        test-libvpx,
        test-weaviate,
        test-edot-dotnet-sdk,
        test-pytorch,
        test-corosync,
        test-weavenet,
        test-mezmo,
        test-docker-ce,
        test-onednn,
        test-rook,
        test-log4cpp,
        test-paddlelite,
        test-bishengjdk,
        test-hiredis,
        test-zed,
        test-openresty,
        test-double-conversion,
        test-gatsby,
        test-minio-os,
        test-mayastor,
        test-spicedb,
        test-iguazio_nuclio,
        test-camelk,
        test-filebeat,
        test-zookeeper
      ]
    runs-on: ubuntu-24.04-arm
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # original: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Collect batch results
        id: collect
        uses: ./.github/actions/collect-batch-results
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        with:
          batch_number: "13"
          batch_title: "Batch 13"

      - name: Attest complete batch results
        id: attest
        if: steps.collect.outcome == 'success'
        env:
          ARTIFACT_NAME: batch13-test-results
          BATCH_NUMBER: "13"
          COLLECTOR_JSON_COUNT: ${{ steps.collect.outputs.json_count }}
          CURRENT_BRANCH: ${{ github.ref_name }}
          DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
          EXPECTED_BRANCH: ${{ inputs.expected_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          NEEDS_JSON: ${{ toJson(needs) }}
          ORCHESTRATION_ID: ${{ inputs.orchestration_id }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/batch_artifact_attestation.py create \
            --results-root test-results \
            --workflow-file ".github/workflows/test-all-packages-batch13.yml" \
            --batch "$BATCH_NUMBER" \
            --repository "$REPOSITORY" \
            --expected-branch "$EXPECTED_BRANCH" \
            --current-branch "$CURRENT_BRANCH" \
            --expected-sha "$EXPECTED_SHA" \
            --workflow-sha "$WORKFLOW_SHA" \
            --orchestration-id "$ORCHESTRATION_ID" \
            --dispatch-nonce "$DISPATCH_NONCE" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --artifact-name "$ARTIFACT_NAME" \
            --collector-json-count "$COLLECTOR_JSON_COUNT" \
            --needs-environment-variable NEEDS_JSON

      - name: Upload batch test results
        if: steps.collect.outcome == 'success' && steps.attest.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # original: actions/upload-artifact@v4.6.2
        with:
          name: batch13-test-results
          path: test-results
          retention-days: 90

name: Test Flyte on Arm64

permissions:
  contents: read

on:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-flyte.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-flyte.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-flyte.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-flyte.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-flyte.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-flyte.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-flyte.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-flyte.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-flyte.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-flyte.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-flyte.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-flyte.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-flyte.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-flyte.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-flyte.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-flyte.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-flyte.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-flyte.outputs.regression_next_installed_version }}
      regression_policy:
        description: Regression applicability policy classification
        value: ${{ jobs.test-flyte.outputs.regression_policy }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-flyte.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-flyte.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-flyte.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-flyte.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-flyte.outputs.timestamp }}

jobs:
  test-flyte:
    runs-on: ubuntu-24.04-arm
    env:
      # Catalog 0.8.19 identifies flytectl/v0.8.19, not a Flyte control-plane tag.
      BASELINE_VERSION: "0.8.19"
      CANDIDATE_VERSION: "0.8.20"
      BASELINE_SHA256: "94859b273802c3179443b047b6a170dbbe784510d55ec208af4dcfbbe70cf6ac"
      CANDIDATE_SHA256: "b05523b42895d84ebeb97ba55d0f870fd84ff18ec74688ca614917ceeffb226c"
      FLYTEKIT_VERSION: "1.16.28"
      PACKAGE_PAGE: "content/linux/opensource_packages/flyte.md"

    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'Flyte'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      regression_policy: "applicable"
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=flyte" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/linux/opensource_packages/flyte" >> "$GITHUB_OUTPUT"

      - name: Bootstrap baseline dependencies
        uses: ./.github/actions/apt-bootstrap
        with:
          packages: "curl tar file ca-certificates python3-venv"
          quiet: "true"

      - name: Prepare isolated Flytectl checks
        id: prepare
        run: |
          set -euo pipefail
          FLYTE_WORK=$(mktemp -d "$RUNNER_TEMP/flyte.XXXXXX")
          echo "FLYTE_WORK=$FLYTE_WORK" >> "$GITHUB_ENV"
          cat > "$FLYTE_WORK/probe.py" <<'PY'
          import hashlib
          import importlib.metadata
          import io
          import json
          import os
          from pathlib import Path
          import platform
          import re
          import subprocess
          import sys
          import tarfile

          def run(args, **kwargs):
              try:
                  return subprocess.run(args, check=True, text=True, timeout=120, **kwargs)
              except subprocess.CalledProcessError as error:
                  if error.stdout:
                      print(error.stdout, file=sys.stderr)
                  if error.stderr:
                      print(error.stderr, file=sys.stderr)
                  raise

          def version(binary):
              result = run([str(binary), "version"], stdout=subprocess.PIPE)
              print(result.stdout, file=sys.stderr)
              # The CLI prints an upgrade notice before its JSON object.
              data, _ = json.JSONDecoder().raw_decode(result.stdout[result.stdout.index("{"):])
              if data.get("App") != "flytectl" or not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", data.get("Version", "")):
                  raise RuntimeError("Missing Flytectl runtime version")
              return data["Version"]

          def install(expected, digest, destination):
              if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", expected):
                  raise RuntimeError("Invalid component release version")
              destination.mkdir()
              archive = destination / "flytectl_Linux_arm64.tar.gz"
              checksums = destination / "checksums.txt"
              url = f"https://github.com/flyteorg/flyte/releases/download/flytectl/v{expected}"
              for path in (archive, checksums):
                  run(["curl", "--fail", "--show-error", "--location", "--retry", "2",
                       "--max-time", "90", f"{url}/{path.name}", "-o", str(path)])
              published = [line.split()[0] for line in checksums.read_text().splitlines()
                           if len(line.split()) == 2 and line.split()[1] == archive.name]
              if published != [digest] or hashlib.sha256(archive.read_bytes()).hexdigest() != digest:
                  raise RuntimeError("Release archive checksum mismatch")
              print(f"Verified flytectl/v{expected}: {url}/{archive.name} sha256={digest}", flush=True)
              run(["tar", "-xzf", str(archive), "-C", str(destination), "flytectl"])
              binary = destination / "flytectl"
              observed = version(binary)
              if observed != expected:
                  raise RuntimeError(f"Flytectl runtime version {observed} != {expected}")
              (destination / "identity.json").write_text(json.dumps({
                  "component": "flytectl", "release_tag": f"flytectl/v{expected}",
                  "version": observed, "archive_sha256": digest, "url": url,
                  "binary_sha256": hashlib.sha256(binary.read_bytes()).hexdigest(),
              }, indent=2))

          def architecture(binary):
              if platform.machine() != "aarch64":
                  raise RuntimeError("Flytectl runtime check requires native AArch64")
              result = run(["file", str(binary)], stdout=subprocess.PIPE)
              print(result.stdout, end="")
              if "ELF 64-bit" not in result.stdout or "ARM aarch64" not in result.stdout:
                  raise RuntimeError("Installed Flytectl is not an AArch64 ELF binary")

          def help_check(binary):
              result = run([str(binary), "--help"], stdout=subprocess.PIPE)
              print(result.stdout, end="")
              if "flytectl [command]" not in result.stdout or "compile" not in result.stdout:
                  raise RuntimeError("Missing Flytectl compile command")

          def smoke(binary, expected, destination):
              from flyteidl.admin.workflow_pb2 import WorkflowSpec

              if version(binary) != expected:
                  raise RuntimeError("Wrong Flytectl version for workflow compilation")
              sdk_version = importlib.metadata.version("flytekit")
              if sdk_version != os.environ["FLYTEKIT_VERSION"]:
                  raise RuntimeError(f"Wrong companion Flytekit version: {sdk_version}")
              print(f"Companion SDK flytekit={sdk_version}; installed CLI flytectl={expected}", flush=True)
              destination.mkdir()
              source = Path(__file__).with_name("workflow.py")
              (destination / source.name).write_bytes(source.read_bytes())
              run([sys.executable, "workflow.py"], cwd=destination)
              run([str(Path(sys.executable).with_name("pyflyte")), "--pkgs", "workflow",
                   "package", "--image", "example.invalid/flyte-smoke:local",
                   "--output", str(destination / "workflow.tgz")], cwd=destination)
              # Corrupt only the serialized task reference to exercise the real compiler.
              counts = {"_1.pb": 0, "_2.pb": 0, "_3.pb": 0}
              with tarfile.open(destination / "workflow.tgz") as source_archive, tarfile.open(destination / "invalid.tgz", "w:gz") as invalid:
                  for member in source_archive.getmembers():
                      if not member.isfile():
                          raise RuntimeError("Unexpected workflow package member")
                      data = source_archive.extractfile(member).read()
                      for suffix in counts:
                          if member.name.endswith(suffix):
                              counts[suffix] += 1
                      if member.name.endswith("_2.pb"):
                          spec = WorkflowSpec.FromString(data)
                          task_nodes = [node for node in spec.template.nodes if node.HasField("task_node")]
                          if len(task_nodes) != 1:
                              raise RuntimeError("Expected exactly one task node")
                          task_nodes[0].task_node.reference_id.name = "missing.task"
                          data = spec.SerializeToString()
                      member.size = len(data)
                      invalid.addfile(member, io.BytesIO(data))
              if list(counts.values()) != [1, 1, 1]:
                  raise RuntimeError(f"Expected one task, workflow and launch plan: {counts}")
              result = run([str(binary), "compile", "--file", str(destination / "workflow.tgz")],
                           stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              (destination / "compile.log").write_text(result.stdout)
              print(result.stdout, end="")
              if "All Workflows compiled successfully!" not in result.stdout:
                  raise RuntimeError("Missing workflow compilation result")
              for label in ("workflows", "Tasks", "Launch plans"):
                  if not re.search(rf"(?m)^1\s+{label} found in package$", result.stdout):
                      raise RuntimeError(f"Incorrect compiled {label} count")
              invalid_result = subprocess.run(
                  [str(binary), "compile", "--file", str(destination / "invalid.tgz")],
                  text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=120)
              (destination / "invalid.log").write_text(invalid_result.stdout)
              print(invalid_result.stdout, end="")
              if invalid_result.returncode == 0 or "TaskReferenceNotFound" not in invalid_result.stdout:
                  raise RuntimeError("Invalid task reference was not rejected by the workflow compiler")
              print("Validated CLI workflow compilation and invalid-graph rejection; SDK execution is local only.")

          if __name__ == "__main__":
              command, *args = sys.argv[1:]
              if command == "install":
                  install(args[0], args[1], Path(args[2]))
              elif command == "version":
                  print(version(Path(args[0])))
              elif command == "arch":
                  architecture(Path(args[0]))
              elif command == "help":
                  help_check(Path(args[0]))
              elif command == "smoke":
                  smoke(Path(args[0]), args[1], Path(args[2]))
              else:
                  raise RuntimeError(f"Unknown probe command: {command}")
          PY
          cat > "$FLYTE_WORK/workflow.py" <<'PY'
          from flytekit import task, workflow

          @task
          def add_one(value: int) -> int:
              return value + 1

          @workflow
          def wf(value: int) -> int:
              return add_one(value=value)

          if __name__ == "__main__":
              for value in (-1, 0, 41):
                  actual = wf(value=value)
                  if actual != value + 1:
                      raise RuntimeError(f"Workflow result {actual} != {value + 1}")
              print("Local workflow results: 0, 1, 42")
          PY

      - name: Install catalog Flytectl component
        id: install
        continue-on-error: true
        run: |
          set -euo pipefail
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then echo "install_status=failed" >> "$GITHUB_OUTPUT"; fi' EXIT
          python3 "$FLYTE_WORK/probe.py" install "$BASELINE_VERSION" "$BASELINE_SHA256" "$FLYTE_WORK/baseline"
          echo "install_status=success" >> "$GITHUB_OUTPUT"

      - name: Get installed Flytectl version
        id: version
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          VERSION=$(python3 "$FLYTE_WORK/probe.py" version "$FLYTE_WORK/baseline/flytectl")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          test "$VERSION" = "$BASELINE_VERSION"

      - name: Install pinned companion workflow SDK
        id: sdk
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 -m venv "$FLYTE_WORK/sdk"
          "$FLYTE_WORK/sdk/bin/python" -m pip install "flytekit==$FLYTEKIT_VERSION"
          "$FLYTE_WORK/sdk/bin/python" -m pip check
          "$FLYTE_WORK/sdk/bin/python" -m pip freeze > "$FLYTE_WORK/sdk-requirements.txt"

      - name: Test 1 - Installed Flytectl release
        id: test1
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"
          START_TIME=$(date +%s)
          trap 'rc=$?; STATUS=failed; if [ "$rc" -eq 0 ]; then STATUS=passed; fi; echo "status=$STATUS" >> "$GITHUB_OUTPUT"; echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"' EXIT
          test "${{ steps.install.outputs.install_status }}" = success
          test -x "$FLYTE_WORK/baseline/flytectl"
          test -s "$FLYTE_WORK/baseline/identity.json"
          cat "$FLYTE_WORK/baseline/identity.json"

      - name: Test 2 - Runtime version and catalog component alignment
        id: test2
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"
          START_TIME=$(date +%s)
          trap 'rc=$?; STATUS=failed; if [ "$rc" -eq 0 ]; then STATUS=passed; fi; echo "status=$STATUS" >> "$GITHUB_OUTPUT"; echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"' EXIT
          VERSION=$(python3 "$FLYTE_WORK/probe.py" version "$FLYTE_WORK/baseline/flytectl")
          echo "observed_version=$VERSION" >> "$GITHUB_OUTPUT"
          test "$VERSION" = "$BASELINE_VERSION"
          "$FLYTE_WORK/sdk/bin/python" - <<'PY'
          import os
          from pathlib import Path
          import yaml
          page = yaml.safe_load(Path(os.environ["PACKAGE_PAGE"]).read_text().split("---", 2)[1])
          if str(page["supported_minimum_version"]["version_number"]) != os.environ["BASELINE_VERSION"]:
              raise RuntimeError("Catalog baseline differs from installed Flytectl")
          release = page["optional_hidden_info"]["release_notes__supported_minimum"]
          expected = "https://github.com/flyteorg/flyte/releases/tag/flytectl%2Fv" + os.environ["BASELINE_VERSION"]
          if release != expected:
              raise RuntimeError("Catalog baseline does not identify the Flytectl component")
          PY

      - name: Test 3 - Installed CLI commands
        id: test3
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"
          START_TIME=$(date +%s)
          trap 'rc=$?; STATUS=failed; if [ "$rc" -eq 0 ]; then STATUS=passed; fi; echo "status=$STATUS" >> "$GITHUB_OUTPUT"; echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"' EXIT
          python3 "$FLYTE_WORK/probe.py" help "$FLYTE_WORK/baseline/flytectl"

      - name: Test 4 - Native Arm64 binary
        id: test4
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"
          START_TIME=$(date +%s)
          trap 'rc=$?; STATUS=failed; if [ "$rc" -eq 0 ]; then STATUS=passed; fi; echo "status=$STATUS" >> "$GITHUB_OUTPUT"; echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"' EXIT
          python3 "$FLYTE_WORK/probe.py" arch "$FLYTE_WORK/baseline/flytectl"

      - name: Test 5 - Workflow compilation and local execution
        id: test5
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"
          START_TIME=$(date +%s)
          trap 'rc=$?; STATUS=failed; if [ "$rc" -eq 0 ]; then STATUS=passed; fi; echo "status=$STATUS" >> "$GITHUB_OUTPUT"; echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"' EXIT
          test "${{ steps.sdk.outcome }}" = success
          "$FLYTE_WORK/sdk/bin/python" "$FLYTE_WORK/probe.py" smoke "$FLYTE_WORK/baseline/flytectl" "$BASELINE_VERSION" "$FLYTE_WORK/baseline-smoke"
          echo "note=Installed Flytectl $BASELINE_VERSION compiled a task/workflow/launch-plan package and rejected an invalid graph. Companion Flytekit $FLYTEKIT_VERSION executed the same workflow locally. No Kubernetes backend execution is claimed." >> "$GITHUB_OUTPUT"

      - name: Test 6 - Next Flytectl release regression
        id: test6
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"
          STATUS=failed
          DECISION=next_install_failed
          echo "decision=next_install_failed" >> "$GITHUB_OUTPUT"
          START_TIME=$(date +%s)
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then STATUS=failed; elif [ "$STATUS" != skipped ]; then STATUS=passed; fi; echo "status=$STATUS" >> "$GITHUB_OUTPUT"; echo "decision=$DECISION" >> "$GITHUB_OUTPUT"; echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"' EXIT
          echo "current_version=$BASELINE_VERSION" >> "$GITHUB_OUTPUT"
          echo "latest_version=$CANDIDATE_VERSION" >> "$GITHUB_OUTPUT"
          echo "next_installed_version=not_installed" >> "$GITHUB_OUTPUT"
          echo "regression_result=Flytectl candidate validation did not complete." >> "$GITHUB_OUTPUT"
          echo "comparison=Compare installed Flytectl $BASELINE_VERSION and $CANDIDATE_VERSION with identical workflow compilation and local SDK checks; no Kubernetes backend execution." >> "$GITHUB_OUTPUT"
          for RESULT in \
            "${{ steps.test1.outputs.status }}:${{ steps.test1.outcome }}" \
            "${{ steps.test2.outputs.status }}:${{ steps.test2.outcome }}" \
            "${{ steps.test3.outputs.status }}:${{ steps.test3.outcome }}" \
            "${{ steps.test4.outputs.status }}:${{ steps.test4.outcome }}" \
            "${{ steps.test5.outputs.status }}:${{ steps.test5.outcome }}"; do
            if [ "$RESULT" != "passed:success" ]; then
              STATUS=skipped
              DECISION=baseline_failed
              echo "status=skipped" >> "$GITHUB_OUTPUT"
              echo "decision=baseline_failed" >> "$GITHUB_OUTPUT"
              echo "regression_result=Flytectl candidate was not attempted because Tests 1-5 did not all pass." >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          python3 - <<'PY'
          import os
          baseline, candidate = (tuple(map(int, os.environ[key].split("."))) for key in ("BASELINE_VERSION", "CANDIDATE_VERSION"))
          if candidate <= baseline:
              raise RuntimeError("Candidate must be a newer Flytectl component release")
          PY
          python3 "$FLYTE_WORK/probe.py" install "$CANDIDATE_VERSION" "$CANDIDATE_SHA256" "$FLYTE_WORK/candidate"
          VERSION=$(python3 "$FLYTE_WORK/probe.py" version "$FLYTE_WORK/candidate/flytectl")
          test "$VERSION" = "$CANDIDATE_VERSION"
          echo "next_installed_version=$VERSION" >> "$GITHUB_OUTPUT"
          DECISION=limited_cpu_smoke_failed
          echo "decision=limited_cpu_smoke_failed" >> "$GITHUB_OUTPUT"
          python3 "$FLYTE_WORK/probe.py" help "$FLYTE_WORK/candidate/flytectl"
          python3 "$FLYTE_WORK/probe.py" arch "$FLYTE_WORK/candidate/flytectl"
          test "${{ steps.sdk.outcome }}" = success
          "$FLYTE_WORK/sdk/bin/python" "$FLYTE_WORK/probe.py" smoke "$FLYTE_WORK/candidate/flytectl" "$CANDIDATE_VERSION" "$FLYTE_WORK/candidate-smoke"
          DECISION=limited_cpu_smoke_validated
          echo "decision=limited_cpu_smoke_validated" >> "$GITHUB_OUTPUT"
          echo "regression_result=Flytectl $VERSION passed native CLI, workflow compilation, invalid-graph rejection, and companion Flytekit $FLYTEKIT_VERSION local execution checks." >> "$GITHUB_OUTPUT"

      - name: Calculate test summary
        id: summary
        if: always()
        run: |
          set -euo pipefail
          T1="${{ steps.test1.outputs.status || 'failed' }}"
          T2="${{ steps.test2.outputs.status || 'failed' }}"
          T3="${{ steps.test3.outputs.status || 'failed' }}"
          T4="${{ steps.test4.outputs.status || 'failed' }}"
          T5="${{ steps.test5.outputs.status || 'failed' }}"
          T6="${{ steps.test6.outputs.status || 'failed' }}"
          O1="${{ steps.test1.outcome || 'failure' }}"
          O2="${{ steps.test2.outcome || 'failure' }}"
          O3="${{ steps.test3.outcome || 'failure' }}"
          O4="${{ steps.test4.outcome || 'failure' }}"
          O5="${{ steps.test5.outcome || 'failure' }}"
          O6="${{ steps.test6.outcome || 'failure' }}"
          DECISION="${{ steps.test6.outputs.decision || '' }}"
          D1="${{ steps.test1.outputs.duration || '0' }}"
          D2="${{ steps.test2.outputs.duration || '0' }}"
          D3="${{ steps.test3.outputs.duration || '0' }}"
          D4="${{ steps.test4.outputs.duration || '0' }}"
          D5="${{ steps.test5.outputs.duration || '0' }}"
          D6="${{ steps.test6.outputs.duration || '0' }}"
          PASSED=0
          FAILED=0
          SKIPPED=0
          CORE_FAILED=0
          for RESULT in "$T1:$O1" "$T2:$O2" "$T3:$O3" "$T4:$O4" "$T5:$O5"; do
            if [ "$RESULT" = "passed:success" ]; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
              CORE_FAILED=$((CORE_FAILED + 1))
            fi
          done
          if [ "$T6:$O6" = "passed:success" ]; then
            PASSED=$((PASSED + 1))
          elif [ "$T6:$O6" = "skipped:success" ] && [ "$DECISION" = "baseline_failed" ] && [ "$CORE_FAILED" -gt 0 ]; then
            SKIPPED=1
          elif [ "$T6:$O6" = "skipped:success" ] && [ "$DECISION" = "no_newer_stable_available" ] && [ "$CORE_FAILED" -eq 0 ]; then
            SKIPPED=1
          else
            FAILED=$((FAILED + 1))
          fi
          DURATION=$((D1 + D2 + D3 + D4 + D5 + D6))
          if [ "$FAILED" -eq 0 ]; then
            OVERALL_STATUS="success"
          else
            OVERALL_STATUS="failure"
          fi
          if [ "$CORE_FAILED" -eq 0 ]; then
            BADGE_STATUS="passing"
          else
            BADGE_STATUS="failing"
          fi
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"
          echo "core_failed=$CORE_FAILED" >> "$GITHUB_OUTPUT"
          echo "overall_status=$OVERALL_STATUS" >> "$GITHUB_OUTPUT"
          echo "badge_status=$BADGE_STATUS" >> "$GITHUB_OUTPUT"
          test "$FAILED" -eq 0

      - name: Clean isolated Flytectl resources
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${FLYTE_WORK:-}" ]; then
            rm -rf -- "$FLYTE_WORK"
          fi

name: Test All Packages (Batch 14) on Arm64
run-name: Arm64 Batch 14 [${{ inputs.orchestration_id || format('manual-{0}-{1}', github.run_id, github.run_attempt) }}] [nonce:${{ inputs.dispatch_nonce || 'manual-only' }}]

on:
  workflow_dispatch:
    inputs:
      orchestration_id:
        description: Exact orchestrator identity; blank uses a safe manual fallback
        required: false
        default: ""
        type: string
      dispatch_nonce:
        description: Secret exact-dispatch nonce; blank is manual-only and not publishable
        required: false
        default: ""
        type: string
      expected_sha:
        description: Exact commit expected by the orchestrator
        required: false
        default: ""
        type: string
      expected_branch:
        description: Exact branch expected by the orchestrator
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      orchestration_id:
        required: true
        type: string
      dispatch_nonce:
        required: true
        type: string
      expected_sha:
        required: true
        type: string
      expected_branch:
        required: true
        type: string

permissions:
  contents: read

jobs:

  test-musl:
    uses: ./.github/workflows/test-musl.yml

  test-igniteui:
    uses: ./.github/workflows/test-igniteui.yml

  test-guacamole:
    uses: ./.github/workflows/test-guacamole.yml

  test-qt:
    uses: ./.github/workflows/test-qt.yml

  test-sentry-go:
    uses: ./.github/workflows/test-sentry-go.yml

  test-linkerd:
    uses: ./.github/workflows/test-linkerd.yml

  test-jenkins:
    uses: ./.github/workflows/test-jenkins.yml

  test-alpine_linux:
    uses: ./.github/workflows/test-alpine_linux.yml

  test-log4cplus:
    uses: ./.github/workflows/test-log4cplus.yml

  test-harvester:
    uses: ./.github/workflows/test-harvester.yml

  test-lzip:
    uses: ./.github/workflows/test-lzip.yml

  test-influxdb:
    uses: ./.github/workflows/test-influxdb.yml

  test-git:
    uses: ./.github/workflows/test-git.yml

  test-apache_kudu:
    uses: ./.github/workflows/test-apache_kudu.yml

  test-zabbix:
    uses: ./.github/workflows/test-zabbix.yml

  test-openzfs:
    uses: ./.github/workflows/test-openzfs.yml

  test-maas:
    uses: ./.github/workflows/test-maas.yml

  test-xxljob:
    uses: ./.github/workflows/test-xxljob.yml

  test-nettle:
    uses: ./.github/workflows/test-nettle.yml

  test-keystone:
    uses: ./.github/workflows/test-keystone.yml

  test-open-policy-agent:
    uses: ./.github/workflows/test-Open-Policy-Agent.yml

  test-maven:
    uses: ./.github/workflows/test-maven.yml

  test-gitlab:
    uses: ./.github/workflows/test-gitlab.yml

  test-puppet:
    uses: ./.github/workflows/test-puppet.yml

  test-beeGFS:
    uses: ./.github/workflows/test-beeGFS.yml

  test-ranger:
    uses: ./.github/workflows/test-ranger.yml

  test-pachyderm:
    uses: ./.github/workflows/test-pachyderm.yml

  test-apache-doris:
    uses: ./.github/workflows/test-apache-doris.yml

  test-infracost:
    uses: ./.github/workflows/test-infracost.yml

  test-knative:
    uses: ./.github/workflows/test-knative.yml

  test-notary:
    uses: ./.github/workflows/test-notary.yml

  test-sysget:
    uses: ./.github/workflows/test-sysget.yml

  test-wordpress:
    uses: ./.github/workflows/test-wordpress.yml

  test-cortex:
    uses: ./.github/workflows/test-cortex.yml

  test-zerotier:
    uses: ./.github/workflows/test-zerotier.yml

  test-crystal-language:
    uses: ./.github/workflows/test-Crystal-Language.yml

  test-celery:
    uses: ./.github/workflows/test-celery.yml

  test-thanos:
    uses: ./.github/workflows/test-thanos.yml

  test-proj:
    uses: ./.github/workflows/test-proj.yml

  test-libev:
    uses: ./.github/workflows/test-libev.yml

  test-distribution-registry:
    uses: ./.github/workflows/test-distribution-registry.yml

  test-mlrun:
    uses: ./.github/workflows/test-mlrun.yml

  test-garden-linux:
    uses: ./.github/workflows/test-garden-linux.yml

  test-gdrcopy:
    uses: ./.github/workflows/test-gdrcopy.yml

  test-gdsfactory:
    uses: ./.github/workflows/test-gdsfactory.yml

  summary:
    permissions:
      actions: read
      contents: read
    needs:
      [
        test-musl,
        test-igniteui,
        test-guacamole,
        test-qt,
        test-sentry-go,
        test-linkerd,
        test-jenkins,
        test-alpine_linux,
        test-log4cplus,
        test-harvester,
        test-lzip,
        test-influxdb,
        test-git,
        test-apache_kudu,
        test-zabbix,
        test-openzfs,
        test-maas,
        test-xxljob,
        test-nettle,
        test-keystone,
        test-open-policy-agent,
        test-maven,
        test-gitlab,
        test-puppet,
        test-beeGFS,
        test-ranger,
        test-pachyderm,
        test-apache-doris,
        test-infracost,
        test-knative,
        test-notary,
        test-sysget,
        test-wordpress,
        test-cortex,
        test-zerotier,
        test-crystal-language,
        test-celery,
        test-thanos,
        test-proj,
        test-libev,
        test-distribution-registry,
        test-mlrun,
        test-garden-linux,
        test-gdrcopy,
        test-gdsfactory
      ]
    runs-on: ubuntu-24.04-arm
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # original: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Collect batch results
        id: collect
        uses: ./.github/actions/collect-batch-results
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        with:
          batch_number: "14"
          batch_title: "Batch 14"

      - name: Attest complete batch results
        id: attest
        if: steps.collect.outcome == 'success'
        env:
          ARTIFACT_NAME: batch14-test-results
          BATCH_NUMBER: "14"
          COLLECTOR_JSON_COUNT: ${{ steps.collect.outputs.json_count }}
          CURRENT_BRANCH: ${{ github.ref_name }}
          DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
          EXPECTED_BRANCH: ${{ inputs.expected_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          NEEDS_JSON: ${{ toJson(needs) }}
          ORCHESTRATION_ID: ${{ inputs.orchestration_id }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/batch_artifact_attestation.py create \
            --results-root test-results \
            --workflow-file ".github/workflows/test-all-packages-batch14.yml" \
            --batch "$BATCH_NUMBER" \
            --repository "$REPOSITORY" \
            --expected-branch "$EXPECTED_BRANCH" \
            --current-branch "$CURRENT_BRANCH" \
            --expected-sha "$EXPECTED_SHA" \
            --workflow-sha "$WORKFLOW_SHA" \
            --orchestration-id "$ORCHESTRATION_ID" \
            --dispatch-nonce "$DISPATCH_NONCE" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --artifact-name "$ARTIFACT_NAME" \
            --collector-json-count "$COLLECTOR_JSON_COUNT" \
            --needs-environment-variable NEEDS_JSON

      - name: Upload batch test results
        if: steps.collect.outcome == 'success' && steps.attest.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # original: actions/upload-artifact@v4.6.2
        with:
          name: batch14-test-results
          path: test-results
          retention-days: 90

name: Test KVM Arm64 build and ABI compatibility

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-kvm.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-kvm.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-kvm.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-kvm.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-kvm.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-kvm.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-kvm.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-kvm.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-kvm.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-kvm.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-kvm.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-kvm.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-kvm.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-kvm.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-kvm.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-kvm.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-kvm.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-kvm.outputs.regression_next_installed_version }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-kvm.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-kvm.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-kvm.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-kvm.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-kvm.outputs.timestamp }}
jobs:
  test-kvm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      LC_ALL: C

    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'KVM Arm64 build/ABI smoke (VM execution not tested)'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '5' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '6' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # original: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=kvm" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/opensource_packages/kvm" >> "$GITHUB_OUTPUT"
          echo "KVM_SMOKE_DIR=$RUNNER_TEMP/kvm-smoke-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
      - name: Prepare package-owned KVM build and ABI smoke
        id: install
        continue-on-error: true
        run: |
          set -euo pipefail
          trap 'echo "install_status=failed" >> "$GITHUB_OUTPUT"' ERR
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64
          bash .github/actions/apt-bootstrap/bootstrap.sh --packages "gcc libc6-dev linux-libc-dev python3"
          mkdir -p "$KVM_SMOKE_DIR"
          cat > "$KVM_SMOKE_DIR/smoke.c" <<'C'
          #include <errno.h>
          #include <inttypes.h>
          #include <linux/kvm.h>
          #include <stddef.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #if !defined(__aarch64__) || __BYTE_ORDER__ != __ORDER_LITTLE_ENDIAN__
          #error Native little-endian AArch64 is required
          #endif

          /* Packaged userspace ABI checks only: no device, ioctl call or guest.
           * Layout and request definitions: https://docs.kernel.org/virt/kvm/api.html */
          #define CORE_REG(member) (KVM_REG_ARM64 | KVM_REG_SIZE_U64 | KVM_REG_ARM_CORE | \
                                    (offsetof(struct kvm_regs, member) / sizeof(uint32_t)))
          _Static_assert(KVM_API_VERSION == 12, "Unsupported KVM header ABI");
          _Static_assert(sizeof(struct kvm_userspace_memory_region) == 32, "Memory region ABI");
          _Static_assert(sizeof(struct kvm_one_reg) == 16, "One-reg ABI");
          _Static_assert(sizeof(struct kvm_vcpu_init) == 32, "Arm vCPU-init ABI");

          static uint64_t read_le(const unsigned char *bytes, size_t count)
          {
              uint64_t value = 0;
              for (size_t i = 0; i < count; ++i)
                  value |= (uint64_t)bytes[i] << (8 * i);
              return value;
          }

          int main(int argc, char **argv)
          {
              if (argc != 2 || !argv[1][0] || argv[1][0] == '-')
                  return EXIT_FAILURE;
              errno = 0;
              char *end = NULL;
              uintmax_t input = strtoumax(argv[1], &end, 10);
              if (errno || !end || *end || input > UINT32_MAX)
                  return EXIT_FAILURE;
              uint64_t address = ((uint64_t)input + 1) << 12;
              struct kvm_userspace_memory_region region = {
                  .slot = (uint32_t)input, .flags = KVM_MEM_LOG_DIRTY_PAGES,
                  .guest_phys_addr = address, .memory_size = 4096,
                  .userspace_addr = address + 8192
              };
              struct kvm_one_reg reg = { .id = CORE_REG(regs.pc), .addr = address };
              unsigned char memory_bytes[sizeof(region)], reg_bytes[sizeof(reg)];
              memcpy(memory_bytes, &region, sizeof(region));
              memcpy(reg_bytes, &reg, sizeof(reg));
              printf("{\"scope\":\"build-abi-only\",\"header_api\":%d,"
                     "\"memory_size\":%zu,\"one_reg_size\":%zu,\"vcpu_init_size\":%zu,"
                     "\"x0_id\":%" PRIu64 ",\"pc_id\":%" PRIu64 ",\"pstate_id\":%" PRIu64 ","
                     "\"get_api_request\":%lu,\"create_vm_request\":%lu,"
                     "\"set_memory_request\":%lu,\"set_one_reg_request\":%lu,"
                     "\"input\":%" PRIuMAX ",\"slot\":%" PRIu64 ",\"flags\":%" PRIu64 ","
                     "\"guest_address\":%" PRIu64 ",\"region_bytes\":%" PRIu64 ","
                     "\"userspace_address\":%" PRIu64 ",\"register_id\":%" PRIu64 ","
                     "\"register_address\":%" PRIu64 "}\n",
                     KVM_API_VERSION, sizeof(region), sizeof(reg), sizeof(struct kvm_vcpu_init),
                     (uint64_t)CORE_REG(regs.regs[0]), (uint64_t)CORE_REG(regs.pc),
                     (uint64_t)CORE_REG(regs.pstate), (unsigned long)KVM_GET_API_VERSION,
                     (unsigned long)KVM_CREATE_VM, (unsigned long)KVM_SET_USER_MEMORY_REGION,
                     (unsigned long)KVM_SET_ONE_REG, input,
                     read_le(memory_bytes, 4), read_le(memory_bytes + 4, 4),
                     read_le(memory_bytes + 8, 8), read_le(memory_bytes + 16, 8),
                     read_le(memory_bytes + 24, 8), read_le(reg_bytes, 8),
                     read_le(reg_bytes + 8, 8));
              return EXIT_SUCCESS;
          }
          C
          cat > "$KVM_SMOKE_DIR/check.py" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import re
          import secrets
          import struct
          import subprocess
          import sys

          SCOPE = "build-abi@"
          HEADER_PATHS = ("/usr/include/linux/kvm.h", "/usr/include/aarch64-linux-gnu/asm/kvm.h")

          def command(*args):
              result = subprocess.run(args, capture_output=True, text=True, timeout=12)
              print(f"{args!r}: exit={result.returncode}\n{result.stdout}{result.stderr}", file=sys.stderr)
              result.check_returncode()
              if result.stderr:
                  raise ValueError("Unexpected diagnostic from identity/ABI check")
              return result.stdout

          def host_release():
              host = platform.uname()
              if host.system != "Linux" or host.machine != "aarch64":
                  raise ValueError("Native Linux AArch64 is required")
              distro = platform.freedesktop_os_release()
              if distro.get("ID") != "ubuntu" or distro.get("VERSION_ID") != "24.04":
                  raise ValueError("Ubuntu 24.04 is required by the collector contract")
              if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-[a-z0-9]+(?:-[a-z0-9]+)*", host.release):
                  raise ValueError("Malformed Ubuntu kernel release")
              if Path("/proc/sys/kernel/osrelease").read_text().strip() != host.release:
                  raise ValueError("Running kernel release disagrees with procfs")
              return host.release

          def owned(path, allowed):
              if not Path(path).is_file():
                  raise ValueError("Required package file is missing")
              owner = command("dpkg-query", "-S", path)
              match = re.fullmatch(r"(" + allowed + r")(?::arm64)?: " + re.escape(path) + r"\n", owner)
              if not match:
                  raise ValueError("File has no unique allowed dpkg owner")
              package = match[1]
              row = command("dpkg-query", "-W",
                            "-f=${Package}\t${Version}\t${Architecture}\t${Status}\n", package)
              record = re.fullmatch(re.escape(package) +
                  r"\t([0-9][0-9A-Za-z.+:~\-]*)\tarm64\tinstall ok installed\n", row)
              if not record:
                  raise ValueError("Owning package is not installed for arm64")
              return package, record[1]

          def identity():
              release = host_release()
              package, revision = owned(f"/boot/vmlinuz-{release}",
                                       r"linux-image-(?:unsigned-)?" + re.escape(release))
              base, abi, flavor = release.split("-", 2)
              if not re.fullmatch(re.escape(f"{base}-{abi}") + r"\.[0-9]+(?:\.[0-9]+)*(?:~[0-9.]+)?", revision):
                  raise ValueError("Kernel package version disagrees with running release")
              signature = Path("/proc/version_signature").read_text()
              if not re.fullmatch(r"Ubuntu " + re.escape(f"{revision}-{flavor}") +
                                  r" [0-9]+\.[0-9]+\.[0-9]+\n", signature):
                  raise ValueError("Ubuntu running-kernel signature disagrees with installed package")
              return SCOPE + release, package, revision

          def baseline():
              actual = identity()
              expected = tuple(os.environ[key] for key in
                  ("EXPECTED_VERSION", "EXPECTED_KERNEL_PACKAGE", "EXPECTED_PACKAGE_VERSION"))
              if actual != expected:
                  raise ValueError("Verified kernel identity changed")
              return actual

          def config():
              version, _, revision = baseline()
              release = version.removeprefix(SCOPE)
              path = f"/boot/config-{release}"
              owner, config_revision = owned(path,
                  r"linux-(?:image-(?:unsigned-)?|modules-)" + re.escape(release))
              if config_revision != revision:
                  raise ValueError("Kernel configuration package revision mismatch")
              rows = Path(path).read_text().splitlines()
              for key in ("CONFIG_ARM64", "CONFIG_KVM"):
                  definitions = [row for row in rows if row.startswith(key + "=") or
                                 row == f"# {key} is not set"]
                  if definitions != [key + "=y"]:
                      raise ValueError(f"Expected one built-in {key}=y configuration")
              print(json.dumps(dict(config_owner=owner, kernel_revision=revision,
                                    scope="kernel-build-configuration-only")))

          def headers():
              baseline()
              owners = [owned(path, "linux-libc-dev") for path in HEADER_PATHS]
              if owners[0] != owners[1]:
                  raise ValueError("KVM generic and Arm64 headers have different package identities")
              digests = [hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in HEADER_PATHS]
              print(json.dumps(dict(package=owners[0][0], version=owners[0][1],
                                    architecture="arm64", paths=HEADER_PATHS, sha256=digests)))

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("Duplicate ABI result key")
                  result[key] = value
              return result

          def probe():
              baseline()
              binary = Path(os.environ["KVM_SMOKE_DIR"]) / "smoke"
              raw = binary.read_bytes()
              digest = os.environ["KVM_HARNESS_SHA256"]
              if (not re.fullmatch(r"[0-9a-f]{64}", digest)
                      or hashlib.sha256(raw).hexdigest() != digest):
                  raise ValueError("ABI binary changed after compilation")
              if (len(raw) < 64 or raw[:7] != b"\x7fELF\x02\x01\x01"
                      or struct.unpack_from("<H", raw, 16)[0] not in (2, 3)
                      or struct.unpack_from("<H", raw, 18)[0] != 183):
                  raise ValueError("ABI probe must be an AArch64 ELF executable")
              # Independent Linux ioctl encodings and fixed Arm64 UAPI layout, not live capabilities.
              constants = dict(scope="build-abi-only", header_api=12, memory_size=32,
                  one_reg_size=16, vcpu_init_size=32, x0_id=0x6030000000100000,
                  pc_id=0x6030000000100040, pstate_id=0x6030000000100042,
                  get_api_request=0xAE00, create_vm_request=0xAE01,
                  set_memory_request=0x4020AE46, set_one_reg_request=0x4010AEAC)
              for value in (0, secrets.randbelow(2**32), 2**32 - 1):
                  address = (value + 1) << 12
                  expected = dict(constants, input=value, slot=value, flags=1,
                      guest_address=address, region_bytes=4096, userspace_address=address + 8192,
                      register_id=constants["pc_id"], register_address=address)
                  actual = json.loads(command(str(binary), str(value)), object_pairs_hook=unique_object)
                  if (actual != expected or not isinstance(actual, dict)
                          or any(type(actual[key]) is not type(item) for key, item in expected.items())):
                      raise ValueError("Incorrect native userspace ABI evidence")
              print("Native KVM header ABI checks passed. VM execution is not tested.")

          def main():
              if len(sys.argv) != 2:
                  raise ValueError("One check mode is required")
              mode = sys.argv[1]
              if mode == "identity":
                  print("\t".join(identity()))
              elif mode == "baseline":
                  print("\t".join(baseline()))
              elif mode == "config":
                  config()
              elif mode == "headers":
                  headers()
              elif mode == "abi":
                  probe()
              else:
                  raise ValueError("Unknown build/ABI check mode")

          if __name__ == "__main__":
              main()

          PY
          echo "install_status=success" >> "$GITHUB_OUTPUT"

      - name: Identify running kernel package (build/ABI scope)
        id: version
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          trap 'echo "status=failed" >> "$GITHUB_OUTPUT"; echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"' ERR
          test "${{ steps.install.outcome }}" = success
          test "${{ steps.install.outputs.install_status }}" = success
          IDENTITY=$(python3 "$KVM_SMOKE_DIR/check.py" identity)
          IFS=$'\t' read -r VERSION KERNEL_PACKAGE PACKAGE_VERSION <<< "$IDENTITY"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "kernel_package=$KERNEL_PACKAGE" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 1 - KVM build/ABI - Verify native kernel package identity
        id: test1
        continue-on-error: true
        timeout-minutes: 2
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_KERNEL_PACKAGE: ${{ steps.version.outputs.kernel_package }}
          EXPECTED_PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          trap 'echo "status=failed" >> "$GITHUB_OUTPUT"; echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"' ERR
          test "${{ steps.install.outcome }}" = success
          test "${{ steps.install.outputs.install_status }}" = success
          test "${{ steps.version.outcome }}" = success
          test "${{ steps.version.outputs.status }}" = passed
          python3 "$KVM_SMOKE_DIR/check.py" baseline
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 2 - KVM build/ABI - Verify packaged Arm64 KVM build configuration
        id: test2
        continue-on-error: true
        timeout-minutes: 2
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_KERNEL_PACKAGE: ${{ steps.version.outputs.kernel_package }}
          EXPECTED_PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          trap 'echo "status=failed" >> "$GITHUB_OUTPUT"; echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"' ERR
          test "${{ steps.install.outcome }}" = success
          test "${{ steps.install.outputs.install_status }}" = success
          test "${{ steps.version.outcome }}" = success
          test "${{ steps.version.outputs.status }}" = passed
          python3 "$KVM_SMOKE_DIR/check.py" config
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 3 - KVM build/ABI - Verify package-owned Arm64 UAPI headers
        id: test3
        continue-on-error: true
        timeout-minutes: 2
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_KERNEL_PACKAGE: ${{ steps.version.outputs.kernel_package }}
          EXPECTED_PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          trap 'echo "status=failed" >> "$GITHUB_OUTPUT"; echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"' ERR
          test "${{ steps.install.outcome }}" = success
          test "${{ steps.install.outputs.install_status }}" = success
          test "${{ steps.version.outcome }}" = success
          test "${{ steps.version.outputs.status }}" = passed
          python3 "$KVM_SMOKE_DIR/check.py" headers > "$KVM_SMOKE_DIR/headers.json"
          cat "$KVM_SMOKE_DIR/headers.json"
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 4 - KVM build/ABI - Compile native userspace ABI probe
        id: test4
        continue-on-error: true
        timeout-minutes: 2
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_KERNEL_PACKAGE: ${{ steps.version.outputs.kernel_package }}
          EXPECTED_PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          trap 'echo "status=failed" >> "$GITHUB_OUTPUT"; echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"' ERR
          test "${{ steps.install.outcome }}" = success
          test "${{ steps.install.outputs.install_status }}" = success
          test "${{ steps.version.outcome }}" = success
          test "${{ steps.version.outputs.status }}" = passed
          test "${{ steps.test3.outcome }}" = success
          test "${{ steps.test3.outputs.status }}" = passed
          python3 "$KVM_SMOKE_DIR/check.py" headers > "$KVM_SMOKE_DIR/headers-before.json"
          cmp "$KVM_SMOKE_DIR/headers.json" "$KVM_SMOKE_DIR/headers-before.json"
          unset CPATH C_INCLUDE_PATH CPLUS_INCLUDE_PATH OBJC_INCLUDE_PATH
          gcc -std=gnu11 -O2 -Wall -Wextra -Werror "$KVM_SMOKE_DIR/smoke.c" -o "$KVM_SMOKE_DIR/smoke"
          test -x "$KVM_SMOKE_DIR/smoke"
          python3 "$KVM_SMOKE_DIR/check.py" headers > "$KVM_SMOKE_DIR/headers-after.json"
          cmp "$KVM_SMOKE_DIR/headers.json" "$KVM_SMOKE_DIR/headers-after.json"
          DIGEST=$(sha256sum "$KVM_SMOKE_DIR/smoke")
          echo "harness_sha256=${DIGEST%% *}" >> "$GITHUB_OUTPUT"
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 5 - KVM build/ABI - Run native ABI layout checks (VM execution not tested)
        id: test5
        continue-on-error: true
        timeout-minutes: 2
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_KERNEL_PACKAGE: ${{ steps.version.outputs.kernel_package }}
          EXPECTED_PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          KVM_HARNESS_SHA256: ${{ steps.test4.outputs.harness_sha256 }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          trap 'echo "status=failed" >> "$GITHUB_OUTPUT"; echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"' ERR
          test "${{ steps.install.outcome }}" = success
          test "${{ steps.install.outputs.install_status }}" = success
          test "${{ steps.version.outcome }}" = success
          test "${{ steps.version.outputs.status }}" = passed
          test "${{ steps.test4.outcome }}" = success
          test "${{ steps.test4.outputs.status }}" = passed
          python3 "$KVM_SMOKE_DIR/check.py" abi
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Regression applicability - package manager installed kernel and headers
        id: test6
        if: always()
        run: |
          set -euo pipefail
          CURRENT="${{ steps.version.outputs.version || 'unknown' }}"
          echo "current_version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest_version=not_applicable" >> "$GITHUB_OUTPUT"
          echo "next_installed_version=not_applicable" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.install.outcome }}" != success ] || [ "${{ steps.install.outputs.install_status }}" != success ]; then
            echo "decision=baseline_install_failed" >> "$GITHUB_OUTPUT"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "regression_result=Regression skipped: build/ABI setup failed. VM execution is not tested." >> "$GITHUB_OUTPUT"
            echo "comparison=No build/ABI baseline is available. VM execution is not tested." >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.version.outcome }}" = success ] && [ "${{ steps.version.outputs.status }}" = passed ] && \
               [[ "$CURRENT" = build-abi@?* ]] && \
               [ -n "${{ steps.version.outputs.kernel_package }}" ] && [ -n "${{ steps.version.outputs.package_version }}" ] && \
               [ "${{ steps.test1.outcome }}" = success ] && [ "${{ steps.test1.outputs.status }}" = passed ] && \
               [ "${{ steps.test2.outcome }}" = success ] && [ "${{ steps.test2.outputs.status }}" = passed ] && \
               [ "${{ steps.test3.outcome }}" = success ] && [ "${{ steps.test3.outputs.status }}" = passed ] && \
               [ "${{ steps.test4.outcome }}" = success ] && [ "${{ steps.test4.outputs.status }}" = passed ] && \
               [ "${{ steps.test5.outcome }}" = success ] && [ "${{ steps.test5.outputs.status }}" = passed ]; then
            echo "decision=not_applicable_package_manager" >> "$GITHUB_OUTPUT"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "regression_result=Regression not applicable: the kernel and UAPI headers are package-manager owned. VM execution is not tested." >> "$GITHUB_OUTPUT"
            echo "comparison=KVM Arm64 build/ABI smoke only. Hardware-assisted virtualization and VM execution are not tested. The local C program checks userspace headers, not a running hypervisor." >> "$GITHUB_OUTPUT"
          else
            echo "decision=baseline_failed" >> "$GITHUB_OUTPUT"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "regression_result=Regression skipped: basic build/ABI validation failed. VM execution is not tested." >> "$GITHUB_OUTPUT"
            echo "comparison=All five scoped build/ABI checks must pass before package-manager applicability is established. VM execution is not tested." >> "$GITHUB_OUTPUT"
          fi
          echo "duration=0" >> "$GITHUB_OUTPUT"

      - name: Calculate test summary
        if: always()
        id: summary
        run: |
          set -euo pipefail
          PASSED=0
          FAILED=0
          SKIPPED=0
          TOTAL_DURATION=0
          PREREQUISITES=passed
          EXPECTED_DECISION=not_applicable_package_manager
          if [ "${{ steps.install.outcome }}" != success ] || [ "${{ steps.install.outputs.install_status }}" != success ]; then
            PREREQUISITES=failed
            EXPECTED_DECISION=baseline_install_failed
          elif [ "${{ steps.version.outcome }}" != success ] || [ "${{ steps.version.outputs.status }}" != passed ] || \
               [[ "${{ steps.version.outputs.version }}" != build-abi@?* ]] || \
               [ -z "${{ steps.version.outputs.kernel_package }}" ] || [ -z "${{ steps.version.outputs.package_version }}" ]; then
            PREREQUISITES=failed
            EXPECTED_DECISION=baseline_failed
          fi
          check_core() {
            local status="$1" outcome="$2" duration="$3"
            if [[ "$duration" =~ ^[0-9]{1,6}$ ]]; then
              TOTAL_DURATION=$((TOTAL_DURATION + 10#$duration))
            else
              status=failed
            fi
            if [ "$PREREQUISITES" = passed ] && [ "$status" = passed ] && [ "$outcome" = success ]; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
            fi
          }
          check_core "${{ steps.test1.outputs.status }}" "${{ steps.test1.outcome }}" "${{ steps.test1.outputs.duration }}"
          check_core "${{ steps.test2.outputs.status }}" "${{ steps.test2.outcome }}" "${{ steps.test2.outputs.duration }}"
          check_core "${{ steps.test3.outputs.status }}" "${{ steps.test3.outcome }}" "${{ steps.test3.outputs.duration }}"
          check_core "${{ steps.test4.outputs.status }}" "${{ steps.test4.outcome }}" "${{ steps.test4.outputs.duration }}"
          check_core "${{ steps.test5.outputs.status }}" "${{ steps.test5.outcome }}" "${{ steps.test5.outputs.duration }}"
          CORE_FAILED=$FAILED
          if [ "$CORE_FAILED" -gt 0 ] && [ "$EXPECTED_DECISION" = not_applicable_package_manager ]; then
            EXPECTED_DECISION=baseline_failed
          fi
          DURATION6="${{ steps.test6.outputs.duration }}"
          if [ "${{ steps.test6.outcome }}" = success ] && \
             [ "${{ steps.test6.outputs.status }}" = skipped ] && \
             [ "${{ steps.test6.outputs.decision }}" = "$EXPECTED_DECISION" ] && \
             [ "${{ steps.test6.outputs.current_version }}" = "${{ steps.version.outputs.version || 'unknown' }}" ] && \
             [ "${{ steps.test6.outputs.latest_version }}" = not_applicable ] && \
             [ "${{ steps.test6.outputs.next_installed_version }}" = not_applicable ] && \
             [ -n "${{ steps.test6.outputs.regression_result }}" ] && [ -n "${{ steps.test6.outputs.comparison }}" ] && \
             [[ "$DURATION6" =~ ^[0-9]{1,6}$ ]]; then
            SKIPPED=1
          else
            FAILED=$((FAILED + 1))
          fi
          if [[ "$DURATION6" =~ ^[0-9]{1,6}$ ]]; then
            TOTAL_DURATION=$((TOTAL_DURATION + 10#$DURATION6))
          fi
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
          echo "core_failed=$CORE_FAILED" >> "$GITHUB_OUTPUT"
          echo "duration=$TOTAL_DURATION" >> "$GITHUB_OUTPUT"
          if [ "$FAILED" -eq 0 ]; then
            echo "overall_status=success" >> "$GITHUB_OUTPUT"
            echo "badge_status=passing" >> "$GITHUB_OUTPUT"
          else
            echo "overall_status=failure" >> "$GITHUB_OUTPUT"
            echo "badge_status=failing" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Create scoped build and ABI test summary
        if: always()
        run: |
          {
            echo "## KVM Arm64 Build/ABI Smoke Results"
            echo "- **Scope: basic kernel-build and userspace ABI compatibility only. Hardware-assisted virtualization and VM execution are not tested.**"
            echo "- Free runner: ubuntu-24.04-arm. No additional runner or nested virtualization is required."
            echo ""
            echo "- Running kernel: ${{ steps.version.outputs.version || 'unknown' }}"
            echo "- Kernel package: ${{ steps.version.outputs.kernel_package || 'unverified' }}"
            echo "- Package revision: ${{ steps.version.outputs.package_version || 'unverified' }}"
            echo "- Overall status: ${{ steps.summary.outputs.overall_status || 'failure' }}"
            echo "- Passed: ${{ steps.summary.outputs.passed || '0' }}"
            echo "- Failed: ${{ steps.summary.outputs.failed || '6' }}"
            echo "- Skipped: ${{ steps.summary.outputs.skipped || '0' }}"
            echo ""
            echo "| Test | Status | Outcome |"
            echo "| --- | --- | --- |"
            echo "| Test 1 - Native kernel identity | ${{ steps.test1.outputs.status || 'failed' }} | ${{ steps.test1.outcome }} |"
            echo "| Test 2 - Packaged KVM build configuration | ${{ steps.test2.outputs.status || 'failed' }} | ${{ steps.test2.outcome }} |"
            echo "| Test 3 - Package-owned Arm64 UAPI headers | ${{ steps.test3.outputs.status || 'failed' }} | ${{ steps.test3.outcome }} |"
            echo "| Test 4 - Native ABI probe compilation | ${{ steps.test4.outputs.status || 'failed' }} | ${{ steps.test4.outcome }} |"
            echo "| Test 5 - Native ABI checks (VM execution not tested) | ${{ steps.test5.outputs.status || 'failed' }} | ${{ steps.test5.outcome }} |"
            echo "| Regression applicability | ${{ steps.test6.outputs.status || 'failed' }} | ${{ steps.test6.outputs.decision || 'missing' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

name: Test KVM on Arm64

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-kvm.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-kvm.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-kvm.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-kvm.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-kvm.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-kvm.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-kvm.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-kvm.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-kvm.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-kvm.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-kvm.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-kvm.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-kvm.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-kvm.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-kvm.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-kvm.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-kvm.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-kvm.outputs.regression_next_installed_version }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-kvm.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-kvm.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-kvm.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-kvm.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-kvm.outputs.timestamp }}
jobs:
  test-kvm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      LC_ALL: C

    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'KVM'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '5' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '6' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # original: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=kvm" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/opensource_packages/kvm" >> "$GITHUB_OUTPUT"
          echo "KVM_SMOKE_DIR=$RUNNER_TEMP/kvm-smoke-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
      - name: Prepare native KVM API harness
        id: install
        continue-on-error: true
        run: |
          set -euo pipefail
          trap 'echo "install_status=failed" >> "$GITHUB_OUTPUT"' ERR
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64
          bash .github/actions/apt-bootstrap/bootstrap.sh --packages "gcc libc6-dev linux-libc-dev python3"
          mkdir -p "$KVM_SMOKE_DIR"
          cat > "$KVM_SMOKE_DIR/smoke.c" <<'C'
          #define _GNU_SOURCE
          #include <errno.h>
          #include <fcntl.h>
          #include <inttypes.h>
          #include <linux/kvm.h>
          #include <signal.h>
          #include <stddef.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/ioctl.h>
          #include <sys/mman.h>
          #include <sys/stat.h>
          #include <sys/utsname.h>
          #include <unistd.h>
          #if !defined(__aarch64__) || __BYTE_ORDER__ != __ORDER_LITTLE_ENDIAN__
          #error Native little-endian AArch64 is required
          #endif

          /* ABI: https://docs.kernel.org/virt/kvm/api.html
           * Register IDs/reset state follow Linux v6.8 KVM selftests, lib/aarch64/processor.c.
           * This MMU-off EL1 guest needs no disk, network, firmware or irqchip. */
          #define GPA UINT64_C(0x100000)
          #define RESULT_OFFSET 4096
          #define MMIO UINT64_C(0x200000)
          #define REG(member) (KVM_REG_ARM64 | KVM_REG_SIZE_U64 | KVM_REG_ARM_CORE | \
                              (offsetof(struct kvm_regs, member) / sizeof(uint32_t)))
          extern const unsigned char guest_start[], guest_end[];
          __asm__(".pushsection .rodata\n"
                  ".balign 4\n"
                  "guest_start:\n"
                  "add x0, x0, #7\n"
                  "str x0, [x1]\n"
                  "dsb sy\n"
                  "str x0, [x2]\n"
                  "b .\n"
                  "guest_end:\n"
                  ".popsection\n");

          static void require(int ok, const char *operation) {
              if (!ok) {
                  fprintf(stderr, "KVM smoke failed: %s (errno=%d: %s)\n",
                          operation, errno, strerror(errno));
                  exit(EXIT_FAILURE);
              }
          }

          static void deadline(int signal_number) {
              (void)signal_number;
              static const char message[] = "KVM smoke failed: execution timeout\n";
              ssize_t written = write(STDERR_FILENO, message, sizeof(message) - 1);
              (void)written;
              _exit(124);
          }

          static void set_reg(int vcpu, uint64_t id, uint64_t value) {
              struct kvm_one_reg reg = {.id = id, .addr = (uintptr_t)&value};
              require(ioctl(vcpu, KVM_SET_ONE_REG, &reg) == 0, "KVM_SET_ONE_REG");
          }

          static uint64_t get_reg(int vcpu, uint64_t id) {
              uint64_t value = 0;
              struct kvm_one_reg reg = {.id = id, .addr = (uintptr_t)&value};
              require(ioctl(vcpu, KVM_GET_ONE_REG, &reg) == 0, "KVM_GET_ONE_REG");
              return value;
          }

          int main(int argc, char **argv) {
              require(argc == 2 || argc == 3, "mode argument");
              const char *mode = argv[1];
              require(!strcmp(mode, "api") || !strcmp(mode, "vcpu") ||
                      !strcmp(mode, "invalid-memory") || !strcmp(mode, "guest"), "known mode");
              uint64_t input = 0;
              if (!strcmp(mode, "guest")) {
                  require(argc == 3 && argv[2][0] >= '0' && argv[2][0] <= '9', "guest input");
                  char *end = NULL;
                  errno = 0;
                  input = strtoull(argv[2], &end, 10);
                  require(!errno && end && !*end && input <= UINT32_MAX, "bounded guest input");
              } else {
                  require(argc == 2, "no extra arguments");
              }
              struct utsname host;
              require(uname(&host) == 0, "uname");
              require(!strcmp(host.sysname, "Linux") && !strcmp(host.machine, "aarch64"),
                      "native Linux AArch64 host");
              struct sigaction action = {.sa_handler = deadline};
              require(sigemptyset(&action.sa_mask) == 0, "sigemptyset");
              require(sigaction(SIGALRM, &action, NULL) == 0, "sigaction");
              alarm(8);
              int kvm = open("/dev/kvm", O_RDWR | O_CLOEXEC);
              require(kvm >= 0, "/dev/kvm missing or not accessible (read/write required)");
              struct stat device;
              require(fstat(kvm, &device) == 0 && S_ISCHR(device.st_mode), "/dev/kvm character device");
              int api = ioctl(kvm, KVM_GET_API_VERSION, 0);
              require(api == KVM_API_VERSION && api == 12, "KVM API version 12");
              require(ioctl(kvm, KVM_CHECK_EXTENSION, KVM_CAP_USER_MEMORY) > 0, "KVM_CAP_USER_MEMORY");
              require(ioctl(kvm, KVM_CHECK_EXTENSION, KVM_CAP_ONE_REG) > 0, "KVM_CAP_ONE_REG");
              int vm = -1, vcpu = -1;
              void *memory = MAP_FAILED;
              struct kvm_run *run = MAP_FAILED;
              size_t memory_size = 0, run_size = 0;
              uint64_t value = 12, mmio_value = 0, memory_value = 0;
              if (strcmp(mode, "api")) {
                  vm = ioctl(kvm, KVM_CREATE_VM, 0);
                  require(vm >= 0, "KVM_CREATE_VM");
                  long page_size = sysconf(_SC_PAGESIZE);
                  require(page_size >= 4096 && page_size <= 65536, "host page size");
                  memory_size = (size_t)page_size * 2;
                  memory = mmap(NULL, memory_size, PROT_READ | PROT_WRITE,
                                MAP_PRIVATE | MAP_ANONYMOUS, -1, 0);
                  require(memory != MAP_FAILED, "guest RAM allocation");
                  struct kvm_userspace_memory_region region = {
                      .slot = 0, .guest_phys_addr = GPA, .memory_size = memory_size,
                      .userspace_addr = (uintptr_t)memory,
                  };
                  if (!strcmp(mode, "invalid-memory")) {
                      region.guest_phys_addr = GPA + 1;
                      errno = 0;
                      int rc = ioctl(vm, KVM_SET_USER_MEMORY_REGION, &region);
                      require(rc == -1 && errno == EINVAL, "unaligned guest RAM must fail with EINVAL");
                      region.guest_phys_addr = GPA;
                      require(ioctl(vm, KVM_SET_USER_MEMORY_REGION, &region) == 0,
                              "aligned guest RAM after negative case");
                      value = EINVAL;
                  } else {
                      require(ioctl(vm, KVM_SET_USER_MEMORY_REGION, &region) == 0,
                              "KVM_SET_USER_MEMORY_REGION");
                      struct kvm_vcpu_init init = {0};
                      require(ioctl(vm, KVM_ARM_PREFERRED_TARGET, &init) == 0, "KVM_ARM_PREFERRED_TARGET");
                      vcpu = ioctl(vm, KVM_CREATE_VCPU, 0);
                      require(vcpu >= 0, "KVM_CREATE_VCPU");
                      require(ioctl(vcpu, KVM_ARM_VCPU_INIT, &init) == 0, "KVM_ARM_VCPU_INIT");
                      set_reg(vcpu, REG(regs.pc), GPA);
                      set_reg(vcpu, REG(regs.pstate), 0x3c5); /* EL1h, D/A/I/F masked. */
                      set_reg(vcpu, REG(regs.regs[0]), !strcmp(mode, "guest") ? input : 0x1234);
                      set_reg(vcpu, REG(regs.regs[1]), GPA + RESULT_OFFSET);
                      set_reg(vcpu, REG(regs.regs[2]), MMIO);
                      require(get_reg(vcpu, REG(regs.pc)) == GPA, "initial guest PC");
                      require(get_reg(vcpu, REG(regs.pstate)) == 0x3c5, "initial guest PSTATE");
                      value = get_reg(vcpu, REG(regs.regs[0]));
                      require(value == (!strcmp(mode, "guest") ? input : 0x1234), "initial x0");
                      if (!strcmp(mode, "guest")) {
                          size_t code_size = (uintptr_t)guest_end - (uintptr_t)guest_start;
                          require(code_size > 0 && code_size < RESULT_OFFSET, "guest code bounds");
                          memcpy(memory, guest_start, code_size);
                          __builtin___clear_cache(memory, (char *)memory + code_size);
                          volatile uint64_t *result = (uint64_t *)((char *)memory + RESULT_OFFSET);
                          *result = UINT64_MAX;
                          int mmap_size = ioctl(kvm, KVM_GET_VCPU_MMAP_SIZE, 0);
                          require(mmap_size >= (int)sizeof(*run), "KVM_GET_VCPU_MMAP_SIZE");
                          run_size = (size_t)mmap_size;
                          run = mmap(NULL, run_size, PROT_READ | PROT_WRITE, MAP_SHARED, vcpu, 0);
                          require(run != MAP_FAILED, "vcpu run mapping");
                          require(ioctl(vcpu, KVM_RUN, 0) == 0, "KVM_RUN");
                          require(run->exit_reason == KVM_EXIT_MMIO, "guest MMIO exit");
                          require(run->mmio.is_write == 1 && run->mmio.len == sizeof(uint64_t) &&
                                  run->mmio.phys_addr == MMIO, "guest completion address/width/direction");
                          memcpy(&mmio_value, run->mmio.data, sizeof(mmio_value));
                          memory_value = *result;
                          value = get_reg(vcpu, REG(regs.regs[0]));
                          require(value == input + 7 && memory_value == value && mmio_value == value,
                                  "guest x0, shared RAM and MMIO result");
                      }
                  }
              }
              if (run != MAP_FAILED) require(munmap(run, run_size) == 0, "unmap vcpu");
              if (vcpu >= 0) require(close(vcpu) == 0, "close vcpu");
              if (vm >= 0) require(close(vm) == 0, "close VM");
              if (memory != MAP_FAILED) require(munmap(memory, memory_size) == 0, "unmap RAM");
              require(close(kvm) == 0, "close KVM");
              alarm(0);
              printf("{\"mode\":\"%s\",\"api\":%d,\"value\":%" PRIu64
                     ",\"input\":%" PRIu64 ",\"memory\":%" PRIu64 ",\"mmio\":%" PRIu64 "}\n",
                     mode, api, value, input, memory_value, mmio_value);
              return EXIT_SUCCESS;
          }
          C
          cat > "$KVM_SMOKE_DIR/check.py" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import re
          import secrets
          import struct
          import subprocess
          import sys

          def command(*args):
              result = subprocess.run(args, capture_output=True, text=True, timeout=12)
              print(f"{args!r}: exit={result.returncode}\n{result.stdout}{result.stderr}", file=sys.stderr)
              result.check_returncode()
              if result.stderr:
                  raise ValueError("Unexpected diagnostic from identity/KVM probe")
              return result.stdout

          def host_release():
              host = platform.uname()
              if host.system != "Linux" or host.machine != "aarch64":
                  raise ValueError("Native Linux AArch64 is required")
              distro = platform.freedesktop_os_release()
              if distro.get("ID") != "ubuntu" or distro.get("VERSION_ID") != "24.04":
                  raise ValueError("Ubuntu 24.04 is required by the collector contract")
              if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-[a-z0-9]+(?:-[a-z0-9]+)*", host.release):
                  raise ValueError("Malformed Ubuntu kernel release")
              if Path("/proc/sys/kernel/osrelease").read_text().strip() != host.release:
                  raise ValueError("Running kernel release disagrees with procfs")
              return host.release

          def identity():
              release = host_release()
              image = f"/boot/vmlinuz-{release}"
              if not Path(image).is_file():
                  raise ValueError("Running kernel image is missing")
              owner = command("dpkg-query", "-S", image)
              match = re.fullmatch(
                  r"(linux-image-(?:unsigned-)?" + re.escape(release) + r")(?::arm64)?: "
                  + re.escape(image) + r"\n", owner)
              if not match:
                  raise ValueError("Running kernel image has no unique matching dpkg owner")
              package = match[1]
              row = command("dpkg-query", "-W",
                            "-f=${Package}\t${Version}\t${Architecture}\t${Status}\n", package)
              record = re.fullmatch(re.escape(package) +
                  r"\t([0-9][0-9A-Za-z.+:~\-]*)\tarm64\tinstall ok installed\n", row)
              if not record:
                  raise ValueError("Kernel package is not installed for arm64")
              revision = record[1]
              base, abi, flavor = release.split("-", 2)
              if not re.fullmatch(re.escape(f"{base}-{abi}") + r"\.[0-9]+(?:\.[0-9]+)*(?:~[0-9.]+)?", revision):
                  raise ValueError("Kernel package version disagrees with running release")
              signature = Path("/proc/version_signature").read_text()
              if not re.fullmatch(r"Ubuntu " + re.escape(f"{revision}-{flavor}") +
                                  r" [0-9]+\.[0-9]+\.[0-9]+\n", signature):
                  raise ValueError("Ubuntu running-kernel signature disagrees with installed package")
              return release, package, revision

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("Duplicate KVM result key")
                  result[key] = value
              return result

          def probe(mode):
              release = host_release()
              if release != os.environ["EXPECTED_VERSION"]:
                  raise ValueError("Running kernel changed after identity validation")
              binary = Path(os.environ["KVM_SMOKE_DIR"]) / "smoke"
              raw = binary.read_bytes()
              digest = os.environ["KVM_HARNESS_SHA256"]
              if (not re.fullmatch(r"[0-9a-f]{64}", digest)
                      or hashlib.sha256(raw).hexdigest() != digest):
                  raise ValueError("KVM harness digest changed after compilation")
              if (len(raw) < 64 or raw[:6] != b"\x7fELF\x02\x01"
                      or struct.unpack_from("<H", raw, 18)[0] != 183):
                  raise ValueError("KVM harness must be an AArch64 ELF executable")
              inputs = [secrets.randbelow(2**31), 2**32 - 1] if mode == "guest" else [0]
              for value in inputs:
                  args = [str(binary), mode]
                  if mode == "guest":
                      args.append(str(value))
                  actual = json.loads(command(*args), object_pairs_hook=unique_object)
                  expected = dict(mode=mode, api=12, value={"api": 12, "vcpu": 0x1234,
                                  "invalid-memory": 22, "guest": value + 7}[mode],
                                  input=value, memory=value + 7 if mode == "guest" else 0,
                                  mmio=value + 7 if mode == "guest" else 0)
                  if (actual != expected or not isinstance(actual, dict)
                          or any(type(actual[key]) is not type(item) for key, item in expected.items())):
                      raise ValueError("KVM probe returned missing, malformed or wrong guest evidence")

          def main():
              if len(sys.argv) != 2:
                  raise ValueError("One check mode is required")
              mode = sys.argv[1]
              if mode == "identity":
                  print("\t".join(identity()))
              elif mode in {"api", "vcpu", "invalid-memory", "guest"}:
                  probe(mode)
              else:
                  raise ValueError("Unknown KVM check mode")

          if __name__ == "__main__":
              main()

          PY
          gcc -std=gnu11 -O2 -Wall -Wextra -Werror "$KVM_SMOKE_DIR/smoke.c" -o "$KVM_SMOKE_DIR/smoke"
          test -x "$KVM_SMOKE_DIR/smoke"
          DIGEST=$(sha256sum "$KVM_SMOKE_DIR/smoke")
          echo "harness_sha256=${DIGEST%% *}" >> "$GITHUB_OUTPUT"
          echo "install_status=success" >> "$GITHUB_OUTPUT"

      - name: Identify package owning the running KVM kernel
        id: version
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          trap 'echo "status=failed" >> "$GITHUB_OUTPUT"; echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"' ERR
          test "${{ steps.install.outcome }}" = success
          test "${{ steps.install.outputs.install_status }}" = success
          IDENTITY=$(python3 "$KVM_SMOKE_DIR/check.py" identity)
          IFS=$'\t' read -r VERSION KERNEL_PACKAGE PACKAGE_VERSION <<< "$IDENTITY"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "kernel_package=$KERNEL_PACKAGE" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 1 - Open KVM device and validate API
        id: test1
        continue-on-error: true
        timeout-minutes: 2
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_KERNEL_PACKAGE: ${{ steps.version.outputs.kernel_package }}
          EXPECTED_PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          KVM_HARNESS_SHA256: ${{ steps.install.outputs.harness_sha256 }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          trap 'echo "status=failed" >> "$GITHUB_OUTPUT"; echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"' ERR
          test "${{ steps.install.outcome }}" = success
          test "${{ steps.install.outputs.install_status }}" = success
          test "${{ steps.version.outcome }}" = success
          test "${{ steps.version.outputs.status }}" = passed
          python3 "$KVM_SMOKE_DIR/check.py" api
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 2 - Verify running kernel package identity
        id: test2
        continue-on-error: true
        timeout-minutes: 2
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_KERNEL_PACKAGE: ${{ steps.version.outputs.kernel_package }}
          EXPECTED_PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          KVM_HARNESS_SHA256: ${{ steps.install.outputs.harness_sha256 }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          trap 'echo "status=failed" >> "$GITHUB_OUTPUT"; echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"' ERR
          test "${{ steps.install.outcome }}" = success
          test "${{ steps.install.outputs.install_status }}" = success
          test "${{ steps.version.outcome }}" = success
          test "${{ steps.version.outputs.status }}" = passed
          IDENTITY=$(python3 "$KVM_SMOKE_DIR/check.py" identity)
          test "$IDENTITY" = "$EXPECTED_VERSION"$'\t'"$EXPECTED_KERNEL_PACKAGE"$'\t'"$EXPECTED_PACKAGE_VERSION"
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 3 - Create VM and initialize AArch64 vCPU
        id: test3
        continue-on-error: true
        timeout-minutes: 2
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_KERNEL_PACKAGE: ${{ steps.version.outputs.kernel_package }}
          EXPECTED_PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          KVM_HARNESS_SHA256: ${{ steps.install.outputs.harness_sha256 }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          trap 'echo "status=failed" >> "$GITHUB_OUTPUT"; echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"' ERR
          test "${{ steps.install.outcome }}" = success
          test "${{ steps.install.outputs.install_status }}" = success
          test "${{ steps.version.outcome }}" = success
          test "${{ steps.version.outputs.status }}" = passed
          python3 "$KVM_SMOKE_DIR/check.py" vcpu
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 4 - Reject invalid guest memory mapping
        id: test4
        continue-on-error: true
        timeout-minutes: 2
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_KERNEL_PACKAGE: ${{ steps.version.outputs.kernel_package }}
          EXPECTED_PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          KVM_HARNESS_SHA256: ${{ steps.install.outputs.harness_sha256 }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          trap 'echo "status=failed" >> "$GITHUB_OUTPUT"; echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"' ERR
          test "${{ steps.install.outcome }}" = success
          test "${{ steps.install.outputs.install_status }}" = success
          test "${{ steps.version.outcome }}" = success
          test "${{ steps.version.outputs.status }}" = passed
          python3 "$KVM_SMOKE_DIR/check.py" invalid-memory
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 5 - Execute AArch64 guest and verify shared memory
        id: test5
        continue-on-error: true
        timeout-minutes: 2
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_KERNEL_PACKAGE: ${{ steps.version.outputs.kernel_package }}
          EXPECTED_PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          KVM_HARNESS_SHA256: ${{ steps.install.outputs.harness_sha256 }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          trap 'echo "status=failed" >> "$GITHUB_OUTPUT"; echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"' ERR
          test "${{ steps.install.outcome }}" = success
          test "${{ steps.install.outputs.install_status }}" = success
          test "${{ steps.version.outcome }}" = success
          test "${{ steps.version.outputs.status }}" = passed
          python3 "$KVM_SMOKE_DIR/check.py" guest
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Regression applicability - package manager installed kernel
        id: test6
        if: always()
        run: |
          set -euo pipefail
          CURRENT="${{ steps.version.outputs.version || 'unknown' }}"
          echo "current_version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest_version=not_applicable" >> "$GITHUB_OUTPUT"
          echo "next_installed_version=not_applicable" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.install.outcome }}" != success ] || [ "${{ steps.install.outputs.install_status }}" != success ]; then
            echo "decision=baseline_install_failed" >> "$GITHUB_OUTPUT"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "regression_result=Regression skipped: KVM harness setup failed." >> "$GITHUB_OUTPUT"
            echo "comparison=No successfully prepared KVM baseline is available." >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.version.outcome }}" = success ] && [ "${{ steps.version.outputs.status }}" = passed ] && \
               [ "$CURRENT" != unknown ] && [ -n "$CURRENT" ] && \
               [ -n "${{ steps.version.outputs.kernel_package }}" ] && [ -n "${{ steps.version.outputs.package_version }}" ] && \
               [ "${{ steps.test1.outcome }}" = success ] && [ "${{ steps.test1.outputs.status }}" = passed ] && \
               [ "${{ steps.test2.outcome }}" = success ] && [ "${{ steps.test2.outputs.status }}" = passed ] && \
               [ "${{ steps.test3.outcome }}" = success ] && [ "${{ steps.test3.outputs.status }}" = passed ] && \
               [ "${{ steps.test4.outcome }}" = success ] && [ "${{ steps.test4.outputs.status }}" = passed ] && \
               [ "${{ steps.test5.outcome }}" = success ] && [ "${{ steps.test5.outputs.status }}" = passed ]; then
            echo "decision=not_applicable_package_manager" >> "$GITHUB_OUTPUT"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "regression_result=Regression not applicable: the tested running kernel is owned by an installed Arm64 Ubuntu kernel package." >> "$GITHUB_OUTPUT"
            echo "comparison=All five KVM checks passed against the package manager installed kernel; the locally compiled API harness is only a test driver." >> "$GITHUB_OUTPUT"
          else
            echo "decision=baseline_failed" >> "$GITHUB_OUTPUT"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "regression_result=Regression skipped: genuine KVM baseline validation failed." >> "$GITHUB_OUTPUT"
            echo "comparison=All five core checks, including actual guest execution, must pass before package manager applicability can be established." >> "$GITHUB_OUTPUT"
          fi
          echo "duration=0" >> "$GITHUB_OUTPUT"

      - name: Calculate test summary
        if: always()
        id: summary
        run: |
          set -euo pipefail
          PASSED=0
          FAILED=0
          SKIPPED=0
          TOTAL_DURATION=0
          PREREQUISITES=passed
          EXPECTED_DECISION=not_applicable_package_manager
          if [ "${{ steps.install.outcome }}" != success ] || [ "${{ steps.install.outputs.install_status }}" != success ]; then
            PREREQUISITES=failed
            EXPECTED_DECISION=baseline_install_failed
          elif [ "${{ steps.version.outcome }}" != success ] || [ "${{ steps.version.outputs.status }}" != passed ] || \
               [ -z "${{ steps.version.outputs.version }}" ] || [ "${{ steps.version.outputs.version }}" = unknown ] || \
               [ -z "${{ steps.version.outputs.kernel_package }}" ] || [ -z "${{ steps.version.outputs.package_version }}" ]; then
            PREREQUISITES=failed
            EXPECTED_DECISION=baseline_failed
          fi
          check_core() {
            local status="$1" outcome="$2" duration="$3"
            if [[ "$duration" =~ ^[0-9]{1,6}$ ]]; then
              TOTAL_DURATION=$((TOTAL_DURATION + 10#$duration))
            else
              status=failed
            fi
            if [ "$PREREQUISITES" = passed ] && [ "$status" = passed ] && [ "$outcome" = success ]; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
            fi
          }
          check_core "${{ steps.test1.outputs.status }}" "${{ steps.test1.outcome }}" "${{ steps.test1.outputs.duration }}"
          check_core "${{ steps.test2.outputs.status }}" "${{ steps.test2.outcome }}" "${{ steps.test2.outputs.duration }}"
          check_core "${{ steps.test3.outputs.status }}" "${{ steps.test3.outcome }}" "${{ steps.test3.outputs.duration }}"
          check_core "${{ steps.test4.outputs.status }}" "${{ steps.test4.outcome }}" "${{ steps.test4.outputs.duration }}"
          check_core "${{ steps.test5.outputs.status }}" "${{ steps.test5.outcome }}" "${{ steps.test5.outputs.duration }}"
          CORE_FAILED=$FAILED
          if [ "$CORE_FAILED" -gt 0 ] && [ "$EXPECTED_DECISION" = not_applicable_package_manager ]; then
            EXPECTED_DECISION=baseline_failed
          fi
          DURATION6="${{ steps.test6.outputs.duration }}"
          if [ "${{ steps.test6.outcome }}" = success ] && \
             [ "${{ steps.test6.outputs.status }}" = skipped ] && \
             [ "${{ steps.test6.outputs.decision }}" = "$EXPECTED_DECISION" ] && \
             [ "${{ steps.test6.outputs.current_version }}" = "${{ steps.version.outputs.version || 'unknown' }}" ] && \
             [ "${{ steps.test6.outputs.latest_version }}" = not_applicable ] && \
             [ "${{ steps.test6.outputs.next_installed_version }}" = not_applicable ] && \
             [ -n "${{ steps.test6.outputs.regression_result }}" ] && [ -n "${{ steps.test6.outputs.comparison }}" ] && \
             [[ "$DURATION6" =~ ^[0-9]{1,6}$ ]]; then
            SKIPPED=1
          else
            FAILED=$((FAILED + 1))
          fi
          if [[ "$DURATION6" =~ ^[0-9]{1,6}$ ]]; then
            TOTAL_DURATION=$((TOTAL_DURATION + 10#$DURATION6))
          fi
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
          echo "core_failed=$CORE_FAILED" >> "$GITHUB_OUTPUT"
          echo "duration=$TOTAL_DURATION" >> "$GITHUB_OUTPUT"
          if [ "$FAILED" -eq 0 ]; then
            echo "overall_status=success" >> "$GITHUB_OUTPUT"
            echo "badge_status=passing" >> "$GITHUB_OUTPUT"
          else
            echo "overall_status=failure" >> "$GITHUB_OUTPUT"
            echo "badge_status=failing" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Create test summary
        if: always()
        run: |
          {
            echo "## KVM Test Results"
            echo ""
            echo "- Running kernel: ${{ steps.version.outputs.version || 'unknown' }}"
            echo "- Kernel package: ${{ steps.version.outputs.kernel_package || 'unverified' }}"
            echo "- Package revision: ${{ steps.version.outputs.package_version || 'unverified' }}"
            echo "- Overall status: ${{ steps.summary.outputs.overall_status || 'failure' }}"
            echo "- Passed: ${{ steps.summary.outputs.passed || '0' }}"
            echo "- Failed: ${{ steps.summary.outputs.failed || '6' }}"
            echo "- Skipped: ${{ steps.summary.outputs.skipped || '0' }}"
            echo ""
            echo "| Test | Status | Outcome |"
            echo "| --- | --- | --- |"
            echo "| Test 1 - KVM device/API | ${{ steps.test1.outputs.status || 'failed' }} | ${{ steps.test1.outcome }} |"
            echo "| Test 2 - Running kernel identity | ${{ steps.test2.outputs.status || 'failed' }} | ${{ steps.test2.outcome }} |"
            echo "| Test 3 - VM/vCPU initialization | ${{ steps.test3.outputs.status || 'failed' }} | ${{ steps.test3.outcome }} |"
            echo "| Test 4 - Invalid memory rejection | ${{ steps.test4.outputs.status || 'failed' }} | ${{ steps.test4.outcome }} |"
            echo "| Test 5 - AArch64 guest/shared RAM | ${{ steps.test5.outputs.status || 'failed' }} | ${{ steps.test5.outcome }} |"
            echo "| Regression applicability | ${{ steps.test6.outputs.status || 'failed' }} | ${{ steps.test6.outputs.decision || 'missing' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

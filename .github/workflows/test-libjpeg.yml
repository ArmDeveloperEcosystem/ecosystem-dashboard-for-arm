name: Test Libjpeg-turbo on Arm64

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-libjpeg.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-libjpeg.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-libjpeg.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-libjpeg.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-libjpeg.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-libjpeg.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-libjpeg.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-libjpeg.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-libjpeg.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-libjpeg.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-libjpeg.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-libjpeg.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-libjpeg.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-libjpeg.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-libjpeg.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-libjpeg.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-libjpeg.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-libjpeg.outputs.regression_next_installed_version }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-libjpeg.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-libjpeg.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-libjpeg.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-libjpeg.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-libjpeg.outputs.timestamp }}
jobs:
  test-libjpeg:
    runs-on: ubuntu-24.04-arm

    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'Libjpeg-turbo'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # original: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=libjpeg" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/opensource_packages/libjpeg" >> "$GITHUB_OUTPUT"
      - name: Install Libjpeg-turbo
        id: install
        run: |
          set -euo pipefail
          bash .github/actions/apt-bootstrap/bootstrap.sh --packages "build-essential libjpeg-turbo8-dev python3"
          test -f /usr/include/jpeglib.h
          ldconfig -p | grep -q 'libjpeg\.so'
          echo "install_status=success" >> "$GITHUB_OUTPUT"

      - name: Get Libjpeg-turbo version
        id: version
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            rc=$1
            trap - EXIT
            if [ "$rc" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish $?' EXIT
          export LC_ALL=C
          IDENTITY=$(python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import tempfile

          def run(*args):
              result = subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                      text=True, timeout=30)
              print(f"{args!r} (exit {result.returncode}):\n{result.stdout}", file=sys.stderr)
              result.check_returncode()
              return result.stdout

          def package(name):
              row = run("dpkg-query", "-W",
                        "-f=${Package}\t${Status}\t${Version}\t${Architecture}\t${source:Package}\t${source:Upstream-Version}\n",
                        name)
              match = re.fullmatch(re.escape(name) +
                                   r"\tinstall ok installed\t([0-9][0-9A-Za-z.+:~\-]*)\tarm64\tlibjpeg-turbo\t"
                                   r"([0-9]+(?:\.[0-9]+){2})\n", row)
              if not match:
                  raise SystemExit(f"Invalid arm64 libjpeg-turbo package identity: {name}")
              revision, upstream = match.groups()
              if not re.fullmatch(r"(?:[0-9]+:)?" + re.escape(upstream) + r"-[0-9A-Za-z.+~]+", revision):
                  raise SystemExit("libjpeg-turbo revision disagrees with source upstream version")
              files = {Path(p).resolve() for p in run("dpkg-query", "-L", name).splitlines() if p.startswith("/")}
              return revision, upstream, files

          revision, version, headers = package("libjpeg-turbo8-dev")
          runtime_revision, runtime_version, libraries = package("libjpeg-turbo8")
          if (revision, version) != (runtime_revision, runtime_version):
              raise SystemExit("libjpeg-turbo development and runtime packages disagree")
          include_dirs = set()
          for name in ("jpeglib.h", "jconfig.h"):
              matches = [p for p in headers if p.name == name and p.is_file()]
              if len(matches) != 1:
                  raise SystemExit(f"Expected one installed libjpeg-turbo8-dev header: {name}")
              include_dirs.add(str(matches[0].parent))
          with tempfile.TemporaryDirectory(prefix="libjpeg-identity-", dir=os.environ["RUNNER_TEMP"]) as temp:
              source = Path(temp) / "identity.c"
              binary = Path(temp) / "identity"
              source.write_text(r'''
          #define _GNU_SOURCE
          #include <stddef.h>
          #include <stdio.h>
          #include <jpeglib.h>
          #include <dlfcn.h>
          #ifndef LIBJPEG_TURBO_VERSION
          #error Expected libjpeg-turbo headers
          #endif
          #define STRINGIFY_INNER(x) #x
          #define STRINGIFY(x) STRINGIFY_INNER(x)
          int main(void) {
              struct jpeg_error_mgr error;
              Dl_info library;
              if (jpeg_std_error(&error) != &error ||
                  !dladdr((void *)jpeg_std_error, &library) || !library.dli_fname) return 1;
              printf("libjpeg-turbo\t%s\t%s\n", STRINGIFY(LIBJPEG_TURBO_VERSION), library.dli_fname);
              return 0;
          }
          ''')
              includes = [flag for directory in sorted(include_dirs) for flag in ("-I", directory)]
              run("cc", "-Wall", "-Wextra", "-Werror", *includes, str(source), "-ljpeg", "-ldl", "-o", str(binary))
              banner = run(str(binary))
          match = re.fullmatch(r"libjpeg-turbo\t([0-9]+(?:\.[0-9]+){2})\t(/[^\t\n]+)\n", banner)
          if not match or match[1] != version:
              raise SystemExit("Native libjpeg-turbo header version disagrees with package")
          if Path(match[2]).resolve() not in libraries:
              raise SystemExit("Loaded JPEG library is not owned by libjpeg-turbo8")
          if os.environ.get("VERIFY_BASELINE") == "1":
              if (os.environ["VERSION_STATUS"] != "passed" or os.environ["VERSION_OUTCOME"] != "success"
                      or os.environ["EXPECTED_VERSION"] != version
                      or os.environ["EXPECTED_PACKAGE_VERSION"] != revision):
                  raise SystemExit("libjpeg-turbo identity changed or the baseline version probe failed")
          print(f"{version}\t{revision}\t{version}\tnative_header_and_dpkg")
          PY
          )
          IFS=$'\t' read -r VERSION PACKAGE_VERSION UPSTREAM VERSION_SOURCE <<< "$IDENTITY"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "source_upstream_version=$UPSTREAM" >> "$GITHUB_OUTPUT"
          echo "version_source=$VERSION_SOURCE" >> "$GITHUB_OUTPUT"
          finish 0

      - name: Test 1 - Check header installation
        id: test1
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            rc=$1
            trap - EXIT
            if [ "$rc" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish $?' EXIT
          export LC_ALL=C
          test -f /usr/include/jpeglib.h
          finish 0

      - name: Test 2 - Verify native libjpeg-turbo version identity
        id: test2
        continue-on-error: true
        env:
          VERIFY_BASELINE: '1'
          VERSION_STATUS: ${{ steps.version.outputs.status }}
          VERSION_OUTCOME: ${{ steps.version.outcome }}
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            rc=$1
            trap - EXIT
            if [ "$rc" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish $?' EXIT
          export LC_ALL=C
          IDENTITY=$(python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import tempfile

          def run(*args):
              result = subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                      text=True, timeout=30)
              print(f"{args!r} (exit {result.returncode}):\n{result.stdout}", file=sys.stderr)
              result.check_returncode()
              return result.stdout

          def package(name):
              row = run("dpkg-query", "-W",
                        "-f=${Package}\t${Status}\t${Version}\t${Architecture}\t${source:Package}\t${source:Upstream-Version}\n",
                        name)
              match = re.fullmatch(re.escape(name) +
                                   r"\tinstall ok installed\t([0-9][0-9A-Za-z.+:~\-]*)\tarm64\tlibjpeg-turbo\t"
                                   r"([0-9]+(?:\.[0-9]+){2})\n", row)
              if not match:
                  raise SystemExit(f"Invalid arm64 libjpeg-turbo package identity: {name}")
              revision, upstream = match.groups()
              if not re.fullmatch(r"(?:[0-9]+:)?" + re.escape(upstream) + r"-[0-9A-Za-z.+~]+", revision):
                  raise SystemExit("libjpeg-turbo revision disagrees with source upstream version")
              files = {Path(p).resolve() for p in run("dpkg-query", "-L", name).splitlines() if p.startswith("/")}
              return revision, upstream, files

          revision, version, headers = package("libjpeg-turbo8-dev")
          runtime_revision, runtime_version, libraries = package("libjpeg-turbo8")
          if (revision, version) != (runtime_revision, runtime_version):
              raise SystemExit("libjpeg-turbo development and runtime packages disagree")
          include_dirs = set()
          for name in ("jpeglib.h", "jconfig.h"):
              matches = [p for p in headers if p.name == name and p.is_file()]
              if len(matches) != 1:
                  raise SystemExit(f"Expected one installed libjpeg-turbo8-dev header: {name}")
              include_dirs.add(str(matches[0].parent))
          with tempfile.TemporaryDirectory(prefix="libjpeg-identity-", dir=os.environ["RUNNER_TEMP"]) as temp:
              source = Path(temp) / "identity.c"
              binary = Path(temp) / "identity"
              source.write_text(r'''
          #define _GNU_SOURCE
          #include <stddef.h>
          #include <stdio.h>
          #include <jpeglib.h>
          #include <dlfcn.h>
          #ifndef LIBJPEG_TURBO_VERSION
          #error Expected libjpeg-turbo headers
          #endif
          #define STRINGIFY_INNER(x) #x
          #define STRINGIFY(x) STRINGIFY_INNER(x)
          int main(void) {
              struct jpeg_error_mgr error;
              Dl_info library;
              if (jpeg_std_error(&error) != &error ||
                  !dladdr((void *)jpeg_std_error, &library) || !library.dli_fname) return 1;
              printf("libjpeg-turbo\t%s\t%s\n", STRINGIFY(LIBJPEG_TURBO_VERSION), library.dli_fname);
              return 0;
          }
          ''')
              includes = [flag for directory in sorted(include_dirs) for flag in ("-I", directory)]
              run("cc", "-Wall", "-Wextra", "-Werror", *includes, str(source), "-ljpeg", "-ldl", "-o", str(binary))
              banner = run(str(binary))
          match = re.fullmatch(r"libjpeg-turbo\t([0-9]+(?:\.[0-9]+){2})\t(/[^\t\n]+)\n", banner)
          if not match or match[1] != version:
              raise SystemExit("Native libjpeg-turbo header version disagrees with package")
          if Path(match[2]).resolve() not in libraries:
              raise SystemExit("Loaded JPEG library is not owned by libjpeg-turbo8")
          if os.environ.get("VERIFY_BASELINE") == "1":
              if (os.environ["VERSION_STATUS"] != "passed" or os.environ["VERSION_OUTCOME"] != "success"
                      or os.environ["EXPECTED_VERSION"] != version
                      or os.environ["EXPECTED_PACKAGE_VERSION"] != revision):
                  raise SystemExit("libjpeg-turbo identity changed or the baseline version probe failed")
          print(f"{version}\t{revision}\t{version}\tnative_header_and_dpkg")
          PY
          )
          IFS=$'\t' read -r VERSION PACKAGE_VERSION UPSTREAM VERSION_SOURCE <<< "$IDENTITY"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "source_upstream_version=$UPSTREAM" >> "$GITHUB_OUTPUT"
          echo "version_source=$VERSION_SOURCE" >> "$GITHUB_OUTPUT"
          finish 0

      - name: Test 3 - Check shared library registration
        id: test3
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            rc=$1
            trap - EXIT
            if [ "$rc" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish $?' EXIT
          export LC_ALL=C
          LIBRARIES=$(ldconfig -p)
          printf '%s\n' "$LIBRARIES"
          grep -E 'libjpeg\.so[^ ]* .*AArch64.* => ' <<< "$LIBRARIES"
          finish 0

      - name: Test 4 - Architecture Verification
        id: test4
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            rc=$1
            trap - EXIT
            if [ "$rc" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish $?' EXIT
          export LC_ALL=C
          test "$(uname -m)" = aarch64
          finish 0

      - name: Test 5 - Functional Validation
        id: test5
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            rc=$1
            trap - EXIT
            if [ "$rc" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish $?' EXIT
          export LC_ALL=C
          TEST_DIR=$(mktemp -d "$RUNNER_TEMP/libjpeg-roundtrip.XXXXXX")
          cat > "$TEST_DIR/roundtrip.c" <<'C'
          #include <stddef.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <jpeglib.h>
          int main(void) {
            unsigned char input[3] = {255, 0, 0};
            unsigned char *jpeg_buf = NULL;
            unsigned long jpeg_size = 0;
            struct jpeg_compress_struct cinfo;
            struct jpeg_error_mgr jerr;
            cinfo.err = jpeg_std_error(&jerr);
            jpeg_create_compress(&cinfo);
            jpeg_mem_dest(&cinfo, &jpeg_buf, &jpeg_size);
            cinfo.image_width = 1;
            cinfo.image_height = 1;
            cinfo.input_components = 3;
            cinfo.in_color_space = JCS_RGB;
            jpeg_set_defaults(&cinfo);
            jpeg_set_quality(&cinfo, 90, TRUE);
            jpeg_start_compress(&cinfo, TRUE);
            JSAMPROW row = input;
            jpeg_write_scanlines(&cinfo, &row, 1);
            jpeg_finish_compress(&cinfo);
            jpeg_destroy_compress(&cinfo);
            if (jpeg_size == 0 || jpeg_buf == NULL) return 1;

            struct jpeg_decompress_struct dinfo;
            dinfo.err = jpeg_std_error(&jerr);
            jpeg_create_decompress(&dinfo);
            jpeg_mem_src(&dinfo, jpeg_buf, jpeg_size);
            if (jpeg_read_header(&dinfo, TRUE) != JPEG_HEADER_OK) return 2;
            if (dinfo.image_width != 1 || dinfo.image_height != 1) return 3;
            jpeg_start_decompress(&dinfo);
            unsigned char output[3] = {0, 0, 0};
            JSAMPROW outrow = output;
            jpeg_read_scanlines(&dinfo, &outrow, 1);
            jpeg_finish_decompress(&dinfo);
            jpeg_destroy_decompress(&dinfo);
            free(jpeg_buf);
            if (output[0] == 0 && output[1] == 0 && output[2] == 0) return 4;
            printf("libjpeg-roundtrip-ok\n");
            return 0;
          }
          C
          cc "$TEST_DIR/roundtrip.c" -ljpeg -o "$TEST_DIR/roundtrip"
          ROUNDTRIP=$("$TEST_DIR/roundtrip")
          printf '%s\n' "$ROUNDTRIP"
          test "$ROUNDTRIP" = libjpeg-roundtrip-ok
          finish 0

      - name: Regression applicability - package manager installed
        id: test6
        if: always()
        run: |
          set -euo pipefail
          CURRENT="${{ steps.version.outputs.version || 'unknown' }}"
          echo "current_version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest_version=not_applicable" >> "$GITHUB_OUTPUT"
          echo "next_installed_version=not_applicable" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.install.outcome }}" != success ]; then
            echo "decision=baseline_install_failed" >> "$GITHUB_OUTPUT"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "regression_result=Regression skipped: the libjpeg-turbo package installation did not succeed." >> "$GITHUB_OUTPUT"
            echo "comparison=No successfully installed baseline is available for comparison." >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.version.outcome }}" = success ] && [ "${{ steps.version.outputs.status }}" = passed ] && \
               [ "$CURRENT" != unknown ] && [ -n "$CURRENT" ] && \
               [ "${{ steps.test1.outcome }}" = success ] && [ "${{ steps.test1.outputs.status }}" = passed ] && \
               [ "${{ steps.test2.outcome }}" = success ] && [ "${{ steps.test2.outputs.status }}" = passed ] && \
               [ "${{ steps.test3.outcome }}" = success ] && [ "${{ steps.test3.outputs.status }}" = passed ] && \
               [ "${{ steps.test4.outcome }}" = success ] && [ "${{ steps.test4.outputs.status }}" = passed ] && \
               [ "${{ steps.test5.outcome }}" = success ] && [ "${{ steps.test5.outputs.status }}" = passed ]; then
            echo "decision=not_applicable_package_manager" >> "$GITHUB_OUTPUT"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "regression_result=Regression validation not applicable: tested package installed via package manager in Tests 1-5" >> "$GITHUB_OUTPUT"
            echo "comparison=The tested package is installed via a package manager in Tests 1-5, so version-to-version regression validation is not shown under the current policy." >> "$GITHUB_OUTPUT"
          else
            echo "decision=baseline_failed" >> "$GITHUB_OUTPUT"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "regression_result=Regression skipped: libjpeg-turbo baseline validation did not succeed." >> "$GITHUB_OUTPUT"
            echo "comparison=All five core checks must pass before a baseline can be compared." >> "$GITHUB_OUTPUT"
          fi
          echo "duration=0" >> "$GITHUB_OUTPUT"

      - name: Calculate test summary
        if: always()
        id: summary
        run: |
          set -euo pipefail
          PASSED=0
          FAILED=0
          SKIPPED=0
          TOTAL_DURATION=0
          check_core() {
            local status="$1" outcome="$2" duration="$3"
            if [[ "$duration" =~ ^[0-9]{1,6}$ ]]; then
              TOTAL_DURATION=$((TOTAL_DURATION + 10#$duration))
            else
              status=failed
            fi
            if [ "$status" = "passed" ] && [ "$outcome" = "success" ]; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
            fi
          }
          check_core "${{ steps.test1.outputs.status }}" "${{ steps.test1.outcome }}" "${{ steps.test1.outputs.duration }}"
          check_core "${{ steps.test2.outputs.status }}" "${{ steps.test2.outcome }}" "${{ steps.test2.outputs.duration }}"
          check_core "${{ steps.test3.outputs.status }}" "${{ steps.test3.outcome }}" "${{ steps.test3.outputs.duration }}"
          check_core "${{ steps.test4.outputs.status }}" "${{ steps.test4.outcome }}" "${{ steps.test4.outputs.duration }}"
          check_core "${{ steps.test5.outputs.status }}" "${{ steps.test5.outcome }}" "${{ steps.test5.outputs.duration }}"
          CORE_FAILED=$FAILED
          DURATION6="${{ steps.test6.outputs.duration }}"
          EXPECTED_DECISION=not_applicable_package_manager
          if [ "${{ steps.install.outcome }}" != success ]; then
            EXPECTED_DECISION=baseline_install_failed
          elif [ "$CORE_FAILED" -gt 0 ] || [ "${{ steps.version.outcome }}" != success ] || \
               [ "${{ steps.version.outputs.status }}" != passed ] || \
               [ -z "${{ steps.version.outputs.version }}" ] || \
               [ "${{ steps.version.outputs.version }}" = unknown ]; then
            EXPECTED_DECISION=baseline_failed
          fi
          if [ "${{ steps.test6.outputs.status }}" = "skipped" ] &&
             [ "${{ steps.test6.outputs.decision }}" = "$EXPECTED_DECISION" ] &&
             { { [ "$CORE_FAILED" -eq 0 ] && [ "$EXPECTED_DECISION" = not_applicable_package_manager ]; } ||
               { [ "$CORE_FAILED" -gt 0 ] && [ "$EXPECTED_DECISION" != not_applicable_package_manager ]; }; } &&
             [ "${{ steps.test6.outcome }}" = "success" ] &&
             [[ "$DURATION6" =~ ^[0-9]{1,6}$ ]]; then
            SKIPPED=1
          else
            FAILED=$((FAILED + 1))
          fi
          if [[ "$DURATION6" =~ ^[0-9]{1,6}$ ]]; then
            TOTAL_DURATION=$((TOTAL_DURATION + 10#$DURATION6))
          fi
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
          echo "core_failed=$CORE_FAILED" >> "$GITHUB_OUTPUT"
          echo "duration=$TOTAL_DURATION" >> "$GITHUB_OUTPUT"
          if [ "$FAILED" -eq 0 ]; then
            echo "overall_status=success" >> "$GITHUB_OUTPUT"
            echo "badge_status=passing" >> "$GITHUB_OUTPUT"
          else
            echo "overall_status=failure" >> "$GITHUB_OUTPUT"
            echo "badge_status=failing" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Create test summary
        if: always()
        run: |
          {
            echo "## Libjpeg-turbo Test Results"
            echo ""
            echo "- **Version:** ${{ steps.version.outputs.version || 'unknown' }}"
            echo "- **Version source:** ${{ steps.version.outputs.version_source }}"
            echo "- **Status:** ${{ steps.summary.outputs.overall_status || 'failure' }}"
            echo "- **Tests Passed:** ${{ steps.summary.outputs.passed || 0 }}"
            echo "- **Tests Failed:** ${{ steps.summary.outputs.failed || 0 }}"
            echo "- **Tests Skipped:** ${{ steps.summary.outputs.skipped || 0 }}"
            echo "- **Duration:** ${{ steps.summary.outputs.duration || 0 }}s"
            echo "- **Runner:** ubuntu-24.04 (arm64)"
            echo ""
            echo "### Test Details"
            echo "1. Test 1 - Check header installation: ${{ steps.test1.outputs.status || 'skipped' }}"
            echo "2. Test 2 - Verify native libjpeg-turbo version identity: ${{ steps.test2.outputs.status || 'skipped' }}"
            echo "3. Test 3 - Check shared library registration: ${{ steps.test3.outputs.status || 'skipped' }}"
            echo "4. Test 4 - Architecture Verification: ${{ steps.test4.outputs.status || 'skipped' }}"
            echo "5. Test 5 - Functional Validation: ${{ steps.test5.outputs.status || 'skipped' }}"
            echo "6. Package manager regression applicability: ${{ steps.test6.outputs.status }} (${{ steps.test6.outputs.decision }})"
          } >> "$GITHUB_STEP_SUMMARY"

name: Test All Packages (Batch 8) on Arm64
run-name: Arm64 Batch 8 [${{ inputs.orchestration_id || format('manual-{0}-{1}', github.run_id, github.run_attempt) }}] [nonce:${{ inputs.dispatch_nonce || 'manual-only' }}]

on:
  workflow_dispatch:
    inputs:
      orchestration_id:
        description: Exact orchestrator identity; blank uses a safe manual fallback
        required: false
        default: ""
        type: string
      dispatch_nonce:
        description: Secret exact-dispatch nonce; blank is manual-only and not publishable
        required: false
        default: ""
        type: string
      expected_sha:
        description: Exact commit expected by the orchestrator
        required: false
        default: ""
        type: string
      expected_branch:
        description: Exact branch expected by the orchestrator
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      orchestration_id:
        required: true
        type: string
      dispatch_nonce:
        required: true
        type: string
      expected_sha:
        required: true
        type: string
      expected_branch:
        required: true
        type: string

permissions:
  contents: read

jobs:

  test-shopify:
    uses: ./.github/workflows/test-shopify.yml

  test-lighttpd:
    uses: ./.github/workflows/test-lighttpd.yml

  test-minimap:
    uses: ./.github/workflows/test-minimap.yml

  test-libmpc:
    uses: ./.github/workflows/test-libmpc.yml

  test-elemental-toolkit:
    uses: ./.github/workflows/test-elemental-toolkit.yml

  test-kafkacat:
    uses: ./.github/workflows/test-kafkacat.yml

  test-huggingface_trasformers:
    uses: ./.github/workflows/test-huggingface_trasformers.yml

  test-enigmajs:
    uses: ./.github/workflows/test-enigmaJS.yml

  test-zulip:
    uses: ./.github/workflows/test-zulip.yml

  test-langchain:
    uses: ./.github/workflows/test-langchain.yml

  test-libfastcommon:
    uses: ./.github/workflows/test-libfastcommon.yml

  test-tinyproxy:
    uses: ./.github/workflows/test-tinyproxy.yml

  test-azul_system:
    uses: ./.github/workflows/test-azul_system.yml

  test-opengauss:
    uses: ./.github/workflows/test-opengauss.yml

  test-ory:
    uses: ./.github/workflows/test-ory.yml

  test-nagioscore:
    uses: ./.github/workflows/test-nagioscore.yml

  test-dnsmasq:
    uses: ./.github/workflows/test-dnsmasq.yml

  test-microk8s:
    uses: ./.github/workflows/test-microk8s.yml

  test-scala:
    uses: ./.github/workflows/test-scala.yml

  test-liboqs:
    uses: ./.github/workflows/test-liboqs.yml

  test-rabbitmq:
    uses: ./.github/workflows/test-rabbitmq.yml

  test-r:
    uses: ./.github/workflows/test-R.yml

  test-submarine:
    uses: ./.github/workflows/test-submarine.yml

  test-opensuse-leap:
    uses: ./.github/workflows/test-opensuse-leap.yml

  test-zipkin:
    uses: ./.github/workflows/test-Zipkin.yml

  test-streamlit:
    uses: ./.github/workflows/test-streamlit.yml

  test-edot-collector:
    uses: ./.github/workflows/test-edot-collector.yml

  test-libreoffice:
    uses: ./.github/workflows/test-libreoffice.yml

  test-vsftpd:
    uses: ./.github/workflows/test-vsftpd.yml

  test-orientdb:
    uses: ./.github/workflows/test-orientdb.yml

  test-k3s:
    uses: ./.github/workflows/test-k3s.yml

  test-netbsd:
    uses: ./.github/workflows/test-netbsd.yml

  test-opencart:
    uses: ./.github/workflows/test-opencart.yml

  test-wildfly:
    uses: ./.github/workflows/test-wildfly.yml

  test-yugabytedb:
    uses: ./.github/workflows/test-yugabytedb.yml

  test-fleet:
    uses: ./.github/workflows/test-fleet.yml

  test-porting_advisor:
    uses: ./.github/workflows/test-porting_advisor.yml

  test-sphinx:
    uses: ./.github/workflows/test-sphinx.yml

  test-gitbook:
    uses: ./.github/workflows/test-gitbook.yml

  test-fluentd:
    uses: ./.github/workflows/test-fluentd.yml

  test-sentry-python:
    uses: ./.github/workflows/test-sentry-python.yml

  test-cloudevents-java:
    uses: ./.github/workflows/test-cloudevents-java.yml

  test-odp:
    uses: ./.github/workflows/test-ODP.yml

  test-tidb:
    uses: ./.github/workflows/test-TiDB.yml

  test-dentos:
    uses: ./.github/workflows/test-dentos.yml

  summary:
    permissions:
      actions: read
      contents: read
    needs:
      [
        test-shopify,
        test-lighttpd,
        test-minimap,
        test-libmpc,
        test-elemental-toolkit,
        test-kafkacat,
        test-huggingface_trasformers,
        test-enigmajs,
        test-zulip,
        test-langchain,
        test-libfastcommon,
        test-tinyproxy,
        test-azul_system,
        test-opengauss,
        test-ory,
        test-nagioscore,
        test-dnsmasq,
        test-microk8s,
        test-scala,
        test-liboqs,
        test-rabbitmq,
        test-r,
        test-submarine,
        test-opensuse-leap,
        test-zipkin,
        test-streamlit,
        test-edot-collector,
        test-libreoffice,
        test-vsftpd,
        test-orientdb,
        test-k3s,
        test-netbsd,
        test-opencart,
        test-wildfly,
        test-yugabytedb,
        test-fleet,
        test-porting_advisor,
        test-sphinx,
        test-gitbook,
        test-fluentd,
        test-sentry-python,
        test-cloudevents-java,
        test-odp,
        test-tidb,
        test-dentos
      ]
    runs-on: ubuntu-24.04-arm
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # original: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Collect batch results
        id: collect
        uses: ./.github/actions/collect-batch-results
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        with:
          batch_number: "8"
          batch_title: "Batch 8"

      - name: Attest complete batch results
        id: attest
        if: steps.collect.outcome == 'success'
        env:
          ARTIFACT_NAME: batch8-test-results
          BATCH_NUMBER: "8"
          COLLECTOR_JSON_COUNT: ${{ steps.collect.outputs.json_count }}
          CURRENT_BRANCH: ${{ github.ref_name }}
          DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
          EXPECTED_BRANCH: ${{ inputs.expected_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          NEEDS_JSON: ${{ toJson(needs) }}
          ORCHESTRATION_ID: ${{ inputs.orchestration_id }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/batch_artifact_attestation.py create \
            --results-root test-results \
            --workflow-file ".github/workflows/test-all-packages-batch8.yml" \
            --batch "$BATCH_NUMBER" \
            --repository "$REPOSITORY" \
            --expected-branch "$EXPECTED_BRANCH" \
            --current-branch "$CURRENT_BRANCH" \
            --expected-sha "$EXPECTED_SHA" \
            --workflow-sha "$WORKFLOW_SHA" \
            --orchestration-id "$ORCHESTRATION_ID" \
            --dispatch-nonce "$DISPATCH_NONCE" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --artifact-name "$ARTIFACT_NAME" \
            --collector-json-count "$COLLECTOR_JSON_COUNT" \
            --needs-environment-variable NEEDS_JSON

      - name: Upload batch test results
        if: steps.collect.outcome == 'success' && steps.attest.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # original: actions/upload-artifact@v4.6.2
        with:
          name: batch8-test-results
          path: test-results
          retention-days: 90

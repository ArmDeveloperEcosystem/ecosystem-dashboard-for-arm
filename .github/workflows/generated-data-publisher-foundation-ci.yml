name: Generated data publisher foundation CI

on:
  pull_request:
    paths:
      - ".github/actions/publish-generated-data-pr/**"
      - ".github/scripts/generated_site_data_artifact.py"
      - ".github/scripts/generated_test_results_artifact.py"
      - ".github/scripts/generated-site-data-requirements.txt"
      - ".github/scripts/tests/**"
      - ".github/GLOBAL_TEST_SUMMARY_DELIVERY.md"
      - ".github/GENERATED_SITE_DATA_REVIEW.md"
      - ".github/workflows/generated-data-publisher-foundation-ci.yml"
      - ".github/workflows/generated-site-data-review.yml"
      - ".github/workflows/test-all-packages-summary.yml"

permissions:
  contents: read

jobs:
  publisher-foundation:
    name: Publisher foundation
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Fetch reviewed package workflow source
        env:
          REVIEWED_SOURCE_COMMIT: 73155d0d3a3dc73da08c62bc2bb7eccf281c6008
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REVIEWED_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${REVIEWED_SOURCE_COMMIT}^{commit}" 2>/dev/null ||
            git fetch --no-tags --depth=1 origin "$REVIEWED_SOURCE_COMMIT"
          git cat-file -e "${REVIEWED_SOURCE_COMMIT}^{commit}"


      - name: Run publisher unit tests
        run: >-
          python3 -m unittest discover
          -s .github/actions/publish-generated-data-pr/tests
          -p 'test_*.py'
          -v

      - name: Run generated data artifact tests
        run: >-
          python3 -m unittest discover
          -s .github/scripts/tests
          -p 'test_*.py'
          -v

      - name: Validate composite action YAML
        run: >-
          ruby -e
          'require "yaml";
          document = YAML.safe_load(
            File.read(".github/actions/publish-generated-data-pr/action.yml"),
            aliases: false
          );
          abort "action metadata must be a mapping" unless document.is_a?(Hash)'

      - name: Validate workflow YAML
        run: |
          ruby -e '
            require "yaml"
            ARGV.each do |path|
              document = YAML.safe_load(File.read(path), aliases: false)
              abort "#{path} must be a mapping" unless document.is_a?(Hash)
            end
          ' \
            .github/workflows/generated-data-publisher-foundation-ci.yml \
            .github/workflows/generated-site-data-review.yml \
            .github/workflows/test-all-packages-summary.yml

      - name: Lint foundation workflow
        env:
          ACTIONLINT_SHA256: 325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6
          ACTIONLINT_VERSION: 1.7.12
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          binary="$RUNNER_TEMP/actionlint"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_arm64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" actionlint
          chmod 0755 "$binary"
          "$binary" \
            .github/workflows/generated-data-publisher-foundation-ci.yml \
            .github/workflows/generated-site-data-review.yml

          # The legacy summary-rendering shell block is not ShellCheck-clean.
          # Its embedded Python is compiled separately by the supply-chain tests.
          "$binary" -shellcheck= \
            .github/workflows/test-all-packages-summary.yml

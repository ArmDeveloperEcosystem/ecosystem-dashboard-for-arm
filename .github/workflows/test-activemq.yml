name: Test ActiveMQ on Arm64

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-activemq.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-activemq.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-activemq.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-activemq.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-activemq.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-activemq.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-activemq.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-activemq.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-activemq.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-activemq.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-activemq.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-activemq.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-activemq.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-activemq.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-activemq.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-activemq.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-activemq.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-activemq.outputs.regression_next_installed_version }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-activemq.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-activemq.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-activemq.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-activemq.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-activemq.outputs.timestamp }}
jobs:
  test-activemq:
    runs-on: ubuntu-24.04-arm

    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'ActiveMQ'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=activemq" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/opensource_packages/activemq" >> "$GITHUB_OUTPUT"
      - name: Install ActiveMQ
        id: install
        run: |
          set -euo pipefail
          echo "Installing ActiveMQ from Ubuntu packages..."

          bash .github/actions/apt-bootstrap/bootstrap.sh --packages "default-jre-headless activemq"

          # Find activemq binary
          ACTIVEMQ_BIN=$(dpkg -L activemq | grep '/bin/activemq$' | head -1 || true)

          if [ -z "$ACTIVEMQ_BIN" ]; then
            echo "✗ Could not find activemq binary after installation"
            dpkg -L activemq || true
            echo "install_status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

          if [ ! -x "$ACTIVEMQ_BIN" ]; then
            echo "✗ activemq binary exists but is not executable: $ACTIVEMQ_BIN"
            ls -l "$ACTIVEMQ_BIN" || true
            echo "install_status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "✓ ActiveMQ installed; binary at: $ACTIVEMQ_BIN"

          # Export for later steps
          echo "ACTIVEMQ_BIN=$ACTIVEMQ_BIN" >> $GITHUB_ENV
          # Match the Java runtime selected by the packaged activemq-options.
          echo "ACTIVEMQ_JAVA=/usr/lib/jvm/default-java/bin/java" >> $GITHUB_ENV

          echo "install_status=success" >> $GITHUB_OUTPUT

      # ============================================================
      # Get ActiveMQ version (via dpkg, not CLI)
      # ============================================================
      - name: Get ActiveMQ version
        id: version
        run: |
          VERSION=$(dpkg-query -W -f='${Version}\n' activemq 2>/dev/null | head -1 || true)

          if [ -z "$VERSION" ]; then
            VERSION="unknown"
          fi

          echo "Detected ActiveMQ (package) version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # ============================================================
      # Tests (5 meaningful smoke tests)
      # ============================================================

      - name: Test 1 - Check activemq binary exists and is executable
        id: test1
        continue-on-error: true
        run: |
          START_TIME=$(date +%s)

          ACTIVEMQ_BIN="${ACTIVEMQ_BIN:-$(command -v activemq || true)}"

          if [ -n "$ACTIVEMQ_BIN" ] && [ -x "$ACTIVEMQ_BIN" ]; then
            echo "✓ activemq binary found and is executable: $ACTIVEMQ_BIN"
            echo "status=passed" >> $GITHUB_OUTPUT
          else
            echo "✗ activemq binary missing or not executable (ACTIVEMQ_BIN='$ACTIVEMQ_BIN')"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
            fi

          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT

      - name: Test 2 - Check ActiveMQ package is installed (dpkg status)
        id: test2
        continue-on-error: true
        run: |
          START_TIME=$(date +%s)

          if dpkg -s activemq 2>/dev/null | grep -q '^Status: install ok installed'; then
            echo "✓ activemq package is installed (dpkg status OK)"
            dpkg -s activemq | grep '^Version' || true
            echo "status=passed" >> $GITHUB_OUTPUT
          else
            echo "✗ activemq package not in 'install ok installed' state"
            dpkg -s activemq || true
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
            fi

          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT

      - name: Test 3 - Check 'activemq --help' output
        id: test3
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local rc="$1"
            trap - EXIT
            if [ "$rc" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish "$?"' EXIT

          if [ ! -x "${ACTIVEMQ_BIN:-}" ] || [ ! -x "${ACTIVEMQ_JAVA:-}" ]; then
            echo "::error::Packaged ActiveMQ launcher or Java runtime is missing"
            exit 1
          fi

          # The packaged launcher selects user activemq. A different non-root
          # user leaves its Java command prefix unset, causing 'not found'.
          if OUTPUT=$(timeout --signal=TERM --kill-after=5s 30s sudo -u activemq env JAVACMD="$ACTIVEMQ_JAVA" "$ACTIVEMQ_BIN" --help 2>&1); then
            HELP_EXIT=0
          else
            HELP_EXIT=$?
          fi
          printf '%s\n' "$OUTPUT"
          echo "help_exit_code=$HELP_EXIT" >> "$GITHUB_OUTPUT"

          if [ "$HELP_EXIT" -ne 0 ]; then
            echo "::error::'activemq --help' exited with $HELP_EXIT"
            exit "$HELP_EXIT"
          fi

          if ! grep -Eq '^Usage: Main .*\[task\] \[task-options\] \[task data\]$' <<< "$OUTPUT" ||
             ! grep -Eq '^Tasks:[[:space:]]*$' <<< "$OUTPUT" ||
             ! grep -Eq '^[[:space:]]+start[[:space:]]+-[[:space:]]+Start' <<< "$OUTPUT" ||
             ! grep -Eq '^Task Options \(Options specific to each task\):[[:space:]]*$' <<< "$OUTPUT" ||
             ! grep -Eq '^[[:space:]]+-h,-\?,--help[[:space:]]+-' <<< "$OUTPUT" ||
             grep -Eqi '(^ERROR:|Exception in thread|: (not found|command not found|Permission denied)|could not (find|create)|unable to access jarfile|Unrecognized option:)' <<< "$OUTPUT"; then
            echo "::error::'activemq --help' did not produce genuine help without launcher errors"
            exit 1
          fi

          echo "'activemq --help' completed and printed task usage/options"
          finish 0

      - name: Test 4 - Check Java dependency
        id: test4
        continue-on-error: true
        run: |
          START_TIME=$(date +%s)

          if [ -x "${ACTIVEMQ_JAVA:-}" ] && sudo -u activemq "$ACTIVEMQ_JAVA" -version; then
            echo "Packaged ActiveMQ Java runtime is available: $ACTIVEMQ_JAVA"
            echo "status=passed" >> $GITHUB_OUTPUT
          else
            echo "Packaged ActiveMQ Java runtime is missing or '-version' failed"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
            fi

          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT

      - name: Test 5 - Check ActiveMQ has configuration files under /etc
        id: test5
        continue-on-error: true
        run: |
          START_TIME=$(date +%s)
          # Functional Validation

          CONF_FILES=$(dpkg -L activemq 2>/dev/null | grep '^/etc/' || true)

          if [ -n "$CONF_FILES" ]; then
            echo "✓ ActiveMQ has configuration files under /etc:"
            echo "$CONF_FILES"
            echo "status=passed" >> $GITHUB_OUTPUT
          else
            echo "✗ No ActiveMQ-owned configuration files found under /etc"
            dpkg -L activemq || true
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
            fi

          # Architecture Verification
          ARCH=$(uname -m)
          if [ "$ARCH" != "aarch64" ]; then
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT

      # ============================================================
      # Calculate test summary

      - name: Regression applicability - package manager installed
        id: test6
        run: |
          set -euo pipefail
          CURRENT="${{ steps.version.outputs.version || 'unknown' }}"
          echo "current_version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest_version=not_applicable" >> "$GITHUB_OUTPUT"
          echo "next_installed_version=not_applicable" >> "$GITHUB_OUTPUT"
          echo "decision=not_applicable_package_manager" >> "$GITHUB_OUTPUT"
          echo "regression_result=Regression validation not applicable: tested package installed via package manager in Tests 1-5" >> "$GITHUB_OUTPUT"
          echo "comparison=The tested package is installed via a package manager in Tests 1-5, so version-to-version regression validation is not shown under the current policy." >> "$GITHUB_OUTPUT"
          echo "status=skipped" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"

      - name: Calculate test summary
        if: always()
        id: summary
        run: |
          set -euo pipefail
          PASSED=0
          FAILED=0
          SKIPPED=0
          TOTAL_DURATION=0
          check_test() {
            local status="$1"
            local outcome="$2"
            local duration="$3"
            if [[ "$duration" =~ ^[0-9]{1,6}$ ]]; then
              TOTAL_DURATION=$((TOTAL_DURATION + 10#$duration))
            else
              status=failed
            fi
            if [ "$status" = passed ] && [ "$outcome" = success ]; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
            fi
          }
          check_test "${{ steps.test1.outputs.status || 'failed' }}" "${{ steps.test1.outcome }}" "${{ steps.test1.outputs.duration || 0 }}"
          check_test "${{ steps.test2.outputs.status || 'failed' }}" "${{ steps.test2.outcome }}" "${{ steps.test2.outputs.duration || 0 }}"
          check_test "${{ steps.test3.outputs.status || 'failed' }}" "${{ steps.test3.outcome }}" "${{ steps.test3.outputs.duration || 0 }}"
          check_test "${{ steps.test4.outputs.status || 'failed' }}" "${{ steps.test4.outcome }}" "${{ steps.test4.outputs.duration || 0 }}"
          check_test "${{ steps.test5.outputs.status || 'failed' }}" "${{ steps.test5.outcome }}" "${{ steps.test5.outputs.duration || 0 }}"
          CORE_FAILED=$FAILED
          if [ "${{ steps.install.outcome }}" = success ] &&
             [ "${{ steps.install.outputs.install_status }}" = success ] &&
             [ "${{ steps.version.outcome }}" = success ] &&
             [ -n "${{ steps.version.outputs.version }}" ] &&
             [ "${{ steps.version.outputs.version }}" != unknown ] &&
             [ "${{ steps.test6.outcome }}" = success ] &&
             [ "${{ steps.test6.outputs.status }}" = skipped ] &&
             [ "${{ steps.test6.outputs.decision }}" = not_applicable_package_manager ]; then
            SKIPPED=1
          else
            FAILED=$((FAILED + 1))
          fi

          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT
          echo "core_failed=$CORE_FAILED" >> $GITHUB_OUTPUT
          echo "duration=$TOTAL_DURATION" >> $GITHUB_OUTPUT

          if [ $FAILED -eq 0 ]; then
            echo "overall_status=success" >> $GITHUB_OUTPUT
            echo "badge_status=passing" >> $GITHUB_OUTPUT
          else
            echo "overall_status=failure" >> $GITHUB_OUTPUT
            echo "badge_status=failing" >> $GITHUB_OUTPUT
            exit 1
          fi
      - name: Create test summary
        if: always()
        run: |
          echo "## ActiveMQ Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ steps.summary.outputs.overall_status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests Passed:** ${{ steps.summary.outputs.passed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests Failed:** ${{ steps.summary.outputs.failed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests Skipped:** ${{ steps.summary.outputs.skipped }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Duration:** ${{ steps.summary.outputs.duration || 0 }}s" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner:** ubuntu-24.04 (arm64)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Details" >> $GITHUB_STEP_SUMMARY
          report_test() {
            local status="$2"
            if [ "$status" != passed ] || [ "$3" != success ]; then
              status=failed
            fi
            echo "$1: $status (step outcome: $3)" >> "$GITHUB_STEP_SUMMARY"
          }
          report_test "1. Check activemq binary exists and is executable" "${{ steps.test1.outputs.status }}" "${{ steps.test1.outcome }}"
          report_test "2. Check activemq package dpkg status" "${{ steps.test2.outputs.status }}" "${{ steps.test2.outcome }}"
          report_test "3. Check 'activemq --help' output" "${{ steps.test3.outputs.status }}" "${{ steps.test3.outcome }}"
          report_test "4. Check Java dependency" "${{ steps.test4.outputs.status }}" "${{ steps.test4.outcome }}"
          report_test "5. Check ActiveMQ has configuration files under /etc" "${{ steps.test5.outputs.status }}" "${{ steps.test5.outcome }}"

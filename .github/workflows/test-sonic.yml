# Bounded source-module smoke only. Scope approval is pending.
# No SONiC image build/boot, sonic-cfggen, ConfigDB, ASIC, or dataplane coverage.
# Immutable branch snapshots: 202311 baseline and 202405 candidate, not latest.
# Newer config_samples imports the platform/swsscommon stack; no mocks are used.
name: Test SONiC config_samples component on Arm64

permissions:
  contents: read

on:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-sonic.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-sonic.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-sonic.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-sonic.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-sonic.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-sonic.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-sonic.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-sonic.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-sonic.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-sonic.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-sonic.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-sonic.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-sonic.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-sonic.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-sonic.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-sonic.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-sonic.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-sonic.outputs.regression_next_installed_version }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-sonic.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-sonic.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-sonic.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-sonic.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-sonic.outputs.timestamp }}
jobs:
  test-sonic:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'SONiC config_samples component'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
    env:
      SONIC_PINS: '{"baseline":{"release":"202311","ref":"refs/heads/202311","revision":"e5cd212fec5c47e88be1afbaac079005c45f6db4","sha256":"1232dc829c1e2e9fb80cda8ab96c7601552eb947a71118e32eaa9f90091c7880"},"candidate":{"release":"202405","ref":"refs/heads/202405","revision":"cfc766e13eccab4e7603808db3bfa9c5b2dfef17","sha256":"87cec17ce676c54ec57364b33749c6e1ac9aba2356b5eb06579bd1215184e47d"}}'
      SONIC_SOURCE_INSTALL: |
        import hashlib
        import json
        import os
        from pathlib import Path
        import sys
        import urllib.request

        pin = json.loads(os.environ['SONIC_PINS'])[sys.argv[1]]
        root = Path(os.environ['SONIC_ROOT']) / sys.argv[1]
        root.mkdir()
        url = ('https://raw.githubusercontent.com/sonic-net/sonic-buildimage/' +
               pin['revision'] + '/src/sonic-config-engine/config_samples.py')
        with urllib.request.urlopen(url, timeout=30) as response:
            source = response.read(100001)
        assert len(source) < 100001
        assert hashlib.sha256(source).hexdigest() == pin['sha256'], 'Source digest mismatch'
        (root / 'config_samples.py').write_bytes(source)
        manifest = dict(pin, repository='sonic-net/sonic-buildimage',
                        component='src/sonic-config-engine/config_samples.py',
                        installation_method='source-module')
        (root / 'source.json').write_text(json.dumps(manifest, sort_keys=True))
        print(json.dumps(manifest, sort_keys=True))
      SONIC_CHECK: |
        import hashlib
        import importlib.util
        import json
        import os
        from pathlib import Path
        import platform
        import sys
        from ipaddress import ip_address

        lane, mode = sys.argv[1:]
        pins = json.loads(os.environ['SONIC_PINS'])
        pin = pins[lane]
        root = Path(os.environ['SONIC_ROOT']).resolve() / lane
        path = root / 'config_samples.py'
        assert not path.is_symlink() and path.is_file(), 'Missing or redirected component'
        expected = dict(pin, repository='sonic-net/sonic-buildimage',
                        component='src/sonic-config-engine/config_samples.py',
                        installation_method='source-module')
        assert json.loads((root / 'source.json').read_text()) == expected, 'Component/source identity mismatch'
        source = path.read_bytes()
        assert hashlib.sha256(source).hexdigest() == pin['sha256'], 'Installed source digest mismatch'
        version = 'config_samples@' + pin['release'] + '+' + pin['revision']
        spec = importlib.util.spec_from_file_location('config_samples', path)
        module = importlib.util.module_from_spec(spec)
        # Execute the verified bytes, without accepting a stale bytecode cache.
        exec(compile(source, str(path), 'exec'), module.__dict__)
        assert Path(module.__file__).resolve() == path, 'Component ownership mismatch'
        expected_modes = {'t1', 'l2', 'empty', 'l1', 'l3'}
        if lane == 'candidate':
            expected_modes.add('t1-smartswitch')
        assert set(module.get_available_config()) == expected_modes

        def seed():
            return {'DEVICE_METADATA': {'localhost': {'hostname': 'arm-smoke', 'type': 'ToRRouter'}},
                    'PORT': {port: {} for port in ['Ethernet12', 'Ethernet0', 'Ethernet8', 'Ethernet4']}}

        def l2():
            data = seed()
            data['PORT']['Ethernet4']['admin_status'] = 'down'
            result = module.generate_sample_config(data, 'L2')
            assert result['VLAN'] == {'Vlan1000': {'vlanid': '1000'}}
            assert result['VLAN_MEMBER'] == {
                'Vlan1000|' + port: {'tagging_mode': 'untagged'} for port in data['PORT']}
            assert result['DEVICE_METADATA']['localhost']['hostname'] == 'arm-smoke'
            assert result['PORT'] == {port: {'admin_status': 'down' if port == 'Ethernet4' else 'up'}
                                      for port in data['PORT']}
            return result

        def t1():
            result = module.generate_sample_config(seed(), 't1')
            assert result['DEVICE_METADATA']['localhost'] == {
                'hostname': 'sonic', 'type': 'LeafRouter', 'bgp_asn': '65100'}
            assert result['LOOPBACK_INTERFACE'] == {'Loopback0|10.1.0.1/32': {}}
            assert result['DEVICE_NEIGHBOR'] == {}
            assert result['PORT'] == {port: {'admin_status': 'up', 'mtu': '9100'} for port in seed()['PORT']}
            assert result['INTERFACE'] == {
                'Ethernet0|10.0.0.0/31': {}, 'Ethernet4|10.0.0.2/31': {},
                'Ethernet8|10.0.0.4/31': {}, 'Ethernet12|10.0.0.6/31': {}}
            expected_neighbors = {}
            for peer, local, name, asn in [
                ('10.0.0.1', '10.0.0.0', 'ARISTA01T2', '65200'),
                ('10.0.0.3', '10.0.0.2', 'ARISTA02T2', '65200'),
                ('10.0.0.5', '10.0.0.4', 'ARISTA01T0', '64001'),
                ('10.0.0.7', '10.0.0.6', 'ARISTA02T0', '64002')]:
                expected_neighbors[peer] = dict(rrclient=0, name=name, local_addr=local,
                    nhopself=0, holdtime='180', asn=asn, keepalive='60')
            assert result['BGP_NEIGHBOR'] == expected_neighbors
            large = seed()
            ports = ['Ethernet' + str(i * 4) for i in range(130)]
            large['PORT'] = {port: {} for port in ports}
            large = module.generate_sample_config(large, 't1')
            assert large['DEVICE_METADATA'] == result['DEVICE_METADATA']
            assert large['LOOPBACK_INTERFACE'] == result['LOOPBACK_INTERFACE']
            assert large['DEVICE_NEIGHBOR'] == {}
            assert large['PORT'] == {port: {'admin_status': 'up', 'mtu': '9100'} for port in ports}
            interfaces = {}
            neighbors = {}
            for index, port in enumerate(ports):
                local = ip_address('10.0.0.0') + index * 2
                peer = local + 1
                uplink = index < 65
                ordinal = index + 1 if uplink else index - 64
                interfaces[f'{port}|{local}/31'] = {}
                neighbors[str(peer)] = dict(rrclient=0,
                    name=f'ARISTA{ordinal:02d}' + ('T2' if uplink else 'T0'),
                    local_addr=str(local), nhopself=0, holdtime='180',
                    asn='65200' if uplink else str(64000 + ordinal), keepalive='60')
            assert large['INTERFACE'] == interfaces, 'Large T1 interface configuration mismatch'
            assert large['BGP_NEIGHBOR'] == neighbors, 'Large T1 BGP configuration mismatch'
            return {'small': result, 'large': large}

        def other():
            empty = module.generate_sample_config({'DEVICE_METADATA': {'localhost': {}}, 'PORT': {}}, 'empty')
            assert empty == {'DEVICE_METADATA': {'localhost': {'hostname': 'sonic', 'type': 'LeafRouter'}}}
            preserved = module.generate_sample_config(seed(), 'empty')
            assert preserved == {'DEVICE_METADATA': seed()['DEVICE_METADATA']}
            l1 = module.generate_sample_config(seed(), 'l1')
            assert l1['PORT'] == {port: {'admin_status': 'up', 'mtu': '9100'} for port in seed()['PORT']}
            l3 = module.generate_sample_config(seed(), 'l3')
            assert l3['LOOPBACK_INTERFACE'] == {'Loopback0': {}, 'Loopback0|10.1.0.1/32': {}}
            assert l3['INTERFACE'] == {port: {} for port in seed()['PORT']}
            assert l3['BGP_NEIGHBOR'] == {} and l3['DEVICE_NEIGHBOR'] == {}
            try:
                module.generate_sample_config(seed(), 'invalid-mode')
            except KeyError:
                pass
            else:
                raise AssertionError('Unknown mode accepted')
            return {'empty': empty, 'preserved': preserved, 'l1': l1, 'l3': l3}

        if mode == 'identity':
            print(version)
        elif mode == 'native':
            assert platform.system() == 'Linux', platform.system()
            assert platform.machine() == 'aarch64', platform.machine()
            assert sys.maxsize > 2**32
            print(json.dumps(dict(expected, version=version, machine=platform.machine())))
        elif mode in {'l2', 't1', 'other'}:
            print(json.dumps({'l2': l2, 't1': t1, 'other': other}[mode](), sort_keys=True))
        elif mode == 'all':
            assert platform.system() == 'Linux' and platform.machine() == 'aarch64'
            result = {'l2': l2(), 't1': t1(), 'other': other()}
            common = {'ACL': {'FLEX_COUNTER_STATUS': 'disable',
                             'FLEX_COUNTER_DELAY_STATUS': 'true', 'POLL_INTERVAL': '10000'}}
            for data in [result['l2'], result['t1']['small'], result['t1']['large'],
                         result['other']['l1'], result['other']['l3']]:
                assert data['FLEX_COUNTER_TABLE'] == common
            if lane == 'candidate':
                data = seed()
                dpus = {'dpu0': {'midplane_interface': 'dpu0'}, 'dpu1': {'midplane_interface': 'dpu1'}}
                data['DPUS'] = dpus
                smart = module.generate_sample_config(data, 't1-smartswitch')
                expected_smart = dict(result['t1']['small'], DPUS=dpus,
                    DEVICE_METADATA={'localhost': dict(result['t1']['small']['DEVICE_METADATA']['localhost'], subtype='SmartSwitch')},
                    MID_PLANE_BRIDGE={'GLOBAL': {'bridge': 'bridge_midplane', 'ip_prefix': '169.254.200.254/24'}},
                    DHCP_SERVER_IPV4={'bridge_midplane': {
                        'gateway': '169.254.200.254', 'lease_time': '3600', 'mode': 'PORT',
                        'netmask': '255.255.255.0', 'state': 'enabled'}},
                    DHCP_SERVER_IPV4_PORT={
                        'bridge_midplane|dpu0': {'ips': ['169.254.200.1']},
                        'bridge_midplane|dpu1': {'ips': ['169.254.200.2']}})
                assert smart == expected_smart, 'Candidate SmartSwitch configuration mismatch'
            # Compare all shared configuration data without dropping fields.
            comparison = Path(os.environ['SONIC_ROOT']) / 'baseline-comparison.json'
            if lane == 'baseline':
                comparison.write_text(json.dumps(result, sort_keys=True))
            else:
                assert json.loads(comparison.read_text()) == result, 'Candidate configuration regression'
            print(version)
        else:
            raise AssertionError('Unknown smoke mode')
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=sonic" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/opensource_packages/sonic" >> "$GITHUB_OUTPUT"

      - name: Install pinned SONiC config_samples source module
        id: install
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local RC="$1"
            trap - EXIT
            if [ "$RC" -eq 0 ]; then
              echo "install_status=success" >> "$GITHUB_OUTPUT"
            else
              echo "install_status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap 'finish "$?"' EXIT
          timeout --kill-after=10s 300s bash .github/actions/apt-bootstrap/bootstrap.sh --packages "python3-venv"
          SONIC_ROOT=$(mktemp -d "$RUNNER_TEMP/sonic-config-samples.XXXXXX")
          export SONIC_ROOT
          echo "SONIC_ROOT=$SONIC_ROOT" >> "$GITHUB_ENV"
          python3 -m venv "$SONIC_ROOT/venv"
          SONIC_PYTHON="$SONIC_ROOT/venv/bin/python"
          echo "SONIC_PYTHON=$SONIC_PYTHON" >> "$GITHUB_ENV"
          # natsort is a dependency; the tested SONiC module is installed from source.
          timeout --kill-after=5s 120s "$SONIC_PYTHON" -I -m pip install --disable-pip-version-check --no-input --retries 2 --timeout 30 --index-url https://pypi.org/simple natsort==8.4.0
          timeout --kill-after=5s 60s "$SONIC_PYTHON" -I -c "$SONIC_SOURCE_INSTALL" baseline
          timeout --kill-after=5s 30s "$SONIC_PYTHON" -I -c "$SONIC_CHECK" baseline identity
          finish 0

      - name: Identify installed SONiC source subcomponent
        id: version
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local RC="$1"
            trap - EXIT
            if [ "$RC" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap 'finish "$?"' EXIT
          [ "${{ steps.install.outcome }}" = success ]
          [ "${{ steps.install.outputs.install_status }}" = success ]
          VERSION=$(timeout --kill-after=5s 30s "$SONIC_PYTHON" -I -c "$SONIC_CHECK" baseline identity)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          finish 0

      - name: Test 1 - SONiC config_samples - Verify source ownership and native Arm64
        id: test1
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local RC="$1"
            trap - EXIT
            if [ "$RC" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap 'finish "$?"' EXIT
          [ "${{ steps.install.outcome }}" = success ]
          [ "${{ steps.install.outputs.install_status }}" = success ]
          [ "${{ steps.version.outcome }}" = success ]
          [ "${{ steps.version.outputs.status }}" = passed ]
          timeout --kill-after=5s 30s "$SONIC_PYTHON" -I -c "$SONIC_CHECK" baseline native
          finish 0

      - name: Test 2 - SONiC config_samples - Verify exact component baseline identity
        id: test2
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local RC="$1"
            trap - EXIT
            if [ "$RC" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap 'finish "$?"' EXIT
          [ "${{ steps.install.outcome }}" = success ]
          [ "${{ steps.install.outputs.install_status }}" = success ]
          [ "${{ steps.version.outcome }}" = success ]
          [ "${{ steps.version.outputs.status }}" = passed ]
          VERSION=$(timeout --kill-after=5s 30s "$SONIC_PYTHON" -I -c "$SONIC_CHECK" baseline identity)
          [ "$VERSION" = "${{ steps.version.outputs.version }}" ]
          finish 0

      - name: Test 3 - SONiC config_samples - Generate and assert VLAN configuration
        id: test3
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local RC="$1"
            trap - EXIT
            if [ "$RC" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap 'finish "$?"' EXIT
          [ "${{ steps.install.outcome }}" = success ]
          [ "${{ steps.install.outputs.install_status }}" = success ]
          [ "${{ steps.version.outcome }}" = success ]
          [ "${{ steps.version.outputs.status }}" = passed ]
          timeout --kill-after=5s 30s "$SONIC_PYTHON" -I -c "$SONIC_CHECK" baseline l2
          finish 0

      - name: Test 4 - SONiC config_samples - Generate and assert T1 BGP configuration
        id: test4
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local RC="$1"
            trap - EXIT
            if [ "$RC" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap 'finish "$?"' EXIT
          [ "${{ steps.install.outcome }}" = success ]
          [ "${{ steps.install.outputs.install_status }}" = success ]
          [ "${{ steps.version.outcome }}" = success ]
          [ "${{ steps.version.outputs.status }}" = passed ]
          timeout --kill-after=5s 30s "$SONIC_PYTHON" -I -c "$SONIC_CHECK" baseline t1
          finish 0

      - name: Test 5 - SONiC config_samples - Assert empty L1 L3 and invalid configurations
        id: test5
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local RC="$1"
            trap - EXIT
            if [ "$RC" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap 'finish "$?"' EXIT
          [ "${{ steps.install.outcome }}" = success ]
          [ "${{ steps.install.outputs.install_status }}" = success ]
          [ "${{ steps.version.outcome }}" = success ]
          [ "${{ steps.version.outputs.status }}" = passed ]
          timeout --kill-after=5s 30s "$SONIC_PYTHON" -I -c "$SONIC_CHECK" baseline other
          finish 0

      - name: Test 6 - Install and compare pinned SONiC config_samples candidate
        id: test6
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          NEXT_INSTALLED=not_installed
          finish() {
            local RC="$1"
            trap - EXIT
            if [ "$RC" -ne 0 ]; then
              echo "status=failed" >> "$GITHUB_OUTPUT"
              echo "decision=next_regression_failed" >> "$GITHUB_OUTPUT"
              echo "regression_result=SONiC config_samples candidate source installation or configuration comparison failed." >> "$GITHUB_OUTPUT"
              echo "comparison=Only the pinned config_samples source subcomponent is in scope; no SONiC OS or dataplane validation." >> "$GITHUB_OUTPUT"
            fi
            echo "next_installed_version=$NEXT_INSTALLED" >> "$GITHUB_OUTPUT"
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap 'finish "$?"' EXIT
          CURRENT="${{ steps.version.outputs.version || 'unknown' }}"
          echo "current_version=$CURRENT" >> "$GITHUB_OUTPUT"
          LATEST="config_samples@202405+cfc766e13eccab4e7603808db3bfa9c5b2dfef17"
          echo "latest_version=$LATEST" >> "$GITHUB_OUTPUT"
          if ! { [ "${{ steps.install.outcome }}" = success ] && [ "${{ steps.install.outputs.install_status }}" = success ]; }; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "decision=baseline_install_failed" >> "$GITHUB_OUTPUT"
            echo "regression_result=No successfully installed SONiC config_samples baseline." >> "$GITHUB_OUTPUT"
            echo "comparison=Source-component comparison requires a successful baseline install." >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.version.outcome }}" != success ] || [ "${{ steps.version.outputs.status }}" != passed ] || \
               ! { [ "${{ steps.test1.outcome }}" = success ] && [ "${{ steps.test1.outputs.status }}" = passed ] && \
               [ "${{ steps.test2.outcome }}" = success ] && [ "${{ steps.test2.outputs.status }}" = passed ] && \
               [ "${{ steps.test3.outcome }}" = success ] && [ "${{ steps.test3.outputs.status }}" = passed ] && \
               [ "${{ steps.test4.outcome }}" = success ] && [ "${{ steps.test4.outputs.status }}" = passed ] && \
               [ "${{ steps.test5.outcome }}" = success ] && [ "${{ steps.test5.outputs.status }}" = passed ]; }; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "decision=baseline_failed" >> "$GITHUB_OUTPUT"
            echo "regression_result=SONiC config_samples baseline checks failed." >> "$GITHUB_OUTPUT"
            echo "comparison=All five core checks must pass before source-component comparison." >> "$GITHUB_OUTPUT"
          else
            BASELINE=$(timeout --kill-after=5s 30s "$SONIC_PYTHON" -I -c "$SONIC_CHECK" baseline all)
            [ "$BASELINE" = "$CURRENT" ]
            timeout --kill-after=5s 60s "$SONIC_PYTHON" -I -c "$SONIC_SOURCE_INSTALL" candidate
            NEXT_INSTALLED=$(timeout --kill-after=5s 30s "$SONIC_PYTHON" -I -c "$SONIC_CHECK" candidate identity)
            [ "$NEXT_INSTALLED" = "$LATEST" ]
            VALIDATED=$(timeout --kill-after=5s 30s "$SONIC_PYTHON" -I -c "$SONIC_CHECK" candidate all)
            [ "$VALIDATED" = "$LATEST" ]
            echo "status=passed" >> "$GITHUB_OUTPUT"
            echo "decision=next_install_validated" >> "$GITHUB_OUTPUT"
            echo "regression_result=Pinned SONiC config_samples candidate installed and configuration behavior compared on native Arm64." >> "$GITHUB_OUTPUT"
            echo "comparison=Source component 202311 to 202405: identical complete VLAN, BGP, empty, L1 and L3 data, plus assertions for the candidate SmartSwitch bridge and DHCP addition. No OS boot, ConfigDB, ASIC or dataplane coverage; this is a pinned candidate, not a latest-release claim." >> "$GITHUB_OUTPUT"
          fi
          finish 0

      - name: Calculate test summary
        id: summary
        if: always()
        run: |
          set -euo pipefail
          PASSED=0
          FAILED=0
          SKIPPED=0
          TOTAL_DURATION=0
          check_core() {
            local status="$1" outcome="$2" duration="$3"
            if [[ "$duration" =~ ^[0-9]{1,6}$ ]]; then
              TOTAL_DURATION=$((TOTAL_DURATION + 10#$duration))
            else
              status=failed
            fi
            if [ "$status" = passed ] && [ "$outcome" = success ]; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
            fi
          }
          check_core "${{ steps.test1.outputs.status }}" "${{ steps.test1.outcome }}" "${{ steps.test1.outputs.duration }}"
          check_core "${{ steps.test2.outputs.status }}" "${{ steps.test2.outcome }}" "${{ steps.test2.outputs.duration }}"
          check_core "${{ steps.test3.outputs.status }}" "${{ steps.test3.outcome }}" "${{ steps.test3.outputs.duration }}"
          check_core "${{ steps.test4.outputs.status }}" "${{ steps.test4.outcome }}" "${{ steps.test4.outputs.duration }}"
          check_core "${{ steps.test5.outputs.status }}" "${{ steps.test5.outcome }}" "${{ steps.test5.outputs.duration }}"
          CORE_FAILED=$FAILED
          EXPECTED_DECISION=next_install_validated
          if ! { [ "${{ steps.install.outcome }}" = success ] && [ "${{ steps.install.outputs.install_status }}" = success ]; }; then
            EXPECTED_DECISION=baseline_install_failed
          elif [ "$CORE_FAILED" -gt 0 ] || [ "${{ steps.version.outcome }}" != success ] || \
               [ "${{ steps.version.outputs.status }}" != passed ]; then
            EXPECTED_DECISION=baseline_failed
          fi
          STATUS6="${{ steps.test6.outputs.status }}"
          DECISION6="${{ steps.test6.outputs.decision }}"
          OUTCOME6="${{ steps.test6.outcome }}"
          DURATION6="${{ steps.test6.outputs.duration }}"
          VALID6=false
          if [[ "$DURATION6" =~ ^[0-9]{1,6}$ ]]; then
            TOTAL_DURATION=$((TOTAL_DURATION + 10#$DURATION6))
            if [ "$EXPECTED_DECISION" = next_install_validated ] && [ "$CORE_FAILED" -eq 0 ] &&
               [ "$STATUS6" = passed ] && [ "$DECISION6" = next_install_validated ] && [ "$OUTCOME6" = success ] &&
               [ "${{ steps.version.outputs.version }}" = "config_samples@202311+e5cd212fec5c47e88be1afbaac079005c45f6db4" ] &&
               [ "${{ steps.test6.outputs.current_version }}" = "${{ steps.version.outputs.version }}" ] &&
               [ "${{ steps.test6.outputs.latest_version }}" = "config_samples@202405+cfc766e13eccab4e7603808db3bfa9c5b2dfef17" ] &&
               [ "${{ steps.test6.outputs.next_installed_version }}" = "${{ steps.test6.outputs.latest_version }}" ]; then
              PASSED=$((PASSED + 1))
              VALID6=true
            elif [ "$CORE_FAILED" -gt 0 ] && [ "$STATUS6" = skipped ] && [ "$OUTCOME6" = success ] &&
                 [ "$DECISION6" = "$EXPECTED_DECISION" ] && [ "$EXPECTED_DECISION" != next_install_validated ] &&
                 [ "${{ steps.test6.outputs.next_installed_version }}" = not_installed ]; then
              SKIPPED=1
              VALID6=true
            fi
          fi
          if [ "$VALID6" != true ]; then
            FAILED=$((FAILED + 1))
          fi
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
          echo "core_failed=$CORE_FAILED" >> "$GITHUB_OUTPUT"
          echo "duration=$TOTAL_DURATION" >> "$GITHUB_OUTPUT"
          if [ "$FAILED" -eq 0 ]; then
            echo "overall_status=success" >> "$GITHUB_OUTPUT"
            echo "badge_status=passing" >> "$GITHUB_OUTPUT"
          else
            echo "overall_status=failure" >> "$GITHUB_OUTPUT"
            echo "badge_status=failing" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Create component test summary
        if: always()
        env:
          BASELINE: ${{ steps.version.outputs.version || 'unknown' }}
          STATUS: ${{ steps.summary.outputs.overall_status || 'failure' }}
          COMPARISON: ${{ steps.test6.outputs.comparison }}
        run: |
          {
            echo "## SONiC config_samples source component"
            echo "- Scope proposal pending human acceptance."
            echo "- Coverage: config_samples.py only, not a complete sonic-config-engine install."
            echo "- No OS image build/boot, sonic-cfggen, ConfigDB, ASIC or dataplane validation."
            echo "- Source: https://github.com/sonic-net/sonic-buildimage"
            echo "- Baseline: $BASELINE"
            echo "- Status: $STATUS"
            echo "- Comparison: $COMPARISON"
          } >> "$GITHUB_STEP_SUMMARY"

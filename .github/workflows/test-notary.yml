name: Test Notary on Arm64
permissions:
  contents: read

on:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-notary.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-notary.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-notary.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-notary.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-notary.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-notary.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-notary.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-notary.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-notary.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-notary.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-notary.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-notary.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-notary.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-notary.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-notary.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-notary.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-notary.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-notary.outputs.regression_next_installed_version }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-notary.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-notary.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-notary.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-notary.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-notary.outputs.timestamp }}
jobs:
  test-notary:
    runs-on: ubuntu-24.04-arm
    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'Notary'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=notary" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/opensource_packages/notary" >> "$GITHUB_OUTPUT"
      - name: Install Notary
        id: install
        run: |
          echo "Installing Notary..."
          
          # The content entry targets legacy Notary, not Notation.
          sudo apt-get update
          if sudo apt-get install -y notary python3; then
             echo "Notary installed successfully"
             echo "install_status=success" >> $GITHUB_OUTPUT
          else
             echo "Notary installation failed"
             echo "install_status=failed" >> $GITHUB_OUTPUT
             exit 1
          fi

      - name: Get Notary version
        id: version
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            rc=$1
            trap - EXIT
            if [ "$rc" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish $?' EXIT
          export LC_ALL=C
          IDENTITY=$(python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess
          import sys

          def run(*args):
              result = subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                      text=True, timeout=30)
              print(f"{args!r} (exit {result.returncode}):\n{result.stdout}", file=sys.stderr)
              result.check_returncode()
              return result.stdout

          binary = shutil.which("notary")
          if not binary:
              raise SystemExit("Legacy Notary executable is missing")
          banner = run(binary, "version")
          match = re.fullmatch(
              r"notary\n[ \t]+Version:[ \t]*(v?[0-9]+(?:\.[0-9]+){1,2})?[ \t]*\n"
              r"[ \t]+Git commit:[ \t]*[0-9a-f]*[ \t]*\n"
              r"[ \t]+Go version:[ \t]+go[0-9]+(?:\.[0-9]+){1,2}[ \t]*\n?", banner)
          if not match:
              raise SystemExit("Malformed or wrong-product Notary version banner")
          package = run("dpkg-query", "-W",
                        "-f=${Package}\t${Status}\t${Version}\t${Architecture}\t${source:Package}\t${source:Upstream-Version}\n",
                        "notary")
          installed = re.fullmatch(
              r"notary\tinstall ok installed\t([0-9][0-9A-Za-z.+:~\-]*)\tarm64\tnotary\t"
              r"([0-9]+(?:\.[0-9]+){1,2}(?:\+ds[0-9]*)?)\n", package)
          if not installed:
              raise SystemExit("Expected an installed arm64 package from legacy Notary source")
          package_version, upstream = installed.groups()
          if not re.fullmatch(r"(?:[0-9]+:)?" + re.escape(upstream) + r"-[0-9A-Za-z.+~]+", package_version):
              raise SystemExit("Notary package revision disagrees with source upstream version")
          version = upstream.split("+ds", 1)[0]
          cli_version = (match[1] or "").removeprefix("v")
          if cli_version and cli_version != version:
              raise SystemExit("Notary CLI and package versions disagree")
          files = run("dpkg-query", "-L", "notary").splitlines()
          if Path(binary).resolve() not in {Path(p).resolve() for p in files if p.startswith("/")}:
              raise SystemExit("Notary executable is not owned by the installed package")
          source = "cli_and_dpkg" if cli_version else "dpkg_upstream_empty_cli_version"
          if os.environ.get("VERIFY_BASELINE") == "1":
              if (os.environ["VERSION_STATUS"] != "passed" or os.environ["VERSION_OUTCOME"] != "success"
                      or os.environ["EXPECTED_VERSION"] != version
                      or os.environ["EXPECTED_PACKAGE_VERSION"] != package_version):
                  raise SystemExit("Notary identity changed or the baseline version probe failed")
          print(f"{version}\t{package_version}\t{upstream}\t{source}")
          PY
          )
          IFS=$'\t' read -r VERSION PACKAGE_VERSION UPSTREAM VERSION_SOURCE <<< "$IDENTITY"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "source_upstream_version=$UPSTREAM" >> "$GITHUB_OUTPUT"
          echo "version_source=$VERSION_SOURCE" >> "$GITHUB_OUTPUT"
          finish 0

      - name: Test 1 - Check notary binary
        id: test1
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            rc=$1
            trap - EXIT
            if [ "$rc" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish $?' EXIT
          export LC_ALL=C
          test -x "$(command -v notary)"
          finish 0

      - name: Test 2 - Verify legacy Notary version identity
        id: test2
        continue-on-error: true
        env:
          VERIFY_BASELINE: '1'
          VERSION_STATUS: ${{ steps.version.outputs.status }}
          VERSION_OUTCOME: ${{ steps.version.outcome }}
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            rc=$1
            trap - EXIT
            if [ "$rc" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish $?' EXIT
          export LC_ALL=C
          IDENTITY=$(python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess
          import sys

          def run(*args):
              result = subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                      text=True, timeout=30)
              print(f"{args!r} (exit {result.returncode}):\n{result.stdout}", file=sys.stderr)
              result.check_returncode()
              return result.stdout

          binary = shutil.which("notary")
          if not binary:
              raise SystemExit("Legacy Notary executable is missing")
          banner = run(binary, "version")
          match = re.fullmatch(
              r"notary\n[ \t]+Version:[ \t]*(v?[0-9]+(?:\.[0-9]+){1,2})?[ \t]*\n"
              r"[ \t]+Git commit:[ \t]*[0-9a-f]*[ \t]*\n"
              r"[ \t]+Go version:[ \t]+go[0-9]+(?:\.[0-9]+){1,2}[ \t]*\n?", banner)
          if not match:
              raise SystemExit("Malformed or wrong-product Notary version banner")
          package = run("dpkg-query", "-W",
                        "-f=${Package}\t${Status}\t${Version}\t${Architecture}\t${source:Package}\t${source:Upstream-Version}\n",
                        "notary")
          installed = re.fullmatch(
              r"notary\tinstall ok installed\t([0-9][0-9A-Za-z.+:~\-]*)\tarm64\tnotary\t"
              r"([0-9]+(?:\.[0-9]+){1,2}(?:\+ds[0-9]*)?)\n", package)
          if not installed:
              raise SystemExit("Expected an installed arm64 package from legacy Notary source")
          package_version, upstream = installed.groups()
          if not re.fullmatch(r"(?:[0-9]+:)?" + re.escape(upstream) + r"-[0-9A-Za-z.+~]+", package_version):
              raise SystemExit("Notary package revision disagrees with source upstream version")
          version = upstream.split("+ds", 1)[0]
          cli_version = (match[1] or "").removeprefix("v")
          if cli_version and cli_version != version:
              raise SystemExit("Notary CLI and package versions disagree")
          files = run("dpkg-query", "-L", "notary").splitlines()
          if Path(binary).resolve() not in {Path(p).resolve() for p in files if p.startswith("/")}:
              raise SystemExit("Notary executable is not owned by the installed package")
          source = "cli_and_dpkg" if cli_version else "dpkg_upstream_empty_cli_version"
          if os.environ.get("VERIFY_BASELINE") == "1":
              if (os.environ["VERSION_STATUS"] != "passed" or os.environ["VERSION_OUTCOME"] != "success"
                      or os.environ["EXPECTED_VERSION"] != version
                      or os.environ["EXPECTED_PACKAGE_VERSION"] != package_version):
                  raise SystemExit("Notary identity changed or the baseline version probe failed")
          print(f"{version}\t{package_version}\t{upstream}\t{source}")
          PY
          )
          IFS=$'\t' read -r VERSION PACKAGE_VERSION UPSTREAM VERSION_SOURCE <<< "$IDENTITY"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "source_upstream_version=$UPSTREAM" >> "$GITHUB_OUTPUT"
          echo "version_source=$VERSION_SOURCE" >> "$GITHUB_OUTPUT"
          finish 0

      - name: Test 3 - Check help command
        id: test3
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            rc=$1
            trap - EXIT
            if [ "$rc" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish $?' EXIT
          export LC_ALL=C
          HELP=$(notary --help 2>&1)
          printf '%s\n' "$HELP"
          grep -Fx 'Usage:' <<< "$HELP"
          grep -Fx '  notary [command]' <<< "$HELP"
          finish 0

      - name: Test 4 - List local keys (empty)
        id: test4
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            rc=$1
            trap - EXIT
            if [ "$rc" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish $?' EXIT
          export LC_ALL=C
          TRUST_DIR=$(mktemp -d "$RUNNER_TEMP/notary-keys.XXXXXX")
          notary --trustDir "$TRUST_DIR" key list
          echo "Local key listing only; no registry, TUF publication, or signing server was exercised."
          finish 0

      - name: Test 5 - Architecture Verification
        id: test5
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            rc=$1
            trap - EXIT
            if [ "$rc" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish $?' EXIT
          export LC_ALL=C
          test "$(uname -m)" = aarch64
          finish 0

      - name: Regression applicability - package manager installed
        id: test6
        if: always()
        run: |
          set -euo pipefail
          CURRENT="${{ steps.version.outputs.version || 'unknown' }}"
          echo "current_version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest_version=not_applicable" >> "$GITHUB_OUTPUT"
          echo "next_installed_version=not_applicable" >> "$GITHUB_OUTPUT"
          echo "decision=not_applicable_package_manager" >> "$GITHUB_OUTPUT"
          echo "regression_result=Regression validation not applicable: tested package installed via package manager in Tests 1-5" >> "$GITHUB_OUTPUT"
          echo "comparison=The tested package is installed via a package manager in Tests 1-5, so version-to-version regression validation is not shown under the current policy." >> "$GITHUB_OUTPUT"
          echo "status=skipped" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"

      - name: Calculate test summary
        if: always()
        id: summary
        run: |
          set -euo pipefail
          PASSED=0
          FAILED=0
          SKIPPED=0
          TOTAL_DURATION=0
          check_core() {
            local status="$1" outcome="$2" duration="$3"
            if [[ "$duration" =~ ^[0-9]{1,6}$ ]]; then
              TOTAL_DURATION=$((TOTAL_DURATION + 10#$duration))
            else
              status=failed
            fi
            if [ "$status" = "passed" ] && [ "$outcome" = "success" ]; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
            fi
          }
          check_core "${{ steps.test1.outputs.status }}" "${{ steps.test1.outcome }}" "${{ steps.test1.outputs.duration || 0 }}"
          check_core "${{ steps.test2.outputs.status }}" "${{ steps.test2.outcome }}" "${{ steps.test2.outputs.duration || 0 }}"
          check_core "${{ steps.test3.outputs.status }}" "${{ steps.test3.outcome }}" "${{ steps.test3.outputs.duration || 0 }}"
          check_core "${{ steps.test4.outputs.status }}" "${{ steps.test4.outcome }}" "${{ steps.test4.outputs.duration || 0 }}"
          check_core "${{ steps.test5.outputs.status }}" "${{ steps.test5.outcome }}" "${{ steps.test5.outputs.duration || 0 }}"
          CORE_FAILED=$FAILED
          DURATION6="${{ steps.test6.outputs.duration || 0 }}"
          if [ "${{ steps.test6.outputs.status }}" = "skipped" ] &&
             [ "${{ steps.test6.outputs.decision }}" = "not_applicable_package_manager" ] &&
             [ "${{ steps.test6.outcome }}" = "success" ] &&
             [[ "$DURATION6" =~ ^[0-9]{1,6}$ ]]; then
            SKIPPED=1
          else
            FAILED=$((FAILED + 1))
          fi
          if [[ "$DURATION6" =~ ^[0-9]{1,6}$ ]]; then
            TOTAL_DURATION=$((TOTAL_DURATION + 10#$DURATION6))
          fi
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
          echo "core_failed=$CORE_FAILED" >> "$GITHUB_OUTPUT"
          echo "duration=$TOTAL_DURATION" >> "$GITHUB_OUTPUT"
          if [ "$FAILED" -eq 0 ]; then
            echo "overall_status=success" >> "$GITHUB_OUTPUT"
            echo "badge_status=passing" >> "$GITHUB_OUTPUT"
          else
            echo "overall_status=failure" >> "$GITHUB_OUTPUT"
            echo "badge_status=failing" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Create test summary
        if: always()
        run: |
          echo "## Notary Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version source:** ${{ steps.version.outputs.version_source }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ steps.summary.outputs.overall_status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests Passed:** ${{ steps.summary.outputs.passed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests Failed:** ${{ steps.summary.outputs.failed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests Skipped:** ${{ steps.summary.outputs.skipped }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Duration:** ${{ steps.summary.outputs.duration || 0 }}s" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner:** ubuntu-24.04 (arm64)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Details" >> $GITHUB_STEP_SUMMARY
          echo "1. Test 1 - Check notary binary: ${{ steps.test1.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "2. Test 2 - Verify legacy Notary version identity: ${{ steps.test2.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "3. Test 3 - Check help command: ${{ steps.test3.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "4. Test 4 - List keys (empty): ${{ steps.test4.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "5. Test 5 - Architecture Verification: ${{ steps.test5.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "6. Package manager regression applicability: ${{ steps.test6.outputs.status }} (${{ steps.test6.outputs.decision }})" >> $GITHUB_STEP_SUMMARY
          echo "Local CLI smoke only; registry, TUF publication, and signing-server behavior were not exercised." >> $GITHUB_STEP_SUMMARY

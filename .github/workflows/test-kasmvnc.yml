name: Test KasmVNC on Arm64

permissions:
  contents: read

on:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-kasmvnc.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-kasmvnc.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-kasmvnc.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-kasmvnc.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-kasmvnc.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-kasmvnc.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-kasmvnc.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-kasmvnc.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-kasmvnc.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-kasmvnc.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-kasmvnc.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-kasmvnc.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-kasmvnc.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-kasmvnc.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-kasmvnc.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-kasmvnc.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-kasmvnc.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-kasmvnc.outputs.regression_next_installed_version }}
      regression_policy:
        description: Regression applicability policy classification
        value: ${{ jobs.test-kasmvnc.outputs.regression_policy }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-kasmvnc.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-kasmvnc.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-kasmvnc.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-kasmvnc.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-kasmvnc.outputs.timestamp }}

jobs:
  test-kasmvnc:
    runs-on: ubuntu-24.04-arm
    env:
      BASELINE_VERSION: "0.9.3 Beta"
      PACKAGE_SLUG: "kasmvnc"
      LANE_KIND: "github release / source-build-or-tarball"
      DOWNLOAD_URL: "https://github.com/kasmtech/KasmVNC/releases"
      HOMEPAGE_URL: "https://www.kasmweb.com/kasmvnc/docs/latest/index.html"
      OFFICIAL_DOCS: "https://www.kasmweb.com/kasmvnc/docs/latest/install.html"
      GITHUB_REPO: "kasmtech/KasmVNC"
      EXTRA_TAG_CANDIDATES: "0.9.3-beta|v0.9.3-beta"
      TEST1_COMMAND: >-
        test -f README.md && test -f BUILDING.txt && test -f CMakeLists.txt && test -d unix && test "$RESOLVED_TAG" = "v0.9.3-beta"
      TEST3_COMMAND: >-
        test -d tests && test -d common && grep -Fq 'KasmVNC' README.md
      TEST5_COMMAND: |
        TAG="$RESOLVED_TAG"
        [ -n "$TAG" ] && [ "$TAG" != "default_branch" ]
        mkdir -p artifacts kasmvnc-root
        ASSET_URL="$(curl -fsSL "https://api.github.com/repos/$GITHUB_REPO/releases/tags/$TAG" | jq -r '[.assets[] | select(.name | test("kasmvncserver_(noble|jammy|bookworm|bullseye|focal)_.*_arm64\\.deb$"; "i"))] | sort_by(if (.name | test("_noble_"; "i")) then 0 elif (.name | test("_jammy_"; "i")) then 1 elif (.name | test("_bookworm_"; "i")) then 2 elif (.name | test("_bullseye_"; "i")) then 3 else 4 end) | .[0].browser_download_url // empty')"
        [ -n "$ASSET_URL" ]
        curl -fL --retry 3 -o artifacts/kasmvnc.deb "$ASSET_URL"
        dpkg-deb -f artifacts/kasmvnc.deb Package Version Architecture | tee /tmp/kasmvnc-control.txt
        test "$(dpkg-deb -f artifacts/kasmvnc.deb Architecture)" = "arm64"
        test "$(dpkg-deb -f artifacts/kasmvnc.deb Version)" = "0.9.3~beta-1"
        dpkg-deb -x artifacts/kasmvnc.deb kasmvnc-root
        XKASM_EXTRACTED="$(find kasmvnc-root -type f \( -name Xkasmvnc -o -name Xvnc \) -print -quit)"
        [ -n "$XKASM_EXTRACTED" ]
        file "$XKASM_EXTRACTED" | tee /tmp/kasmvnc-xserver.file
        grep -Eiq 'ARM aarch64|aarch64' /tmp/kasmvnc-xserver.file
        sudo DEBIAN_FRONTEND=noninteractive dpkg -i artifacts/kasmvnc.deb || sudo DEBIAN_FRONTEND=noninteractive apt-get -f install -y
        XKASM="$(command -v Xkasmvnc || command -v Xvnc)"
        KASMVNCSERVER="$(command -v kasmvncserver)"
        [ -x "$XKASM" ]
        [ -x "$KASMVNCSERVER" ]
        "$XKASM" -version >/tmp/kasmvnc-version.log 2>&1 || true
        grep -Eiq 'KasmVNC|Xkasmvnc|Xvnc|version' /tmp/kasmvnc-version.log
        ("$KASMVNCSERVER" -help || "$KASMVNCSERVER" --help || true) >/tmp/kasmvncserver-help.log 2>&1
        grep -Eiq 'KasmVNC|kasmvncserver|usage|options' /tmp/kasmvncserver-help.log
        DISPLAY_NUM=29
        "$XKASM" ":$DISPLAY_NUM" -geometry 800x600 -depth 24 -SecurityTypes None -noWebsocket -rfbport 5929 -localhost >/tmp/kasmvnc-xserver.log 2>&1 &
        XKASM_PID=$!
        trap 'kill "$XKASM_PID" 2>/dev/null || true; wait "$XKASM_PID" 2>/dev/null || true; cat /tmp/kasmvnc-xserver.log' EXIT
        READY=0
        for _ in $(seq 1 20); do
          if xdpyinfo -display ":$DISPLAY_NUM" >/tmp/kasmvnc-xdpyinfo.log 2>&1; then
            READY=1
            break
          fi
          kill -0 "$XKASM_PID"
          sleep 1
        done
        test "$READY" = "1"
        grep -Eiq 'dimensions|screen|vendor' /tmp/kasmvnc-xdpyinfo.log
        kill -0 "$XKASM_PID"
        python3 - <<'PY'
        import socket
        with socket.create_connection(("127.0.0.1", 5929), timeout=5) as connection:
            greeting = connection.makefile("rb").read(12)
        assert greeting == b"RFB 003.008\n", repr(greeting)
        print("KasmVNC local RFB 3.8 greeting verified")
        PY
        echo "note=Arm preflight smoke passed for KasmVNC: downloaded $ASSET_URL, verified Debian package architecture arm64 and version 0.9.3~beta-1, verified extracted X server as AArch64, ran X server version and kasmvncserver help, started a bounded local headless X/VNC server in traditional RFB mode, queried the display with xdpyinfo, and verified its RFB 3.8 greeting. The server is stopped by the EXIT trap. No WebSocket client session or desktop workload is claimed." >> "$GITHUB_OUTPUT"

    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'KasmVNC'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      regression_policy: "applicable"
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          {
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "package_slug=kasmvnc"
            echo "dashboard_link=/linux/opensource_packages/kasmvnc"
          } >> "$GITHUB_OUTPUT"

      - name: Bootstrap baseline dependencies
        uses: ./.github/actions/apt-bootstrap
        with:
          packages: "git curl jq tar unzip file ca-certificates x11-utils"
          extra_packages: "${{ env.EXTRA_APT_PACKAGES }}"
          quiet: "true"

      - name: Install baseline source or artifact
        id: install
        run: |
          set -euo pipefail
          rm -rf baseline-src baseline-external
          mkdir -p baseline-src baseline-external
          if [ -n "$GITHUB_REPO" ]; then
            RESOLVED_TAG=""
            RESOLVED_OUTPUT=""
            CANDIDATE_TAGS="$BASELINE_VERSION|v$BASELINE_VERSION"
            if [ -n "${EXTRA_TAG_CANDIDATES:-}" ]; then
              CANDIDATE_TAGS="${CANDIDATE_TAGS}|${EXTRA_TAG_CANDIDATES}"
            fi
            OLD_IFS="$IFS"
            IFS='|'
            for CANDIDATE in $CANDIDATE_TAGS; do
              [ -n "$CANDIDATE" ] || continue
              if git ls-remote --tags --refs "https://github.com/$GITHUB_REPO.git" "refs/tags/$CANDIDATE" | grep -q .; then
                RESOLVED_TAG="$CANDIDATE"
                break
              fi
            done
            IFS="$OLD_IFS"
            if [ -n "$RESOLVED_TAG" ]; then
              git clone --depth 1 --branch "$RESOLVED_TAG" "https://github.com/$GITHUB_REPO.git" baseline-src >/dev/null 2>&1 || true
              RESOLVED_OUTPUT="$RESOLVED_TAG"
            else
              git clone --depth 1 "https://github.com/$GITHUB_REPO.git" baseline-src >/dev/null 2>&1 || true
              RESOLVED_OUTPUT="default_branch"
            fi
            if [ -d baseline-src/.git ] || [ -f baseline-src/README.md ] || [ -n "$(find baseline-src -mindepth 1 -maxdepth 2 -print -quit 2>/dev/null)" ]; then
              {
                echo "resolved_tag=$RESOLVED_OUTPUT"
                echo "install_mode=github_source"
                echo "install_status=success"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if curl -fsLI "$DOWNLOAD_URL" >/dev/null 2>&1 || curl -fsLI "$HOMEPAGE_URL" >/dev/null 2>&1; then
            {
              echo "download=$DOWNLOAD_URL"
              echo "homepage=$HOMEPAGE_URL"
              echo "docs=$OFFICIAL_DOCS"
            } > baseline-external/metadata.txt
            {
              echo "resolved_tag=external_artifact"
              echo "install_mode=external_artifact"
              echo "install_status=success"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "install_mode=unresolved"
            echo "install_status=failed"
          } >> "$GITHUB_OUTPUT"
          exit 1
      - name: Get baseline version
        id: version
        run: |
          echo "version=$BASELINE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected baseline version: $BASELINE_VERSION"

      - name: Test 1 - Baseline package evidence
        id: test1
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          MODE="${{ steps.install.outputs.install_mode || '' }}"
          RESOLVED_TAG="${{ steps.install.outputs.resolved_tag || '' }}"
          INSTALL_STATUS="${{ steps.install.outputs.install_status || 'failed' }}"
          DOC_PATH="content/linux/opensource_packages/${PACKAGE_SLUG}.md"
          if [ "$INSTALL_STATUS" != "success" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$MODE" = "github_source" ]; then
            cd baseline-src
          fi
          export DOC_PATH RESOLVED_TAG
          eval "$TEST1_COMMAND"
          if [ "$MODE" = "github_source" ] && [ "$RESOLVED_TAG" = "default_branch" ]; then
            echo "note=Upstream source smoke used the default branch because no exact source tag matched the published baseline version." >> "$GITHUB_OUTPUT"
          fi
          echo "status=passed" >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
      - name: Test 2 - Baseline version and release alignment
        id: test2
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          DOC_PATH="content/linux/opensource_packages/${PACKAGE_SLUG}.md"
          export DOC_PATH BASELINE_VERSION DOWNLOAD_URL
          python3 -c "from pathlib import Path; import os; text=Path(os.environ['DOC_PATH']).read_text(); version=os.environ['BASELINE_VERSION']; download=os.environ['DOWNLOAD_URL']; assert f'version_number: {version}' in text; assert f'download_url: {download}' in text"
          echo "status=passed" >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
      - name: Test 3 - Package-specific source or docs evidence
        id: test3
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          MODE="${{ steps.install.outputs.install_mode || '' }}"
          DOC_PATH="content/linux/opensource_packages/${PACKAGE_SLUG}.md"
          if [ "$MODE" = "github_source" ]; then
            cd baseline-src
          fi
          export DOC_PATH
          eval "$TEST3_COMMAND"
          echo "status=passed" >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
      - name: Test 4 - Arm64 support gate
        id: test4
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          DOC_PATH="content/linux/opensource_packages/${PACKAGE_SLUG}.md"
          test "$(uname -m)" = "aarch64"
          grep -Fq "works_on_arm: true" "$DOC_PATH"
          if [ -n "${TEST4_COMMAND:-}" ]; then
            eval "$TEST4_COMMAND"
          fi
          echo "status=passed" >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
      - name: Test 5 - Bounded package-specific smoke
        id: test5
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          MODE="${{ steps.install.outputs.install_mode || '' }}"
          RESOLVED_TAG="${{ steps.install.outputs.resolved_tag || '' }}"
          DOC_PATH="content/linux/opensource_packages/${PACKAGE_SLUG}.md"
          trap 'echo "status=failed" >> "$GITHUB_OUTPUT"; END_TIME=$(date +%s); echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"' ERR
          if [ "$MODE" = "github_source" ]; then
            cd baseline-src
          fi
          export DOC_PATH RESOLVED_TAG
          eval "$TEST5_COMMAND"
          trap - ERR
          echo "status=passed" >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
      - name: Test 6 - Regression Validation
        id: test6
        uses: ./.github/actions/generic-source-regression-check
        with:
          baseline_version: ${{ steps.version.outputs.version || env.BASELINE_VERSION }}
          github_repo: ${{ env.GITHUB_REPO }}
          lane_kind: ${{ env.LANE_KIND }}
          limited_cpu_probe: |
            test "$(uname -m)" = "aarch64"
            test "$CANDIDATE_TAG" = "v$LATEST_VERSION"
            ASSET_URL="$(curl -fsSL "https://api.github.com/repos/$GITHUB_REPO/releases/tags/$CANDIDATE_TAG" | jq -r '[.assets[] | select(.name | test("kasmvncserver_(noble|jammy|bookworm|bullseye|focal)_.*_arm64\\.deb$"; "i"))] | sort_by(if (.name | test("_noble_"; "i")) then 0 elif (.name | test("_jammy_"; "i")) then 1 elif (.name | test("_bookworm_"; "i")) then 2 elif (.name | test("_bullseye_"; "i")) then 3 else 4 end) | .[0].browser_download_url // empty')"
            [ -n "$ASSET_URL" ]
            curl -fL --retry 3 -o "$RUNNER_TEMP/kasmvnc-next.deb" "$ASSET_URL"
            dpkg-deb -f "$RUNNER_TEMP/kasmvnc-next.deb" Package Version Architecture | tee /tmp/kasmvnc-next-control.txt
            test "$(dpkg-deb -f "$RUNNER_TEMP/kasmvnc-next.deb" Package)" = "kasmvncserver"
            test "$(dpkg-deb -f "$RUNNER_TEMP/kasmvnc-next.deb" Architecture)" = "arm64"
            DEB_VERSION="$(dpkg-deb -f "$RUNNER_TEMP/kasmvnc-next.deb" Version)"
            UPSTREAM_VERSION="${DEB_VERSION#*:}"
            UPSTREAM_VERSION="${UPSTREAM_VERSION%-*}"
            test "$UPSTREAM_VERSION" = "$LATEST_VERSION"
            rm -rf "$RUNNER_TEMP/kasmvnc-next-root"
            mkdir -p "$RUNNER_TEMP/kasmvnc-next-root"
            dpkg-deb -x "$RUNNER_TEMP/kasmvnc-next.deb" "$RUNNER_TEMP/kasmvnc-next-root"
            XKASM_EXTRACTED="$RUNNER_TEMP/kasmvnc-next-root/usr/bin/Xkasmvnc"
            test -f "$XKASM_EXTRACTED"
            file "$XKASM_EXTRACTED" | tee /tmp/kasmvnc-next-xserver.file
            grep -Eiq 'ARM aarch64|aarch64' /tmp/kasmvnc-next-xserver.file
            sudo DEBIAN_FRONTEND=noninteractive dpkg -i "$RUNNER_TEMP/kasmvnc-next.deb" || sudo DEBIAN_FRONTEND=noninteractive apt-get -f install -y
            test "$(dpkg-query -W -f='${Status}' kasmvncserver)" = "install ok installed"
            test "$(dpkg-query -W -f='${Architecture}' kasmvncserver)" = "arm64"
            INSTALLED_VERSION="$(dpkg-query -W -f='${Version}' kasmvncserver)"
            test "$INSTALLED_VERSION" = "$DEB_VERSION"
            dpkg-query -L kasmvncserver > "$RUNNER_TEMP/kasmvnc-next-installed-files.txt"
            for BINARY in Xkasmvnc kasmvncserver; do
              BIN="/usr/bin/$BINARY"
              test -x "$BIN"
              grep -Fx "$BIN" "$RUNNER_TEMP/kasmvnc-next-installed-files.txt"
              cmp "$RUNNER_TEMP/kasmvnc-next-root/usr/bin/$BINARY" "$BIN"
            done
            XKASM="/usr/bin/Xkasmvnc"
            KASMVNCSERVER="/usr/bin/kasmvncserver"
            echo "Candidate $LATEST_VERSION: downloaded=$DEB_VERSION installed=$INSTALLED_VERSION executable=$XKASM"
            if ! timeout 10s "$XKASM" -version >/tmp/kasmvnc-next-version.log 2>&1; then
              cat /tmp/kasmvnc-next-version.log
              exit 1
            fi
            cat /tmp/kasmvnc-next-version.log
            python3 - <<'PY'
            import os
            from pathlib import Path
            import re
            banner = Path("/tmp/kasmvnc-next-version.log").read_text()
            versions = re.findall(r"^X(?:vnc|kasmvnc) KasmVNC (\S+) - built ", banner, re.MULTILINE)
            expected = os.environ["LATEST_VERSION"]
            assert len(versions) == 1, f"Missing or ambiguous KasmVNC version: {banner}"
            assert re.fullmatch(re.escape(expected) + r"(?:\.[0-9a-f]{40})?", versions[0]), (expected, versions[0])
            print(f"Verified KasmVNC runtime {versions[0]} for requested {expected}")
            PY
            HELP_EXIT=0
            timeout 10s "$KASMVNCSERVER" -help >/tmp/kasmvnc-next-help.log 2>&1 || HELP_EXIT=$?
            cat /tmp/kasmvnc-next-help.log
            test "$HELP_EXIT" -eq 0 || test "$HELP_EXIT" -eq 2
            grep -Eq '^usage: kasmvncserver([[:space:]]|$)' /tmp/kasmvnc-next-help.log
          limited_cpu_description: "Candidate validation requires downloaded and installed KasmVNC Arm64 package versions matching the requested release, package-owned executable paths whose contents match the downloaded payload, an exact runtime release banner, and bounded server version/help commands. No full VNC client session, desktop workload, or WAN remoting claim is made."
          next_version_override: "1.4.0"
          candidate_tag_override: "v1.4.0"
      - name: Calculate test summary
        id: summary
        if: always()
        run: |
          set -euo pipefail
          PASSED=0
          FAILED=0
          SKIPPED=0
          CORE_FAILED=0
          DURATION=0
          check_core_test() {
            if [ "$1" = "passed" ] && [ "$3" = "success" ]; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
              CORE_FAILED=$((CORE_FAILED + 1))
            fi
            DURATION=$((DURATION + $2))
          }
          check_core_test "${{ steps.test1.outputs.status || 'failed' }}" "${{ steps.test1.outputs.duration || '0' }}" "${{ steps.test1.outcome }}"
          check_core_test "${{ steps.test2.outputs.status || 'failed' }}" "${{ steps.test2.outputs.duration || '0' }}" "${{ steps.test2.outcome }}"
          check_core_test "${{ steps.test3.outputs.status || 'failed' }}" "${{ steps.test3.outputs.duration || '0' }}" "${{ steps.test3.outcome }}"
          check_core_test "${{ steps.test4.outputs.status || 'failed' }}" "${{ steps.test4.outputs.duration || '0' }}" "${{ steps.test4.outcome }}"
          check_core_test "${{ steps.test5.outputs.status || 'failed' }}" "${{ steps.test5.outputs.duration || '0' }}" "${{ steps.test5.outcome }}"
          T6="${{ steps.test6.outputs.status || 'failed' }}"
          O6="${{ steps.test6.outcome }}"
          if [ "$T6" = "passed" ] && [ "$O6" = "success" ]; then
            PASSED=$((PASSED + 1))
          elif [ "$T6" = "skipped" ] && [ "$O6" = "success" ]; then
            SKIPPED=$((SKIPPED + 1))
          else
            FAILED=$((FAILED + 1))
          fi
          DURATION=$((DURATION + ${{ steps.test6.outputs.duration || '0' }}))
          OVERALL_STATUS=failure
          BADGE_STATUS=failing
          if [ "$FAILED" -eq 0 ]; then
            OVERALL_STATUS=success
            BADGE_STATUS=passing
          fi
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"
          echo "core_failed=$CORE_FAILED" >> "$GITHUB_OUTPUT"
          echo "overall_status=$OVERALL_STATUS" >> "$GITHUB_OUTPUT"
          echo "badge_status=$BADGE_STATUS" >> "$GITHUB_OUTPUT"
          test "$FAILED" -eq 0

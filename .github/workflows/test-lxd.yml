name: Test Canonical LXD on Arm64

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-lxd.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-lxd.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-lxd.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-lxd.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-lxd.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-lxd.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-lxd.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-lxd.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-lxd.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-lxd.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-lxd.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-lxd.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-lxd.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-lxd.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-lxd.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-lxd.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-lxd.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-lxd.outputs.regression_next_installed_version }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-lxd.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-lxd.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-lxd.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-lxd.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-lxd.outputs.timestamp }}
jobs:
  test-lxd:
    runs-on: ubuntu-24.04-arm
    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'Canonical LXD'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false
      
      - name: Set test metadata
        id: metadata
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=lxd" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/opensource_packages/lxd" >> "$GITHUB_OUTPUT"
      - name: Install LXD
        id: install
        continue-on-error: true
        run: |
          set -euo pipefail
          clear_inflight_lxd_change() {
            local change_id=""
            change_id="$(sudo snap changes --abs-time 2>/dev/null | awk 'NR > 1 && /lxd/ && $2 != "Done" && $2 != "Error" && $2 != "Undone" { print $1; exit }' || true)"
            if [ -n "${change_id}" ]; then
              echo "Found in-flight LXD snap change ${change_id}; waiting briefly before aborting if needed."
              timeout 120 sudo snap watch "${change_id}" >/dev/null 2>&1 || sudo snap abort "${change_id}" >/dev/null 2>&1 || true
            fi
          }

          echo "Installing LXD via Snap..."
          sudo systemctl start snapd.socket snapd.service >/dev/null 2>&1 || true
          sudo snap wait system seed.loaded >/dev/null 2>&1 || true
          install_ok=0
          for attempt in 1 2 3; do
            echo "LXD install attempt ${attempt}/3"
            if snap list lxd >/dev/null 2>&1; then
              install_ok=1
              break
            fi
            clear_inflight_lxd_change
            if timeout 600 sudo snap install lxd --channel=latest/stable; then
              install_ok=1
              break
            fi
            echo "snap install lxd attempt ${attempt} did not complete cleanly"
            clear_inflight_lxd_change
            sudo snap remove --purge lxd >/dev/null 2>&1 || true
            sudo systemctl restart snapd.socket snapd.service >/dev/null 2>&1 || true
            sudo snap wait system seed.loaded >/dev/null 2>&1 || true
            sleep 15
          done
          if [ "$install_ok" -ne 1 ]; then
            echo "install_status=failed" >> "$GITHUB_OUTPUT"
            echo "LXD snap install did not complete successfully after retries."
            exit 1
          fi

          echo "LXD installed"
          echo "install_status=success" >> "$GITHUB_OUTPUT"
      
      - name: Get LXD version
        id: version
        if: ${{ always() && steps.install.outputs.install_status == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          VERSION=$(lxd --version)
          VERSION=$(echo "$VERSION" | sed 's/[",]//g' | tr -d '\\' | sed 's/\x1b\[[0-9;]*m//g')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected LXD version: $VERSION"
      
      - name: Test 1 - Check Binaries Exist
        id: test1
        if: always()
        continue-on-error: true
        run: |
          START_TIME=$(date +%s)

          STATUS="failed"
          if [ "${{ steps.install.outputs.install_status || 'failed' }}" = "success" ] \
            && command -v lxd > /dev/null 2>&1 \
            && command -v lxc > /dev/null 2>&1; then
            echo "✓ lxd and lxc binaries found"
            STATUS="passed"
          else
            echo "✗ LXD installation or binary verification failed"
          fi

          END_TIME=$(date +%s)
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
          [ "$STATUS" = "passed" ] || exit 1
      
      - name: Test 2 - Check Version
        id: test2
        if: always()
        continue-on-error: true
        run: |
          START_TIME=$(date +%s)

          if [ "${{ steps.install.outputs.install_status || 'failed' }}" != "success" ]; then
             echo "Version probe skipped because baseline installation failed"
             echo "status=skipped" >> "$GITHUB_OUTPUT"
             END_TIME=$(date +%s)
             echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
             exit 0
          fi

          STATUS="failed"
          if [ -n "${{ steps.version.outputs.version }}" ] && lxd --version > /dev/null 2>&1; then
             echo "✓ lxd version works"
             STATUS="passed"
          else
             echo "✗ lxd version failed"
          fi

          END_TIME=$(date +%s)
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
          [ "$STATUS" = "passed" ] || exit 1

      - name: Test 3 - Initialize (Dry Run)
        id: test3
        if: always()
        continue-on-error: true
        run: |
          START_TIME=$(date +%s)

          if [ "${{ steps.install.outputs.install_status || 'failed' }}" != "success" ]; then
             echo "Initialize probe skipped because baseline installation failed"
             echo "status=skipped" >> "$GITHUB_OUTPUT"
             END_TIME=$(date +%s)
             echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
             exit 0
          fi

          STATUS="failed"
          if lxd init --help > /dev/null 2>&1; then
             echo "✓ lxd init help works"
             STATUS="passed"
          else
             echo "✗ lxd init help failed"
          fi

          END_TIME=$(date +%s)
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
          [ "$STATUS" = "passed" ] || exit 1
      
      
      - name: Test 4 - Architecture Verification
        id: test4
        if: always()
        continue-on-error: true
        run: |
          START_TIME=$(date +%s)

          echo "Checking system architecture..."
          STATUS="failed"
          ARCH=$(uname -m)
          if [ "$ARCH" = "aarch64" ]; then
            echo "✓ System architecture is ARM64 ($ARCH)"
            STATUS="passed"
          else
            echo "✗ System architecture is NOT ARM64 ($ARCH)"
          fi

          END_TIME=$(date +%s)
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
          [ "$STATUS" = "passed" ] || exit 1

      - name: Test 5 - Functional Validation
        id: test5
        if: always()
        continue-on-error: true
        run: |
          START_TIME=$(date +%s)

          if [ "${{ steps.install.outputs.install_status || 'failed' }}" != "success" ]; then
            echo "Functional probe skipped because baseline installation failed"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            END_TIME=$(date +%s)
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          STATUS="failed"
          if lxc remote list > /dev/null 2>&1; then
            echo "✓ lxc remote list executed successfully"
            STATUS="passed"
          else
            echo "✗ lxc remote list failed"
          fi

          END_TIME=$(date +%s)
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
          [ "$STATUS" = "passed" ] || exit 1

      - name: Regression applicability - package manager installed
        id: test6
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.install.outputs.install_status || 'failed' }}" != "success" ]; then
            echo "current_version=unknown" >> "$GITHUB_OUTPUT"
            echo "latest_version=not_checked" >> "$GITHUB_OUTPUT"
            echo "next_installed_version=not_installed" >> "$GITHUB_OUTPUT"
            echo "decision=baseline_install_failed" >> "$GITHUB_OUTPUT"
            echo "regression_result=Regression validation not run because baseline LXD installation failed" >> "$GITHUB_OUTPUT"
            echo "comparison=The baseline package must install successfully before any next-version comparison is trustworthy." >> "$GITHUB_OUTPUT"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "duration=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT="${{ steps.version.outputs.version || 'unknown' }}"
          echo "current_version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest_version=not_applicable" >> "$GITHUB_OUTPUT"
          echo "next_installed_version=not_applicable" >> "$GITHUB_OUTPUT"
          echo "decision=not_applicable_package_manager" >> "$GITHUB_OUTPUT"
          echo "regression_result=Regression validation not applicable: tested package installed via package manager in Tests 1-5" >> "$GITHUB_OUTPUT"
          echo "comparison=The tested package is installed via a package manager in Tests 1-5, so version-to-version regression validation is not shown under the current policy." >> "$GITHUB_OUTPUT"
          echo "status=skipped" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"

      - name: Emit package result
        if: always()
        id: summary
        uses: ./.github/actions/emit-package-result
        with:
          package_slug: lxd
          package_name: Canonical LXD
          version: ${{ steps.version.outputs.version || 'unknown' }}
          install_status: ${{ steps.install.outputs.install_status || 'failed' }}
          test1_label: Test 1 - Check LXD binaries exist
          test2_label: Test 2 - Check LXD version command
          test3_label: Test 3 - Initialize dry run
          test4_label: Test 4 - Architecture Verification
          test5_label: Test 5 - Functional Validation
          test1_status: ${{ steps.test1.outputs.status || 'skipped' }}
          test2_status: ${{ steps.test2.outputs.status || 'skipped' }}
          test3_status: ${{ steps.test3.outputs.status || 'skipped' }}
          test4_status: ${{ steps.test4.outputs.status || 'skipped' }}
          test5_status: ${{ steps.test5.outputs.status || 'skipped' }}
          test6_status: ${{ steps.test6.outputs.status || 'skipped' }}
          test1_duration: ${{ steps.test1.outputs.duration || 0 }}
          test2_duration: ${{ steps.test2.outputs.duration || 0 }}
          test3_duration: ${{ steps.test3.outputs.duration || 0 }}
          test4_duration: ${{ steps.test4.outputs.duration || 0 }}
          test5_duration: ${{ steps.test5.outputs.duration || 0 }}
          test6_duration: ${{ steps.test6.outputs.duration || 0 }}
          regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
          regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
          regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
          regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
          regression_result: ${{ steps.test6.outputs.regression_result || 'Regression result unavailable.' }}
          regression_details: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}

      - name: Enforce failure status
        if: always()
        run: |
          if [ "${{ steps.summary.outputs.should_fail }}" = "1" ]; then
            exit 1
          fi

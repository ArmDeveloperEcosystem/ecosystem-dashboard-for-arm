name: Test Multipass on Arm64
permissions:
  contents: read

on:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-multipass.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-multipass.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-multipass.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-multipass.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-multipass.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-multipass.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-multipass.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-multipass.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-multipass.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-multipass.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-multipass.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-multipass.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-multipass.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-multipass.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-multipass.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-multipass.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-multipass.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-multipass.outputs.regression_next_installed_version }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-multipass.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-multipass.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-multipass.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-multipass.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-multipass.outputs.timestamp }}
jobs:
  test-multipass:
    runs-on: ubuntu-24.04-arm
    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'Multipass'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=multipass" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/opensource_packages/multipass" >> "$GITHUB_OUTPUT"
      - name: Install Multipass
        id: install
        timeout-minutes: 8
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          finish() {
            local RC="$1"
            trap - EXIT
            if [ "$RC" -eq 0 ]; then
              echo "install_status=success" >> "$GITHUB_OUTPUT"
            else
              echo "install_status=failed" >> "$GITHUB_OUTPUT"
            fi
            exit "$RC"
          }
          trap 'finish "$?"' EXIT
          # This service belongs to the disposable hosted VM, never a shared host.
          [ "$RUNNER_ENVIRONMENT" = github-hosted ]
          [ "$(uname -m)" = aarch64 ]
          timeout --kill-after=5s 300s sudo snap install multipass
          timeout --kill-after=5s 30s sudo systemctl start snap.multipass.multipassd.service
          # A simple systemd service can be active before its root certificate exists.
          # shellcheck disable=SC2016
          timeout --kill-after=5s 120s bash -eu -o pipefail -c '
            for ATTEMPT in {1..30}; do
              if timeout --kill-after=2s 5s sudo systemctl is-active --quiet snap.multipass.multipassd.service &&
                 timeout --kill-after=2s 5s sudo test -s /var/snap/multipass/common/data/multipassd/multipass_root_cert.pem; then
                echo "Multipass daemon and root certificate ready"
                exit 0
              fi
              echo "Waiting for Multipass daemon and root certificate ($ATTEMPT/30)"
              sleep 2
            done
            echo "Multipass daemon/certificate readiness failed" >&2
            exit 1
          '
          finish 0

      # ============================================================
      # CUSTOMIZE THIS: Get the package version
      # ============================================================
      - name: Get Multipass version
        id: version
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          [ "${{ steps.install.outcome }}" = success ]
          [ "${{ steps.install.outputs.install_status }}" = success ]
          RC=0
          timeout --kill-after=5s 30s multipass version --format json > multipass-version.json 2> multipass-version.stderr || RC=$?
          cat multipass-version.json
          cat multipass-version.stderr >&2
          echo "multipass version exit=$RC"
          [ "$RC" -eq 0 ] || exit "$RC"
          VERSION=$(python3 - <<'PY'
          import json
          import re
          with open("multipass-version.json") as stream:
              data = json.load(stream)
          version = data.get("multipass") if isinstance(data, dict) else None
          if not isinstance(version, str) or not re.fullmatch(r"[0-9]+(?:\.[0-9]+){1,3}(?:[-+][0-9A-Za-z.-]+)?", version):
              raise SystemExit("Missing or invalid Multipass client version")
          print(version)
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected Multipass version: $VERSION"

      # ============================================================
      # ADD YOUR TESTS BELOW
      # Each test should:
      # 1. Have a unique id (test1, test2, etc.)
      # 2. Track start/end time for duration
      # 3. Set status=passed or status=failed
      # 4. Exit 1 on failure
      # ============================================================

      - name: Test 1 - Check multipass binary
        id: test1
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local RC="$1"
            trap - EXIT
            if [ "$RC" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap 'finish "$?"' EXIT
          [ "${{ steps.install.outcome }}" = success ]
          [ "${{ steps.install.outputs.install_status }}" = success ]
          command -v multipass
          finish 0

      - name: Test 2 - Check version command
        id: test2
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local RC="$1"
            trap - EXIT
            if [ "$RC" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap 'finish "$?"' EXIT
          [ "${{ steps.install.outcome }}" = success ]
          [ "${{ steps.install.outputs.install_status }}" = success ]
          [ "${{ steps.version.outcome }}" = success ]
          RC=0
          timeout --kill-after=5s 30s multipass --version > multipass-version.txt 2> multipass-version-text.stderr || RC=$?
          cat multipass-version.txt
          cat multipass-version-text.stderr >&2
          echo "multipass --version exit=$RC"
          [ "$RC" -eq 0 ] || exit "$RC"
          python3 - "${{ steps.version.outputs.version }}" <<'PY'
          import re
          import sys
          from pathlib import Path
          versions = re.findall(r"^multipass\s+(\S+)\s*$", Path("multipass-version.txt").read_text(), re.MULTILINE)
          if versions != [sys.argv[1]] or sys.argv[1] in ("", "unknown"):
              raise SystemExit("Multipass version banner does not match the installed baseline")
          PY
          finish 0

      - name: Test 3 - Check CLI help
        id: test3
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local RC="$1"
            trap - EXIT
            if [ "$RC" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap 'finish "$?"' EXIT
          [ "${{ steps.install.outcome }}" = success ]
          [ "${{ steps.install.outputs.install_status }}" = success ]
          RC=0
          LC_ALL=C timeout --kill-after=5s 30s multipass --help > multipass-help.txt 2> multipass-help.stderr || RC=$?
          cat multipass-help.txt
          cat multipass-help.stderr >&2
          echo "multipass --help exit=$RC"
          [ "$RC" -eq 0 ] || exit "$RC"
          grep -Eq '^Usage: multipass( |$)' multipass-help.txt
          grep -Eq '^[[:space:]]+find[[:space:]]' multipass-help.txt
          grep -Eq '^[[:space:]]+help[[:space:]]' multipass-help.txt
          finish 0

      - name: Test 4 - List available images (find)
        id: test4
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local RC="$1"
            trap - EXIT
            if [ "$RC" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap 'finish "$?"' EXIT
          [ "${{ steps.install.outcome }}" = success ]
          [ "${{ steps.install.outputs.install_status }}" = success ]
          # Query image metadata only; do not launch a VM or require nested virtualization.
          RC=0
          timeout --kill-after=5s 120s multipass find --format json > multipass-find.json 2> multipass-find.stderr || RC=$?
          cat multipass-find.json
          cat multipass-find.stderr >&2
          echo "multipass find --format json exit=$RC"
          [ "$RC" -eq 0 ] || exit "$RC"
          python3 - <<'PY'
          import json
          with open("multipass-find.json") as stream:
              data = json.load(stream)
          if not isinstance(data, dict) or data.get("errors") != []:
              raise SystemExit("Image query has errors or lacks the errors array")
          images = data.get("images")
          if not isinstance(images, dict) or not images:
              raise SystemExit("Image query returned no image records")
          for name, image in images.items():
              if not name.strip() or not isinstance(image, dict):
                  raise SystemExit("Invalid image record")
              if any(not isinstance(image.get(key), str) or not image[key].strip()
                     for key in ("os", "release", "version")):
                  raise SystemExit("Image record lacks OS, release or version")
              if not isinstance(image.get("remote"), str) or not isinstance(image.get("aliases"), list):
                  raise SystemExit("Invalid image remote or aliases")
              if any(not isinstance(alias, str) or not alias.strip() for alias in image["aliases"]):
                  raise SystemExit("Invalid image alias")
          print(f"Validated {len(images)} available image records")
          PY
          finish 0

      - name: Test 5 - Architecture Verification
        id: test5
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local RC="$1"
            trap - EXIT
            if [ "$RC" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap 'finish "$?"' EXIT
          [ "${{ steps.install.outcome }}" = success ]
          [ "${{ steps.install.outputs.install_status }}" = success ]
          [ "$(uname -m)" = aarch64 ]
          finish 0


      - name: Regression applicability - package manager installed
        id: test6
        if: always()
        run: |
          set -euo pipefail
          CURRENT="${{ steps.version.outputs.version || 'unknown' }}"
          echo "current_version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest_version=not_applicable" >> "$GITHUB_OUTPUT"
          echo "next_installed_version=not_applicable" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.install.outcome }}" != success ] || [ "${{ steps.install.outputs.install_status }}" != success ]; then
            echo "decision=baseline_install_failed" >> "$GITHUB_OUTPUT"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "regression_result=Regression skipped: Multipass installation or readiness failed." >> "$GITHUB_OUTPUT"
            echo "comparison=No ready installed baseline is available for comparison." >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.version.outcome }}" = success ] && [ "$CURRENT" != unknown ] && \
               [ "${{ steps.test1.outcome }}" = success ] && [ "${{ steps.test1.outputs.status }}" = passed ] && \
               [ "${{ steps.test2.outcome }}" = success ] && [ "${{ steps.test2.outputs.status }}" = passed ] && \
               [ "${{ steps.test3.outcome }}" = success ] && [ "${{ steps.test3.outputs.status }}" = passed ] && \
               [ "${{ steps.test4.outcome }}" = success ] && [ "${{ steps.test4.outputs.status }}" = passed ] && \
               [ "${{ steps.test5.outcome }}" = success ] && [ "${{ steps.test5.outputs.status }}" = passed ]; then
            echo "decision=not_applicable_package_manager" >> "$GITHUB_OUTPUT"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "regression_result=Regression validation not applicable: tested package installed via package manager in Tests 1-5" >> "$GITHUB_OUTPUT"
            echo "comparison=The tested package is installed via a package manager in Tests 1-5, so version-to-version regression validation is not shown under the current policy." >> "$GITHUB_OUTPUT"
          else
            echo "decision=baseline_failed" >> "$GITHUB_OUTPUT"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "regression_result=Regression skipped: Multipass baseline validation failed." >> "$GITHUB_OUTPUT"
            echo "comparison=All five core checks must pass before a baseline can be compared." >> "$GITHUB_OUTPUT"
          fi
          echo "duration=0" >> "$GITHUB_OUTPUT"

      - name: Calculate test summary
        if: always()
        id: summary
        run: |
          set -euo pipefail
          PASSED=0
          FAILED=0
          SKIPPED=0
          TOTAL_DURATION=0
          check_core() {
            local status="$1" outcome="$2" duration="$3"
            if [[ "$duration" =~ ^[0-9]{1,6}$ ]]; then
              TOTAL_DURATION=$((TOTAL_DURATION + 10#$duration))
            else
              status=failed
            fi
            if [ "$status" = passed ] && [ "$outcome" = success ]; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
            fi
          }
          check_core "${{ steps.test1.outputs.status }}" "${{ steps.test1.outcome }}" "${{ steps.test1.outputs.duration || 0 }}"
          check_core "${{ steps.test2.outputs.status }}" "${{ steps.test2.outcome }}" "${{ steps.test2.outputs.duration || 0 }}"
          check_core "${{ steps.test3.outputs.status }}" "${{ steps.test3.outcome }}" "${{ steps.test3.outputs.duration || 0 }}"
          check_core "${{ steps.test4.outputs.status }}" "${{ steps.test4.outcome }}" "${{ steps.test4.outputs.duration || 0 }}"
          check_core "${{ steps.test5.outputs.status }}" "${{ steps.test5.outcome }}" "${{ steps.test5.outputs.duration || 0 }}"
          CORE_FAILED=$FAILED
          EXPECTED_DECISION=not_applicable_package_manager
          if [ "${{ steps.install.outcome }}" != success ] || [ "${{ steps.install.outputs.install_status }}" != success ]; then
            EXPECTED_DECISION=baseline_install_failed
          elif [ "$CORE_FAILED" -gt 0 ] || [ "${{ steps.version.outcome }}" != success ] || \
               [ -z "${{ steps.version.outputs.version }}" ] || [ "${{ steps.version.outputs.version }}" = unknown ]; then
            EXPECTED_DECISION=baseline_failed
          fi
          DURATION6="${{ steps.test6.outputs.duration || 0 }}"
          if [ "${{ steps.test6.outcome }}" = success ] && [ "${{ steps.test6.outputs.status }}" = skipped ] && \
             [ "${{ steps.test6.outputs.decision }}" = "$EXPECTED_DECISION" ] && \
             { { [ "$CORE_FAILED" -eq 0 ] && [ "$EXPECTED_DECISION" = not_applicable_package_manager ]; } || \
               { [ "$CORE_FAILED" -gt 0 ] && [ "$EXPECTED_DECISION" != not_applicable_package_manager ]; }; } && \
             [[ "$DURATION6" =~ ^[0-9]{1,6}$ ]]; then
            SKIPPED=1
          else
            FAILED=$((FAILED + 1))
          fi
          if [[ "$DURATION6" =~ ^[0-9]{1,6}$ ]]; then
            TOTAL_DURATION=$((TOTAL_DURATION + 10#$DURATION6))
          fi

          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
          echo "core_failed=$CORE_FAILED" >> "$GITHUB_OUTPUT"
          echo "duration=$TOTAL_DURATION" >> "$GITHUB_OUTPUT"

          if [ $FAILED -eq 0 ]; then
            echo "overall_status=success" >> "$GITHUB_OUTPUT"
            echo "badge_status=passing" >> "$GITHUB_OUTPUT"
          else
            echo "overall_status=failure" >> "$GITHUB_OUTPUT"
            echo "badge_status=failing" >> "$GITHUB_OUTPUT"
            exit 1
          fi
      - name: Create test summary
        if: always()
        run: |
          echo "## Multipass Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ steps.summary.outputs.overall_status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests Passed:** ${{ steps.summary.outputs.passed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests Failed:** ${{ steps.summary.outputs.failed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests Skipped:** ${{ steps.summary.outputs.skipped }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Duration:** ${{ steps.summary.outputs.duration || 0 }}s" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner:** ubuntu-24.04 (arm64)" >> $GITHUB_STEP_SUMMARY
          echo "- **Scope:** Installed CLI help and image query only; no VM launch or nested virtualization validation." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Details" >> $GITHUB_STEP_SUMMARY
          echo "1. Test 1 - Check multipass binary: ${{ steps.test1.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "2. Test 2 - Check version command: ${{ steps.test2.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "3. Test 3 - Check CLI help: ${{ steps.test3.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "4. Test 4 - List available images (find): ${{ steps.test4.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "5. Test 5 - Architecture Verification: ${{ steps.test5.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "6. Package manager regression applicability: ${{ steps.test6.outputs.status || 'skipped' }} (${{ steps.test6.outputs.decision }})" >> $GITHUB_STEP_SUMMARY

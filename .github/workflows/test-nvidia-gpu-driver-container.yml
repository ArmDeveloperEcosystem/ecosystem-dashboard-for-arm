      - name: Test 1 - Check package-specific baseline markers
        id: test1
        if: always()
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          MODE="${{ steps.install.outputs.install_mode || '' }}"
          SOURCE_MARKERS="${{ steps.expectations.outputs.source_markers }}"
          if [ "${{ steps.install.outputs.install_status || 'failed' }}" != "success" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "note=Baseline source or external metadata could not be acquired." >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$MODE" = "github_source" ]; then
            cd baseline-src
            FOUND=0
            HITS=""
            IFS='|' read -r -a MARKERS <<< "$SOURCE_MARKERS"
            for marker in "${MARKERS[@]}"; do
              if [ -e "$marker" ]; then
                FOUND=$((FOUND + 1))
                if [ -z "$HITS" ]; then
                  HITS="$marker"
                else
                  HITS="$HITS, $marker"
                fi
              fi
            done
            if [ "$FOUND" -ge 2 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
              echo "note=Found package-specific baseline markers: $HITS" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
              echo "note=Expected at least two package-specific markers from: $SOURCE_MARKERS" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          elif [ -f baseline-external/metadata.txt ]; then
            grep -Fx "download=$DOWNLOAD_URL" baseline-external/metadata.txt >/dev/null
            grep -Fx "homepage=$HOMEPAGE_URL" baseline-external/metadata.txt >/dev/null
            echo "status=passed" >> "$GITHUB_OUTPUT"
            echo "note=Validated external baseline metadata for the published source links." >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "note=External baseline metadata was not emitted." >> "$GITHUB_OUTPUT"
            exit 1
          fi
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 2 - Check published package metadata
        id: test2
        if: always()
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          CONTENT_PAGE="${{ steps.expectations.outputs.content_page }}"
          [ -f "$CONTENT_PAGE" ]
          grep -Fx "download_url: $DOWNLOAD_URL" "$CONTENT_PAGE" >/dev/null
          grep -Fx "works_on_arm: true" "$CONTENT_PAGE" >/dev/null
          grep -Fx "    version_number: $BASELINE_VERSION" "$CONTENT_PAGE" >/dev/null
          grep -Fx "    homepage_url: $HOMEPAGE_URL" "$CONTENT_PAGE" >/dev/null
          grep -Fx "        official_docs: $OFFICIAL_DOCS" "$CONTENT_PAGE" >/dev/null
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "note=Validated the checked-in package page against the workflow baseline, homepage, and docs metadata." >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 3 - Check package-specific docs and manifests
        id: test3
        if: always()
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          MODE="${{ steps.install.outputs.install_mode || '' }}"
          DOC_MARKERS="${{ steps.expectations.outputs.doc_markers }}"
          IDENTITY_TARGET="${{ steps.expectations.outputs.identity_target }}"
          if [ "$MODE" = "github_source" ]; then
            cd baseline-src
            FOUND=0
            HITS=""
            IFS='|' read -r -a MARKERS <<< "$DOC_MARKERS"
            for marker in "${MARKERS[@]}"; do
              if [ -e "$marker" ]; then
                FOUND=$((FOUND + 1))
                if [ -z "$HITS" ]; then
                  HITS="$marker"
                else
                  HITS="$HITS, $marker"
                fi
              fi
            done
            [ -e "$IDENTITY_TARGET" ]
            if [ "$FOUND" -ge 1 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
              echo "note=Validated package-specific documentation or manifest markers: $HITS" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
              echo "note=Expected at least one package-specific documentation marker from: $DOC_MARKERS" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          elif [ -f baseline-external/metadata.txt ]; then
            grep -Fx "docs=$OFFICIAL_DOCS" baseline-external/metadata.txt >/dev/null
            grep -Fx "homepage=$HOMEPAGE_URL" baseline-external/metadata.txt >/dev/null
            echo "status=passed" >> "$GITHUB_OUTPUT"
            echo "note=Validated external documentation and homepage metadata for the baseline package." >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "note=External documentation metadata was not emitted." >> "$GITHUB_OUTPUT"
            exit 1
          fi
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 4 - Verify Arm64 runner and lane assumptions
        id: test4
        if: always()
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          CONTENT_PAGE="${{ steps.expectations.outputs.content_page }}"
          [ "$(uname -m)" = "aarch64" ]
          grep -Fx "works_on_arm: true" "$CONTENT_PAGE" >/dev/null
          echo "status=passed" >> "$GITHUB_OUTPUT"
          if echo "$LANE_KIND" | grep -Eiq 'gpu|specialized|manual-review'; then
            echo "note=Validated Arm64 support metadata on a generic Arm runner; deeper runtime checks for this lane still require the package-specific environment: $LANE_KIND." >> "$GITHUB_OUTPUT"
          else
            echo "note=Validated Arm64 runner architecture and published Arm support metadata." >> "$GITHUB_OUTPUT"
          fi
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 5 - Run scoped Arm preflight proof
        id: test5
        if: always()
        run: |
          set -euo pipefail
          START_TIME=$SECONDS
          finish_test() {
            local rc=$?
            trap - EXIT
            if [ "$rc" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$((SECONDS - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish_test EXIT
          DRIVER_PREFLIGHT_MODE=baseline bash -euo pipefail -c "$SCOPED_ARM_PREFLIGHT_PROBE"

      - name: Test 6 - Regression Validation
        id: test6
        if: always()
        env:
          CORE_RESULTS: "${{ steps.test1.outcome }}:${{ steps.test1.outputs.status }} ${{ steps.test2.outcome }}:${{ steps.test2.outputs.status }} ${{ steps.test3.outcome }}:${{ steps.test3.outputs.status }} ${{ steps.test4.outcome }}:${{ steps.test4.outputs.status }} ${{ steps.test5.outcome }}:${{ steps.test5.outputs.status }}"
        run: |
          set -euo pipefail
          START_TIME=$SECONDS
          finish_test() {
            local rc=$?
            trap - EXIT
            if [ "$rc" -ne 0 ]; then
              echo "status=failed" >> "$GITHUB_OUTPUT"
              echo "decision=limited_cpu_smoke_failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$((SECONDS - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish_test EXIT
          if [ "$CORE_RESULTS" != "success:passed success:passed success:passed success:passed success:passed" ]; then
            {
              echo "status=skipped"
              echo "decision=baseline_failed"
              echo "current_version=$BASELINE_VERSION"
              echo "latest_version=unknown"
              echo "next_installed_version=not_installed"
              echo "regression_result=Baseline checks failed or were incomplete"
              echo "comparison=Candidate not attempted because all five baseline checks are required."
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DRIVER_PREFLIGHT_MODE=candidate bash -euo pipefail -c "$SCOPED_ARM_PREFLIGHT_PROBE"

      - name: Calculate test summary
        id: summary
        if: always()
        env:
          T1: "${{ steps.test1.outputs.status }}"
          T2: "${{ steps.test2.outputs.status }}"
          T3: "${{ steps.test3.outputs.status }}"
          T4: "${{ steps.test4.outputs.status }}"
          T5: "${{ steps.test5.outputs.status }}"
          T6: "${{ steps.test6.outputs.status }}"
          O1: "${{ steps.test1.outcome }}"
          O2: "${{ steps.test2.outcome }}"
          O3: "${{ steps.test3.outcome }}"
          O4: "${{ steps.test4.outcome }}"
          O5: "${{ steps.test5.outcome }}"
          O6: "${{ steps.test6.outcome }}"
          DECISION: "${{ steps.test6.outputs.decision }}"
          RESULT: "${{ steps.test6.outputs.regression_result }}"
          COMPARISON: "${{ steps.test6.outputs.comparison }}"
        run: |
          set -euo pipefail
          PASSED=0 FAILED=0 SKIPPED=0 CORE_FAILED=0
          STATUSES=("$T1" "$T2" "$T3" "$T4" "$T5")
          OUTCOMES=("$O1" "$O2" "$O3" "$O4" "$O5")
          for index in 0 1 2 3 4; do
            if [ "${STATUSES[$index]}" = passed ] && [ "${OUTCOMES[$index]}" = success ]; then
              STATUS=passed
              PASSED=$((PASSED + 1))
            else
              STATUS=failed
              FAILED=$((FAILED + 1))
              CORE_FAILED=$((CORE_FAILED + 1))
            fi
            echo "test$((index + 1))_status=$STATUS" >> "$GITHUB_OUTPUT"
          done
          if [ "$CORE_FAILED" -gt 0 ]; then
            T6=skipped
            DECISION=baseline_failed
            RESULT="Baseline checks failed or were incomplete"
            COMPARISON="Candidate evidence is not accepted because all five baseline checks are required."
          elif [ "$O6:$T6:$DECISION" = "success:passed:limited_cpu_smoke_validated" ] &&
               [[ "$RESULT" =~ [^[:space:]] && "$COMPARISON" =~ [^[:space:]] ]]; then
            :
          elif [ "$O6:$T6:$DECISION" = "success:skipped:no_newer_stable_available" ] &&
               [[ "$RESULT" =~ [^[:space:]] && "$COMPARISON" =~ [^[:space:]] ]]; then
            :
          else
            if [ "$DECISION" = metadata_review_required ]; then
              COMPARISON="Deferred candidate evidence (metadata_review_required) does not satisfy the required check. $COMPARISON"
            elif [ "$O6:$T6:$DECISION" != "failure:failed:limited_cpu_smoke_failed" ]; then
              COMPARISON="Missing, invalid or contradictory candidate evidence. $COMPARISON"
            fi
            T6=failed
            if [ "$DECISION" != limited_cpu_smoke_failed ]; then DECISION=next_regression_failed; fi
            RESULT="Required candidate preflight did not pass. $RESULT"
          fi
          case "$T6" in
            passed) PASSED=$((PASSED + 1));;
            failed) FAILED=$((FAILED + 1));;
            skipped) SKIPPED=$((SKIPPED + 1));;
          esac
          DURATION=$((${{ steps.test1.outputs.duration || '0' }} + ${{ steps.test2.outputs.duration || '0' }} + ${{ steps.test3.outputs.duration || '0' }} + ${{ steps.test4.outputs.duration || '0' }} + ${{ steps.test5.outputs.duration || '0' }} + ${{ steps.test6.outputs.duration || '0' }}))
          OVERALL_STATUS=failure BADGE_STATUS=failing
          if [ "$FAILED" -eq 0 ]; then OVERALL_STATUS=success; BADGE_STATUS=passing; fi
          {
            echo "passed=$PASSED"
            echo "failed=$FAILED"
            echo "skipped=$SKIPPED"
            echo "duration=$DURATION"
            echo "core_failed=$CORE_FAILED"
            echo "overall_status=$OVERALL_STATUS"
            echo "badge_status=$BADGE_STATUS"
            echo "regression_status=$T6"
            echo "regression_decision=$DECISION"
            echo "regression_result=$RESULT"
            echo "regression_comparison=$COMPARISON"
          } >> "$GITHUB_OUTPUT"
          [ "$OVERALL_STATUS" = success ]

      - name: Create test summary
        if: always()
        uses: ./.github/actions/write-package-job-summary
        with:
          package_name: 'NVIDIA GPU Driver Container (CPU-only image preflight)'
          version: ${{ steps.version.outputs.version || 'unknown' }}
          overall_status: ${{ steps.summary.outputs.overall_status || 'unknown' }}
          tests_passed: ${{ steps.summary.outputs.passed || '0' }}
          tests_failed: ${{ steps.summary.outputs.failed || '6' }}
          tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
          duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
          test1_status: ${{ steps.summary.outputs.test1_status || 'failed' }}
          test2_status: ${{ steps.summary.outputs.test2_status || 'failed' }}
          test3_status: ${{ steps.summary.outputs.test3_status || 'failed' }}
          test4_status: ${{ steps.summary.outputs.test4_status || 'failed' }}
          test5_status: ${{ steps.summary.outputs.test5_status || 'failed' }}
          test6_status: ${{ steps.summary.outputs.regression_status || 'failed' }}
          test6_decision: ${{ steps.summary.outputs.regression_decision || 'next_regression_failed' }}
          regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
          regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
          regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
          regression_result: ${{ steps.summary.outputs.regression_result || 'Required candidate preflight unavailable.' }}
          regression_details: ${{ steps.summary.outputs.regression_comparison || 'Required candidate evidence unavailable.' }}

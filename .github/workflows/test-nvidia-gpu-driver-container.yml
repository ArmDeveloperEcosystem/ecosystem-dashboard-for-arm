name: Test NVIDIA GPU Driver Container on Arm64

permissions:
  contents: read

on:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-nvidia-gpu-driver-container.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-nvidia-gpu-driver-container.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-nvidia-gpu-driver-container.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-nvidia-gpu-driver-container.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-nvidia-gpu-driver-container.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-nvidia-gpu-driver-container.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-nvidia-gpu-driver-container.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-nvidia-gpu-driver-container.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-nvidia-gpu-driver-container.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-nvidia-gpu-driver-container.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-nvidia-gpu-driver-container.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-nvidia-gpu-driver-container.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-nvidia-gpu-driver-container.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-nvidia-gpu-driver-container.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-nvidia-gpu-driver-container.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-nvidia-gpu-driver-container.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-nvidia-gpu-driver-container.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-nvidia-gpu-driver-container.outputs.regression_next_installed_version }}
      regression_policy:
        description: Regression applicability policy classification
        value: ${{ jobs.test-nvidia-gpu-driver-container.outputs.regression_policy }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-nvidia-gpu-driver-container.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-nvidia-gpu-driver-container.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-nvidia-gpu-driver-container.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-nvidia-gpu-driver-container.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-nvidia-gpu-driver-container.outputs.timestamp }}

jobs:
  test-nvidia-gpu-driver-container:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      BASELINE_VERSION: "535.288.01"
      PACKAGE_SLUG: "nvidia-gpu-driver-container"
      LANE_KIND: "gpu/specialized/external-image"
      DOWNLOAD_URL: "https://catalog.ngc.nvidia.com/orgs/nvidia/containers/driver"
      HOMEPAGE_URL: "https://github.com/NVIDIA/gpu-driver-container"
      OFFICIAL_DOCS: "https://github.com/NVIDIA/gpu-driver-container#gpu-driver-container"
      GITHUB_REPO: ""
      IMAGE_VARIANT: "ubuntu22.04"
      PINNED_CONTAINER_IMAGE_NVIDIA_DRIVER: nvcr.io/nvidia/driver@sha256:21b0c912d4c71f1166c68d4c7e26d28981f0e9d1de5ed00c332e00fdbde41b15 # original: nvcr.io/nvidia/driver:535.288.01-ubuntu22.04
      SCOPED_ARM_PREFLIGHT_PROBE: |
        python3 - <<'PY'
        import hashlib
        import json
        import os
        import platform
        import re
        import subprocess
        import sys
        import uuid

        REPOSITORY = "nvcr.io/nvidia/driver"
        INDEX_TYPES = {
            "application/vnd.oci.image.index.v1+json",
            "application/vnd.docker.distribution.manifest.list.v2+json",
        }
        MANIFEST_TYPES = {
            "application/vnd.oci.image.manifest.v1+json",
            "application/vnd.docker.distribution.manifest.v2+json",
        }
        SCOPE = (
            "CPU-only Arm64 image payload preflight: native shell, driver-script syntax "
            "and bundled installer checksum only. No driver installation, kernel module "
            "load, privileged container, CUDA or GPU execution was tested."
        )
        mode = os.environ["DRIVER_PREFLIGHT_MODE"]
        current = os.environ["BASELINE_VERSION"]
        variant = os.environ["IMAGE_VARIANT"]
        latest = "unknown"
        observed = "not_installed"

        class EvidenceUnavailable(ValueError):
            pass

        def require(condition, message):
            if not condition:
                raise EvidenceUnavailable(message)

        def output(**fields):
            with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
                for key, value in fields.items():
                    stream.write(f"{key}={' '.join(str(value).splitlines())}\n")

        def command(args, timeout=120):
            env = {k: v for k, v in os.environ.items()
                   if k not in {"GH_TOKEN", "GITHUB_TOKEN"}}
            return subprocess.run(args, env=env, check=True, capture_output=True,
                                  timeout=timeout).stdout

        def registry(operation, reference, *flags):
            try:
                return command(["skopeo", operation, "--no-creds", "--tls-verify=true",
                                *flags, "docker://" + reference])
            except (subprocess.SubprocessError, OSError) as exc:
                raise EvidenceUnavailable(f"Registry {operation} unavailable: {type(exc).__name__}") from exc

        def digest(raw):
            return "sha256:" + hashlib.sha256(raw).hexdigest()

        def descriptor(value):
            require(isinstance(value, dict), "Missing image descriptor")
            require(re.fullmatch(r"sha256:[0-9a-f]{64}", str(value.get("digest", ""))),
                    "Invalid image digest")
            require(type(value.get("size")) is int and value["size"] > 0,
                    "Invalid image descriptor size")
            return value["digest"]

        def candidate():
            data = json.loads(registry("list-tags", REPOSITORY))
            require(isinstance(data, dict), "Invalid registry tag document")
            require(data.get("Repository") == REPOSITORY, "Unexpected tag repository")
            tags = data.get("Tags")
            require(isinstance(tags, list) and all(isinstance(tag, str) for tag in tags),
                    "Invalid registry tag inventory")
            require(f"{current}-{variant}" in tags, "Baseline absent from tag inventory")
            pattern = re.compile(r"([0-9]+\.[0-9]+\.[0-9]+)-" + re.escape(variant))
            versions = {m[1] for tag in tags if (m := pattern.fullmatch(tag))}
            newer = [v for v in versions if tuple(map(int, v.split("."))) >
                     tuple(map(int, current.split(".")))]
            return max(newer, key=lambda v: tuple(map(int, v.split(".")))) if newer else None

        def resolve(reference, version):
            require(re.fullmatch(re.escape(REPOSITORY) +
                                r"(?::[0-9]+\.[0-9]+\.[0-9]+-ubuntu22\.04|@sha256:[0-9a-f]{64})",
                                reference), "Unexpected image repository or reference")
            raw = registry("inspect", reference, "--raw")
            root_digest = digest(raw)
            if "@" in reference:
                require(reference == REPOSITORY + "@" + root_digest, "Pinned index digest mismatch")
            document = json.loads(raw)
            require(isinstance(document, dict), "Invalid manifest document")
            require(document.get("schemaVersion") == 2, "Unsupported manifest schema")
            if document.get("mediaType") in INDEX_TYPES:
                entries = document.get("manifests")
                require(isinstance(entries, list) and all(isinstance(x, dict) and
                        isinstance(x.get("platform"), dict) for x in entries),
                        "Invalid multi-architecture index")
                arm = [x for x in entries if x.get("platform", {}).get("os") == "linux"
                       and x.get("platform", {}).get("architecture") == "arm64"
                       and x.get("platform", {}).get("variant", "") in {"", "v8"}]
                require(len(arm) == 1, "Expected exactly one Linux/Arm64 image")
                selected = descriptor(arm[0])
                require(arm[0].get("mediaType") in MANIFEST_TYPES, "Unsupported Arm manifest type")
                raw = registry("inspect", REPOSITORY + "@" + selected, "--raw")
                require(digest(raw) == selected and len(raw) == arm[0]["size"],
                        "Arm manifest digest or size mismatch")
                document = json.loads(raw)
            else:
                selected = root_digest
            require(isinstance(document, dict), "Invalid image manifest document")
            require(document.get("schemaVersion") == 2 and
                    document.get("mediaType") in MANIFEST_TYPES, "Unsupported image manifest")
            config_digest = descriptor(document.get("config"))
            layers = document.get("layers")
            require(isinstance(layers, list) and layers, "Missing image payload layers")
            for layer in layers:
                descriptor(layer)
            reference = REPOSITORY + "@" + selected
            config = json.loads(registry("inspect", reference, "--config"))
            require(isinstance(config, dict) and isinstance(config.get("config"), dict),
                    "Invalid image config document")
            require(config.get("architecture") == "arm64" and config.get("os") == "linux",
                    "Image config is not Linux/Arm64")
            require(config.get("config", {}).get("Entrypoint") == ["nvidia-driver", "init"],
                    "Unexpected driver-container entrypoint")
            environment = config.get("config", {}).get("Env", [])
            require(isinstance(environment, list) and all(isinstance(x, str) for x in environment) and
                    environment.count("DRIVER_VERSION=" + version) == 1 and
                    environment.count("TARGETARCH=arm64") == 1 and
                    sum(x.startswith("DRIVER_VERSION=") for x in environment) == 1 and
                    sum(x.startswith("TARGETARCH=") for x in environment) == 1,
                    "Driver version or target architecture mismatch")
            return reference, root_digest, config_digest

        def preflight(reference, version, config_digest):
            command(["docker", "pull", "--platform", "linux/arm64", reference], timeout=600)
            images = json.loads(command(["docker", "image", "inspect", reference]))
            require(isinstance(images, list) and len(images) == 1 and isinstance(images[0], dict),
                    "Missing pulled image")
            image = images[0]
            require(image.get("Id") == config_digest and image.get("Architecture") == "arm64"
                    and image.get("Os") == "linux", "Pulled image identity mismatch")
            name = "nvidia-driver-preflight-" + uuid.uuid4().hex
            script = r'''
        test "$(uname -m)" = aarch64
        test "$TARGETARCH" = arm64
        test "$DRIVER_VERSION" = "$1"
        . /etc/os-release
        test "$ID:$VERSION_ID" = ubuntu:22.04
        test -s /usr/local/bin/nvidia-driver
        test -s /tmp/install.sh
        bash -n /usr/local/bin/nvidia-driver
        bash -n /tmp/install.sh
        installer="/drivers/NVIDIA-Linux-aarch64-$1.run"
        test -s "$installer"
        # --check verifies the embedded archive and exits without installing it.
        sh "$installer" --check
        printf 'DRIVER_PREFLIGHT_OK version=%s arch=aarch64 checksum=verified\n' "$1"
        '''
            try:
                result = command([
                    "docker", "run", "--rm", "--name", name, "--pull=never",
                    "--platform", "linux/arm64", "--runtime", "runc",
                    "--network", "none", "--read-only", "--user", "65534:65534",
                    "--cap-drop", "ALL", "--security-opt", "no-new-privileges",
                    "--pids-limit", "64", "--cpus", "2", "--memory", "512m",
                    "--memory-swap", "512m", "--entrypoint", "/bin/bash",
                    reference, "-euc", script, "--", version,
                ], timeout=180).decode()
                require(f"DRIVER_PREFLIGHT_OK version={version} arch=aarch64 checksum=verified"
                        in result.splitlines(), "Missing completed payload proof")
                print(result, end="")
            finally:
                subprocess.run(["docker", "rm", "-f", name], capture_output=True, timeout=30)

        try:
            require(platform.system() == "Linux" and platform.machine() in {"aarch64", "arm64"},
                    "Native Linux/Arm64 runner required")
            require(mode in {"baseline", "candidate"} and variant == "ubuntu22.04" and
                    re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", current), "Invalid preflight context")
            if mode == "candidate":
                try:
                    latest = candidate()
                    if latest is None:
                        output(status="skipped", decision="no_newer_stable_available",
                               current_version=current, latest_version=current,
                               next_installed_version="n/a",
                               regression_result="No newer stable matching registry tag exists",
                               comparison=SCOPE + " Complete registry tag inventory checked.")
                        sys.exit(0)
                    reference, index_digest, config_digest = resolve(
                        REPOSITORY + ":" + latest + "-" + variant, latest)
                except (EvidenceUnavailable, ValueError, KeyError, TypeError) as exc:
                    output(status="skipped", decision="metadata_review_required",
                           current_version=current, latest_version=latest or "unknown",
                           next_installed_version=observed,
                           regression_result="Candidate registry evidence unresolved",
                           comparison=SCOPE + " Deferred: " + str(exc))
                    sys.exit(0)
            else:
                latest = current
                reference, index_digest, config_digest = resolve(
                    os.environ["PINNED_CONTAINER_IMAGE_NVIDIA_DRIVER"], current)
            preflight(reference, latest, config_digest)
            observed = latest
            evidence = f"index={index_digest}; image={reference}; config={config_digest}"
            print(evidence)
            if mode == "candidate":
                output(status="passed", decision="limited_cpu_smoke_validated",
                       current_version=current, latest_version=latest,
                       next_installed_version=observed,
                       regression_result="Native Arm64 image payload preflight passed",
                       comparison=SCOPE + " " + evidence)
        except (EvidenceUnavailable, ValueError, KeyError, TypeError,
                subprocess.SubprocessError, OSError) as exc:
            print(f"Image payload preflight failed: {type(exc).__name__}: {exc}", file=sys.stderr)
            if mode == "candidate":
                output(status="failed", decision="limited_cpu_smoke_failed",
                       current_version=current, latest_version=latest,
                       next_installed_version=observed,
                       regression_result="Required image payload preflight failed",
                       comparison=SCOPE + " Preflight did not complete successfully.")
            sys.exit(1)
        PY

    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'NVIDIA GPU Driver Container (CPU-only image preflight)'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '5' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '6' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.summary.outputs.regression_status || 'failed' }}
      regression_decision: ${{ steps.summary.outputs.regression_decision || 'next_regression_failed' }}
      regression_result: ${{ steps.summary.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.summary.outputs.regression_comparison || 'Required candidate evidence unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      regression_policy: "applicable"
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=nvidia-gpu-driver-container" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/linux/opensource_packages/nvidia-gpu-driver-container" >> "$GITHUB_OUTPUT"

      - name: Bootstrap baseline dependencies
        uses: ./.github/actions/apt-bootstrap
        with:
          packages: "git curl jq tar unzip file ca-certificates skopeo"
          quiet: "true"

      - name: Install baseline source or artifact
        id: install
        run: |
          set -euo pipefail
          rm -rf baseline-src baseline-external
          mkdir -p baseline-src baseline-external
          if [ -n "$GITHUB_REPO" ]; then
            RESOLVED_TAG=""
            for CANDIDATE in "$BASELINE_VERSION" "v$BASELINE_VERSION"; do
              if git ls-remote --tags --refs "https://github.com/$GITHUB_REPO.git" "refs/tags/$CANDIDATE" | grep -q .; then
                RESOLVED_TAG="$CANDIDATE"
                break
              fi
            done
            if [ -n "$RESOLVED_TAG" ]; then
              git clone --filter=blob:none --depth 1 --branch "$RESOLVED_TAG" "https://github.com/$GITHUB_REPO.git" baseline-src >/dev/null 2>&1 || true
              echo "resolved_tag=$RESOLVED_TAG" >> "$GITHUB_OUTPUT"
            else
              git clone --filter=blob:none --depth 1 "https://github.com/$GITHUB_REPO.git" baseline-src >/dev/null 2>&1 || true
              echo "resolved_tag=default_branch" >> "$GITHUB_OUTPUT"
            fi
            if [ -d baseline-src/.git ] || [ -f baseline-src/README.md ] || [ -n "$(find baseline-src -mindepth 1 -maxdepth 2 -print -quit 2>/dev/null)" ]; then
              echo "install_mode=github_source" >> "$GITHUB_OUTPUT"
              echo "install_status=success" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if curl -fsLI "$DOWNLOAD_URL" >/dev/null 2>&1 || curl -fsLI "$HOMEPAGE_URL" >/dev/null 2>&1; then
            printf 'download=%s\nhomepage=%s\ndocs=%s\n' "$DOWNLOAD_URL" "$HOMEPAGE_URL" "$OFFICIAL_DOCS" > baseline-external/metadata.txt
            echo "resolved_tag=external_artifact" >> "$GITHUB_OUTPUT"
            echo "install_mode=external_artifact" >> "$GITHUB_OUTPUT"
            echo "install_status=success" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "install_mode=unresolved" >> "$GITHUB_OUTPUT"
          echo "install_status=failed" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Get baseline version
        id: version
        run: |
          echo "version=$BASELINE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected baseline version: $BASELINE_VERSION"

      - name: Define package-specific expectations
        id: expectations
        run: |
          set -euo pipefail
          CONTENT_PAGE="content/linux/opensource_packages/${PACKAGE_SLUG}.md"
          echo "content_page=$CONTENT_PAGE" >> "$GITHUB_OUTPUT"
          case "$PACKAGE_SLUG" in
            ngspice)
              echo "source_markers=ANALYSES|DEVICES|src|README|man" >> "$GITHUB_OUTPUT"
              echo "doc_markers=README|README.adms|README.tcl|src" >> "$GITHUB_OUTPUT"
              echo "identity_kind=grep_file" >> "$GITHUB_OUTPUT"
              echo "identity_target=README" >> "$GITHUB_OUTPUT"
              echo "identity_expect=ngspice" >> "$GITHUB_OUTPUT"
              echo "external_expect=ngspice" >> "$GITHUB_OUTPUT"
              ;;
            nvidia-container-toolkit)
              echo "source_markers=cmd/nvidia-ctk|cmd/nvidia-container-runtime|go.mod|pkg" >> "$GITHUB_OUTPUT"
              echo "doc_markers=README.md|cmd/nvidia-container-runtime|CHANGELOG.md|go.mod" >> "$GITHUB_OUTPUT"
              echo "identity_kind=go_module" >> "$GITHUB_OUTPUT"
              echo "identity_target=go.mod" >> "$GITHUB_OUTPUT"
              echo "identity_expect=github.com/NVIDIA/nvidia-container-toolkit" >> "$GITHUB_OUTPUT"
              echo "external_expect=nvidia-container-toolkit|NVIDIA Container Toolkit" >> "$GITHUB_OUTPUT"
              ;;
            nvidia-gpu-driver-container)
              echo "source_markers=base|Makefile|README.md|centos7|vgpu" >> "$GITHUB_OUTPUT"
              echo "doc_markers=README.md|base|azurelinux|centos7" >> "$GITHUB_OUTPUT"
              echo "identity_kind=grep_file" >> "$GITHUB_OUTPUT"
              echo "identity_target=README.md" >> "$GITHUB_OUTPUT"
              echo "identity_expect=driver container" >> "$GITHUB_OUTPUT"
              echo "external_expect=gpu driver container|NVIDIA driver" >> "$GITHUB_OUTPUT"
              ;;
            nvidia-gpu-operator)
              echo "source_markers=deployments/gpu-operator|go.mod|PROJECT|README.md" >> "$GITHUB_OUTPUT"
              echo "doc_markers=README.md|deployments/gpu-operator/Chart.yaml|tests|go.mod" >> "$GITHUB_OUTPUT"
              echo "identity_kind=chart_name" >> "$GITHUB_OUTPUT"
              echo "identity_target=deployments/gpu-operator/Chart.yaml" >> "$GITHUB_OUTPUT"
              echo "identity_expect=gpu-operator" >> "$GITHUB_OUTPUT"
              echo "external_expect=gpu-operator|GPU Operator" >> "$GITHUB_OUTPUT"
              ;;
            nvimagecodec)
              echo "source_markers=CMakeLists.txt|README.md|example|cmake" >> "$GITHUB_OUTPUT"
              echo "doc_markers=README.md|CMakeLists.txt|example" >> "$GITHUB_OUTPUT"
              echo "identity_kind=grep_file" >> "$GITHUB_OUTPUT"
              echo "identity_target=README.md" >> "$GITHUB_OUTPUT"
              echo "identity_expect=nvImageCodec" >> "$GITHUB_OUTPUT"
              echo "external_expect=nvImageCodec|nvimgcodec" >> "$GITHUB_OUTPUT"
              ;;
            nvsentinel)
              echo "source_markers=distros/kubernetes/nvsentinel|api|commons|Makefile" >> "$GITHUB_OUTPUT"
              echo "doc_markers=README.md|distros/kubernetes/nvsentinel/Chart.yaml|preflight-checks|health-monitors" >> "$GITHUB_OUTPUT"
              echo "identity_kind=chart_name" >> "$GITHUB_OUTPUT"
              echo "identity_target=distros/kubernetes/nvsentinel/Chart.yaml" >> "$GITHUB_OUTPUT"
              echo "identity_expect=nvsentinel" >> "$GITHUB_OUTPUT"
              echo "external_expect=nvsentinel" >> "$GITHUB_OUTPUT"
              ;;
            nvshmem)
              echo "source_markers=CMakeLists.txt|README.md|examples|cmake_config" >> "$GITHUB_OUTPUT"
              echo "doc_markers=README.md|examples|CMakeLists.txt|nvshmem4py" >> "$GITHUB_OUTPUT"
              echo "identity_kind=grep_file" >> "$GITHUB_OUTPUT"
              echo "identity_target=README.md" >> "$GITHUB_OUTPUT"
              echo "identity_expect=NVSHMEM" >> "$GITHUB_OUTPUT"
              echo "external_expect=NVSHMEM|nvshmem" >> "$GITHUB_OUTPUT"
              ;;
            nx-cugraph)
              echo "source_markers=_nx_cugraph|pyproject.toml|VERSION|README.md|benchmarks" >> "$GITHUB_OUTPUT"
              echo "doc_markers=README.md|pyproject.toml|_nx_cugraph/VERSION|VERSION" >> "$GITHUB_OUTPUT"
              echo "identity_kind=toml_name" >> "$GITHUB_OUTPUT"
              echo "identity_target=pyproject.toml" >> "$GITHUB_OUTPUT"
              echo "identity_expect=nx-cugraph" >> "$GITHUB_OUTPUT"
              echo "external_expect=nx-cugraph|cugraph" >> "$GITHUB_OUTPUT"
              ;;
            ocm)
              echo "source_markers=go.mod|api|README.md|VERSION" >> "$GITHUB_OUTPUT"
              echo "doc_markers=README.md|api|VERSION|cmds" >> "$GITHUB_OUTPUT"
              echo "identity_kind=go_module" >> "$GITHUB_OUTPUT"
              echo "identity_target=go.mod" >> "$GITHUB_OUTPUT"
              echo "identity_expect=ocm.software/ocm" >> "$GITHUB_OUTPUT"
              echo "external_expect=Open Component Model|open component model|OCM" >> "$GITHUB_OUTPUT"
              ;;
            ollama)
              echo "source_markers=go.mod|README.md|app|docs|CMakeLists.txt" >> "$GITHUB_OUTPUT"
              echo "doc_markers=README.md|docs|app|go.mod" >> "$GITHUB_OUTPUT"
              echo "identity_kind=grep_file" >> "$GITHUB_OUTPUT"
              echo "identity_target=README.md" >> "$GITHUB_OUTPUT"
              echo "identity_expect=ollama run" >> "$GITHUB_OUTPUT"
              echo "external_expect=ollama" >> "$GITHUB_OUTPUT"
              ;;
            openfpgaloader)
              echo "source_markers=CMakeLists.txt|src|scripts|70-openfpgaloader.rules|README.md" >> "$GITHUB_OUTPUT"

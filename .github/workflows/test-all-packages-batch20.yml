name: Test All Packages (Batch 20) on Arm64
run-name: Arm64 Batch 20 [${{ inputs.orchestration_id || format('manual-{0}-{1}', github.run_id, github.run_attempt) }}] [nonce:${{ inputs.dispatch_nonce || 'manual-only' }}]

on:
  workflow_dispatch:
    inputs:
      orchestration_id:
        description: Exact orchestrator identity; blank uses a safe manual fallback
        required: false
        default: ""
        type: string
      dispatch_nonce:
        description: Secret exact-dispatch nonce; blank is manual-only and not publishable
        required: false
        default: ""
        type: string
      expected_sha:
        description: Exact commit expected by the orchestrator
        required: false
        default: ""
        type: string
      expected_branch:
        description: Exact branch expected by the orchestrator
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      orchestration_id:
        required: true
        type: string
      dispatch_nonce:
        required: true
        type: string
      expected_sha:
        required: true
        type: string
      expected_branch:
        required: true
        type: string

permissions:
  contents: read

jobs:

  test-mig-parted:
    uses: ./.github/workflows/test-mig-parted.yml

  test-migen:
    uses: ./.github/workflows/test-migen.yml

  test-mindspore:
    uses: ./.github/workflows/test-mindspore.yml

  test-mlflow:
    uses: ./.github/workflows/test-mlflow.yml

  test-mlnet:
    uses: ./.github/workflows/test-mlnet.yml

  test-ms-openjdk:
    uses: ./.github/workflows/test-ms-openjdk.yml

  test-msquic:
    uses: ./.github/workflows/test-msquic.yml

  test-myhdl:
    uses: ./.github/workflows/test-myhdl.yml

  test-nemo-agent-toolkit:
    uses: ./.github/workflows/test-nemo-agent-toolkit.yml

  test-neuralforecast:
    uses: ./.github/workflows/test-neuralforecast.yml

  test-ngspice:
    uses: ./.github/workflows/test-ngspice.yml

  test-notebook:
    uses: ./.github/workflows/test-notebook.yml

  test-nvidia-container-toolkit:
    uses: ./.github/workflows/test-nvidia-container-toolkit.yml

  test-nvidia-gpu-driver-container:
    uses: ./.github/workflows/test-nvidia-gpu-driver-container.yml

  test-nvidia-gpu-operator:
    uses: ./.github/workflows/test-nvidia-gpu-operator.yml

  test-nvimagecodec:
    uses: ./.github/workflows/test-nvimagecodec.yml

  test-nvsentinel:
    uses: ./.github/workflows/test-nvsentinel.yml

  test-nvshmem:
    uses: ./.github/workflows/test-nvshmem.yml

  test-nx-cugraph:
    uses: ./.github/workflows/test-nx-cugraph.yml

  test-ocm:
    uses: ./.github/workflows/test-ocm.yml

  test-ollama:
    uses: ./.github/workflows/test-ollama.yml

  test-open-webui:
    uses: ./.github/workflows/test-open-webui.yml

  test-openfpgaloader:
    uses: ./.github/workflows/test-openfpgaloader.yml

  test-openlane:
    uses: ./.github/workflows/test-openlane.yml

  test-opennow:
    uses: ./.github/workflows/test-opennow.yml

  test-optuna:
    uses: ./.github/workflows/test-optuna.yml

  test-ord-provider-server:
    uses: ./.github/workflows/test-ord-provider-server.yml

  test-oregano:
    uses: ./.github/workflows/test-oregano.yml

  test-osmo:
    uses: ./.github/workflows/test-osmo.yml

  test-owncast:
    uses: ./.github/workflows/test-owncast.yml

  test-pcb-rnd:
    uses: ./.github/workflows/test-pcb-rnd.yml

  test-physics-nemo:
    uses: ./.github/workflows/test-physics-nemo.yml

  test-playit:
    uses: ./.github/workflows/test-playit.yml

  test-playwright:
    uses: ./.github/workflows/test-playwright.yml

  test-prophet:
    uses: ./.github/workflows/test-prophet.yml

  test-pycaret:
    uses: ./.github/workflows/test-pycaret.yml

  test-pyspice:
    uses: ./.github/workflows/test-pyspice.yml

  test-qflow:
    uses: ./.github/workflows/test-qflow.yml

  test-qrouter:
    uses: ./.github/workflows/test-qrouter.yml

  test-raft:
    uses: ./.github/workflows/test-raft.yml

  test-ragflow:
    uses: ./.github/workflows/test-ragflow.yml

  test-rav1e:
    uses: ./.github/workflows/test-rav1e.yml

  test-resiliency-extension:
    uses: ./.github/workflows/test-resiliency-extension.yml

  test-restreamer:
    uses: ./.github/workflows/test-restreamer.yml

  test-ringdove-eda:
    uses: ./.github/workflows/test-ringdove-eda.yml

  summary:
    permissions:
      actions: read
      contents: read
    needs:
      [
        test-mig-parted,
        test-migen,
        test-mindspore,
        test-mlflow,
        test-mlnet,
        test-ms-openjdk,
        test-msquic,
        test-myhdl,
        test-nemo-agent-toolkit,
        test-neuralforecast,
        test-ngspice,
        test-notebook,
        test-nvidia-container-toolkit,
        test-nvidia-gpu-driver-container,
        test-nvidia-gpu-operator,
        test-nvimagecodec,
        test-nvsentinel,
        test-nvshmem,
        test-nx-cugraph,
        test-ocm,
        test-ollama,
        test-open-webui,
        test-openfpgaloader,
        test-openlane,
        test-opennow,
        test-optuna,
        test-ord-provider-server,
        test-oregano,
        test-osmo,
        test-owncast,
        test-pcb-rnd,
        test-physics-nemo,
        test-playit,
        test-playwright,
        test-prophet,
        test-pycaret,
        test-pyspice,
        test-qflow,
        test-qrouter,
        test-raft,
        test-ragflow,
        test-rav1e,
        test-resiliency-extension,
        test-restreamer,
        test-ringdove-eda
      ]
    runs-on: ubuntu-24.04-arm
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect batch results
        id: collect
        uses: ./.github/actions/collect-batch-results
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        with:
          batch_number: "20"
          batch_title: "Batch 20"

      - name: Attest complete batch results
        id: attest
        if: steps.collect.outcome == 'success'
        env:
          ARTIFACT_NAME: batch20-test-results
          BATCH_NUMBER: "20"
          COLLECTOR_JSON_COUNT: ${{ steps.collect.outputs.json_count }}
          CURRENT_BRANCH: ${{ github.ref_name }}
          DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
          EXPECTED_BRANCH: ${{ inputs.expected_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          NEEDS_JSON: ${{ toJson(needs) }}
          ORCHESTRATION_ID: ${{ inputs.orchestration_id }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/batch_artifact_attestation.py create \
            --results-root test-results \
            --workflow-file ".github/workflows/test-all-packages-batch20.yml" \
            --batch "$BATCH_NUMBER" \
            --repository "$REPOSITORY" \
            --expected-branch "$EXPECTED_BRANCH" \
            --current-branch "$CURRENT_BRANCH" \
            --expected-sha "$EXPECTED_SHA" \
            --workflow-sha "$WORKFLOW_SHA" \
            --orchestration-id "$ORCHESTRATION_ID" \
            --dispatch-nonce "$DISPATCH_NONCE" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --artifact-name "$ARTIFACT_NAME" \
            --collector-json-count "$COLLECTOR_JSON_COUNT" \
            --needs-environment-variable NEEDS_JSON

      - name: Upload batch test results
        if: steps.collect.outcome == 'success' && steps.attest.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: batch20-test-results
          path: test-results
          retention-days: 90

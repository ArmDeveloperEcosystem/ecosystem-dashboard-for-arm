name: Test Kubewarden Audit Scanner on Arm64

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-kubewarden-audit-scanner.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-kubewarden-audit-scanner.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-kubewarden-audit-scanner.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-kubewarden-audit-scanner.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-kubewarden-audit-scanner.outputs.run_status }}
      badge_status:
        description: Badge status derived from all six checks
        value: ${{ jobs.test-kubewarden-audit-scanner.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-kubewarden-audit-scanner.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-kubewarden-audit-scanner.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-kubewarden-audit-scanner.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-kubewarden-audit-scanner.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-kubewarden-audit-scanner.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-kubewarden-audit-scanner.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-kubewarden-audit-scanner.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-kubewarden-audit-scanner.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-kubewarden-audit-scanner.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-kubewarden-audit-scanner.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-kubewarden-audit-scanner.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-kubewarden-audit-scanner.outputs.regression_next_installed_version }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-kubewarden-audit-scanner.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-kubewarden-audit-scanner.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-kubewarden-audit-scanner.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-kubewarden-audit-scanner.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-kubewarden-audit-scanner.outputs.timestamp }}
jobs:
  test-kubewarden-audit-scanner:
    runs-on: ubuntu-24.04-arm
    env:
      # Upstream uses plain go build, without a CLI version or linker injection.
      # Go <1.24 reports (devel); bind that honestly to the reviewed source release.
      AUDIT_SCANNER_IDENTITY_COMMAND: |
        python3 - <<'PY'
        import datetime
        import hashlib
        import json
        import os
        from pathlib import Path
        import subprocess
        import sys

        repository = "https://github.com/kubewarden/audit-scanner.git"
        module = "github.com/kubewarden/audit-scanner"
        releases = {
            "v1.24.0": ("d634a49dc9570ccb0ec59cd0d0ea3d0fc9c02763", "f382260809e93bb60a1de7fd881d1f633f4942e7"),
            "v1.25.0": ("76a9ccb434613c3450f760e9d574b653c4ce9f4d", "20b70433f4ce03f96a9d01c7231108060305a4a3"),
        }

        def require(condition, message):
            if not condition:
                raise SystemExit(message)

        def command(*args):
            return subprocess.check_output(args, text=True).strip()

        source = os.environ["AUDIT_SOURCE_DIR"]
        tag = os.environ["AUDIT_TAG"]
        require(tag in releases, "Unreviewed release tag")
        tag_object, commit = releases[tag]

        def git(*args):
            return command("git", "-C", source, *args)

        require(git("remote", "get-url", "origin") == repository, "Wrong source repository")
        # HTTPS authenticates GitHub; pins detect moved tags. This is not signature verification.
        remote = command("git", "-c", "http.sslVerify=true", "-c", "http.followRedirects=false",
                         "ls-remote", "--exit-code", repository, "refs/tags/" + tag, "refs/tags/" + tag + "^{}")
        require(sorted(line.split() for line in remote.splitlines()) == sorted([
            [tag_object, "refs/tags/" + tag], [commit, "refs/tags/" + tag + "^{}"],
        ]), "Official release tag differs from reviewed identity")
        require(git("rev-parse", "HEAD") == commit, "Wrong source revision")
        require(git("rev-parse", "refs/tags/" + tag) == tag_object, "Wrong local tag object")
        require(git("rev-parse", "refs/tags/" + tag + "^{commit}") == commit, "Wrong local tag revision")
        source_tag = git("describe", "--tags", "--exact-match", "HEAD")
        require(source_tag == tag, "Wrong exact source tag")
        require(not git("status", "--porcelain", "--untracked-files=all"), "Dirty source checkout")
        binary = os.environ.get("AUDIT_BINARY")
        if not binary:
            print(json.dumps({"repository": repository, "source_tag": tag, "source_commit": commit}), file=sys.stderr)
            sys.exit(0)

        metadata = command("go", "version", "-m", binary)
        print(metadata, file=sys.stderr)
        paths, modules, settings = [], [], {}
        module_kind = None
        for line in metadata.splitlines()[1:]:
            fields = line.split()
            if not fields:
                continue
            if fields[0] == "path":
                paths.append(fields[1:])
            elif fields[0] == "mod":
                modules.append(fields[1:])
                module_kind = "mod"
            elif fields[0] == "dep":
                module_kind = "dep"
            elif fields[0] == "=>":
                require(module_kind == "dep", "Replaced main module in binary")
            elif fields[0] == "build":
                key, value = line.strip().split(None, 1)[1].split("=", 1)
                require(key not in settings, "Duplicate binary build setting")
                settings[key] = value
        require(paths == [[module]], "Wrong binary main package")
        require(len(modules) == 1 and len(modules[0]) >= 2 and modules[0][0] == module, "Wrong binary module")
        reported = modules[0][1]
        require(reported == tag or (tag == "v1.24.0" and reported == "(devel)"), "Wrong binary module version")
        require(settings.get("vcs") == "git", "Missing binary Git metadata")
        require(settings.get("vcs.revision") == commit, "Wrong binary revision")
        require(settings.get("vcs.modified") == "false", "Dirty or unverified binary")
        source_time = datetime.datetime.fromtimestamp(int(git("show", "-s", "--format=%ct", "HEAD")), datetime.timezone.utc)
        require(settings.get("vcs.time") == source_time.strftime("%Y-%m-%dT%H:%M:%SZ"), "Wrong binary commit time")
        require(settings.get("GOOS") == "linux" and settings.get("GOARCH") == "arm64", "Wrong binary platform")
        version = source_tag.removeprefix("v")
        proof = {
            "version": version, "reported_version": reported,
            "basis": "official source tag and clean binary VCS; module reports " + reported,
            "repository": repository, "source_tag": tag, "source_tag_object": tag_object,
            "source_commit": commit, "binary_sha256": hashlib.sha256(Path(binary).read_bytes()).hexdigest(),
        }
        print(json.dumps(proof, sort_keys=True), file=sys.stderr)
        with open(os.environ["GITHUB_OUTPUT"], "a") as output:
            for key, value in proof.items():
                output.write(f"identity_{key}={value}\n")
        print(version)
        PY

    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'Kubewarden Audit Scanner'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=kubewarden-audit-scanner" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/opensource_packages/kubewarden-audit-scanner" >> "$GITHUB_OUTPUT"
          echo "current_version=v1.24.0" >> "$GITHUB_OUTPUT"
          echo "latest_version=v1.25.0" >> "$GITHUB_OUTPUT"
      - name: Install Kubewarden Audit Scanner
        id: install
        run: |
          set -euo pipefail
          VERSION="${{ steps.metadata.outputs.current_version }}"
          sudo apt-get update
          sudo apt-get install -y golang git python3
          AUDIT_BASELINE_DIR=$(mktemp -d "${RUNNER_TEMP}/audit-scanner.XXXXXX")
          echo "AUDIT_BASELINE_DIR=$AUDIT_BASELINE_DIR" >> "$GITHUB_ENV"
          export AUDIT_SOURCE_DIR="$AUDIT_BASELINE_DIR/source" AUDIT_TAG="$VERSION"
          unset AUDIT_BINARY
          git -c http.sslVerify=true clone --depth 1 --branch "${VERSION}" https://github.com/kubewarden/audit-scanner.git "$AUDIT_SOURCE_DIR"
          bash -euo pipefail -c "$AUDIT_SCANNER_IDENTITY_COMMAND"
          cd "$AUDIT_SOURCE_DIR"
          go build -buildvcs=true -mod=readonly -o "$AUDIT_BASELINE_DIR/audit-scanner" .
          install -m 0755 "$AUDIT_BASELINE_DIR/audit-scanner" /usr/local/bin/audit-scanner
          echo "binary_sha256=$(sha256sum /usr/local/bin/audit-scanner | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          if command -v audit-scanner >/dev/null 2>&1; then
            echo "install_status=success" >> "$GITHUB_OUTPUT"
          else
            echo "install_status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Get Kubewarden Audit Scanner version
        id: version
        run: |
          set -euo pipefail
          export AUDIT_SOURCE_DIR="$AUDIT_BASELINE_DIR/source" AUDIT_TAG="${{ steps.metadata.outputs.current_version }}"
          export AUDIT_BINARY=/usr/local/bin/audit-scanner
          VERSION=$(bash -euo pipefail -c "$AUDIT_SCANNER_IDENTITY_COMMAND")
          test "$(sha256sum "$AUDIT_BINARY" | cut -d' ' -f1)" = "${{ steps.install.outputs.binary_sha256 }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Test 1 - Check Binary Existence
        id: test1
        continue-on-error: true
        run: |
          START_TIME=$(date +%s)
          if command -v audit-scanner >/dev/null 2>&1; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 2 - Check Version Output
        id: test2
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local rc="$1"
            trap - EXIT
            if [ "$rc" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish "$?"' EXIT
          export AUDIT_SOURCE_DIR="$AUDIT_BASELINE_DIR/source" AUDIT_TAG="${{ steps.metadata.outputs.current_version }}"
          export AUDIT_BINARY=/usr/local/bin/audit-scanner
          ACTUAL_VERSION=$(bash -euo pipefail -c "$AUDIT_SCANNER_IDENTITY_COMMAND")
          test "$ACTUAL_VERSION" = "${AUDIT_TAG#v}"
          test "$ACTUAL_VERSION" = "${{ steps.version.outputs.version }}"
          test "$(sha256sum "$AUDIT_BINARY" | cut -d' ' -f1)" = "${{ steps.install.outputs.binary_sha256 }}"
          finish 0

      - name: Test 3 - Check Help Output
        id: test3
        continue-on-error: true
        run: |
          START_TIME=$(date +%s)
          if audit-scanner --help | grep -q 'Scans resources in your kubernetes cluster'; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 4 - Architecture Verification
        id: test4
        continue-on-error: true
        run: |
          START_TIME=$(date +%s)
          ARCH=$(uname -m)
          if [ "$ARCH" = "aarch64" ]; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 5 - CLI Help Smoke
        id: test5
        continue-on-error: true
        run: |
          START_TIME=$(date +%s)
          if audit-scanner scan --help | grep -q '^Usage:'; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 6 - Regression Validation
        id: test6
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          STATUS=failed
          NEXT_DIR=""
          finish() {
            local rc="$1"
            trap - EXIT
            if [ "$rc" -ne 0 ]; then STATUS=failed; fi
            echo "status=$STATUS" >> "$GITHUB_OUTPUT"
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            if [ -n "$NEXT_DIR" ]; then rm -rf -- "$NEXT_DIR"; fi
            exit "$rc"
          }
          trap 'finish "$?"' EXIT
          CURRENT="${{ steps.version.outputs.version || 'unknown' }}"
          LATEST_TAG="${{ steps.metadata.outputs.latest_version }}"
          LATEST="${LATEST_TAG#v}"
          echo "current_version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest_version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "=== Regression Validation (Next Version Install) ==="
          echo "Current version tested in Tests 1-5: $CURRENT"
          echo "Next version targeted for install validation: $LATEST"

          BASELINE_VALID=true
          for BASELINE_STATUS in "${{ steps.test1.outputs.status }}" "${{ steps.test2.outputs.status }}" "${{ steps.test3.outputs.status }}" "${{ steps.test4.outputs.status }}" "${{ steps.test5.outputs.status }}"; do
            if [ "$BASELINE_STATUS" != passed ]; then BASELINE_VALID=false; fi
          done
          for BASELINE_OUTCOME in "${{ steps.version.outcome }}" "${{ steps.test1.outcome }}" "${{ steps.test2.outcome }}" "${{ steps.test3.outcome }}" "${{ steps.test4.outcome }}" "${{ steps.test5.outcome }}"; do
            if [ "$BASELINE_OUTCOME" != success ]; then BASELINE_VALID=false; fi
          done
          if [ "$BASELINE_VALID" != true ]; then
            echo "decision=baseline_failed" >> "$GITHUB_OUTPUT"
            echo "regression_result=Candidate not attempted because baseline CLI smoke or identity checks failed" >> "$GITHUB_OUTPUT"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            STATUS=skipped
            finish 0
          fi
          test "v$CURRENT" = "${{ steps.metadata.outputs.current_version }}"

          if [ "$CURRENT" = "$LATEST" ]; then
            echo "next_installed_version=$CURRENT" >> "$GITHUB_OUTPUT"
            echo "decision=metadata_review_required" >> "$GITHUB_OUTPUT"
            echo "regression_result=Tests 1-5 baseline must be older than the latest stable release" >> "$GITHUB_OUTPUT"
            echo "comparison=Pinned baseline already matches the latest stable upstream release. Repin Tests 1-5 to an older dashboard-aligned baseline so Test 6 validates a newer Arm64 release." >> "$GITHUB_OUTPUT"
            echo "Next version installed on Arm64: $CURRENT"
            echo "Regression install result: Tests 1-5 baseline must be older than the latest stable release"
            echo "status=failed" >> "$GITHUB_OUTPUT"
          else
            sudo apt-get update
            sudo apt-get install -y golang git python3
            NEXT_DIR=$(mktemp -d "${RUNNER_TEMP}/audit-scanner-next.XXXXXX")
            export AUDIT_SOURCE_DIR="$NEXT_DIR/source" AUDIT_TAG="$LATEST_TAG"
            unset AUDIT_BINARY
            git -c http.sslVerify=true clone --depth 1 --branch "${LATEST_TAG}" https://github.com/kubewarden/audit-scanner.git "$AUDIT_SOURCE_DIR"
            bash -euo pipefail -c "$AUDIT_SCANNER_IDENTITY_COMMAND"
            cd "$AUDIT_SOURCE_DIR"
            go build -buildvcs=true -mod=readonly -o "$NEXT_DIR/audit-scanner" .
            export AUDIT_BINARY="$NEXT_DIR/audit-scanner"
            NEXT_INSTALLED_VERSION=$(bash -euo pipefail -c "$AUDIT_SCANNER_IDENTITY_COMMAND")
            if [ -n "$NEXT_INSTALLED_VERSION" ] && [ "$NEXT_INSTALLED_VERSION" = "$LATEST" ]; then
              echo "next_installed_version=$NEXT_INSTALLED_VERSION" >> "$GITHUB_OUTPUT"
              echo "decision=next_install_validated" >> "$GITHUB_OUTPUT"
              echo "regression_result=Next version installed successfully on Arm64" >> "$GITHUB_OUTPUT"
              echo "comparison=Baseline release $CURRENT passed CLI/help smoke only; its official source tag and clean binary VCS identify the release (module reports ${{ steps.version.outputs.identity_reported_version }}). Candidate $LATEST was rebuilt on Arm64 with verified source and binary VCS, and its module reported $NEXT_INSTALLED_VERSION. No Kubernetes cluster scan was performed." >> "$GITHUB_OUTPUT"
              echo "Next version installed on Arm64: $NEXT_INSTALLED_VERSION"
              echo "Regression install result: Next version installed successfully on Arm64"
              echo "status=passed" >> "$GITHUB_OUTPUT"
              STATUS=passed
            else
              echo "next_installed_version=${NEXT_INSTALLED_VERSION:-unknown}" >> "$GITHUB_OUTPUT"
              echo "decision=next_install_failed" >> "$GITHUB_OUTPUT"
              echo "regression_result=Next version install failed on Arm64" >> "$GITHUB_OUTPUT"
              echo "comparison=Current pinned Kubewarden Audit Scanner version $CURRENT passed smoke tests in this run, but the rebuilt candidate $LATEST did not report the expected version on Arm64." >> "$GITHUB_OUTPUT"
              echo "Regression install result: Next version install failed on Arm64"
              echo "status=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi
          test "$STATUS" = passed
          finish 0
      - name: Show regression validation details
        if: always()
        run: |
          echo "=== Regression Validation (Next Version Install) ==="
          echo "Current version tested in Tests 1-5: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || steps.metadata.outputs.current_version || 'unknown' }}"
          echo "Next version targeted for install validation: ${{ steps.test6.outputs.latest_version || steps.metadata.outputs.latest_version || 'unknown' }}"
          echo "Next version installed on Arm64: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}"
          echo "Regression install result: ${{ steps.test6.outputs.regression_result || 'Regression result unavailable.' }}"
          echo "Details: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}"

      - name: Calculate test summary
        if: always()
        id: summary
        run: |
          set -euo pipefail
          PASSED=0
          FAILED=0
          SKIPPED=0
          CORE_FAILED=0
          TOTAL_DURATION=0
          check_core_test() {
            local status="$1"
            local duration="$2"
            local outcome="$3"
            if [ "$status" = "passed" ] && [ "$outcome" = success ]; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
              CORE_FAILED=$((CORE_FAILED + 1))
            fi
            TOTAL_DURATION=$((TOTAL_DURATION + duration))
          }
          check_core_test "${{ steps.test1.outputs.status || 'failed' }}" "${{ steps.test1.outputs.duration || 0 }}" "${{ steps.test1.outcome }}"
          check_core_test "${{ steps.test2.outputs.status || 'failed' }}" "${{ steps.test2.outputs.duration || 0 }}" "${{ steps.test2.outcome }}"
          check_core_test "${{ steps.test3.outputs.status || 'failed' }}" "${{ steps.test3.outputs.duration || 0 }}" "${{ steps.test3.outcome }}"
          check_core_test "${{ steps.test4.outputs.status || 'failed' }}" "${{ steps.test4.outputs.duration || 0 }}" "${{ steps.test4.outcome }}"
          check_core_test "${{ steps.test5.outputs.status || 'failed' }}" "${{ steps.test5.outputs.duration || 0 }}" "${{ steps.test5.outcome }}"
          if [ "${{ steps.test6.outputs.status || 'failed' }}" = "passed" ] && [ "${{ steps.test6.outcome }}" = success ]; then
            PASSED=$((PASSED + 1))
          elif [ "${{ steps.test6.outputs.status }}" = skipped ] && [ "${{ steps.test6.outputs.decision }}" = baseline_failed ] && [ "$CORE_FAILED" -gt 0 ] && [ "${{ steps.test6.outcome }}" = success ]; then
            SKIPPED=$((SKIPPED + 1))
          else
            FAILED=$((FAILED + 1))
          fi
          TOTAL_DURATION=$((TOTAL_DURATION + ${{ steps.test6.outputs.duration || 0 }}))
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
          echo "core_failed=$CORE_FAILED" >> "$GITHUB_OUTPUT"
          echo "duration=$TOTAL_DURATION" >> "$GITHUB_OUTPUT"
          if [ "$FAILED" -eq 0 ]; then
            echo "overall_status=success" >> "$GITHUB_OUTPUT"
            echo "badge_status=passing" >> "$GITHUB_OUTPUT"
          else
            echo "overall_status=failure" >> "$GITHUB_OUTPUT"
            echo "badge_status=failing" >> "$GITHUB_OUTPUT"
          fi
          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

      - name: Create test summary
        if: always()
        run: |
          echo "## Kubewarden Audit Scanner Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Identity:** ${{ steps.version.outputs.identity_basis }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Source commit:** ${{ steps.version.outputs.identity_source_commit }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Binary SHA-256:** ${{ steps.version.outputs.identity_binary_sha256 }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Scope:** Native build and CLI/help smoke only; no Kubernetes cluster scan." >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status:** ${{ steps.summary.outputs.overall_status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tests Passed:** ${{ steps.summary.outputs.passed }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tests Failed:** ${{ steps.summary.outputs.failed }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Duration:** ${{ steps.summary.outputs.duration || 0 }}s" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Runner:** ubuntu-24.04 (arm64)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Test Details" >> "$GITHUB_STEP_SUMMARY"
          echo "1. Test 1 - Check Binary Existence: ${{ steps.test1.outputs.status || 'skipped' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "2. Test 2 - Check Version Output: ${{ steps.test2.outputs.status || 'skipped' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "3. Test 3 - Check Help Output: ${{ steps.test3.outputs.status || 'skipped' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "4. Test 4 - Architecture Verification: ${{ steps.test4.outputs.status || 'skipped' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "5. Test 5 - CLI Help Smoke: ${{ steps.test5.outputs.status || 'skipped' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "6. Test 6 - Regression Validation: ${{ steps.test6.outputs.status || 'skipped' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Regression Validation (Next Version Install)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Current version tested in Tests 1-5:** ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Next version targeted for install validation:** ${{ steps.test6.outputs.latest_version || 'unknown' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Next version installed on Arm64:** ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Regression install result:** ${{ steps.test6.outputs.regression_result || 'Regression result unavailable.' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Details:** ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Clean owned source and build directory
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${AUDIT_BASELINE_DIR:-}" ]; then
            rm -rf -- "$AUDIT_BASELINE_DIR"
          fi

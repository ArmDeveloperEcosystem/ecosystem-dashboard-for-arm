name: Test Gdspy on Arm64

permissions:
  contents: read

on:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-gdspy.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-gdspy.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-gdspy.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-gdspy.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-gdspy.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-gdspy.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-gdspy.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-gdspy.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-gdspy.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-gdspy.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-gdspy.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-gdspy.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-gdspy.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-gdspy.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-gdspy.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-gdspy.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-gdspy.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-gdspy.outputs.regression_next_installed_version }}
      regression_policy:
        description: Regression applicability policy classification
        value: ${{ jobs.test-gdspy.outputs.regression_policy }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-gdspy.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-gdspy.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-gdspy.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-gdspy.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-gdspy.outputs.timestamp }}

jobs:
  test-gdspy:
    runs-on: ubuntu-24.04-arm
    env:
      BASELINE_VERSION: "0.2.9"
      DIST_NAME: "gdspy"
      # These historical releases use the Python 2 C API (PyInt_FromLong).
      VALIDATION_SCOPE: "Historical compatibility evidence only; this does not demonstrate modern Python compatibility or endorse Python 2 for production."
      PINNED_CONTAINER_IMAGE_GDSPY: python@sha256:d8fac68ebdc45b8d66d53f1ed6c1532da81109a8f5532a6ca0c951ed31107d70 # original: python:2.7.18-buster
      BASELINE_CONTAINER: "gdspy-${{ github.run_id }}-${{ github.run_attempt }}-baseline"
      NEXT_CONTAINER: "gdspy-${{ github.run_id }}-${{ github.run_attempt }}-next"
      GDSPY_SMOKE: |
        import os
        import platform
        import gdspy
        import numpy
        import pkg_resources

        expected = os.environ["EXPECTED_VERSION"]
        assert pkg_resources.get_distribution("gdspy").version == expected
        assert gdspy.__version__ == expected
        left = gdspy.Rectangle(1, (0, 0), (2, 3))
        right = gdspy.Rectangle(1, (1, 0), (3, 3))
        assert left.area() == 6
        intersection = gdspy.boolean(1, [left, right], lambda a, b: a and b)
        assert intersection is not None
        assert intersection.area() == 3
        print("gdspy=%s numpy=%s python=%s machine=%s rectangle_area=6 intersection_area=3" % (
            gdspy.__version__, numpy.__version__, platform.python_version(), platform.machine()))

    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'Gdspy'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      regression_policy: "applicable"
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=gdspy" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/linux/opensource_packages/gdspy" >> "$GITHUB_OUTPUT"

      - name: Set up Python for release lookup
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # original: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install baseline package
        id: install
        run: |
          set -euo pipefail
          python3 -m venv .venv-lookup
          .venv-lookup/bin/python -m pip install packaging
          docker run -d --name "$BASELINE_CONTAINER" "$PINNED_CONTAINER_IMAGE_GDSPY" sleep infinity
          docker exec "$BASELINE_CONTAINER" python -m pip install "numpy==1.16.6" "$DIST_NAME==$BASELINE_VERSION"
          echo "install_status=success" >> "$GITHUB_OUTPUT"

      - name: Get package version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(docker exec "$BASELINE_CONTAINER" python -c 'import pkg_resources; print(pkg_resources.get_distribution("gdspy").version)')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION (legacy Python 2.7 runtime)"

      - name: Test 1 - Package installed
        id: test1
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          if docker exec "$BASELINE_CONTAINER" python -m pip show "$DIST_NAME"; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 2 - Version metadata matches baseline
        id: test2
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          VERSION=$(docker exec "$BASELINE_CONTAINER" python -c 'import pkg_resources; print(pkg_resources.get_distribution("gdspy").version)')
          if [ "$VERSION" = "$BASELINE_VERSION" ]; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 3 - Installed files metadata
        id: test3
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          if docker exec "$BASELINE_CONTAINER" python -c 'import pkg_resources; dist = pkg_resources.get_distribution("gdspy"); assert dist.has_metadata("RECORD"); assert dist.get_metadata("RECORD").strip()'; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 4 - Architecture Verification
        id: test4
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          if [ "$(uname -m)" = "aarch64" ] && [ "$(docker exec "$BASELINE_CONTAINER" uname -m)" = "aarch64" ]; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 5 - Functional Validation
        id: test5
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          if docker exec -e EXPECTED_VERSION="$BASELINE_VERSION" "$BASELINE_CONTAINER" python -c "$GDSPY_SMOKE"; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
            echo "note=Imported gdspy and checked rectangle and native boolean intersection areas in its legacy Python 2.7 Arm64 runtime. $VALIDATION_SCOPE" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 6 - Regression Validation
        id: test6
        env:
          CURRENT_VERSION: ${{ steps.version.outputs.version || env.BASELINE_VERSION }}
          BASELINE_STATUS: ${{ steps.test5.outputs.status || 'failed' }}
          BASELINE_OUTCOME: ${{ steps.test5.outcome }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          . .venv-lookup/bin/activate
          CURRENT="${CURRENT_VERSION}"
          if [ "$BASELINE_OUTCOME" != "success" ]; then
            BASELINE_STATUS=failed
          fi
          echo "current_version=$CURRENT" >> "$GITHUB_OUTPUT"
          LATEST=$(
            python -c "import textwrap; exec(textwrap.dedent('''
              import json, os, urllib.request
              from packaging.version import Version, InvalidVersion
              dist = os.environ['DIST_NAME']
              current = os.environ['CURRENT_VERSION']
              def is_stable(v: str) -> bool:
                  s = v.lower()
                  return not any(x in s for x in ['a','b','rc','dev','post'])
              try:
                  current_v = Version(current)
              except InvalidVersion:
                  print('lookup_failed')
                  raise SystemExit(0)
              try:
                  with urllib.request.urlopen(f'https://pypi.org/pypi/{dist}/json', timeout=30) as r:
                      data = json.load(r)
              except Exception:
                  print('lookup_failed')
                  raise SystemExit(0)
              versions = []
              for v in data.get('releases', {}).keys():
                  try:
                      vv = Version(v)
                  except InvalidVersion:
                      continue
                  if is_stable(v) and vv > current_v:
                      versions.append(vv)
              print(str(sorted(versions)[0]) if versions else '')
            '''))"
          )
          if [ "$LATEST" = "lookup_failed" ]; then
            echo "latest_version=lookup_failed" >> "$GITHUB_OUTPUT"
            echo "next_installed_version=lookup_failed" >> "$GITHUB_OUTPUT"
            echo "decision=next_lookup_failed" >> "$GITHUB_OUTPUT"
            echo "regression_result=Next version lookup failed" >> "$GITHUB_OUTPUT"
            echo "comparison=Baseline $CURRENT functional validation: $BASELINE_STATUS, but the next PyPI regression candidate could not be resolved automatically." >> "$GITHUB_OUTPUT"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            END_TIME=$(date +%s)
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ -z "$LATEST" ]; then
            echo "latest_version=$CURRENT" >> "$GITHUB_OUTPUT"
            echo "next_installed_version=$CURRENT" >> "$GITHUB_OUTPUT"
            echo "decision=no_newer_stable_available" >> "$GITHUB_OUTPUT"
            echo "regression_result=No newer stable release is available for Arm64 validation" >> "$GITHUB_OUTPUT"
            echo "comparison=Configured baseline version $CURRENT already matches the newest stable PyPI release available for this package." >> "$GITHUB_OUTPUT"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            END_TIME=$(date +%s)
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "latest_version=$LATEST" >> "$GITHUB_OUTPUT"
          if docker run -d --name "$NEXT_CONTAINER" "$PINNED_CONTAINER_IMAGE_GDSPY" sleep infinity &&
             docker exec "$NEXT_CONTAINER" python -m pip install "numpy==1.16.6" "$DIST_NAME==$LATEST"; then
            NEXT_VERSION=$(docker exec "$NEXT_CONTAINER" python -c 'import pkg_resources; print(pkg_resources.get_distribution("gdspy").version)')
            echo "next_installed_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
            if [ "$NEXT_VERSION" = "$LATEST" ] && docker exec -e EXPECTED_VERSION="$LATEST" "$NEXT_CONTAINER" python -c "$GDSPY_SMOKE"; then
              echo "decision=next_install_validated" >> "$GITHUB_OUTPUT"
              echo "regression_result=Next version installed and geometry validated on Arm64 with Python 2.7" >> "$GITHUB_OUTPUT"
              echo "comparison=Baseline $CURRENT functional validation: $BASELINE_STATUS, and the newer stable PyPI candidate $LATEST passed the same import and geometry checks in its legacy Python 2.7 Arm64 runtime. $VALIDATION_SCOPE" >> "$GITHUB_OUTPUT"
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "decision=next_install_failed" >> "$GITHUB_OUTPUT"
              echo "regression_result=Next version install failed on Arm64" >> "$GITHUB_OUTPUT"
              echo "comparison=Baseline $CURRENT functional validation: $BASELINE_STATUS, but the regression candidate $LATEST reported a different version or failed the legacy Python 2.7 import and geometry checks on Arm64." >> "$GITHUB_OUTPUT"
              echo "status=failed" >> "$GITHUB_OUTPUT"
              END_TIME=$(date +%s)
              echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          else
            echo "next_installed_version=install_failed" >> "$GITHUB_OUTPUT"
            echo "decision=next_install_failed" >> "$GITHUB_OUTPUT"
            echo "regression_result=Next version install failed on Arm64" >> "$GITHUB_OUTPUT"
            echo "comparison=Baseline $CURRENT functional validation: $BASELINE_STATUS, but the regression candidate $LATEST could not be installed on Arm64." >> "$GITHUB_OUTPUT"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            END_TIME=$(date +%s)
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Calculate test summary
        id: summary
        if: always()
        run: |
          set -euo pipefail
          PASSED=0
          FAILED=0
          SKIPPED=0
          CORE_FAILED=0
          DURATION=0
          check_core_test() {
            if [ "$1" = "passed" ] && [ "$3" = "success" ]; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
              CORE_FAILED=$((CORE_FAILED + 1))
            fi
            DURATION=$((DURATION + $2))
          }
          check_core_test "${{ steps.test1.outputs.status || 'failed' }}" "${{ steps.test1.outputs.duration || '0' }}" "${{ steps.test1.outcome }}"
          check_core_test "${{ steps.test2.outputs.status || 'failed' }}" "${{ steps.test2.outputs.duration || '0' }}" "${{ steps.test2.outcome }}"
          check_core_test "${{ steps.test3.outputs.status || 'failed' }}" "${{ steps.test3.outputs.duration || '0' }}" "${{ steps.test3.outcome }}"
          check_core_test "${{ steps.test4.outputs.status || 'failed' }}" "${{ steps.test4.outputs.duration || '0' }}" "${{ steps.test4.outcome }}"
          check_core_test "${{ steps.test5.outputs.status || 'failed' }}" "${{ steps.test5.outputs.duration || '0' }}" "${{ steps.test5.outcome }}"
          T6="${{ steps.test6.outputs.status || 'failed' }}"
          O6="${{ steps.test6.outcome }}"
          if [ "$T6" = "passed" ] && [ "$O6" = "success" ]; then
            PASSED=$((PASSED + 1))
          elif [ "$T6" = "skipped" ] && [ "$O6" = "success" ]; then
            SKIPPED=$((SKIPPED + 1))
          else
            FAILED=$((FAILED + 1))
          fi
          DURATION=$((DURATION + ${{ steps.test6.outputs.duration || '0' }}))
          if [ "$FAILED" -eq 0 ]; then
            OVERALL_STATUS="success"
          else
            OVERALL_STATUS="failure"
          fi
          if [ "$CORE_FAILED" -eq 0 ]; then
            BADGE_STATUS="passing"
          else
            BADGE_STATUS="failing"
          fi
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"
          echo "core_failed=$CORE_FAILED" >> "$GITHUB_OUTPUT"
          echo "overall_status=$OVERALL_STATUS" >> "$GITHUB_OUTPUT"
          echo "badge_status=$BADGE_STATUS" >> "$GITHUB_OUTPUT"
          [ "$OVERALL_STATUS" = "success" ]

      - name: Cleanup
        if: always()
        run: |
          for CONTAINER in "$BASELINE_CONTAINER" "$NEXT_CONTAINER"; do
            if docker container inspect "$CONTAINER" >/dev/null 2>&1; then
              docker rm -f "$CONTAINER"
            fi
          done
          rm -rf .venv-lookup

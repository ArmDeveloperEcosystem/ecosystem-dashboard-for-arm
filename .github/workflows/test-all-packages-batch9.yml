name: Test All Packages (Batch 9) on Arm64
run-name: Arm64 Batch 9 [${{ inputs.orchestration_id || format('manual-{0}-{1}', github.run_id, github.run_attempt) }}] [nonce:${{ inputs.dispatch_nonce || 'manual-only' }}]

on:
  workflow_dispatch:
    inputs:
      orchestration_id:
        description: Exact orchestrator identity; blank uses a safe manual fallback
        required: false
        default: ""
        type: string
      dispatch_nonce:
        description: Secret exact-dispatch nonce; blank is manual-only and not publishable
        required: false
        default: ""
        type: string
      expected_sha:
        description: Exact commit expected by the orchestrator
        required: false
        default: ""
        type: string
      expected_branch:
        description: Exact branch expected by the orchestrator
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      orchestration_id:
        required: true
        type: string
      dispatch_nonce:
        required: true
        type: string
      expected_sha:
        required: true
        type: string
      expected_branch:
        required: true
        type: string

permissions:
  contents: read

jobs:

  test-new-relic:
    uses: ./.github/workflows/test-new-relic.yml

  test-java-openjdk:
    uses: ./.github/workflows/test-java-openjdk.yml

  test-relic:
    uses: ./.github/workflows/test-relic.yml

  test-taskflow:
    uses: ./.github/workflows/test-taskflow.yml

  test-catj:
    uses: ./.github/workflows/test-catj.yml

  test-brpc:
    uses: ./.github/workflows/test-brpc.yml

  test-linstor-server:
    uses: ./.github/workflows/test-linstor-server.yml

  test-visualreview:
    uses: ./.github/workflows/test-visualreview.yml

  test-jax:
    uses: ./.github/workflows/test-JAX.yml

  test-disconf:
    uses: ./.github/workflows/test-disconf.yml

  test-ubuntucore:
    uses: ./.github/workflows/test-ubuntucore.yml

  test-opensuse-tumbleweed:
    uses: ./.github/workflows/test-opensuse-tumbleweed.yml

  test-flask:
    uses: ./.github/workflows/test-flask.yml

  test-glusterfs:
    uses: ./.github/workflows/test-glusterfs.yml

  test-kubewarden-audit-scanner:
    uses: ./.github/workflows/test-kubewarden-audit-scanner.yml

  test-hal:
    uses: ./.github/workflows/test-hal.yml

  test-unixbench:
    uses: ./.github/workflows/test-unixbench.yml

  test-elastic-agent:
    uses: ./.github/workflows/test-elastic-agent.yml

  test-libvirt:
    uses: ./.github/workflows/test-libvirt.yml

  test-magento:
    uses: ./.github/workflows/test-magento.yml

  test-domo-python-sdk:
    uses: ./.github/workflows/test-domo-python-sdk.yml

  test-gradle:
    uses: ./.github/workflows/test-gradle.yml

  test-lz4:
    uses: ./.github/workflows/test-lz4.yml

  test-cgal:
    uses: ./.github/workflows/test-cgal.yml

  test-kubevirt:
    uses: ./.github/workflows/test-kubevirt.yml

  test-qiniu-qshell:
    uses: ./.github/workflows/test-qiniu-qshell.yml

  test-kubewarden-kwctl:
    uses: ./.github/workflows/test-kubewarden-kwctl.yml

  test-xgboost:
    uses: ./.github/workflows/test-xgboost.yml

  test-htop:
    uses: ./.github/workflows/test-htop.yml

  test-opensearch-benchmark:
    uses: ./.github/workflows/test-opensearch-benchmark.yml

  test-re2:
    uses: ./.github/workflows/test-re2.yml

  test-golang:
    uses: ./.github/workflows/test-golang.yml

  test-lsyncd:
    uses: ./.github/workflows/test-lsyncd.yml

  test-drbd:
    uses: ./.github/workflows/test-drbd.yml

  test-barbican:
    uses: ./.github/workflows/test-barbican.yml

  test-ovirt:
    uses: ./.github/workflows/test-ovirt.yml

  test-signoz:
    uses: ./.github/workflows/test-signoz.yml

  test-cuda-q:
    uses: ./.github/workflows/test-cuda-q.yml

  test-cuda-qx:
    uses: ./.github/workflows/test-cuda-qx.yml

  test-cudf:
    uses: ./.github/workflows/test-cudf.yml

  test-cudnn-fe:
    uses: ./.github/workflows/test-cudnn-fe.yml

  test-cugraph:
    uses: ./.github/workflows/test-cugraph.yml

  test-cuml:
    uses: ./.github/workflows/test-cuml.yml

  test-cuopt:
    uses: ./.github/workflows/test-cuopt.yml

  test-cupy:
    uses: ./.github/workflows/test-cupy.yml

  summary:
    permissions:
      actions: read
      contents: read
    needs:
      [
        test-new-relic,
        test-java-openjdk,
        test-relic,
        test-taskflow,
        test-catj,
        test-brpc,
        test-linstor-server,
        test-visualreview,
        test-jax,
        test-disconf,
        test-ubuntucore,
        test-opensuse-tumbleweed,
        test-flask,
        test-glusterfs,
        test-kubewarden-audit-scanner,
        test-hal,
        test-unixbench,
        test-elastic-agent,
        test-libvirt,
        test-magento,
        test-domo-python-sdk,
        test-gradle,
        test-lz4,
        test-cgal,
        test-kubevirt,
        test-qiniu-qshell,
        test-kubewarden-kwctl,
        test-xgboost,
        test-htop,
        test-opensearch-benchmark,
        test-re2,
        test-golang,
        test-lsyncd,
        test-drbd,
        test-barbican,
        test-ovirt,
        test-signoz,
        test-cuda-q,
        test-cuda-qx,
        test-cudf,
        test-cudnn-fe,
        test-cugraph,
        test-cuml,
        test-cuopt,
        test-cupy
      ]
    runs-on: ubuntu-24.04-arm
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect batch results
        id: collect
        uses: ./.github/actions/collect-batch-results
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        with:
          batch_number: "9"
          batch_title: "Batch 9"

      - name: Attest complete batch results
        id: attest
        if: steps.collect.outcome == 'success'
        env:
          ARTIFACT_NAME: batch9-test-results
          BATCH_NUMBER: "9"
          COLLECTOR_JSON_COUNT: ${{ steps.collect.outputs.json_count }}
          CURRENT_BRANCH: ${{ github.ref_name }}
          DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
          EXPECTED_BRANCH: ${{ inputs.expected_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          NEEDS_JSON: ${{ toJson(needs) }}
          ORCHESTRATION_ID: ${{ inputs.orchestration_id }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/batch_artifact_attestation.py create \
            --results-root test-results \
            --workflow-file ".github/workflows/test-all-packages-batch9.yml" \
            --batch "$BATCH_NUMBER" \
            --repository "$REPOSITORY" \
            --expected-branch "$EXPECTED_BRANCH" \
            --current-branch "$CURRENT_BRANCH" \
            --expected-sha "$EXPECTED_SHA" \
            --workflow-sha "$WORKFLOW_SHA" \
            --orchestration-id "$ORCHESTRATION_ID" \
            --dispatch-nonce "$DISPATCH_NONCE" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --artifact-name "$ARTIFACT_NAME" \
            --collector-json-count "$COLLECTOR_JSON_COUNT" \
            --needs-environment-variable NEEDS_JSON

      - name: Upload batch test results
        if: steps.collect.outcome == 'success' && steps.attest.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: batch9-test-results
          path: test-results
          retention-days: 90

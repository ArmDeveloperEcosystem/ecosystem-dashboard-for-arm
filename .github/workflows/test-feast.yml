name: Test Feast on Arm64

permissions:
  contents: read

on:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-feast.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-feast.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-feast.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-feast.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-feast.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-feast.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-feast.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-feast.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-feast.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-feast.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-feast.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-feast.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-feast.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-feast.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-feast.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-feast.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-feast.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-feast.outputs.regression_next_installed_version }}
      regression_policy:
        description: Regression applicability policy classification
        value: ${{ jobs.test-feast.outputs.regression_policy }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-feast.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-feast.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-feast.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-feast.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-feast.outputs.timestamp }}

jobs:
  test-feast:
    runs-on: ubuntu-24.04-arm
    env:
      # The historical catalog supported-since value is distinct from this tested
      # runtime baseline. Exact PyPI 0.1.0 has no code; 0.10 introduced local
      # FeatureStore, and 0.10.4 relaxed old PyArrow/pandas/grpc pins for Arm wheels.
      # https://github.com/feast-dev/feast/releases/tag/v0.10.4
      BASELINE_VERSION: "0.10.4"
      CATALOG_SUPPORTED_SINCE: "0.1.0"
      BASELINE_SOURCE_COMMIT: "0c7f0e24fde7d142f9e9e9d491322c535341bbb6"
      PACKAGE_SLUG: "feast"
      LANE_KIND: "exact PyPI runtime / verified GitHub release"
      GITHUB_REPO: "feast-dev/feast"
      PACKAGE_PAGE: "content/linux/opensource_packages/feast.md"
      FEAST_TELEMETRY: "False"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      FEAST_INSTALL_COMMAND: |
        set -euo pipefail
        python -m venv "$FEAST_VENV"
        test -f "$FEAST_VENV/bin/activate"
        . "$FEAST_VENV/bin/activate"
        if [ "$SMOKE_VERSION" = "0.10.4" ]; then
          # Legacy metadata needs pip <24.1; old extension builds need Cython 0.29.
          timeout 120 python -m pip install pip==24.0 setuptools==57.5.0 wheel==0.37.1 Cython==0.29.37
          timeout 300 python -m pip install --no-build-isolation \
            "feast==$SMOKE_VERSION" numpy==1.23.5 pandas==1.5.3 protobuf==3.20.3 \
            pydantic==1.10.26 pyarrow==12.0.1 mmh3==3.1.0
        else
          timeout 300 python -m pip install --only-binary=:all: "feast==$SMOKE_VERSION"
        fi
        python -m pip check
        bash -euo pipefail -c "$FEAST_VERIFY_COMMAND"
      FEAST_VERIFY_COMMAND: |
        python - <<'PY'
        from importlib.metadata import version
        from pathlib import Path
        import os
        import sys
        import feast

        expected = os.environ["SMOKE_VERSION"]
        installed = version("feast")
        assert installed == expected, (installed, expected)
        assert feast.__version__ == expected, (feast.__version__, expected)
        module = Path(feast.__file__).resolve()
        assert module.is_relative_to(Path(sys.prefix).resolve()), module
        print(installed)
        PY
      FEAST_SMOKE_COMMAND: |
        set -euo pipefail
        bash -euo pipefail -c "$FEAST_VERIFY_COMMAND"
        python - <<'PY'
        from datetime import timedelta
        from importlib.metadata import version
        from pathlib import Path
        import contextlib
        import json
        import os
        import sqlite3
        import tempfile
        import pandas as pd
        from feast import Entity, FeatureStore, FeatureView, FileSource

        expected = os.environ["SMOKE_VERSION"]
        legacy = expected == "0.10.4"
        with tempfile.TemporaryDirectory(prefix="feast-runtime-") as directory:
            root = Path(directory)
            data = root / "driver.parquet"
            pd.DataFrame({
                "driver_id": [1, 1, 2],
                "event_timestamp": pd.to_datetime(
                    ["2024-01-01", "2024-01-04", "2024-01-02"], utc=True
                ),
                "rating": [4.5, 9.0, 4.8],
            }).to_parquet(data)
            (root / "feature_store.yaml").write_text(
                "project: smoke\n"
                f"registry: {root}/registry.db\n"
                "provider: local\n"
                "online_store:\n"
                "  type: sqlite\n"
                f"  path: {root}/online.db\n",
                encoding="utf-8",
            )
            if legacy:
                from feast import Feature, ValueType
                source = FileSource(path=str(data), event_timestamp_column="event_timestamp")
                driver = Entity(name="driver", join_key="driver_id", value_type=ValueType.INT64)
                ratings = FeatureView(
                    name="driver_ratings", entities=["driver"], ttl=timedelta(days=10),
                    features=[Feature(name="rating", dtype=ValueType.FLOAT)], input=source,
                )
                references = {"feature_refs": ["driver_ratings:rating"]}
                entity_rows = [{"driver": 1}]
            else:
                from feast import Field
                from feast.types import Float32, Int64
                source = FileSource(path=str(data), timestamp_field="event_timestamp")
                driver = Entity(name="driver", join_keys=["driver_id"], value_type=Int64.to_value_type())
                ratings = FeatureView(
                    name="driver_ratings", entities=[driver], ttl=timedelta(days=10),
                    schema=[Field(name="rating", dtype=Float32)], source=source,
                )
                references = {"features": ["driver_ratings:rating"], "full_feature_names": True}
                entity_rows = [{"driver_id": 1}]
            store = FeatureStore(repo_path=str(root))
            store.apply([driver, ratings])
            features = store.get_historical_features(
                entity_df=pd.DataFrame({
                    "driver_id": [1],
                    "event_timestamp": pd.to_datetime(["2024-01-03"], utc=True),
                }),
                **references,
            ).to_df()
            assert len(features) == 1, features
            assert int(features["driver_id"].iloc[0]) == 1, features
            assert float(features["driver_ratings__rating"].iloc[0]) == 4.5, features
            store.materialize(
                pd.Timestamp("2023-12-31", tz="UTC").to_pydatetime(),
                pd.Timestamp("2024-01-03", tz="UTC").to_pydatetime(),
            )
            online = store.get_online_features(entity_rows=entity_rows, **references).to_dict()
            assert online["driver_ratings__rating"] == [4.5], online
            database = root / "online.db"
            assert database.is_file(), database
            with contextlib.closing(sqlite3.connect(f"file:{database}?mode=ro", uri=True)) as connection:
                rows = connection.execute(
                    "SELECT COUNT(*) FROM smoke_driver_ratings WHERE feature_name = 'rating'"
                ).fetchone()[0]
            assert rows == 2, rows
            print(json.dumps({
                "installed_version": version("feast"),
                "historical_rating": float(features["driver_ratings__rating"].iloc[0]),
                "online_rating": online["driver_ratings__rating"][0],
                "sqlite_rows": rows,
            }, sort_keys=True))
        PY

    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'Feast'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'failed' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      regression_policy: "applicable"
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python for runtime smoke
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # original: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set test metadata
        id: metadata
        run: |
          {
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "package_slug=feast"
            echo "dashboard_link=/linux/opensource_packages/feast"
          } >> "$GITHUB_OUTPUT"

      - name: Bootstrap baseline dependencies
        uses: ./.github/actions/apt-bootstrap
        with:
          packages: "git ca-certificates build-essential python3-venv"
          quiet: "true"

      - name: Install exact baseline source and Python runtime
        id: install
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "install_status=failed" >> "$GITHUB_OUTPUT"
          git clone --depth 1 --single-branch --branch "v$BASELINE_VERSION" \
            "https://github.com/$GITHUB_REPO.git" baseline-src
          test "$(git -C baseline-src rev-parse HEAD)" = "$BASELINE_SOURCE_COMMIT"
          test "$(git -C baseline-src rev-parse "refs/tags/v$BASELINE_VERSION^{commit}")" = "$BASELINE_SOURCE_COMMIT"
          export FEAST_VENV="$PWD/feast-baseline-venv" SMOKE_VERSION="$BASELINE_VERSION"
          bash -euo pipefail -c "$FEAST_INSTALL_COMMAND"
          {
            echo "resolved_tag=v$BASELINE_VERSION"
            echo "source_commit=$BASELINE_SOURCE_COMMIT"
            echo "install_status=success"
          } >> "$GITHUB_OUTPUT"

      - name: Get installed baseline version
        id: version
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "version=unknown" >> "$GITHUB_OUTPUT"
          test -f feast-baseline-venv/bin/activate
          . feast-baseline-venv/bin/activate
          export SMOKE_VERSION="$BASELINE_VERSION"
          INSTALLED=$(bash -euo pipefail -c "$FEAST_VERIFY_COMMAND")
          echo "version=$INSTALLED" >> "$GITHUB_OUTPUT"

      - name: Test 1 - Installed Feast package
        id: test1
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"
          finish() {
            RC=$?
            if [ "$RC" -eq 0 ]; then STATUS=passed; else STATUS=failed; fi
            echo "status=$STATUS" >> "$GITHUB_OUTPUT"
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap finish EXIT
          test "${{ steps.install.outputs.install_status }}" = success
          test -x feast-baseline-venv/bin/feast
          test -f feast-baseline-venv/bin/activate
          . feast-baseline-venv/bin/activate
          export SMOKE_VERSION="$BASELINE_VERSION"
          bash -euo pipefail -c "$FEAST_VERIFY_COMMAND"

      - name: Test 2 - Installed version and exact release alignment
        id: test2
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"
          finish() {
            RC=$?
            if [ "$RC" -eq 0 ]; then STATUS=passed; else STATUS=failed; fi
            echo "status=$STATUS" >> "$GITHUB_OUTPUT"
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap finish EXIT
          test "${{ steps.install.outputs.resolved_tag }}" = "v$BASELINE_VERSION"
          test "$(git -C baseline-src rev-parse HEAD)" = "$BASELINE_SOURCE_COMMIT"
          test "$(git -C baseline-src rev-parse "refs/tags/v$BASELINE_VERSION^{commit}")" = "$BASELINE_SOURCE_COMMIT"
          test -f feast-baseline-venv/bin/activate
          . feast-baseline-venv/bin/activate
          export SMOKE_VERSION="$BASELINE_VERSION"
          bash -euo pipefail -c "$FEAST_VERIFY_COMMAND"
          REPORTED=$(feast version)
          test "$REPORTED" = "Feast SDK Version: \"feast $BASELINE_VERSION\""
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          page = Path(os.environ["PACKAGE_PAGE"]).read_text(encoding="utf-8")
          assert page.startswith("---\n"), "Missing package front matter"
          catalog = yaml.safe_load(page.split("---", 2)[1])
          supported_since = str(catalog["supported_minimum_version"]["version_number"])
          assert supported_since == os.environ["CATALOG_SUPPORTED_SINCE"], supported_since
          print(f"catalog_supported_since={supported_since}")
          print(f"smoke_tested_baseline={os.environ['SMOKE_VERSION']}")
          PY

      - name: Test 3 - Installed CLI help
        id: test3
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"
          finish() {
            RC=$?
            if [ "$RC" -eq 0 ]; then STATUS=passed; else STATUS=failed; fi
            echo "status=$STATUS" >> "$GITHUB_OUTPUT"
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap finish EXIT
          HELP=$(feast-baseline-venv/bin/feast --help)
          printf '%s\n' "$HELP"
          grep -Fq 'materialize' <<< "$HELP"
          grep -Fq 'apply' <<< "$HELP"

      - name: Test 4 - Native Arm64 Python runtime
        id: test4
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"
          finish() {
            RC=$?
            if [ "$RC" -eq 0 ]; then STATUS=passed; else STATUS=failed; fi
            echo "status=$STATUS" >> "$GITHUB_OUTPUT"
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap finish EXIT
          test "$(uname -m)" = aarch64
          feast-baseline-venv/bin/python - <<'PY'
          import platform
          import struct
          import sys
          from pathlib import Path
          import feast
          assert platform.machine() == "aarch64", platform.machine()
          assert struct.calcsize("P") == 8
          assert Path(feast.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          print(platform.machine(), sys.executable, feast.__file__)
          PY

      - name: Test 5 - Historical retrieval and SQLite online round trip
        id: test5
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"
          finish() {
            RC=$?
            if [ "$RC" -eq 0 ]; then STATUS=passed; else STATUS=failed; fi
            echo "status=$STATUS" >> "$GITHUB_OUTPUT"
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap finish EXIT
          test -f feast-baseline-venv/bin/activate
          . feast-baseline-venv/bin/activate
          export SMOKE_VERSION="$BASELINE_VERSION"
          timeout 120 bash -euo pipefail -c "$FEAST_SMOKE_COMMAND"
          echo "note=Installed Feast $BASELINE_VERSION: Parquet point-in-time retrieval and SQLite materialization/online retrieval passed on Arm64." >> "$GITHUB_OUTPUT"

      - name: Install and exercise the next Feast release
        id: candidate
        if: >-
          steps.test1.outputs.status == 'passed' && steps.test1.outcome == 'success' &&
          steps.test2.outputs.status == 'passed' && steps.test2.outcome == 'success' &&
          steps.test3.outputs.status == 'passed' && steps.test3.outcome == 'success' &&
          steps.test4.outputs.status == 'passed' && steps.test4.outcome == 'success' &&
          steps.test5.outputs.status == 'passed' && steps.test5.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/generic-source-regression-check
        with:
          baseline_version: ${{ steps.version.outputs.version || env.BASELINE_VERSION }}
          github_repo: ${{ env.GITHUB_REPO }}
          lane_kind: ${{ env.LANE_KIND }}
          defer_on_limited_cpu_probe_failure: "false"
          limited_cpu_probe: |
            set -euo pipefail
            test "$(uname -m)" = aarch64
            test "$CANDIDATE_TAG" = "v$LATEST_VERSION"
            SOURCE_COMMIT=$(git -C next-src rev-parse HEAD)
            TAG_COMMIT=$(git -C next-src rev-parse "refs/tags/$CANDIDATE_TAG^{commit}")
            test -n "$SOURCE_COMMIT"
            test "$SOURCE_COMMIT" = "$TAG_COMMIT"
            python - <<'PY'
            import os
            def stable(value):
                parts = value.split(".")
                assert len(parts) == 3 and all(part.isdigit() for part in parts), value
                return tuple(map(int, parts))
            assert stable(os.environ["LATEST_VERSION"]) > stable(os.environ["BASELINE_VERSION"])
            PY
            export FEAST_VENV="$PWD/feast-next-venv" SMOKE_VERSION="$LATEST_VERSION"
            bash -euo pipefail -c "$FEAST_INSTALL_COMMAND"
            test -f "$FEAST_VENV/bin/activate"
            . "$FEAST_VENV/bin/activate"
            timeout 120 bash -euo pipefail -c "$FEAST_SMOKE_COMMAND"
          limited_cpu_description: >-
            The installed candidate must match the selected release and complete Parquet point-in-time retrieval plus SQLite materialization and online retrieval on Arm64.

      - name: Test 6 - Regression Validation
        id: test6
        if: always()
        continue-on-error: true
        env:
          CORE_RESULTS: >-
            ${{ steps.test1.outputs.status }}:${{ steps.test1.outcome }}
            ${{ steps.test2.outputs.status }}:${{ steps.test2.outcome }}
            ${{ steps.test3.outputs.status }}:${{ steps.test3.outcome }}
            ${{ steps.test4.outputs.status }}:${{ steps.test4.outcome }}
            ${{ steps.test5.outputs.status }}:${{ steps.test5.outcome }}
          CANDIDATE_STATUS: ${{ steps.candidate.outputs.status }}
          CANDIDATE_OUTCOME: ${{ steps.candidate.outcome }}
          CANDIDATE_DECISION: ${{ steps.candidate.outputs.decision }}
          CANDIDATE_VERSION: ${{ steps.candidate.outputs.latest_version }}
          CANDIDATE_INSTALLED: ${{ steps.candidate.outputs.next_installed_version }}
          CANDIDATE_DURATION: ${{ steps.candidate.outputs.duration }}
          CANDIDATE_RESULT: ${{ steps.candidate.outputs.regression_result }}
          CANDIDATE_COMPARISON: ${{ steps.candidate.outputs.comparison }}
        run: |
          set -euo pipefail
          {
            echo "status=failed"
            echo "duration=0"
            echo "decision=next_regression_failed"
          } >> "$GITHUB_OUTPUT"
          DECISION_STATUS=$(python - <<'PY'
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path(os.environ["GITHUB_WORKSPACE"]) / ".github/scripts"))
          from package_result_policy import validate_six_test_result

          core = ["passed" if result == "passed:success" else "failed"
                  for result in os.environ["CORE_RESULTS"].split()]
          assert len(core) == 5, core
          status, decision = "failed", "next_regression_failed"
          latest = os.environ["CANDIDATE_VERSION"] or "unknown"
          installed = os.environ["CANDIDATE_INSTALLED"] or "not_installed"
          duration = os.environ["CANDIDATE_DURATION"]
          duration = int(duration) if duration.isdecimal() else 0
          result = "Candidate regression did not produce a coherent result"
          comparison = os.environ["CANDIDATE_COMPARISON"] or result
          observed = (os.environ["CANDIDATE_STATUS"], os.environ["CANDIDATE_OUTCOME"],
                      os.environ["CANDIDATE_DECISION"])
          if "failed" in core:
              status, decision = "skipped", "baseline_failed"
              latest, installed, duration = "not_checked", "not_installed", 0
              result = "Candidate not tested because baseline checks failed"
              comparison = "Tests 1-5 must pass before a next-release comparison is valid."
          elif observed == ("passed", "success", "limited_cpu_smoke_validated"):
              if (installed == latest and latest not in ("unknown", "not_installed", "")
                      and os.environ["CANDIDATE_DURATION"].isdecimal()):
                  status, decision = "passed", "limited_cpu_smoke_validated"
                  result = os.environ["CANDIDATE_RESULT"]
          elif observed[0:2] == ("failed", "success") and observed[2] in (
                  "limited_cpu_smoke_failed", "next_install_failed"):
              decision = observed[2]
              result = os.environ["CANDIDATE_RESULT"]
          elif observed == ("skipped", "success", "no_newer_stable_available"):
              status, decision = "skipped", "no_newer_stable_available"
              result = os.environ["CANDIDATE_RESULT"]
          elif observed[2] in ("runtime_validation_not_automated", "metadata_review_required"):
              decision = "next_lookup_failed"
              result = "Next stable Feast release could not be resolved for runtime validation"
          statuses = core + [status]
          details = [{"name": f"Test {index}", "status": value}
                     for index, value in enumerate(statuses, 1)]
          details[-1]["decision"] = decision
          validate_six_test_result(
              details=details, passed=statuses.count("passed"), failed=statuses.count("failed"),
              skipped=statuses.count("skipped"), core_failed=core.count("failed"), decision=decision,
          )
          outputs = dict(current_version=os.environ["BASELINE_VERSION"],
                         latest_version=latest, next_installed_version=installed, duration=duration,
                         regression_result=result, comparison=comparison)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in outputs.items():
                  print(f"{key}={str(value).replace(chr(10), ' ').replace(chr(13), ' ')}", file=output)
          print(f"{decision}:{status}")
          PY
          )
          case "$DECISION_STATUS" in
            limited_cpu_smoke_validated:passed)
              {
                echo "decision=limited_cpu_smoke_validated"
                echo "status=passed"
              } >> "$GITHUB_OUTPUT"
              ;;
            baseline_failed:skipped)
              {
                echo "decision=baseline_failed"
                echo "status=skipped"
              } >> "$GITHUB_OUTPUT"
              ;;
            no_newer_stable_available:skipped)
              {
                echo "decision=no_newer_stable_available"
                echo "status=skipped"
              } >> "$GITHUB_OUTPUT"
              ;;
            limited_cpu_smoke_failed:failed)
              {
                echo "decision=limited_cpu_smoke_failed"
                echo "status=failed"
              } >> "$GITHUB_OUTPUT"
              exit 1
              ;;
            next_install_failed:failed)
              {
                echo "decision=next_install_failed"
                echo "status=failed"
              } >> "$GITHUB_OUTPUT"
              exit 1
              ;;
            next_lookup_failed:failed)
              {
                echo "decision=next_lookup_failed"
                echo "status=failed"
              } >> "$GITHUB_OUTPUT"
              exit 1
              ;;
            next_regression_failed:failed)
              {
                echo "decision=next_regression_failed"
                echo "status=failed"
              } >> "$GITHUB_OUTPUT"
              exit 1
              ;;
            *)
              echo "Invalid Feast regression decision/status: $DECISION_STATUS" >&2
              exit 1
              ;;
          esac

      - name: Calculate test summary
        id: summary
        if: always()
        run: |
          set -euo pipefail
          T1="${{ steps.test1.outputs.status || 'failed' }}"
          T2="${{ steps.test2.outputs.status || 'failed' }}"
          T3="${{ steps.test3.outputs.status || 'failed' }}"
          T4="${{ steps.test4.outputs.status || 'failed' }}"
          T5="${{ steps.test5.outputs.status || 'failed' }}"
          T6="${{ steps.test6.outputs.status || 'failed' }}"
          O1="${{ steps.test1.outcome || 'failure' }}"
          O2="${{ steps.test2.outcome || 'failure' }}"
          O3="${{ steps.test3.outcome || 'failure' }}"
          O4="${{ steps.test4.outcome || 'failure' }}"
          O5="${{ steps.test5.outcome || 'failure' }}"
          O6="${{ steps.test6.outcome || 'failure' }}"
          DECISION="${{ steps.test6.outputs.decision || '' }}"
          D1="${{ steps.test1.outputs.duration || '0' }}"
          D2="${{ steps.test2.outputs.duration || '0' }}"
          D3="${{ steps.test3.outputs.duration || '0' }}"
          D4="${{ steps.test4.outputs.duration || '0' }}"
          D5="${{ steps.test5.outputs.duration || '0' }}"
          D6="${{ steps.test6.outputs.duration || '0' }}"
          PASSED=0
          FAILED=0
          SKIPPED=0
          CORE_FAILED=0
          for RESULT in "$T1:$O1" "$T2:$O2" "$T3:$O3" "$T4:$O4" "$T5:$O5"; do
            if [ "$RESULT" = "passed:success" ]; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
              CORE_FAILED=$((CORE_FAILED + 1))
            fi
          done
          if [ "$T6:$O6" = "passed:success" ]; then
            PASSED=$((PASSED + 1))
          elif [ "$T6:$O6" = "skipped:success" ] && [ "$DECISION" = "baseline_failed" ] && [ "$CORE_FAILED" -gt 0 ]; then
            SKIPPED=1
          elif [ "$T6:$O6" = "skipped:success" ] && [ "$DECISION" = "no_newer_stable_available" ]; then
            SKIPPED=1
          else
            FAILED=$((FAILED + 1))
          fi
          DURATION=$((D1 + D2 + D3 + D4 + D5 + D6))
          if [ "$FAILED" -eq 0 ]; then
            OVERALL_STATUS="success"
          else
            OVERALL_STATUS="failure"
          fi
          if [ "$CORE_FAILED" -eq 0 ]; then
            BADGE_STATUS="passing"
          else
            BADGE_STATUS="failing"
          fi
          {
            echo "passed=$PASSED"
            echo "failed=$FAILED"
            echo "skipped=$SKIPPED"
            echo "duration=$DURATION"
            echo "core_failed=$CORE_FAILED"
            echo "overall_status=$OVERALL_STATUS"
            echo "badge_status=$BADGE_STATUS"
          } >> "$GITHUB_OUTPUT"
          test "$FAILED" -eq 0

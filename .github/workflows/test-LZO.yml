name: Test LZO (Lempel-Ziv-Oberhumer) on Arm64

# This is a TEMPLATE - it has no triggers and will not run.
# When you copy this file, uncomment the appropriate triggers below:
permissions:
  contents: read

on:
  # workflow_dispatch:  # Uncomment for manual testing
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-lzo.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-lzo.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-lzo.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-lzo.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-lzo.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-lzo.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-lzo.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-lzo.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-lzo.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-lzo.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-lzo.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-lzo.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-lzo.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-lzo.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-lzo.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-lzo.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-lzo.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-lzo.outputs.regression_next_installed_version }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-lzo.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-lzo.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-lzo.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-lzo.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-lzo.outputs.timestamp }}
jobs:
  test-lzo:
    runs-on: ubuntu-24.04-arm
    
    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'LZO (Lempel-Ziv-Oberhumer)'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false
      
      - name: Set test metadata
        id: metadata
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=LZO" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/opensource_packages/LZO" >> "$GITHUB_OUTPUT"
      - name: Install LZO (Lempel-Ziv-Oberhumer)
        id: install
        run: |
          set -euo pipefail
          sudo apt-get update
          if sudo apt-get install -y lzop liblzo2-2; then
            echo "install_status=success" >> "$GITHUB_OUTPUT"
          else
            echo "install_status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
      
      # ============================================================
      # CUSTOMIZE THIS: Get the package version
      # ============================================================
      - name: Get LZO (Lempel-Ziv-Oberhumer) version
        id: version
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local rc="$1"
            trap - EXIT
            if [ "$rc" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish "$?"' EXIT
          export LC_ALL=C
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess

          def run(*args):
              result = subprocess.run(args, check=True, capture_output=True, text=True, timeout=15)
              if result.stderr:
                  raise SystemExit(f"Unexpected diagnostics: {result.stderr!r}")
              return result.stdout

          binary = shutil.which("lzop")
          if not binary:
              raise SystemExit("lzop is missing")
          versions = {}
          for name in ("lzop", "liblzo2-2"):
              row = run("dpkg-query", "-W", "-f=${Package}\t${Status}\t${Version}\t${Architecture}\t${source:Upstream-Version}\n", name)
              match = re.fullmatch(re.escape(name) + r"\tinstall ok installed\t([0-9][0-9A-Za-z.+:~\-]*)\tarm64\t([0-9]+\.[0-9]+)\n", row)
              if not match or match[1].split(":")[-1].rsplit("-", 1)[0] != match[2]:
                  raise SystemExit(f"Invalid Arm package identity: {row!r}")
              versions[name] = match[2]
          owned = {Path(p).resolve() for p in run("dpkg-query", "-L", "lzop").splitlines() if p.startswith("/")}
          if Path(binary).resolve() not in owned:
              raise SystemExit("The lzop executable is not owned by its package")
          banner = run(binary, "--version").splitlines()
          if len(banner) != 3 or banner[0] != f"lzop {versions['lzop']}" or banner[1] != f"LZO library {versions['liblzo2-2']}" or not banner[2].startswith("Copyright "):
              raise SystemExit(f"Wrapper/library identity mismatch: {banner!r}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={versions['liblzo2-2']}\nwrapper_version={versions['lzop']}\nbinary={binary}\n")
          print(f"Verified LZO library {versions['liblzo2-2']} through lzop {versions['lzop']} (arm64)")
          PY
          finish 0
      
      # ============================================================
      # ADD YOUR TESTS BELOW
      # Each test should:
      # 1. Have a unique id (test1, test2, etc.)
      # 2. Track start/end time for duration
      # 3. Set status=passed or status=failed
      # 4. Exit 1 on failure
      # ============================================================
      
      - name: Test 1 - Check lzo binary exists
        id: test1
        continue-on-error: true
        run: |
          START_TIME=$(date +%s)
          
          if command -v lzop &> /dev/null; then
            echo "✓ lzop binary found"
            echo "status=passed" >> $GITHUB_OUTPUT
          else
            echo "✗ lzo binary not found"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
            fi
          
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT
      
      - name: Test 2 - Check LZO library identity
        id: test2
        continue-on-error: true
        env:
          VERSION_STATUS: ${{ steps.version.outputs.status }}
          LZO_VERSION: ${{ steps.version.outputs.version }}
          WRAPPER_VERSION: ${{ steps.version.outputs.wrapper_version }}
          LZOP_BINARY: ${{ steps.version.outputs.binary }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local rc="$1"
            trap - EXIT
            if [ "$rc" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish "$?"' EXIT
          python3 - <<'PY'
          import os
          import re
          import subprocess
          if os.environ["VERSION_STATUS"] != "passed":
              raise SystemExit("LZO identity was not verified")
          version, wrapper = os.environ["LZO_VERSION"], os.environ["WRAPPER_VERSION"]
          if not all(re.fullmatch(r"[0-9]+\.[0-9]+", value) for value in (version, wrapper)):
              raise SystemExit("Missing or invalid LZO identity")
          result = subprocess.run([os.environ["LZOP_BINARY"], "--version"], check=True,
                                  capture_output=True, text=True, timeout=15)
          banner = result.stdout.splitlines()
          if result.stderr or len(banner) != 3 or banner[:2] != [f"lzop {wrapper}", f"LZO library {version}"] or not banner[2].startswith("Copyright "):
              raise SystemExit("The LZO library/wrapper version changed")
          PY
          finish 0
      
      - name: Test 3 - Check lzo help output
        id: test3
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          
          if lzop --help 2>&1 | grep -qi "usage\|help\|options"; then
            echo "✓ lzo help command works"
            echo "status=passed" >> $GITHUB_OUTPUT
          else
            echo "✗ lzo help command failed"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
            fi
          
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT
      
      # Add more tests as needed (test4, test5, etc.)
      # Examples:
      # - Run a simple command
      # - Check configuration files
      # - Start/stop a service
      # - Test basic functionality
      
      # ============================================================
      # UPDATE THIS: Calculate summary based on your number of tests
      # Add/remove test result checks to match your tests above
      # ============================================================
      
      - name: Test 4 - Architecture Verification
        id: test4
        continue-on-error: true
        run: |
          START_TIME=$(date +%s)
          
          echo "Checking system architecture..."
          ARCH=$(uname -m)
          if [ "$ARCH" = "aarch64" ]; then
            echo "✓ System architecture is ARM64 ($ARCH)"
            echo "status=passed" >> $GITHUB_OUTPUT
          else
            echo "✗ System architecture is NOT ARM64 ($ARCH)"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT

      - name: Test 5 - LZO compression round trips
        id: test5
        continue-on-error: true
        env:
          VERSION_STATUS: ${{ steps.version.outputs.status }}
          LZOP_BINARY: ${{ steps.version.outputs.binary }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local rc="$1"
            trap - EXIT
            if [ "$rc" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish "$?"' EXIT
          test "$VERSION_STATUS" = passed
          test "$(uname -m)" = aarch64
          python3 - <<'PY'
          import os
          import subprocess
          binary = os.environ["LZOP_BINARY"]
          for name, data in (("empty", b""), ("repeated", b"Arm LZO roundtrip\n" * 4096),
                             ("binary", bytes(range(256)) * 257)):
              compressed = subprocess.run([binary, "-c"], input=data, capture_output=True, check=True, timeout=15)
              restored = subprocess.run([binary, "-d", "-c"], input=compressed.stdout, capture_output=True, check=True, timeout=15)
              if compressed.stderr or restored.stderr or not compressed.stdout or restored.stdout != data:
                  raise SystemExit(f"LZO {name} roundtrip failed")
              print(f"LZO {name}: {len(data)} bytes roundtripped")
          PY
          finish 0

      - name: Regression applicability - package manager installed
        id: test6
        run: |
          set -euo pipefail
          CURRENT="${{ steps.version.outputs.version || 'unknown' }}"
          echo "current_version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest_version=not_applicable" >> "$GITHUB_OUTPUT"
          echo "next_installed_version=not_applicable" >> "$GITHUB_OUTPUT"
          echo "decision=not_applicable_package_manager" >> "$GITHUB_OUTPUT"
          echo "regression_result=Regression validation not applicable: tested package installed via package manager in Tests 1-5" >> "$GITHUB_OUTPUT"
          echo "comparison=The tested package is installed via a package manager in Tests 1-5, so version-to-version regression validation is not shown under the current policy." >> "$GITHUB_OUTPUT"
          echo "status=skipped" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"

      - name: Calculate test summary
        if: always()
        id: summary
        run: |
          PASSED=0
          FAILED=0
          SKIPPED=0
          TOTAL_DURATION=0

          # Check lzo binary exists
          if [ "${{ steps.test1.outputs.status }}" = "passed" ] && [ "${{ steps.test1.outcome }}" = "success" ]; then
            PASSED=$((PASSED + 1))
          else
            FAILED=$((FAILED + 1))
          fi
          TOTAL_DURATION=$((TOTAL_DURATION + ${{ steps.test1.outputs.duration || 0 }}))

          # Check lzo version command
          if [ "${{ steps.test2.outputs.status }}" = "passed" ] && [ "${{ steps.test2.outcome }}" = "success" ]; then
            PASSED=$((PASSED + 1))
          else
            FAILED=$((FAILED + 1))
          fi
          TOTAL_DURATION=$((TOTAL_DURATION + ${{ steps.test2.outputs.duration || 0 }}))

          # Check lzo help output
          if [ "${{ steps.test3.outputs.status }}" = "passed" ] && [ "${{ steps.test3.outcome }}" = "success" ]; then
            PASSED=$((PASSED + 1))
          else
            FAILED=$((FAILED + 1))
          fi
          TOTAL_DURATION=$((TOTAL_DURATION + ${{ steps.test3.outputs.duration || 0 }}))

          # Architecture Verification
          if [ "${{ steps.test4.outputs.status }}" = "passed" ] && [ "${{ steps.test4.outcome }}" = "success" ]; then
            PASSED=$((PASSED + 1))
          else
            FAILED=$((FAILED + 1))
          fi
          TOTAL_DURATION=$((TOTAL_DURATION + ${{ steps.test4.outputs.duration || 0 }}))

          # Functional Validation
          if [ "${{ steps.test5.outputs.status }}" = "passed" ] && [ "${{ steps.test5.outcome }}" = "success" ]; then
            PASSED=$((PASSED + 1))
          else
            FAILED=$((FAILED + 1))
          fi
          TOTAL_DURATION=$((TOTAL_DURATION + ${{ steps.test5.outputs.duration || 0 }}))

          CORE_FAILED=$FAILED
          if [ "${{ steps.test6.outputs.status }}" = "skipped" ] &&
             [ "${{ steps.test6.outcome }}" = "success" ] &&
             [ "${{ steps.test6.outputs.decision }}" = "not_applicable_package_manager" ]; then
            SKIPPED=1
          else
            FAILED=$((FAILED + 1))
          fi
          TOTAL_DURATION=$((TOTAL_DURATION + ${{ steps.test6.outputs.duration || 0 }}))
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "core_failed=$CORE_FAILED" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
          echo "duration=$TOTAL_DURATION" >> $GITHUB_OUTPUT

          if [ $FAILED -eq 0 ]; then
            echo "overall_status=success" >> $GITHUB_OUTPUT
            echo "badge_status=passing" >> $GITHUB_OUTPUT
          else
            echo "overall_status=failure" >> $GITHUB_OUTPUT
            echo "badge_status=failing" >> $GITHUB_OUTPUT
            exit 1
          fi
      - name: Create test summary
        if: always()
        run: |
          echo "## LZO (Lempel-Ziv-Oberhumer) Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ steps.summary.outputs.overall_status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests Passed:** ${{ steps.summary.outputs.passed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests Failed:** ${{ steps.summary.outputs.failed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests Skipped:** ${{ steps.summary.outputs.skipped }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Duration:** ${{ steps.summary.outputs.duration || 0 }}s" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner:** ubuntu-24.04 (arm64)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Details" >> $GITHUB_STEP_SUMMARY
          echo "1. Check lzo binary exists: ${{ steps.test1.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "2. Check LZO library identity: ${{ steps.test2.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "3. Check lzo help output: ${{ steps.test3.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY

          echo "4. Test 4 - Architecture Verification: ${{ steps.test4.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "5. Test 5 - LZO compression round trips: ${{ steps.test5.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY

name: Test MySQL on Arm64
permissions:
  contents: read

on:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-mysql.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-mysql.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-mysql.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-mysql.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-mysql.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-mysql.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-mysql.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-mysql.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-mysql.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-mysql.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-mysql.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-mysql.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-mysql.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-mysql.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-mysql.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-mysql.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-mysql.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-mysql.outputs.regression_next_installed_version }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-mysql.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-mysql.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-mysql.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-mysql.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-mysql.outputs.timestamp }}
jobs:
  test-mysql:
    runs-on: ubuntu-24.04-arm
    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'MySQL'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=mysql" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/opensource_packages/mysql" >> "$GITHUB_OUTPUT"
      - name: Install MySQL
        id: install
        run: |
          echo "Installing MySQL..."
          
          # Core packages provide the binaries without configuring a shared service.
          sudo apt-get update
          if sudo DEBIAN_FRONTEND=noninteractive apt-get install -y mysql-server-core-8.0 mysql-client-core-8.0; then
             echo "MySQL installed successfully"
             echo "install_status=success" >> $GITHUB_OUTPUT
          else
             echo "MySQL installation failed"
             echo "install_status=failed" >> $GITHUB_OUTPUT
             exit 1
          fi

      # ============================================================
      # CUSTOMIZE THIS: Get the package version
      # ============================================================
      - name: Get MySQL version
        id: version
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local rc="$1"
            trap - EXIT
            if [ "$rc" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish "$?"' EXIT
          export LC_ALL=C
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess

          def run(*args):
              result = subprocess.run(args, check=True, capture_output=True, text=True, timeout=20)
              if result.stderr:
                  raise SystemExit(f"Unexpected diagnostics: {result.stderr!r}")
              return result.stdout

          verified = []
          for name, package in (("mysql", "mysql-client-core-8.0"), ("mysqld", "mysql-server-core-8.0")):
              binary = shutil.which(name)
              if not binary:
                  raise SystemExit(f"Missing {name}")
              row = run("dpkg-query", "-W", "-f=${Package}\t${Status}\t${Version}\t${Architecture}\t${source:Upstream-Version}\n", package)
              installed = re.fullmatch(re.escape(package) + r"\tinstall ok installed\t([0-9][0-9A-Za-z.+:~\-]*)\tarm64\t([0-9]+\.[0-9]+\.[0-9]+)\n", row)
              if not installed or installed[1].split(":")[-1].rsplit("-", 1)[0] != installed[2]:
                  raise SystemExit(f"Invalid MySQL package identity: {row!r}")
              files = run("dpkg-query", "-L", package).splitlines()
              if Path(binary).resolve() not in {Path(p).resolve() for p in files if p.startswith("/")}:
                  raise SystemExit(f"{binary} is not owned by {package}")
              banner = run(binary, "--no-defaults", "--version")
              if not re.fullmatch(re.escape(binary) + r"  Ver " + re.escape(installed[1]) + r" for Linux on aarch64 \(\(Ubuntu\)\)\n", banner):
                  raise SystemExit(f"MySQL binary/package version mismatch: {banner!r}, {row!r}")
              verified.append((binary, installed[1], installed[2]))
          if verified[0][1:] != verified[1][1:]:
              raise SystemExit("MySQL client/server package versions differ")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={verified[0][2]}\npackage_version={verified[0][1]}\n")
              output.write(f"client={verified[0][0]}\nserver={verified[1][0]}\n")
          print(f"Verified MySQL {verified[0][2]}: {verified[0][1]} (arm64), client and server")
          PY
          finish 0

      # ============================================================
      # ADD YOUR TESTS BELOW
      # Each test should:
      # 1. Have a unique id (test1, test2, etc.)
      # 2. Track start/end time for duration
      # 3. Set status=passed or status=failed
      # 4. Exit 1 on failure
      # ============================================================

      - name: Test 1 - Check mysql client binary
        id: test1
        continue-on-error: true
        env:
          VERSION_STATUS: ${{ steps.version.outputs.status }}
          MYSQL_CLIENT: ${{ steps.version.outputs.client }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local rc="$1"
            trap - EXIT
            if [ "$rc" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish "$?"' EXIT
          test "$VERSION_STATUS" = passed
          test -x "$MYSQL_CLIENT"
          finish 0

      - name: Test 2 - Check mysqld binary
        id: test2
        continue-on-error: true
        env:
          VERSION_STATUS: ${{ steps.version.outputs.status }}
          MYSQL_SERVER: ${{ steps.version.outputs.server }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local rc="$1"
            trap - EXIT
            if [ "$rc" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish "$?"' EXIT
          test "$VERSION_STATUS" = passed
          test -x "$MYSQL_SERVER"
          finish 0

      - name: Test 3 - Check help command
        id: test3
        continue-on-error: true
        env:
          MYSQL_CLIENT: ${{ steps.version.outputs.client }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local rc="$1"
            trap - EXIT
            if [ "$rc" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish "$?"' EXIT
          HELP=$("$MYSQL_CLIENT" --no-defaults --help)
          [[ "$HELP" == *"Usage:"* ]]
          finish 0

      - name: Test 4 - Validate isolated server configuration
        id: test4
        continue-on-error: true
        env:
          MYSQL_SERVER: ${{ steps.version.outputs.server }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          SCOPE=""
          finish() {
            local rc="$1"
            trap - EXIT
            if [ -n "$SCOPE" ]; then
              rm -rf -- "$SCOPE" || rc=1
            fi
            if [ "$rc" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish "$?"' EXIT
          SCOPE=$(mktemp -d /tmp/mysql-config.XXXXXX)
          "$MYSQL_SERVER" --no-defaults --validate-config --user="$(id -un)" \
            --datadir="$SCOPE" --socket="$SCOPE/mysql.sock" --pid-file="$SCOPE/mysql.pid" \
            --tmpdir="$SCOPE" --skip-networking --mysqlx=0 --secure-file-priv="$SCOPE"
          finish 0

      - name: Test 5 - Isolated functional SQL check
        id: test5
        continue-on-error: true
        timeout-minutes: 4
        env:
          VERSION_STATUS: ${{ steps.version.outputs.status }}
          MYSQL_VERSION: ${{ steps.version.outputs.package_version }}
          MYSQL_CLIENT: ${{ steps.version.outputs.client }}
          MYSQL_SERVER: ${{ steps.version.outputs.server }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local rc="$1"
            trap - EXIT
            if [ "$rc" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish "$?"' EXIT
          test "$VERSION_STATUS" = passed
          test "$(uname -m)" = aarch64
          export LC_ALL=C
          python3 - <<'PY'
          import os
          from pathlib import Path
          import pwd
          import re
          import signal
          import subprocess
          import tempfile
          import time

          def interrupted(signum, _frame):
              raise SystemExit(128 + signum)

          signal.signal(signal.SIGTERM, interrupted)
          signal.signal(signal.SIGINT, interrupted)
          version = os.environ["MYSQL_VERSION"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.+~]+", version):
              raise SystemExit("MySQL package version was not verified")
          with tempfile.TemporaryDirectory(prefix="mysql-smoke-", dir="/tmp") as directory:
              scope = Path(directory)
              socket = scope / "mysql.sock"
              # Ignore shared option/login files and inherited credentials.
              env = {key: value for key, value in os.environ.items() if not key.startswith("MYSQL_")}
              env.update(HOME=directory, MYSQL_TEST_LOGIN_FILE=str(scope / "unused-login"))
              server = [os.environ["MYSQL_SERVER"], "--no-defaults",
                        "--user=" + pwd.getpwuid(os.getuid()).pw_name,
                        "--datadir=" + str(scope / "data")]
              client = [os.environ["MYSQL_CLIENT"], "--no-defaults", "--protocol=SOCKET",
                        "--socket=" + str(socket), "--user=root",
                        "--connect-timeout=5", "--batch", "--skip-column-names", "--raw"]

              def query(sql, expected):
                  result = subprocess.run(client + ["--execute=" + sql], env=env,
                                          capture_output=True, text=True, timeout=15)
                  if result.returncode or result.stderr or result.stdout != expected:
                      raise RuntimeError(f"SQL failed: rc={result.returncode}, stdout={result.stdout!r}, stderr={result.stderr!r}")
                  print(f"SQL verified: {sql!r} -> {result.stdout!r}")

              with (scope / "server.log").open("w+") as log:
                  process = None
                  try:
                      subprocess.run(server + ["--initialize-insecure"], env=env, stdout=log,
                                     stderr=subprocess.STDOUT, check=True, timeout=60)
                      process = subprocess.Popen(server + ["--socket=" + str(socket),
                          "--pid-file=" + str(scope / "mysql.pid"), "--tmpdir=" + directory,
                          "--skip-networking", "--mysqlx=0", "--secure-file-priv=" + directory,
                          "--innodb-buffer-pool-size=64M"], env=env, stdout=log, stderr=subprocess.STDOUT)
                      deadline = time.monotonic() + 30
                      while not socket.is_socket():
                          if process.poll() is not None or time.monotonic() >= deadline:
                              raise RuntimeError("Isolated MySQL server did not become ready")
                          time.sleep(0.2)
                      query("SELECT 1;", "1\n")
                      query("SELECT VERSION(), @@version_compile_machine, @@socket, @@datadir, @@skip_networking;",
                            f"{version}\taarch64\t{socket}\t{scope}/data/\t1\n")
                      query("CREATE DATABASE arm_smoke; "
                            "CREATE TABLE arm_smoke.probe (id INT PRIMARY KEY, value INT NOT NULL); "
                            "INSERT INTO arm_smoke.probe VALUES (1, 40); START TRANSACTION; "
                            "UPDATE arm_smoke.probe SET value = value + 2 WHERE id = 1; COMMIT; "
                            "SELECT value FROM arm_smoke.probe WHERE id = 1; DROP DATABASE arm_smoke;", "42\n")
                  finally:
                      try:
                          if process is not None:
                              if process.poll() is not None:
                                  raise RuntimeError("Isolated MySQL server exited unexpectedly")
                              process.terminate()
                              try:
                                  rc = process.wait(timeout=20)
                              except subprocess.TimeoutExpired:
                                  process.kill()
                                  process.wait(timeout=5)
                                  raise RuntimeError("Isolated MySQL server required forced cleanup")
                              if rc != 0:
                                  raise RuntimeError(f"Isolated MySQL shutdown failed: {rc}")
                      finally:
                          log.seek(0)
                          print(log.read())
              print(f"Isolated MySQL stopped; removing {scope}")
          PY
          finish 0

      - name: Regression applicability - package manager installed
        id: test6
        run: |
          set -euo pipefail
          CURRENT="${{ steps.version.outputs.version || 'unknown' }}"
          echo "current_version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest_version=not_applicable" >> "$GITHUB_OUTPUT"
          echo "next_installed_version=not_applicable" >> "$GITHUB_OUTPUT"
          echo "decision=not_applicable_package_manager" >> "$GITHUB_OUTPUT"
          echo "regression_result=Regression validation not applicable: tested package installed via package manager in Tests 1-5" >> "$GITHUB_OUTPUT"
          echo "comparison=The tested package is installed via a package manager in Tests 1-5, so version-to-version regression validation is not shown under the current policy." >> "$GITHUB_OUTPUT"
          echo "status=skipped" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"

      - name: Calculate test summary
        if: always()
        id: summary
        run: |
          PASSED=0
          FAILED=0
          SKIPPED=0
          TOTAL_DURATION=0

          # Check mysql client binary
          if [ "${{ steps.test1.outcome }}" = "success" ] && [ "${{ steps.test1.outputs.status }}" = "passed" ]; then
            PASSED=$((PASSED + 1))
          else
            FAILED=$((FAILED + 1))
          fi
          TOTAL_DURATION=$((TOTAL_DURATION + ${{ steps.test1.outputs.duration || 0 }}))

          # Check mysqld binary
          if [ "${{ steps.test2.outcome }}" = "success" ] && [ "${{ steps.test2.outputs.status }}" = "passed" ]; then
            PASSED=$((PASSED + 1))
          else
            FAILED=$((FAILED + 1))
          fi
          TOTAL_DURATION=$((TOTAL_DURATION + ${{ steps.test2.outputs.duration || 0 }}))

          # Check help command
          if [ "${{ steps.test3.outcome }}" = "success" ] && [ "${{ steps.test3.outputs.status }}" = "passed" ]; then
            PASSED=$((PASSED + 1))
          else
            FAILED=$((FAILED + 1))
          fi
          TOTAL_DURATION=$((TOTAL_DURATION + ${{ steps.test3.outputs.duration || 0 }}))

          # Validate isolated server configuration
          if [ "${{ steps.test4.outcome }}" = "success" ] && [ "${{ steps.test4.outputs.status }}" = "passed" ]; then
            PASSED=$((PASSED + 1))
          else
            FAILED=$((FAILED + 1))
          fi
          TOTAL_DURATION=$((TOTAL_DURATION + ${{ steps.test4.outputs.duration || 0 }}))

          # Isolated functional SQL check
          if [ "${{ steps.test5.outcome }}" = "success" ] && [ "${{ steps.test5.outputs.status }}" = "passed" ]; then
            PASSED=$((PASSED + 1))
          else
            FAILED=$((FAILED + 1))
          fi
          TOTAL_DURATION=$((TOTAL_DURATION + ${{ steps.test5.outputs.duration || 0 }}))

          CORE_FAILED=$FAILED
          if [ "${{ steps.test6.outcome }}" = "success" ] && \
             [ "${{ steps.test6.outputs.status }}" = "skipped" ] && \
             [ "${{ steps.test6.outputs.decision }}" = "not_applicable_package_manager" ]; then
            SKIPPED=$((SKIPPED + 1))
          else
            FAILED=$((FAILED + 1))
          fi
          TOTAL_DURATION=$((TOTAL_DURATION + ${{ steps.test6.outputs.duration || 0 }}))

          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "core_failed=$CORE_FAILED" >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT
          echo "duration=$TOTAL_DURATION" >> $GITHUB_OUTPUT

          if [ $FAILED -eq 0 ]; then
            echo "overall_status=success" >> $GITHUB_OUTPUT
            echo "badge_status=passing" >> $GITHUB_OUTPUT
          else
            echo "overall_status=failure" >> $GITHUB_OUTPUT
            echo "badge_status=failing" >> $GITHUB_OUTPUT
            exit 1
          fi
      - name: Create test summary
        if: always()
        run: |
          echo "## MySQL Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ steps.summary.outputs.overall_status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests Passed:** ${{ steps.summary.outputs.passed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests Failed:** ${{ steps.summary.outputs.failed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests Skipped:** ${{ steps.summary.outputs.skipped }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Duration:** ${{ steps.summary.outputs.duration || 0 }}s" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner:** ubuntu-24.04 (arm64)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Details" >> $GITHUB_STEP_SUMMARY
          echo "1. Test 1 - Check mysql client binary: ${{ steps.test1.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "2. Test 2 - Check mysqld binary: ${{ steps.test2.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "3. Test 3 - Check help command: ${{ steps.test3.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "4. Test 4 - Validate isolated server configuration: ${{ steps.test4.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "5. Test 5 - Isolated functional SQL check: ${{ steps.test5.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "6. Package-manager regression applicability: ${{ steps.test6.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY

name: Test All Packages (Batch 21) on Arm64
run-name: Arm64 Batch 21 [${{ inputs.orchestration_id || format('manual-{0}-{1}', github.run_id, github.run_attempt) }}] [nonce:${{ inputs.dispatch_nonce || 'manual-only' }}]

on:
  workflow_dispatch:
    inputs:
      orchestration_id:
        description: Exact orchestrator identity; blank uses a safe manual fallback
        required: false
        default: ""
        type: string
      dispatch_nonce:
        description: Secret exact-dispatch nonce; blank is manual-only and not publishable
        required: false
        default: ""
        type: string
      expected_sha:
        description: Exact commit expected by the orchestrator
        required: false
        default: ""
        type: string
      expected_branch:
        description: Exact branch expected by the orchestrator
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      orchestration_id:
        required: true
        type: string
      dispatch_nonce:
        required: true
        type: string
      expected_sha:
        required: true
        type: string
      expected_branch:
        required: true
        type: string

permissions:
  contents: read

jobs:

  test-shap:
    uses: ./.github/workflows/test-shap.yml

  test-slang:
    uses: ./.github/workflows/test-slang.yml

  test-sparks-rapids:
    uses: ./.github/workflows/test-sparks-rapids.yml

  test-spice-opus:
    uses: ./.github/workflows/test-spice-opus.yml

  test-stable-baseline3:
    uses: ./.github/workflows/test-stable-baseline3.yml

  test-statsforecast:
    uses: ./.github/workflows/test-statsforecast.yml

  test-statsmodels:
    uses: ./.github/workflows/test-statsmodels.yml

  test-sunshine:
    uses: ./.github/workflows/test-sunshine.yml

  test-tabPFN:
    uses: ./.github/workflows/test-tabPFN.yml

  test-tabpfn-time-series:
    uses: ./.github/workflows/test-tabpfn-time-series.yml

  test-tensorrt-llm:
    uses: ./.github/workflows/test-tensorrt-llm.yml

  test-tensorrt:
    uses: ./.github/workflows/test-tensorrt.yml

  test-tilelang:
    uses: ./.github/workflows/test-tilelang.yml

  test-triton:
    uses: ./.github/workflows/test-triton.yml

  test-turbovnc:
    uses: ./.github/workflows/test-turbovnc.yml

  test-ubuntudesktop:
    uses: ./.github/workflows/test-ubuntudesktop.yml

  test-ucx:
    uses: ./.github/workflows/test-ucx.yml

  test-vcpkg:
    uses: ./.github/workflows/test-vcpkg.yml

  test-velox:
    uses: ./.github/workflows/test-velox.yml

  test-verible:
    uses: ./.github/workflows/test-verible.yml

  test-verilator:
    uses: ./.github/workflows/test-verilator.yml

  test-veriloggen:
    uses: ./.github/workflows/test-veriloggen.yml

  test-videomass:
    uses: ./.github/workflows/test-videomass.yml

  test-vidgear:
    uses: ./.github/workflows/test-vidgear.yml

  test-warp:
    uses: ./.github/workflows/test-warp.yml

  test-wsl:
    uses: ./.github/workflows/test-wsl.yml

  test-xpra:
    uses: ./.github/workflows/test-xpra.yml

  test-xschem:
    uses: ./.github/workflows/test-xschem.yml

  test-yosys:
    uses: ./.github/workflows/test-yosys.yml

  test-buildah:
    uses: ./.github/workflows/test-buildah.yml

  test-fastai:
    uses: ./.github/workflows/test-fastai.yml

  test-greenhouse:
    uses: ./.github/workflows/test-greenhouse.yml

  test-ironcore:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/test-ironcore.yml

  test-kafka-connect:
    uses: ./.github/workflows/test-kafka-connect.yml

  test-kafka-mirrormaker:
    uses: ./.github/workflows/test-kafka-mirrormaker.yml

  test-luigi:
    uses: ./.github/workflows/test-luigi.yml

  test-openmcp-control-plane-operator:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/test-openmcp-control-plane-operator.yml

  test-openmfp-portal:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/test-openmfp-portal.yml

  test-platform-mesh-operator:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/test-platform-mesh-operator.yml

  test-podman:
    uses: ./.github/workflows/test-podman.yml

  test-podman-compose:
    uses: ./.github/workflows/test-podman-compose.yml

  test-skopeo:
    uses: ./.github/workflows/test-skopeo.yml

  summary:
    permissions:
      actions: read
      contents: read
    needs:
      [
        test-shap,
        test-slang,
        test-sparks-rapids,
        test-spice-opus,
        test-stable-baseline3,
        test-statsforecast,
        test-statsmodels,
        test-sunshine,
        test-tabPFN,
        test-tabpfn-time-series,
        test-tensorrt-llm,
        test-tensorrt,
        test-tilelang,
        test-triton,
        test-turbovnc,
        test-ubuntudesktop,
        test-ucx,
        test-vcpkg,
        test-velox,
        test-verible,
        test-verilator,
        test-veriloggen,
        test-videomass,
        test-vidgear,
        test-warp,
        test-wsl,
        test-xpra,
        test-xschem,
        test-yosys,
        test-buildah,
        test-fastai,
        test-greenhouse,
        test-ironcore,
        test-kafka-connect,
        test-kafka-mirrormaker,
        test-luigi,
        test-openmcp-control-plane-operator,
        test-openmfp-portal,
        test-platform-mesh-operator,
        test-podman,
        test-podman-compose,
        test-skopeo
      ]
    runs-on: ubuntu-24.04-arm
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect batch results
        id: collect
        uses: ./.github/actions/collect-batch-results
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        with:
          batch_number: "21"
          batch_title: "Batch 21"

      - name: Attest complete batch results
        id: attest
        if: steps.collect.outcome == 'success'
        env:
          ARTIFACT_NAME: batch21-test-results
          BATCH_NUMBER: "21"
          COLLECTOR_JSON_COUNT: ${{ steps.collect.outputs.json_count }}
          CURRENT_BRANCH: ${{ github.ref_name }}
          DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
          EXPECTED_BRANCH: ${{ inputs.expected_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          NEEDS_JSON: ${{ toJson(needs) }}
          ORCHESTRATION_ID: ${{ inputs.orchestration_id }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/batch_artifact_attestation.py create \
            --results-root test-results \
            --workflow-file ".github/workflows/test-all-packages-batch21.yml" \
            --batch "$BATCH_NUMBER" \
            --repository "$REPOSITORY" \
            --expected-branch "$EXPECTED_BRANCH" \
            --current-branch "$CURRENT_BRANCH" \
            --expected-sha "$EXPECTED_SHA" \
            --workflow-sha "$WORKFLOW_SHA" \
            --orchestration-id "$ORCHESTRATION_ID" \
            --dispatch-nonce "$DISPATCH_NONCE" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --artifact-name "$ARTIFACT_NAME" \
            --collector-json-count "$COLLECTOR_JSON_COUNT" \
            --needs-environment-variable NEEDS_JSON

      - name: Upload batch test results
        if: steps.collect.outcome == 'success' && steps.attest.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: batch21-test-results
          path: test-results
          retention-days: 90

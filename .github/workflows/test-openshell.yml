# Historical public Arm-support minimum is 0.0.6; this tests the 0.1.6 baseline.
# Only the immutable baseline is tested; Test 6 explicitly defers upgrade validation.
name: Test NVIDIA OpenShell Arm64 sandbox enforcement

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      contract_version:
        description: contract version
        value: ${{ jobs.test-openshell.outputs.contract_version }}
      package_slug:
        description: package slug
        value: ${{ jobs.test-openshell.outputs.package_slug }}
      package_name:
        description: package name
        value: ${{ jobs.test-openshell.outputs.package_name }}
      package_version:
        description: package version
        value: ${{ jobs.test-openshell.outputs.package_version }}
      run_status:
        description: run status
        value: ${{ jobs.test-openshell.outputs.run_status }}
      badge_status:
        description: badge status
        value: ${{ jobs.test-openshell.outputs.badge_status }}
      core_failed:
        description: core failed
        value: ${{ jobs.test-openshell.outputs.core_failed }}
      tests_passed:
        description: tests passed
        value: ${{ jobs.test-openshell.outputs.tests_passed }}
      tests_failed:
        description: tests failed
        value: ${{ jobs.test-openshell.outputs.tests_failed }}
      tests_skipped:
        description: tests skipped
        value: ${{ jobs.test-openshell.outputs.tests_skipped }}
      duration_seconds:
        description: duration seconds
        value: ${{ jobs.test-openshell.outputs.duration_seconds }}
      regression_status:
        description: regression status
        value: ${{ jobs.test-openshell.outputs.regression_status }}
      regression_decision:
        description: regression decision
        value: ${{ jobs.test-openshell.outputs.regression_decision }}
      regression_result:
        description: regression result
        value: ${{ jobs.test-openshell.outputs.regression_result }}
      regression_comparison:
        description: regression comparison
        value: ${{ jobs.test-openshell.outputs.regression_comparison }}
      regression_current_version:
        description: regression current version
        value: ${{ jobs.test-openshell.outputs.regression_current_version }}
      regression_latest_version:
        description: regression latest version
        value: ${{ jobs.test-openshell.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: regression next installed version
        value: ${{ jobs.test-openshell.outputs.regression_next_installed_version }}
      regression_applicability:
        description: regression applicability
        value: ${{ jobs.test-openshell.outputs.regression_applicability }}
      run_id:
        description: run id
        value: ${{ jobs.test-openshell.outputs.run_id }}
      run_attempt:
        description: run attempt
        value: ${{ jobs.test-openshell.outputs.run_attempt }}
      job_name:
        description: job name
        value: ${{ jobs.test-openshell.outputs.job_name }}
      dashboard_link:
        description: dashboard link
        value: ${{ jobs.test-openshell.outputs.dashboard_link }}
      timestamp:
        description: timestamp
        value: ${{ jobs.test-openshell.outputs.timestamp }}

jobs:
  test-openshell:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      LC_ALL: C
      OPENSHELL_SANDBOX_IMAGE: ghcr.io/nvidia/openshell/sandbox@sha256:1038eb5c1f191fa3c34684fd7041b891c78ec570979d487f36e06e08f91bfb63
      OPENSHELL_SUPERVISOR_IMAGE: ghcr.io/nvidia/openshell/supervisor@sha256:ce859a7d77ee515d3fe0b3c7dc61286516f402eb1d25c761d806d9ae5ed96c0b
      OPENSHELL_WORKLOAD_IMAGE: nvcr.io/nvidia/base/ubuntu@sha256:d9461f428eea54e553add3a5158a0f245c6e1ea73efc59fff8e98e3d4a38e378
    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: "NVIDIA OpenShell"
      package_version: ${{ steps.version.outputs.version }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '5' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '5' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status }}
      regression_decision: ${{ steps.test6.outputs.decision || 'baseline_failed' }}
      regression_result: ${{ steps.test6.outputs.regression_result }}
      regression_comparison: ${{ steps.test6.outputs.comparison }}
      regression_current_version: ${{ steps.test6.outputs.current_version }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version }}
      regression_applicability: ${{ steps.test6.outputs.applicability }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set package metadata
        id: metadata
        run: |
          set -euo pipefail
          {
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "package_slug=openshell"
            echo "dashboard_link=/opensource_packages/openshell"
          } >> "$GITHUB_OUTPUT"

      - name: Install checksum-verified Arm64 Debian baseline
        id: install
        continue-on-error: true
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64
          bash .github/actions/apt-bootstrap/bootstrap.sh \
            --packages "ca-certificates curl jq binutils python3" --no-install-recommends true
          DEB="$RUNNER_TEMP/openshell_0.1.6-1_arm64.deb"
          curl -fLsS --retry 3 --connect-timeout 20 --max-time 180 -o "$DEB" \
            https://github.com/NVIDIA/OpenShell/releases/download/v0.1.6/openshell_0.1.6-1_arm64.deb
          echo "2f6e2b7b09399d91443fc8e25bd5db360dfee562db17bb2778ac0d0067969f85  $DEB" | sha256sum -c -
          test "$(dpkg-deb -f "$DEB" Architecture)" = arm64
          test "$(dpkg-deb -f "$DEB" Version)" = 0.1.6-1
          sudo apt-get install -y --no-install-recommends "$DEB"
          test -x /usr/bin/openshell
          test -x /usr/bin/openshell-gateway
          echo "install_status=success" >> "$GITHUB_OUTPUT"

      - name: Verify exact installed baseline version
        id: version
        if: always() && steps.install.outcome == 'success' && steps.install.outputs.install_status == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          VERSION=$(openshell --version | awk '{print $NF}')
          test "$VERSION" = 0.1.6
          test "$(dpkg-query -W -f='${Version}' openshell)" = 0.1.6-1
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test 1 - Native Arm64 installed CLI and gateway identity
        id: test1
        if: always()
        continue-on-error: true
        env:
          BASELINE_READY: "${{ steps.install.outcome }}:${{ steps.install.outputs.install_status }}:${{ steps.version.outcome }}"
        run: |
          set -euo pipefail
          START_TIME=$SECONDS
          finish_test() {
            local rc=$? status=failed
            trap - EXIT
            if [ "$rc" -eq 0 ]; then status=passed; fi
            echo "status=$status" >> "$GITHUB_OUTPUT"
            echo "duration=$((SECONDS - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish_test EXIT
          test "$BASELINE_READY" = success:success:success
          test "$(uname -m)" = aarch64
          test "$(dpkg --print-architecture)" = arm64
          test "$(dpkg-query -W -f='${Architecture}' openshell)" = arm64
          test "$(dpkg-query -W -f='${Version}' openshell)" = 0.1.6-1
          for binary in /usr/bin/openshell /usr/bin/openshell-gateway; do
            readelf -h "$binary" | grep -Eq 'Machine: +AArch64'
          done

      - name: Test 2 - Docker runtime, immutable Arm64 images and live local gateway
        id: test2
        if: always()
        continue-on-error: true
        env:
          BASELINE_READY: "${{ steps.install.outcome }}:${{ steps.install.outputs.install_status }}:${{ steps.version.outcome }}"
        run: |
          set -euo pipefail
          START_TIME=$SECONDS
          finish_test() {
            local rc=$? status=failed
            trap - EXIT
            if [ "$rc" -eq 0 ]; then status=passed; fi
            echo "status=$status" >> "$GITHUB_OUTPUT"
            echo "duration=$((SECONDS - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish_test EXIT
          test "$BASELINE_READY" = success:success:success
          uname -a
          test -S /var/run/docker.sock
          DOCKER_VERSION=$(docker version --format '{{.Server.Version}}')
          dpkg --compare-versions "$DOCKER_VERSION" ge 28.0
          docker info --format '{{.OSType}} {{.Architecture}}'
          # No KVM or VM backend: the published Docker driver qualifies the kernel.
          for image in "$OPENSHELL_SANDBOX_IMAGE" "$OPENSHELL_SUPERVISOR_IMAGE" "$OPENSHELL_WORKLOAD_IMAGE"; do
            printf '%s\n' "$image" | grep -Eq '@sha256:[a-f0-9]{64}$'
            timeout 240s docker pull --platform linux/arm64 "$image"
            test "$(docker image inspect --format '{{.Architecture}}' "$image")" = arm64
          done
          python3 - <<'PY'
          import json, os, pathlib
          config = pathlib.Path.home() / ".config/openshell"
          config.mkdir(parents=True, exist_ok=True)
          values = {"sandbox_runtime_image": os.environ["OPENSHELL_SANDBOX_IMAGE"],
                    "supervisor_image": os.environ["OPENSHELL_SUPERVISOR_IMAGE"],
                    "default_image": os.environ["OPENSHELL_WORKLOAD_IMAGE"]}
          text = '[openshell]\nversion = 2\n[openshell.gateway]\ncompute_driver = "docker"\n[openshell.drivers.docker]\n'
          text += "".join(f"{key} = {json.dumps(value)}\n" for key, value in values.items())
          # Documented Docker runtime profile; no global kernel-security changes.
          text += 'app_armor_profile = "Unconfined"\n'
          (config / "gateway.toml").write_text(text)
          print(json.dumps(values, indent=2))
          PY
          systemctl --user daemon-reload
          systemctl --user enable --now openshell-gateway
          # The Debian package starts no service and registers no CLI endpoint.
          REGISTERED=false
          for attempt in $(seq 1 30); do
            echo "Gateway registration attempt $attempt"
            if timeout 10s openshell gateway add https://127.0.0.1:17670 --local --name openshell; then REGISTERED=true; break; fi
            sleep 2
          done
          if [ "$REGISTERED" != true ]; then
            journalctl --user -u openshell-gateway --no-pager -n 100
            exit 1
          fi
          READY=false
          for attempt in $(seq 1 30); do
            echo "Gateway readiness attempt $attempt"
            if timeout 10s openshell status; then READY=true; break; fi
            sleep 2
          done
          if [ "$READY" != true ]; then
            journalctl --user -u openshell-gateway --no-pager -n 100
            exit 1
          fi

      - name: Test 3 - Create sandbox and require Ready state and list membership
        id: test3
        if: always()
        continue-on-error: true
        env:
          BASELINE_READY: "${{ steps.install.outcome }}:${{ steps.install.outputs.install_status }}:${{ steps.version.outcome }}"
        run: |
          set -euo pipefail
          START_TIME=$SECONDS
          finish_test() {
            local rc=$? status=failed
            trap - EXIT
            if [ "$rc" -eq 0 ]; then status=passed; fi
            echo "status=$status" >> "$GITHUB_OUTPUT"
            echo "duration=$((SECONDS - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish_test EXIT
          test "$BASELINE_READY" = success:success:success
          SANDBOX="arm-$(printf '%s' "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" | sha256sum | cut -c1-12)"
          test "${#SANDBOX}" -le 19
          echo "OPENSHELL_SMOKE_SANDBOX=$SANDBOX" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os, pathlib
          policy = '''version: 1
          filesystem_policy:
            include_workdir: true
            read_only: [/bin, /usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log, /tmp]
            read_write: [/sandbox, /dev/null]
          landlock: {compatibility: best_effort}
          network_policies: {}
          '''
          (pathlib.Path(os.environ["RUNNER_TEMP"]) / "openshell-smoke-policy.yaml").write_text(policy)
          PY
          timeout 600s openshell sandbox create --name "$SANDBOX" --detach --policy "$RUNNER_TEMP/openshell-smoke-policy.yaml"
          timeout 30s openshell sandbox get "$SANDBOX" --output json | jq -e --arg name "$SANDBOX" '.name == $name and .phase == "Ready"'
          timeout 30s openshell sandbox list --output json | jq -e --arg name "$SANDBOX" 'any(.sandboxes[]; .name == $name and .phase == "Ready")'

      - name: Test 4 - Execute native Arm64 workload and persist allowed filesystem write
        id: test4
        if: always()
        continue-on-error: true
        env:
          BASELINE_READY: "${{ steps.install.outcome }}:${{ steps.install.outputs.install_status }}:${{ steps.version.outcome }}"
        run: |
          set -euo pipefail
          START_TIME=$SECONDS
          finish_test() {
            local rc=$? status=failed
            trap - EXIT
            if [ "$rc" -eq 0 ]; then status=passed; fi
            echo "status=$status" >> "$GITHUB_OUTPUT"
            echo "duration=$((SECONDS - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish_test EXIT
          test "$BASELINE_READY" = success:success:success
          test -n "$OPENSHELL_SMOKE_SANDBOX"
          # Variables in the command string belong to the sandbox shell.
          # shellcheck disable=SC2016
          RESULT=$(timeout 60s openshell sandbox exec --name "$OPENSHELL_SMOKE_SANDBOX" --no-tty -- bash -c \
            'set -eu; test "$(uname -m)" = aarch64; printf ARM_SMOKE_OK > /sandbox/arm-smoke; cat /sandbox/arm-smoke')
          test "$RESULT" = ARM_SMOKE_OK
          RESULT=$(timeout 60s openshell sandbox exec --name "$OPENSHELL_SMOKE_SANDBOX" --no-tty -- cat /sandbox/arm-smoke)
          test "$RESULT" = ARM_SMOKE_OK

      - name: Test 5 - Filesystem policy enforcement and confirmed sandbox deletion
        id: test5
        if: always()
        continue-on-error: true
        env:
          BASELINE_READY: "${{ steps.install.outcome }}:${{ steps.install.outputs.install_status }}:${{ steps.version.outcome }}"
        run: |
          set -euo pipefail
          START_TIME=$SECONDS
          finish_test() {
            local rc=$? status=failed
            trap - EXIT
            if [ "$rc" -eq 0 ]; then status=passed; fi
            echo "status=$status" >> "$GITHUB_OUTPUT"
            echo "duration=$((SECONDS - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish_test EXIT
          test "$BASELINE_READY" = success:success:success
          test -n "$OPENSHELL_SMOKE_SANDBOX"
          # Prove ordinary DAC permits this write for the workload's own UID.
          UID_IN_SANDBOX=$(timeout 30s openshell sandbox exec --name "$OPENSHELL_SMOKE_SANDBOX" --no-tty -- id -u)
          [[ "$UID_IN_SANDBOX" =~ ^[0-9]+$ ]]
          IMAGE="$OPENSHELL_WORKLOAD_IMAGE"
          # Command substitution belongs to the control container shell.
          # shellcheck disable=SC2016
          timeout 30s docker run --rm --network none --user "$UID_IN_SANDBOX" --entrypoint /bin/bash "$IMAGE" -c \
            'set -eu; printf allowed > /tmp/openshell-arm-smoke-forbidden; test "$(cat /tmp/openshell-arm-smoke-forbidden)" = allowed'
          # ERROR is captured inside the sandbox, not on the runner.
          # shellcheck disable=SC2016
          RESULT=$(timeout 60s openshell sandbox exec --name "$OPENSHELL_SMOKE_SANDBOX" --no-tty -- bash -c '
          set -eu
          test -d /tmp
          if ERROR=$( (printf forbidden > /tmp/openshell-arm-smoke-forbidden) 2>&1 ); then
            echo "Filesystem policy was bypassed" >&2
            exit 1
          fi
          printf "%s" "$ERROR" | grep -Eq "Permission denied|Operation not permitted"
          test ! -e /tmp/openshell-arm-smoke-forbidden
          printf FILESYSTEM_ENFORCEMENT_OK')
          test "$RESULT" = FILESYSTEM_ENFORCEMENT_OK
          timeout 120s openshell sandbox delete "$OPENSHELL_SMOKE_SANDBOX"
          DELETED=false
          for attempt in $(seq 1 30); do
            echo "Deletion confirmation attempt $attempt"
            if timeout 15s openshell sandbox list --output json | jq -e --arg name "$OPENSHELL_SMOKE_SANDBOX" 'all(.sandboxes[]; .name != $name)'; then DELETED=true; break; fi
            sleep 2
          done
          test "$DELETED" = true

      - name: Restore disposable runner state
        id: cleanup
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -n "${OPENSHELL_SMOKE_SANDBOX:-}" ]; then
            if timeout 20s openshell sandbox list --output json | jq -e --arg name "$OPENSHELL_SMOKE_SANDBOX" 'any(.sandboxes[]; .name == $name)' >/dev/null; then
              timeout 120s openshell sandbox delete "$OPENSHELL_SMOKE_SANDBOX"
            fi
          fi
          if command -v openshell-gateway >/dev/null 2>&1; then
            systemctl --user stop openshell-gateway
          fi

      - name: Test 6 - Newer-version runtime validation explicitly deferred
        id: test6
        if: always()
        continue-on-error: true
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, ".github/scripts")
          from package_result_policy import expected_regression_metadata
          steps = json.loads(os.environ["STEPS_JSON"])
          core_failed = sum(steps.get(f"test{i}", {}).get("outcome") != "success" or
                            steps.get(f"test{i}", {}).get("outputs", {}).get("status") != "passed"
                            for i in range(1, 6))
          installed = (steps.get("install", {}).get("outcome") == "success" and
                       steps.get("install", {}).get("outputs", {}).get("install_status") == "success" and
                       steps.get("version", {}).get("outcome") == "success" and
                       bool(steps.get("version", {}).get("outputs", {}).get("version")))
          decision = ("baseline_install_failed" if not installed else
                      "baseline_failed" if core_failed else "runtime_validation_not_automated")
          semantic = expected_regression_metadata(decision=decision, core_failed=core_failed)
          values = {
              "status": "skipped", "duration": "0", "decision": decision,
              "applicability": semantic["applicability"],
              "current_version": steps.get("version", {}).get("outputs", {}).get("version", ""),
              "latest_version": "not_evaluated", "next_installed_version": "not_installed",
              "regression_result": "No newer-version runtime comparison was executed.",
              "comparison": "Only the pinned baseline is exercised. Upgrades need a separate artifact and full enforcement run; no regression pass is asserted.",
          }
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for key, value in values.items():
                  print(f"{key}={value}", file=output)
          PY

      - name: Validate fail-closed six-test result
        id: summary
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          PACKAGE_NAME: "NVIDIA OpenShell"
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          sys.path.insert(0, ".github/scripts")
          from package_result_policy import validate_six_test_result, expected_regression_metadata
          steps = json.loads(os.environ["STEPS_JSON"])
          details, duration, malformed = [], 0, False
          for i in range(1, 7):
              step = steps.get(f"test{i}", {})
              values = step.get("outputs", {})
              seconds = values.get("duration", "")
              valid_duration = isinstance(seconds, str) and re.fullmatch(r"[0-9]+", seconds)
              if not valid_duration:
                  malformed = True
              else:
                  duration += int(seconds)
              status = "passed" if step.get("outcome") == "success" and values.get("status") == "passed" and valid_duration else "failed"
              if i == 6 and step.get("outcome") == "success" and values.get("status") == "skipped" and valid_duration:
                  status = "skipped"
              detail = {"name": f"Test {i}", "status": status}
              if i == 6:
                  detail["decision"] = values.get("decision", "")
              details.append(detail)
          statuses = [detail["status"] for detail in details]
          passed, failed, skipped = (statuses.count(value) for value in ("passed", "failed", "skipped"))
          core_failed = statuses[:5].count("failed")
          decision = details[-1]["decision"]
          run_status = "failure"
          try:
              required = validate_six_test_result(details=details, passed=passed, failed=failed,
                                                skipped=skipped, core_failed=core_failed, decision=decision)
              semantic = expected_regression_metadata(decision=decision, core_failed=core_failed)
              prerequisites = (steps.get("metadata", {}).get("outcome") == "success" and
                               steps.get("install", {}).get("outcome") == "success" and
                               steps.get("install", {}).get("outputs", {}).get("install_status") == "success" and
                               steps.get("version", {}).get("outcome") == "success" and
                               bool(steps.get("version", {}).get("outputs", {}).get("version")) and
                               steps.get("cleanup", {}).get("outcome") == "success")
              if required == "success" and prerequisites and not malformed:
                  run_status = "success"
          except ValueError as error:
              print(f"Result policy rejected evidence: {error}", file=sys.stderr)
          outputs = {
              "overall_status": run_status, "badge_status": "passing" if run_status == "success" else "failing",
              "passed": passed, "failed": failed, "skipped": skipped,
              "core_failed": core_failed, "duration": duration,
          }
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for key, value in outputs.items():
                  print(f"{key}={value}", file=output)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as report:
              print(f"## {os.environ['PACKAGE_NAME']} Arm64 baseline", file=report)
              print(f"Status: {run_status}; passed: {passed}; failed: {failed}; skipped: {skipped}.", file=report)
              print("Mandatory runtime/enforcement checks fail when prerequisites are unavailable.", file=report)
              print(f"Regression decision: {decision}. No newer-version runtime comparison.", file=report)
              print("Historical public Arm-support minimum: 0.0.6; tested baseline: 0.1.6. No performance recommendation is asserted.", file=report)
          sys.exit(0 if run_status == "success" else 1)
          PY

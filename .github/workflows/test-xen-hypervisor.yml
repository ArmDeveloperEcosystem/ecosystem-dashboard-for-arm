name: Test Xen Arm64 userspace tools (no hypervisor boot)

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-xen-hypervisor.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-xen-hypervisor.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-xen-hypervisor.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-xen-hypervisor.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-xen-hypervisor.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-xen-hypervisor.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-xen-hypervisor.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-xen-hypervisor.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-xen-hypervisor.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-xen-hypervisor.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-xen-hypervisor.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-xen-hypervisor.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-xen-hypervisor.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-xen-hypervisor.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-xen-hypervisor.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-xen-hypervisor.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-xen-hypervisor.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-xen-hypervisor.outputs.regression_next_installed_version }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-xen-hypervisor.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-xen-hypervisor.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-xen-hypervisor.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-xen-hypervisor.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-xen-hypervisor.outputs.timestamp }}
jobs:
  test-xen-hypervisor:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      LC_ALL: C
      XEN_PACKAGE: xen-utils-4.17
      XEN_BIN: /usr/lib/xen-4.17/bin

    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'Xen userspace smoke (hypervisor boot and VM execution not tested)'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '5' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '5' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=xen-hypervisor" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/opensource_packages/xen-hypervisor" >> "$GITHUB_OUTPUT"

      - name: Install Xen userspace packages (no hypervisor installation)
        id: install
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          bash .github/actions/apt-bootstrap/bootstrap.sh \
            --packages "$XEN_PACKAGE xenstore-utils libxen-dev gcc libc6-dev binutils" \
            --no-install-recommends true
          test -x "$XEN_BIN/xenstored"
          test -x /usr/bin/xenstore
          echo "install_status=success" >> "$GITHUB_OUTPUT"

      - name: Record installed Xen package version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(dpkg-query -W -f='${Version}' "$XEN_PACKAGE")
          [[ "$VERSION" =~ ^4\.17\.[0-9][0-9A-Za-z.+:~\-]*$ ]]
          test "$(dpkg-query -W -f='${Status}' "$XEN_PACKAGE")" = "install ok installed"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "XEN_PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Installed Ubuntu Xen userspace package: $VERSION"
          echo "Hypervisor boot and guest execution are not tested."

      - name: Test 1 - Xen userspace binaries and package ownership
        id: test1
        if: always() && steps.install.outcome == 'success' && steps.version.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$SECONDS
          finish_test() {
            local rc=$? status=failed
            trap - EXIT
            if [ "$rc" -eq 0 ]; then status=passed; fi
            echo "status=$status" >> "$GITHUB_OUTPUT"
            echo "duration=$((SECONDS - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish_test EXIT
          test -x "$XEN_BIN/xenstored"
          test -x /usr/bin/xenstore
          test "$(dpkg-query -S "$XEN_BIN/xenstored")" = "$XEN_PACKAGE: $XEN_BIN/xenstored"
          test "$(dpkg-query -S /usr/bin/xenstore)" = "xenstore-utils: /usr/bin/xenstore"

      - name: Test 2 - Installed Xen tools and development package versions
        id: test2
        if: always() && steps.install.outcome == 'success' && steps.version.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$SECONDS
          finish_test() {
            local rc=$? status=failed
            trap - EXIT
            if [ "$rc" -eq 0 ]; then status=passed; fi
            echo "status=$status" >> "$GITHUB_OUTPUT"
            echo "duration=$((SECONDS - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish_test EXIT
          test -n "$XEN_PACKAGE_VERSION"
          for package in "$XEN_PACKAGE" xenstore-utils libxen-dev libxenmisc4.17t64; do
            test "$(dpkg-query -W -f='${Status}' "$package")" = "install ok installed"
            test "$(dpkg-query -W -f='${Architecture}' "$package")" = arm64
            test "$(dpkg-query -W -f='${Version}' "$package")" = "$XEN_PACKAGE_VERSION"
          done

      - name: Test 3 - Execute Xenstored help
        id: test3
        if: always() && steps.install.outcome == 'success' && steps.version.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$SECONDS
          finish_test() {
            local rc=$? status=failed
            trap - EXIT
            if [ "$rc" -eq 0 ]; then status=passed; fi
            echo "status=$status" >> "$GITHUB_OUTPUT"
            echo "duration=$((SECONDS - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish_test EXIT
          HELP=$(timeout 15s "$XEN_BIN/xenstored" --help 2>&1)
          grep -Fq 'xenstored <options>' <<< "$HELP"
          grep -Fq -- '--no-domain-init' <<< "$HELP"

      - name: Test 4 - Native Arm64 host and Xen ELF architecture
        id: test4
        if: always() && steps.install.outcome == 'success' && steps.version.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$SECONDS
          finish_test() {
            local rc=$? status=failed
            trap - EXIT
            if [ "$rc" -eq 0 ]; then status=passed; fi
            echo "status=$status" >> "$GITHUB_OUTPUT"
            echo "duration=$((SECONDS - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish_test EXIT
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64
          test "$(dpkg --print-architecture)" = arm64
          for binary in "$XEN_BIN/xenstored" /usr/bin/xenstore /usr/lib/aarch64-linux-gnu/libxlutil.so; do
            HEADER=$(readelf -h "$binary")
            grep -Eq 'Class: +ELF64' <<< "$HEADER"
            grep -Eq 'Machine: +AArch64' <<< "$HEADER"
          done

      - name: Test 5 - Xen userspace config parser (no hypervisor or VM execution)
        id: test5
        if: always() && steps.install.outcome == 'success' && steps.version.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$SECONDS
          BUILD_DIR=$(mktemp -d "$RUNNER_TEMP/xen-parser.XXXXXX")
          finish_test() {
            local rc=$? status=failed
            trap - EXIT
            rm -rf "$BUILD_DIR"
            if [ "$rc" -eq 0 ]; then status=passed; fi
            echo "status=$status" >> "$GITHUB_OUTPUT"
            echo "duration=$((SECONDS - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish_test EXIT
          timeout 60s gcc -std=c11 -Wall -Wextra -Werror \
            .github/scripts/xen_toolstack_smoke.c -lxlutil -o "$BUILD_DIR/xen-parser-smoke"
          timeout 20s "$BUILD_DIR/xen-parser-smoke"

      - name: Regression applicability - baseline and package-manager policy
        id: test6
        if: always()
        env:
          CURRENT_VERSION: ${{ steps.version.outputs.version || 'unknown' }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          INSTALL_STATUS: ${{ steps.install.outputs.install_status }}
          VERSION_OUTCOME: ${{ steps.version.outcome }}
          CORE_RESULTS: "${{ steps.test1.outcome }}:${{ steps.test1.outputs.status }} ${{ steps.test2.outcome }}:${{ steps.test2.outputs.status }} ${{ steps.test3.outcome }}:${{ steps.test3.outputs.status }} ${{ steps.test4.outcome }}:${{ steps.test4.outputs.status }} ${{ steps.test5.outcome }}:${{ steps.test5.outputs.status }}"
        run: |
          set -euo pipefail
          DECISION=not_applicable_package_manager
          RESULT="Regression validation not applicable: tested package installed via package manager in Tests 1-5"
          COMPARISON="Ubuntu apt manages the tested Xen userspace package versions; no next-version installation or hypervisor execution is asserted."
          if [ "$INSTALL_OUTCOME" != success ] || [ "$INSTALL_STATUS" != success ] \
            || [ "$VERSION_OUTCOME" != success ] || [ -z "$CURRENT_VERSION" ] || [ "$CURRENT_VERSION" = unknown ]; then
            DECISION=baseline_install_failed
            RESULT="Baseline installation or package version verification failed"
            COMPARISON="Baseline evidence is incomplete; no passing smoke result or next-version comparison is asserted."
          elif [ "$CORE_RESULTS" != "success:passed success:passed success:passed success:passed success:passed" ]; then
            DECISION=baseline_failed
            RESULT="Baseline smoke validation failed or is incomplete"
            COMPARISON="Tests 1-5 did not all pass; the workflow remains failed and incomplete evidence cannot be published."
          fi
          {
            echo "current_version=$CURRENT_VERSION"
            echo "latest_version=not_applicable"
            echo "next_installed_version=not_applicable"
            echo "decision=$DECISION"
            echo "regression_result=$RESULT"
            echo "comparison=$COMPARISON"
            echo "status=skipped"
            echo "duration=0"
          } >> "$GITHUB_OUTPUT"

      - name: Calculate test summary
        if: always()
        id: summary
        run: |
          set -euo pipefail
          PASSED=0
          FAILED=0
          SKIPPED=0
          CORE_FAILED=0
          CORE_PASSED=0
          TOTAL_DURATION=0

          check_test() {
            local status="$1" outcome="$2" duration="$3" core="$4"
            if [ "$outcome" = skipped ] || [ -z "$outcome" ]; then
              SKIPPED=$((SKIPPED + 1))
            elif [ "$outcome" = success ] && [ "$core" -eq 0 ] \
              && [ "$status" = skipped ] \
              && [[ "${{ steps.test6.outputs.decision }}" =~ ^(not_applicable_package_manager|baseline_failed|baseline_install_failed)$ ]]; then
              SKIPPED=$((SKIPPED + 1))
            elif [ "$outcome" = success ] && [ "$status" = passed ] && [ "$core" -eq 1 ]; then
              PASSED=$((PASSED + 1))
              CORE_PASSED=$((CORE_PASSED + 1))
            else
              FAILED=$((FAILED + 1))
              CORE_FAILED=$((CORE_FAILED + core))
            fi
            [[ "$duration" =~ ^[0-9]+$ ]] || duration=0
            TOTAL_DURATION=$((TOTAL_DURATION + 10#$duration))
          }

          check_test "${{ steps.test1.outputs.status }}" "${{ steps.test1.outcome }}" "${{ steps.test1.outputs.duration || 0 }}" 1
          check_test "${{ steps.test2.outputs.status }}" "${{ steps.test2.outcome }}" "${{ steps.test2.outputs.duration || 0 }}" 1
          check_test "${{ steps.test3.outputs.status }}" "${{ steps.test3.outcome }}" "${{ steps.test3.outputs.duration || 0 }}" 1
          check_test "${{ steps.test4.outputs.status }}" "${{ steps.test4.outcome }}" "${{ steps.test4.outputs.duration || 0 }}" 1
          check_test "${{ steps.test5.outputs.status }}" "${{ steps.test5.outcome }}" "${{ steps.test5.outputs.duration || 0 }}" 1
          check_test "${{ steps.test6.outputs.status }}" "${{ steps.test6.outcome }}" "${{ steps.test6.outputs.duration || 0 }}" 0

          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
          echo "core_failed=$CORE_FAILED" >> "$GITHUB_OUTPUT"
          echo "duration=$TOTAL_DURATION" >> "$GITHUB_OUTPUT"

          if [ "$CORE_PASSED" -eq 5 ] && [ "$FAILED" -eq 0 ] \
            && [ "${{ steps.install.outcome }}" = success ] \
            && [ "${{ steps.install.outputs.install_status }}" = success ] \
            && [ "${{ steps.version.outcome }}" = success ] \
            && [ "${{ steps.test6.outcome }}" = success ] \
            && [ "${{ steps.test6.outputs.status }}" = skipped ] \
            && [ "${{ steps.test6.outputs.decision }}" = not_applicable_package_manager ]; then
            echo "overall_status=success" >> "$GITHUB_OUTPUT"
            echo "badge_status=passing" >> "$GITHUB_OUTPUT"
          else
            echo "overall_status=failure" >> "$GITHUB_OUTPUT"
            echo "badge_status=failing" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Create test summary
        if: always()
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version || 'unknown' }}
          STATUS: ${{ steps.summary.outputs.overall_status || 'failure' }}
          PASSED: ${{ steps.summary.outputs.passed || '0' }}
          FAILED: ${{ steps.summary.outputs.failed || '0' }}
          SKIPPED: ${{ steps.summary.outputs.skipped || '0' }}
          REGRESSION_DECISION: ${{ steps.test6.outputs.decision || 'unknown' }}
        run: |
          {
            echo "## Xen Arm64 userspace smoke tests"
            echo "- Installed package version: $PACKAGE_VERSION"
            echo "- Status: $STATUS"
            echo "- Passed: $PASSED; failed: $FAILED; skipped: $SKIPPED"
            echo "- Scope: packaged userspace tools and the native Xen configuration parser."
            echo "- Not tested: hypervisor boot, dom0, guest execution, device passthrough, XAPI or XCP-ng."
            echo "- Regression decision: $REGRESSION_DECISION"
          } >> "$GITHUB_STEP_SUMMARY"

name: Test All Packages (Batch 15) on Arm64
run-name: Arm64 Batch 15 [${{ inputs.orchestration_id || format('manual-{0}-{1}', github.run_id, github.run_attempt) }}] [nonce:${{ inputs.dispatch_nonce || 'manual-only' }}]

on:
  workflow_dispatch:
    inputs:
      orchestration_id:
        description: Exact orchestrator identity; blank uses a safe manual fallback
        required: false
        default: ""
        type: string
      dispatch_nonce:
        description: Secret exact-dispatch nonce; blank is manual-only and not publishable
        required: false
        default: ""
        type: string
      expected_sha:
        description: Exact commit expected by the orchestrator
        required: false
        default: ""
        type: string
      expected_branch:
        description: Exact branch expected by the orchestrator
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      orchestration_id:
        required: true
        type: string
      dispatch_nonce:
        required: true
        type: string
      expected_sha:
        required: true
        type: string
      expected_branch:
        required: true
        type: string

permissions:
  contents: read

jobs:

  test-fping:
    uses: ./.github/workflows/test-fping.yml

  test-strongswan:
    uses: ./.github/workflows/test-strongswan.yml

  test-highwayhash:
    uses: ./.github/workflows/test-highwayhash.yml

  test-sendbird-uikit:
    uses: ./.github/workflows/test-sendbird-uikit.yml

  test-gromacs:
    uses: ./.github/workflows/test-gromacs.yml

  test-rke:
    uses: ./.github/workflows/test-RKE.yml

  test-neutron:
    uses: ./.github/workflows/test-Neutron.yml

  test-keptn:
    uses: ./.github/workflows/test-keptn.yml

  test-glibc:
    uses: ./.github/workflows/test-glibc.yml

  test-mopac:
    uses: ./.github/workflows/test-mopac.yml

  test-dubbo-go:
    uses: ./.github/workflows/test-dubbo-go.yml

  test-elastic-package:
    uses: ./.github/workflows/test-elastic-package.yml

  test-gperf:
    uses: ./.github/workflows/test-gperf.yml

  test-scipy:
    uses: ./.github/workflows/test-scipy.yml

  test-litespeed_openlitespeed:
    uses: ./.github/workflows/test-litespeed_openlitespeed.yml

  test-mummer:
    uses: ./.github/workflows/test-mummer.yml

  test-python:
    uses: ./.github/workflows/test-python.yml

  test-ironic:
    uses: ./.github/workflows/test-ironic.yml

  test-journalbeat:
    uses: ./.github/workflows/test-journalbeat.yml

  test-ipvsadm:
    uses: ./.github/workflows/test-ipvsadm.yml

  test-woocommerce:
    uses: ./.github/workflows/test-woocommerce.yml

  test-gvisor:
    uses: ./.github/workflows/test-gVisor.yml

  test-iniparser:
    uses: ./.github/workflows/test-iniParser.yml

  test-protobuf:
    uses: ./.github/workflows/test-protobuf.yml

  test-opencas:
    uses: ./.github/workflows/test-opencas.yml

  test-dynamorio:
    uses: ./.github/workflows/test-dynamorio.yml

  test-elasticapmagent:
    uses: ./.github/workflows/test-elasticapmagent.yml

  test-cmake:
    uses: ./.github/workflows/test-cmake.yml

  test-opencv:
    uses: ./.github/workflows/test-opencv.yml

  test-dubbo-java:
    uses: ./.github/workflows/test-dubbo-java.yml

  test-pyinstaller:
    uses: ./.github/workflows/test-pyinstaller.yml

  test-whisper:
    uses: ./.github/workflows/test-whisper.yml

  test-muscle:
    uses: ./.github/workflows/test-muscle.yml

  test-slurm:
    uses: ./.github/workflows/test-slurm.yml

  test-swift:
    uses: ./.github/workflows/test-swift.yml

  test-ecctl:
    uses: ./.github/workflows/test-ecctl.yml

  test-bosh-cli:
    uses: ./.github/workflows/test-bosh-cli.yml

  test-greenplum:
    uses: ./.github/workflows/test-greenplum.yml

  test-jetty:
    uses: ./.github/workflows/test-jetty.yml

  test-spring-cloud-stream:
    uses: ./.github/workflows/test-spring-cloud-stream.yml

  test-geda:
    uses: ./.github/workflows/test-geda.yml

  test-gem5:
    uses: ./.github/workflows/test-gem5.yml

  test-gerbv:
    uses: ./.github/workflows/test-gerbv.yml

  test-ghdl:
    uses: ./.github/workflows/test-ghdl.yml

  test-gluten:
    uses: ./.github/workflows/test-gluten.yml

  summary:
    permissions:
      actions: read
      contents: read
    needs:
      [
        test-fping,
        test-strongswan,
        test-highwayhash,
        test-sendbird-uikit,
        test-gromacs,
        test-rke,
        test-neutron,
        test-keptn,
        test-glibc,
        test-mopac,
        test-dubbo-go,
        test-elastic-package,
        test-gperf,
        test-scipy,
        test-litespeed_openlitespeed,
        test-mummer,
        test-python,
        test-ironic,
        test-journalbeat,
        test-ipvsadm,
        test-woocommerce,
        test-gvisor,
        test-iniparser,
        test-protobuf,
        test-opencas,
        test-dynamorio,
        test-elasticapmagent,
        test-cmake,
        test-opencv,
        test-dubbo-java,
        test-pyinstaller,
        test-whisper,
        test-muscle,
        test-slurm,
        test-swift,
        test-ecctl,
        test-bosh-cli,
        test-greenplum,
        test-jetty,
        test-spring-cloud-stream,
        test-geda,
        test-gem5,
        test-gerbv,
        test-ghdl,
        test-gluten
      ]
    runs-on: ubuntu-24.04-arm
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect batch results
        id: collect
        uses: ./.github/actions/collect-batch-results
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        with:
          batch_number: "15"
          batch_title: "Batch 15"

      - name: Attest complete batch results
        id: attest
        if: steps.collect.outcome == 'success'
        env:
          ARTIFACT_NAME: batch15-test-results
          BATCH_NUMBER: "15"
          COLLECTOR_JSON_COUNT: ${{ steps.collect.outputs.json_count }}
          CURRENT_BRANCH: ${{ github.ref_name }}
          DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
          EXPECTED_BRANCH: ${{ inputs.expected_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          NEEDS_JSON: ${{ toJson(needs) }}
          ORCHESTRATION_ID: ${{ inputs.orchestration_id }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/batch_artifact_attestation.py create \
            --results-root test-results \
            --workflow-file ".github/workflows/test-all-packages-batch15.yml" \
            --batch "$BATCH_NUMBER" \
            --repository "$REPOSITORY" \
            --expected-branch "$EXPECTED_BRANCH" \
            --current-branch "$CURRENT_BRANCH" \
            --expected-sha "$EXPECTED_SHA" \
            --workflow-sha "$WORKFLOW_SHA" \
            --orchestration-id "$ORCHESTRATION_ID" \
            --dispatch-nonce "$DISPATCH_NONCE" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --artifact-name "$ARTIFACT_NAME" \
            --collector-json-count "$COLLECTOR_JSON_COUNT" \
            --needs-environment-variable NEEDS_JSON

      - name: Upload batch test results
        if: steps.collect.outcome == 'success' && steps.attest.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: batch15-test-results
          path: test-results
          retention-days: 90

name: Arm64 opportunity report PoC

on:
  pull_request:
    paths:
      - 'poc/discovery/**'
      - 'poc/__init__.py'
      - 'poc/tests/test_discovery*'
      - 'poc/tests/ui_discovery.test.cjs'
      - '.github/workflows/arm64-opportunity-poc-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-acceptance:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install hash-locked PoC test dependencies
        run: |
          python -m pip install --require-hashes -r poc/discovery/deploy/requirements.build.lock
          python -m pip install --require-hashes -r poc/discovery/deploy/requirements.test.lock
          python -m pip check
      - name: Verify scoped evidence, persistent memory, reports and local API
        run: python -m pytest poc/tests/test_discovery* -q
      - name: Verify report UI rendering and evidence links
        run: node --test poc/tests/ui_discovery.test.cjs
      - name: Build the production Arm64 batch image
        run: |
          docker build --platform linux/arm64 \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            -f poc/discovery/deploy/Dockerfile \
            -t arm64-opportunity-report:ci .
      - name: Verify private persistent reports using the offline default command
        run: |
          python poc/discovery/deploy/smoke_image.py --image arm64-opportunity-report:ci
      # Live reports remain internal. This workflow uses synthetic fixtures only,
      # needs no model/source secrets, and uploads no discovery report artifacts.

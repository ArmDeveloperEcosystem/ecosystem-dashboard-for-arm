name: Test Metricbeat on Arm64

permissions:
  contents: read

on:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-metricbeat.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-metricbeat.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-metricbeat.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-metricbeat.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-metricbeat.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-metricbeat.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-metricbeat.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-metricbeat.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-metricbeat.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-metricbeat.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-metricbeat.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-metricbeat.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-metricbeat.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-metricbeat.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-metricbeat.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-metricbeat.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-metricbeat.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-metricbeat.outputs.regression_next_installed_version }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-metricbeat.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-metricbeat.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-metricbeat.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-metricbeat.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-metricbeat.outputs.timestamp }}
jobs:
  test-metricbeat:
    runs-on: ubuntu-24.04-arm

    env:
      BASELINE_VERSION: "9.0.4"
      NEXT_VERSION: "9.0.5"

    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'Metricbeat'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=metricbeat" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/opensource_packages/metricbeat" >> "$GITHUB_OUTPUT"
          echo "current_version=${BASELINE_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Install Metricbeat
        id: install
        run: |
          set -euo pipefail
          VERSION="${{ steps.metadata.outputs.current_version }}"
          WORK_DIR="/tmp/metricbeat-${VERSION}"
          TAR_PATH="${WORK_DIR}/metricbeat-${VERSION}-linux-arm64.tar.gz"
          URL="https://artifacts.elastic.co/downloads/beats/metricbeat/metricbeat-${VERSION}-linux-arm64.tar.gz"

          bash .github/actions/apt-bootstrap/bootstrap.sh --packages "curl tar file"
          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"
          curl -fsSL "$URL" -o "$TAR_PATH"
          tar -xzf "$TAR_PATH" -C "$WORK_DIR"

          EXTRACTED_DIR="${WORK_DIR}/metricbeat-${VERSION}-linux-arm64"
          sudo install -m 0755 "${EXTRACTED_DIR}/metricbeat" /usr/local/bin/metricbeat
          cp "${EXTRACTED_DIR}/metricbeat.yml" /tmp/metricbeat.yml
          chmod go-w /tmp/metricbeat.yml

          echo "baseline_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "binary_path=/usr/local/bin/metricbeat" >> "$GITHUB_OUTPUT"
          echo "config_path=/tmp/metricbeat.yml" >> "$GITHUB_OUTPUT"
          echo "extract_dir=$EXTRACTED_DIR" >> "$GITHUB_OUTPUT"
          echo "install_status=success" >> "$GITHUB_OUTPUT"

      - name: Get Metricbeat version
        id: version
        run: |
          set -euo pipefail
          VERSION_PATTERN='^metricbeat version ([0-9]+\.[0-9]+\.[0-9]+) \(arm64\), libbeat '
          if VERSION_OUTPUT=$(timeout --kill-after=5s 20s metricbeat version 2>&1) \
            && [[ "$VERSION_OUTPUT" != *$'\n'* && "$VERSION_OUTPUT" =~ $VERSION_PATTERN ]] \
            && [ "${BASH_REMATCH[1]}" = "$BASELINE_VERSION" ]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            printf '%s\n' "$VERSION_OUTPUT"
            echo "version=unknown" >> "$GITHUB_OUTPUT"
            echo "Metricbeat version CLI failed or did not report the exact baseline version." >&2
            exit 1
          fi
          printf '%s\n' "$VERSION_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected Metricbeat version: $VERSION"

      - name: Test 1 - Check Metricbeat binary exists
        id: test1
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          if command -v metricbeat >/dev/null 2>&1; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            END_TIME=$(date +%s)
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 2 - Check Metricbeat version output
        id: test2
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          EXPECTED="${{ steps.install.outputs.baseline_version }}"
          REPORTED="${{ steps.version.outputs.version }}"
          VERSION_OUTPUT=""
          VERSION_PATTERN='^metricbeat version ([0-9]+\.[0-9]+\.[0-9]+) \(arm64\), libbeat '
          if [ "$EXPECTED" = "$BASELINE_VERSION" ] && [ "$REPORTED" = "$EXPECTED" ] \
            && VERSION_OUTPUT=$(timeout --kill-after=5s 20s metricbeat version 2>&1) \
            && [[ "$VERSION_OUTPUT" != *$'\n'* && "$VERSION_OUTPUT" =~ $VERSION_PATTERN ]] \
            && [ "${BASH_REMATCH[1]}" = "$EXPECTED" ]; then
            printf '%s\n' "$VERSION_OUTPUT"
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$VERSION_OUTPUT"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            END_TIME=$(date +%s)
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 3 - Check Metricbeat help output
        id: test3
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          if HELP_OUTPUT=$(timeout --kill-after=5s 20s metricbeat --help 2>&1) \
            && grep -Eq '^Usage:' <<< "$HELP_OUTPUT" \
            && grep -Eq '^[[:space:]]+metricbeat([[:space:]]|$)' <<< "$HELP_OUTPUT" \
            && grep -Eq '^Available Commands:' <<< "$HELP_OUTPUT"; then
            printf '%s\n' "$HELP_OUTPUT"
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$HELP_OUTPUT"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            END_TIME=$(date +%s)
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 4 - Check Metricbeat configuration
        id: test4
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          if CONFIG_OUTPUT=$(timeout --kill-after=5s 30s metricbeat test config \
            --path.home "${{ steps.install.outputs.extract_dir }}" \
            --path.config "${{ steps.install.outputs.extract_dir }}" \
            -c "${{ steps.install.outputs.config_path }}" 2>&1) \
            && grep -Fxq 'Config OK' <<< "$CONFIG_OUTPUT"; then
            printf '%s\n' "$CONFIG_OUTPUT"
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$CONFIG_OUTPUT"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            END_TIME=$(date +%s)
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 5 - List modules and verify architecture
        id: test5
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          REAL_BIN=$(realpath "${{ steps.install.outputs.binary_path }}")
          ARCH_OK=0
          CONFIG_OK=0
          MODULES_OK=0
          if MODULES_OUTPUT=$(timeout --kill-after=5s 30s metricbeat modules list \
            --path.home "${{ steps.install.outputs.extract_dir }}" \
            --path.config "${{ steps.install.outputs.extract_dir }}" \
            -c "${{ steps.install.outputs.config_path }}" 2>&1) \
            && grep -Fxq 'Enabled:' <<< "$MODULES_OUTPUT" \
            && grep -Fxq 'Disabled:' <<< "$MODULES_OUTPUT" \
            && grep -Fxq 'system' <<< "$MODULES_OUTPUT"; then
            MODULES_OK=1
          fi
          printf '%s\n' "$MODULES_OUTPUT"
          if CONFIG_OUTPUT=$(timeout --kill-after=5s 30s metricbeat test config \
            --path.home "${{ steps.install.outputs.extract_dir }}" \
            --path.config "${{ steps.install.outputs.extract_dir }}" \
            -c "${{ steps.install.outputs.config_path }}" 2>&1) \
            && grep -Fxq 'Config OK' <<< "$CONFIG_OUTPUT"; then
            CONFIG_OK=1
          fi
          printf '%s\n' "$CONFIG_OUTPUT"
          if file -b "$REAL_BIN" | grep -Eqi "aarch64|arm64"; then
            ARCH_OK=1
          elif command -v readelf >/dev/null 2>&1 && readelf -h "$REAL_BIN" | grep -qi 'AArch64'; then
            ARCH_OK=1
          fi
          if [ "$(uname -m)" = "aarch64" ] \
            && [ "$ARCH_OK" -eq 1 ] \
            && [ "$CONFIG_OK" -eq 1 ] \
            && [ "$MODULES_OK" -eq 1 ]; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            file "$REAL_BIN" || true
            readelf -h "$REAL_BIN" 2>/dev/null || true
            echo "status=failed" >> "$GITHUB_OUTPUT"
            END_TIME=$(date +%s)
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 6 - Regression Validation
        id: test6
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          trap 'echo "duration=$(( $(date +%s) - START_TIME ))" >> "$GITHUB_OUTPUT"' EXIT
          CURRENT="${{ steps.version.outputs.version }}"
          echo "current_version=$CURRENT" >> "$GITHUB_OUTPUT"
          BASELINE_OK=1
          for RESULT in \
            "${{ steps.test1.outputs.status }}:${{ steps.test1.outcome }}" \
            "${{ steps.test2.outputs.status }}:${{ steps.test2.outcome }}" \
            "${{ steps.test3.outputs.status }}:${{ steps.test3.outcome }}" \
            "${{ steps.test4.outputs.status }}:${{ steps.test4.outcome }}" \
            "${{ steps.test5.outputs.status }}:${{ steps.test5.outcome }}"; do
            if [ "$RESULT" != "passed:success" ]; then BASELINE_OK=0; fi
          done
          if [ "$BASELINE_OK" != 1 ] || [ "$CURRENT" != "$BASELINE_VERSION" ] \
            || [ "${{ steps.version.outcome }}" != "success" ] \
            || [ "${{ steps.install.outputs.install_status }}" != "success" ]; then
            echo "latest_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
            echo "next_installed_version=not_installed" >> "$GITHUB_OUTPUT"
            echo "decision=baseline_failed" >> "$GITHUB_OUTPUT"
            echo "regression_result=Candidate validation not run because baseline checks did not pass" >> "$GITHUB_OUTPUT"
            echo "comparison=Baseline version and all five core checks must pass before candidate validation." >> "$GITHUB_OUTPUT"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "next_installed_version=not_installed" >> "$GITHUB_OUTPUT"
          echo "decision=next_install_failed" >> "$GITHUB_OUTPUT"
          echo "regression_result=Candidate acquisition or CLI validation did not complete successfully" >> "$GITHUB_OUTPUT"
          echo "comparison=Baseline $CURRENT passed its checks; candidate $NEXT_VERSION must pass actual version, help, config, modules and Arm64 checks." >> "$GITHUB_OUTPUT"
          echo "=== Regression Validation (Next Version Install) ==="
          echo "Current version tested in Tests 1-5: $CURRENT"

          LATEST="${NEXT_VERSION}"

          if [ -z "$LATEST" ]; then
            echo "latest_version=lookup_failed" >> "$GITHUB_OUTPUT"
            echo "next_installed_version=lookup_failed" >> "$GITHUB_OUTPUT"
            echo "decision=next_lookup_failed" >> "$GITHUB_OUTPUT"
            echo "regression_result=Next version lookup failed on Arm64" >> "$GITHUB_OUTPUT"
            echo "comparison=Current pinned Metricbeat version ${CURRENT} passed smoke tests in this run, but the latest stable upstream Arm64 release could not be resolved for candidate validation." >> "$GITHUB_OUTPUT"
            echo "Next version targeted for install validation: lookup_failed"
            echo "Next version installed on Arm64: lookup_failed"
            echo "Regression install result: Next version lookup failed on Arm64"
            echo "Details: Current pinned Metricbeat version ${CURRENT} passed smoke tests in this run, but the latest stable upstream Arm64 release could not be resolved for candidate validation."
            echo "status=failed" >> "$GITHUB_OUTPUT"
            END_TIME=$(date +%s)
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "latest_version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Next version targeted for install validation: $LATEST"

          if [ "$CURRENT" = "$LATEST" ]; then
            echo "next_installed_version=$CURRENT" >> "$GITHUB_OUTPUT"
            echo "decision=metadata_review_required" >> "$GITHUB_OUTPUT"
            echo "regression_result=Tests 1-5 baseline must be older than the latest stable release" >> "$GITHUB_OUTPUT"
            echo "comparison=Pinned baseline already matches the latest stable upstream release. Repin Tests 1-5 to an older dashboard-aligned baseline so Test 6 validates a newer Arm64 release." >> "$GITHUB_OUTPUT"
            echo "Next version installed on Arm64: $CURRENT"
            echo "Regression install result: Tests 1-5 baseline must be older than the latest stable release"
            echo "Details: Current pinned Metricbeat version ${CURRENT} passed smoke tests in this run and is already the latest stable Arm64 candidate for this workflow."
            echo "status=failed" >> "$GITHUB_OUTPUT"
            END_TIME=$(date +%s)
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          NEXT_DIR=$(mktemp -d)
          NEXT_TAR="${NEXT_DIR}/metricbeat-${LATEST}-linux-arm64.tar.gz"
          NEXT_URL="https://artifacts.elastic.co/downloads/beats/metricbeat/metricbeat-${LATEST}-linux-arm64.tar.gz"
          curl -fsSL "$NEXT_URL" -o "$NEXT_TAR"
          tar -xzf "$NEXT_TAR" -C "$NEXT_DIR"

          EXTRACTED_DIR="${NEXT_DIR}/metricbeat-${LATEST}-linux-arm64"
          NEXT_BIN="${EXTRACTED_DIR}/metricbeat"
          NEXT_CONFIG="${NEXT_DIR}/metricbeat.yml"
          cp "${EXTRACTED_DIR}/metricbeat.yml" "$NEXT_CONFIG"
          chmod go-w "$NEXT_CONFIG"

          NEXT_REPORTED=unknown
          VERSION_PATTERN='^metricbeat version ([0-9]+\.[0-9]+\.[0-9]+) \(arm64\), libbeat '
          if NEXT_VERSION_OUTPUT=$(timeout --kill-after=5s 20s "$NEXT_BIN" version 2>&1) \
            && [[ "$NEXT_VERSION_OUTPUT" != *$'\n'* && "$NEXT_VERSION_OUTPUT" =~ $VERSION_PATTERN ]] \
            && [ "${BASH_REMATCH[1]}" = "$LATEST" ]; then
            NEXT_REPORTED="${BASH_REMATCH[1]}"
          fi
          printf '%s\n' "$NEXT_VERSION_OUTPUT"
          NEXT_HELP_OK=0
          if NEXT_HELP_OUTPUT=$(timeout --kill-after=5s 20s "$NEXT_BIN" --help 2>&1) \
            && grep -Eq '^Usage:' <<< "$NEXT_HELP_OUTPUT" \
            && grep -Eq '^[[:space:]]+metricbeat([[:space:]]|$)' <<< "$NEXT_HELP_OUTPUT" \
            && grep -Eq '^Available Commands:' <<< "$NEXT_HELP_OUTPUT"; then
            NEXT_HELP_OK=1
          fi
          printf '%s\n' "$NEXT_HELP_OUTPUT"
          NEXT_CONFIG_OK=0
          NEXT_MODULES_OK=0
          if NEXT_CONFIG_OUTPUT=$(timeout --kill-after=5s 30s "$NEXT_BIN" test config \
            --path.home "$EXTRACTED_DIR" --path.config "$EXTRACTED_DIR" -c "$NEXT_CONFIG" 2>&1) \
            && grep -Fxq 'Config OK' <<< "$NEXT_CONFIG_OUTPUT"; then
            NEXT_CONFIG_OK=1
          fi
          printf '%s\n' "$NEXT_CONFIG_OUTPUT"
          if NEXT_MODULES_OUTPUT=$(timeout --kill-after=5s 30s "$NEXT_BIN" modules list \
            --path.home "$EXTRACTED_DIR" --path.config "$EXTRACTED_DIR" -c "$NEXT_CONFIG" 2>&1) \
            && grep -Fxq 'Enabled:' <<< "$NEXT_MODULES_OUTPUT" \
            && grep -Fxq 'Disabled:' <<< "$NEXT_MODULES_OUTPUT" \
            && grep -Fxq 'system' <<< "$NEXT_MODULES_OUTPUT"; then
            NEXT_MODULES_OK=1
          fi
          printf '%s\n' "$NEXT_MODULES_OUTPUT"

          if [ "$NEXT_REPORTED" = "$LATEST" ] \
            && [ "$NEXT_HELP_OK" -eq 1 ] \
            && [ "$NEXT_CONFIG_OK" -eq 1 ] \
            && [ "$NEXT_MODULES_OK" -eq 1 ] \
            && file -b "$NEXT_BIN" | grep -Eqi "aarch64|arm64"; then
            echo "next_installed_version=$NEXT_REPORTED" >> "$GITHUB_OUTPUT"
            echo "decision=next_install_validated" >> "$GITHUB_OUTPUT"
            echo "regression_result=Next version installed successfully on Arm64" >> "$GITHUB_OUTPUT"
            echo "comparison=Current pinned Metricbeat version ${CURRENT} passed smoke tests in this run. Regression validation installed candidate version ${LATEST} on Arm64, and the extracted binary reported version ${NEXT_REPORTED} while successfully passing help, config, and modules checks." >> "$GITHUB_OUTPUT"
            echo "Next version installed on Arm64: $NEXT_REPORTED"
            echo "Regression install result: Next version installed successfully on Arm64"
            echo "Details: Current pinned Metricbeat version ${CURRENT} passed smoke tests in this run. Regression validation installed candidate version ${LATEST} on Arm64, and the extracted binary reported version ${NEXT_REPORTED} while successfully passing help, config, and modules checks."
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            file "$NEXT_BIN" || true
            echo "next_installed_version=${NEXT_REPORTED:-install_failed}" >> "$GITHUB_OUTPUT"
            echo "decision=next_install_failed" >> "$GITHUB_OUTPUT"
            echo "regression_result=Next version install failed on Arm64" >> "$GITHUB_OUTPUT"
            echo "comparison=Current pinned Metricbeat version ${CURRENT} passed smoke tests in this run, but the candidate release ${LATEST} did not validate as a usable Arm64 Metricbeat install." >> "$GITHUB_OUTPUT"
            echo "Next version installed on Arm64: ${NEXT_REPORTED:-install_failed}"
            echo "Regression install result: Next version install failed on Arm64"
            echo "Details: Current pinned Metricbeat version ${CURRENT} passed smoke tests in this run, but the candidate release ${LATEST} did not validate as a usable Arm64 Metricbeat install."
            echo "status=failed" >> "$GITHUB_OUTPUT"
            END_TIME=$(date +%s)
            echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
          trap - EXIT
      - name: Show regression validation details
        if: always()
        run: |
          REGRESSION_RESULT="${{ steps.test6.outputs.regression_result || 'Pending regression install validation' }}"
          echo "=== Regression Validation (Next Version Install) ==="
          echo "Current version tested in Tests 1-5: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}"
          echo "Next version targeted for install validation: ${{ steps.test6.outputs.latest_version || 'unknown' }}"
          echo "Next version installed on Arm64: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}"
          echo "Regression install result: ${REGRESSION_RESULT}"
          echo "Details: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}"

      - name: Calculate test summary
        if: always()
        id: summary
        run: |
          set -euo pipefail
          PASSED=0
          FAILED=0
          SKIPPED=0
          CORE_FAILED=0
          CORE_PASSED=0
          TOTAL_DURATION=0

          check_test() {
            local status="$1" outcome="$2" duration="$3" core="$4"
            if [ "$outcome" = "skipped" ] || [ "$outcome" = "cancelled" ]; then
              SKIPPED=$((SKIPPED + 1))
            elif [ "$status" = "passed" ] && [ "$outcome" = "success" ]; then
              PASSED=$((PASSED + 1))
              CORE_PASSED=$((CORE_PASSED + core))
            elif [ "$core" -eq 0 ] && [ "$status" = "skipped" ] && [ "$outcome" = "success" ] \
              && [ "${{ steps.test6.outputs.decision }}" = "baseline_failed" ]; then
              SKIPPED=$((SKIPPED + 1))
            else
              FAILED=$((FAILED + 1))
              CORE_FAILED=$((CORE_FAILED + core))
            fi
            TOTAL_DURATION=$((TOTAL_DURATION + duration))
          }
          check_test "${{ steps.test1.outputs.status }}" "${{ steps.test1.outcome || 'skipped' }}" "${{ steps.test1.outputs.duration || 0 }}" 1
          check_test "${{ steps.test2.outputs.status }}" "${{ steps.test2.outcome || 'skipped' }}" "${{ steps.test2.outputs.duration || 0 }}" 1
          check_test "${{ steps.test3.outputs.status }}" "${{ steps.test3.outcome || 'skipped' }}" "${{ steps.test3.outputs.duration || 0 }}" 1
          check_test "${{ steps.test4.outputs.status }}" "${{ steps.test4.outcome || 'skipped' }}" "${{ steps.test4.outputs.duration || 0 }}" 1
          check_test "${{ steps.test5.outputs.status }}" "${{ steps.test5.outcome || 'skipped' }}" "${{ steps.test5.outputs.duration || 0 }}" 1
          check_test "${{ steps.test6.outputs.status }}" "${{ steps.test6.outcome || 'skipped' }}" "${{ steps.test6.outputs.duration || 0 }}" 0

          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
          echo "duration=$TOTAL_DURATION" >> "$GITHUB_OUTPUT"
          echo "core_failed=$CORE_FAILED" >> "$GITHUB_OUTPUT"

          BASELINE_OK=0
          if [ "$CORE_PASSED" -eq 5 ] \
            && [ "${{ steps.install.outputs.install_status }}" = "success" ] \
            && [ "${{ steps.version.outcome }}" = "success" ] \
            && [ "${{ steps.version.outputs.version }}" = "$BASELINE_VERSION" ]; then
            BASELINE_OK=1
          fi
          if [ "$BASELINE_OK" -eq 1 ] && [ "$PASSED" -eq 6 ]; then
            echo "overall_status=success" >> "$GITHUB_OUTPUT"
          else
            echo "overall_status=failure" >> "$GITHUB_OUTPUT"
          fi

          if [ "$BASELINE_OK" -eq 1 ]; then
            echo "badge_status=passing" >> "$GITHUB_OUTPUT"
          else
            echo "badge_status=failing" >> "$GITHUB_OUTPUT"
          fi

          if [ "$BASELINE_OK" -ne 1 ] || [ "$PASSED" -ne 6 ]; then
            exit 1
          fi

      - name: Create test summary
        if: always()
        run: |
          REGRESSION_RESULT="${{ steps.test6.outputs.regression_result || 'Pending regression install validation' }}"
          echo "## Metricbeat Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status:** ${{ steps.summary.outputs.overall_status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tests Passed:** ${{ steps.summary.outputs.passed }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tests Failed:** ${{ steps.summary.outputs.failed }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tests Skipped:** ${{ steps.summary.outputs.skipped }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Duration:** ${{ steps.summary.outputs.duration || 0 }}s" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Runner:** ubuntu-24.04 (arm64)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Test Details" >> "$GITHUB_STEP_SUMMARY"
          echo "1. Test 1 - Check Metricbeat binary exists: ${{ steps.test1.outputs.status || 'skipped' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "2. Test 2 - Check Metricbeat version output: ${{ steps.test2.outputs.status || 'skipped' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "3. Test 3 - Check Metricbeat help output: ${{ steps.test3.outputs.status || 'skipped' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "4. Test 4 - Check Metricbeat configuration: ${{ steps.test4.outputs.status || 'skipped' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "5. Test 5 - List modules and verify architecture: ${{ steps.test5.outputs.status || 'skipped' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "6. Test 6 - Regression Validation: ${{ steps.test6.outputs.status || 'skipped' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Regression Validation (Next Version Install)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Current version tested in Tests 1-5:** ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Next version targeted for install validation:** ${{ steps.test6.outputs.latest_version || 'not_yet_checked' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Next version installed on Arm64:** ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Regression install result:** ${REGRESSION_RESULT}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.test6.outputs.comparison || 'Baseline or candidate validation did not complete; no successful comparison is available.' }}" >> "$GITHUB_STEP_SUMMARY"

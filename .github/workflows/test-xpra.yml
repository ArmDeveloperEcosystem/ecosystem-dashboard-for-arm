name: Test Xpra on Arm64

permissions:
  contents: read

on:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-xpra.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-xpra.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-xpra.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-xpra.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-xpra.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-xpra.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-xpra.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-xpra.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-xpra.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-xpra.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-xpra.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-xpra.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-xpra.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-xpra.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-xpra.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-xpra.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-xpra.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-xpra.outputs.regression_next_installed_version }}
      regression_policy:
        description: Regression applicability policy classification
        value: ${{ jobs.test-xpra.outputs.regression_policy }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-xpra.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-xpra.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-xpra.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-xpra.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-xpra.outputs.timestamp }}

jobs:
  test-xpra:
    runs-on: ubuntu-24.04-arm
    env:
      BASELINE_VERSION: "3.1.1"
      PACKAGE_SLUG: "xpra"
      APT_PACKAGES: "xpra xvfb xauth dbus-x11"
      PRIMARY_DEB: "xpra"
      PRIMARY_COMMAND: "xpra"
      DOWNLOAD_URL: "https://github.com/Xpra-org/xpra/wiki/Download"
      HOMEPAGE_URL: "https://github.com/Xpra-org/xpra/"
      OFFICIAL_DOCS: "https://github.com/Xpra-org/xpra/#installation"

    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'Xpra'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_applicable_package_manager' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Package-manager runtime smoke; source regression is not applicable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'not_applicable' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_applicable' }}
      regression_policy: ${{ steps.test6.outputs.policy || 'not_applicable_package_manager' }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=xpra" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/linux/opensource_packages/xpra" >> "$GITHUB_OUTPUT"

      - name: Install package from Ubuntu apt
        id: install
        run: |
          set -euo pipefail
          sudo apt-get update
          read -r -a PACKAGES <<< "$APT_PACKAGES"
          sudo apt-get install -y --no-install-recommends "${PACKAGES[@]}"
          command -v "$PRIMARY_COMMAND"
          echo "status=passed" >> "$GITHUB_OUTPUT"

      - name: Get installed package version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(dpkg-query -W -f='${Version}' "$PRIMARY_DEB")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected apt package version: $VERSION"

      - name: Test 1 - Package-manager install evidence
        id: test1
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"
          read -r -a PACKAGES <<< "$APT_PACKAGES"
          dpkg-query -W -f='${Package} ${Architecture} ${Version}\n' "${PACKAGES[@]}"
          command -v "$PRIMARY_COMMAND"
          echo "status=passed" >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 2 - Installed Arm64 package metadata
        id: test2
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"
          DOC_PATH="content/linux/opensource_packages/${PACKAGE_SLUG}.md"
          test "$(dpkg-query -W -f='${Architecture}' "$PRIMARY_DEB")" = "arm64"
          grep -Fq "works_on_arm: true" "$DOC_PATH"
          grep -Fq "download_url: $DOWNLOAD_URL" "$DOC_PATH"
          echo "status=passed" >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 3 - CLI version starts on Arm
        id: test3
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"
          xpra --version
          echo "status=passed" >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 4 - Arm64 runner gate
        id: test4
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"
          test "$(uname -m)" = "aarch64"
          test "$(dpkg --print-architecture)" = "arm64"
          echo "status=passed" >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 5 - Headless runtime smoke
        id: test5
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"
          xpra --version
          WORK=$(mktemp -d)
          XPRA_PID=""
          cleanup() {
            RESULT=$?
            if [ -n "$XPRA_PID" ] && kill -0 "$XPRA_PID" 2>/dev/null; then
              kill "$XPRA_PID"
              wait "$XPRA_PID" || true
            fi
            if [ "$RESULT" -ne 0 ]; then
              cat xpra-server.log
              if [ -f xpra-info.txt ]; then cat xpra-info.txt; fi
            fi
            rm -rf "$WORK"
            exit "$RESULT"
          }
          trap cleanup EXIT
          # Xpra 3.1.5's optional tray/clipboard GDK windows can crash on teardown.
          # This headless lifecycle smoke does not exercise desktop forwarding.
          xpra start --daemon=no --systemd-run=no --displayfd=3 \
            --socket-dir="$WORK" --socket-dirs="$WORK" --mdns=no \
            --notifications=no --pulseaudio=no --webcam=no --printing=no \
            --system-tray=no --clipboard=no \
            --xvfb='Xvfb +extension GLX +extension Composite -screen 0 800x600x24 -nolisten tcp -noreset' \
            3>"$WORK/display" >xpra-server.log 2>&1 &
          XPRA_PID=$!
          READY=false
          for _ in $(seq 1 30); do
            kill -0 "$XPRA_PID"
            if [ -s "$WORK/display" ]; then
              DISPLAY_NUM=$(tr -d '\n' < "$WORK/display")
              [[ "$DISPLAY_NUM" =~ ^[0-9]+$ ]]
              if timeout 5 xpra info ":$DISPLAY_NUM" --socket-dir="$WORK" --socket-dirs="$WORK" >xpra-info.txt 2>&1; then
                READY=true
                break
              fi
            fi
            sleep 1
          done
          test "$READY" = true
          grep -Eiq 'server|session|display|version' xpra-info.txt
          xpra version ":$DISPLAY_NUM" --socket-dir="$WORK" --socket-dirs="$WORK"
          timeout 20 xpra stop ":$DISPLAY_NUM" --socket-dir="$WORK" --socket-dirs="$WORK"
          wait "$XPRA_PID"
          XPRA_PID=""
          echo "status=passed" >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 6 - Regression validation applicability
        id: test6
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          CURRENT_VERSION="${{ steps.version.outputs.version || env.BASELINE_VERSION }}"
          echo "status=skipped" >> "$GITHUB_OUTPUT"
          echo "decision=not_applicable_package_manager" >> "$GITHUB_OUTPUT"
          echo "regression_result=Source/artifact regression is not applicable to this apt package-manager runtime smoke." >> "$GITHUB_OUTPUT"
          echo "comparison=Installed $PRIMARY_DEB from Ubuntu apt on Arm64 and ran CPU-side runtime smokes; no separate next source artifact is selected." >> "$GITHUB_OUTPUT"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "latest_version=not_applicable" >> "$GITHUB_OUTPUT"
          echo "next_installed_version=not_applicable" >> "$GITHUB_OUTPUT"
          echo "policy=not_applicable_package_manager" >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Calculate test summary
        id: summary
        if: always()
        run: |
          set -euo pipefail
          T1="${{ steps.test1.outputs.status || 'failed' }}"
          T2="${{ steps.test2.outputs.status || 'failed' }}"
          T3="${{ steps.test3.outputs.status || 'failed' }}"
          T4="${{ steps.test4.outputs.status || 'failed' }}"
          T5="${{ steps.test5.outputs.status || 'failed' }}"
          T6="${{ steps.test6.outputs.status || 'failed' }}"
          O1="${{ steps.test1.outcome || 'failure' }}"
          O2="${{ steps.test2.outcome || 'failure' }}"
          O3="${{ steps.test3.outcome || 'failure' }}"
          O4="${{ steps.test4.outcome || 'failure' }}"
          O5="${{ steps.test5.outcome || 'failure' }}"
          O6="${{ steps.test6.outcome || 'failure' }}"
          DECISION="${{ steps.test6.outputs.decision || '' }}"
          D1="${{ steps.test1.outputs.duration || '0' }}"
          D2="${{ steps.test2.outputs.duration || '0' }}"
          D3="${{ steps.test3.outputs.duration || '0' }}"
          D4="${{ steps.test4.outputs.duration || '0' }}"
          D5="${{ steps.test5.outputs.duration || '0' }}"
          D6="${{ steps.test6.outputs.duration || '0' }}"
          PASSED=0
          FAILED=0
          SKIPPED=0
          CORE_FAILED=0
          for RESULT in "$T1:$O1" "$T2:$O2" "$T3:$O3" "$T4:$O4" "$T5:$O5"; do
            if [ "$RESULT" = "passed:success" ]; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
              CORE_FAILED=$((CORE_FAILED + 1))
            fi
          done
          if [ "$T6" = "passed" ] && [ "$O6" = "success" ]; then
            PASSED=$((PASSED + 1))
          elif [ "$T6" = "skipped" ] && [ "$O6" = "success" ] && [ "$DECISION" = "not_applicable_package_manager" ]; then
            SKIPPED=1
          else
            FAILED=$((FAILED + 1))
          fi
          DURATION=$((D1 + D2 + D3 + D4 + D5 + D6))
          if [ "$FAILED" -eq 0 ]; then
            OVERALL_STATUS="success"
          else
            OVERALL_STATUS="failure"
          fi
          if [ "$FAILED" -eq 0 ]; then
            BADGE_STATUS="passing"
          else
            BADGE_STATUS="failing"
          fi
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"
          echo "core_failed=$CORE_FAILED" >> "$GITHUB_OUTPUT"
          echo "overall_status=$OVERALL_STATUS" >> "$GITHUB_OUTPUT"
          echo "badge_status=$BADGE_STATUS" >> "$GITHUB_OUTPUT"
          test "$FAILED" -eq 0

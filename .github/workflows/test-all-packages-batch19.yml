name: Test All Packages (Batch 19) on Arm64
run-name: Arm64 Batch 19 [${{ inputs.orchestration_id || format('manual-{0}-{1}', github.run_id, github.run_attempt) }}] [nonce:${{ inputs.dispatch_nonce || 'manual-only' }}]

on:
  workflow_dispatch:
    inputs:
      orchestration_id:
        description: Exact orchestrator identity; blank uses a safe manual fallback
        required: false
        default: ""
        type: string
      dispatch_nonce:
        description: Secret exact-dispatch nonce; blank is manual-only and not publishable
        required: false
        default: ""
        type: string
      expected_sha:
        description: Exact commit expected by the orchestrator
        required: false
        default: ""
        type: string
      expected_branch:
        description: Exact branch expected by the orchestrator
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      orchestration_id:
        required: true
        type: string
      dispatch_nonce:
        required: true
        type: string
      expected_sha:
        required: true
        type: string
      expected_branch:
        required: true
        type: string

permissions:
  contents: read

jobs:

  test-chef-infra:
    uses: ./.github/workflows/test-chef-infra.yml

  test-miniforge:
    uses: ./.github/workflows/test-miniforge.yml

  test-spdlog:
    uses: ./.github/workflows/test-spdlog.yml

  test-parquet:
    uses: ./.github/workflows/test-parquet.yml

  test-libconfig:
    uses: ./.github/workflows/test-libconfig.yml

  test-srs:
    uses: ./.github/workflows/test-srs.yml

  test-openldap:
    uses: ./.github/workflows/test-openldap.yml

  test-tuf:
    uses: ./.github/workflows/test-tuf.yml

  test-elastic-mockotlpserver:
    uses: ./.github/workflows/test-elastic-mockotlpserver.yml

  test-operator-framework:
    uses: ./.github/workflows/test-operator-framework.yml

  test-elastic-connector:
    uses: ./.github/workflows/test-elastic-connector.yml

  test-openfoam:
    uses: ./.github/workflows/test-openfoam.yml

  test-fastdfs:
    uses: ./.github/workflows/test-fastdfs.yml

  test-kubevela:
    uses: ./.github/workflows/test-kubevela.yml

  test-docker_compose:
    uses: ./.github/workflows/test-docker_compose.yml

  test-erlang:
    uses: ./.github/workflows/test-erlang.yml

  test-nebula_graph:
    uses: ./.github/workflows/test-nebula_graph.yml

  test-datree:
    uses: ./.github/workflows/test-Datree.yml

  test-optipng:
    uses: ./.github/workflows/test-optipng.yml

  test-jemalloc:
    uses: ./.github/workflows/test-jemalloc.yml

  test-paraview:
    uses: ./.github/workflows/test-paraview.yml

  test-nsq:
    uses: ./.github/workflows/test-nsq.yml

  test-dapr_serverless:
    uses: ./.github/workflows/test-dapr_serverless.yml

  test-drone:
    uses: ./.github/workflows/test-drone.yml

  test-iceberg:
    uses: ./.github/workflows/test-iceberg.yml

  test-irsim:
    uses: ./.github/workflows/test-irsim.yml

  test-iverilog:
    uses: ./.github/workflows/test-iverilog.yml

  test-k8s-device-plugin:
    uses: ./.github/workflows/test-k8s-device-plugin.yml

  test-kasmvnc:
    uses: ./.github/workflows/test-kasmvnc.yml

  test-kicad:
    uses: ./.github/workflows/test-kicad.yml

  test-klayout:
    uses: ./.github/workflows/test-klayout.yml

  test-langflow:
    uses: ./.github/workflows/test-langflow.yml

  test-lepton-eda:
    uses: ./.github/workflows/test-lepton-eda.yml

  test-librecad:
    uses: ./.github/workflows/test-librecad.yml

  test-librepcb:
    uses: ./.github/workflows/test-librepcb.yml

  test-lima:
    uses: ./.github/workflows/test-lima.yml

  test-lime:
    uses: ./.github/workflows/test-lime.yml

  test-litex:
    uses: ./.github/workflows/test-litex.yml

  test-llm-d:
    uses: ./.github/workflows/test-llm-d.yml

  test-magic:
    uses: ./.github/workflows/test-magic.yml

  test-manipulapy:
    uses: ./.github/workflows/test-manipulapy.yml

  test-mdl-sdk:
    uses: ./.github/workflows/test-mdl-sdk.yml

  test-mediamtx:
    uses: ./.github/workflows/test-mediamtx.yml

  test-megatron-core:
    uses: ./.github/workflows/test-megatron-core.yml

  test-metaflow:
    uses: ./.github/workflows/test-metaflow.yml

  summary:
    permissions:
      actions: read
      contents: read
    needs:
      [
        test-chef-infra,
        test-miniforge,
        test-spdlog,
        test-parquet,
        test-libconfig,
        test-srs,
        test-openldap,
        test-tuf,
        test-elastic-mockotlpserver,
        test-operator-framework,
        test-elastic-connector,
        test-openfoam,
        test-fastdfs,
        test-kubevela,
        test-docker_compose,
        test-erlang,
        test-nebula_graph,
        test-datree,
        test-optipng,
        test-jemalloc,
        test-paraview,
        test-nsq,
        test-dapr_serverless,
        test-drone,
        test-iceberg,
        test-irsim,
        test-iverilog,
        test-k8s-device-plugin,
        test-kasmvnc,
        test-kicad,
        test-klayout,
        test-langflow,
        test-lepton-eda,
        test-librecad,
        test-librepcb,
        test-lima,
        test-lime,
        test-litex,
        test-llm-d,
        test-magic,
        test-manipulapy,
        test-mdl-sdk,
        test-mediamtx,
        test-megatron-core,
        test-metaflow
      ]
    runs-on: ubuntu-24.04-arm
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # original: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Collect batch results
        id: collect
        uses: ./.github/actions/collect-batch-results
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        with:
          batch_number: "19"
          batch_title: "Batch 19"

      - name: Attest complete batch results
        id: attest
        if: steps.collect.outcome == 'success'
        env:
          ARTIFACT_NAME: batch19-test-results
          BATCH_NUMBER: "19"
          COLLECTOR_JSON_COUNT: ${{ steps.collect.outputs.json_count }}
          CURRENT_BRANCH: ${{ github.ref_name }}
          DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
          EXPECTED_BRANCH: ${{ inputs.expected_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          NEEDS_JSON: ${{ toJson(needs) }}
          ORCHESTRATION_ID: ${{ inputs.orchestration_id }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/batch_artifact_attestation.py create \
            --results-root test-results \
            --workflow-file ".github/workflows/test-all-packages-batch19.yml" \
            --batch "$BATCH_NUMBER" \
            --repository "$REPOSITORY" \
            --expected-branch "$EXPECTED_BRANCH" \
            --current-branch "$CURRENT_BRANCH" \
            --expected-sha "$EXPECTED_SHA" \
            --workflow-sha "$WORKFLOW_SHA" \
            --orchestration-id "$ORCHESTRATION_ID" \
            --dispatch-nonce "$DISPATCH_NONCE" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --artifact-name "$ARTIFACT_NAME" \
            --collector-json-count "$COLLECTOR_JSON_COUNT" \
            --needs-environment-variable NEEDS_JSON

      - name: Upload batch test results
        if: steps.collect.outcome == 'success' && steps.attest.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # original: actions/upload-artifact@v4.6.2
        with:
          name: batch19-test-results
          path: test-results
          retention-days: 90

name: Test BenchmarkSQL on Arm64

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-benchmarksql.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-benchmarksql.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-benchmarksql.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-benchmarksql.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-benchmarksql.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-benchmarksql.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-benchmarksql.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-benchmarksql.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-benchmarksql.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-benchmarksql.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-benchmarksql.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-benchmarksql.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-benchmarksql.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-benchmarksql.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-benchmarksql.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-benchmarksql.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-benchmarksql.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-benchmarksql.outputs.regression_next_installed_version }}
      regression_policy:
        description: Regression applicability policy for this workflow
        value: ${{ jobs.test-benchmarksql.outputs.regression_policy }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-benchmarksql.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-benchmarksql.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-benchmarksql.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-benchmarksql.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-benchmarksql.outputs.timestamp }}
jobs:
  test-benchmarksql:
    runs-on: ubuntu-24.04-arm
    env:
      BENCHMARKSQL_BASELINE_VERSION: "REL6_0_RC2"
      BENCHMARKSQL_SOURCE_URL: "https://github.com/wieck/benchmarksql.git"
      # Original pgsql-io tag/commit recorded by run 38791056402, job 116615422752.
      BENCHMARKSQL_TAG_OBJECT: "dfaeb8482add83b8fa6d61b2cad9f8906c05315c"
      BENCHMARKSQL_COMMIT: "98f5cb4b446f4296ca5e85ad27303482a6bbd624"
      BENCHMARKSQL_TREE: "3841f1cc53553613e5c80386965d645f97c9a9c4"
      GIT_TERMINAL_PROMPT: "0"
    
    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'BenchmarkSQL'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.summary.outputs.regression_status || 'failed' }}
      regression_decision: ${{ steps.summary.outputs.regression_decision || 'next_regression_failed' }}
      regression_result: ${{ steps.summary.outputs.regression_result || 'Regression validation did not complete.' }}
      regression_comparison: ${{ steps.summary.outputs.regression_comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      regression_policy: "applicable"
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false
      
      - name: Set test metadata
        id: metadata
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=benchmarksql" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/opensource_packages/benchmarksql" >> "$GITHUB_OUTPUT"
      - name: Install Dependencies
        run: |
          bash .github/actions/apt-bootstrap/bootstrap.sh --packages "maven openjdk-17-jdk git"
      - name: Install BenchmarkSQL
        id: install
        run: |
          set -euo pipefail
          echo "Installing BenchmarkSQL..."
          
          git init benchmarksql
          git -C benchmarksql remote add origin "$BENCHMARKSQL_SOURCE_URL"
          git -C benchmarksql fetch --depth 1 --no-tags origin \
            "refs/tags/${BENCHMARKSQL_BASELINE_VERSION}:refs/tags/${BENCHMARKSQL_BASELINE_VERSION}"
          cd benchmarksql
          test "$(git rev-parse "refs/tags/${BENCHMARKSQL_BASELINE_VERSION}")" = "$BENCHMARKSQL_TAG_OBJECT"
          test "$(git rev-parse "refs/tags/${BENCHMARKSQL_BASELINE_VERSION}^{commit}")" = "$BENCHMARKSQL_COMMIT"
          git checkout --detach "$BENCHMARKSQL_COMMIT"
          test "$(git rev-parse HEAD)" = "$BENCHMARKSQL_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$BENCHMARKSQL_TREE"
          echo "Verified original ${BENCHMARKSQL_BASELINE_VERSION}: tag=${BENCHMARKSQL_TAG_OBJECT} commit=${BENCHMARKSQL_COMMIT} tree=${BENCHMARKSQL_TREE}"
          export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          echo "Using JAVA_HOME=${JAVA_HOME}"
          export PATH="${JAVA_HOME}/bin:${PATH}"
          
          # Build with Maven (REL6_0_RC2 repository layout)
          if mvn -B package >/tmp/benchmarksql-build.log 2>&1; then
             echo "BenchmarkSQL build successful"
             echo "install_status=success" >> $GITHUB_OUTPUT
          else
             echo "BenchmarkSQL build failed"
             cat /tmp/benchmarksql-build.log || true
             echo "install_status=failed" >> $GITHUB_OUTPUT
             exit 1
          fi
      
      - name: Get BenchmarkSQL version
        id: version
        run: |
          set -euo pipefail
          test "$(git -C benchmarksql rev-parse HEAD)" = "$BENCHMARKSQL_COMMIT"
          test "$(git -C benchmarksql rev-parse 'HEAD^{tree}')" = "$BENCHMARKSQL_TREE"
          OBSERVED_TAG="$(git -C benchmarksql describe --tags --exact-match HEAD)"
          test "$OBSERVED_TAG" = "$BENCHMARKSQL_BASELINE_VERSION"
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("benchmarksql/pom.xml").getroot()
          ns = {"m": "http://maven.apache.org/POM/4.0.0"}
          identity = tuple(root.findtext("m:" + name, namespaces=ns) for name in ("groupId", "artifactId", "version"))
          if identity != ("com.github.pgsql-io", "benchmarksql", "6.0.0"):
              raise SystemExit("Pinned BenchmarkSQL POM identity does not match")
          print("Observed upstream POM version: 6.0.0 (release tag REL6_0_RC2)")
          PY
          echo "version=${OBSERVED_TAG}" >> "$GITHUB_OUTPUT"
          echo "Detected BenchmarkSQL release tag: ${OBSERVED_TAG}"
      
      - name: Test 1 - Check runBenchmark.sh script
        id: test1
        continue-on-error: true
        run: |
          START_TIME=$(date +%s)
          
          if [ -f "benchmarksql/src/main/resources/runBenchmark.sh" ]; then
            echo "✓ runBenchmark.sh found"
            echo "status=passed" >> $GITHUB_OUTPUT
          else
            echo "✗ runBenchmark.sh not found"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
            fi
          
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT
      
      - name: Test 2 - Check Java Dependency
        id: test2
        continue-on-error: true
        run: |
          START_TIME=$(date +%s)
          
          if java -version 2>&1 | grep -q "version"; then
            echo "✓ Java is installed"
            echo "status=passed" >> $GITHUB_OUTPUT
          else
            echo "✗ Java not found"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
            fi
          
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT
      
      - name: Test 3 - Check Script Usage (Dry Run)
        id: test3
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          
          cd benchmarksql/src/main/resources
          chmod +x runBenchmark.sh
          
          # Running without args should show usage or fail gracefully
          ./runBenchmark.sh > /tmp/benchmarksql-usage.out 2>&1 || true
          cat /tmp/benchmarksql-usage.out || true
          
          if grep -Eqi "usage|properties" /tmp/benchmarksql-usage.out; then
             echo "✓ runBenchmark.sh runs and shows usage"
             echo "status=passed" >> $GITHUB_OUTPUT
          else
             # It might fail with specific error about properties file, which is also a sign it ran
             if grep -qi "FATAL" /tmp/benchmarksql-usage.out; then
                echo "✓ runBenchmark.sh ran (reported fatal error as expected without config)"
                echo "status=passed" >> $GITHUB_OUTPUT
            else
                echo "✗ runBenchmark.sh failed unexpectedly"
                echo "status=failed" >> $GITHUB_OUTPUT
                exit 1
            fi
          fi
          
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT

      
      - name: Test 4 - Architecture Verification
        id: test4
        continue-on-error: true
        run: |
          START_TIME=$(date +%s)
          
          echo "Checking system architecture..."
          ARCH=$(uname -m)
          if [ "$ARCH" = "aarch64" ]; then
            echo "✓ System architecture is ARM64 ($ARCH)"
            echo "status=passed" >> $GITHUB_OUTPUT
          else
            echo "✗ System architecture is NOT ARM64 ($ARCH)"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT

      - name: Test 5 - Built Java data-generation and launcher smoke
        id: test5
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          # Bounded built-Java and launcher smoke, not a database benchmark.
          test -s benchmarksql/target/BenchmarkSQL.jar
          test -f benchmarksql/target/run/runBenchmark.sh
          CODE=0
          (cd benchmarksql/target/run && bash ./runBenchmark.sh) > /tmp/benchmarksql-functional.out 2>&1 || CODE=$?
          cat /tmp/benchmarksql-functional.out
          if [ "$CODE" -ne 2 ] || ! grep -Fxq "usage: runBenchmark.sh PROPS_FILE" /tmp/benchmarksql-functional.out; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          SMOKE_DIR="$(mktemp -d)"
          trap 'rm -rf "$SMOKE_DIR"' EXIT
          cat > "$SMOKE_DIR/BenchmarkSqlDataSmoke.java" <<'JAVA'
          import com.github.pgsqlio.benchmarksql.jtpcc.jTPCCRandom;
          import java.nio.file.Paths;

          public class BenchmarkSqlDataSmoke {
              private static int checks;
              private static void check(boolean value, String label) {
                  if (!value) throw new AssertionError(label);
                  checks++;
              }
              public static void main(String[] args) throws Exception {
                  check(Paths.get(jTPCCRandom.class.getProtectionDomain().getCodeSource().getLocation().toURI())
                      .toRealPath().equals(Paths.get(args[0]).toRealPath()), "class loaded from built BenchmarkSQL jar");
                  jTPCCRandom random = new jTPCCRandom();
                  check(random.getCLast(0).equals("BARBARBAR"), "last-name 0");
                  check(random.getCLast(123).equals("OUGHTABLEPRI"), "last-name 123");
                  check(random.getCLast(999).equals("EINGEINGEING"), "last-name 999");
                  check(random.nextInt(7, 7) == 7, "fixed integer");
                  check(random.nextLong(9, 9) == 9, "fixed long");
                  for (int i = 0; i < 256; i++) {
                      int integer = random.nextInt(1, 10);
                      check(integer >= 1 && integer <= 10, "integer range");
                      long value = random.nextLong(1, 100);
                      check(value >= 1 && value <= 100, "long range");
                      double fraction = random.nextDouble(0.0, 1.0);
                      check(fraction >= 0.0 && fraction < 1.0, "double range");
                      check(random.getAString(8, 16).matches("[A-Za-z][A-Za-z0-9]{7,15}"), "alpha string");
                      check(random.getNString(8, 8).matches("[0-9]{8}"), "numeric string");
                      check(random.getState().matches("[A-Z]{2}"), "state string");
                      int item = random.getItemID();
                      check(item >= 1 && item <= 100000, "item ID");
                      int customer = random.getCustomerID();
                      check(customer >= 1 && customer <= 3000, "customer ID");
                  }
                  System.out.println("BenchmarkSQL built-Java data smoke passed: " + checks + " assertions; no database benchmark");
              }
          }
          JAVA
          CLASSPATH="benchmarksql/target/BenchmarkSQL.jar:benchmarksql/target/lib/*"
          javac -cp "$CLASSPATH" -d "$SMOKE_DIR" "$SMOKE_DIR/BenchmarkSqlDataSmoke.java"
          timeout --signal=TERM --kill-after=5s 30s java -cp "$SMOKE_DIR:$CLASSPATH" \
            BenchmarkSqlDataSmoke benchmarksql/target/BenchmarkSQL.jar
          echo "Built launcher returned expected usage and exit 2; built Java data generation passed. No database or TPC-C performance run was executed."
          echo "status=passed" >> "$GITHUB_OUTPUT"

          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT

      - name: Test 6 - Regression Validation
        id: test6
        if: >-
          ${{ success() && steps.test1.outcome == 'success' && steps.test1.outputs.status == 'passed' &&
              steps.test2.outcome == 'success' && steps.test2.outputs.status == 'passed' &&
              steps.test3.outcome == 'success' && steps.test3.outputs.status == 'passed' &&
              steps.test4.outcome == 'success' && steps.test4.outputs.status == 'passed' &&
              steps.test5.outcome == 'success' && steps.test5.outputs.status == 'passed' }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import time
          from pathlib import Path

          started = time.monotonic()
          current = os.environ["BENCHMARKSQL_BASELINE_VERSION"]
          fields = {"status": "failed", "decision": "next_regression_failed",
                    "current_version": current, "latest_version": "unknown",
                    "next_installed_version": "not_installed"}
          try:
              response = subprocess.run(
                  ["git", "ls-remote", "--tags", "--refs", os.environ["BENCHMARKSQL_SOURCE_URL"]],
                  check=True, text=True, capture_output=True, timeout=60)
              tags = {}
              for line in response.stdout.splitlines():
                  match = re.fullmatch(r"([0-9a-f]{40})\trefs/tags/(REL[0-9]+_[0-9]+(?:_[0-9]+)?(?:_RC[0-9]+)?)", line)
                  if not match or match[2] in tags:
                      raise ValueError("Release inventory contains an unrecognized or duplicate tag")
                  tags[match[2]] = match[1]
              if tags.get(current) != os.environ["BENCHMARKSQL_TAG_OBJECT"]:
                  raise ValueError("Release inventory does not contain the original pinned baseline tag object")

              def version(tag):
                  match = re.fullmatch(r"REL([0-9]+)_([0-9]+)(?:_([0-9]+))?(?:_RC([0-9]+))?", tag)
                  major, minor, patch, rc = match.groups()
                  return (int(major), int(minor), int(patch or 0), rc is None, int(rc or 0))

              latest = max(tags, key=version)
              fields["latest_version"] = latest
              if version(latest) > version(current):
                  raise ValueError(f"Newer public tag {latest} requires candidate build and smoke validation; neither was completed")
              fields.update(status="skipped", decision="no_newer_stable_available")
              fields["regression_result"] = f"Checked {len(tags)} public maintainer tags; no release newer than {current} was available."
              fields["comparison"] = (
                  "Baseline uses the original pgsql-io tag and commit retained by upstream developer wieck. "
                  "Test 6 checked the live wieck/benchmarksql tag inventory; no candidate was installed or executed. "
                  "Baseline scope is build, Java data generation, launcher usage, and native architecture, not a database benchmark.")
          except (ValueError, subprocess.SubprocessError, OSError) as error:
              fields["regression_result"] = "Regression validation incomplete: " + str(error)
              fields["comparison"] = "No candidate was built or validated; source lookup or newer-release review must be resolved before a green result."
          fields["duration"] = str(int(time.monotonic() - started))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              for key, value in fields.items():
                  output.write(f"{key}={str(value).replace(chr(10), ' ')}\n")
          print(fields["regression_result"])
          print(fields["comparison"])
          raise SystemExit(1 if fields["status"] == "failed" else 0)
          PY
      - name: Show regression validation details
        if: always()
        run: |
          echo "=== Regression Validation (Next Version Install) ==="
          echo "Current version tested in Tests 1-5: ${{ steps.test6.outputs.current_version || 'n/a' }}"
          echo "Next version targeted for install validation: ${{ steps.test6.outputs.latest_version || 'n/a' }}"
          echo "Regression install result: ${{ steps.test6.outputs.regression_result || 'n/a' }}"
          echo "Details: ${{ steps.test6.outputs.comparison || 'n/a' }}"
      - name: Calculate test summary
        if: always()
        id: summary
        env:
          TEST1: ${{ steps.test1.outputs.status }}
          TEST2: ${{ steps.test2.outputs.status }}
          TEST3: ${{ steps.test3.outputs.status }}
          TEST4: ${{ steps.test4.outputs.status }}
          TEST5: ${{ steps.test5.outputs.status }}
          OUTCOME1: ${{ steps.test1.outcome }}
          OUTCOME2: ${{ steps.test2.outcome }}
          OUTCOME3: ${{ steps.test3.outcome }}
          OUTCOME4: ${{ steps.test4.outcome }}
          OUTCOME5: ${{ steps.test5.outcome }}
          DURATION1: ${{ steps.test1.outputs.duration || '0' }}
          DURATION2: ${{ steps.test2.outputs.duration || '0' }}
          DURATION3: ${{ steps.test3.outputs.duration || '0' }}
          DURATION4: ${{ steps.test4.outputs.duration || '0' }}
          DURATION5: ${{ steps.test5.outputs.duration || '0' }}
          DURATION6: ${{ steps.test6.outputs.duration || '0' }}
          REGRESSION_STATUS: ${{ steps.test6.outputs.status }}
          REGRESSION_OUTCOME: ${{ steps.test6.outcome }}
          REGRESSION_DECISION: ${{ steps.test6.outputs.decision }}
          REGRESSION_RESULT: ${{ steps.test6.outputs.regression_result }}
          REGRESSION_COMPARISON: ${{ steps.test6.outputs.comparison }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          passed = sum(os.environ[f"TEST{i}"] == "passed" and os.environ[f"OUTCOME{i}"] == "success" for i in range(1, 6))
          core_failed = 5 - passed
          status = os.environ["REGRESSION_STATUS"]
          decision = os.environ["REGRESSION_DECISION"]
          result = os.environ["REGRESSION_RESULT"]
          comparison = os.environ["REGRESSION_COMPARISON"]
          if core_failed:
              status, decision = "skipped", "baseline_failed"
              result = "Baseline validation failed or did not complete; candidate validation was not accepted."
          elif not (status == "skipped" and decision == "no_newer_stable_available" and
                    os.environ["REGRESSION_OUTCOME"] == "success" and result and comparison):
              status, decision = "failed", "next_regression_failed"
              result = "Regression validation incomplete or failed. " + result
          failed = core_failed + (status == "failed")
          fields = {
              "passed": passed, "failed": failed, "skipped": int(status == "skipped"),
              "core_failed": core_failed,
              "duration": sum(int(os.environ[f"DURATION{i}"]) for i in range(1, 7)),
              "overall_status": "failure" if failed else "success",
              "badge_status": "failing" if failed else "passing",
              "regression_status": status, "regression_decision": decision,
              "regression_result": result, "regression_comparison": comparison,
          }
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              for key, value in fields.items():
                  output.write(f"{key}={str(value).replace(chr(10), ' ')}\n")
          print(f"BenchmarkSQL checks: {passed} passed, {failed} failed, {fields['skipped']} skipped; {decision}")
          raise SystemExit(1 if failed else 0)
          PY
      - name: Create test summary
        if: always()
        run: |
          echo "## BenchmarkSQL Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ steps.summary.outputs.overall_status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests Passed:** ${{ steps.summary.outputs.passed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests Failed:** ${{ steps.summary.outputs.failed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Duration:** ${{ steps.summary.outputs.duration || 0 }}s" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner:** ubuntu-24.04 (arm64)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Details" >> $GITHUB_STEP_SUMMARY
          echo "1. Check runBenchmark.sh script: ${{ steps.test1.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "2. Check Java Dependency: ${{ steps.test2.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "3. Check Script Usage (Dry Run): ${{ steps.test3.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY

          echo "4. Test 4 - Architecture Verification: ${{ steps.test4.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "5. Test 5 - Functional Validation: ${{ steps.test5.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "6. Regression Validation: ${{ steps.test6.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Regression Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Current version:** ${{ steps.test6.outputs.current_version || 'n/a' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Next version:** ${{ steps.test6.outputs.latest_version || 'n/a' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Result:** ${{ steps.test6.outputs.regression_result || 'n/a' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Details:** ${{ steps.test6.outputs.comparison || 'n/a' }}" >> $GITHUB_STEP_SUMMARY

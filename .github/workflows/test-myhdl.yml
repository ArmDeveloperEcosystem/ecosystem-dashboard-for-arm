name: Test MyHDL on Arm64

permissions:
  contents: read

on:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-myhdl.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-myhdl.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-myhdl.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-myhdl.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-myhdl.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-myhdl.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-myhdl.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-myhdl.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-myhdl.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-myhdl.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-myhdl.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-myhdl.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-myhdl.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-myhdl.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-myhdl.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-myhdl.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-myhdl.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-myhdl.outputs.regression_next_installed_version }}
      regression_policy:
        description: Regression applicability policy classification
        value: ${{ jobs.test-myhdl.outputs.regression_policy }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-myhdl.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-myhdl.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-myhdl.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-myhdl.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-myhdl.outputs.timestamp }}

jobs:
  test-myhdl:
    runs-on: ubuntu-24.04-arm
    env:
      BASELINE_VERSION: "0.8"
      PACKAGE_SLUG: "myhdl"
      LANE_KIND: "github release / source-build-or-tarball"
      DOWNLOAD_URL: "https://github.com/myhdl/myhdl/tags"
      HOMEPAGE_URL: "https://www.myhdl.org/"
      OFFICIAL_DOCS: "https://www.myhdl.org/start/installation.html"
      GITHUB_REPO: "myhdl/myhdl"
      TEST1_COMMAND: >-
        test -f README.txt && test -f setup.py && test -d myhdl && test -d example && test "$RESOLVED_TAG" = "0.8"
      TEST2_COMMAND: >-
        test "$RESOLVED_TAG" = "0.8" && grep -Eqi "version|myhdl" setup.py
      TEST3_COMMAND: >-
        test -d doc && test -d example && grep -Fq 'Simulation' example/manual/hello1.py
      PINNED_CONTAINER_IMAGE_MYHDL: python@sha256:d8fac68ebdc45b8d66d53f1ed6c1532da81109a8f5532a6ca0c951ed31107d70 # original: python:2.7.18-buster
      MYHDL_BASELINE_URL: https://files.pythonhosted.org/packages/5e/c5/5abde567ec2501afb3dbec65172577d02ef68223910cfe29d7c3af10ca17/myhdl-0.8.tar.gz
      MYHDL_BASELINE_SHA256: fe69b3c834225bdb7348f7b86160bbc3368d14a90191cd49d063b7a751b4b5e1
      MYHDL_SIMULATION: |
        from __future__ import print_function
        import os
        import platform
        import myhdl
        from myhdl import Signal, intbv, delay, instance, always_comb, always
        from myhdl import Simulation, StopSimulation

        assert platform.machine() == "aarch64", platform.machine()
        assert myhdl.__version__ == os.environ["EXPECTED_VERSION"], myhdl.__version__
        assert os.path.realpath(myhdl.__file__).startswith("/tmp/site/"), myhdl.__file__

        def bench():
            a, b = Signal(intbv(0)[4:]), Signal(intbv(0)[4:])
            total = Signal(intbv(0)[5:])
            clock = Signal(bool(0))
            count = Signal(intbv(0)[4:])

            @always_comb
            def adder():
                total.next = a + b

            @always(clock.posedge)
            def counter():
                count.next = (count + 1) % 16

            @instance
            def stimulus():
                for left in range(16):
                    for right in range(16):
                        a.next, b.next = left, right
                        yield delay(1)
                        assert int(total) == left + right, (left, right, int(total))
                for tick in range(32):
                    clock.next = True
                    yield delay(1)
                    assert int(count) == (tick + 1) % 16, (tick, int(count))
                    clock.next = False
                    yield delay(1)
                    assert int(count) == (tick + 1) % 16
                raise StopSimulation

            return adder, counter, stimulus

        Simulation(bench()).run()
        print("myhdl-simulation-ok version=%s adder_cases=256 counter_edges=32 wraps=2" % myhdl.__version__)

    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'MyHDL'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      regression_policy: "applicable"
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python for runtime smoke
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # original: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set test metadata
        id: metadata
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=myhdl" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/linux/opensource_packages/myhdl" >> "$GITHUB_OUTPUT"

      - name: Bootstrap baseline dependencies
        uses: ./.github/actions/apt-bootstrap
        with:
          packages: "git curl jq tar unzip file ca-certificates python3-venv"
          extra_packages: "${{ env.EXTRA_APT_PACKAGES }}"
          quiet: "true"

      - name: Install baseline source and verified runtime archive
        id: install
        shell: bash
        run: |
          set -euo pipefail
          test "$BASELINE_VERSION" = "0.8"
          git clone --depth 1 --branch "$BASELINE_VERSION" "https://github.com/$GITHUB_REPO.git" baseline-src
          test "$(git -C baseline-src describe --tags --exact-match HEAD)" = "$BASELINE_VERSION"
          git -C baseline-src rev-parse HEAD
          mkdir -p baseline-runtime
          curl --fail --location --retry 3 "$MYHDL_BASELINE_URL" -o baseline-runtime/myhdl.tar.gz
          printf '%s  %s\n' "$MYHDL_BASELINE_SHA256" baseline-runtime/myhdl.tar.gz | sha256sum --check -
          echo "resolved_tag=$BASELINE_VERSION" >> "$GITHUB_OUTPUT"
          echo "install_mode=github_source" >> "$GITHUB_OUTPUT"
          echo "install_status=success" >> "$GITHUB_OUTPUT"
      - name: Get baseline version
        id: version
        run: |
          echo "version=$BASELINE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected baseline version: $BASELINE_VERSION"

      - name: Test 1 - Check package-specific baseline markers
        id: test1
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"
          START_TIME=$(date +%s)
          STATUS=failed
          finish() {
            RC=$?
            trap - EXIT
            if [ "$RC" -ne 0 ]; then STATUS=failed; fi
            echo "status=$STATUS" >> "$GITHUB_OUTPUT"
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap finish EXIT
          MODE="${{ steps.install.outputs.install_mode || '' }}"
          RESOLVED_TAG="${{ steps.install.outputs.resolved_tag || '' }}"
          INSTALL_STATUS="${{ steps.install.outputs.install_status || 'failed' }}"
          DOC_PATH="content/linux/opensource_packages/${PACKAGE_SLUG}.md"
          if [ "$INSTALL_STATUS" != "success" ]; then
            exit 1
          fi
          if [ "$MODE" = "github_source" ]; then
            cd baseline-src
          fi
          eval "$TEST1_COMMAND"
          if [ "$MODE" = "github_source" ] && [ "$RESOLVED_TAG" = "default_branch" ]; then
            echo "note=Upstream source smoke used the default branch because no exact source tag matched the published baseline version." >> "$GITHUB_OUTPUT"
          fi
          STATUS=passed
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
      - name: Test 2 - Check package-specific version and release evidence
        id: test2
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"
          START_TIME=$(date +%s)
          STATUS=failed
          finish() {
            RC=$?
            trap - EXIT
            if [ "$RC" -ne 0 ]; then STATUS=failed; fi
            echo "status=$STATUS" >> "$GITHUB_OUTPUT"
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap finish EXIT
          MODE="${{ steps.install.outputs.install_mode || '' }}"
          RESOLVED_TAG="${{ steps.install.outputs.resolved_tag || '' }}"
          DOC_PATH="content/linux/opensource_packages/${PACKAGE_SLUG}.md"
          if [ "$MODE" = "github_source" ]; then
            cd baseline-src
          fi
          if [ -n "${TEST2_COMMAND:-}" ]; then
            eval "$TEST2_COMMAND"
          else
            export DOC_PATH BASELINE_VERSION DOWNLOAD_URL
            python3 -c "from pathlib import Path; import os; text=Path(os.environ['DOC_PATH']).read_text(); version=os.environ['BASELINE_VERSION']; download=os.environ['DOWNLOAD_URL']; assert f'version_number: {version}' in text; assert f'download_url: {download}' in text"
          fi
          STATUS=passed
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
      - name: Test 3 - Check package-specific docs and entrypoints
        id: test3
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"
          START_TIME=$(date +%s)
          STATUS=failed
          finish() {
            RC=$?
            trap - EXIT
            if [ "$RC" -ne 0 ]; then STATUS=failed; fi
            echo "status=$STATUS" >> "$GITHUB_OUTPUT"
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap finish EXIT
          MODE="${{ steps.install.outputs.install_mode || '' }}"
          DOC_PATH="content/linux/opensource_packages/${PACKAGE_SLUG}.md"
          if [ "$MODE" = "github_source" ]; then
            cd baseline-src
          fi
          eval "$TEST3_COMMAND"
          STATUS=passed
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
      - name: Test 4 - Architecture Verification
        id: test4
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"
          START_TIME=$(date +%s)
          STATUS=failed
          finish() {
            RC=$?
            trap - EXIT
            if [ "$RC" -ne 0 ]; then STATUS=failed; fi
            echo "status=$STATUS" >> "$GITHUB_OUTPUT"
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap finish EXIT
          DOC_PATH="content/linux/opensource_packages/${PACKAGE_SLUG}.md"
          test "$(uname -m)" = "aarch64"
          grep -Fq "works_on_arm: true" "$DOC_PATH"
          if [ -n "${TEST4_COMMAND:-}" ]; then
            eval "$TEST4_COMMAND"
          fi
          STATUS=passed
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
      - name: Test 5 - Simulate MyHDL 0.8 in isolated Python 2.7
        id: test5
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"
          START_TIME=$(date +%s)
          STATUS=failed
          WORKDIR=""
          CONTAINER=""
          finish() {
            RC=$?
            trap - EXIT
            if [ -n "$CONTAINER" ]; then sudo docker rm -f "$CONTAINER" >/dev/null 2>&1 || true; fi
            if [ -n "$WORKDIR" ]; then rm -rf "$WORKDIR"; fi
            if [ "$RC" -ne 0 ]; then STATUS=failed; fi
            echo "status=$STATUS" >> "$GITHUB_OUTPUT"
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap finish EXIT
          WORKDIR=$(mktemp -d "${RUNNER_TEMP}/myhdl-baseline.XXXXXX")
          CONTAINER="myhdl-baseline-$(basename "$WORKDIR")"
          test "$BASELINE_VERSION" = "0.8"
          sudo docker pull --platform linux/arm64 "$PINNED_CONTAINER_IMAGE_MYHDL"
          printf '%s  %s\n' "$MYHDL_BASELINE_SHA256" baseline-runtime/myhdl.tar.gz | sha256sum --check -
          cp baseline-runtime/myhdl.tar.gz "$WORKDIR/myhdl.tar.gz"
          printf '%s\n' "$MYHDL_SIMULATION" > "$WORKDIR/smoke.py"
          echo "MyHDL baseline container: $CONTAINER"
          timeout --signal=TERM --kill-after=15s 180s sudo docker run --rm --pull=never \
            --name "$CONTAINER" --platform linux/arm64 --network none --read-only \
            --user "$(id -u):$(id -g)" \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 \
            --cpus 2 --memory 1g --memory-swap 1g --tmpfs /tmp:rw,nosuid,size=256m \
            -e HOME=/tmp -e PYTHONDONTWRITEBYTECODE=1 -e EXPECTED_VERSION="$BASELINE_VERSION" \
            -e AWS_EC2_METADATA_DISABLED=true -v "$WORKDIR:/inputs:ro" -w /tmp \
            "$PINNED_CONTAINER_IMAGE_MYHDL" bash -e -o pipefail -c '
              python --version
              python -m pip install --no-index --no-deps --no-build-isolation --target /tmp/site /inputs/myhdl.tar.gz
              PYTHONPATH=/tmp/site python /inputs/smoke.py
            '
          STATUS=passed
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
      - name: Test 6 - Regression Validation
        id: test6
        uses: ./.github/actions/generic-source-regression-check
        with:
          baseline_version: ${{ steps.version.outputs.version || env.BASELINE_VERSION }}
          github_repo: ${{ env.GITHUB_REPO }}
          lane_kind: ${{ env.LANE_KIND }}
          limited_cpu_probe: |
            python -m venv myhdl-next-venv
            . myhdl-next-venv/bin/activate
            python -m pip install --index-url https://pypi.org/simple --only-binary=:all: --no-deps --require-hashes -r /dev/stdin <<'REQUIREMENTS'
            setuptools==80.9.0 --hash=sha256:062d34222ad13e0cc312a4c02d73f059e86a4acbfbdea8f8f76b28c99f306922
            wheel==0.45.1 --hash=sha256:708e7481cc80179af0e556bbf0cc00b8444c7321e2700b8d8580231d13017248
            REQUIREMENTS
            timeout 240 python -m pip install --no-index --no-deps --no-build-isolation ./next-src
            cat > /tmp/myhdl_next_smoke.py <<'PY'
            import os
            import sys
            import importlib.metadata
            import myhdl
            from pathlib import Path
            assert myhdl.__version__ == os.environ["LATEST_VERSION"], myhdl.__version__
            assert importlib.metadata.version("myhdl") == os.environ["LATEST_VERSION"]
            assert Path(myhdl.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
            def deny_network(event, args):
                if event.startswith("socket."):
                    raise RuntimeError("Network is disabled during the candidate simulation")
            sys.addaudithook(deny_network)
            from myhdl import Signal, delay, instance, always_comb, Simulation, StopSimulation, toVerilog

            def inverter(a, b):
                @always_comb
                def logic():
                    b.next = not a
                return logic

            def bench():
                a = Signal(bool(0))
                b = Signal(bool(0))
                dut = inverter(a, b)

                @instance
                def stimulus():
                    a.next = False
                    yield delay(1)
                    assert b == True
                    a.next = True
                    yield delay(1)
                    assert b == False
                    raise StopSimulation

                return dut, stimulus

            sim = Simulation(bench())
            sim.run()
            a = Signal(bool(0))
            b = Signal(bool(0))
            toVerilog.name = "myhdl_inverter"
            toVerilog.directory = "."
            toVerilog(inverter, a, b)
            out = Path("myhdl_inverter.v")
            assert out.exists() and "module myhdl_inverter" in out.read_text(encoding="utf-8")
            PY
            python /tmp/myhdl_next_smoke.py
            echo "myhdl-candidate-ok version=$LATEST_VERSION simulation=inverter conversion=Verilog"
          limited_cpu_description: |
            Installed the exact next MyHDL candidate on Python 3.10/Arm64, ran an inverter simulation with Python socket operations denied, and converted it to Verilog. Baseline 0.8 runs an adder/counter simulation separately in a pinned network-disabled Python 2.7 container; no HDL engine or hardware validation is claimed.
      - name: Calculate test summary
        id: summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          T1="${{ steps.test1.outputs.status || 'failed' }}"
          T2="${{ steps.test2.outputs.status || 'failed' }}"
          T3="${{ steps.test3.outputs.status || 'failed' }}"
          T4="${{ steps.test4.outputs.status || 'failed' }}"
          T5="${{ steps.test5.outputs.status || 'failed' }}"
          T6="${{ steps.test6.outputs.status || 'failed' }}"
          O1="${{ steps.test1.outcome || 'failure' }}"
          O2="${{ steps.test2.outcome || 'failure' }}"
          O3="${{ steps.test3.outcome || 'failure' }}"
          O4="${{ steps.test4.outcome || 'failure' }}"
          O5="${{ steps.test5.outcome || 'failure' }}"
          O6="${{ steps.test6.outcome || 'failure' }}"
          DECISION="${{ steps.test6.outputs.decision || '' }}"
          D1="${{ steps.test1.outputs.duration || '0' }}"
          D2="${{ steps.test2.outputs.duration || '0' }}"
          D3="${{ steps.test3.outputs.duration || '0' }}"
          D4="${{ steps.test4.outputs.duration || '0' }}"
          D5="${{ steps.test5.outputs.duration || '0' }}"
          D6="${{ steps.test6.outputs.duration || '0' }}"
          PASSED=0
          FAILED=0
          SKIPPED=0
          CORE_FAILED=0
          for RESULT in "$T1:$O1" "$T2:$O2" "$T3:$O3" "$T4:$O4" "$T5:$O5"; do
            if [ "$RESULT" = "passed:success" ]; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
              CORE_FAILED=$((CORE_FAILED + 1))
            fi
          done
          if [ "$T6:$O6" = "passed:success" ]; then
            PASSED=$((PASSED + 1))
          elif [ "$T6:$O6" = "skipped:success" ] && [ "$DECISION" = "no_newer_stable_available" ]; then
            SKIPPED=1
          else
            FAILED=$((FAILED + 1))
          fi
          DURATION=$((D1 + D2 + D3 + D4 + D5 + D6))
          if [ "$FAILED" -eq 0 ]; then
            OVERALL_STATUS="success"
          else
            OVERALL_STATUS="failure"
          fi
          if [ "$FAILED" -eq 0 ]; then
            BADGE_STATUS="passing"
          else
            BADGE_STATUS="failing"
          fi
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"
          echo "core_failed=$CORE_FAILED" >> "$GITHUB_OUTPUT"
          echo "overall_status=$OVERALL_STATUS" >> "$GITHUB_OUTPUT"
          echo "badge_status=$BADGE_STATUS" >> "$GITHUB_OUTPUT"
          test "$FAILED" -eq 0
      - name: Create test summary
        if: always()
        uses: ./.github/actions/write-package-job-summary
        with:
          package_name: 'MyHDL'
          version: ${{ steps.version.outputs.version || 'unknown' }}
          overall_status: ${{ steps.summary.outputs.overall_status || 'unknown' }}
          tests_passed: ${{ steps.summary.outputs.passed || '0' }}
          tests_failed: ${{ steps.summary.outputs.failed || '0' }}
          tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
          duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
          test1_status: ${{ steps.test1.outputs.status || 'skipped' }}
          test2_status: ${{ steps.test2.outputs.status || 'skipped' }}
          test3_status: ${{ steps.test3.outputs.status || 'skipped' }}
          test4_status: ${{ steps.test4.outputs.status || 'skipped' }}
          test5_status: ${{ steps.test5.outputs.status || 'skipped' }}
          test6_status: ${{ steps.test6.outputs.status || 'skipped' }}
          test6_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
          regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
          regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
          regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
          regression_result: ${{ steps.test6.outputs.regression_result || 'Regression result unavailable.' }}
          regression_details: ${{ steps.test6.outputs.comparison || steps.test6.outputs.note || 'Regression comparison summary unavailable.' }}

name: Test All Packages (Batch 7) on Arm64
run-name: Arm64 Batch 7 [${{ inputs.orchestration_id || format('manual-{0}-{1}', github.run_id, github.run_attempt) }}] [nonce:${{ inputs.dispatch_nonce || 'manual-only' }}] [prefetch:${{ (inputs.prefetch_run_id == '' && inputs.prefetch_artifact_name == '') && 'none' || 'present' }}]

on:
  workflow_dispatch:
    inputs:
      orchestration_id:
        description: Exact orchestrator identity; blank uses a safe manual fallback
        required: false
        default: ""
        type: string
      dispatch_nonce:
        description: Secret exact-dispatch nonce; blank is manual-only and not publishable
        required: false
        default: ""
        type: string
      expected_sha:
        description: Exact commit expected by the orchestrator
        required: false
        default: ""
        type: string
      expected_branch:
        description: Exact branch expected by the orchestrator
        required: false
        default: ""
        type: string
      prefetch_run_id:
        description: Orchestrator prefetch run id
        required: false
        default: ""
        type: string
      prefetch_artifact_name:
        description: Orchestrator prefetch artifact name
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      orchestration_id:
        required: true
        type: string
      dispatch_nonce:
        required: true
        type: string
      expected_sha:
        required: true
        type: string
      expected_branch:
        required: true
        type: string
      prefetch_run_id:
        required: false
        type: string
        default: ""
      prefetch_artifact_name:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:

  test-ffmpeg:
    uses: ./.github/workflows/test-ffmpeg.yml

  test-chroma:
    uses: ./.github/workflows/test-chroma.yml

  test-mediawiki:
    uses: ./.github/workflows/test-mediawiki.yml

  test-openmpi:
    uses: ./.github/workflows/test-openmpi.yml

  test-iperf:
    uses: ./.github/workflows/test-iperf.yml

  test-lucene:
    uses: ./.github/workflows/test-lucene.yml

  test-vpp:
    uses: ./.github/workflows/test-vpp.yml

  test-hive:
    uses: ./.github/workflows/test-hive.yml
    with:
      prefetch_run_id: ${{ inputs.prefetch_run_id || '' }}
      prefetch_artifact_name: ${{ inputs.prefetch_artifact_name || '' }}

  test-rmblast:
    uses: ./.github/workflows/test-rmblast.yml

  test-minio-mc:
    uses: ./.github/workflows/test-minio-mc.yml

  test-kyverno:
    uses: ./.github/workflows/test-kyverno.yml

  test-keycloak:
    uses: ./.github/workflows/test-keycloak.yml

  test-debian:
    uses: ./.github/workflows/test-debian.yml

  test-bison:
    uses: ./.github/workflows/test-bison.yml

  test-beanstalkd:
    uses: ./.github/workflows/test-beanstalkd.yml

  test-predixy:
    uses: ./.github/workflows/test-predixy.yml

  test-gdal:
    uses: ./.github/workflows/test-gdal.yml

  test-snort:
    uses: ./.github/workflows/test-snort.yml

  test-electron:
    uses: ./.github/workflows/test-electron.yml

  test-php:
    uses: ./.github/workflows/test-php.yml

  test-databend:
    uses: ./.github/workflows/test-databend.yml

  test-uui:
    uses: ./.github/workflows/test-uui.yml

  test-samba:
    uses: ./.github/workflows/test-samba.yml

  test-phoronix_test_suite:
    uses: ./.github/workflows/test-phoronix_test_suite.yml

  test-lapack:
    uses: ./.github/workflows/test-lapack.yml

  test-zeroc_ice:
    uses: ./.github/workflows/test-zeroc_ice.yml

  test-dm:
    uses: ./.github/workflows/test-dm.yml

  test-victoriametrics:
    uses: ./.github/workflows/test-victoriametrics.yml

  test-varnish:
    uses: ./.github/workflows/test-varnish.yml

  test-percona:
    uses: ./.github/workflows/test-percona.yml

  test-lmbench:
    uses: ./.github/workflows/test-lmbench.yml

  test-vllm:
    uses: ./.github/workflows/test-vllm.yml

  test-netplan:
    uses: ./.github/workflows/test-netplan.yml

  test-emqx:
    uses: ./.github/workflows/test-emqx.yml

  test-asp-net:
    uses: ./.github/workflows/test-asp-net.yml

  test-kylin:
    uses: ./.github/workflows/test-kylin.yml

  test-chaossearch:
    uses: ./.github/workflows/test-chaossearch.yml

  test-benchmarksql:
    uses: ./.github/workflows/test-benchmarksql.yml

  test-opencascade:
    uses: ./.github/workflows/test-opencascade.yml

  test-buildpacks:
    uses: ./.github/workflows/test-buildpacks.yml

  test-sonic:
    uses: ./.github/workflows/test-sonic.yml

  test-opentelemetry-go:
    uses: ./.github/workflows/test-opentelemetry-go.yml

  test-kube-router:
    uses: ./.github/workflows/test-kube-router.yml

  test-postgis:
    uses: ./.github/workflows/test-postgis.yml

  test-cucim:
    uses: ./.github/workflows/test-cucim.yml

  summary:
    permissions:
      actions: read
      contents: read
    needs:
      [
        test-ffmpeg,
        test-chroma,
        test-mediawiki,
        test-openmpi,
        test-iperf,
        test-lucene,
        test-vpp,
        test-hive,
        test-rmblast,
        test-minio-mc,
        test-kyverno,
        test-keycloak,
        test-debian,
        test-bison,
        test-beanstalkd,
        test-predixy,
        test-gdal,
        test-snort,
        test-electron,
        test-php,
        test-databend,
        test-uui,
        test-samba,
        test-phoronix_test_suite,
        test-lapack,
        test-zeroc_ice,
        test-dm,
        test-victoriametrics,
        test-varnish,
        test-percona,
        test-lmbench,
        test-vllm,
        test-netplan,
        test-emqx,
        test-asp-net,
        test-kylin,
        test-chaossearch,
        test-benchmarksql,
        test-opencascade,
        test-buildpacks,
        test-sonic,
        test-opentelemetry-go,
        test-kube-router,
        test-postgis,
        test-cucim
      ]
    runs-on: ubuntu-24.04-arm
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect batch results
        id: collect
        uses: ./.github/actions/collect-batch-results
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        with:
          batch_number: "7"
          batch_title: "Batch 7"

      - name: Attest complete batch results
        id: attest
        if: steps.collect.outcome == 'success'
        env:
          ARTIFACT_NAME: batch7-test-results
          BATCH_NUMBER: "7"
          COLLECTOR_JSON_COUNT: ${{ steps.collect.outputs.json_count }}
          CURRENT_BRANCH: ${{ github.ref_name }}
          DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
          EXPECTED_BRANCH: ${{ inputs.expected_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          NEEDS_JSON: ${{ toJson(needs) }}
          ORCHESTRATION_ID: ${{ inputs.orchestration_id }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/batch_artifact_attestation.py create \
            --results-root test-results \
            --workflow-file ".github/workflows/test-all-packages-batch7.yml" \
            --batch "$BATCH_NUMBER" \
            --repository "$REPOSITORY" \
            --expected-branch "$EXPECTED_BRANCH" \
            --current-branch "$CURRENT_BRANCH" \
            --expected-sha "$EXPECTED_SHA" \
            --workflow-sha "$WORKFLOW_SHA" \
            --orchestration-id "$ORCHESTRATION_ID" \
            --dispatch-nonce "$DISPATCH_NONCE" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --artifact-name "$ARTIFACT_NAME" \
            --collector-json-count "$COLLECTOR_JSON_COUNT" \
            --needs-environment-variable NEEDS_JSON

      - name: Upload batch test results
        if: steps.collect.outcome == 'success' && steps.attest.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: batch7-test-results
          path: test-results
          retention-days: 90

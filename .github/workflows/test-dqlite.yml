name: Test Canonical Dqlite on Arm64

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-dqlite.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-dqlite.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-dqlite.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-dqlite.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-dqlite.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-dqlite.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-dqlite.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-dqlite.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-dqlite.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-dqlite.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-dqlite.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-dqlite.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-dqlite.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-dqlite.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-dqlite.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-dqlite.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-dqlite.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-dqlite.outputs.regression_next_installed_version }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-dqlite.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-dqlite.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-dqlite.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-dqlite.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-dqlite.outputs.timestamp }}
jobs:
  test-dqlite:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      BASELINE_VERSION: '1.18.2'
      BASELINE_COMMIT: '559328ca8bdeca27cb24967ec632a2f1c68c9f18'
      CANDIDATE_VERSION: '1.18.7'
      CANDIDATE_COMMIT: '91e3e2f90874e4ec3b45cde965f266342846531b'
    
    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'Canonical Dqlite'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'failed' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false
      
      - name: Set test metadata
        id: metadata
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=dqlite" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/opensource_packages/dqlite" >> "$GITHUB_OUTPUT"
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config autoconf automake libtool \
            libuv1-dev libsqlite3-dev liblz4-dev git python3

      - name: Prepare pinned source verification
        id: prepare
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/dqlite-tools"
          cat > "$RUNNER_TEMP/dqlite-tools/check.py" <<'PY'
          import ctypes
          import hashlib
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          OFFICIAL = "https://github.com/canonical/dqlite.git"

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          def run(args, *, cwd=None, env=None, timeout=60):
              print("+ " + " ".join(map(str, args)), flush=True)
              result = subprocess.run(args, cwd=cwd, env=env, text=True,
                                      stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                      timeout=timeout)
              print(result.stdout, end="", flush=True)
              print(result.stderr, end="", file=sys.stderr, flush=True)
              result.check_returncode()
              return result.stdout.strip()

          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          class Release:
              def __init__(self, version, commit):
                  require(re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version), "Invalid version")
                  require(re.fullmatch(r"[0-9a-f]{40}", commit), "Invalid commit")
                  self.version, self.commit = version, commit
                  self.root = Path(os.environ["RUNNER_TEMP"]) / ("dqlite-" + version)
                  self.source = self.root / "source"
                  self.prefix = self.root / "installed"
                  self.library = self.prefix / "lib/libdqlite.so"
                  self.binary = self.source / "integration-test"
                  self.env = dict(os.environ, LC_ALL="C",
                                  LD_LIBRARY_PATH=str(self.prefix / "lib"),
                                  PKG_CONFIG_PATH="",
                                  PKG_CONFIG_LIBDIR=str(self.prefix / "lib/pkgconfig"))
                  self.env.pop("LD_PRELOAD", None)

              def git(self, *args):
                  return run(["git", "-C", str(self.source), *args])

              def source_identity(self):
                  require(self.git("remote", "get-url", "origin") == OFFICIAL,
                          "Source is not from the official repository")
                  require(self.git("rev-parse", "HEAD") == self.commit, "Wrong source commit")
                  require(self.git("rev-parse", "refs/tags/v" + self.version + "^{commit}")
                          == self.commit, "Release tag does not match reviewed commit")
                  require(not self.git("status", "--porcelain", "--untracked-files=no"),
                          "Tracked source changed after checkout")

              def build(self):
                  require(os.uname().machine == "aarch64", "Native AArch64 required")
                  self.root.mkdir()
                  self.source.mkdir()
                  run(["git", "init", str(self.source)])
                  self.git("remote", "add", "origin", OFFICIAL)
                  tag = "refs/tags/v" + self.version
                  self.git("fetch", "--depth=1", "origin", tag + ":" + tag)
                  require(self.git("rev-parse", tag + "^{commit}") == self.commit,
                          "Official tag changed: refusing to build")
                  self.git("checkout", "--detach", self.commit)
                  self.source_identity()
                  run(["autoreconf", "-fi"], cwd=self.source, timeout=120)
                  run(["./configure", "--prefix=" + str(self.prefix),
                       "--libdir=" + str(self.prefix / "lib")],
                      cwd=self.source, timeout=120)
                  run(["make", "-j2"], cwd=self.source, timeout=600)
                  run(["make", "install"], cwd=self.source, timeout=120)
                  run(["make", "-j2", "integration-test"], cwd=self.source, timeout=600)
                  self.ownership()

              def ownership(self):
                  self.source_identity()
                  library = self.library.resolve(strict=True)
                  require(library.parent == self.prefix / "lib", "Unowned installed library")
                  built = self.source / ".libs" / library.name
                  require(digest(library) == digest(built),
                          "Installed library differs from this source build")
                  elf = library.read_bytes()[:20]
                  require(elf[:6] == b"\x7fELF\x02\x01"
                          and int.from_bytes(elf[18:20], "little") == 183,
                          "Installed library is not a 64-bit AArch64 ELF")
                  print("source_release=" + self.version, flush=True)
                  print("source_commit=" + self.commit, flush=True)
                  print("installed_library=" + str(library), flush=True)
                  print("installed_sha256=" + digest(library), flush=True)

              def runtime(self):
                  self.ownership()
                  library = ctypes.CDLL(str(self.library.resolve(strict=True)))
                  library.dqlite_version_number.argtypes = []
                  library.dqlite_version_number.restype = ctypes.c_int
                  number = library.dqlite_version_number()
                  actual = f"{number // 10000}.{number // 100 % 100}.{number % 100}"
                  print("actual_library_version=" + actual, flush=True)
                  require(actual == self.version,
                          f"Installed library reports {actual}; expected release {self.version}")
                  return actual

              def metadata(self):
                  self.ownership()
                  header = self.prefix / "include/dqlite.h"
                  require(header.read_bytes() == (self.source / "include/dqlite.h").read_bytes(),
                          "Installed header differs from the verified source")
                  parts = []
                  for field in ("MAJOR", "MINOR", "RELEASE"):
                      matches = re.findall(r"^#define DQLITE_VERSION_" + field
                                           + r" ([0-9]+)$", header.read_text(), re.M)
                      require(len(matches) == 1, "Invalid installed version header")
                      parts.append(matches[0])
                  require(".".join(parts) == self.version, "Header/release version mismatch")
                  require(run(["pkg-config", "--modversion", "dqlite"], env=self.env)
                          == self.version, "Pkg-config/release version mismatch")
                  for key, expected in (("prefix", self.prefix),
                                        ("libdir", self.prefix / "lib"),
                                        ("includedir", self.prefix / "include")):
                      require(run(["pkg-config", "--variable=" + key, "dqlite"], env=self.env)
                              == str(expected), "Pkg-config points to another installation")

              def linkage(self):
                  self.ownership()
                  linked = run(["ldd", str(self.binary)], env=self.env)
                  paths = re.findall(r"^\s*libdqlite\.so\S* => (\S+) ", linked, re.M)
                  require(len(paths) == 1 and Path(paths[0]).resolve() == self.library.resolve(),
                          "SQL test does not load this installed library")

              def sql(self):
                  self.linkage()
                  # Upstream single-node test creates a table, inserts 17, and asserts
                  # the returned column, integer value and absence of additional rows.
                  output = run(["timeout", "--kill-after=5s", "60s", str(self.binary),
                                "client/semicolons"], cwd=self.root, env=self.env, timeout=70)
                  require(re.search(r"\b1 of 1 \([^)]+\) tests successful, 0 \([^)]+\) test skipped",
                                    output), "SQL test did not execute exactly one passing case")
                  print("Single-node SQL create/insert/select validated. "
                        "Replication and failover were not exercised.", flush=True)

          if __name__ == "__main__":
              mode, version, commit = sys.argv[1:]
              require(mode in {"build", "ownership", "runtime", "metadata", "linkage", "sql"},
                      "Unknown verification mode")
              getattr(Release(version, commit), mode)()
          PY

      - name: Build and install pinned Dqlite library
        id: install
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/dqlite-tools/check.py" build "$BASELINE_VERSION" "$BASELINE_COMMIT"
          echo "install_mode=github_source" >> "$GITHUB_OUTPUT"
          echo "install_status=success" >> "$GITHUB_OUTPUT"

      - name: Verify installed Dqlite version
        id: version
        continue-on-error: true
        env:
          INSTALL_STATUS: ${{ steps.install.outputs.install_status }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
        run: |
          set -euo pipefail
          finish() {
            rc=$1
            trap - EXIT
            if [ "$rc" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
              echo "version=$BASELINE_VERSION" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            exit "$rc"
          }
          trap 'finish $?' EXIT
          test "$INSTALL_STATUS:$INSTALL_OUTCOME" = "success:success"
          python3 "$RUNNER_TEMP/dqlite-tools/check.py" runtime "$BASELINE_VERSION" "$BASELINE_COMMIT"
          python3 "$RUNNER_TEMP/dqlite-tools/check.py" metadata "$BASELINE_VERSION" "$BASELINE_COMMIT"
          finish 0

      - name: Test 1 - Installed AArch64 library source ownership
        id: test1
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            rc=$1
            trap - EXIT
            if [ "$rc" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish $?' EXIT
          python3 "$RUNNER_TEMP/dqlite-tools/check.py" ownership "$BASELINE_VERSION" "$BASELINE_COMMIT"
          finish 0

      - name: Test 2 - Actual installed library version
        id: test2
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            rc=$1
            trap - EXIT
            if [ "$rc" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish $?' EXIT
          python3 "$RUNNER_TEMP/dqlite-tools/check.py" runtime "$BASELINE_VERSION" "$BASELINE_COMMIT"
          finish 0

      - name: Test 3 - Installed header and pkg-config identity
        id: test3
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            rc=$1
            trap - EXIT
            if [ "$rc" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish $?' EXIT
          python3 "$RUNNER_TEMP/dqlite-tools/check.py" metadata "$BASELINE_VERSION" "$BASELINE_COMMIT"
          finish 0

      - name: Test 4 - SQL test loads the installed library
        id: test4
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            rc=$1
            trap - EXIT
            if [ "$rc" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish $?' EXIT
          python3 "$RUNNER_TEMP/dqlite-tools/check.py" linkage "$BASELINE_VERSION" "$BASELINE_COMMIT"
          finish 0

      - name: Test 5 - Bounded single-node SQL create insert select
        id: test5
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            rc=$1
            trap - EXIT
            if [ "$rc" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish $?' EXIT
          python3 "$RUNNER_TEMP/dqlite-tools/check.py" sql "$BASELINE_VERSION" "$BASELINE_COMMIT"
          finish 0

      - name: Test 6 - Build and run reviewed newer source release
        id: test6
        if: always()
        continue-on-error: true
        env:
          INSTALL_STATUS: ${{ steps.install.outputs.install_status }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          INSTALL_MODE: ${{ steps.install.outputs.install_mode }}
          VERSION_STATUS: ${{ steps.version.outputs.status }}
          VERSION_OUTCOME: ${{ steps.version.outcome }}
          CURRENT: ${{ steps.version.outputs.version }}
          CORE1: ${{ steps.test1.outputs.status }}:${{ steps.test1.outcome }}
          CORE2: ${{ steps.test2.outputs.status }}:${{ steps.test2.outcome }}
          CORE3: ${{ steps.test3.outputs.status }}:${{ steps.test3.outcome }}
          CORE4: ${{ steps.test4.outputs.status }}:${{ steps.test4.outcome }}
          CORE5: ${{ steps.test5.outputs.status }}:${{ steps.test5.outcome }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          STATE=next_install_failed
          NEXT_INSTALLED=not_installed
          RESULT="Candidate source build did not complete."
          finish() {
            rc=$1
            trap - EXIT
            case "$STATE:$rc" in
              baseline_install_failed:0)
                echo "decision=baseline_install_failed" >> "$GITHUB_OUTPUT"
                echo "status=skipped" >> "$GITHUB_OUTPUT"
                ;;
              baseline_failed:0)
                echo "decision=baseline_failed" >> "$GITHUB_OUTPUT"
                echo "status=skipped" >> "$GITHUB_OUTPUT"
                ;;
              validated_next_release:0)
                echo "decision=validated_next_release" >> "$GITHUB_OUTPUT"
                echo "status=passed" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "decision=next_regression_failed" >> "$GITHUB_OUTPUT"
                echo "status=failed" >> "$GITHUB_OUTPUT"
                rc=1
                ;;
            esac
            echo "current_version=${CURRENT:-unknown}" >> "$GITHUB_OUTPUT"
            echo "latest_version=$CANDIDATE_VERSION" >> "$GITHUB_OUTPUT"
            echo "next_installed_version=$NEXT_INSTALLED" >> "$GITHUB_OUTPUT"
            echo "regression_result=$RESULT" >> "$GITHUB_OUTPUT"
            echo "comparison=Reviewed source releases $BASELINE_VERSION to $CANDIDATE_VERSION; installed library identity and single-node SQL only. No replication, failover or in-place upgrade claim." >> "$GITHUB_OUTPUT"
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish $?' EXIT
          if [ "$INSTALL_STATUS:$INSTALL_OUTCOME:$INSTALL_MODE" != "success:success:github_source" ]; then
            STATE=baseline_install_failed
            RESULT="Baseline source installation was not verified; candidate not attempted."
            finish 0
          fi
          if [ "$VERSION_STATUS:$VERSION_OUTCOME:$CURRENT" != "passed:success:$BASELINE_VERSION" ] ||
             [ "$CORE1" != "passed:success" ] || [ "$CORE2" != "passed:success" ] ||
             [ "$CORE3" != "passed:success" ] || [ "$CORE4" != "passed:success" ] ||
             [ "$CORE5" != "passed:success" ]; then
            STATE=baseline_failed
            RESULT="Baseline library identity or core validation failed; candidate not attempted."
            finish 0
          fi
          python3 -c 'import os; assert tuple(map(int, os.environ["CANDIDATE_VERSION"].split("."))) > tuple(map(int, os.environ["BASELINE_VERSION"].split(".")))'
          python3 "$RUNNER_TEMP/dqlite-tools/check.py" build "$CANDIDATE_VERSION" "$CANDIDATE_COMMIT"
          RESULT="Candidate installed library identity validation failed."
          python3 "$RUNNER_TEMP/dqlite-tools/check.py" runtime "$CANDIDATE_VERSION" "$CANDIDATE_COMMIT"
          python3 "$RUNNER_TEMP/dqlite-tools/check.py" metadata "$CANDIDATE_VERSION" "$CANDIDATE_COMMIT"
          NEXT_INSTALLED=$CANDIDATE_VERSION
          RESULT="Candidate single-node SQL runtime validation failed."
          python3 "$RUNNER_TEMP/dqlite-tools/check.py" sql "$CANDIDATE_VERSION" "$CANDIDATE_COMMIT"
          STATE=validated_next_release
          RESULT="Pinned candidate built, installed library version verified, and single-node SQL passed."
          finish 0

      - name: Calculate test summary
        if: always()
        id: summary
        run: |
          set -euo pipefail
          CORE1='${{ steps.test1.outputs.status }}:${{ steps.test1.outcome }}'
          CORE2='${{ steps.test2.outputs.status }}:${{ steps.test2.outcome }}'
          CORE3='${{ steps.test3.outputs.status }}:${{ steps.test3.outcome }}'
          CORE4='${{ steps.test4.outputs.status }}:${{ steps.test4.outcome }}'
          CORE5='${{ steps.test5.outputs.status }}:${{ steps.test5.outcome }}'
          DURATION1='${{ steps.test1.outputs.duration }}'
          DURATION2='${{ steps.test2.outputs.duration }}'
          DURATION3='${{ steps.test3.outputs.duration }}'
          DURATION4='${{ steps.test4.outputs.duration }}'
          DURATION5='${{ steps.test5.outputs.duration }}'
          DURATION6='${{ steps.test6.outputs.duration }}'
          REGRESSION='${{ steps.test6.outputs.status }}:${{ steps.test6.outcome }}:${{ steps.test6.outputs.decision }}'
          PASSED=0
          FAILED=0
          SKIPPED=0
          TOTAL_DURATION=0
          for i in 1 2 3 4 5; do
            core=CORE$i
            duration=DURATION$i
            if [ "${!core}" = "passed:success" ] && [[ "${!duration}" =~ ^[0-9]{1,6}$ ]]; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
            fi
          done
          CORE_FAILED=$FAILED
          if [[ "$DURATION6" =~ ^[0-9]{1,6}$ ]] &&
             [ "$REGRESSION" = "passed:success:validated_next_release" ] && [ "$CORE_FAILED" -eq 0 ]; then
            PASSED=$((PASSED + 1))
          elif [[ "$DURATION6" =~ ^[0-9]{1,6}$ ]] && [ "$CORE_FAILED" -gt 0 ] &&
               { [ "$REGRESSION" = "skipped:success:baseline_failed" ] ||
                 [ "$REGRESSION" = "skipped:success:baseline_install_failed" ]; }; then
            SKIPPED=$((SKIPPED + 1))
          else
            FAILED=$((FAILED + 1))
          fi
          for duration in "$DURATION1" "$DURATION2" "$DURATION3" "$DURATION4" "$DURATION5" "$DURATION6"; do
            if [[ "$duration" =~ ^[0-9]{1,6}$ ]]; then
              TOTAL_DURATION=$((TOTAL_DURATION + 10#$duration))
            fi
          done
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "core_failed=$CORE_FAILED" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
          echo "duration=$TOTAL_DURATION" >> "$GITHUB_OUTPUT"
          if [ "$FAILED" -eq 0 ]; then
            echo "overall_status=success" >> "$GITHUB_OUTPUT"
            echo "badge_status=passing" >> "$GITHUB_OUTPUT"
          else
            echo "overall_status=failure" >> "$GITHUB_OUTPUT"
            echo "badge_status=failing" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Create test summary
        if: always()
        env:
          VERSION: ${{ steps.version.outputs.version || 'unverified' }}
          STATUS: ${{ steps.summary.outputs.overall_status || 'failure' }}
          PASSED: ${{ steps.summary.outputs.passed || '0' }}
          FAILED: ${{ steps.summary.outputs.failed || '6' }}
          SKIPPED: ${{ steps.summary.outputs.skipped || '0' }}
          DURATION: ${{ steps.summary.outputs.duration || '0' }}
          RESULT: ${{ steps.test6.outputs.regression_result || 'Regression step did not produce a result.' }}
        run: |
          {
            echo "## Dqlite Test Results"
            echo "- Verified library version: $VERSION"
            echo "- Source baseline: v$BASELINE_VERSION ($BASELINE_COMMIT)"
            echo "- Status: $STATUS"
            echo "- Passed: $PASSED; failed: $FAILED; skipped: $SKIPPED"
            echo "- Duration: ${DURATION}s"
            echo "- Regression: $RESULT"
            echo "- Scope: installed AArch64 library, source identity, single-node SQL."
            echo "- Replication, failover and in-place upgrades were not tested."
          } >> "$GITHUB_STEP_SUMMARY"

name: Test CatBoost on Arm64

permissions:
  contents: read

on:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-catboost.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-catboost.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-catboost.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-catboost.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-catboost.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-catboost.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-catboost.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-catboost.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-catboost.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-catboost.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-catboost.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-catboost.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-catboost.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-catboost.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-catboost.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-catboost.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-catboost.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-catboost.outputs.regression_next_installed_version }}
      regression_policy:
        description: Regression applicability policy classification
        value: ${{ jobs.test-catboost.outputs.regression_policy }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-catboost.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-catboost.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-catboost.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-catboost.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-catboost.outputs.timestamp }}

jobs:
  test-catboost:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      BASELINE_VERSION: "1.1.1"
      BASELINE_SOURCE_COMMIT: e12502840542f2760dc4e3f3041c9ce8e0814aa4
      PINNED_CONTAINER_IMAGE_CATBOOST: ubuntu@sha256:2edbbc5dc405e9612ba3584ce95480277e3eb374407b5505fe26f17df77c7dbc # original: ubuntu:22.04
      PACKAGE_SLUG: "catboost"
      LANE_KIND: "github release / source-build-or-tarball"
      DOWNLOAD_URL: "https://github.com/catboost/catboost/releases"
      HOMEPAGE_URL: "https://catboost.ai/"
      OFFICIAL_DOCS: "https://catboost.ai/docs/en/concepts/python-installation"
      GITHUB_REPO: "catboost/catboost"
      CATBOOST_CPU_SMOKE: |
        import importlib.metadata as im
        import os
        import platform
        import catboost
        import numpy as np
        from catboost import CatBoostClassifier, Pool

        expected = os.environ["EXPECTED_VERSION"]
        assert im.version("catboost") == expected
        assert catboost.__version__ == expected
        X = np.array([[0, 0], [0, 1], [1, 0], [1, 1]], dtype=float)
        y = np.array([0, 0, 1, 1])
        model = CatBoostClassifier(iterations=4, depth=2, learning_rate=0.5, loss_function="Logloss", verbose=False, thread_count=1)
        model.fit(Pool(X, y))
        preds = model.predict(X)
        assert preds.shape[0] == 4
        assert set(int(v) for v in preds.reshape(-1)).issubset({0, 1})
        print("catboost=%s numpy=%s python=%s machine=%s predictions=%s" % (
            catboost.__version__, np.__version__, platform.python_version(), platform.machine(), preds.reshape(-1).tolist()))

    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'CatBoost'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      regression_policy: "applicable"
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python for runtime smoke
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # original: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set test metadata
        id: metadata
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=catboost" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/linux/opensource_packages/catboost" >> "$GITHUB_OUTPUT"

      - name: Bootstrap baseline dependencies
        uses: ./.github/actions/apt-bootstrap
        with:
          packages: "git curl jq tar unzip file ca-certificates python3-venv"
          quiet: "true"

      - name: Install baseline source or artifact
        id: install
        run: |
          set -euo pipefail
          rm -rf baseline-src baseline-external
          mkdir -p baseline-src baseline-external
          if [ -n "$GITHUB_REPO" ]; then
            RESOLVED_TAG=""
            for CANDIDATE in "$BASELINE_VERSION" "v$BASELINE_VERSION"; do
              if git ls-remote --tags --refs "https://github.com/$GITHUB_REPO.git" "refs/tags/$CANDIDATE" | grep -q .; then
                RESOLVED_TAG="$CANDIDATE"
                break
              fi
            done
            if [ -n "$RESOLVED_TAG" ]; then
              git clone --depth 1 --branch "$RESOLVED_TAG" "https://github.com/$GITHUB_REPO.git" baseline-src >/dev/null 2>&1 || true
              echo "resolved_tag=$RESOLVED_TAG" >> "$GITHUB_OUTPUT"
            else
              git clone --depth 1 "https://github.com/$GITHUB_REPO.git" baseline-src >/dev/null 2>&1 || true
              echo "resolved_tag=default_branch" >> "$GITHUB_OUTPUT"
            fi
            if [ -d baseline-src/.git ] || [ -f baseline-src/README.md ] || [ -n "$(find baseline-src -mindepth 1 -maxdepth 2 -print -quit 2>/dev/null)" ]; then
              echo "install_mode=github_source" >> "$GITHUB_OUTPUT"
              echo "install_status=success" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if curl -fsLI "$DOWNLOAD_URL" >/dev/null 2>&1 || curl -fsLI "$HOMEPAGE_URL" >/dev/null 2>&1; then
            printf 'download=%s\nhomepage=%s\ndocs=%s\n' "$DOWNLOAD_URL" "$HOMEPAGE_URL" "$OFFICIAL_DOCS" > baseline-external/metadata.txt
            echo "resolved_tag=external_artifact" >> "$GITHUB_OUTPUT"
            echo "install_mode=external_artifact" >> "$GITHUB_OUTPUT"
            echo "install_status=success" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "install_mode=unresolved" >> "$GITHUB_OUTPUT"
          echo "install_status=failed" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Get baseline version
        id: version
        run: |
          echo "version=$BASELINE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected baseline version: $BASELINE_VERSION"

      - name: Define package-specific expectations
        id: expectations
        uses: ./.github/actions/derive-package-source-expectations
        with:
          package_slug: ${{ env.PACKAGE_SLUG }}

      - name: Test 1 - Check package-specific baseline markers
        id: test1
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          MODE="${{ steps.install.outputs.install_mode || '' }}"
          SOURCE_MARKERS="${{ steps.expectations.outputs.source_markers }}"
          if [ "${{ steps.install.outputs.install_status || 'failed' }}" != "success" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "note=Baseline source or external metadata could not be acquired." >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$MODE" = "github_source" ]; then
            cd baseline-src
            FOUND=0
            HITS=""
            IFS='|' read -r -a MARKERS <<< "$SOURCE_MARKERS"
            REQUIRED=${#MARKERS[@]}
            if [ "$REQUIRED" -gt 2 ]; then
              REQUIRED=2
            fi
            if [ "$REQUIRED" -lt 1 ]; then
              echo "status=failed" >> "$GITHUB_OUTPUT"
              echo "note=No package-specific source markers were derived for the baseline." >> "$GITHUB_OUTPUT"
              exit 1
            fi
            for marker in "${MARKERS[@]}"; do
              if [ -n "$marker" ] && [ -e "$marker" ]; then
                FOUND=$((FOUND + 1))
                if [ -z "$HITS" ]; then
                  HITS="$marker"
                else
                  HITS="$HITS, $marker"
                fi
              fi
            done
            if [ "$FOUND" -ge "$REQUIRED" ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
              echo "note=Found package-specific baseline markers: $HITS" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
              echo "note=Expected at least $REQUIRED package-specific markers from: $SOURCE_MARKERS" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          elif [ -f baseline-external/metadata.txt ]; then
            grep -Fx "download=$DOWNLOAD_URL" baseline-external/metadata.txt >/dev/null
            grep -Fx "homepage=$HOMEPAGE_URL" baseline-external/metadata.txt >/dev/null
            echo "status=passed" >> "$GITHUB_OUTPUT"
            echo "note=Validated external baseline metadata for the published source links." >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "note=External baseline metadata was not emitted." >> "$GITHUB_OUTPUT"
            exit 1
          fi
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 2 - Check package-specific version and release evidence
        id: test2
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          CONTENT_PAGE="${{ steps.expectations.outputs.content_page }}"
          [ -f "$CONTENT_PAGE" ]
          grep -Fx "works_on_arm: true" "$CONTENT_PAGE" >/dev/null
          grep -Fx "download_url: $DOWNLOAD_URL" "$CONTENT_PAGE" >/dev/null
          grep -Fx "    homepage_url: $HOMEPAGE_URL" "$CONTENT_PAGE" >/dev/null
          grep -Fx "        official_docs: $OFFICIAL_DOCS" "$CONTENT_PAGE" >/dev/null
          grep -F "version_number: $BASELINE_VERSION" "$CONTENT_PAGE" >/dev/null
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "note=Validated package metadata, baseline version, homepage, and docs alignment from the checked-in package page." >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 3 - Check package-specific docs and entrypoints
        id: test3
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          MODE="${{ steps.install.outputs.install_mode || '' }}"
          DOC_MARKERS="${{ steps.expectations.outputs.doc_markers }}"
          ENTRYPOINT_MARKERS="${{ steps.expectations.outputs.entrypoint_markers }}"
          IDENTITY_TARGET="${{ steps.expectations.outputs.identity_target }}"
          if [ "$MODE" = "github_source" ]; then
            cd baseline-src
            FOUND=0
            HITS=""
            IFS='|' read -r -a MARKERS <<< "$DOC_MARKERS"
            for marker in "${MARKERS[@]}"; do
              if [ -n "$marker" ] && [ -e "$marker" ]; then
                FOUND=$((FOUND + 1))
                if [ -z "$HITS" ]; then
                  HITS="$marker"
                else
                  HITS="$HITS, $marker"
                fi
              fi
            done
            if [ -n "$IDENTITY_TARGET" ]; then
              [ -e "$IDENTITY_TARGET" ]
            fi
            ENTRY_OK=0
            if [ -n "$ENTRYPOINT_MARKERS" ]; then
              IFS='|' read -r -a ENTRYPOINTS <<< "$ENTRYPOINT_MARKERS"
              for marker in "${ENTRYPOINTS[@]}"; do
                if [ -n "$marker" ] && [ -e "$marker" ]; then
                  ENTRY_OK=1
                  break
                fi
              done
            else
              ENTRY_OK=1
            fi
            if [ "$FOUND" -ge 1 ] && [ "$ENTRY_OK" -eq 1 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
              echo "note=Validated package-specific docs and entrypoint markers: $HITS" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
              echo "note=Expected package-specific docs and entrypoint markers from: $DOC_MARKERS / $ENTRYPOINT_MARKERS" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          elif [ -f baseline-external/metadata.txt ]; then
            grep -Fx "docs=$OFFICIAL_DOCS" baseline-external/metadata.txt >/dev/null
            grep -Fx "homepage=$HOMEPAGE_URL" baseline-external/metadata.txt >/dev/null
            echo "status=passed" >> "$GITHUB_OUTPUT"
            echo "note=Validated external documentation and homepage metadata for the baseline package." >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "note=External documentation metadata was not emitted." >> "$GITHUB_OUTPUT"
            exit 1
          fi
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 4 - Verify Arm64 runner and lane assumptions
        id: test4
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          CONTENT_PAGE="${{ steps.expectations.outputs.content_page }}"
          [ "$(uname -m)" = "aarch64" ]
          grep -Fx "works_on_arm: true" "$CONTENT_PAGE" >/dev/null
          echo "status=passed" >> "$GITHUB_OUTPUT"
          if echo "$LANE_KIND" | grep -Eiq 'gpu|specialized|manual-review'; then
            echo "note=Validated Arm64 support metadata on a generic Arm runner; deeper runtime checks for this lane still require the package-specific environment: $LANE_KIND." >> "$GITHUB_OUTPUT"
          else
            echo "note=Validated Arm64 runner architecture and published Arm support metadata." >> "$GITHUB_OUTPUT"
          fi
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 5 - Run bounded package-specific smoke
        id: test5
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          CONTAINER="catboost-baseline-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          BUILD_VOLUME="catboost-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          CONAN_VOLUME="catboost-conan-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          finish_test() {
            RC=$?
            trap - EXIT
            if docker container inspect "$CONTAINER" >/dev/null 2>&1; then
              docker rm -f "$CONTAINER" || RC=1
            fi
            for VOLUME in "$BUILD_VOLUME" "$CONAN_VOLUME"; do
              if docker volume inspect "$VOLUME" >/dev/null 2>&1; then
                docker volume rm "$VOLUME" || RC=1
              fi
            done
            if [ "$RC" -ne 0 ]; then
              echo "status=failed" >> "$GITHUB_OUTPUT"
              echo "note=CatBoost $BASELINE_VERSION source build, wheel validation, CPU classifier, or cleanup failed; see the command error above." >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap finish_test EXIT
          docker volume create "$BUILD_VOLUME"
          docker volume create "$CONAN_VOLUME"
          docker run --rm -i --name "$CONTAINER" --cpus=2 --memory=8g --memory-swap=8g --pids-limit=512 \
            --mount "type=volume,source=$BUILD_VOLUME,target=/work" \
            --mount "type=volume,source=$CONAN_VOLUME,target=/root/.conan" \
            -e BASELINE_VERSION="$BASELINE_VERSION" -e BASELINE_SOURCE_COMMIT="$BASELINE_SOURCE_COMMIT" -e CATBOOST_CPU_SMOKE="$CATBOOST_CPU_SMOKE" \
            "$PINNED_CONTAINER_IMAGE_CATBOOST" bash -se <<'BUILD'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          export CMAKE_BUILD_PARALLEL_LEVEL=2 CONAN_CPU_COUNT=2 MAKEFLAGS=-j2
          export CFLAGS=-mno-outline-atomics CXXFLAGS=-mno-outline-atomics
          test "$(uname -m)" = aarch64
          test "$BASELINE_VERSION" = 1.1.1
          timeout 300 apt-get update
          # Python 2 is only a historical build generator, not the runtime or a production endorsement.
          timeout 300 apt-get install -y --no-install-recommends ca-certificates git curl build-essential clang-14 lld-14 cmake ninja-build python2 python3-dev python3-venv pkg-config openjdk-11-jdk
          export PATH=/usr/lib/llvm-14/bin:$PATH
          export JAVA_HOME=/usr/lib/jvm/java-11-openjdk-arm64
          python3 -m venv /work/venv
          . /work/venv/bin/activate
          timeout 180 python -m pip install 'conan==1.59.0' 'setuptools==65.5.1' 'wheel==0.38.4' 'numpy==1.23.5'
          if [ ! -d /work/catboost/.git ]; then
            timeout 180 git clone --depth 1 --branch "v$BASELINE_VERSION" https://github.com/catboost/catboost.git /work/catboost
          fi
          test "$(git -C /work/catboost rev-parse HEAD)" = "$BASELINE_SOURCE_COMMIT"
          test -z "$(git -C /work/catboost status --porcelain)"
          git -C /work/catboost rev-parse HEAD
          python --version
          clang --version
          ld.lld --version
          cmake --version
          dpkg-query -W clang-14 lld-14 cmake ninja-build python2 python3-dev python3-venv openjdk-11-jdk
          if [ -f /work/build/build.ninja ]; then
            echo "BUILD_CACHE_PRESENT=yes; reconfiguring and executing the build dependency graph"
          else
            echo "BUILD_CACHE_PRESENT=no"
          fi
          # Documented shared-library PIC and Arm flags: https://catboost.ai/docs/en/installation/build-native-artifacts
          cmake -S /work/catboost -B /work/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DHAVE_CUDA=OFF -DCATBOOST_MAX_LINK_JOBS=1 -DCMAKE_TOOLCHAIN_FILE=/work/catboost/clang.toolchain -U CMAKE_PROJECT_INCLUDE -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DPython2_EXECUTABLE=/usr/bin/python2 -DPython3_EXECUTABLE=/work/venv/bin/python3 -DCMAKE_ASM_COMPILER=/usr/lib/llvm-14/bin/clang '-DCMAKE_C_FLAGS_RELEASE=-O3 -DNDEBUG -mno-outline-atomics' '-DCMAKE_CXX_FLAGS_RELEASE=-O3 -DNDEBUG -mno-outline-atomics'
          ninja -C /work/build -t commands _catboost > /work/verified-commands.txt
          python - <<'PY'
          from pathlib import Path
          import shlex
          lines = Path('/work/verified-commands.txt').read_text().splitlines()
          compiles = []
          for line in lines:
              args = shlex.split(line)
              if args and Path(args[0]).name in {'clang', 'clang++'} and '-c' in args:
                  if Path(args[args.index('-c') + 1]).suffix in {'.c', '.cc', '.cpp', '.cxx'}:
                      compiles.append(args)
          assert len(compiles) > 3000, len(compiles)
          assert all('-mno-outline-atomics' in args for args in compiles)
          assert all('-fPIC' in args or '-fPIE' in args for args in compiles)
          assert any('-fuse-ld=lld' in line for line in lines)
          print('VERIFIED_PIC_AND_ARM_FLAG_COMPILE_COMMANDS=%d' % len(compiles), flush=True)
          PY
          timeout --signal=INT --kill-after=30s 1800 cmake --build /work/build --target _catboost --parallel 2
          test -z "$(git -C /work/catboost status --porcelain)"
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          root = Path('/work/catboost')
          spec = importlib.util.spec_from_file_location('release_mk_wheel', root / 'catboost/python-package/mk_wheel.py')
          builder = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(builder)
          version = builder.get_version(str(root / 'catboost/python-package/catboost/version.py'))
          assert version == '1.1.1', version
          libraries = list(Path('/work/build/catboost/python-package/catboost').glob('*catboost*.so'))
          assert len(libraries) == 1, libraries
          builder.make_wheel('/work/catboost-1.1.1-cp310-none-linux_aarch64.whl', 'catboost', version, str(root), {'_catboost': (str(libraries[0]), '')}, False)
          PY
          timeout 300 python -m pip install --only-binary=:all: 'numpy==1.23.5' 'pandas==1.5.3' 'scipy==1.10.1' 'matplotlib==3.7.5' 'plotly==5.24.1' 'graphviz==0.20.1' 'six==1.16.0'
          timeout 180 python -m pip install --no-deps --force-reinstall /work/catboost-1.1.1-cp310-none-linux_aarch64.whl
          cd /work
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import catboost._catboost as extension
          libraries = list(Path('/work/build/catboost/python-package/catboost').glob('*catboost*.so'))
          assert len(libraries) == 1, libraries
          assert hashlib.sha256(libraries[0].read_bytes()).digest() == hashlib.sha256(Path(extension.__file__).read_bytes()).digest()
          print('INSTALLED_EXTENSION_MATCHES_SOURCE_BUILD=' + hashlib.sha256(libraries[0].read_bytes()).hexdigest())
          PY
          EXPECTED_VERSION="$BASELINE_VERSION" python -c "$CATBOOST_CPU_SMOKE"
          python -m pip list --format=json
          sha256sum /work/catboost-1.1.1-cp310-none-linux_aarch64.whl
          BUILD
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "note=Built the exact CatBoost $BASELINE_VERSION source on Arm64 without CUDA, installed and matched its wheel, trained a tiny CPU classifier, and checked prediction count and labels." >> "$GITHUB_OUTPUT"
      - name: Test 6 - Regression Validation
        id: test6
        uses: ./.github/actions/generic-source-regression-check
        with:
          baseline_version: ${{ steps.version.outputs.version || env.BASELINE_VERSION }}
          github_repo: ${{ env.GITHUB_REPO }}
          lane_kind: ${{ env.LANE_KIND }}
          limited_cpu_probe: |
            set -euo pipefail
            CONTAINER="catboost-next-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            finish_candidate() {
              RC=$?
              trap - EXIT
              if docker container inspect "$CONTAINER" >/dev/null 2>&1; then
                docker rm -f "$CONTAINER" || RC=1
              fi
              exit "$RC"
            }
            trap finish_candidate EXIT
            docker run --rm -i --name "$CONTAINER" --cpus=2 --memory=8g --memory-swap=8g --pids-limit=512 \
              -e EXPECTED_VERSION="$LATEST_VERSION" -e CATBOOST_CPU_SMOKE="$CATBOOST_CPU_SMOKE" \
              "$PINNED_CONTAINER_IMAGE_CATBOOST" bash -se <<'CANDIDATE'
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            test "$(uname -m)" = aarch64
            timeout 300 apt-get update
            timeout 300 apt-get install -y --no-install-recommends ca-certificates python3-venv
            python3 -m venv /tmp/candidate-venv
            . /tmp/candidate-venv/bin/activate
            timeout 300 python -m pip install --only-binary=:all: "catboost==$EXPECTED_VERSION" 'numpy==1.23.5' 'pandas==1.5.3' 'scipy==1.10.1' 'matplotlib==3.7.5' 'plotly==5.24.1' 'graphviz==0.20.1' 'six==1.16.0'
            python -c "$CATBOOST_CPU_SMOKE"
            python -m pip list --format=json
            CANDIDATE
          limited_cpu_description: |
            Installed and verified the next CatBoost candidate's distribution and module versions on Arm64, trained the same tiny CPU classifier, and checked prediction count and labels. This is CPU smoke evidence only.
      - name: Calculate test summary
        id: summary
        if: always()
        run: |
          set -euo pipefail
          T1="${{ steps.test1.outputs.status || 'failed' }}"
          T2="${{ steps.test2.outputs.status || 'failed' }}"
          T3="${{ steps.test3.outputs.status || 'failed' }}"
          T4="${{ steps.test4.outputs.status || 'failed' }}"
          T5="${{ steps.test5.outputs.status || 'failed' }}"
          T6="${{ steps.test6.outputs.status || 'failed' }}"
          O1="${{ steps.test1.outcome || 'failure' }}"
          O2="${{ steps.test2.outcome || 'failure' }}"
          O3="${{ steps.test3.outcome || 'failure' }}"
          O4="${{ steps.test4.outcome || 'failure' }}"
          O5="${{ steps.test5.outcome || 'failure' }}"
          O6="${{ steps.test6.outcome || 'failure' }}"
          DECISION="${{ steps.test6.outputs.decision || '' }}"
          D1="${{ steps.test1.outputs.duration || '0' }}"
          D2="${{ steps.test2.outputs.duration || '0' }}"
          D3="${{ steps.test3.outputs.duration || '0' }}"
          D4="${{ steps.test4.outputs.duration || '0' }}"
          D5="${{ steps.test5.outputs.duration || '0' }}"
          D6="${{ steps.test6.outputs.duration || '0' }}"
          PASSED=0
          FAILED=0
          SKIPPED=0
          CORE_FAILED=0
          for RESULT in "$T1:$O1" "$T2:$O2" "$T3:$O3" "$T4:$O4" "$T5:$O5"; do
            if [ "$RESULT" = "passed:success" ]; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
              CORE_FAILED=$((CORE_FAILED + 1))
            fi
          done
          if [ "$T6" = "passed" ] && [ "$O6" = "success" ]; then
            PASSED=$((PASSED + 1))
          elif [ "$T6" = "skipped" ] && [ "$O6" = "success" ] && [ "$DECISION" = "no_newer_stable_available" ]; then
            SKIPPED=1
          else
            FAILED=$((FAILED + 1))
          fi
          DURATION=$((D1 + D2 + D3 + D4 + D5 + D6))
          OVERALL_STATUS=failure
          BADGE_STATUS=failing
          if [ "$FAILED" -eq 0 ]; then
            OVERALL_STATUS=success
          fi
          if [ "$CORE_FAILED" -eq 0 ]; then
            BADGE_STATUS=passing
          fi
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"
          echo "core_failed=$CORE_FAILED" >> "$GITHUB_OUTPUT"
          echo "overall_status=$OVERALL_STATUS" >> "$GITHUB_OUTPUT"
          echo "badge_status=$BADGE_STATUS" >> "$GITHUB_OUTPUT"
          [ "$OVERALL_STATUS" = "success" ]

name: Test Gem5 on Arm64

permissions:
  contents: read

on:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-gem5.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-gem5.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-gem5.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-gem5.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-gem5.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-gem5.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-gem5.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-gem5.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-gem5.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-gem5.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-gem5.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-gem5.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-gem5.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-gem5.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-gem5.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-gem5.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-gem5.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-gem5.outputs.regression_next_installed_version }}
      regression_policy:
        description: Regression applicability policy classification
        value: ${{ jobs.test-gem5.outputs.regression_policy }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-gem5.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-gem5.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-gem5.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-gem5.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-gem5.outputs.timestamp }}

jobs:
  test-gem5:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 210
    env:
      PINNED_CONTAINER_IMAGE_GEM5: ubuntu@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214 # original: ubuntu:20.04
      BASELINE_VERSION: "21.0.0.0"
      PACKAGE_SLUG: "gem5"
      LANE_KIND: "github release / source-build-or-tarball"
      DOWNLOAD_URL: "https://github.com/gem5/gem5/releases"
      HOMEPAGE_URL: "https://www.gem5.org/"
      OFFICIAL_DOCS: "https://www.gem5.org/documentation/"
      GITHUB_REPO: "gem5/gem5"
      PACKAGE_PAGE: "content/linux/opensource_packages/gem5.md"
      SOURCE_GLOBS: "src|configs|system|tests|SConstruct"
      EVIDENCE_RE: "gem5|simulator|architecture|system"
      TEST5_MODE: "source"
      PYTHON_TARGETS: ""
      GEM5_SMOKE: |
        LOG_DIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/gem5-smoke.XXXXXX")
        trap 'RESULT=$?; if [ "$RESULT" -ne 0 ]; then cat "$LOG_DIR"/*.log; fi; exit "$RESULT"' EXIT
        timeout --kill-after=30s 90m scons build/NULL/gem5.opt -j2 --without-tcmalloc >"$LOG_DIR/build.log" 2>&1
        timeout 30s build/NULL/gem5.opt --help >"$LOG_DIR/help.log" 2>&1
        grep -Eiq 'gem5|usage|options' "$LOG_DIR/help.log"
        cat "$LOG_DIR/help.log"

    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'Gem5'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      regression_policy: "applicable"
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=gem5" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/linux/opensource_packages/gem5" >> "$GITHUB_OUTPUT"

      - name: Bootstrap baseline dependencies
        uses: ./.github/actions/apt-bootstrap
        with:
          packages: "git curl jq tar unzip file ca-certificates build-essential scons python3-dev m4 zlib1g-dev libprotobuf-dev protobuf-compiler"
          quiet: "true"

      - name: Install baseline source or artifact
        id: install
        run: |
          set -euo pipefail
          trap 'RESULT=$?; if [ "$RESULT" -ne 0 ]; then echo "install_status=failed" >> "$GITHUB_OUTPUT"; fi; exit "$RESULT"' EXIT
          rm -rf baseline-src
          RESOLVED_TAG=""
          for CANDIDATE in "$BASELINE_VERSION" "v$BASELINE_VERSION"; do
            TAG_REF=$(git ls-remote --tags --refs "https://github.com/$GITHUB_REPO.git" "refs/tags/$CANDIDATE")
            if [ -n "$TAG_REF" ]; then
              RESOLVED_TAG="$CANDIDATE"
              break
            fi
          done
          test -n "$RESOLVED_TAG"
          git clone --depth 1 --branch "$RESOLVED_TAG" "https://github.com/$GITHUB_REPO.git" baseline-src
          test "$(git -C baseline-src describe --tags --exact-match)" = "$RESOLVED_TAG"
          echo "resolved_tag=$RESOLVED_TAG" >> "$GITHUB_OUTPUT"
          echo "install_mode=github_source" >> "$GITHUB_OUTPUT"
          echo "install_status=success" >> "$GITHUB_OUTPUT"

      - name: Get baseline version
        id: version
        run: |
          echo "version=$BASELINE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected baseline version: $BASELINE_VERSION"

      - name: Test 1 - Baseline package evidence
        id: test1
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          MODE="${{ steps.install.outputs.install_mode || '' }}"
          if [ ! -f "$PACKAGE_PAGE" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "${{ steps.install.outputs.install_status || 'failed' }}" != "success" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$MODE" = "github_source" ]; then
            FOUND=0
            IFS='|' read -r -a PATTERNS <<< "$SOURCE_GLOBS"
            for PATTERN in "${PATTERNS[@]}"; do
              [ -z "$PATTERN" ] && continue
              if compgen -G "baseline-src/$PATTERN" > /dev/null; then
                FOUND=1
                break
              fi
            done
            if [ "$FOUND" -ne 1 ]; then
              echo "status=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          else
            if [ ! -f baseline-external/metadata.txt ]; then
              echo "status=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi
          echo "status=passed" >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 2 - Baseline version and release alignment
        id: test2
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          MODE="${{ steps.install.outputs.install_mode || '' }}"
          if ! grep -Fq "version_number: $BASELINE_VERSION" "$PACKAGE_PAGE"; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$MODE" = "github_source" ]; then
            RESOLVED="${{ steps.install.outputs.resolved_tag || '' }}"
            if [ -z "$RESOLVED" ]; then
              echo "status=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            if [ "$RESOLVED" != "default_branch" ] && [ "$RESOLVED" != "$BASELINE_VERSION" ] && [ "$RESOLVED" != "v$BASELINE_VERSION" ]; then
              echo "status=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          else
            if [ ! -f baseline-external/metadata.txt ] || ! grep -Fq "$DOWNLOAD_URL" baseline-external/metadata.txt; then
              echo "status=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi
          echo "status=passed" >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 3 - Package-specific source or docs evidence
        id: test3
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          MODE="${{ steps.install.outputs.install_mode || '' }}"
          if [ "$MODE" = "github_source" ]; then
            if ! grep -R -I -Eiq "$EVIDENCE_RE" baseline-src 2>/dev/null; then
              echo "status=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            DOC_FOUND=0
            for PATTERN in 'README*' docs examples; do
              if compgen -G "baseline-src/$PATTERN" > /dev/null; then
                DOC_FOUND=1
                break
              fi
            done
            if [ "$DOC_FOUND" -ne 1 ]; then
              echo "status=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          else
            if ! grep -Eiq "$EVIDENCE_RE" "$PACKAGE_PAGE"; then
              echo "status=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            if ! grep -Fq "$HOMEPAGE_URL" baseline-external/metadata.txt; then
              echo "status=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi
          echo "status=passed" >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 4 - Arm64 support gate
        id: test4
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          if [ "$(uname -m)" != "aarch64" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if ! grep -q '^works_on_arm: true' "$PACKAGE_PAGE"; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "status=passed" >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 5 - Bounded package-specific smoke
        id: test5
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          WORKDIR=""
          CONTAINER=""
          finish() {
            RC=$?
            trap - EXIT
            if [ -n "$CONTAINER" ]; then sudo docker rm -f "$CONTAINER" >/dev/null 2>&1 || true; fi
            if [ -n "$WORKDIR" ]; then rm -rf "$WORKDIR"; fi
            if [ "$RC" -ne 0 ]; then
              echo "status=failed" >> "$GITHUB_OUTPUT"
              echo "note=gem5 baseline container build or binary execution failed on Arm64." >> "$GITHUB_OUTPUT"
              END_TIME=$(date +%s)
              echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
            fi
            exit "$RC"
          }
          trap finish EXIT
          MODE="${{ steps.install.outputs.install_mode || '' }}"
          if [ "$MODE" != "github_source" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "note=gem5 build smoke requires the checked-out source tree." >> "$GITHUB_OUTPUT"
            exit 1
          fi

          SOURCE_DIR=$(cd baseline-src && pwd)
          WORKDIR=$(mktemp -d "${RUNNER_TEMP}/gem5-baseline.XXXXXX")
          CONTAINER="gem5-baseline-$(basename "$WORKDIR")"
          timeout --kill-after=30s 5m sudo docker pull --platform linux/arm64 "$PINNED_CONTAINER_IMAGE_GEM5"
          timeout --kill-after=30s 105m sudo docker run --rm --pull=never \
            --name "$CONTAINER" --platform linux/arm64 \
            --cpus 2 --memory 8g --memory-swap 8g --pids-limit 512 \
            -e CC=gcc-10 -e CXX=g++-10 -e "GEM5_SMOKE=$GEM5_SMOKE" \
            -e RUNNER_TEMP=/tmp/gem5-logs -v "$SOURCE_DIR:/source:ro" \
            "$PINNED_CONTAINER_IMAGE_GEM5" bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              timeout --kill-after=30s 10m bash -euo pipefail -c "
                apt-get update
                apt-get install -y ca-certificates git file build-essential gcc-10 g++-10 scons python3-dev m4 zlib1g-dev libprotobuf-dev protobuf-compiler
              "
              cp -a --no-preserve=ownership /source /tmp/baseline-src
              cd /tmp/baseline-src
              rm -rf build
              mkdir -p "$RUNNER_TEMP"
              "$CXX" --version
              python3 --version
              scons --version
              bash -euo pipefail -c "$GEM5_SMOKE"
              cat "$RUNNER_TEMP"/gem5-smoke.*/build.log
              file build/NULL/gem5.opt
              sha256sum build/NULL/gem5.opt
              readelf -p .comment build/NULL/gem5.opt
            '
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "note=Built the baseline NULL gem5 binary and executed its help command in the pinned Focal Arm64 container. Full ISA simulation remains outside this smoke lane." >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 6 - Regression Validation
        id: test6
        uses: ./.github/actions/generic-source-regression-check
        with:
          baseline_version: ${{ steps.version.outputs.version || env.BASELINE_VERSION }}
          github_repo: ${{ env.GITHUB_REPO }}
          lane_kind: ${{ env.LANE_KIND }}
          limited_cpu_probe: |
            cd next-src
            bash -euo pipefail -c "$GEM5_SMOKE"
          limited_cpu_description: "Built the next gem5 source candidate as a bounded NULL binary and executed its help command on the Arm64 runner. Full ISA simulation remains scoped out of this smoke lane."
          defer_on_limited_cpu_probe_failure: "false"
      - name: Calculate test summary
        id: summary
        if: always()
        run: |
          set -euo pipefail
          T1="${{ steps.test1.outputs.status || 'failed' }}"
          T2="${{ steps.test2.outputs.status || 'failed' }}"
          T3="${{ steps.test3.outputs.status || 'failed' }}"
          T4="${{ steps.test4.outputs.status || 'failed' }}"
          T5="${{ steps.test5.outputs.status || 'failed' }}"
          T6="${{ steps.test6.outputs.status || 'failed' }}"
          O1="${{ steps.test1.outcome || 'failure' }}"
          O2="${{ steps.test2.outcome || 'failure' }}"
          O3="${{ steps.test3.outcome || 'failure' }}"
          O4="${{ steps.test4.outcome || 'failure' }}"
          O5="${{ steps.test5.outcome || 'failure' }}"
          O6="${{ steps.test6.outcome || 'failure' }}"
          DECISION="${{ steps.test6.outputs.decision || '' }}"
          D1="${{ steps.test1.outputs.duration || '0' }}"
          D2="${{ steps.test2.outputs.duration || '0' }}"
          D3="${{ steps.test3.outputs.duration || '0' }}"
          D4="${{ steps.test4.outputs.duration || '0' }}"
          D5="${{ steps.test5.outputs.duration || '0' }}"
          D6="${{ steps.test6.outputs.duration || '0' }}"
          PASSED=0
          FAILED=0
          SKIPPED=0
          CORE_FAILED=0
          for RESULT in "$T1:$O1" "$T2:$O2" "$T3:$O3" "$T4:$O4" "$T5:$O5"; do
            if [ "$RESULT" = "passed:success" ]; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
              CORE_FAILED=$((CORE_FAILED + 1))
            fi
          done
          if [ "$T6" = "passed" ] && [ "$O6" = "success" ]; then
            PASSED=$((PASSED + 1))
          elif [ "$T6" = "skipped" ] && [ "$O6" = "success" ] && [ "$DECISION" = "no_newer_stable_available" ]; then
            SKIPPED=1
          else
            FAILED=$((FAILED + 1))
          fi
          DURATION=$((D1 + D2 + D3 + D4 + D5 + D6))
          if [ "$FAILED" -eq 0 ]; then
            OVERALL_STATUS="success"
          else
            OVERALL_STATUS="failure"
          fi
          if [ "$CORE_FAILED" -eq 0 ]; then
            BADGE_STATUS="passing"
          else
            BADGE_STATUS="failing"
          fi
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"
          echo "core_failed=$CORE_FAILED" >> "$GITHUB_OUTPUT"
          echo "overall_status=$OVERALL_STATUS" >> "$GITHUB_OUTPUT"
          echo "badge_status=$BADGE_STATUS" >> "$GITHUB_OUTPUT"
          test "$FAILED" -eq 0

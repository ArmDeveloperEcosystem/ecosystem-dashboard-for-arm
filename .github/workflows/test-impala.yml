name: Test Impala on Arm64

permissions:
  contents: read

on:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-impala.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-impala.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-impala.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-impala.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-impala.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-impala.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-impala.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-impala.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-impala.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-impala.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-impala.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-impala.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-impala.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-impala.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-impala.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-impala.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-impala.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-impala.outputs.regression_next_installed_version }}
      regression_policy:
        description: Regression applicability policy for this workflow
        value: ${{ jobs.test-impala.outputs.regression_policy }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-impala.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-impala.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-impala.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-impala.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-impala.outputs.timestamp }}

jobs:
  test-impala:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      IMPALA_VERSION: "4.5.0"
      IMPALA_RELEASE_URL: "https://github.com/apache/impala/releases/download/4.5.0/apache-impala-4.5.0-RELEASE_hive-3.1.3-aarch64.ubuntu-20.04.deb"
      IMPALA_WORKDIR: "/tmp/impala-smoke"
      IMPALA_IMAGE: "ubuntu:20.04"

    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'Impala'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.summary.outputs.regression_status || 'failed' }}
      regression_decision: ${{ steps.summary.outputs.regression_decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      regression_policy: "applicable"
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=impala" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/opensource_packages/impala" >> "$GITHUB_OUTPUT"

      - name: Install Impala baseline
        id: install
        run: |
          set -euo pipefail
          docker --version >/dev/null

          rm -rf "${IMPALA_WORKDIR}"
          mkdir -p "${IMPALA_WORKDIR}/image" "${IMPALA_WORKDIR}/work"

          curl -fsSL -o "${IMPALA_WORKDIR}/work/impala.deb" "${IMPALA_RELEASE_URL}"
          dpkg-deb -x "${IMPALA_WORKDIR}/work/impala.deb" "${IMPALA_WORKDIR}/work/extracted"

          test -x "${IMPALA_WORKDIR}/work/extracted/opt/impala/sbin/impalad"
          test -x "${IMPALA_WORKDIR}/work/extracted/opt/impala/shell/impala-shell"

          cat > "${IMPALA_WORKDIR}/image/Dockerfile" <<'EOF'
          FROM ubuntu:20.04
          RUN apt-get update \
            && DEBIAN_FRONTEND=noninteractive apt-get install -y \
              ca-certificates \
              curl \
              file \
              openjdk-11-jre-headless \
              python3 \
              locales \
            && locale-gen en_US.UTF-8 \
            && rm -rf /var/lib/apt/lists/*
          ENV LC_ALL=C.UTF-8
          ENV LANG=C.UTF-8
          ENV JAVA_HOME=/usr/lib/jvm/java-11-openjdk-arm64
          EOF

          docker build --platform linux/arm64 -t "impala-arm64-smoke:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${IMPALA_WORKDIR}/image"

          cat > "${IMPALA_WORKDIR}/work/run_impala_command.sh" <<'EOF'
          set -euo pipefail
          ROOT="$1"
          shift
          export LD_LIBRARY_PATH="${ROOT}/opt/impala/lib/native:${ROOT}/opt/impala/lib:${ROOT}/opt/impala/lib64:${JAVA_HOME}/lib/server:${LD_LIBRARY_PATH:-}"
          exec "$@"
          EOF
          chmod +x "${IMPALA_WORKDIR}/work/run_impala_command.sh"

          docker run --rm --platform linux/arm64 \
            -v "${IMPALA_WORKDIR}/work:/work" \
            "impala-arm64-smoke:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            bash /work/run_impala_command.sh /work/extracted \
            /work/extracted/opt/impala/shell/impala-shell --version | tee /tmp/impala-shell-version.txt

          docker run --rm --platform linux/arm64 \
            -v "${IMPALA_WORKDIR}/work:/work" \
            "impala-arm64-smoke:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            bash /work/run_impala_command.sh /work/extracted \
            /work/extracted/opt/impala/sbin/impalad --version | tee /tmp/impalad-version.txt

          grep -q "${IMPALA_VERSION}" /tmp/impala-shell-version.txt
          grep -q "${IMPALA_VERSION}" /tmp/impalad-version.txt

          echo "image_tag=impala-arm64-smoke:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "work_dir=${IMPALA_WORKDIR}/work" >> "$GITHUB_OUTPUT"
          echo "install_status=success" >> "$GITHUB_OUTPUT"

      - name: Get Impala version
        id: version
        continue-on-error: true
        run: |
          set -euo pipefail
          VERSION="$(python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          current = os.environ["IMPALA_VERSION"]
          shell = re.findall(r'^Impala Shell v([0-9]+\.[0-9]+\.[0-9]+)-RELEASE\b',
                             Path('/tmp/impala-shell-version.txt').read_text(), re.M)
          server = re.findall(r'^impalad version ([0-9]+\.[0-9]+\.[0-9]+)-RELEASE\b',
                              Path('/tmp/impalad-version.txt').read_text(), re.M)
          if shell != [current] or server != [current]:
              raise SystemExit('Baseline shell/server versions do not match the pin')
          print(current)
          PY
          )"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          current = os.environ['IMPALA_VERSION']
          def emit(key, value):
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write(f'{key}={value}\n')

          releases = {}
          for page in range(1, 21):
              url = f'https://api.github.com/repos/apache/impala/releases?per_page=100&page={page}'
              with urllib.request.urlopen(url, timeout=30) as response:
                  data = json.load(response)
              if not isinstance(data, list):
                  raise SystemExit('Invalid release API response')
              for release in data:
                  if not isinstance(release, dict) or any(
                      type(release.get(flag)) is not bool for flag in ('draft', 'prerelease')
                  ) or not isinstance(release.get('tag_name'), str):
                      raise SystemExit('Malformed release metadata')
                  tag = release['tag_name']
                  if release['draft'] or release['prerelease'] or not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', tag):
                      continue
                  if tag in releases:
                      raise SystemExit('Duplicate release or repeated API page')
                  releases[tag] = release
              if len(data) < 100:
                  break
          else:
              raise SystemExit('Incomplete release pagination')
          if not releases:
              raise SystemExit('No stable releases returned by the API')
          version_key = lambda value: tuple(map(int, value.split('.')))
          newer = sorted((tag for tag in releases if version_key(tag) > version_key(current)), key=version_key)
          if not newer:
              if current not in releases:
                  raise SystemExit('Baseline absent: cannot establish no newer stable release')
              emit('latest', current)
          else:
              latest = newer[0]
              emit('latest', latest)
              assets = releases[latest].get('assets')
              if not isinstance(assets, list) or any(not isinstance(asset, dict) for asset in assets):
                  raise SystemExit('Invalid candidate assets')
              # The Hive build suffix differs between official Arm64 releases.
              pattern = rf'apache-impala-{re.escape(latest)}-RELEASE_hive-[0-9][0-9A-Za-z.-]*-aarch64\.ubuntu-20\.04\.deb'
              matches = [asset for asset in assets if re.fullmatch(pattern, asset.get('name', ''))]
              if len(matches) != 1:
                  raise SystemExit(f'Expected one Ubuntu 20.04 Arm64 asset for {latest}, found {len(matches)}')
              asset = matches[0]
              url = asset.get('browser_download_url')
              if (asset.get('state') != 'uploaded' or type(asset.get('size')) is not int or asset['size'] <= 0
                  or url != f"https://github.com/apache/impala/releases/download/{latest}/{asset['name']}"):
                  raise SystemExit('Invalid official candidate asset metadata')
              emit('next_url', url)
              print(f'Selected Impala {latest} asset: {url}')
          emit('discovery_status', 'success')
          PY

      - name: Test 1 - Check Impala server binaries exist
        id: test1
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          ROOT="${{ steps.install.outputs.work_dir }}/extracted/opt/impala"

          if [ -x "${ROOT}/sbin/impalad" ] && [ -x "${ROOT}/sbin/catalogd" ] && [ -x "${ROOT}/sbin/statestored" ] && [ -x "${ROOT}/shell/impala-shell" ]; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 2 - Check impala-shell version output
        id: test2
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)

          if grep -q "${IMPALA_VERSION}" /tmp/impala-shell-version.txt; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            cat /tmp/impala-shell-version.txt || true
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 3 - Check impala-shell help output
        id: test3
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          IMAGE="${{ steps.install.outputs.image_tag }}"
          WORK_DIR="${{ steps.install.outputs.work_dir }}"

          if docker run --rm --platform linux/arm64 -v "${WORK_DIR}:/work" "${IMAGE}" \
            bash /work/run_impala_command.sh /work/extracted \
            /work/extracted/opt/impala/shell/impala-shell --help 2>&1 | tee /tmp/impala-shell-help.txt | grep -Eqi 'usage|options|impala-shell'; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            cat /tmp/impala-shell-help.txt || true
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 4 - Architecture verification
        id: test4
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          ROOT="${{ steps.install.outputs.work_dir }}/extracted/opt/impala"

          if [ "$(uname -m)" = "aarch64" ] && file "${ROOT}/sbin/impalad" | grep -qi 'ARM aarch64'; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            uname -m
            file "${ROOT}/sbin/impalad" || true
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 5 - Check impalad version output
        id: test5
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)

          if grep -q "${IMPALA_VERSION}" /tmp/impalad-version.txt; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            cat /tmp/impalad-version.txt || true
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 6 - Regression Validation
        id: test6
        if: always()
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          CURRENT="${{ steps.version.outputs.version }}"
          LATEST="${{ steps.version.outputs.latest }}"
          IMAGE="${{ steps.install.outputs.image_tag }}"
          WORK_DIR="${{ steps.install.outputs.work_dir }}"
          NEXT_URL="${{ steps.version.outputs.next_url }}"
          STATUS=failed
          DECISION=next_lookup_failed
          NEXT_INSTALLED=not_installed
          RESULT="Next stable release discovery failed"
          COMPARISON="Release discovery did not establish a usable official Arm64 candidate."
          finish() {
            rc=$?
            trap - EXIT
            if [ "$rc" -ne 0 ]; then
              STATUS=failed
              echo "::error::${RESULT} (exit ${rc})"
            fi
            echo "current_version=${CURRENT:-unknown}" >> "$GITHUB_OUTPUT"
            echo "latest_version=${LATEST:-unknown}" >> "$GITHUB_OUTPUT"
            echo "next_installed_version=${NEXT_INSTALLED}" >> "$GITHUB_OUTPUT"
            case "$DECISION:$STATUS" in
              baseline_failed:skipped)
                echo "decision=baseline_failed" >> "$GITHUB_OUTPUT"
                echo "status=skipped" >> "$GITHUB_OUTPUT" ;;
              no_newer_stable_available:skipped)
                echo "decision=no_newer_stable_available" >> "$GITHUB_OUTPUT"
                echo "status=skipped" >> "$GITHUB_OUTPUT" ;;
              next_install_validated:passed)
                echo "decision=next_install_validated" >> "$GITHUB_OUTPUT"
                echo "status=passed" >> "$GITHUB_OUTPUT" ;;
              next_lookup_failed:*)
                echo "decision=next_lookup_failed" >> "$GITHUB_OUTPUT"
                echo "status=failed" >> "$GITHUB_OUTPUT" ;;
              *)
                echo "decision=next_install_failed" >> "$GITHUB_OUTPUT"
                echo "status=failed" >> "$GITHUB_OUTPUT" ;;
            esac
            echo "regression_result=${RESULT}" >> "$GITHUB_OUTPUT"
            echo "comparison=${COMPARISON}" >> "$GITHUB_OUTPUT"
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish EXIT

          if [ "${{ steps.install.outcome }}" != success ] || \
             [ "${{ steps.test1.outputs.status }}:${{ steps.test1.outcome }}" != passed:success ] || \
             [ "${{ steps.test2.outputs.status }}:${{ steps.test2.outcome }}" != passed:success ] || \
             [ "${{ steps.test3.outputs.status }}:${{ steps.test3.outcome }}" != passed:success ] || \
             [ "${{ steps.test4.outputs.status }}:${{ steps.test4.outcome }}" != passed:success ] || \
             [ "${{ steps.test5.outputs.status }}:${{ steps.test5.outcome }}" != passed:success ]; then
            DECISION=baseline_failed
            RESULT="Regression validation skipped because baseline validation failed."
            COMPARISON="Baseline tests failed, so next-version validation is not trustworthy for this run."
            STATUS=skipped
            exit 0
          fi

          test "${{ steps.version.outcome }}" = success
          test "${{ steps.version.outputs.discovery_status }}" = success
          test "$CURRENT" = "$IMPALA_VERSION"
          [[ "$LATEST" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [ "${LATEST}" = "${CURRENT}" ]; then
            test -z "$NEXT_URL"
            DECISION=no_newer_stable_available
            RESULT="No newer stable version available for Arm64 regression validation"
            COMPARISON="Current pinned Impala version ${CURRENT} passed smoke tests; complete official release discovery found no newer stable release."
            STATUS=skipped
            exit 0
          fi

          test -n "$NEXT_URL"
          DECISION=next_install_failed
          RESULT="Next version install failed on Arm64"
          COMPARISON="Candidate ${LATEST} did not complete download, extraction, architecture and shell/server version validation."
          rm -rf "${WORK_DIR}/next-extracted"
          curl -fsSL -o "${WORK_DIR}/impala-next.deb" "${NEXT_URL}"
          dpkg-deb -x "${WORK_DIR}/impala-next.deb" "${WORK_DIR}/next-extracted"

          test "$(uname -m)" = aarch64
          test -x "${WORK_DIR}/next-extracted/opt/impala/shell/impala-shell"
          test -x "${WORK_DIR}/next-extracted/opt/impala/sbin/impalad"
          file "${WORK_DIR}/next-extracted/opt/impala/sbin/impalad" > "${WORK_DIR}/next-architecture.txt"
          grep -q 'ARM aarch64' "${WORK_DIR}/next-architecture.txt"
          docker run --rm --platform linux/arm64 -v "${WORK_DIR}:/work" "${IMAGE}" \
            bash /work/run_impala_command.sh /work/next-extracted \
            /work/next-extracted/opt/impala/shell/impala-shell --version 2>&1 | tee "${WORK_DIR}/next-shell-version.txt"
          docker run --rm --platform linux/arm64 -v "${WORK_DIR}:/work" "${IMAGE}" \
            bash /work/run_impala_command.sh /work/next-extracted \
            /work/next-extracted/opt/impala/sbin/impalad --version 2>&1 | tee "${WORK_DIR}/next-impalad-version.txt"

          python3 - "$WORK_DIR" "$LATEST" <<'PY'
          from pathlib import Path
          import re
          import sys
          root, expected = Path(sys.argv[1]), sys.argv[2]
          for name, pattern in (
              ('next-shell-version.txt', r'^Impala Shell v([0-9]+\.[0-9]+\.[0-9]+)-RELEASE\b'),
              ('next-impalad-version.txt', r'^impalad version ([0-9]+\.[0-9]+\.[0-9]+)-RELEASE\b'),
          ):
              if re.findall(pattern, (root / name).read_text(), re.M) != [expected]:
                  raise SystemExit(f'{name} did not report exactly Impala {expected}')
          PY
          NEXT_INSTALLED="$LATEST"
          DECISION=next_install_validated
          RESULT="Next version installed successfully on Arm64"
          COMPARISON="Current pinned Impala version ${CURRENT} passed smoke tests. Official candidate ${LATEST} contains an Arm64 impalad; both impala-shell and impalad reported the expected version inside an Ubuntu 20.04 Arm64 container."
          STATUS=passed
          finish
      - name: Calculate test summary
        if: always()
        id: summary
        run: |
          set -euo pipefail
          PASSED=0
          FAILED=0
          SKIPPED=0
          TOTAL_DURATION=0
          CORE_FAILED=0

          check_test() {
            local status="$1"
            local outcome="$2" duration="$3"
            if [[ "$duration" =~ ^[0-9]{1,6}$ ]]; then
              TOTAL_DURATION=$((TOTAL_DURATION + 10#$duration))
            else
              status=failed
            fi
            if [ "$status" = "passed" ] && [ "$outcome" = success ]; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
              CORE_FAILED=$((CORE_FAILED + 1))
            fi
          }

          check_test "${{ steps.test1.outputs.status }}" "${{ steps.test1.outcome }}" "${{ steps.test1.outputs.duration || 0 }}"
          check_test "${{ steps.test2.outputs.status }}" "${{ steps.test2.outcome }}" "${{ steps.test2.outputs.duration || 0 }}"
          check_test "${{ steps.test3.outputs.status }}" "${{ steps.test3.outcome }}" "${{ steps.test3.outputs.duration || 0 }}"
          check_test "${{ steps.test4.outputs.status }}" "${{ steps.test4.outcome }}" "${{ steps.test4.outputs.duration || 0 }}"
          check_test "${{ steps.test5.outputs.status }}" "${{ steps.test5.outcome }}" "${{ steps.test5.outputs.duration || 0 }}"

          TEST6_STATUS=failed
          TEST6_DECISION="${{ steps.test6.outputs.decision || 'next_install_failed' }}"
          DURATION6="${{ steps.test6.outputs.duration || 0 }}"
          if [[ "$DURATION6" =~ ^[0-9]{1,6}$ ]]; then
            TOTAL_DURATION=$((TOTAL_DURATION + 10#$DURATION6))
            if [ "${{ steps.test6.outcome }}" = success ]; then
              if [ "$CORE_FAILED" -gt 0 ] && \
                 [ "${{ steps.test6.outputs.status }}:${{ steps.test6.outputs.decision }}" = skipped:baseline_failed ]; then
                TEST6_STATUS=skipped
              elif [ "$CORE_FAILED" -eq 0 ] && [ "${{ steps.install.outcome }}" = success ] && \
                   [ "${{ steps.version.outcome }}" = success ] && \
                   [ "${{ steps.version.outputs.discovery_status }}" = success ] && \
                   [ "${{ steps.version.outputs.version }}" = "$IMPALA_VERSION" ] && \
                   [ "${{ steps.test6.outputs.current_version }}" = "$IMPALA_VERSION" ] && \
                   [ "${{ steps.test6.outputs.latest_version }}" = "${{ steps.version.outputs.latest }}" ]; then
                case "${{ steps.test6.outputs.status }}:${{ steps.test6.outputs.decision }}" in
                  passed:next_install_validated)
                    if [ -n "${{ steps.version.outputs.latest }}" ] && \
                       [ "${{ steps.version.outputs.latest }}" != "$IMPALA_VERSION" ] && \
                       [ "${{ steps.test6.outputs.next_installed_version }}" = "${{ steps.version.outputs.latest }}" ]; then
                      TEST6_STATUS=passed
                    fi ;;
                  skipped:no_newer_stable_available)
                    if [ "${{ steps.version.outputs.latest }}" = "$IMPALA_VERSION" ] && \
                       [ -z "${{ steps.version.outputs.next_url }}" ] && \
                       [ "${{ steps.test6.outputs.next_installed_version }}" = not_installed ]; then
                      TEST6_STATUS=skipped
                    fi ;;
                esac
              fi
            fi
          fi
          case "$TEST6_STATUS" in
            passed) PASSED=$((PASSED + 1)) ;;
            skipped) SKIPPED=1 ;;
            *)
              FAILED=$((FAILED + 1))
              case "$TEST6_DECISION" in
                next_lookup_failed|next_install_failed) ;;
                *) TEST6_DECISION=next_install_failed ;;
              esac ;;
          esac
          echo "regression_status=${TEST6_STATUS}" >> "$GITHUB_OUTPUT"
          echo "regression_decision=${TEST6_DECISION}" >> "$GITHUB_OUTPUT"

          echo "passed=${PASSED}" >> "$GITHUB_OUTPUT"
          echo "failed=${FAILED}" >> "$GITHUB_OUTPUT"
          echo "skipped=${SKIPPED}" >> "$GITHUB_OUTPUT"
          echo "core_failed=${CORE_FAILED}" >> "$GITHUB_OUTPUT"
          echo "duration=${TOTAL_DURATION}" >> "$GITHUB_OUTPUT"

          if [ "${FAILED}" -eq 0 ]; then
            echo "overall_status=success" >> "$GITHUB_OUTPUT"
            echo "badge_status=passing" >> "$GITHUB_OUTPUT"
          else
            echo "overall_status=failure" >> "$GITHUB_OUTPUT"
            echo "badge_status=failing" >> "$GITHUB_OUTPUT"
          fi

          if [ "${FAILED}" -ne 0 ]; then
            exit 1
          fi

      - name: Create test summary
        if: always()
        run: |
          {
            echo "## Impala Test Results"
            echo ""
            echo "- **Version:** ${{ steps.version.outputs.version }}"
            echo "- **Status:** ${{ steps.summary.outputs.overall_status }}"
            echo "- **Tests Passed:** ${{ steps.summary.outputs.passed }}"
            echo "- **Tests Failed:** ${{ steps.summary.outputs.failed }}"
            echo "- **Tests Skipped:** ${{ steps.summary.outputs.skipped }}"
            echo "- **Runner:** ubuntu-24.04 (arm64)"
            echo ""
            echo "### Test Details"
            echo "1. Test 1 - Check Impala server binaries exist: ${{ steps.test1.outputs.status || 'failed' }} (step outcome: ${{ steps.test1.outcome }})"
            echo "2. Test 2 - Check impala-shell version output: ${{ steps.test2.outputs.status || 'failed' }} (step outcome: ${{ steps.test2.outcome }})"
            echo "3. Test 3 - Check impala-shell help output: ${{ steps.test3.outputs.status || 'failed' }} (step outcome: ${{ steps.test3.outcome }})"
            echo "4. Test 4 - Architecture verification: ${{ steps.test4.outputs.status || 'failed' }} (step outcome: ${{ steps.test4.outcome }})"
            echo "5. Test 5 - Check impalad version output: ${{ steps.test5.outputs.status || 'failed' }} (step outcome: ${{ steps.test5.outcome }})"
            echo "6. Test 6 - Regression Validation: ${{ steps.summary.outputs.regression_status || 'failed' }} (step outcome: ${{ steps.test6.outcome }})"
            echo ""
            echo "### Regression Validation (Next Version Install)"
            echo "- **Current version tested in Tests 1-5:** ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}"
            echo "- **Next version targeted for install validation:** ${{ steps.test6.outputs.latest_version || 'not_yet_checked' }}"
            echo "- **Next version installed on Arm64:** ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}"
            echo "- **Regression install result:** ${{ steps.test6.outputs.regression_result || 'Regression result unavailable.' }}"
            echo "- **Details:** ${{ steps.test6.outputs.comparison || 'Regression validation did not produce a result; this is a failure.' }}"
          } >> "$GITHUB_STEP_SUMMARY"

name: Generated site data review (dormant)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generated-site-data-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  activation:
    name: Verify dormant activation gate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      base_branch: ${{ steps.gate.outputs.base_branch }}
      base_sha: ${{ steps.gate.outputs.base_sha }}
    steps:
      - name: Require an explicitly enabled manual branch run
        id: gate
        env:
          GENERATED_SITE_DATA_REVIEW_ENABLED: ${{ vars.GENERATED_SITE_DATA_REVIEW_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$GENERATED_SITE_DATA_REVIEW_ENABLED" == "true" ]] || {
            echo "Generated site data review is dormant. Set GENERATED_SITE_DATA_REVIEW_ENABLED to exactly true for a bounded manual run." >&2
            exit 1
          }
          [[ "$GITHUB_REF_TYPE" == "branch" ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          git check-ref-format --branch "$GITHUB_REF_NAME" >/dev/null
          {
            printf 'base_branch=%s\n' "$GITHUB_REF_NAME"
            printf 'base_sha=%s\n' "$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"

  generate:
    name: Generate bounded site data artifact
    needs: activation
    if: ${{ vars.GENERATED_SITE_DATA_REVIEW_ENABLED == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    permissions:
      contents: read
    outputs:
      archive_sha256: ${{ steps.package.outputs.archive_sha256 }}
      base_sha: ${{ steps.package.outputs.base_sha }}
    steps:
      - name: Check out the exact reviewed base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.activation.outputs.base_sha }}

      - name: Set up pinned preprocessing Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install hash-locked preprocessing dependency
        run: >-
          python3 -m pip install
          --disable-pip-version-check
          --no-deps
          --only-binary=:all:
          --require-hashes
          --requirement .github/scripts/generated-site-data-requirements.txt

      - name: Run existing site-data preprocessing
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse --verify 'HEAD^{commit}')" == "${{ needs.activation.outputs.base_sha }}" ]]
          python3 ./build_steps/update_category_mappings.py
          python3 ./build_steps/update_recently_added_json.py
          python3 ./build_steps/validate_package_catagories.py

      - name: Package exact generated files
        id: package
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/generated-site-data"
          python3 .github/scripts/generated_site_data_artifact.py pack \
            --repository "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/generated-site-data/generated-site-data.zip" \
            --base-sha "${{ needs.activation.outputs.base_sha }}" \
            >> "$GITHUB_OUTPUT"

      - name: Upload exact generated artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-site-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/generated-site-data/generated-site-data.zip
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 1

  publish:
    name: Open generated site data draft PR
    needs:
      - activation
      - generate
    if: >-
      ${{
        needs.activation.result == 'success' &&
        needs.generate.result == 'success' &&
        vars.GENERATED_SITE_DATA_REVIEW_ENABLED == 'true'
      }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    environment: generated-data-delivery
    permissions:
      contents: read
    steps:
      - name: Reject a missing or malformed App bot login
        env:
          DASHBOARD_DELIVERY_APP_BOT_LOGIN: ${{ vars.DASHBOARD_DELIVERY_APP_BOT_LOGIN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          login = os.environ.get("DASHBOARD_DELIVERY_APP_BOT_LOGIN", "")
          pattern = re.compile(
              r"^[A-Za-z0-9](?:[A-Za-z0-9-]{0,98}[A-Za-z0-9])?\[bot\]$"
          )
          if not pattern.fullmatch(login) or login.casefold() == "github-actions[bot]":
              raise SystemExit("DASHBOARD_DELIVERY_APP_BOT_LOGIN is missing or malformed")
          PY

      - name: Check out the exact artifact base without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.generate.outputs.base_sha }}

      - name: Download the exact generated artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-site-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/generated-site-data-download
          digest-mismatch: error

      - name: Validate and restore only allowlisted site data
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/generated_site_data_artifact.py restore \
            --repository "$GITHUB_WORKSPACE" \
            --artifact-directory "$RUNNER_TEMP/generated-site-data-download" \
            --expected-base-sha "${{ needs.generate.outputs.base_sha }}" \
            --expected-archive-sha256 "${{ needs.generate.outputs.archive_sha256 }}"

      - name: Mint short-lived Dashboard Delivery App token
        id: delivery_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.DASHBOARD_DELIVERY_APP_ID }}
          private-key: ${{ secrets.DASHBOARD_DELIVERY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-metadata: read
          permission-pull-requests: write

      - name: Reverify exact bytes after credential minting
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/generated_site_data_artifact.py verify-restored \
            --repository "$GITHUB_WORKSPACE" \
            --artifact-directory "$RUNNER_TEMP/generated-site-data-download" \
            --expected-base-sha "${{ needs.generate.outputs.base_sha }}" \
            --expected-archive-sha256 "${{ needs.generate.outputs.archive_sha256 }}"

      - name: Publish deterministic generated-data draft PR
        id: publish
        uses: ./.github/actions/publish-generated-data-pr
        with:
          producer: site-preprocessing
          base-branch: ${{ needs.activation.outputs.base_branch }}
          expected-base-sha: ${{ needs.generate.outputs.base_sha }}
          head-branch: automation/generated-data/site-preprocessing/${{ needs.activation.outputs.base_branch }}
          title: Update generated site data
          commit-message: Update generated site data
          paths: |
            data/category_data.yml
            data/category_data_windows.yml
            data/recently_added_packages.yaml
          required-tracked-paths: |
            data/category_data.yml
            data/category_data_windows.yml
            data/recently_added_packages.yaml
          expected-pr-author-login: ${{ vars.DASHBOARD_DELIVERY_APP_BOT_LOGIN }}
          credential-source: github-app
        env:
          GH_TOKEN: ${{ steps.delivery_token.outputs.token }}

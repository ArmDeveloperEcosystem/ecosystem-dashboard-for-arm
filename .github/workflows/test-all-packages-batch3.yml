name: Test All Packages (Batch 3) on Arm64
run-name: Arm64 Batch 3 [${{ inputs.orchestration_id || format('manual-{0}-{1}', github.run_id, github.run_attempt) }}] [nonce:${{ inputs.dispatch_nonce || 'manual-only' }}]

on:
  workflow_dispatch:
    inputs:
      orchestration_id:
        description: Exact orchestrator identity; blank uses a safe manual fallback
        required: false
        default: ""
        type: string
      dispatch_nonce:
        description: Secret exact-dispatch nonce; blank is manual-only and not publishable
        required: false
        default: ""
        type: string
      expected_sha:
        description: Exact commit expected by the orchestrator
        required: false
        default: ""
        type: string
      expected_branch:
        description: Exact branch expected by the orchestrator
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      orchestration_id:
        required: true
        type: string
      dispatch_nonce:
        required: true
        type: string
      expected_sha:
        required: true
        type: string
      expected_branch:
        required: true
        type: string

permissions:
  contents: read

jobs:

  test-ydata-profiling:
    uses: ./.github/workflows/test-ydata-profiling.yml

  test-jmeter:
    uses: ./.github/workflows/test-jmeter.yml

  test-spring_cloud_task:
    uses: ./.github/workflows/test-spring_cloud_task.yml

  test-cloudevents-python:
    uses: ./.github/workflows/test-cloudevents-python.yml

  test-xtrabackup:
    uses: ./.github/workflows/test-xtrabackup.yml

  test-mpfr:
    uses: ./.github/workflows/test-mpfr.yml

  test-keydb:
    uses: ./.github/workflows/test-keydb.yml

  test-tensorflow:
    uses: ./.github/workflows/test-tensorflow.yml

  test-gunicorn:
    uses: ./.github/workflows/test-gunicorn.yml

  test-circleci_cli:
    uses: ./.github/workflows/test-circleci_cli.yml

  test-groovy_grails:
    uses: ./.github/workflows/test-groovy_grails.yml

  test-kaezip:
    uses: ./.github/workflows/test-kaezip.yml

  test-apache_drill:
    uses: ./.github/workflows/test-apache_drill.yml

  test-tiffin:
    uses: ./.github/workflows/test-tiffin.yml

  test-heketi:
    uses: ./.github/workflows/test-heketi.yml

  test-hawking:
    uses: ./.github/workflows/test-hawking.yml

  test-mongodb-c-driver:
    uses: ./.github/workflows/test-mongodb-c-driver.yml

  test-logstash:
    uses: ./.github/workflows/test-logstash.yml

  test-calico:
    uses: ./.github/workflows/test-calico.yml

  test-openebs:
    uses: ./.github/workflows/test-OpenEBS.yml

  test-gmp:
    uses: ./.github/workflows/test-gmp.yml

  test-freeimage:
    uses: ./.github/workflows/test-freeimage.yml

  test-cobbler:
    uses: ./.github/workflows/test-cobbler.yml

  test-cloud-custodian:
    uses: ./.github/workflows/test-cloud-custodian.yml

  test-fio:
    uses: ./.github/workflows/test-fio.yml

  test-spring_cloud_netflix:
    uses: ./.github/workflows/test-spring_cloud_netflix.yml

  test-nats:
    uses: ./.github/workflows/test-nats.yml

  test-dragonfly:
    uses: ./.github/workflows/test-dragonfly.yml

  test-nodejs:
    uses: ./.github/workflows/test-nodejs.yml

  test-apache-shiro:
    uses: ./.github/workflows/test-apache-shiro.yml

  test-zlib:
    uses: ./.github/workflows/test-zlib.yml

  test-murmurhash:
    uses: ./.github/workflows/test-murmurhash.yml

  test-elastic-mockopampserver:
    uses: ./.github/workflows/test-elastic-mockopampserver.yml

  test-harness-cli:
    uses: ./.github/workflows/test-harness-cli.yml

  test-ovs:
    uses: ./.github/workflows/test-OVS.yml

  test-in-toto:
    uses: ./.github/workflows/test-in-toto.yml

  test-libuv:
    uses: ./.github/workflows/test-libuv.yml

  test-pigz:
    uses: ./.github/workflows/test-pigz.yml

  test-miniasm:
    uses: ./.github/workflows/test-miniasm.yml

  test-timescaledb:
    uses: ./.github/workflows/test-timescaledb.yml

  test-wget:
    uses: ./.github/workflows/test-wget.yml

  test-threatmapper:
    uses: ./.github/workflows/test-threatmapper.yml

  test-opensearch:
    uses: ./.github/workflows/test-opensearch.yml

  test-azurelinux:
    uses: ./.github/workflows/test-azurelinux.yml

  test-bentoml:
    uses: ./.github/workflows/test-bentoml.yml

  summary:
    permissions:
      actions: read
      contents: read
    needs:
      [
        test-ydata-profiling,
        test-jmeter,
        test-spring_cloud_task,
        test-cloudevents-python,
        test-xtrabackup,
        test-mpfr,
        test-keydb,
        test-tensorflow,
        test-gunicorn,
        test-circleci_cli,
        test-groovy_grails,
        test-kaezip,
        test-apache_drill,
        test-tiffin,
        test-heketi,
        test-hawking,
        test-mongodb-c-driver,
        test-logstash,
        test-calico,
        test-openebs,
        test-gmp,
        test-freeimage,
        test-cobbler,
        test-cloud-custodian,
        test-fio,
        test-spring_cloud_netflix,
        test-nats,
        test-dragonfly,
        test-nodejs,
        test-apache-shiro,
        test-zlib,
        test-murmurhash,
        test-elastic-mockopampserver,
        test-harness-cli,
        test-ovs,
        test-in-toto,
        test-libuv,
        test-pigz,
        test-miniasm,
        test-timescaledb,
        test-wget,
        test-threatmapper,
        test-opensearch,
        test-azurelinux,
        test-bentoml
      ]
    runs-on: ubuntu-24.04-arm
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect batch results
        id: collect
        uses: ./.github/actions/collect-batch-results
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        with:
          batch_number: "3"
          batch_title: "Batch 3"

      - name: Attest complete batch results
        id: attest
        if: steps.collect.outcome == 'success'
        env:
          ARTIFACT_NAME: batch3-test-results
          BATCH_NUMBER: "3"
          COLLECTOR_JSON_COUNT: ${{ steps.collect.outputs.json_count }}
          CURRENT_BRANCH: ${{ github.ref_name }}
          DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
          EXPECTED_BRANCH: ${{ inputs.expected_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          NEEDS_JSON: ${{ toJson(needs) }}
          ORCHESTRATION_ID: ${{ inputs.orchestration_id }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/batch_artifact_attestation.py create \
            --results-root test-results \
            --workflow-file ".github/workflows/test-all-packages-batch3.yml" \
            --batch "$BATCH_NUMBER" \
            --repository "$REPOSITORY" \
            --expected-branch "$EXPECTED_BRANCH" \
            --current-branch "$CURRENT_BRANCH" \
            --expected-sha "$EXPECTED_SHA" \
            --workflow-sha "$WORKFLOW_SHA" \
            --orchestration-id "$ORCHESTRATION_ID" \
            --dispatch-nonce "$DISPATCH_NONCE" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --artifact-name "$ARTIFACT_NAME" \
            --collector-json-count "$COLLECTOR_JSON_COUNT" \
            --needs-environment-variable NEEDS_JSON

      - name: Upload batch test results
        if: steps.collect.outcome == 'success' && steps.attest.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: batch3-test-results
          path: test-results
          retention-days: 90

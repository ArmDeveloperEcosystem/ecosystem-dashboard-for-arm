name: Test gVisor OCI guest smoke under systrap (no KVM) on Arm64

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      contract_version:
        description: contract version
        value: ${{ jobs.test-gVisor.outputs.contract_version }}
      package_slug:
        description: package slug
        value: ${{ jobs.test-gVisor.outputs.package_slug }}
      package_name:
        description: package name
        value: ${{ jobs.test-gVisor.outputs.package_name }}
      package_version:
        description: package version
        value: ${{ jobs.test-gVisor.outputs.package_version }}
      run_status:
        description: run status
        value: ${{ jobs.test-gVisor.outputs.run_status }}
      badge_status:
        description: badge status
        value: ${{ jobs.test-gVisor.outputs.badge_status }}
      core_failed:
        description: core failed
        value: ${{ jobs.test-gVisor.outputs.core_failed }}
      tests_passed:
        description: tests passed
        value: ${{ jobs.test-gVisor.outputs.tests_passed }}
      tests_failed:
        description: tests failed
        value: ${{ jobs.test-gVisor.outputs.tests_failed }}
      tests_skipped:
        description: tests skipped
        value: ${{ jobs.test-gVisor.outputs.tests_skipped }}
      duration_seconds:
        description: duration seconds
        value: ${{ jobs.test-gVisor.outputs.duration_seconds }}
      regression_status:
        description: regression status
        value: ${{ jobs.test-gVisor.outputs.regression_status }}
      regression_decision:
        description: regression decision
        value: ${{ jobs.test-gVisor.outputs.regression_decision }}
      regression_result:
        description: regression result
        value: ${{ jobs.test-gVisor.outputs.regression_result }}
      regression_comparison:
        description: regression comparison
        value: ${{ jobs.test-gVisor.outputs.regression_comparison }}
      regression_current_version:
        description: regression current version
        value: ${{ jobs.test-gVisor.outputs.regression_current_version }}
      regression_latest_version:
        description: regression latest version
        value: ${{ jobs.test-gVisor.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: regression next installed version
        value: ${{ jobs.test-gVisor.outputs.regression_next_installed_version }}
      regression_policy:
        description: regression policy
        value: ${{ jobs.test-gVisor.outputs.regression_policy }}
      run_id:
        description: run id
        value: ${{ jobs.test-gVisor.outputs.run_id }}
      run_attempt:
        description: run attempt
        value: ${{ jobs.test-gVisor.outputs.run_attempt }}
      job_name:
        description: job name
        value: ${{ jobs.test-gVisor.outputs.job_name }}
      dashboard_link:
        description: dashboard link
        value: ${{ jobs.test-gVisor.outputs.dashboard_link }}
      timestamp:
        description: timestamp
        value: ${{ jobs.test-gVisor.outputs.timestamp }}
jobs:
  test-gVisor:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      BASELINE_TAG: "release-20261019.0"
      # Publisher SHA256SUMS / release asset digest, verified 2026-10-27.
      BASELINE_SHA256: "5790f89dc94b091b5aa0f0b6596aa4391606b3fe5f069e68f440576f3388abd8"
      CANDIDATE_TAG: "release-20261102.0"
      # Publisher SHA256SUMS / release asset digest, verified 2026-11-04.
      CANDIDATE_SHA256: "909c95f245a46000d3bb0d5285f07dde23597056e7c3a4aab758b218e95bdab0"
    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: "gVisor"
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '5' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '5' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'failed' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'baseline_failed' }}
      regression_result: ${{ steps.test6.outputs.regression_result || 'No regression validation evidence.' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'No regression validation evidence.' }}
      regression_current_version: ${{ steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'not_selected' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      regression_policy: "applicable"
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          # shellcheck disable=SC2129
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=gVisor" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/linux/opensource_packages/gVisor" >> "$GITHUB_OUTPUT"

      - name: Install verified complete gVisor bundle and distribution static BusyBox
        id: install
        run: |
          set -euo pipefail
          [ "$(uname -m)" = aarch64 ]
          sudo apt-get update
          sudo apt-get install -y busybox-static binutils file jq
          [ "$(dpkg-query -W -f='${Architecture}' busybox-static)" = arm64 ]
          VERIFY=$(dpkg -V busybox-static)
          [ -z "$VERIFY" ]
          BUSYBOX=$(dpkg-query -L busybox-static | awk '/\/busybox$/ {print; exit}')
          [ -x "$BUSYBOX" ]
          readelf -l "$BUSYBOX" > "$RUNNER_TEMP/gvisor-busybox-elf.txt"
          if grep -q INTERP "$RUNNER_TEMP/gvisor-busybox-elf.txt"; then
            echo "busybox-static unexpectedly contains an interpreter" >&2
            exit 1
          fi
          dpkg-query -W -f='${Package} ${Version} ${Architecture}\n' busybox-static
          WORK_DIR=$(mktemp -d "$RUNNER_TEMP/gvisor-install.XXXXXX")
          ARCHIVE="$WORK_DIR/gvisor-aarch64.tar.bz2"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 \
            "https://github.com/google/gvisor/releases/download/$BASELINE_TAG/gvisor-aarch64.tar.bz2" -o "$ARCHIVE"
          printf '%s  %s\n' "$BASELINE_SHA256" "$ARCHIVE" | sha256sum -c -
          mkdir "$WORK_DIR/bin"
          tar -xjf "$ARCHIVE" -C "$WORK_DIR/bin"
          [ -x "$WORK_DIR/bin/runsc" ]
          [ -x "$WORK_DIR/bin/gvisor-bin/gvisor_sentry" ]
          chmod -R a+rX "$WORK_DIR"
          printf 'binary_path=%s\nbusybox_path=%s\narchive=%s\n' \
            "$WORK_DIR/bin/runsc" "$BUSYBOX" "$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Read exact installed version
        id: version
        env:
          BINARY: ${{ steps.install.outputs.binary_path }}
        run: |
          set -euo pipefail
          REPORTED=$(timeout --kill-after=2s 10s "$BINARY" --version)
          printf '%s\n' "$REPORTED"
          VERSION=$(printf '%s\n' "$REPORTED" | awk '/^runsc version / {print $3}')
          [ "$VERSION" = "$BASELINE_TAG" ]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test 1 - Complete runtime bundle
        id: test1
        continue-on-error: true
        env:
          BINARY: ${{ steps.install.outputs.binary_path }}
          ARCHIVE: ${{ steps.install.outputs.archive }}
          REPORTED_VERSION: ${{ steps.version.outputs.version }}
          BUSYBOX: ${{ steps.install.outputs.busybox_path }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            rc=$?
            trap - EXIT
            status=failed
            [ "$rc" -ne 0 ] || status=passed
            printf 'status=%s\nduration=%s\n' "$status" "$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish EXIT
          [ -x "$BINARY" ]
          [ -x "$(dirname "$BINARY")/gvisor-bin/gvisor_sentry" ]
          [ -x "$(dirname "$BINARY")/containerd-shim-runsc-v1" ]

      - name: Test 2 - Exact version
        id: test2
        continue-on-error: true
        env:
          BINARY: ${{ steps.install.outputs.binary_path }}
          ARCHIVE: ${{ steps.install.outputs.archive }}
          REPORTED_VERSION: ${{ steps.version.outputs.version }}
          BUSYBOX: ${{ steps.install.outputs.busybox_path }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            rc=$?
            trap - EXIT
            status=failed
            [ "$rc" -ne 0 ] || status=passed
            printf 'status=%s\nduration=%s\n' "$status" "$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish EXIT
          [ "$REPORTED_VERSION" = "$BASELINE_TAG" ]
          OUTPUT=$(timeout --kill-after=2s 10s "$BINARY" --version)
          printf '%s\n' "$OUTPUT" | grep -Fx "runsc version $BASELINE_TAG"

      - name: Test 3 - Pinned archive checksum
        id: test3
        continue-on-error: true
        env:
          BINARY: ${{ steps.install.outputs.binary_path }}
          ARCHIVE: ${{ steps.install.outputs.archive }}
          REPORTED_VERSION: ${{ steps.version.outputs.version }}
          BUSYBOX: ${{ steps.install.outputs.busybox_path }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            rc=$?
            trap - EXIT
            status=failed
            [ "$rc" -ne 0 ] || status=passed
            printf 'status=%s\nduration=%s\n' "$status" "$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish EXIT
          printf '%s  %s\n' "$BASELINE_SHA256" "$ARCHIVE" | sha256sum -c -

      - name: Test 4 - Native static Arm64 runtime and rootfs
        id: test4
        continue-on-error: true
        env:
          BINARY: ${{ steps.install.outputs.binary_path }}
          ARCHIVE: ${{ steps.install.outputs.archive }}
          REPORTED_VERSION: ${{ steps.version.outputs.version }}
          BUSYBOX: ${{ steps.install.outputs.busybox_path }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            rc=$?
            trap - EXIT
            status=failed
            [ "$rc" -ne 0 ] || status=passed
            printf 'status=%s\nduration=%s\n' "$status" "$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish EXIT
          [ "$(uname -m)" = aarch64 ]
          file "$BINARY" | grep -Eqi 'aarch64|arm64'
          file "$BUSYBOX" | grep -Eqi 'aarch64|arm64'
          [ "$(dpkg-query -W -f='${Architecture}' busybox-static)" = arm64 ]
          VERIFY=$(dpkg -V busybox-static)
          [ -z "$VERIFY" ]
          readelf -l "$BUSYBOX" > "$RUNNER_TEMP/gvisor-busybox-elf.txt"
          ! grep -q INTERP "$RUNNER_TEMP/gvisor-busybox-elf.txt"

      - name: Test 5 - Read-only network-disabled OCI guest and exit propagation
        id: test5
        continue-on-error: true
        env:
          BINARY: ${{ steps.install.outputs.binary_path }}
          ARCHIVE: ${{ steps.install.outputs.archive }}
          REPORTED_VERSION: ${{ steps.version.outputs.version }}
          BUSYBOX: ${{ steps.install.outputs.busybox_path }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            rc=$?
            trap - EXIT
            status=failed
            [ "$rc" -ne 0 ] || status=passed
            printf 'status=%s\nduration=%s\n' "$status" "$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish EXIT
          timeout --kill-after=5s 100s sudo bash .github/scripts/tests/gvisor_smoke.sh "$BINARY" "$BUSYBOX"

      - name: Test 6 - Newer-release native Arm64 systrap regression
        id: test6
        if: always()
        continue-on-error: true
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          VERSION_OUTCOME: ${{ steps.version.outcome }}
          S1: ${{ steps.test1.outputs.status }}
          O1: ${{ steps.test1.outcome }}
          S2: ${{ steps.test2.outputs.status }}
          O2: ${{ steps.test2.outcome }}
          S3: ${{ steps.test3.outputs.status }}
          O3: ${{ steps.test3.outcome }}
          S4: ${{ steps.test4.outputs.status }}
          O4: ${{ steps.test4.outcome }}
          S5: ${{ steps.test5.outputs.status }}
          O5: ${{ steps.test5.outcome }}
          BUSYBOX: ${{ steps.install.outputs.busybox_path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          STATUS=failed
          DECISION=next_lookup_failed
          LATEST_VERSION=not_selected
          NEXT_INSTALLED_VERSION=not_installed
          REGRESSION_RESULT="The authoritative latest stable gVisor release could not be selected."
          COMPARISON="No latest-release claim or candidate validation is valid without a successful authoritative lookup."
          CANDIDATE_DIR=
          RELEASE_JSON=
          finish() {
            rc=$?
            trap - EXIT
            if [ -n "$CANDIDATE_DIR" ] && ! rm -rf "$CANDIDATE_DIR"; then
              rc=1
            fi
            if [ -n "$RELEASE_JSON" ] && ! rm -f "$RELEASE_JSON"; then
              rc=1
            fi
            if [ "$rc" -ne 0 ] && [ "$DECISION" != baseline_failed ] && [ "$DECISION" != next_lookup_failed ]; then
              STATUS=failed
              DECISION=next_regression_failed
            fi
            {
              echo "status=$STATUS"
              echo "decision=$DECISION"
              echo "duration=$(($(date +%s) - START_TIME))"
              echo "latest_version=$LATEST_VERSION"
              echo "next_installed_version=$NEXT_INSTALLED_VERSION"
              echo "regression_result=$REGRESSION_RESULT"
              echo "comparison=$COMPARISON"
            } >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish EXIT
          if [ "$INSTALL_OUTCOME" != success ] || [ "$VERSION_OUTCOME" != success ]; then
            STATUS=skipped
            DECISION=baseline_failed
            LATEST_VERSION=not_selected
            REGRESSION_RESULT="The baseline installation or version check failed; no newer release was tested."
            COMPARISON="No comparison is valid because the baseline setup failed."
          fi
          for i in 1 2 3 4 5; do
            s="S$i"; o="O$i"
            if [ "${!s}" != passed ] || [ "${!o}" != success ]; then
              STATUS=skipped
              DECISION=baseline_failed
              LATEST_VERSION=not_selected
              REGRESSION_RESULT="A mandatory baseline test failed; no newer release was tested."
              COMPARISON="No comparison is valid because the baseline behavior failed."
            fi
          done
          if [ "$DECISION" = baseline_failed ]; then
            exit 0
          fi
          RELEASE_JSON=$(mktemp "$RUNNER_TEMP/gvisor-latest.XXXXXX.json")
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 15 --max-time 60 \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Authorization: Bearer ${GH_TOKEN:?}" \
            "https://api.github.com/repos/google/gvisor/releases/latest" -o "$RELEASE_JSON"
          unset GH_TOKEN GITHUB_TOKEN
          LOOKED_UP_VERSION=$(jq -er '
            select(.draft == false and .prerelease == false) |
            select(.published_at | type == "string" and length > 0) |
            .tag_name |
            select(type == "string" and test("^release-[0-9]{8}\\.[0-9]+$"))
          ' "$RELEASE_JSON")
          LATEST_VERSION="$LOOKED_UP_VERSION"
          [[ "$CANDIDATE_TAG" =~ ^release-([0-9]{8})\.([0-9]+)$ ]]
          CANDIDATE_DATE=${BASH_REMATCH[1]}
          CANDIDATE_REVISION=$((10#${BASH_REMATCH[2]}))
          [[ "$LATEST_VERSION" =~ ^release-([0-9]{8})\.([0-9]+)$ ]]
          LATEST_DATE=${BASH_REMATCH[1]}
          LATEST_REVISION=$((10#${BASH_REMATCH[2]}))
          if [ "$LATEST_VERSION" != "$CANDIDATE_TAG" ]; then
            if [[ "$LATEST_DATE" > "$CANDIDATE_DATE" ]] || \
              { [ "$LATEST_DATE" = "$CANDIDATE_DATE" ] && [ "$LATEST_REVISION" -gt "$CANDIDATE_REVISION" ]; }; then
              STATUS=deferred
              DECISION=upgrade_candidate_available
              REGRESSION_RESULT="GitHub reports newer stable gVisor release $LATEST_VERSION; the unpinned release was not downloaded or executed."
              COMPARISON="Pinned candidate $CANDIDATE_TAG is stale. Pin $LATEST_VERSION and its publisher checksum before native Arm64 validation."
              exit 0
            fi
            REGRESSION_RESULT="GitHub latest stable release $LATEST_VERSION precedes pinned candidate $CANDIDATE_TAG."
            COMPARISON="Authoritative release metadata and the pinned candidate disagree; validation failed closed."
            exit 1
          fi
          test -n "$BUSYBOX"
          DECISION=next_regression_failed
          REGRESSION_RESULT="The pinned latest stable gVisor release did not complete the Arm64 systrap guest smoke."
          COMPARISON="The baseline passed, but the pinned latest stable release failed the same OCI guest behavior."
          CANDIDATE_DIR=$(mktemp -d "$RUNNER_TEMP/gvisor-candidate.XXXXXX")
          ARCHIVE="$CANDIDATE_DIR/gvisor-aarch64.tar.bz2"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 \
            "https://github.com/google/gvisor/releases/download/$CANDIDATE_TAG/gvisor-aarch64.tar.bz2" -o "$ARCHIVE"
          printf '%s  %s\n' "$CANDIDATE_SHA256" "$ARCHIVE" | sha256sum -c -
          mkdir "$CANDIDATE_DIR/bin"
          tar -xjf "$ARCHIVE" -C "$CANDIDATE_DIR/bin"
          CANDIDATE_BINARY="$CANDIDATE_DIR/bin/runsc"
          test -x "$CANDIDATE_BINARY"
          test -x "$CANDIDATE_DIR/bin/gvisor-bin/gvisor_sentry"
          chmod -R a+rX "$CANDIDATE_DIR"
          REPORTED=$(timeout --kill-after=2s 10s "$CANDIDATE_BINARY" --version)
          printf '%s\n' "$REPORTED" | grep -Fx "runsc version $CANDIDATE_TAG"
          timeout --kill-after=5s 100s sudo bash .github/scripts/tests/gvisor_smoke.sh \
            "$CANDIDATE_BINARY" "$BUSYBOX"
          STATUS=passed
          DECISION=validated_next_release
          NEXT_INSTALLED_VERSION="$CANDIDATE_TAG"
          REGRESSION_RESULT="GitHub latest stable release $LATEST_VERSION matched the pinned candidate and passed the native Arm64 systrap OCI guest smoke."
          COMPARISON="Both the baseline and pinned latest stable release passed marker, tmpfs write, read-only root, and exit-code propagation checks."

      - name: Calculate fail-closed test summary
        id: summary
        if: always()
        env:
          S1: ${{ steps.test1.outputs.status }}
          O1: ${{ steps.test1.outcome }}
          S2: ${{ steps.test2.outputs.status }}
          O2: ${{ steps.test2.outcome }}
          S3: ${{ steps.test3.outputs.status }}
          O3: ${{ steps.test3.outcome }}
          S4: ${{ steps.test4.outputs.status }}
          O4: ${{ steps.test4.outcome }}
          S5: ${{ steps.test5.outputs.status }}
          O5: ${{ steps.test5.outcome }}
          D1: ${{ steps.test1.outputs.duration || '0' }}
          D2: ${{ steps.test2.outputs.duration || '0' }}
          D3: ${{ steps.test3.outputs.duration || '0' }}
          D4: ${{ steps.test4.outputs.duration || '0' }}
          D5: ${{ steps.test5.outputs.duration || '0' }}
          D6: ${{ steps.test6.outputs.duration || '0' }}
          S6: ${{ steps.test6.outputs.status }}
          O6: ${{ steps.test6.outcome }}
          DECISION: ${{ steps.test6.outputs.decision }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          VERSION_OUTCOME: ${{ steps.version.outcome }}
        run: |
          set -euo pipefail
          PASSED=0
          FAILED=0
          SKIPPED=0
          CORE_FAILED=0
          TOTAL_DURATION=0
          for i in 1 2 3 4 5; do
            s="S$i"; o="O$i"; d="D$i"
            if [ "$INSTALL_OUTCOME" = success ] && [ "$VERSION_OUTCOME" = success ] && [ "${!s}" = passed ] && [ "${!o}" = success ]; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
              CORE_FAILED=$((CORE_FAILED + 1))
            fi
            value="${!d}"
            [[ "$value" =~ ^[0-9]+$ ]] || value=0
            TOTAL_DURATION=$((TOTAL_DURATION + value))
          done
          if [ "$CORE_FAILED" -eq 0 ] && [ "$O6" = success ] && [ "$S6" = passed ] && [ "$DECISION" = validated_next_release ]; then
            PASSED=$((PASSED + 1))
          elif [ "$CORE_FAILED" -eq 0 ] && [ "$O6" = success ] && [ "$S6" = deferred ] && [ "$DECISION" = upgrade_candidate_available ]; then
            SKIPPED=1
          elif [ "$CORE_FAILED" -gt 0 ] && [ "$O6" = success ] && [ "$S6" = skipped ] && [ "$DECISION" = baseline_failed ]; then
            SKIPPED=1
          else
            FAILED=$((FAILED + 1))
          fi
          [[ "$D6" =~ ^[0-9]+$ ]] || D6=0
          TOTAL_DURATION=$((TOTAL_DURATION + D6))
          STATUS=failure
          BADGE=failing
          if [ "$FAILED" -eq 0 ] && [ "$CORE_FAILED" -eq 0 ] && [ "$INSTALL_OUTCOME" = success ] && [ "$VERSION_OUTCOME" = success ]; then
            STATUS=success
            BADGE=passing
          fi
          printf 'passed=%s\nfailed=%s\nskipped=%s\ncore_failed=%s\nduration=%s\noverall_status=%s\nbadge_status=%s\n' \
            "$PASSED" "$FAILED" "$SKIPPED" "$CORE_FAILED" "$TOTAL_DURATION" "$STATUS" "$BADGE" >> "$GITHUB_OUTPUT"
          [ "$STATUS" = success ]

      - name: Publish scoped summary
        if: always()
        env:
          VERSION: ${{ steps.version.outputs.version || 'unknown' }}
          STATUS: ${{ steps.summary.outputs.overall_status || 'failure' }}
          PASSED: ${{ steps.summary.outputs.passed || '0' }}
          FAILED: ${{ steps.summary.outputs.failed || '5' }}
          SKIPPED: ${{ steps.summary.outputs.skipped || '0' }}
          REGRESSION: ${{ steps.test6.outputs.status || 'failed' }}
          DECISION: ${{ steps.test6.outputs.decision || 'baseline_failed' }}
          LATEST_VERSION: ${{ steps.test6.outputs.latest_version || 'not_selected' }}
          NEXT_INSTALLED_VERSION: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
          REGRESSION_RESULT: ${{ steps.test6.outputs.regression_result || 'No regression validation evidence.' }}
          COMPARISON: ${{ steps.test6.outputs.comparison || 'No regression validation evidence.' }}
        run: |
          {
            echo "## gVisor OCI guest smoke under systrap (no KVM)"
            echo "- Version: $VERSION"
            echo "- Baseline status: $STATUS; passed=$PASSED failed=$FAILED skipped/deferred=$SKIPPED"
            echo "- Runner: ubuntu-24.04-arm"
            echo "- Scope: gVisor OCI guest smoke under systrap (no KVM)."
            echo "- Test 6: $REGRESSION ($DECISION); authoritative latest=$LATEST_VERSION; installed candidate=$NEXT_INSTALLED_VERSION."
            echo "- Test 6 result: $REGRESSION_RESULT"
            echo "- Comparison: $COMPARISON"
            echo "- Historical Arm minimum is not exercised by this modern baseline."
          } >> "$GITHUB_STEP_SUMMARY"

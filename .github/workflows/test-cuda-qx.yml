name: Test CUDA-QX on Arm64

permissions:
  contents: read

on:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-cuda-qx.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-cuda-qx.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-cuda-qx.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-cuda-qx.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-cuda-qx.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-cuda-qx.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-cuda-qx.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-cuda-qx.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-cuda-qx.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-cuda-qx.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-cuda-qx.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-cuda-qx.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-cuda-qx.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-cuda-qx.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-cuda-qx.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-cuda-qx.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-cuda-qx.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-cuda-qx.outputs.regression_next_installed_version }}
      regression_policy:
        description: Regression applicability policy classification
        value: ${{ jobs.test-cuda-qx.outputs.regression_policy }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-cuda-qx.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-cuda-qx.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-cuda-qx.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-cuda-qx.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-cuda-qx.outputs.timestamp }}

jobs:
  test-cuda-qx:
    runs-on: ubuntu-24.04-arm
    env:
      BASELINE_VERSION: "0.2.0"
      PACKAGE_SLUG: "cuda-qx"
      LANE_KIND: "gpu/specialized/manual-review"
      DOWNLOAD_URL: "https://github.com/NVIDIA/cudaqx/releases"
      HOMEPAGE_URL: "https://nvidia.github.io/cudaqx/"
      OFFICIAL_DOCS: "https://nvidia.github.io/cudaqx/quickstart/installation.html"
      GITHUB_REPO: "NVIDIA/cudaqx"
      PACKAGE_PAGE: "content/linux/opensource_packages/cuda-qx.md"
      GIT_LFS_SKIP_SMUDGE: "1"
      CUDA_QX_CPU_PREFLIGHT: |
        python3 - "$PREFLIGHT_SOURCE_DIR" <<'PY'
        import os
        import platform
        import re
        import subprocess
        import sys
        import tempfile
        import tomllib
        from pathlib import Path

        def verify_source(root, expected_libs=""):
            def require_file(relative):
                path = root / relative
                if not path.is_file() or not path.stat().st_size:
                    raise SystemExit(f"missing CUDA-QX source file: {relative}")
                return path

            cmake = require_file("CMakeLists.txt").read_text(encoding="utf-8")
            # Official 0.2.0 declares qec;solvers; 0.8.0 declares qec only.
            # Recognize these literal declarations, not arbitrary CMake code.
            declarations = re.findall(
                r'^\s*set\(CUDAQX_ALL_LIBS\s+"([^"]+)"\s*\)\s*$', cmake, re.M
            )
            if len(declarations) != 1 or declarations[0] not in ("qec;solvers", "qec"):
                raise SystemExit("unrecognized CUDA-QX CUDAQX_ALL_LIBS declaration")
            libraries = declarations[0]
            if expected_libs and libraries != expected_libs:
                raise SystemExit(f"expected CUDA-QX libraries {expected_libs}, found {libraries}")
            require_file("libs/core/include/cuda-qx/core/tear_down.h")
            for library in libraries.split(";"):
                base = f"libs/{library}"
                package = f"{base}/python/cudaq_{library}"
                require_file(f"{base}/CMakeLists.txt")
                require_file(f"{base}/python/CMakeLists.txt")
                require_file(f"{package}/__init__.py")
                metadata = sorted((root / base).glob("pyproject.toml*"))
                if not metadata:
                    raise SystemExit(f"missing CUDA-QX package metadata: {base}/pyproject.toml*")
                names = {
                    "pyproject.toml": f"cudaq-{library}",
                    "pyproject.toml.cu12": f"cudaq-{library}-cu12",
                    "pyproject.toml.cu13": f"cudaq-{library}-cu13",
                }
                for path in metadata:
                    with path.open("rb") as stream:
                        data = tomllib.load(stream)
                    if path.name not in names or data.get("project", {}).get("name") != names[path.name]:
                        raise SystemExit(f"wrong CUDA-QX package identity: {path.relative_to(root)}")
                sources = sorted((root / package).rglob("*.py"))
                for path in sources:
                    # Compile without importing GPU dependencies or writing bytecode.
                    compile(path.read_bytes(), str(path), "exec")
                print(f"python-source-compiled: {package} ({len(sources)} files)", flush=True)

            with tempfile.TemporaryDirectory(prefix="cudaqx-header-") as temporary:
                probe = Path(temporary) / "probe.cpp"
                probe.write_text('''
        #include <cuda-qx/core/tear_down.h>
        #include <memory>
        #include <type_traits>
        static_assert(std::is_abstract_v<cudaqx::tear_down>);
        static_assert(std::has_virtual_destructor_v<cudaqx::tear_down>);
        static_assert(std::is_same_v<decltype(&cudaqx::tear_down::runTearDown),
                                    void (cudaqx::tear_down::*)() const>);
        static_assert(std::is_same_v<decltype(&cudaqx::scheduleTearDown),
                                    void (*)(std::unique_ptr<cudaqx::tear_down>)>);
        struct ProofTearDown final : cudaqx::tear_down {
          void runTearDown() const override {}
        };
        int main() {
          std::unique_ptr<cudaqx::tear_down> proof(new ProofTearDown());
          proof->runTearDown();
          return 0;
        }
        ''', encoding="utf-8")
                subprocess.run(
                    ["g++", "-std=c++17", f"-I{root / 'libs/core/include'}",
                     "-fsyntax-only", str(probe)], check=True, timeout=30,
                )
            print(f"cudaqx-source-preflight-ok: libraries={libraries}; core C++ API syntax and Python sources compiled")

        if __name__ == "__main__":
            if platform.system() != "Linux" or platform.machine() != "aarch64":
                raise SystemExit("CUDA-QX workflow preflight requires a Linux Arm64 runner")
            verify_source(Path(sys.argv[1]).resolve(), os.environ.get("PREFLIGHT_EXPECTED_LIBS", ""))
        PY

    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'CUDA-QX'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.summary.outputs.test6_status || 'failed' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      regression_policy: "applicable"
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          # shellcheck disable=SC2129
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=cuda-qx" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/linux/opensource_packages/cuda-qx" >> "$GITHUB_OUTPUT"

      - name: Bootstrap baseline dependencies
        uses: ./.github/actions/apt-bootstrap
        with:
          packages: "git curl jq tar unzip file ca-certificates g++ git-lfs"
          quiet: "true"

      - name: Install baseline source or artifact
        id: install
        run: |
          # shellcheck disable=SC2129
          set -euo pipefail
          write_output() {
            printf '%s\n' "$@" >> "$GITHUB_OUTPUT"
          }
          rm -rf baseline-src baseline-external
          mkdir -p baseline-src baseline-external
          if [ -n "$GITHUB_REPO" ]; then
            RESOLVED_TAG=""
            for CANDIDATE in "$BASELINE_VERSION" "v$BASELINE_VERSION"; do
              if git ls-remote --tags --refs "https://github.com/$GITHUB_REPO.git" "refs/tags/$CANDIDATE" | grep -q .; then
                RESOLVED_TAG="$CANDIDATE"
                break
              fi
            done
            if [ -n "$RESOLVED_TAG" ]; then
              git clone --depth 1 --branch "$RESOLVED_TAG" "https://github.com/$GITHUB_REPO.git" baseline-src >/dev/null 2>&1 || true
              write_output "resolved_tag=$RESOLVED_TAG"
            else
              git clone --depth 1 "https://github.com/$GITHUB_REPO.git" baseline-src >/dev/null 2>&1 || true
              write_output "resolved_tag=default_branch"
            fi
            if [ -d baseline-src/.git ] || [ -f baseline-src/README.md ] || [ -n "$(find baseline-src -mindepth 1 -maxdepth 2 -print -quit 2>/dev/null)" ]; then
              write_output "install_mode=github_source" "install_status=success"
              exit 0
            fi
          fi
          if curl -fsLI "$DOWNLOAD_URL" >/dev/null 2>&1 || curl -fsLI "$HOMEPAGE_URL" >/dev/null 2>&1; then
            printf 'download=%s\nhomepage=%s\ndocs=%s\n' "$DOWNLOAD_URL" "$HOMEPAGE_URL" "$OFFICIAL_DOCS" > baseline-external/metadata.txt
            write_output "resolved_tag=external_artifact" "install_mode=external_artifact" "install_status=success"
            exit 0
          fi
          write_output "install_mode=unresolved" "install_status=failed"
          exit 1

      - name: Get baseline version
        id: version
        run: |
          echo "version=$BASELINE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected baseline version: $BASELINE_VERSION"

      - name: Test 1 - Baseline package evidence
        id: test1
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          if [ ! -f "$PACKAGE_PAGE" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "${{ steps.install.outputs.install_status || 'failed' }}" = "success" ]; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 2 - Baseline version and release alignment
        id: test2
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          MODE="${{ steps.install.outputs.install_mode || '' }}"
          if ! grep -Fq "version_number: $BASELINE_VERSION" "$PACKAGE_PAGE"; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$MODE" = "github_source" ]; then
            RESOLVED="${{ steps.install.outputs.resolved_tag || '' }}"
            if [ -z "$RESOLVED" ]; then
              echo "status=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            if [ "$RESOLVED" != "default_branch" ] && [ "$RESOLVED" != "$BASELINE_VERSION" ] && [ "$RESOLVED" != "v$BASELINE_VERSION" ]; then
              echo "status=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          else
            if [ ! -f baseline-external/metadata.txt ] || ! grep -Fq "$DOWNLOAD_URL" baseline-external/metadata.txt; then
              echo "status=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi
          echo "status=passed" >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 3 - Package-specific source or docs evidence
        id: test3
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          MODE="${{ steps.install.outputs.install_mode || '' }}"
          if [ "$MODE" = "github_source" ]; then
            cd baseline-src
            FOUND_PATH=""
            for candidate in CMakeLists.txt libs/core/include/cuda-qx/core/tear_down.h libs/qec/python/cudaq_qec libs/solvers/python/cudaq_solvers docs/sphinx/index.rst; do
              if [ -e "$candidate" ]; then
                FOUND_PATH="$candidate"
                break
              fi
            done
            if [ -n "$FOUND_PATH" ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
              echo "manifest=$FOUND_PATH" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          else
            if [ -f baseline-external/metadata.txt ]; then
              grep -Eq '^docs=https?://' baseline-external/metadata.txt
              grep -Eq '^homepage=https?://' baseline-external/metadata.txt
              echo "status=passed" >> "$GITHUB_OUTPUT"
              echo "manifest=external-metadata-doc-links" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 4 - Architecture Verification
        id: test4
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          if [ "$(uname -m)" != "aarch64" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if ! grep -q '^works_on_arm: true' "$PACKAGE_PAGE"; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "status=passed" >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 5 - Bounded package-specific smoke
        id: test5
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local rc="$1"
            trap - EXIT
            if [ "$rc" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish "$?"' EXIT
          MODE="${{ steps.install.outputs.install_mode || '' }}"
          if [ "$MODE" != "github_source" ]; then
            echo "note=CUDA-QX Arm preflight requires the package source checkout; metadata-only evidence is not treated as a smoke pass." >> "$GITHUB_OUTPUT"
            exit 1
          fi
          PREFLIGHT_SOURCE_DIR=baseline-src PREFLIGHT_EXPECTED_LIBS='qec;solvers' \
            timeout 120s bash -euo pipefail -c "$CUDA_QX_CPU_PREFLIGHT"
          echo "note=CUDA-QX Arm preflight passed: checked declared qec/solvers layout and package identities, compiled the core C++ API surface and Python sources; CUDA-Q/GPU/QPU runtime execution is not claimed." >> "$GITHUB_OUTPUT"
          finish 0

      - name: Test 6 - Regression Validation
        id: test6
        uses: ./.github/actions/generic-source-regression-check
        with:
          baseline_version: ${{ steps.version.outputs.version || env.BASELINE_VERSION }}
          github_repo: ${{ env.GITHUB_REPO }}
          lane_kind: ${{ env.LANE_KIND }}
          limited_cpu_probe: |
            set -euo pipefail
            PREFLIGHT_SOURCE_DIR=next-src PREFLIGHT_EXPECTED_LIBS='' \
              timeout 120s bash -euo pipefail -c "$CUDA_QX_CPU_PREFLIGHT"
          limited_cpu_description: "Bounded CUDA-QX CPU source preflight: check the declared library layout and package identities, compile the core C++ API surface and all declared Python package sources (qec-only or qec/solvers). The status and decision report the outcome. No package installation, CUDA-Q, GPU, or QPU runtime execution is claimed."
      - name: Calculate test summary
        id: summary
        if: always()
        run: |
          # shellcheck disable=SC2129
          set -euo pipefail
          PASSED=0
          FAILED=0
          SKIPPED=0
          CORE_FAILED=0
          DURATION=0
          check_core_test() {
            if [ "$1" = "passed" ] && [ "$3" = "success" ]; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
              CORE_FAILED=$((CORE_FAILED + 1))
            fi
            DURATION=$((DURATION + $2))
          }
          check_core_test "${{ steps.test1.outputs.status || 'failed' }}" "${{ steps.test1.outputs.duration || '0' }}" "${{ steps.test1.outcome }}"
          check_core_test "${{ steps.test2.outputs.status || 'failed' }}" "${{ steps.test2.outputs.duration || '0' }}" "${{ steps.test2.outcome }}"
          check_core_test "${{ steps.test3.outputs.status || 'failed' }}" "${{ steps.test3.outputs.duration || '0' }}" "${{ steps.test3.outcome }}"
          check_core_test "${{ steps.test4.outputs.status || 'failed' }}" "${{ steps.test4.outputs.duration || '0' }}" "${{ steps.test4.outcome }}"
          check_core_test "${{ steps.test5.outputs.status || 'failed' }}" "${{ steps.test5.outputs.duration || '0' }}" "${{ steps.test5.outcome }}"
          T6="${{ steps.test6.outputs.status || 'failed' }}"
          O6="${{ steps.test6.outcome }}"
          if [ "$T6" = "passed" ] && [ "$O6" = "success" ]; then
            PASSED=$((PASSED + 1))
          elif [ "$T6" = "skipped" ] && [ "$O6" = "success" ]; then
            SKIPPED=$((SKIPPED + 1))
          else
            T6=failed
            FAILED=$((FAILED + 1))
          fi
          DURATION=$((DURATION + ${{ steps.test6.outputs.duration || '0' }}))
          if [ "$FAILED" -eq 0 ]; then
            OVERALL_STATUS="success"
          else
            OVERALL_STATUS="failure"
          fi
          if [ "$CORE_FAILED" -eq 0 ]; then
            BADGE_STATUS="passing"
          else
            BADGE_STATUS="failing"
          fi
          {
            echo "passed=$PASSED"
            echo "failed=$FAILED"
            echo "skipped=$SKIPPED"
            echo "duration=$DURATION"
            echo "core_failed=$CORE_FAILED"
            echo "overall_status=$OVERALL_STATUS"
            echo "badge_status=$BADGE_STATUS"
            echo "test6_status=$T6"
          } >> "$GITHUB_OUTPUT"
          [ "$OVERALL_STATUS" = "success" ]

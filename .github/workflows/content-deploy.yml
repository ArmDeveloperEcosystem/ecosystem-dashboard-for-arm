# This is a basic workflow to help you get started with Actions

name: content-deploy

# Controls when the workflow will run
on:
  # Triggers the workflow on push to production branch
  push:
    branches: [production]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      validate_ssh_only:
        description: Validate the pinned runner's Akamai NetStorage SSH support without deploying
        type: boolean
        default: false

permissions:
  contents: read

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  validate_netstorage_ssh_client:
    name: Validate NetStorage SSH client
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Require Akamai DSA host-key support
        shell: bash
        run: |
          set -euo pipefail
          ssh -V
          ssh -Q HostKeyAlgorithms | grep -Fx ssh-dss
          ssh -G -o HostKeyAlgorithms=+ssh-dss netstorage.invalid >/dev/null

  build_and_deploy:
    name: Build and deploy production content
    needs: validate_netstorage_ssh_client
    runs-on: ubuntu-24.04-arm

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true  # Fetch Hugo Themes
          fetch-depth: 0
          persist-credentials: false

      # Sets Up Hugo
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78  # v3.2.1
        with:
          hugo-version: '0.130.0'
          extended: true

      # Post-CSS install
      - name: Install Post-CSS
        run: npm install postcss-cli

      # Builds ecosystem-dashboard-for-arm repo
      - name: Build
        run: |
          export HUGO_PRODUCTION=true
          hugo --minify

      #  Copy SSH Key
      - name: copy key
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.validate_ssh_only == false }}
        run: |
          printf '%s' "$SSH_KEY" | tr -d '[:space:]' | base64 -d > key
          chmod 400 key
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}

      # SCP Site contents to netstorage
      - name: copy site content
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.validate_ssh_only == false }}
        run: |
          cd public
          zip -r public.zip .
          cd ..
          scp -i key \
            -o StrictHostKeyChecking=accept-new \
            -o HostKeyAlgorithms=+ssh-dss \
            public/public.zip \
            "${USR}@${HOST}:/${ID}/"
        shell: bash
        env:
          USR: ${{ secrets.SSH_USERNAME }}
          HOST: ${{ secrets.SSH_HOST }}
          ID: ${{ secrets.ID }}

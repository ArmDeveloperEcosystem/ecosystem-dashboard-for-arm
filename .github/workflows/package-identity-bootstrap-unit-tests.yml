name: Package Identity Bootstrap Unit Tests

on:
  pull_request:
    paths:
      - '.github/PACKAGE_IDENTITY_CATALOG.md'
      - '.github/package-identity-catalog.json'
      - '.github/workflows/package-identity-bootstrap-unit-tests.yml'
      - 'build_steps/validate_package_identity_catalog.py'
      - 'config.toml'
      - 'config.cloudfront.toml'
      - 'config/**'
      - 'content/**'
      - 'themes/**'
      - '.gitattributes'
      - '**/.gitattributes'
      - 'hugo.*'
      - '_vendor/**'
      - 'go.mod'
      - 'go.sum'
      - 'tests/test_package_identity_catalog.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-unit-tests:
    name: Run isolated bootstrap validator unit tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install checksum-pinned Hugo
        shell: bash
        env:
          HUGO_VERSION: '0.130.0'
          HUGO_ARM64_ARCHIVE_SHA256: 025785b56d6217d2528ad8782680332851acae0d78cc9f86a27f8e03ec1afa3c
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          archive="hugo_extended_${HUGO_VERSION}_linux-arm64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          install_dir="${RUNNER_TEMP}/hugo-${HUGO_VERSION}-arm64"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "$archive_path" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${archive}"
          printf '%s  %s\n' "$HUGO_ARM64_ARCHIVE_SHA256" "$archive_path" \
            | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xzf "$archive_path" -C "$install_dir" hugo
          chmod 0755 "$install_dir/hugo"
          "$install_dir/hugo" version | grep -Fq "v${HUGO_VERSION}"
          printf 'PACKAGE_CATALOG_HUGO_BINARY=%s\n' "$install_dir/hugo" \
            >> "$GITHUB_ENV"

      - name: Run catalog trust-boundary tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest -v tests.test_package_identity_catalog

name: Test gEDA on Arm64

permissions:
  contents: read

on:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-geda.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-geda.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-geda.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-geda.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-geda.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-geda.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-geda.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-geda.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-geda.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-geda.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-geda.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-geda.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-geda.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-geda.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-geda.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-geda.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-geda.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-geda.outputs.regression_next_installed_version }}
      regression_policy:
        description: Regression applicability policy classification
        value: ${{ jobs.test-geda.outputs.regression_policy }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-geda.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-geda.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-geda.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-geda.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-geda.outputs.timestamp }}

jobs:
  test-geda:
    runs-on: ubuntu-24.04-arm
    env:
      BASELINE_VERSION: "1:1.8.2-4"
      PACKAGE_SLUG: "geda"
      LANE_KIND: "manual-review"
      DOWNLOAD_URL: "https://launchpad.net/geda/+download"
      HOMEPAGE_URL: "https://launchpad.net/geda"
      OFFICIAL_DOCS: "https://launchpad.net/ubuntu/+source/geda-gaf"
      SOURCE_DESCRIPTOR_URL: "https://archive.ubuntu.com/ubuntu/pool/universe/g/geda-gaf/geda-gaf_1.8.2-4.dsc"
      SOURCE_DESCRIPTOR_SHA256: "f36575e3aedba6aec018df182a452c5f3afb49cc888ed502e3b6d0c44c6f1b41"
      LATEST_STABLE_VERSION: "1.10.2"
      GITHUB_REPO: ""
      PACKAGE_PAGE: "content/linux/opensource_packages/geda.md"
      SOURCE_GLOBS: ""
      EVIDENCE_RE: "gEDA|schematic|PCB|EDA|electronic"
      TEST5_MODE: "external"
      PYTHON_TARGETS: ""

    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'gEDA'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      regression_policy: "manual_review_archived"
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=geda" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/linux/opensource_packages/geda" >> "$GITHUB_OUTPUT"

      - name: Bootstrap baseline dependencies
        uses: ./.github/actions/apt-bootstrap
        with:
          packages: "git curl jq tar unzip file ca-certificates"
          quiet: "true"

      - name: Install baseline source or artifact
        id: install
        run: |
          set -euo pipefail
          rm -rf baseline-src baseline-external
          mkdir -p baseline-src baseline-external
          if [ -n "$GITHUB_REPO" ]; then
            RESOLVED_TAG=""
            for CANDIDATE in "$BASELINE_VERSION" "v$BASELINE_VERSION"; do
              if git ls-remote --tags --refs "https://github.com/$GITHUB_REPO.git" "refs/tags/$CANDIDATE" | grep -q .; then
                RESOLVED_TAG="$CANDIDATE"
                break
              fi
            done
            if [ -n "$RESOLVED_TAG" ]; then
              git clone --depth 1 --branch "$RESOLVED_TAG" "https://github.com/$GITHUB_REPO.git" baseline-src >/dev/null 2>&1 || true
              echo "resolved_tag=$RESOLVED_TAG" >> "$GITHUB_OUTPUT"
            else
              git clone --depth 1 "https://github.com/$GITHUB_REPO.git" baseline-src >/dev/null 2>&1 || true
              echo "resolved_tag=default_branch" >> "$GITHUB_OUTPUT"
            fi
            if [ -d baseline-src/.git ] || [ -f baseline-src/README.md ] || [ -n "$(find baseline-src -mindepth 1 -maxdepth 2 -print -quit 2>/dev/null)" ]; then
              echo "install_mode=github_source" >> "$GITHUB_OUTPUT"
              echo "install_status=success" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          descriptor=baseline-external/geda-gaf.dsc
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --proto '=https' \
            --tlsv1.2 \
            --retry 4 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 120 \
            --output "$descriptor" \
            "$SOURCE_DESCRIPTOR_URL"
          descriptor_size="$(stat -c '%s' "$descriptor")"
          if [ "$descriptor_size" -lt 512 ] || [ "$descriptor_size" -gt 16384 ]; then
            echo "Official Ubuntu source descriptor has an unexpected size." >&2
            exit 1
          fi
          printf '%s  %s\n' "$SOURCE_DESCRIPTOR_SHA256" "$descriptor" | sha256sum --check --strict --status
          grep -Fxq 'Source: geda-gaf' "$descriptor"
          grep -Fxq "Version: $BASELINE_VERSION" "$descriptor"
          grep -Eq '^Architecture: (any|all)( (any|all))*$' "$descriptor"
          grep -Fxq -- '-----BEGIN PGP SIGNED MESSAGE-----' "$descriptor"
          grep -Fxq -- '-----BEGIN PGP SIGNATURE-----' "$descriptor"
          printf 'download=%s\nhomepage=%s\ndocs=%s\nsource_descriptor=%s\n' \
            "$DOWNLOAD_URL" "$HOMEPAGE_URL" "$OFFICIAL_DOCS" \
            "$SOURCE_DESCRIPTOR_URL" > baseline-external/metadata.txt
          echo "resolved_tag=ubuntu_source_descriptor" >> "$GITHUB_OUTPUT"
          echo "install_mode=external_artifact" >> "$GITHUB_OUTPUT"
          echo "install_status=success" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Get baseline version
        id: version
        run: |
          echo "version=$BASELINE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected baseline version: $BASELINE_VERSION"

      - name: Test 1 - Baseline package evidence
        id: test1
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          MODE="${{ steps.install.outputs.install_mode || '' }}"
          if [ ! -f "$PACKAGE_PAGE" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "${{ steps.install.outputs.install_status || 'failed' }}" != "success" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$MODE" = "github_source" ]; then
            FOUND=0
            IFS='|' read -r -a PATTERNS <<< "$SOURCE_GLOBS"
            for PATTERN in "${PATTERNS[@]}"; do
              [ -z "$PATTERN" ] && continue
              if compgen -G "baseline-src/$PATTERN" > /dev/null; then
                FOUND=1
                break
              fi
            done
            if [ "$FOUND" -ne 1 ]; then
              echo "status=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          else
            if [ ! -f baseline-external/metadata.txt ] || [ ! -f baseline-external/geda-gaf.dsc ]; then
              echo "status=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi
          echo "status=passed" >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 2 - Baseline version and release alignment
        id: test2
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          MODE="${{ steps.install.outputs.install_mode || '' }}"
          if ! grep -Fq "version_number: $BASELINE_VERSION" "$PACKAGE_PAGE"; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$MODE" = "github_source" ]; then
            RESOLVED="${{ steps.install.outputs.resolved_tag || '' }}"
            if [ -z "$RESOLVED" ]; then
              echo "status=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            if [ "$RESOLVED" != "default_branch" ] && [ "$RESOLVED" != "$BASELINE_VERSION" ] && [ "$RESOLVED" != "v$BASELINE_VERSION" ]; then
              echo "status=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          else
            if [ ! -f baseline-external/metadata.txt ] || ! grep -Fq "$DOWNLOAD_URL" baseline-external/metadata.txt; then
              echo "status=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi
          echo "status=passed" >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 3 - Package-specific source or docs evidence
        id: test3
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          MODE="${{ steps.install.outputs.install_mode || '' }}"
          if [ "$MODE" = "github_source" ]; then
            if ! grep -R -I -Eiq "$EVIDENCE_RE" baseline-src 2>/dev/null; then
              echo "status=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            DOC_FOUND=0
            for PATTERN in README* docs examples; do
              if compgen -G "baseline-src/$PATTERN" > /dev/null; then
                DOC_FOUND=1
                break
              fi
            done
            if [ "$DOC_FOUND" -ne 1 ]; then
              echo "status=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          else
            if ! grep -Eiq "$EVIDENCE_RE" "$PACKAGE_PAGE"; then
              echo "status=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            if ! grep -Fq "$HOMEPAGE_URL" baseline-external/metadata.txt; then
              echo "status=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            if ! grep -Fxq 'Source: geda-gaf' baseline-external/geda-gaf.dsc || \
               ! grep -Eq '^Architecture: (any|all)( (any|all))*$' baseline-external/geda-gaf.dsc; then
              echo "status=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi
          echo "status=passed" >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 4 - Arm64 support gate
        id: test4
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          if [ "$(uname -m)" != "aarch64" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if ! grep -q '^works_on_arm: true' "$PACKAGE_PAGE"; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "status=passed" >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 5 - Bounded package-specific smoke
        id: test5
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          START_TIME=$(date +%s)
          fail_test5() {
            local exit_code="${1:-$?}"
            trap - ERR
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "note=The bounded gEDA package-specific validation failed before completion." >> "$GITHUB_OUTPUT"
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$exit_code"
          }
          trap fail_test5 ERR
          if ! apt-cache policy geda >/tmp/geda-policy.log 2>/tmp/geda-policy.err; then
            cat /tmp/geda-policy.err >&2
            fail_test5 1
          fi
          if grep -Eiq 'Candidate: [^(]' /tmp/geda-policy.log; then
            sudo apt-get update
            sudo apt-get install -y geda
            if command -v gschem >/dev/null 2>&1 && gschem --version >/tmp/geda-version.log 2>&1; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
              echo "note=Installed gEDA from the Ubuntu package manager and executed gschem --version on Arm64." >> "$GITHUB_OUTPUT"
            else
              cat /tmp/geda-version.log || true
              echo "status=failed" >> "$GITHUB_OUTPUT"
              echo "note=gEDA package installed but gschem --version did not execute." >> "$GITHUB_OUTPUT"
              exit 1
            fi
          else
            cat /tmp/geda-policy.log || true
            descriptor=baseline-external/geda-gaf.dsc
            printf '%s  %s\n' "$SOURCE_DESCRIPTOR_SHA256" "$descriptor" | sha256sum --check --strict --status
            grep -Fxq -- '-----BEGIN PGP SIGNED MESSAGE-----' "$descriptor"
            grep -Fxq 'Source: geda-gaf' "$descriptor"
            grep -Fxq "Version: $BASELINE_VERSION" "$descriptor"
            grep -Eq '^Architecture: (any|all)( (any|all))*$' "$descriptor"
            grep -Eq '^Binary: .*geda-gschem' "$descriptor"
            grep -A3 '^Checksums-Sha256:' "$descriptor" | \
              grep -Eq '^[[:space:]]+[0-9a-f]{64} [1-9][0-9]* geda-gaf_1\.8\.2\.orig\.tar\.gz$'
            echo "status=passed" >> "$GITHUB_OUTPUT"
            echo "note=gEDA is not available from the ubuntu-24.04-arm package repositories, so this archived/manual-review lane validates the pinned clear-signed Ubuntu source descriptor structure for 1:1.8.2-4 without claiming a live runtime install or cryptographic signer verification." >> "$GITHUB_OUTPUT"
          fi
          trap - ERR
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Test 6 - Regression Validation
        id: test6
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          CURRENT="${{ steps.version.outputs.version || env.BASELINE_VERSION }}"
          echo "current_version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest_version=$LATEST_STABLE_VERSION" >> "$GITHUB_OUTPUT"
          echo "next_installed_version=n/a" >> "$GITHUB_OUTPUT"
          echo "decision=runtime_validation_not_automated" >> "$GITHUB_OUTPUT"
          echo "regression_result=Upstream gEDA $LATEST_STABLE_VERSION requires manual or specialized runtime validation" >> "$GITHUB_OUTPUT"
          echo "comparison=Tests 1-5 validate archived project metadata and pinned Ubuntu distro-source evidence for the historical Arm64 baseline. Upstream publishes stable gEDA $LATEST_STABLE_VERSION, but ubuntu-24.04-arm does not provide the geda binary package, so the workflow explicitly defers candidate runtime validation and makes no live runtime claim." >> "$GITHUB_OUTPUT"
          echo "status=skipped" >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Calculate test summary
        id: summary
        if: always()
        run: |
          set -euo pipefail
          T1="${{ steps.test1.outputs.status || '' }}"
          T2="${{ steps.test2.outputs.status || '' }}"
          T3="${{ steps.test3.outputs.status || '' }}"
          T4="${{ steps.test4.outputs.status || '' }}"
          T5="${{ steps.test5.outputs.status || '' }}"
          T6="${{ steps.test6.outputs.status || '' }}"
          O1="${{ steps.test1.outcome }}"
          O2="${{ steps.test2.outcome }}"
          O3="${{ steps.test3.outcome }}"
          O4="${{ steps.test4.outcome }}"
          O5="${{ steps.test5.outcome }}"
          O6="${{ steps.test6.outcome }}"
          D1="${{ steps.test1.outputs.duration || '0' }}"
          D2="${{ steps.test2.outputs.duration || '0' }}"
          D3="${{ steps.test3.outputs.duration || '0' }}"
          D4="${{ steps.test4.outputs.duration || '0' }}"
          D5="${{ steps.test5.outputs.duration || '0' }}"
          D6="${{ steps.test6.outputs.duration || '0' }}"
          PASSED=0
          FAILED=0
          SKIPPED=0
          CORE_FAILED=0
          record_core() {
            local status="$1"
            local outcome="$2"
            if [ "$status" = "passed" ] && [ "$outcome" = "success" ]; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
              CORE_FAILED=$((CORE_FAILED + 1))
            fi
          }
          record_core "$T1" "$O1"
          record_core "$T2" "$O2"
          record_core "$T3" "$O3"
          record_core "$T4" "$O4"
          record_core "$T5" "$O5"
          if [ "$T6" = "passed" ] && [ "$O6" = "success" ]; then
            PASSED=$((PASSED + 1))
          elif [ "$T6" = "skipped" ] && [ "$O6" = "success" ]; then
            SKIPPED=$((SKIPPED + 1))
          else
            FAILED=$((FAILED + 1))
          fi
          DURATION=$((D1 + D2 + D3 + D4 + D5 + D6))
          if [ "$CORE_FAILED" -eq 0 ] && [ "$FAILED" -eq 0 ]; then
            OVERALL_STATUS="success"
            BADGE_STATUS="passing"
          else
            OVERALL_STATUS="failure"
            BADGE_STATUS="failing"
          fi
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"
          echo "core_failed=$CORE_FAILED" >> "$GITHUB_OUTPUT"
          echo "overall_status=$OVERALL_STATUS" >> "$GITHUB_OUTPUT"
          echo "badge_status=$BADGE_STATUS" >> "$GITHUB_OUTPUT"

# Diagnostic branch only. Never merge this replacement batch file.
# No batch registration, result collection, artifact publication or deployment.
name: SONiC component and KVM basic smoke diagnostic
run-name: Free Arm smoke - SONiC component and KVM build ABI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-native-diagnostic
  cancel-in-progress: false

jobs:
  provenance:
    if: github.ref == 'refs/heads/diagnostic/sdk-native-september10'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind exact diagnostic sources
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(uname -m)" = aarch64
          printf 'diagnostic_sha=%s\nrun_id=%s\nrun_attempt=%s\n' "$EXPECTED_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          sha256sum .github/workflows/test-{sonic,kvm}.yml

  sonic:
    needs: provenance
    uses: ./.github/workflows/test-sonic.yml
  kvm:
    needs: provenance
    uses: ./.github/workflows/test-kvm.yml

  inspect-outputs:
    if: always() && github.ref == 'refs/heads/diagnostic/sdk-native-september10'
    needs: [sonic, kvm]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Verify outcome accounting without declaring failed packages green
        env:
          OBSERVED: ${{ toJSON(needs) }}
        run: |
          python3 -I - <<'PY'
          import json
          import os
          observed = json.loads(os.environ['OBSERVED'])
          print(json.dumps(observed, indent=2, sort_keys=True))
          expected = {'sonic': 'sonic', 'kvm': 'kvm'}
          assert set(observed) == set(expected)
          for name, slug in expected.items():
              job = observed[name]
              outputs = job['outputs']
              assert outputs['package_slug'] == slug
              assert outputs['contract_version'] == '2.0'
              assert outputs['run_id'] == os.environ['GITHUB_RUN_ID']
              assert outputs['run_attempt'] == os.environ['GITHUB_RUN_ATTEMPT']
              assert outputs['duration_seconds'].isdecimal()
              count_keys = ('tests_passed', 'tests_failed', 'tests_skipped', 'core_failed')
              assert all(outputs[key].isdecimal() for key in count_keys)
              passed, failed, skipped, core_failed = [int(outputs[key]) for key in count_keys]
              assert passed + failed + skipped == 6
              assert 0 <= core_failed <= failed
              if job['result'] == 'success':
                  assert outputs['run_status'] == 'success'
                  assert outputs['badge_status'] == 'passing'
                  assert failed == core_failed == 0
                  assert outputs['package_version'] not in ('', 'unknown', 'not_installed')
                  if slug == 'kvm':
                      assert (passed, failed, skipped) == (5, 0, 1)
                      assert outputs['package_version'].startswith('build-abi@')
                      assert 'VM execution not tested' in outputs['package_name']
                      assert 'VM execution are not tested' in outputs['regression_comparison']
                      assert outputs['regression_status'] == 'skipped'
                      assert outputs['regression_decision'] == 'not_applicable_package_manager'
                  else:
                      assert (passed, failed, skipped) == (6, 0, 0)
                      assert outputs['regression_status'] == 'passed'
              else:
                  assert job['result'] == 'failure', (name, job['result'])
                  assert outputs['run_status'] == 'failure'
                  assert outputs['badge_status'] == 'failing'
                  assert failed > 0
                  if core_failed:
                      assert outputs['regression_status'] == 'skipped'
                      assert outputs['regression_decision'] in ('baseline_failed', 'baseline_install_failed')
              print(f'{slug}: actual workflow conclusion={job["result"]}, counts={passed}/{failed}/{skipped}')
          assert all(job['result'] == 'success' for job in observed.values()), 'A scoped smoke workflow failed'
          print('Scoped smoke workflows passed. KVM VM execution is not tested; no batch or publication certification.')
          PY

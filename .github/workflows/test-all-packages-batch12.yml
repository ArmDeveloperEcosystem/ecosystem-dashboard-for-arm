# Diagnostic branch only. Do not merge this replacement batch file.
# No batch registration, result collection, artifact publication or deployment.
name: Freedesktop SDK Native Diagnostic
run-name: SDK native diagnostic (not batch certification)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-native-diagnostic
  cancel-in-progress: false

jobs:
  sdk-diagnostic:
    if: github.ref == 'refs/heads/diagnostic/sdk-native-september10'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Bind diagnostic provenance
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'diagnostic_sha=%s\nrun_id=%s\nrun_attempt=%s\n' "$EXPECTED_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          uname -a
          test "$(uname -m)" = aarch64
          sha256sum .github/scripts/sdk-native-diagnostic.sh .github/scripts/sdk-native-smoke.c
          df -h "$RUNNER_TEMP"

      - name: Install runner-side Flatpak tooling
        run: bash .github/actions/apt-bootstrap/bootstrap.sh --packages "flatpak bubblewrap dbus-x11 file"

      - name: Compile and run with the actual SDK
        run: dbus-run-session -- bash .github/scripts/sdk-native-diagnostic.sh

      - name: Remove diagnostic-owned temporary storage
        if: always()
        run: |
          set -euo pipefail
          scope="$RUNNER_TEMP/sdk-native-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [ -d "$scope" ]; then
            test ! -L "$scope"
            chmod -R u+w -- "$scope"
            rm -rf -- "$scope"
          fi

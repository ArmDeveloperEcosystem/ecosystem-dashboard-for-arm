name: Test All Packages (Batch 12) on Arm64
run-name: Arm64 Batch 12 [${{ inputs.orchestration_id || format('manual-{0}-{1}', github.run_id, github.run_attempt) }}] [nonce:${{ inputs.dispatch_nonce || 'manual-only' }}] [prefetch:${{ (inputs.prefetch_run_id == '' && inputs.prefetch_artifact_name == '') && 'none' || 'present' }}]

on:
  workflow_dispatch:
    inputs:
      orchestration_id:
        description: Exact orchestrator identity; blank uses a safe manual fallback
        required: false
        default: ""
        type: string
      dispatch_nonce:
        description: Secret exact-dispatch nonce; blank is manual-only and not publishable
        required: false
        default: ""
        type: string
      expected_sha:
        description: Exact commit expected by the orchestrator
        required: false
        default: ""
        type: string
      expected_branch:
        description: Exact branch expected by the orchestrator
        required: false
        default: ""
        type: string
      prefetch_run_id:
        description: Orchestrator prefetch run id
        required: false
        default: ""
        type: string
      prefetch_artifact_name:
        description: Orchestrator prefetch artifact name
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      orchestration_id:
        required: true
        type: string
      dispatch_nonce:
        required: true
        type: string
      expected_sha:
        required: true
        type: string
      expected_branch:
        required: true
        type: string
      prefetch_run_id:
        required: false
        type: string
        default: ""
      prefetch_artifact_name:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:

  test-dav1d:
    uses: ./.github/workflows/test-dav1d.yml

  test-nacos:
    uses: ./.github/workflows/test-nacos.yml

  test-qperf:
    uses: ./.github/workflows/test-qperf.yml

  test-gdb:
    uses: ./.github/workflows/test-gdb.yml

  test-seastar:
    uses: ./.github/workflows/test-seastar.yml

  test-xen_ci:
    uses: ./.github/workflows/test-xen_ci.yml

  test-kobert:
    uses: ./.github/workflows/test-kobert.yml

  test-presto:
    uses: ./.github/workflows/test-presto.yml

  test-caddy:
    uses: ./.github/workflows/test-caddy.yml

  test-lzo:
    uses: ./.github/workflows/test-LZO.yml

  test-crossplane:
    uses: ./.github/workflows/test-crossplane.yml

  test-tikv:
    uses: ./.github/workflows/test-tikv.yml

  test-nomad-open-source:
    uses: ./.github/workflows/test-nomad-open-source.yml

  test-freedesktop-sdk:
    uses: ./.github/workflows/test-freedesktop-sdk.yml

  test-kyuubi:
    uses: ./.github/workflows/test-kyuubi.yml

  test-hmmer:
    uses: ./.github/workflows/test-HMMER.yml

  test-trf:
    uses: ./.github/workflows/test-trf.yml

  test-grpc-java:
    uses: ./.github/workflows/test-gRPC-java.yml

  test-rocketmq:
    uses: ./.github/workflows/test-rocketmq.yml

  test-hadoop:
    uses: ./.github/workflows/test-hadoop.yml
    with:
      prefetch_run_id: ${{ inputs.prefetch_run_id || '' }}
      prefetch_artifact_name: ${{ inputs.prefetch_artifact_name || '' }}

  test-cubefs:
    uses: ./.github/workflows/test-cubefs.yml

  test-vscode:
    uses: ./.github/workflows/test-vscode.yml

  test-enca:
    uses: ./.github/workflows/test-enca.yml

  test-devtron:
    uses: ./.github/workflows/test-devtron.yml

  test-helm:
    uses: ./.github/workflows/test-helm.yml

  test-flex:
    uses: ./.github/workflows/test-flex.yml

  test-py3c:
    uses: ./.github/workflows/test-py3c.yml

  test-vitess:
    uses: ./.github/workflows/test-vitess.yml

  test-openj9:
    uses: ./.github/workflows/test-openj9.yml

  test-mongoose:
    uses: ./.github/workflows/test-mongoose.yml

  test-conda:
    uses: ./.github/workflows/test-conda.yml

  test-hue:
    uses: ./.github/workflows/test-hue.yml

  test-cloudevents-go:
    uses: ./.github/workflows/test-cloudevents-go.yml

  test-openmetrics:
    uses: ./.github/workflows/test-openmetrics.yml

  test-7-zip:
    uses: ./.github/workflows/test-7-zip.yml

  test-spring-cloud-function:
    uses: ./.github/workflows/test-spring-cloud-function.yml

  test-dolphinscheduler:
    uses: ./.github/workflows/test-dolphinscheduler.yml
    with:
      prefetch_run_id: ${{ inputs.prefetch_run_id || '' }}
      prefetch_artifact_name: ${{ inputs.prefetch_artifact_name || '' }}

  test-benchmark:
    uses: ./.github/workflows/test-benchmark.yml

  test-spring_boot:
    uses: ./.github/workflows/test-spring_boot.yml

  test-k3os:
    uses: ./.github/workflows/test-k3os.yml

  test-valgrind:
    uses: ./.github/workflows/test-valgrind.yml

  test-lua:
    uses: ./.github/workflows/test-lua.yml

  test-elemental-operator:
    uses: ./.github/workflows/test-elemental-operator.yml

  test-juju:
    uses: ./.github/workflows/test-juju.yml

  test-bcache:
    uses: ./.github/workflows/test-bcache.yml

  summary:
    permissions:
      actions: read
      contents: read
    needs:
      [
        test-dav1d,
        test-nacos,
        test-qperf,
        test-gdb,
        test-seastar,
        test-xen_ci,
        test-kobert,
        test-presto,
        test-caddy,
        test-lzo,
        test-crossplane,
        test-tikv,
        test-nomad-open-source,
        test-freedesktop-sdk,
        test-kyuubi,
        test-hmmer,
        test-trf,
        test-grpc-java,
        test-rocketmq,
        test-hadoop,
        test-cubefs,
        test-vscode,
        test-enca,
        test-devtron,
        test-helm,
        test-flex,
        test-py3c,
        test-vitess,
        test-openj9,
        test-mongoose,
        test-conda,
        test-hue,
        test-cloudevents-go,
        test-openmetrics,
        test-7-zip,
        test-spring-cloud-function,
        test-dolphinscheduler,
        test-benchmark,
        test-spring_boot,
        test-k3os,
        test-valgrind,
        test-lua,
        test-elemental-operator,
        test-juju,
        test-bcache
      ]
    runs-on: ubuntu-24.04-arm
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect batch results
        id: collect
        uses: ./.github/actions/collect-batch-results
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        with:
          batch_number: "12"
          batch_title: "Batch 12"

      - name: Attest complete batch results
        id: attest
        if: steps.collect.outcome == 'success'
        env:
          ARTIFACT_NAME: batch12-test-results
          BATCH_NUMBER: "12"
          COLLECTOR_JSON_COUNT: ${{ steps.collect.outputs.json_count }}
          CURRENT_BRANCH: ${{ github.ref_name }}
          DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
          EXPECTED_BRANCH: ${{ inputs.expected_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          NEEDS_JSON: ${{ toJson(needs) }}
          ORCHESTRATION_ID: ${{ inputs.orchestration_id }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/batch_artifact_attestation.py create \
            --results-root test-results \
            --workflow-file ".github/workflows/test-all-packages-batch12.yml" \
            --batch "$BATCH_NUMBER" \
            --repository "$REPOSITORY" \
            --expected-branch "$EXPECTED_BRANCH" \
            --current-branch "$CURRENT_BRANCH" \
            --expected-sha "$EXPECTED_SHA" \
            --workflow-sha "$WORKFLOW_SHA" \
            --orchestration-id "$ORCHESTRATION_ID" \
            --dispatch-nonce "$DISPATCH_NONCE" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --artifact-name "$ARTIFACT_NAME" \
            --collector-json-count "$COLLECTOR_JSON_COUNT" \
            --needs-environment-variable NEEDS_JSON

      - name: Upload batch test results
        if: steps.collect.outcome == 'success' && steps.attest.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: batch12-test-results
          path: test-results
          retention-days: 90

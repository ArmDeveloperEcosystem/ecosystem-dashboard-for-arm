name: Test Vue on Arm64

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-vue.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-vue.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-vue.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-vue.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-vue.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-vue.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-vue.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-vue.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-vue.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-vue.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-vue.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-vue.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-vue.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-vue.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-vue.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-vue.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-vue.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-vue.outputs.regression_next_installed_version }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-vue.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-vue.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-vue.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-vue.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-vue.outputs.timestamp }}
jobs:
  test-vue:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'Vue'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # original: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=vue" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/linux/opensource_packages/vue" >> "$GITHUB_OUTPUT"
      - name: Install Vue framework using npm
        id: install
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local RC="$1"
            trap - EXIT
            if [ "$RC" -eq 0 ]; then
              echo "install_status=success" >> "$GITHUB_OUTPUT"
            else
              echo "install_status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap 'finish "$?"' EXIT
          timeout --kill-after=10s 300s bash .github/actions/apt-bootstrap/bootstrap.sh --packages "nodejs npm"
          VUE_DIR=$(mktemp -d "$RUNNER_TEMP/vue-runtime.XXXXXX")
          timeout --kill-after=10s 300s npm install --prefix "$VUE_DIR" --registry=https://registry.npmjs.org --ignore-scripts --no-audit --no-fund --fetch-retries=2 --fetch-timeout=30000 vue
          echo "VUE_DIR=$VUE_DIR" >> "$GITHUB_ENV"
          finish 0

      - name: Get installed Vue framework version
        id: version
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local RC="$1"
            trap - EXIT
            if [ "$RC" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap 'finish "$?"' EXIT
          [ "${{ steps.install.outputs.install_status }}" = success ]
          unset NODE_OPTIONS NODE_PATH
          cd "$VUE_DIR"
          VERSION=$(timeout --kill-after=5s 30s node --no-global-search-paths - <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const pkg = require('./node_modules/vue/package.json');
          const vue = require('./node_modules/vue');
          assert.equal(pkg.name, 'vue');
          assert.match(pkg.version, /^3\.[0-9]+\.[0-9]+$/);
          assert.equal(vue.version, pkg.version);
          assert.equal(fs.realpathSync(require.resolve('./node_modules/vue')),
            fs.realpathSync(path.join(process.cwd(), 'node_modules/vue', pkg.main)));
          const renderer = require('./node_modules/@vue/server-renderer/package.json');
          assert.equal(renderer.name, '@vue/server-renderer');
          assert.equal(renderer.version, pkg.version);
          if ('EXPECTED_VERSION' in process.env) assert.equal(pkg.version, process.env.EXPECTED_VERSION);
          console.log(pkg.version);
          JS
          )
          [[ "$VERSION" =~ ^3\.[0-9]+\.[0-9]+$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          finish 0

      - name: Test 1 - Load Vue runtime APIs
        id: test1
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local RC="$1"
            trap - EXIT
            if [ "$RC" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap 'finish "$?"' EXIT
          [ "${{ steps.install.outputs.install_status }}" = success ]
          [ "${{ steps.version.outputs.status }}" = passed ]
          unset NODE_OPTIONS NODE_PATH
          cd "$VUE_DIR"
          timeout --kill-after=5s 30s node --no-global-search-paths - <<'JS'
          const assert = require('node:assert/strict');
          const vue = require('./node_modules/vue');
          for (const name of ['reactive', 'computed', 'watch', 'createSSRApp', 'h']) {
            assert.equal(typeof vue[name], 'function', name);
          }
          assert.equal(typeof require('./node_modules/@vue/server-renderer').renderToString, 'function');
          console.log('Vue runtime and SSR APIs loaded');
          JS
          finish 0

      - name: Test 2 - Verify Vue package identity and baseline
        id: test2
        if: always()
        continue-on-error: true
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local RC="$1"
            trap - EXIT
            if [ "$RC" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap 'finish "$?"' EXIT
          [ "${{ steps.install.outputs.install_status }}" = success ]
          [ "${{ steps.version.outputs.status }}" = passed ]
          unset NODE_OPTIONS NODE_PATH
          cd "$VUE_DIR"
          VERSION=$(timeout --kill-after=5s 30s node --no-global-search-paths - <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const pkg = require('./node_modules/vue/package.json');
          const vue = require('./node_modules/vue');
          assert.equal(pkg.name, 'vue');
          assert.match(pkg.version, /^3\.[0-9]+\.[0-9]+$/);
          assert.equal(vue.version, pkg.version);
          assert.equal(fs.realpathSync(require.resolve('./node_modules/vue')),
            fs.realpathSync(path.join(process.cwd(), 'node_modules/vue', pkg.main)));
          const renderer = require('./node_modules/@vue/server-renderer/package.json');
          assert.equal(renderer.name, '@vue/server-renderer');
          assert.equal(renderer.version, pkg.version);
          if ('EXPECTED_VERSION' in process.env) assert.equal(pkg.version, process.env.EXPECTED_VERSION);
          console.log(pkg.version);
          JS
          )
          [[ "$VERSION" =~ ^3\.[0-9]+\.[0-9]+$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "installed_version=$VERSION" >> "$GITHUB_OUTPUT"
          finish 0

      - name: Test 3 - Verify reactive state and computed updates
        id: test3
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local RC="$1"
            trap - EXIT
            if [ "$RC" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap 'finish "$?"' EXIT
          [ "${{ steps.install.outputs.install_status }}" = success ]
          [ "${{ steps.version.outputs.status }}" = passed ]
          unset NODE_OPTIONS NODE_PATH
          cd "$VUE_DIR"
          timeout --kill-after=5s 30s node --no-global-search-paths - <<'JS'
          const assert = require('node:assert/strict');
          const { reactive, isReactive, computed, watch } = require('./node_modules/vue');
          const state = reactive({ count: 2 });
          assert.equal(isReactive(state), true);
          const doubled = computed(() => state.count * 2);
          assert.equal(doubled.value, 4);
          const changes = [];
          const stop = watch(() => state.count, (value, old) => changes.push([old, value]), { flush: 'sync' });
          state.count = 5;
          assert.equal(doubled.value, 10);
          assert.deepEqual(changes, [[2, 5]]);
          stop();
          state.count = 7;
          assert.equal(doubled.value, 14);
          assert.deepEqual(changes, [[2, 5]]);
          console.log('Vue reactive updates, computed invalidation and watcher disposal passed');
          JS
          finish 0

      - name: Test 4 - Verify native Arm64 Node runtime
        id: test4
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local RC="$1"
            trap - EXIT
            if [ "$RC" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap 'finish "$?"' EXIT
          [ "${{ steps.install.outputs.install_status }}" = success ]
          [ "${{ steps.version.outputs.status }}" = passed ]
          [ "$(uname -m)" = aarch64 ]
          unset NODE_OPTIONS NODE_PATH
          timeout --kill-after=5s 30s node --no-global-search-paths - <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          assert.equal(process.platform, 'linux');
          assert.equal(process.arch, 'arm64');
          const elf = fs.readFileSync(process.execPath).subarray(0, 20);
          assert.equal(elf.subarray(0, 6).toString('hex'), '7f454c460201');
          assert.equal(elf.readUInt16LE(18), 183);
          console.log('Native Linux Arm64 Node ELF verified');
          JS
          finish 0

      - name: Test 5 - Render Vue components with updated state
        id: test5
        if: always()
        continue-on-error: true
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local RC="$1"
            trap - EXIT
            if [ "$RC" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$RC"
          }
          trap 'finish "$?"' EXIT
          [ "${{ steps.install.outputs.install_status }}" = success ]
          [ "${{ steps.version.outputs.status }}" = passed ]
          unset NODE_OPTIONS NODE_PATH
          cd "$VUE_DIR"
          timeout --kill-after=5s 30s node --no-global-search-paths - <<'JS'
          const assert = require('node:assert/strict');
          const { version, createSSRApp, h, reactive, computed } = require('./node_modules/vue');
          const { renderToString } = require('./node_modules/@vue/server-renderer');
          assert.equal(version, process.env.EXPECTED_VERSION);
          const state = reactive({ count: 2, label: '<Arm & Vue>' });
          const doubled = computed(() => state.count * 2);
          const Child = { props: ['label', 'value'], setup: props => () => h('p', props.label + ': ' + props.value) };
          const render = () => renderToString(createSSRApp({
            setup: () => () => h('section', { id: 'smoke' }, [
              h(Child, { label: state.label, value: doubled.value })
            ])
          }));
          (async () => {
            const before = await render();
            assert.equal(before, '<section id="smoke"><p>&lt;Arm &amp; Vue&gt;: 4</p></section>');
            state.count = 5;
            const after = await render();
            assert.equal(after, '<section id="smoke"><p>&lt;Arm &amp; Vue&gt;: 10</p></section>');
            assert.notEqual(before, after);
            console.log(before);
            console.log(after);
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS
          finish 0

      - name: Regression applicability - package manager installed
        id: test6
        if: always()
        env:
          CURRENT: ${{ steps.version.outputs.version || 'unknown' }}
        run: |
          set -euo pipefail
          echo "current_version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest_version=not_applicable" >> "$GITHUB_OUTPUT"
          echo "next_installed_version=not_applicable" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.install.outputs.install_status }}" != success ]; then
            echo "decision=baseline_install_failed" >> "$GITHUB_OUTPUT"
            echo "regression_result=Regression skipped: the Vue npm installation failed." >> "$GITHUB_OUTPUT"
            echo "comparison=No valid installed baseline is available for comparison." >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.test1.outcome }}" = success ] && [ "${{ steps.test1.outputs.status }}" = passed ] && \
               [ "${{ steps.test2.outcome }}" = success ] && [ "${{ steps.test2.outputs.status }}" = passed ] && \
               [ "${{ steps.test3.outcome }}" = success ] && [ "${{ steps.test3.outputs.status }}" = passed ] && \
               [ "${{ steps.test4.outcome }}" = success ] && [ "${{ steps.test4.outputs.status }}" = passed ] && \
               [ "${{ steps.test5.outcome }}" = success ] && [ "${{ steps.test5.outputs.status }}" = passed ]; then
            echo "decision=not_applicable_package_manager" >> "$GITHUB_OUTPUT"
            echo "regression_result=Regression validation not applicable: Vue is installed using npm in Tests 1-5" >> "$GITHUB_OUTPUT"
            echo "comparison=The baseline uses the npm package manager; no next-version artifact was installed or compared." >> "$GITHUB_OUTPUT"
          else
            echo "decision=baseline_failed" >> "$GITHUB_OUTPUT"
            echo "regression_result=Regression skipped: Vue baseline validation failed." >> "$GITHUB_OUTPUT"
            echo "comparison=All five core checks must pass before a baseline can be compared." >> "$GITHUB_OUTPUT"
          fi
          echo "status=skipped" >> "$GITHUB_OUTPUT"
          echo "duration=0" >> "$GITHUB_OUTPUT"

      - name: Calculate test summary
        if: always()
        id: summary
        run: |
          set -euo pipefail
          PASSED=0
          FAILED=0
          SKIPPED=0
          TOTAL_DURATION=0

          if [ "${{ steps.test1.outcome }}" = "success" ] && [ "${{ steps.test1.outputs.status }}" = "passed" ]; then
            PASSED=$((PASSED + 1))
          else
            FAILED=$((FAILED + 1))
          fi
          TOTAL_DURATION=$((TOTAL_DURATION + ${{ steps.test1.outputs.duration || 0 }}))

          if [ "${{ steps.test2.outcome }}" = "success" ] && [ "${{ steps.test2.outputs.status }}" = "passed" ]; then
            PASSED=$((PASSED + 1))
          else
            FAILED=$((FAILED + 1))
          fi
          TOTAL_DURATION=$((TOTAL_DURATION + ${{ steps.test2.outputs.duration || 0 }}))

          if [ "${{ steps.test3.outcome }}" = "success" ] && [ "${{ steps.test3.outputs.status }}" = "passed" ]; then
            PASSED=$((PASSED + 1))
          else
            FAILED=$((FAILED + 1))
          fi
          TOTAL_DURATION=$((TOTAL_DURATION + ${{ steps.test3.outputs.duration || 0 }}))

          if [ "${{ steps.test4.outcome }}" = "success" ] && [ "${{ steps.test4.outputs.status }}" = "passed" ]; then
            PASSED=$((PASSED + 1))
          else
            FAILED=$((FAILED + 1))
          fi
          TOTAL_DURATION=$((TOTAL_DURATION + ${{ steps.test4.outputs.duration || 0 }}))

          if [ "${{ steps.test5.outcome }}" = "success" ] && [ "${{ steps.test5.outputs.status }}" = "passed" ]; then
            PASSED=$((PASSED + 1))
          else
            FAILED=$((FAILED + 1))
          fi
          TOTAL_DURATION=$((TOTAL_DURATION + ${{ steps.test5.outputs.duration || 0 }}))

          CORE_FAILED=$FAILED
          if [ "${{ steps.test6.outcome }}" = "success" ] && \
             [ "${{ steps.test6.outputs.status }}" = "skipped" ] && \
             { { [ "$CORE_FAILED" -eq 0 ] && [ "${{ steps.test6.outputs.decision }}" = "not_applicable_package_manager" ]; } || \
               { [ "$CORE_FAILED" -gt 0 ] && { [ "${{ steps.test6.outputs.decision }}" = "baseline_failed" ] || \
                                             [ "${{ steps.test6.outputs.decision }}" = "baseline_install_failed" ]; }; }; }; then
            SKIPPED=$((SKIPPED + 1))
          else
            FAILED=$((FAILED + 1))
          fi
          TOTAL_DURATION=$((TOTAL_DURATION + ${{ steps.test6.outputs.duration || 0 }}))

          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "core_failed=$CORE_FAILED" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
          echo "duration=$TOTAL_DURATION" >> "$GITHUB_OUTPUT"
          if [ "$FAILED" -eq 0 ]; then
            echo "overall_status=success" >> "$GITHUB_OUTPUT"
            echo "badge_status=passing" >> "$GITHUB_OUTPUT"
          else
            echo "overall_status=failure" >> "$GITHUB_OUTPUT"
            echo "badge_status=failing" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Create test summary
        if: always()
        run: |
          {
            echo "## Vue Test Results"
            echo "- **Framework Version:** ${{ steps.version.outputs.version || 'unknown' }}"
            echo "- **Scope:** Bounded Node runtime and SSR smoke; browser mounting, hydration and the upstream suite are not tested."
            echo "- **Status:** ${{ steps.summary.outputs.overall_status || 'failure' }}"
            echo "- **Tests Passed:** ${{ steps.summary.outputs.passed || 0 }}"
            echo "- **Tests Failed:** ${{ steps.summary.outputs.failed || 0 }}"
            echo "- **Tests Skipped:** ${{ steps.summary.outputs.skipped || 0 }}"
            echo "- **Duration:** ${{ steps.summary.outputs.duration || 0 }}s"
            echo "1. Runtime APIs: ${{ steps.test1.outputs.status || 'failed' }}"
            echo "2. Package identity and baseline: ${{ steps.test2.outputs.status || 'failed' }}"
            echo "3. Reactivity and computed state: ${{ steps.test3.outputs.status || 'failed' }}"
            echo "4. Native Arm64 Node: ${{ steps.test4.outputs.status || 'failed' }}"
            echo "5. Component SSR and escaped output: ${{ steps.test5.outputs.status || 'failed' }}"
            echo "6. Package-manager regression applicability: ${{ steps.test6.outputs.status || 'failed' }}"
          } >> "$GITHUB_STEP_SUMMARY"

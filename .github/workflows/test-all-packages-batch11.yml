name: Test All Packages (Batch 11) on Arm64
run-name: Arm64 Batch 11 [${{ inputs.orchestration_id || format('manual-{0}-{1}', github.run_id, github.run_attempt) }}] [nonce:${{ inputs.dispatch_nonce || 'manual-only' }}]

on:
  workflow_dispatch:
    inputs:
      orchestration_id:
        description: Exact orchestrator identity; blank uses a safe manual fallback
        required: false
        default: ""
        type: string
      dispatch_nonce:
        description: Secret exact-dispatch nonce; blank is manual-only and not publishable
        required: false
        default: ""
        type: string
      expected_sha:
        description: Exact commit expected by the orchestrator
        required: false
        default: ""
        type: string
      expected_branch:
        description: Exact branch expected by the orchestrator
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      orchestration_id:
        required: true
        type: string
      dispatch_nonce:
        required: true
        type: string
      expected_sha:
        required: true
        type: string
      expected_branch:
        required: true
        type: string

permissions:
  contents: read

jobs:

  test-sentry-javascript:
    uses: ./.github/workflows/test-sentry-javascript.yml

  test-popins2:
    uses: ./.github/workflows/test-popins2.yml

  test-heartbeat:
    uses: ./.github/workflows/test-heartbeat.yml

  test-snappy:
    uses: ./.github/workflows/test-snappy.yml

  test-sonarqube:
    uses: ./.github/workflows/test-sonarqube.yml

  test-oceanbase:
    uses: ./.github/workflows/test-oceanbase.yml

  test-julia:
    uses: ./.github/workflows/test-julia.yml

  test-epdb:
    uses: ./.github/workflows/test-epdb.yml

  test-llvm:
    uses: ./.github/workflows/test-llvm.yml

  test-luajit:
    uses: ./.github/workflows/test-luajit.yml

  test-junit5:
    uses: ./.github/workflows/test-Junit5.yml

  test-vectorscan:
    uses: ./.github/workflows/test-vectorscan.yml

  test-nwchem:
    uses: ./.github/workflows/test-nwchem.yml

  test-tengine:
    uses: ./.github/workflows/test-tengine.yml

  test-freeglut:
    uses: ./.github/workflows/test-freeglut.yml

  test-libpcap:
    uses: ./.github/workflows/test-libpcap.yml

  test-featuretools:
    uses: ./.github/workflows/test-featuretools.yml

  test-emqtt:
    uses: ./.github/workflows/test-emqtt.yml

  test-openfalcon:
    uses: ./.github/workflows/test-openfalcon.yml

  test-containerd:
    uses: ./.github/workflows/test-containerd.yml

  test-rocky_linux:
    uses: ./.github/workflows/test-rocky_linux.yml

  test-llvm_flang:
    uses: ./.github/workflows/test-llvm_flang.yml

  test-ocaml:
    uses: ./.github/workflows/test-ocaml.yml

  test-drupal:
    uses: ./.github/workflows/test-drupal.yml

  test-mariadb:
    uses: ./.github/workflows/test-mariadb.yml

  test-bioconda:
    uses: ./.github/workflows/test-bioconda.yml

  test-glog:
    uses: ./.github/workflows/test-glog.yml

  test-opentelemetry-cpp:
    uses: ./.github/workflows/test-opentelemetry-cpp.yml

  test-ignite:
    uses: ./.github/workflows/test-ignite.yml

  test-jitsi:
    uses: ./.github/workflows/test-jitsi.yml

  test-elastic-quark:
    uses: ./.github/workflows/test-elastic-quark.yml

  test-spacy:
    uses: ./.github/workflows/test-spacy.yml

  test-isa-l:
    uses: ./.github/workflows/test-isa-l.yml

  test-stream:
    uses: ./.github/workflows/test-stream.yml

  test-minikube:
    uses: ./.github/workflows/test-minikube.yml

  test-grpc:
    uses: ./.github/workflows/test-gRPC.yml

  test-dask-cuda:
    uses: ./.github/workflows/test-dask-cuda.yml

  test-dcgm-exporter:
    uses: ./.github/workflows/test-dcgm-exporter.yml

  test-dcgm:
    uses: ./.github/workflows/test-dcgm.yml

  test-deepspeed:
    uses: ./.github/workflows/test-deepspeed.yml

  test-dify:
    uses: ./.github/workflows/test-dify.yml

  test-dvc:
    uses: ./.github/workflows/test-dvc.yml

  test-enroot:
    uses: ./.github/workflows/test-enroot.yml

  test-feast:
    uses: ./.github/workflows/test-feast.yml

  test-flyte:
    uses: ./.github/workflows/test-flyte.yml

  summary:
    permissions:
      actions: read
      contents: read
    needs:
      [
        test-sentry-javascript,
        test-popins2,
        test-heartbeat,
        test-snappy,
        test-sonarqube,
        test-oceanbase,
        test-julia,
        test-epdb,
        test-llvm,
        test-luajit,
        test-junit5,
        test-vectorscan,
        test-nwchem,
        test-tengine,
        test-freeglut,
        test-libpcap,
        test-featuretools,
        test-emqtt,
        test-openfalcon,
        test-containerd,
        test-rocky_linux,
        test-llvm_flang,
        test-ocaml,
        test-drupal,
        test-mariadb,
        test-bioconda,
        test-glog,
        test-opentelemetry-cpp,
        test-ignite,
        test-jitsi,
        test-elastic-quark,
        test-spacy,
        test-isa-l,
        test-stream,
        test-minikube,
        test-grpc,
        test-dask-cuda,
        test-dcgm-exporter,
        test-dcgm,
        test-deepspeed,
        test-dify,
        test-dvc,
        test-enroot,
        test-feast,
        test-flyte
      ]
    runs-on: ubuntu-24.04-arm
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect batch results
        id: collect
        uses: ./.github/actions/collect-batch-results
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        with:
          batch_number: "11"
          batch_title: "Batch 11"

      - name: Attest complete batch results
        id: attest
        if: steps.collect.outcome == 'success'
        env:
          ARTIFACT_NAME: batch11-test-results
          BATCH_NUMBER: "11"
          COLLECTOR_JSON_COUNT: ${{ steps.collect.outputs.json_count }}
          CURRENT_BRANCH: ${{ github.ref_name }}
          DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
          EXPECTED_BRANCH: ${{ inputs.expected_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          NEEDS_JSON: ${{ toJson(needs) }}
          ORCHESTRATION_ID: ${{ inputs.orchestration_id }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/batch_artifact_attestation.py create \
            --results-root test-results \
            --workflow-file ".github/workflows/test-all-packages-batch11.yml" \
            --batch "$BATCH_NUMBER" \
            --repository "$REPOSITORY" \
            --expected-branch "$EXPECTED_BRANCH" \
            --current-branch "$CURRENT_BRANCH" \
            --expected-sha "$EXPECTED_SHA" \
            --workflow-sha "$WORKFLOW_SHA" \
            --orchestration-id "$ORCHESTRATION_ID" \
            --dispatch-nonce "$DISPATCH_NONCE" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --artifact-name "$ARTIFACT_NAME" \
            --collector-json-count "$COLLECTOR_JSON_COUNT" \
            --needs-environment-variable NEEDS_JSON

      - name: Upload batch test results
        if: steps.collect.outcome == 'success' && steps.attest.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: batch11-test-results
          path: test-results
          retention-days: 90

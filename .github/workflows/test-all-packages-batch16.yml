name: Test All Packages (Batch 16) on Arm64
run-name: Arm64 Batch 16 [${{ inputs.orchestration_id || format('manual-{0}-{1}', github.run_id, github.run_attempt) }}] [nonce:${{ inputs.dispatch_nonce || 'manual-only' }}]

on:
  workflow_dispatch:
    inputs:
      orchestration_id:
        description: Exact orchestrator identity; blank uses a safe manual fallback
        required: false
        default: ""
        type: string
      dispatch_nonce:
        description: Secret exact-dispatch nonce; blank is manual-only and not publishable
        required: false
        default: ""
        type: string
      expected_sha:
        description: Exact commit expected by the orchestrator
        required: false
        default: ""
        type: string
      expected_branch:
        description: Exact branch expected by the orchestrator
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      orchestration_id:
        required: true
        type: string
      dispatch_nonce:
        required: true
        type: string
      expected_sha:
        required: true
        type: string
      expected_branch:
        required: true
        type: string

permissions:
  contents: read

jobs:

  test-tesseract:
    uses: ./.github/workflows/test-tesseract.yml

  test-salmon:
    uses: ./.github/workflows/test-salmon.yml

  test-opensearch-dashboard:
    uses: ./.github/workflows/test-opensearch-dashboard.yml

  test-packetbeat:
    uses: ./.github/workflows/test-packetbeat.yml

  test-openvvc:
    uses: ./.github/workflows/test-openvvc.yml

  test-liferay:
    uses: ./.github/workflows/test-liferay.yml

  test-elastic-crawler:
    uses: ./.github/workflows/test-elastic-crawler.yml

  test-typescript:
    uses: ./.github/workflows/test-typescript.yml

  test-roaringbitmap:
    uses: ./.github/workflows/test-RoaringBitmap.yml

  test-falco:
    uses: ./.github/workflows/test-falco.yml

  test-haskell-nix:
    uses: ./.github/workflows/test-haskell-nix.yml

  test-flannel:
    uses: ./.github/workflows/test-flannel.yml

  test-redis:
    uses: ./.github/workflows/test-redis.yml

  test-docker:
    uses: ./.github/workflows/test-docker.yml

  test-openshift:
    uses: ./.github/workflows/test-openshift.yml

  test-rundeck:
    uses: ./.github/workflows/test-rundeck.yml

  test-kubewarden-policy-server:
    uses: ./.github/workflows/test-kubewarden-policy-server.yml

  test-memtester:
    uses: ./.github/workflows/test-memtester.yml

  test-lxcfs:
    uses: ./.github/workflows/test-lxcfs.yml

  test-npm:
    uses: ./.github/workflows/test-npm.yml

  test-terraform:
    uses: ./.github/workflows/test-terraform.yml

  test-postman:
    uses: ./.github/workflows/test-postman.yml

  test-iotop:
    uses: ./.github/workflows/test-iotop.yml

  test-openscenegraph:
    uses: ./.github/workflows/test-openscenegraph.yml

  test-pandas:
    uses: ./.github/workflows/test-pandas.yml

  test-geoserver:
    uses: ./.github/workflows/test-geoserver.yml

  test-kata:
    uses: ./.github/workflows/test-kata.yml

  test-netcdf:
    uses: ./.github/workflows/test-netcdf.yml

  test-cjson:
    uses: ./.github/workflows/test-cjson.yml

  test-domo-node-sdk:
    uses: ./.github/workflows/test-domo-node-sdk.yml

  test-swig:
    uses: ./.github/workflows/test-swig.yml

  test-tcl:
    uses: ./.github/workflows/test-tcl.yml

  test-zstandard:
    uses: ./.github/workflows/test-zstandard.yml

  test-functionbeat:
    uses: ./.github/workflows/test-functionbeat.yml

  test-cilium:
    uses: ./.github/workflows/test-cilium.yml

  test-eclipse_temurin:
    uses: ./.github/workflows/test-eclipse_temurin.yml

  test-vvenc:
    uses: ./.github/workflows/test-VVenC.yml

  test-elasticapmserver:
    uses: ./.github/workflows/test-elasticapmserver.yml

  test-dapr:
    uses: ./.github/workflows/test-dapr.yml

  test-openssh:
    uses: ./.github/workflows/test-openssh.yml

  test-gperftools:
    uses: ./.github/workflows/test-gperftools.yml

  test-haystack:
    uses: ./.github/workflows/test-haystack.yml

  test-godot:
    uses: ./.github/workflows/test-godot.yml

  test-gtkwave:
    uses: ./.github/workflows/test-gtkwave.yml

  test-holoscan-sdk:
    uses: ./.github/workflows/test-holoscan-sdk.yml

  summary:
    permissions:
      actions: read
      contents: read
    needs:
      [
        test-tesseract,
        test-salmon,
        test-opensearch-dashboard,
        test-packetbeat,
        test-openvvc,
        test-liferay,
        test-elastic-crawler,
        test-typescript,
        test-roaringbitmap,
        test-falco,
        test-haskell-nix,
        test-flannel,
        test-redis,
        test-docker,
        test-openshift,
        test-rundeck,
        test-kubewarden-policy-server,
        test-memtester,
        test-lxcfs,
        test-npm,
        test-terraform,
        test-postman,
        test-iotop,
        test-openscenegraph,
        test-pandas,
        test-geoserver,
        test-kata,
        test-netcdf,
        test-cjson,
        test-domo-node-sdk,
        test-swig,
        test-tcl,
        test-zstandard,
        test-functionbeat,
        test-cilium,
        test-eclipse_temurin,
        test-vvenc,
        test-elasticapmserver,
        test-dapr,
        test-openssh,
        test-gperftools,
        test-haystack,
        test-godot,
        test-gtkwave,
        test-holoscan-sdk
      ]
    runs-on: ubuntu-24.04-arm
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # original: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Collect batch results
        id: collect
        uses: ./.github/actions/collect-batch-results
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        with:
          batch_number: "16"
          batch_title: "Batch 16"

      - name: Attest complete batch results
        id: attest
        if: steps.collect.outcome == 'success'
        env:
          ARTIFACT_NAME: batch16-test-results
          BATCH_NUMBER: "16"
          COLLECTOR_JSON_COUNT: ${{ steps.collect.outputs.json_count }}
          CURRENT_BRANCH: ${{ github.ref_name }}
          DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
          EXPECTED_BRANCH: ${{ inputs.expected_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          NEEDS_JSON: ${{ toJson(needs) }}
          ORCHESTRATION_ID: ${{ inputs.orchestration_id }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/batch_artifact_attestation.py create \
            --results-root test-results \
            --workflow-file ".github/workflows/test-all-packages-batch16.yml" \
            --batch "$BATCH_NUMBER" \
            --repository "$REPOSITORY" \
            --expected-branch "$EXPECTED_BRANCH" \
            --current-branch "$CURRENT_BRANCH" \
            --expected-sha "$EXPECTED_SHA" \
            --workflow-sha "$WORKFLOW_SHA" \
            --orchestration-id "$ORCHESTRATION_ID" \
            --dispatch-nonce "$DISPATCH_NONCE" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --artifact-name "$ARTIFACT_NAME" \
            --collector-json-count "$COLLECTOR_JSON_COUNT" \
            --needs-environment-variable NEEDS_JSON

      - name: Upload batch test results
        if: steps.collect.outcome == 'success' && steps.attest.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # original: actions/upload-artifact@v4.6.2
        with:
          name: batch16-test-results
          path: test-results
          retention-days: 90

name: Global Test Summary (All Batches)

concurrency:
  group: ${{ github.repository }}-global-summary-publication
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  pull-requests: write

env:
  PYTHONDONTWRITEBYTECODE: "1"
  TRUSTED_PUBLICATION_BRANCH: main

on:
  workflow_dispatch:
    inputs:
      run_manifest:
        description: Canonical compact JSON manifest of the exact 22 batch runs
        required: true
        default: ""
        type: string
      expected_sha:
        description: Exact repository commit used by every batch
        required: true
        default: ""
        type: string
      triggering_batch:
        description: "Name of the workflow that triggered this summary (optional)"
        required: false
        default: ""
        type: string

jobs:
  global-summary:
    name: Generate Global Summary
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Bind exact generated-data base
        id: generated_data_base
        env:
          EXPECTED_BRANCH: ${{ env.TRUSTED_PUBLICATION_BRANCH }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          [[ "$EXPECTED_SHA" == "$WORKFLOW_SHA" ]]
          [[ "$actual_sha" == "$WORKFLOW_SHA" ]]
          git fetch --no-tags origin \
            "+refs/heads/${EXPECTED_BRANCH}:refs/remotes/origin/${EXPECTED_BRANCH}"
          remote_sha="$(git rev-parse "refs/remotes/origin/${EXPECTED_BRANCH}^{commit}")"
          [[ "$remote_sha" == "$WORKFLOW_SHA" ]]

          # Repository Python is trusted only after all four SHAs agree.
          python3 .github/scripts/orchestration_contract.py validate-base \
            --expected-sha "$EXPECTED_SHA" \
            --workflow-sha "$WORKFLOW_SHA" \
            --checkout-sha "$actual_sha" \
            --remote-sha "$remote_sha"
          printf 'sha=%s\n' "$actual_sha" >> "$GITHUB_OUTPUT"

      - name: Validate exact batch-run manifest
        env:
          EXPECTED_BRANCH: ${{ env.TRUSTED_PUBLICATION_BRANCH }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_MANIFEST: ${{ inputs.run_manifest }}
        run: |
          set -euo pipefail
          python3 .github/scripts/orchestration_contract.py validate-manifest-env \
            --environment-variable RUN_MANIFEST \
            --expected-sha "$EXPECTED_SHA" \
            --branch "$EXPECTED_BRANCH" \
            --repository "$REPOSITORY" \
            --output .orchestration/run-manifest.json

      - name: Download exact batch artifacts
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          helper=".github/scripts/orchestration_contract.py"
          attestation_helper=".github/scripts/batch_artifact_attestation.py"
          manifest=".orchestration/run-manifest.json"
          context="$(python3 "$helper" manifest-context --manifest "$manifest")"
          IFS=$'\t' read -r ORCHESTRATION_ID EXPECTED_SHA BRANCH <<< "$context"
          WORKFLOW_SHA="$(git rev-parse HEAD)"
          [[ "$WORKFLOW_SHA" == "$EXPECTED_SHA" ]]
          mkdir -p downloaded-results
          DOWNLOADED_BATCHES=0
          DOWNLOAD_FAILURES=0
          : > downloaded-results/.batch-runs.tsv

          for i in {1..22}; do
            WORKFLOW="test-all-packages-batch${i}.yml"
            ARTIFACT="batch${i}-test-results"
            runtime="$(python3 "$helper" record-runtime \
              --manifest "$manifest" \
              --batch "$i")"
            IFS=$'\t' read -r DISPATCH_NONCE RUN_ID RUN_ATTEMPT <<< "$runtime"
            [[ "$RUN_ATTEMPT" == "1" ]]
            DEST="downloaded-results/batch${i}"
            registration_payload=".orchestration/summary-registration-${i}.json"
            run_payload=".orchestration/summary-run-${i}.json"
            artifacts_payload=".orchestration/artifacts-${i}.json"
            mkdir -p "$DEST"

            endpoint="$(python3 "$helper" runs-endpoint \
              --batch "$i" \
              --branch "$BRANCH" \
              --expected-sha "$EXPECTED_SHA" \
              --repository "$REPOSITORY")"
            if ! gh api --paginate --slurp "$endpoint" > "$registration_payload"; then
              echo "Infrastructure registration lookup failed for exact run $RUN_ID."
              DOWNLOAD_FAILURES=$((DOWNLOAD_FAILURES + 1))
              continue
            fi
            if ! REGISTERED_RUN_ID="$(python3 "$helper" select-registration \
              --payload "$registration_payload" \
              --batch "$i" \
              --orchestration-id "$ORCHESTRATION_ID" \
              --dispatch-nonce "$DISPATCH_NONCE" \
              --expected-sha "$EXPECTED_SHA" \
              --branch "$BRANCH" \
              --repository "$REPOSITORY")"; then
              echo "Exact registration was duplicated or malformed for run $RUN_ID."
              DOWNLOAD_FAILURES=$((DOWNLOAD_FAILURES + 1))
              continue
            fi
            if [[ "$REGISTERED_RUN_ID" != "$RUN_ID" ]]; then
              echo "Exact registration no longer resolves uniquely to run $RUN_ID."
              DOWNLOAD_FAILURES=$((DOWNLOAD_FAILURES + 1))
              continue
            fi

            if ! gh api \
              "repos/${REPOSITORY}/actions/runs/${RUN_ID}" \
              > "$run_payload"; then
              echo "Infrastructure lookup failed for exact run $RUN_ID."
              DOWNLOAD_FAILURES=$((DOWNLOAD_FAILURES + 1))
              continue
            fi

            if ! python3 "$helper" validate-run \
              --payload "$run_payload" \
              --batch "$i" \
              --orchestration-id "$ORCHESTRATION_ID" \
              --dispatch-nonce "$DISPATCH_NONCE" \
              --expected-sha "$EXPECTED_SHA" \
              --branch "$BRANCH" \
              --repository "$REPOSITORY" \
              --expected-run-id "$RUN_ID"; then
              echo "Exact run identity or terminal state was rejected for $RUN_ID."
              DOWNLOAD_FAILURES=$((DOWNLOAD_FAILURES + 1))
              continue
            fi

            if ! gh api --paginate --slurp \
              "repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
              > "$artifacts_payload"; then
              echo "Infrastructure artifact lookup failed for exact run $RUN_ID."
              DOWNLOAD_FAILURES=$((DOWNLOAD_FAILURES + 1))
              continue
            fi
            if ! python3 "$helper" validate-artifacts \
              --payload "$artifacts_payload" \
              --batch "$i" \
              --expected-run-id "$RUN_ID"; then
              echo "Expected unique non-expired artifact was rejected for run $RUN_ID."
              DOWNLOAD_FAILURES=$((DOWNLOAD_FAILURES + 1))
              continue
            fi

            if ! gh run download "$RUN_ID" -n "$ARTIFACT" -D "$DEST"; then
              echo "Exact artifact download failed for run $RUN_ID."
              DOWNLOAD_FAILURES=$((DOWNLOAD_FAILURES + 1))
              continue
            fi
            if ! python3 "$attestation_helper" verify \
              --results-root "$DEST" \
              --workflow-file ".github/workflows/$WORKFLOW" \
              --batch "$i" \
              --repository "$REPOSITORY" \
              --expected-branch "$BRANCH" \
              --current-branch "$BRANCH" \
              --expected-sha "$EXPECTED_SHA" \
              --workflow-sha "$WORKFLOW_SHA" \
              --orchestration-id "$ORCHESTRATION_ID" \
              --dispatch-nonce "$DISPATCH_NONCE" \
              --run-id "$RUN_ID" \
              --run-attempt "$RUN_ATTEMPT" \
              --artifact-name "$ARTIFACT"; then
              echo "Collector attestation rejected incomplete artifact for run $RUN_ID."
              DOWNLOAD_FAILURES=$((DOWNLOAD_FAILURES + 1))
              continue
            fi

            DOWNLOADED_BATCHES=$((DOWNLOADED_BATCHES + 1))
            printf "%s\t%s\t%s\t%s\n" \
              "$i" "$RUN_ID" "$WORKFLOW" "$ARTIFACT" \
              >> downloaded-results/.batch-runs.tsv
          done

          echo "downloaded_batches=$DOWNLOADED_BATCHES" >> "$GITHUB_OUTPUT"
          echo "download_failures=$DOWNLOAD_FAILURES" >> "$GITHUB_OUTPUT"
          if [ "$DOWNLOAD_FAILURES" -ne 0 ]; then
            echo "❌ Refusing publication because one or more batch downloads failed."
            exit 1
          fi

      - name: Assemble candidate and previous-production staging sets
        id: assemble
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TRUSTED_PUBLICATION_BRANCH: ${{ env.TRUSTED_PUBLICATION_BRANCH }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import shutil
          import subprocess
          import sys
          from pathlib import Path
          import yaml

          sys.path.insert(0, str(Path(".github/scripts").resolve(strict=True)))
          from summary_slug_policy import DestinationRegistry, PackageCatalog

          catalog = PackageCatalog.load(Path.cwd())
          stage_root = Path(".summary-staging")
          candidate_dir = stage_root / "candidate-test-results"
          previous_dir = stage_root / "previous-production-test-results"

          if stage_root.exists():
              shutil.rmtree(stage_root)
          candidate_dir.mkdir(parents=True, exist_ok=True)
          previous_dir.mkdir(parents=True, exist_ok=True)
          candidate_destinations = DestinationRegistry(candidate_dir)
          previous_destinations = DestinationRegistry(previous_dir)

          existing_dir = Path("data/test-results")
          downloaded_dir = Path("downloaded-results")
          batch_runs_path = downloaded_dir / ".batch-runs.tsv"
          gh_token = os.environ.get("GH_TOKEN", "").strip()
          github_server = os.environ.get("GITHUB_SERVER_URL", "https://github.com")
          github_repository = os.environ.get("GITHUB_REPOSITORY", "").strip()
          trusted_publication_branch = os.environ.get(
              "TRUSTED_PUBLICATION_BRANCH", ""
          ).strip()
          if trusted_publication_branch != "main":
              raise RuntimeError("trusted publication branch must be main")

          counters = {
              "malformed": 0,
              "previous": 0,
              "candidate": 0,
              "synthesized": 0,
          }
          previous_payloads = {}
          expected_registrations = {}
          previous_registrations = {}
          registration_sources = {}
          max_stage_json_bytes = 2_097_152

          def reject_json_constant(value: str):
              raise ValueError(f"unsupported JSON constant: {value}")

          def reject_duplicate_keys(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate JSON key: {key!r}")
                  result[key] = value
              return result

          def load_source_payload(source_path: Path):
              if source_path.is_symlink() or not source_path.is_file():
                  raise ValueError("source is not a regular file")
              source_bytes = source_path.read_bytes()
              if not source_bytes or len(source_bytes) > max_stage_json_bytes:
                  raise ValueError(
                      f"source has unsupported size {len(source_bytes)}"
                  )
              payload = json.loads(
                  source_bytes,
                  object_pairs_hook=reject_duplicate_keys,
                  parse_constant=reject_json_constant,
              )
              if not isinstance(payload, dict):
                  raise ValueError("source JSON must contain an object")
              return payload, source_bytes

          def write_canonical(
              source_path: Path,
              destinations: DestinationRegistry,
              counter_key: str,
          ) -> None:
              try:
                  payload, source_bytes = load_source_payload(source_path)
              except Exception:
                  print(f"⚠️ Skipping malformed result artifact: {source_path}")
                  counters["malformed"] += 1
                  return

              metadata = payload.get("metadata")
              if not isinstance(metadata, dict):
                  metadata = {}
              canonical = catalog.from_metadata(
                  metadata,
                  fallback_stem=source_path.stem,
                  source_label=str(source_path),
              )
              target_path = destinations.claim(
                  canonical,
                  source_label=str(source_path),
              )
              target_path.write_bytes(source_bytes)
              counters[counter_key] += 1
              if counter_key == "previous":
                  previous_payloads[canonical] = payload

          for source in sorted(existing_dir.glob("*.json")):
              write_canonical(source, previous_destinations, "previous")

          for source in sorted(downloaded_dir.rglob("*.json")):
              if (
                  source.name == "batch-attestation.json"
                  and source.parent.parent == downloaded_dir
              ):
                  continue
              write_canonical(source, candidate_destinations, "candidate")

          job_cache = {}
          run_cache = {}
          ancestry_cache = {}
          terminal_job_conclusions = {
              "success",
              "failure",
              "cancelled",
              "timed_out",
              "neutral",
              "skipped",
              "action_required",
              "stale",
              "startup_failure",
          }

          def fetch_run(run_id: str):
              if run_id in run_cache:
                  return run_cache[run_id]
              if not gh_token or not github_repository:
                  run_cache[run_id] = {}
                  return {}
              try:
                  raw = subprocess.check_output(
                      [
                          "gh",
                          "api",
                          f"repos/{github_repository}/actions/runs/{run_id}",
                      ],
                      text=True,
                      timeout=30,
                      env={**os.environ, "GH_TOKEN": gh_token},
                  )
                  run = json.loads(raw)
                  if not isinstance(run, dict):
                      run = {}
              except Exception:
                  run = {}
              run_cache[run_id] = run
              return run

          def fetch_jobs(run_id: str):
              if run_id in job_cache:
                  return job_cache[run_id]
              if not gh_token or not github_repository:
                  job_cache[run_id] = []
                  return []
              try:
                  raw = subprocess.check_output(
                      [
                          "gh",
                          "api",
                          f"repos/{github_repository}/actions/runs/{run_id}/jobs?per_page=100",
                      ],
                      text=True,
                      timeout=30,
                      env={**os.environ, "GH_TOKEN": gh_token},
                  )
                  jobs = json.loads(raw).get("jobs", [])
              except Exception:
                  jobs = []
              job_cache[run_id] = jobs
              return jobs

          def is_trusted_publication_commit(commit_sha: str) -> bool:
              if commit_sha in ancestry_cache:
                  return ancestry_cache[commit_sha]
              trusted = False
              if gh_token and github_repository and trusted_publication_branch:
                  try:
                      raw = subprocess.check_output(
                          [
                              "gh",
                              "api",
                              (
                                  f"repos/{github_repository}/compare/"
                                  f"{commit_sha}...{trusted_publication_branch}"
                              ),
                          ],
                          text=True,
                          timeout=30,
                          env={**os.environ, "GH_TOKEN": gh_token},
                      )
                      comparison = json.loads(raw)
                      merge_base = comparison.get("merge_base_commit") or {}
                      trusted = (
                          str(comparison.get("status") or "")
                          in {"ahead", "identical"}
                          and str(merge_base.get("sha") or "") == commit_sha
                      )
                  except Exception:
                      trusted = False
              ancestry_cache[commit_sha] = trusted
              return trusted

          def resolve_expected_job(
              run_id: str,
              run_attempt: str,
              workflow_name: str,
              job_name: str,
              callee_job_name: str,
          ):
              batch_run_url = f"{github_server}/{github_repository}/actions/runs/{run_id}" if github_repository else ""
              expected_api_job_name = f"{job_name} / {callee_job_name}"
              fallback = (
                  batch_run_url,
                  expected_api_job_name,
                  "",
                  "",
                  "",
                  "batch_run_fallback",
              )
              run = fetch_run(run_id)
              repository = run.get("repository") or {}
              head_repository = run.get("head_repository") or {}
              expected_workflow_path = f".github/workflows/{workflow_name}"
              observed_workflow_path = str(run.get("path") or "").split("@", 1)[0]
              run_head_sha = str(run.get("head_sha") or "")
              if (
                  str(run.get("id") or "") != run_id
                  or str(run.get("run_attempt") or "") != run_attempt
                  or str(run.get("status") or "") != "completed"
                  or str(run.get("event") or "") != "workflow_dispatch"
                  or str(repository.get("full_name") or "") != github_repository
                  or str(head_repository.get("full_name") or "") != github_repository
                  or observed_workflow_path != expected_workflow_path
                  or str(run.get("head_branch") or "")
                  != trusted_publication_branch
                  or re.fullmatch(r"[0-9a-f]{40}", run_head_sha) is None
                  or not is_trusted_publication_commit(run_head_sha)
              ):
                  return fallback
              jobs = fetch_jobs(run_id)
              if not jobs:
                  return fallback
              by_name = {}
              for job in jobs:
                  name = str(job.get("name") or "").strip()
                  html_url = str(job.get("html_url") or "").strip()
                  if name and html_url:
                      by_name.setdefault(name.lower(), []).append(job)
              matches = {}
              for job in by_name.get(expected_api_job_name.lower(), []):
                  url = str(job.get("html_url") or "").strip()
                  matches[url] = job
              if len(matches) == 1:
                  url, job = next(iter(matches.items()))
                  resolved_name = str(job.get("name") or "").strip()
                  conclusion = str(job.get("conclusion") or "").strip()
                  started_at = str(job.get("started_at") or "").strip()
                  completed_at = str(job.get("completed_at") or "").strip()
                  labels = job.get("labels")
                  runner_group_id = job.get("runner_group_id")
                  runner_group_name = str(job.get("runner_group_name") or "")
                  if (
                      str(job.get("run_id") or "") == run_id
                      and str(job.get("run_attempt") or "") == run_attempt
                      and str(job.get("status") or "") == "completed"
                      and conclusion in terminal_job_conclusions
                      and started_at
                      and completed_at
                      and str(job.get("head_sha") or "") == run_head_sha
                      and isinstance(labels, list)
                      and "ubuntu-24.04-arm" in labels
                      and "self-hosted" not in labels
                      and runner_group_id == 0
                      and runner_group_name == "GitHub Actions"
                      and re.fullmatch(
                          rf"https://github\.com/{re.escape(github_repository)}"
                          rf"/actions/runs/{re.escape(run_id)}/job/[1-9][0-9]*",
                          url,
                      )
                  ):
                      return (
                          url,
                          resolved_name,
                          conclusion,
                          started_at,
                          completed_at,
                          "central_exact",
                      )
              return fallback

          if batch_runs_path.exists():
              for raw_line in batch_runs_path.read_text().splitlines():
                  if not raw_line.strip():
                      continue
                  batch_number, run_id, workflow_name, artifact_name = raw_line.split("\t", 3)
                  batch_title = f"Batch {batch_number}"
                  workflow_path = Path(".github/workflows") / workflow_name
                  if not workflow_path.exists():
                      continue
                  workflow = yaml.safe_load(workflow_path.read_text()) or {}
                  jobs = workflow.get("jobs") or {}
                  expected = []
                  for job_name, job_def in jobs.items():
                      if job_name == "summary":
                          continue
                      uses = str((job_def or {}).get("uses") or "")
                      if uses.startswith("./.github/workflows/test-") and uses.endswith(".yml"):
                          stem = Path(uses).stem.replace("test-", "", 1)
                          reusable_workflow_path = Path(
                              uses.removeprefix("./")
                          )
                          if not reusable_workflow_path.is_file():
                              raise ValueError(
                                  f"reusable workflow is missing: {uses}"
                              )
                          reusable_workflow = (
                              yaml.safe_load(
                                  reusable_workflow_path.read_text()
                              )
                              or {}
                          )
                          reusable_jobs = (
                              reusable_workflow.get("jobs") or {}
                          )
                          if len(reusable_jobs) != 1:
                              raise ValueError(
                                  f"reusable workflow must have one job: {uses}"
                              )
                          callee_job_name = next(iter(reusable_jobs))
                          slug = catalog.require(
                              stem,
                              label=f"{workflow_path}:{job_name} workflow slug",
                          )
                          registration = f"{workflow_path}:{job_name}"
                          previous_registration = registration_sources.get(slug)
                          if previous_registration is not None:
                              raise ValueError(
                                  f"duplicate expected package_slug {slug!r} in "
                                  f"{previous_registration!r} and {registration!r}"
                              )
                          registration_sources[slug] = registration
                          expected.append((slug, job_name, callee_job_name))

                  for slug, job_name, callee_job_name in expected:
                      (
                          run_url,
                          resolved_job_name,
                          job_conclusion,
                          job_started_at,
                          job_completed_at,
                          resolution_state,
                      ) = resolve_expected_job(
                          str(run_id),
                          "1",
                          workflow_name,
                          job_name,
                          callee_job_name,
                      )
                      expected_registrations[slug] = {
                          "batch_title": batch_title,
                          "workflow_path": str(workflow_path),
                          "run_id": str(run_id),
                          "run_attempt": "1",
                          "job_name": resolved_job_name,
                          "job_url": run_url,
                          "job_conclusion": job_conclusion,
                          "job_started_at": job_started_at,
                          "job_completed_at": job_completed_at,
                          "resolution_status": resolution_state,
                      }

                      previous = previous_payloads.get(slug, {})
                      previous_run = (
                          previous.get("run")
                          if isinstance(previous, dict)
                          else None
                      )
                      if isinstance(previous_run, dict):
                          previous_run_id = str(
                              previous_run.get("id") or ""
                          ).strip()
                          previous_run_attempt = str(
                              previous_run.get("attempt") or ""
                          ).strip()
                          if (
                              re.fullmatch(r"[1-9][0-9]*", previous_run_id)
                              and re.fullmatch(
                                  r"[1-9][0-9]*", previous_run_attempt
                              )
                          ):
                              (
                                  previous_job_url,
                                  previous_job_name,
                                  previous_job_conclusion,
                                  previous_job_started_at,
                                  previous_job_completed_at,
                                  previous_resolution_state,
                              ) = resolve_expected_job(
                                  previous_run_id,
                                  previous_run_attempt,
                                  workflow_name,
                                  job_name,
                                  callee_job_name,
                              )
                              if previous_resolution_state == "central_exact":
                                  previous_registrations[slug] = {
                                      "batch_title": batch_title,
                                      "workflow_path": str(workflow_path),
                                      "run_id": previous_run_id,
                                      "run_attempt": previous_run_attempt,
                                      "job_name": previous_job_name,
                                      "job_url": previous_job_url,
                                      "job_conclusion": previous_job_conclusion,
                                      "job_started_at": previous_job_started_at,
                                      "job_completed_at": previous_job_completed_at,
                                      "resolution_status": "central_exact",
                                  }

                      target_path = candidate_destinations.destination(slug)
                      if target_path.exists():
                          continue

                      package = previous.get("package") or {}
                      metadata = previous.get("metadata") or {}
                      version = str((package.get("version") or "unknown")).strip() or "unknown"
                      package_name = str((package.get("name") or slug)).strip() or slug
                      dashboard_link = str((metadata.get("dashboard_link") or f"/linux/opensource_packages/{slug}")).strip()
                      if dashboard_link.startswith("/opensource_packages/"):
                          dashboard_link = dashboard_link.replace("/opensource_packages/", "/linux/opensource_packages/", 1)

                      payload = {
                          "schema_version": "2.0",
                          "package": {
                              "name": package_name,
                              "version": version,
                          },
                          "run": {
                              "id": str(run_id),
                              "attempt": "1",
                              "url": run_url,
                              "timestamp": "",
                              "status": "failure",
                              "runner": {
                                  "os": "ubuntu-24.04",
                                  "arch": "arm64",
                              },
                              "job_name": resolved_job_name,
                          },
                          "tests": {
                              "passed": 0,
                              "failed": 0,
                              "skipped": 0,
                              "duration_seconds": 0,
                              "details": [],
                          },
                          "metadata": {
                              "contract_version": "missing",
                              "package_slug": slug,
                              "dashboard_link": dashboard_link,
                              "badge_status": "failing",
                              "core_failed": 1,
                              "batch_title": batch_title,
                              "job_url_resolution_status": resolution_state,
                              "regression_applicability": "not_configured",
                              "regression_reason": "result_not_emitted",
                              "regression_note": "Workflow did not emit a terminal result JSON for this package in the current batch run.",
                              "synthesis_state": "synthesized_missing_current_run_result",
                          },
                      }
                      target_path = candidate_destinations.claim(
                          slug,
                          source_label=f"synthesized:{workflow_path}:{job_name}",
                      )
                      target_path.write_text(json.dumps(payload, indent=2) + "\n")
                      counters["candidate"] += 1
                      counters["synthesized"] += 1

          candidate_slugs = {
              path.stem for path in candidate_dir.glob("*.json")
          }
          previous_slugs = {
              path.stem for path in previous_dir.glob("*.json")
          }
          staged_slugs = candidate_slugs | previous_slugs
          if set(expected_registrations) != staged_slugs:
              raise ValueError(
                  "trusted registrations do not exactly cover staged rows: "
                  f"missing={sorted(staged_slugs - set(expected_registrations))}, "
                  f"unexpected={sorted(set(expected_registrations) - staged_slugs)}"
              )
          unresolved_registrations = sorted(
              slug
              for slug, registration in expected_registrations.items()
              if registration["resolution_status"] != "central_exact"
          )
          if unresolved_registrations:
              raise ValueError(
                  "trusted GitHub job identity is unresolved for: "
                  + ", ".join(unresolved_registrations)
              )
          (stage_root / "trusted-registrations.json").write_text(
              json.dumps(
                  {
                      "schema": "arm-dashboard-summary-registration",
                      "version": 2,
                      "repository": github_repository,
                      "registrations": expected_registrations,
                      "previous_registrations": previous_registrations,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n"
          )

          candidate_count = len(list(candidate_dir.glob("*.json")))
          previous_count = len(list(previous_dir.glob("*.json")))
          metrics = Path(".summary-staging/assemble-metrics.env")
          metrics.write_text(
              "\n".join(
                  [
                      f"json_count={candidate_count}",
                      f"malformed_count={counters['malformed']}",
                      f"candidate_count={candidate_count}",
                      f"previous_count={previous_count}",
                      f"synthesized_count={counters['synthesized']}",
                  ]
              )
              + "\n"
          )

          print(
              f"Prepared {candidate_count} candidate package results and "
              f"{previous_count} previous-production package results "
              f"({counters['malformed']} malformed artifacts skipped, "
              f"{counters['synthesized']} synthesized missing-package failures)."
          )
          PY

          cat .summary-staging/assemble-metrics.env >> "$GITHUB_OUTPUT"
          source .summary-staging/assemble-metrics.env
          echo "✅ Prepared ${candidate_count:-0} candidate staged result files and ${previous_count:-0} previous-production files."

      - name: Validate candidate exact job identities
        if: steps.assemble.outcome == 'success' && steps.assemble.outputs.json_count != '0'
        id: normalize
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          data_dir = Path(".summary-staging/candidate-test-results")
          registration_manifest = json.loads(
              Path(".summary-staging/trusted-registrations.json").read_text()
          )
          trusted_registrations = registration_manifest.get("registrations")
          if not isinstance(trusted_registrations, dict):
              raise ValueError("trusted registrations are unavailable")
          updated = 0
          unresolved = []
          duplicate_url_map = {}
          weak_urls = []
          blocked_slugs = {}
          exact_urls = 0

          for json_path in sorted(list(data_dir.glob("*.json"))):
              try:
                  payload = json.loads(json_path.read_text())
              except Exception:
                  weak_urls.append((json_path.name, "malformed_json", "malformed_json"))
                  continue

              candidate_slug = json_path.stem
              metadata = payload.get("metadata")
              run = payload.get("run")
              registration = trusted_registrations.get(candidate_slug)
              if (
                  not isinstance(metadata, dict)
                  or not isinstance(run, dict)
                  or not isinstance(registration, dict)
              ):
                  reason = "trusted_registration_or_candidate_shape_missing"
                  blocked_slugs[candidate_slug] = reason
                  weak_urls.append((json_path.name, "missing", reason))
                  unresolved.append(
                      f"{json_path.name}\tmissing\t{candidate_slug}"
                  )
                  continue

              package_slug = str(metadata.get("package_slug") or "").strip()
              run_id = str(run.get("id") or "").strip()
              run_attempt = str(run.get("attempt") or "").strip()
              current_url = str(run.get("url") or "").strip()
              job_name = str(run.get("job_name") or "").strip()
              batch_title = str(metadata.get("batch_title") or "").strip()
              resolution_status = str(
                  metadata.get("job_url_resolution_status") or ""
              ).strip()
              expected_run_id = registration["run_id"]
              expected_attempt = registration["run_attempt"]
              expected_url = registration["job_url"]
              expected_job_name = registration["job_name"]
              expected_batch_title = registration["batch_title"]

              mismatches = []
              if package_slug != candidate_slug:
                  mismatches.append("package_slug")
              if run_id != expected_run_id:
                  mismatches.append("run_id")
              if run_attempt != expected_attempt:
                  mismatches.append("run_attempt")
              if current_url != expected_url:
                  mismatches.append("job_url")
              if job_name != expected_job_name:
                  mismatches.append("job_name")
              if batch_title != expected_batch_title:
                  mismatches.append("batch_title")
              if resolution_status != "central_exact":
                  mismatches.append("resolution_status")

              if mismatches:
                  reason = "trusted_job_identity_mismatch:" + ",".join(mismatches)
                  blocked_slugs[candidate_slug] = reason
                  weak_urls.append(
                      (json_path.name, run_id or "missing", current_url or reason)
                  )
                  unresolved.append(
                      f"{json_path.name}\t{run_id or 'missing'}\t{candidate_slug}"
                  )
                  continue

              exact_urls += 1
              duplicate_url_map.setdefault(expected_url, []).append(
                  candidate_slug
              )

          duplicate_clusters = {
              url: slugs for url, slugs in duplicate_url_map.items() if len(slugs) > 1
          }

          for url, slugs in duplicate_clusters.items():
              for slug in slugs:
                  blocked_slugs[slug] = f"duplicate_exact_job_url:{url}"

          metrics = Path(".summary-staging/normalize-metrics.env")
          metrics.write_text(
              "\n".join(
                  [
                      f"normalized_count={updated}",
                      f"exact_url_count={exact_urls}",
                      f"weak_url_count={len(weak_urls)}",
                      f"duplicate_url_count={len(duplicate_clusters)}",
                      f"unresolved_count={len(unresolved)}",
                  ]
              )
              + "\n"
          )
          Path(".summary-staging/normalize-report.json").write_text(
              json.dumps(
                  {
                      "blocked_slugs": blocked_slugs,
                      "weak_urls": weak_urls,
                      "duplicate_clusters": duplicate_clusters,
                      "unresolved": unresolved,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n"
          )

          print(f"Validated {exact_urls} exact trusted job identities.")
          if weak_urls:
              print("Weak or unresolved result URLs:")
              for name, run_id, url in weak_urls[:50]:
                  print(f" - {name}\t{run_id}\t{url}")
          if duplicate_clusters:
              print("Duplicate exact job URLs detected:")
              for url, slugs in list(duplicate_clusters.items())[:50]:
                  print(f" - {url} => {', '.join(sorted(slugs))}")
          if unresolved:
              print("Unable to resolve exact job links for:")
              for name in unresolved[:50]:
                  print(f" - {name}")
          PY

          cat .summary-staging/normalize-metrics.env >> "$GITHUB_OUTPUT"

      - name: Promote validated candidate results into production data
        if: steps.normalize.outcome == 'success' && steps.assemble.outputs.json_count != '0'
        id: promote
        run: |
          python3 .github/scripts/promote_package_results.py \
            --stage-root .summary-staging \
            --validation-policy compatibility \
            --repository "$GITHUB_REPOSITORY"

          cat .summary-staging/publish-metrics.env >> "$GITHUB_OUTPUT"

          rm -rf test-results
          mkdir -p test-results data/test-results

          find data/test-results -maxdepth 1 -name '*.json' -delete

          for json_file in .summary-staging/publish-data-test-results/*.json; do
            [ -f "$json_file" ] || continue
            base=$(basename "$json_file" .json)
            cp "$json_file" "data/test-results/${base}.json"
            mkdir -p "test-results/${base}-test-results"
            cp "$json_file" "test-results/${base}-test-results/${base}.json"
          done

          cp .summary-staging/publish-index.json \
            data/test-results-index.json

      - name: Generate global summary
        run: |
          echo "# 📊 Global Package Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Last updated: $(date -u +'%Y-%m-%d %H:%M:%S UTC')_" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Batch artifacts downloaded | ${{ steps.download.outputs.downloaded_batches || '0' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Candidate JSON files assembled | ${{ steps.assemble.outputs.candidate_count || '0' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Candidate rows synthesized for missing current-run results | ${{ steps.assemble.outputs.synthesized_count || '0' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Previous production rows loaded | ${{ steps.assemble.outputs.previous_count || '0' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Malformed JSON artifacts skipped | ${{ steps.assemble.outputs.malformed_count || '0' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Exact candidate job URLs resolved | ${{ steps.normalize.outputs.exact_url_count || '0' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Candidate rows with weak URLs | ${{ steps.normalize.outputs.weak_url_count || '0' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Candidate rows promoted to production | ${{ steps.promote.outputs.promoted_count || '0' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Prior rows retained for blocked candidates | ${{ steps.promote.outputs.warning_count || '0' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          TOTAL=0
          PASS=0
          FAIL=0
          MALFORMED=0
          FAIL_LIST=""
          PASS_LIST=""
          REGRESSION_TOTAL=0
          REGRESSION_PASS=0
          REGRESSION_FAIL=0
          REGRESSION_DEFERRED=0
          REGRESSION_NOT_APPLICABLE_PM=0
          REGRESSION_NOT_CONFIGURED=0
          REGRESSION_PASS_LIST=""
          REGRESSION_FAIL_LIST=""
          REGRESSION_DEFERRED_LIST=""
          REGRESSION_NOT_CONFIGURED_LIST=""

          for result_dir in test-results/*/; do
            for json_file in "$result_dir"*.json; do
              [ -f "$json_file" ] || continue

              SLUG=$(basename "$json_file" .json)
              if [ ! -f "content/linux/opensource_packages/${SLUG}.md" ] && [ ! -f "content/opensource_packages/${SLUG}.md" ]; then
                continue
              fi

              TOTAL=$((TOTAL + 1))

              if ! jq empty "$json_file" >/dev/null 2>&1; then
                MALFORMED=$((MALFORMED + 1))
                FAIL=$((FAIL + 1))
                FAIL_LIST="${FAIL_LIST}| ⚠️ ${SLUG} | malformed | invalid JSON artifact skipped |"$'\n'
                continue
              fi

              NAME=$(jq -r '.package.name' "$json_file")
              VERSION=$(jq -r '.package.version' "$json_file")
              STATUS=$(jq -r '.run.status' "$json_file")
              BADGE_STATUS=$(jq -r '.metadata.badge_status // ""' "$json_file")
              CONTRACT_VERSION=$(jq -r '.metadata.contract_version // ""' "$json_file")
              PASSED_COUNT=$(jq -r '.tests.passed' "$json_file")
              FAILED_COUNT=$(jq -r '.tests.failed' "$json_file")
              SKIPPED_COUNT=$(jq -r '.tests.skipped // 0' "$json_file")
              TOTAL_TESTS=$((PASSED_COUNT + FAILED_COUNT + SKIPPED_COUNT))
              REGRESSION_ENTRY=$(jq -c '.tests.details[]? | select(.name == "Test 6 - Regression Validation" or .name == "Regression Validation")' "$json_file" | head -n 1)
              REGRESSION_APPLICABILITY=$(jq -r '.metadata.regression_applicability // ""' "$json_file")
              REGRESSION_REASON=$(jq -r '.metadata.regression_reason // ""' "$json_file")
              REGRESSION_NOTE=$(jq -r '.metadata.regression_note // ""' "$json_file" | tr '\n' ' ' | sed 's/|/\\|/g')

              if [ -n "$REGRESSION_ENTRY" ] && { [ -z "$VERSION" ] || [ "$VERSION" = "unknown" ] || [ "$VERSION" = "n/a" ]; }; then
                VERSION=$(echo "$REGRESSION_ENTRY" | jq -r '.current_version // .baseline_version // .current // ""')
              fi
              VERSION=$(echo "$VERSION" | sed 's/[",]//g' | tr -d '\\' | sed 's/\x1b\[[0-9;]*m//g' | cut -c 1-40)
              [ "${#VERSION}" -gt 39 ] && VERSION="${VERSION}..."
              if [ -z "$VERSION" ] || [ "$VERSION" = "unknown" ] || [ "$VERSION" = "n/a" ]; then
                VERSION="unknown"
              fi

              # Classify package rows strictly by actual test counts so inconsistent
              # top-level workflow metadata cannot place 6/6 packages under Failed Packages.
              EFFECTIVE_STATUS="failure"
              if [ "$FAILED_COUNT" -eq 0 ] && [ "$PASSED_COUNT" -gt 0 ]; then
                EFFECTIVE_STATUS="success"
              fi

              if [ "$EFFECTIVE_STATUS" = "success" ]; then
                PASS=$((PASS + 1))
                if [ "$SKIPPED_COUNT" -gt 0 ]; then
                  PASS_DETAILS="$PASSED_COUNT/$TOTAL_TESTS passed ($SKIPPED_COUNT skipped)"
                else
                  PASS_DETAILS="$PASSED_COUNT/$TOTAL_TESTS passed"
                fi
                PASS_LIST="${PASS_LIST}| ✅ $NAME | $VERSION | ${PASS_DETAILS} |"$'\n'
              else
                FAIL=$((FAIL + 1))
                if [ "$TOTAL_TESTS" -eq 0 ] && [ "$FAILED_COUNT" -eq 0 ] && [ "$PASSED_COUNT" -eq 0 ]; then
                  if [ "$CONTRACT_VERSION" = "missing" ]; then
                    FAIL_DETAILS="No structured test results emitted (job cancelled or failed before summary outputs were published)"
                  else
                    FAIL_DETAILS="No structured test results emitted"
                  fi
                elif [ "$SKIPPED_COUNT" -gt 0 ]; then
                  FAIL_DETAILS="$PASSED_COUNT/$TOTAL_TESTS passed ($FAILED_COUNT failed, $SKIPPED_COUNT skipped)"
                else
                  FAIL_DETAILS="$PASSED_COUNT/$TOTAL_TESTS passed ($FAILED_COUNT failed)"
                fi
                FAIL_LIST="${FAIL_LIST}| ❌ $NAME | $VERSION | ${FAIL_DETAILS} |"$'\n'
              fi

              if [ "$REGRESSION_APPLICABILITY" = "not_applicable" ] && [ "$REGRESSION_REASON" = "package_manager_installed" ]; then
                REGRESSION_NOT_APPLICABLE_PM=$((REGRESSION_NOT_APPLICABLE_PM + 1))
                continue
              fi

              if [ "$REGRESSION_APPLICABILITY" = "not_configured" ] || { [ -z "$REGRESSION_APPLICABILITY" ] && [ -z "$REGRESSION_ENTRY" ]; }; then
                REGRESSION_NOT_CONFIGURED=$((REGRESSION_NOT_CONFIGURED + 1))
                if [ -z "$REGRESSION_NOTE" ]; then
                  REGRESSION_NOTE="Workflow did not emit regression classification or Test 6 result metadata for this run."
                fi
                REGRESSION_NOT_CONFIGURED_LIST="${REGRESSION_NOT_CONFIGURED_LIST}| ${NAME} | ${VERSION} | ${REGRESSION_NOTE} |"$'\n'
                continue
              fi

              if [ -n "$REGRESSION_ENTRY" ]; then
                REGRESSION_TOTAL=$((REGRESSION_TOTAL + 1))
                REG_STATUS=$(echo "$REGRESSION_ENTRY" | jq -r '.status // "unknown"')
                CURRENT_VERSION=$(echo "$REGRESSION_ENTRY" | jq -r '.current_version // .baseline_version // .current // ""')
                LATEST_VERSION=$(echo "$REGRESSION_ENTRY" | jq -r '.latest_version // .next_version // .candidate_version // ""')
                NEXT_INSTALLED_VERSION=$(echo "$REGRESSION_ENTRY" | jq -r '.next_installed_version // .installed_next_version // .next_reported_version // ""' || true)
                DECISION=$(echo "$REGRESSION_ENTRY" | jq -r '.decision // "unspecified"')
                REGRESSION_RESULT=$(echo "$REGRESSION_ENTRY" | jq -r '.regression_result // ""')
                COMPARISON=$(echo "$REGRESSION_ENTRY" | jq -r '.comparison // .note // ""' | tr '\n' ' ' | sed 's/|/\\|/g')

                case "$DECISION" in
                  next_install_validated|next_bundle_validated|next_image_validated|limited_cpu_smoke_validated|safe_to_upgrade)
                    REGRESSION_CLASS="passed"
                    ;;
                  metadata_review_required|current_is_latest_stable|pinned_is_latest|already_current|already_at_latest|at_latest|current_is_latest|no_newer_stable_available|manual_review_needed|not_applicable_package_manager|hold_current_arm_dependency_gap|not_configured|baseline_failed|baseline_install_failed|runtime_validation_not_automated|runtime_validation_infrastructure_failure|bounded_runtime_deferred|arm64_desktop_artifact_unavailable)
                    REGRESSION_CLASS="deferred"
                    ;;
                  *)
                    if [ "$REG_STATUS" = "passed" ]; then
                      REGRESSION_CLASS="passed"
                    elif [ "$REG_STATUS" = "failed" ]; then
                      REGRESSION_CLASS="failed"
                    else
                      REGRESSION_CLASS="deferred"
                    fi
                    ;;
                esac

                case "$REGRESSION_CLASS" in
                  passed)
                    REGRESSION_PASS=$((REGRESSION_PASS + 1))
                    ;;
                  failed)
                    REGRESSION_FAIL=$((REGRESSION_FAIL + 1))
                    ;;
                  *)
                    REGRESSION_DEFERRED=$((REGRESSION_DEFERRED + 1))
                    ;;
                esac

                [ -z "$CURRENT_VERSION" ] && CURRENT_VERSION="unknown"
                if [ -z "$LATEST_VERSION" ] || [ "$LATEST_VERSION" = "n/a" ]; then
                  case "$DECISION" in
                    metadata_review_required|current_is_latest_stable|pinned_is_latest|already_current|already_at_latest|at_latest|current_is_latest|no_newer_stable_available|baseline_failed|baseline_install_failed)
                      LATEST_VERSION="$CURRENT_VERSION"
                      ;;
                    *)
                      LATEST_VERSION="unknown"
                      ;;
                  esac
                fi
                [ -z "$NEXT_INSTALLED_VERSION" ] && NEXT_INSTALLED_VERSION="n/a"
                if [ -z "$REGRESSION_RESULT" ]; then
                  case "$DECISION" in
                    next_install_validated)
                      REGRESSION_RESULT="Next version installed successfully on Arm64"
                      ;;
                    limited_cpu_smoke_validated)
                      REGRESSION_RESULT="Limited CPU-side proof passed on Arm64"
                      ;;
                    next_install_failed)
                      REGRESSION_RESULT="Next version install failed on Arm64"
                      ;;
                    current_is_latest_stable)
                      REGRESSION_RESULT="Current stable version already validated on Arm64"
                      ;;
                    manual_review_needed)
                      REGRESSION_RESULT="Pending regression install validation"
                      ;;
                    no_newer_stable_available)
                      REGRESSION_RESULT="No newer stable public release is available"
                      ;;
                    metadata_review_required)
                      REGRESSION_RESULT="Tests 1-5 baseline must be older than the latest stable release"
                      ;;
                    runtime_validation_not_automated)
                      REGRESSION_RESULT="Package-specific runtime validation is not automated"
                      ;;
                    runtime_validation_infrastructure_failure)
                      REGRESSION_RESULT="Next-version validation deferred after a transient infrastructure failure"
                      ;;
                    baseline_failed|baseline_install_failed)
                      REGRESSION_RESULT="Regression validation deferred because baseline install or core smoke checks failed"
                      ;;
                    not_configured)
                      REGRESSION_RESULT="Regression validation not configured for this workflow"
                      ;;
                    *)
                      if [ "$REGRESSION_CLASS" = "passed" ]; then
                        REGRESSION_RESULT="Regression validation passed"
                      elif [ "$REGRESSION_CLASS" = "failed" ]; then
                        REGRESSION_RESULT="Regression validation failed"
                      else
                        REGRESSION_RESULT="Regression validation deferred"
                      fi
                      ;;
                  esac
                fi
                REGRESSION_RESULT=$(echo "$REGRESSION_RESULT" | sed 's/|/\\|/g')
                [ -z "$COMPARISON" ] && COMPARISON="No regression note recorded."
                DEFERRED_REASON="$COMPARISON"
                if [ -z "$DEFERRED_REASON" ] || [ "$DEFERRED_REASON" = "No regression note recorded." ]; then
                  DEFERRED_REASON="$REGRESSION_RESULT"
                fi
                DEFERRED_REASON=$(echo "$DEFERRED_REASON" | sed 's/|/\\|/g')

                case "$REGRESSION_CLASS" in
                  passed)
                    REGRESSION_PASS_LIST="${REGRESSION_PASS_LIST}| ${NAME} | ${CURRENT_VERSION} | ${LATEST_VERSION} | ${NEXT_INSTALLED_VERSION} | ${REGRESSION_RESULT} | ${COMPARISON} |"$'\n'
                    ;;
                  failed)
                    REGRESSION_FAIL_LIST="${REGRESSION_FAIL_LIST}| ${NAME} | ${CURRENT_VERSION} | ${LATEST_VERSION} | ${NEXT_INSTALLED_VERSION} | ${REGRESSION_RESULT} | ${COMPARISON} |"$'\n'
                    ;;
                  *)
                    REGRESSION_DEFERRED_LIST="${REGRESSION_DEFERRED_LIST}| ${NAME} | ${CURRENT_VERSION} | ${LATEST_VERSION} | ${DECISION} | ${DEFERRED_REASON} |"$'\n'
                    ;;
                esac
              fi
            done
          done

          echo "## Summary Statistics" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total Packages** | $TOTAL |" >> $GITHUB_STEP_SUMMARY
          echo "| **Passed** | $PASS ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| **Failed** | $FAIL ❌ |" >> $GITHUB_STEP_SUMMARY
          echo "| **Malformed Results** | $MALFORMED ⚠️ |" >> $GITHUB_STEP_SUMMARY
          echo "| **Packages With Applicable Regression Validation** | $REGRESSION_TOTAL |" >> $GITHUB_STEP_SUMMARY
          echo "| **Regression Validation Passed** | $REGRESSION_PASS ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| **Regression Validation Failed** | $REGRESSION_FAIL ❌ |" >> $GITHUB_STEP_SUMMARY
          echo "| **Regression Validation Deferred / Not Applicable** | $REGRESSION_DEFERRED ⏸️ |" >> $GITHUB_STEP_SUMMARY
          echo "| **Regression Not Applicable (package manager installed)** | $REGRESSION_NOT_APPLICABLE_PM ⏸️ |" >> $GITHUB_STEP_SUMMARY
          if [ $REGRESSION_NOT_CONFIGURED -gt 0 ]; then
            echo "| **Regression Not Configured / Not Emitted** | $REGRESSION_NOT_CONFIGURED |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ $REGRESSION_PASS -gt 0 ]; then
            echo "## 🔁 Regression Validation Snapshot" >> $GITHUB_STEP_SUMMARY
            echo "| Package | Current Tested | Next Candidate | Next Installed | Regression Result | Notes |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- | :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            echo -e "$REGRESSION_PASS_LIST" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          if [ $REGRESSION_FAIL -gt 0 ]; then
            echo "## ❌ Regression Validation Failed" >> $GITHUB_STEP_SUMMARY
            echo "| Package | Current Tested | Next Candidate | Next Installed | Regression Result | Notes |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- | :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            echo -e "$REGRESSION_FAIL_LIST" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          if [ $REGRESSION_DEFERRED -gt 0 ]; then
            echo "## ⏸️ Regression Validation Deferred / Not Applicable" >> $GITHUB_STEP_SUMMARY
            echo "| Package | Current Tested | Next Candidate | Decision | Reason |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            echo -e "$REGRESSION_DEFERRED_LIST" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          if [ $REGRESSION_NOT_CONFIGURED -gt 0 ]; then
            echo "## ⚠️ Regression Not Configured / Not Emitted" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "These workflows did not emit enough regression metadata for this run." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Package | Version | Reason |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            echo -e "$REGRESSION_NOT_CONFIGURED_LIST" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          if [ $FAIL -gt 0 ]; then
            echo "## ❌ Failed Packages ($FAIL)" >> $GITHUB_STEP_SUMMARY
            echo "| Package | Version | Details |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            echo -e "$FAIL_LIST" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          if [ $PASS -gt 0 ]; then
            echo "<details>" >> $GITHUB_STEP_SUMMARY
            echo "<summary><b>✅ Passing Packages ($PASS) - Click to expand</b></summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Package | Version | Details |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            echo -e "$PASS_LIST" >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          fi

          if [ $TOTAL -eq 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **Warning:** No test results found. Check whether the batch artifacts completed and uploaded successfully." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Remove generated-data scratch paths
        if: always()
        run: |
          rm -rf -- \
            downloaded-results \
            .orchestration \
            .summary-package-map.json \
            .summary-staging \
            test-results

      - name: Revalidate exact publication base
        if: >-
          ${{
            success() &&
            steps.download.outcome == 'success' &&
            steps.assemble.outcome == 'success' &&
            steps.normalize.outcome == 'success' &&
            steps.promote.outcome == 'success' &&
            steps.assemble.outputs.json_count != '0'
          }}
        id: publication_base
        env:
          EXPECTED_BRANCH: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          git fetch --no-tags origin \
            "+refs/heads/${EXPECTED_BRANCH}:refs/remotes/origin/${EXPECTED_BRANCH}"
          remote_sha="$(git rev-parse "refs/remotes/origin/${EXPECTED_BRANCH}^{commit}")"
          python3 .github/scripts/orchestration_contract.py validate-base \
            --expected-sha "$EXPECTED_SHA" \
            --workflow-sha "$WORKFLOW_SHA" \
            --checkout-sha "$actual_sha" \
            --remote-sha "$remote_sha"

      - name: Open or update aggregated test-results review PR
        if: >-
          ${{
            success() &&
            steps.download.outcome == 'success' &&
            steps.assemble.outcome == 'success' &&
            steps.normalize.outcome == 'success' &&
            steps.promote.outcome == 'success' &&
            steps.publication_base.outcome == 'success' &&
            steps.assemble.outputs.json_count != '0'
          }}
        id: generated_data_review
        uses: ./.github/actions/publish-generated-data-pr
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          producer: global-test-results
          base-branch: ${{ github.ref_name }}
          expected-base-sha: ${{ steps.generated_data_base.outputs.sha }}
          head-branch: automation/generated-data/global-test-results/${{ github.ref_name }}
          title: Update generated Arm64 test results
          commit-message: Update generated Arm64 test results
          paths: |
            data/test-results-index.json
            data/test-results/
          required-tracked-paths: data/test-results-index.json

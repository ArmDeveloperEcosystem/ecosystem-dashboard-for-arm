name: Monitor main smoke recovery

on:
  workflow_run:
    workflows: [Test All Packages (Orchestrator) on Arm64]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-recovery-incident
  cancel-in-progress: false
  queue: max

jobs:
  monitor:
    name: Reconcile verified main recovery
    if: >-
      github.repository == 'ArmDeveloperEcosystem/ecosystem-dashboard-for-arm' &&
      github.ref == 'refs/heads/main' && vars.SMOKE_RECOVERY_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: write
    steps:
      - name: Check out trusted monitor implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned workflow parser
        run: |
          python3 -m pip install --disable-pip-version-check --no-deps --only-binary=:all: --require-hashes -r .github/scripts/requirements-exact-run.txt
      - name: Reconcile current evidence into the recovery incident
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_REPAIR_APP_BOT_LOGIN: ${{ vars.SMOKE_REPAIR_APP_BOT_LOGIN }}
          SMOKE_NOTIFICATION_LOGIN: ${{ vars.SMOKE_NOTIFICATION_LOGIN }}
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -I -B .github/scripts/smoke_recovery_incident.py watch \
            --repository "$GITHUB_REPOSITORY" --write

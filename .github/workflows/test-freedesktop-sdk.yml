name: Test Freedesktop SDK on Arm64
permissions:
  contents: read

on:
  workflow_call:
    outputs:
      contract_version:
        description: Output contract version
        value: ${{ jobs.test-freedesktop-sdk.outputs.contract_version }}
      package_slug:
        description: Canonical package slug
        value: ${{ jobs.test-freedesktop-sdk.outputs.package_slug }}
      package_name:
        description: Display package name
        value: ${{ jobs.test-freedesktop-sdk.outputs.package_name }}
      package_version:
        description: Baseline version tested in this run
        value: ${{ jobs.test-freedesktop-sdk.outputs.package_version }}
      run_status:
        description: Overall package run status
        value: ${{ jobs.test-freedesktop-sdk.outputs.run_status }}
      badge_status:
        description: Badge status derived from core baseline checks
        value: ${{ jobs.test-freedesktop-sdk.outputs.badge_status }}
      core_failed:
        description: Number of failed baseline core checks (Tests 1-5)
        value: ${{ jobs.test-freedesktop-sdk.outputs.core_failed }}
      tests_passed:
        description: Count of passed tests
        value: ${{ jobs.test-freedesktop-sdk.outputs.tests_passed }}
      tests_failed:
        description: Count of failed tests
        value: ${{ jobs.test-freedesktop-sdk.outputs.tests_failed }}
      tests_skipped:
        description: Count of skipped tests
        value: ${{ jobs.test-freedesktop-sdk.outputs.tests_skipped }}
      duration_seconds:
        description: Total duration across tests
        value: ${{ jobs.test-freedesktop-sdk.outputs.duration_seconds }}
      regression_status:
        description: Regression test status
        value: ${{ jobs.test-freedesktop-sdk.outputs.regression_status }}
      regression_decision:
        description: Regression decision label
        value: ${{ jobs.test-freedesktop-sdk.outputs.regression_decision }}
      regression_result:
        description: Human readable regression result
        value: ${{ jobs.test-freedesktop-sdk.outputs.regression_result }}
      regression_comparison:
        description: Regression comparison note
        value: ${{ jobs.test-freedesktop-sdk.outputs.regression_comparison }}
      regression_current_version:
        description: Baseline version used for regression comparison
        value: ${{ jobs.test-freedesktop-sdk.outputs.regression_current_version }}
      regression_latest_version:
        description: Next candidate version selected for regression validation
        value: ${{ jobs.test-freedesktop-sdk.outputs.regression_latest_version }}
      regression_next_installed_version:
        description: Candidate version reported by installed next artifact
        value: ${{ jobs.test-freedesktop-sdk.outputs.regression_next_installed_version }}
      run_id:
        description: GitHub run id
        value: ${{ jobs.test-freedesktop-sdk.outputs.run_id }}
      run_attempt:
        description: GitHub run attempt
        value: ${{ jobs.test-freedesktop-sdk.outputs.run_attempt }}
      job_name:
        description: GitHub job identifier
        value: ${{ jobs.test-freedesktop-sdk.outputs.job_name }}
      dashboard_link:
        description: Dashboard route for this package
        value: ${{ jobs.test-freedesktop-sdk.outputs.dashboard_link }}
      timestamp:
        description: UTC timestamp for this package run
        value: ${{ jobs.test-freedesktop-sdk.outputs.timestamp }}
jobs:
  test-freedesktop-sdk:
    runs-on: ubuntu-24.04-arm
    outputs:
      contract_version: "2.0"
      package_slug: ${{ steps.metadata.outputs.package_slug }}
      package_name: 'Freedesktop SDK'
      package_version: ${{ steps.version.outputs.version || 'unknown' }}
      run_status: ${{ steps.summary.outputs.overall_status || 'failure' }}
      badge_status: ${{ steps.summary.outputs.badge_status || 'failing' }}
      core_failed: ${{ steps.summary.outputs.core_failed || '0' }}
      tests_passed: ${{ steps.summary.outputs.passed || '0' }}
      tests_failed: ${{ steps.summary.outputs.failed || '0' }}
      tests_skipped: ${{ steps.summary.outputs.skipped || '0' }}
      duration_seconds: ${{ steps.summary.outputs.duration || '0' }}
      regression_status: ${{ steps.test6.outputs.status || 'skipped' }}
      regression_decision: ${{ steps.test6.outputs.decision || 'not_configured' }}
      regression_result: ${{ steps.test6.outputs.regression_result || '' }}
      regression_comparison: ${{ steps.test6.outputs.comparison || 'Regression comparison summary unavailable.' }}
      regression_current_version: ${{ steps.test6.outputs.current_version || steps.version.outputs.version || 'unknown' }}
      regression_latest_version: ${{ steps.test6.outputs.latest_version || 'unknown' }}
      regression_next_installed_version: ${{ steps.test6.outputs.next_installed_version || 'not_installed' }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      job_name: ${{ github.job }}
      dashboard_link: ${{ steps.metadata.outputs.dashboard_link }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # original: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set test metadata
        id: metadata
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "package_slug=freedesktop-sdk" >> "$GITHUB_OUTPUT"
          echo "dashboard_link=/opensource_packages/freedesktop-sdk" >> "$GITHUB_OUTPUT"
      - name: Install the Freedesktop SDK through Flatpak
        id: install
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local rc="$1"
            trap - EXIT
            if [ "$rc" -eq 0 ]; then
              echo "install_status=success" >> "$GITHUB_OUTPUT"
            else
              echo "install_status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish "$?"' EXIT
          export LC_ALL=C
          test "$(uname -m)" = aarch64
          SCOPE="$RUNNER_TEMP/freedesktop-sdk-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 "$SCOPE"
          printf '%s\n' "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" > "$SCOPE/owner"
          export FLATPAK_USER_DIR="$SCOPE/flatpak"
          export XDG_DATA_HOME="$SCOPE/data"
          export XDG_CACHE_HOME="$SCOPE/cache"
          export XDG_CONFIG_HOME="$SCOPE/config"
          export FLATPAK_FANCY_OUTPUT=0 FLATPAK_TTY_PROGRESS=0
          SDK_BRANCH=26.08
          SDK_REF="runtime/org.freedesktop.Sdk/aarch64/$SDK_BRANCH"
          PLATFORM_REF="runtime/org.freedesktop.Platform/aarch64/$SDK_BRANCH"
          SDK_APP="$SCOPE/application"
          mkdir -p "$FLATPAK_USER_DIR" "$XDG_DATA_HOME" "$XDG_CACHE_HOME" "$XDG_CONFIG_HOME"
          {
            echo "SDK_SCOPE=$SCOPE"
            echo "SDK_APP=$SDK_APP"
            echo "SDK_BRANCH=$SDK_BRANCH"
            echo "SDK_REF=$SDK_REF"
            echo "PLATFORM_REF=$PLATFORM_REF"
            echo "FLATPAK_USER_DIR=$FLATPAK_USER_DIR"
            echo "XDG_DATA_HOME=$XDG_DATA_HOME"
            echo "XDG_CACHE_HOME=$XDG_CACHE_HOME"
            echo "XDG_CONFIG_HOME=$XDG_CONFIG_HOME"
            echo "FLATPAK_FANCY_OUTPUT=0"
            echo "FLATPAK_TTY_PROGRESS=0"
            echo "LC_ALL=C"
          } >> "$GITHUB_ENV"
          bash .github/actions/apt-bootstrap/bootstrap.sh --packages "flatpak bubblewrap dbus-x11 file"
          test "$(flatpak --default-arch)" = aarch64
          # Use Flatpak's supported sandbox path; a raw bwrap probe is not a gate.
          timeout --kill-after=5s 120s dbus-run-session -- flatpak remote-add --user flathub https://flathub.org/repo/flathub.flatpakrepo
          SDK_COMMIT=$(timeout --kill-after=5s 120s flatpak remote-info --user --show-commit flathub "$SDK_REF")
          PLATFORM_COMMIT=$(timeout --kill-after=5s 120s flatpak remote-info --user --show-commit flathub "$PLATFORM_REF")
          [[ "$SDK_COMMIT" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PLATFORM_COMMIT" =~ ^[0-9a-f]{64}$ ]]
          printf 'requested_sdk_ref=%s\nrequested_sdk_commit=%s\nrequested_platform_ref=%s\nrequested_platform_commit=%s\n' \
            "$SDK_REF" "$SDK_COMMIT" "$PLATFORM_REF" "$PLATFORM_COMMIT"
          timeout --kill-after=30s 1500s dbus-run-session -- flatpak install --user --assumeyes --noninteractive --no-related --no-deps flathub "$SDK_REF" "$PLATFORM_REF"
          test "$(flatpak info --user --show-ref "$SDK_REF")" = "$SDK_REF"
          test "$(flatpak info --user --show-ref "$PLATFORM_REF")" = "$PLATFORM_REF"
          test "$(flatpak info --user --show-commit "$SDK_REF")" = "$SDK_COMMIT"
          test "$(flatpak info --user --show-commit "$PLATFORM_REF")" = "$PLATFORM_COMMIT"
          test "$(flatpak info --user --show-origin "$SDK_REF")" = flathub
          test "$(flatpak info --user --show-origin "$PLATFORM_REF")" = flathub
          {
            echo "SDK_COMMIT=$SDK_COMMIT"
            echo "PLATFORM_COMMIT=$PLATFORM_COMMIT"
          } >> "$GITHUB_ENV"
          {
            echo "installation_method=flatpak"
            echo "sdk_ref=$SDK_REF"
            echo "sdk_commit=$SDK_COMMIT"
            echo "platform_ref=$PLATFORM_REF"
            echo "platform_commit=$PLATFORM_COMMIT"
          } >> "$GITHUB_OUTPUT"
          finish 0

      - name: Identify the installed SDK release
        id: version
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local rc="$1"
            trap - EXIT
            if [ "$rc" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish "$?"' EXIT
          test "${{ steps.install.outcome }}" = success
          test "${{ steps.install.outputs.install_status }}" = success
          test "${{ steps.install.outputs.installation_method }}" = flatpak
          test "$(flatpak info --user --show-ref "$SDK_REF")" = "$SDK_REF"
          test "$(flatpak info --user --show-commit "$SDK_REF")" = "$SDK_COMMIT"
          flatpak info --user "$SDK_REF" > "$SDK_SCOPE/sdk-info.txt"
          cat "$SDK_SCOPE/sdk-info.txt"
          VERSION=$(python3 -I - "$SDK_SCOPE/sdk-info.txt" "$SDK_REF" "$SDK_COMMIT" "$SDK_BRANCH" <<'PY'
          from pathlib import Path
          import re
          import sys
          fields = {}
          wanted = {"ID", "Ref", "Arch", "Branch", "Version", "Origin", "Commit"}
          for line in Path(sys.argv[1]).read_text().splitlines():
              key, separator, value = line.strip().partition(":")
              if separator and key in wanted:
                  assert key not in fields, f"Duplicate SDK identity field: {key}"
                  fields[key] = value.strip()
          assert fields["ID"] == "org.freedesktop.Sdk"
          assert fields["Ref"] == sys.argv[2]
          assert fields["Commit"] == sys.argv[3]
          assert fields["Arch"] == "aarch64" and fields["Branch"] == sys.argv[4]
          assert fields["Origin"] == "flathub"
          release = re.fullmatch(r"freedesktop-sdk-(" + re.escape(sys.argv[4]) + r"\.[0-9]+)", fields["Version"])
          assert release, "Missing or unrelated SDK build release"
          print(release[1])
          PY
          )
          {
            echo "version=$VERSION"
            echo "package_version=$VERSION"
          } >> "$GITHUB_OUTPUT"
          finish 0

      - name: Test 1 - Bind installed SDK and application metadata
        id: test1
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local rc="$1"
            trap - EXIT
            if [ "$rc" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish "$?"' EXIT
          test "${{ steps.install.outcome }}" = success
          test "${{ steps.install.outputs.install_status }}" = success
          test "${{ steps.version.outcome }}" = success
          test "${{ steps.version.outputs.status }}" = passed
          test "$(flatpak info --user --show-ref "$SDK_REF")" = "$SDK_REF"
          test "$(flatpak info --user --show-ref "$PLATFORM_REF")" = "$PLATFORM_REF"
          test "$(flatpak info --user --show-commit "$SDK_REF")" = "$SDK_COMMIT"
          test "$(flatpak info --user --show-commit "$PLATFORM_REF")" = "$PLATFORM_COMMIT"
          flatpak info --user --show-metadata "$SDK_REF" > "$SDK_SCOPE/sdk-metadata.ini"
          timeout --kill-after=5s 120s dbus-run-session -- flatpak build-init --arch=aarch64 \
            "$SDK_APP" org.arm.EcosystemSdkSmoke org.freedesktop.Sdk org.freedesktop.Platform "$SDK_BRANCH"
          python3 -I - "$SDK_SCOPE/sdk-metadata.ini" "$SDK_APP/metadata" "$SDK_BRANCH" <<'PY'
          import configparser
          from pathlib import Path
          import sys
          for filename, section, name in ((sys.argv[1], "Runtime", "org.freedesktop.Sdk"),
                                          (sys.argv[2], "Application", "org.arm.EcosystemSdkSmoke")):
              metadata = configparser.ConfigParser(interpolation=None)
              metadata.read_string(Path(filename).read_text())
              assert metadata[section]["name"] == name
              assert metadata[section]["sdk"] == f"org.freedesktop.Sdk/aarch64/{sys.argv[3]}"
              assert metadata[section]["runtime"] == f"org.freedesktop.Platform/aarch64/{sys.argv[3]}"
              print(dict(metadata[section]))
          PY
          finish 0

      - name: Test 2 - Enter the SDK and verify its native compiler
        id: test2
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local rc="$1"
            trap - EXIT
            if [ "$rc" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish "$?"' EXIT
          test "${{ steps.test1.outcome }}" = success
          test "${{ steps.test1.outputs.status }}" = passed
          cat > "$SDK_SCOPE/compiler-check.sh" <<'SH'
            cat /usr/lib/os-release
            . /usr/lib/os-release
            test "$ID" = org.freedesktop.platform
            test "$VERSION_ID" = 26.08
            test "$NAME" = "Freedesktop SDK"
            test "$(uname -m)" = aarch64
            test "$(command -v gcc)" = /usr/bin/gcc
            gcc --version
            target=$(gcc -dumpmachine)
            case "$target" in aarch64-*) ;; *) exit 72 ;; esac
          SH
          timeout --kill-after=5s 120s dbus-run-session -- flatpak build --unshare=network "$SDK_APP" sh -euc "$(cat "$SDK_SCOPE/compiler-check.sh")"
          finish 0

      - name: Test 3 - Compile and link with the installed SDK
        id: test3
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local rc="$1"
            trap - EXIT
            if [ "$rc" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish "$?"' EXIT
          test "${{ steps.test2.outcome }}" = success
          test "${{ steps.test2.outputs.status }}" = passed
          mkdir -p "$SDK_APP/files/src" "$SDK_APP/files/bin"
          cat > "$SDK_APP/files/src/sdk-native-smoke.c" <<'C'
          #include <errno.h>
          #include <stdio.h>
          #include <stdlib.h>

          #if !defined(__aarch64__)
          #error This diagnostic requires native AArch64 code generation.
          #endif

          int main(int argc, char **argv)
          {
              char *end = NULL;
              long expected;
              int value = 0;
              if (argc != 2 || sizeof(void *) != 8) {
                  return 64;
              }
              errno = 0;
              expected = strtol(argv[1], &end, 10);
              if (errno != 0 || end == argv[1] || *end != '\0') {
                  return 65;
              }
              for (int i = 1; i <= 6; ++i) {
                  value += 2 * i;
              }
              printf("SDK_RESULT=%d\nPTR_BITS=%zu\n", value, 8 * sizeof(void *));
              return value == expected ? 0 : 9;
          }
          C
          test ! -e "$SDK_APP/files/bin/sdk-native-smoke"
          timeout --kill-after=5s 120s dbus-run-session -- flatpak build --unshare=network "$SDK_APP" sh -euc '
            gcc -std=c11 -O2 -Wall -Wextra -Werror /app/src/sdk-native-smoke.c -o /app/bin/sdk-native-smoke
          '
          test -s "$SDK_APP/files/bin/sdk-native-smoke"
          finish 0

      - name: Test 4 - Validate the compiled AArch64 ELF
        id: test4
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local rc="$1"
            trap - EXIT
            if [ "$rc" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish "$?"' EXIT
          test "${{ steps.test3.outcome }}" = success
          test "${{ steps.test3.outputs.status }}" = passed
          file "$SDK_APP/files/bin/sdk-native-smoke"
          sha256sum "$SDK_APP/files/bin/sdk-native-smoke"
          python3 -I - "$SDK_APP/files/bin/sdk-native-smoke" <<'PY'
          from pathlib import Path
          import struct
          import sys
          header = Path(sys.argv[1]).read_bytes()[:64]
          assert len(header) == 64
          assert header[:6] == b'\x7fELF\x02\x01'
          assert struct.unpack_from("<H", header, 16)[0] in (2, 3)
          assert struct.unpack_from("<H", header, 18)[0] == 183
          print("compiled_elf=64-bit-little-endian-aarch64")
          PY
          finish 0

      - name: Test 5 - Run the SDK binary and reject a wrong result
        id: test5
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          finish() {
            local rc="$1"
            trap - EXIT
            if [ "$rc" -eq 0 ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
            echo "duration=$(($(date +%s) - START_TIME))" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap 'finish "$?"' EXIT
          test "${{ steps.test4.outcome }}" = success
          test "${{ steps.test4.outputs.status }}" = passed
          output=$(timeout --kill-after=5s 60s dbus-run-session -- flatpak build --unshare=network "$SDK_APP" /app/bin/sdk-native-smoke 42)
          printf '%s\n' "$output"
          test "$output" = "$(printf 'SDK_RESULT=42\nPTR_BITS=64')"
          if timeout --kill-after=5s 60s dbus-run-session -- flatpak build --unshare=network "$SDK_APP" /app/bin/sdk-native-smoke 43 > "$SDK_SCOPE/negative.log" 2>&1; then
            echo "Wrong expected result was accepted" >&2
            exit 73
          else
            negative_exit=$?
          fi
          cat "$SDK_SCOPE/negative.log"
          test "$negative_exit" -eq 9
          printf 'wrong-expectation-exit=%s\n' "$negative_exit"
          finish 0

      - name: Regression applicability - package manager installed
        id: test6
        if: always()
        run: |
          set -euo pipefail
          CURRENT="${{ steps.version.outputs.version || 'unknown' }}"
          {
            echo "current_version=$CURRENT"
            echo "latest_version=not_applicable"
            echo "next_installed_version=not_applicable"
          } >> "$GITHUB_OUTPUT"
          valid_core() {
            [ "$1" = passed ] && [ "$2" = success ] && [[ "$3" =~ ^[0-9]{1,6}$ ]]
          }
          if [ "${{ steps.install.outcome }}" != success ] || \
             [ "${{ steps.install.outputs.install_status }}" != success ] || \
             [ "${{ steps.install.outputs.installation_method }}" != flatpak ]; then
            {
              echo "decision=baseline_install_failed"
              echo "status=skipped"
              echo "regression_result=Regression skipped: the SDK Flatpak installation did not succeed."
              echo "comparison=No successfully installed SDK baseline is available."
            } >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.version.outcome }}" = success ] && [ "${{ steps.version.outputs.status }}" = passed ] && \
               [[ "$CURRENT" =~ ^26\.08\.[0-9]+$ ]] && \
               valid_core "${{ steps.test1.outputs.status }}" "${{ steps.test1.outcome }}" "${{ steps.test1.outputs.duration }}" && \
               valid_core "${{ steps.test2.outputs.status }}" "${{ steps.test2.outcome }}" "${{ steps.test2.outputs.duration }}" && \
               valid_core "${{ steps.test3.outputs.status }}" "${{ steps.test3.outcome }}" "${{ steps.test3.outputs.duration }}" && \
               valid_core "${{ steps.test4.outputs.status }}" "${{ steps.test4.outcome }}" "${{ steps.test4.outputs.duration }}" && \
               valid_core "${{ steps.test5.outputs.status }}" "${{ steps.test5.outcome }}" "${{ steps.test5.outputs.duration }}"; then
            {
              echo "decision=not_applicable_package_manager"
              echo "status=skipped"
              echo "regression_result=Regression validation not applicable: the tested SDK was installed through the Flatpak package manager."
              echo "comparison=The actual SDK package was installed via Flatpak and passed Tests 1-5; no second candidate was installed under the package manager policy."
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "decision=baseline_failed"
              echo "status=skipped"
              echo "regression_result=Regression skipped: SDK identity or baseline validation failed."
              echo "comparison=All five actual SDK core checks must pass before a baseline can be compared."
            } >> "$GITHUB_OUTPUT"
          fi
          echo "duration=0" >> "$GITHUB_OUTPUT"

      - name: Calculate test summary
        if: always()
        id: summary
        run: |
          set -euo pipefail
          PASSED=0
          FAILED=0
          SKIPPED=0
          TOTAL_DURATION=0
          check_core() {
            local status="$1" outcome="$2" duration="$3"
            if [[ "$duration" =~ ^[0-9]{1,6}$ ]]; then
              TOTAL_DURATION=$((TOTAL_DURATION + 10#$duration))
            else
              status=failed
            fi
            if [ "$status" = passed ] && [ "$outcome" = success ]; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
            fi
          }
          check_core "${{ steps.test1.outputs.status }}" "${{ steps.test1.outcome }}" "${{ steps.test1.outputs.duration }}"
          check_core "${{ steps.test2.outputs.status }}" "${{ steps.test2.outcome }}" "${{ steps.test2.outputs.duration }}"
          check_core "${{ steps.test3.outputs.status }}" "${{ steps.test3.outcome }}" "${{ steps.test3.outputs.duration }}"
          check_core "${{ steps.test4.outputs.status }}" "${{ steps.test4.outcome }}" "${{ steps.test4.outputs.duration }}"
          check_core "${{ steps.test5.outputs.status }}" "${{ steps.test5.outcome }}" "${{ steps.test5.outputs.duration }}"
          CORE_FAILED=$FAILED
          EXPECTED_DECISION=not_applicable_package_manager
          if [ "${{ steps.install.outcome }}" != success ] || \
             [ "${{ steps.install.outputs.install_status }}" != success ] || \
             [ "${{ steps.install.outputs.installation_method }}" != flatpak ]; then
            EXPECTED_DECISION=baseline_install_failed
          elif [ "$CORE_FAILED" -gt 0 ] || [ "${{ steps.version.outcome }}" != success ] || \
               [ "${{ steps.version.outputs.status }}" != passed ] || \
               [[ ! "${{ steps.version.outputs.version }}" =~ ^26\.08\.[0-9]+$ ]]; then
            EXPECTED_DECISION=baseline_failed
          fi
          DURATION6="${{ steps.test6.outputs.duration }}"
          if [ "${{ steps.test6.outputs.status }}" = skipped ] &&
             [ "${{ steps.test6.outputs.decision }}" = "$EXPECTED_DECISION" ] &&
             [ "${{ steps.test6.outcome }}" = success ] &&
             { { [ "$CORE_FAILED" -eq 0 ] && [ "$EXPECTED_DECISION" = not_applicable_package_manager ]; } ||
               { [ "$CORE_FAILED" -gt 0 ] && [ "$EXPECTED_DECISION" != not_applicable_package_manager ]; }; } &&
             [ "$DURATION6" = 0 ] &&
             [ "${{ steps.test6.outputs.current_version }}" = "${{ steps.version.outputs.version || 'unknown' }}" ] &&
             [ "${{ steps.test6.outputs.latest_version }}" = not_applicable ] &&
             [ "${{ steps.test6.outputs.next_installed_version }}" = not_applicable ]; then
            SKIPPED=1
          else
            FAILED=$((FAILED + 1))
          fi
          {
            echo "passed=$PASSED"
            echo "failed=$FAILED"
            echo "skipped=$SKIPPED"
            echo "core_failed=$CORE_FAILED"
            echo "duration=$TOTAL_DURATION"
          } >> "$GITHUB_OUTPUT"
          if [ "$FAILED" -eq 0 ]; then
            echo "overall_status=success" >> "$GITHUB_OUTPUT"
            echo "badge_status=passing" >> "$GITHUB_OUTPUT"
          else
            echo "overall_status=failure" >> "$GITHUB_OUTPUT"
            echo "badge_status=failing" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Create test summary
        if: always()
        run: |
          {
            echo "## Freedesktop SDK Test Results"
            echo "- **SDK version:** ${{ steps.version.outputs.version }}"
            echo "- **Installation:** ${{ steps.install.outputs.installation_method }}"
            echo "- **SDK ref / commit:** ${{ steps.install.outputs.sdk_ref }} / ${{ steps.install.outputs.sdk_commit }}"
            echo "- **Platform ref / commit:** ${{ steps.install.outputs.platform_ref }} / ${{ steps.install.outputs.platform_commit }}"
            echo "- **Status:** ${{ steps.summary.outputs.overall_status }}"
            echo "- **Tests passed / failed / skipped:** ${{ steps.summary.outputs.passed }} / ${{ steps.summary.outputs.failed }} / ${{ steps.summary.outputs.skipped }}"
            echo "- **Duration:** ${{ steps.summary.outputs.duration }}s"
            echo "- Test 1 - SDK and application metadata: ${{ steps.test1.outputs.status }}"
            echo "- Test 2 - SDK identity and native compiler: ${{ steps.test2.outputs.status }}"
            echo "- Test 3 - SDK compile and link: ${{ steps.test3.outputs.status }}"
            echo "- Test 4 - AArch64 ELF: ${{ steps.test4.outputs.status }}"
            echo "- Test 5 - Correct and incorrect runtime expectations: ${{ steps.test5.outputs.status }}"
            echo "- Regression applicability: ${{ steps.test6.outputs.status }} / ${{ steps.test6.outputs.decision }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove only the owned SDK storage
        id: cleanup
        if: always()
        run: |
          set -euo pipefail
          scope="$RUNNER_TEMP/freedesktop-sdk-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [ -e "$scope" ] || [ -L "$scope" ]; then
            test -d "$scope" && test ! -L "$scope"
            test "$(cat "$scope/owner")" = "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
            chmod -R u+w -- "$scope"
            rm -rf -- "$scope"
          fi

name: Emit strict package observation
description: Validate six producer-owned test facts and emit canonical compact JSON.

inputs:
  package_slug:
    description: Canonical package slug.
    required: true
  package_name:
    description: Human-readable package name.
    required: true
  package_version:
    description: Exact baseline version validated by Tests 1-5.
    required: true
  run_status:
    description: Declared overall status to cross-check against the six tests.
    required: true
  badge_status:
    description: Declared badge status to cross-check against the six tests.
    required: true
  core_failed:
    description: Declared number of failed baseline tests.
    required: true
  tests_passed:
    description: Declared passed-test count.
    required: true
  tests_failed:
    description: Declared failed-test count.
    required: true
  tests_skipped:
    description: Declared skipped-test count.
    required: true
  duration_seconds:
    description: Declared sum of all six test durations.
    required: true
  test1_name:
    description: Test 1 label.
    required: true
  test1_status:
    description: Test 1 status.
    required: true
  test1_duration:
    description: Test 1 duration in seconds.
    required: true
  test2_name:
    description: Test 2 label.
    required: true
  test2_status:
    description: Test 2 status.
    required: true
  test2_duration:
    description: Test 2 duration in seconds.
    required: true
  test3_name:
    description: Test 3 label.
    required: true
  test3_status:
    description: Test 3 status.
    required: true
  test3_duration:
    description: Test 3 duration in seconds.
    required: true
  test4_name:
    description: Test 4 label.
    required: true
  test4_status:
    description: Test 4 status.
    required: true
  test4_duration:
    description: Test 4 duration in seconds.
    required: true
  test5_name:
    description: Test 5 label.
    required: true
  test5_status:
    description: Test 5 status.
    required: true
  test5_duration:
    description: Test 5 duration in seconds.
    required: true
  test6_name:
    description: Test 6 label.
    required: true
  test6_status:
    description: Raw Test 6 status before semantic decision normalization.
    required: true
  test6_duration:
    description: Test 6 duration in seconds.
    required: true
  regression_decision:
    description: Approved machine-readable Test 6 decision.
    required: true
  regression_current_version:
    description: Baseline version used for the Test 6 comparison.
    required: true
  regression_latest_version:
    description: Latest stable version considered by Test 6.
    required: true
  regression_next_installed_version:
    description: Version reported by the candidate installation, if any.
    required: true
  regression_result:
    description: Human-readable Test 6 outcome backed by this run.
    required: true
  regression_comparison:
    description: Meaningful explanation of the current/candidate comparison.
    required: true

outputs:
  package_observation_json:
    description: Canonical one-line producer observation JSON.
    value: ${{ steps.emit.outputs.package_observation_json }}
  result_path:
    description: Path to the canonical observation file.
    value: ${{ steps.emit.outputs.result_path }}

runs:
  using: composite
  steps:
    - name: Validate and emit package observation
      id: emit
      shell: bash
      env:
        PACKAGE_SLUG: ${{ inputs.package_slug }}
        PACKAGE_NAME: ${{ inputs.package_name }}
        PACKAGE_VERSION: ${{ inputs.package_version }}
        RUN_STATUS: ${{ inputs.run_status }}
        BADGE_STATUS: ${{ inputs.badge_status }}
        CORE_FAILED: ${{ inputs.core_failed }}
        TESTS_PASSED: ${{ inputs.tests_passed }}
        TESTS_FAILED: ${{ inputs.tests_failed }}
        TESTS_SKIPPED: ${{ inputs.tests_skipped }}
        DURATION_SECONDS: ${{ inputs.duration_seconds }}
        TEST1_NAME: ${{ inputs.test1_name }}
        TEST1_STATUS: ${{ inputs.test1_status }}
        TEST1_DURATION: ${{ inputs.test1_duration }}
        TEST2_NAME: ${{ inputs.test2_name }}
        TEST2_STATUS: ${{ inputs.test2_status }}
        TEST2_DURATION: ${{ inputs.test2_duration }}
        TEST3_NAME: ${{ inputs.test3_name }}
        TEST3_STATUS: ${{ inputs.test3_status }}
        TEST3_DURATION: ${{ inputs.test3_duration }}
        TEST4_NAME: ${{ inputs.test4_name }}
        TEST4_STATUS: ${{ inputs.test4_status }}
        TEST4_DURATION: ${{ inputs.test4_duration }}
        TEST5_NAME: ${{ inputs.test5_name }}
        TEST5_STATUS: ${{ inputs.test5_status }}
        TEST5_DURATION: ${{ inputs.test5_duration }}
        TEST6_NAME: ${{ inputs.test6_name }}
        TEST6_STATUS: ${{ inputs.test6_status }}
        TEST6_DURATION: ${{ inputs.test6_duration }}
        REGRESSION_DECISION: ${{ inputs.regression_decision }}
        REGRESSION_CURRENT_VERSION: ${{ inputs.regression_current_version }}
        REGRESSION_LATEST_VERSION: ${{ inputs.regression_latest_version }}
        REGRESSION_NEXT_INSTALLED_VERSION: ${{ inputs.regression_next_installed_version }}
        REGRESSION_RESULT: ${{ inputs.regression_result }}
        REGRESSION_COMPARISON: ${{ inputs.regression_comparison }}
      run: |
        set -euo pipefail
        python3 "${GITHUB_ACTION_PATH}/../../scripts/package_observation.py" emit \
          --output .package-observation.json \
          --github-output "${GITHUB_OUTPUT}"

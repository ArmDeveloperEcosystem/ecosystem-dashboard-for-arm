<section id="search-box" class="nl-search" data-conversational-search
    data-endpoint="{{ .Site.Params.conversational_search_endpoint | default "/api/search" }}"
    aria-labelledby="nl-search-heading">
    <div class="nl-search__heading">
        <h2 id="nl-search-heading">Find software for Arm</h2>
        <span class="nl-search__preview">Preview</span>
    </div>
    <p id="nl-search-help" class="nl-search__help">Describe your workload or enter a package name.</p>
    <form id="nl-search-form" role="search">
        <label class="nl-search__sr-only" for="nl-search-input">Find Linux software for Arm</label>
        <div class="nl-search__input-row">
            <input id="nl-search-input" type="search" name="query" maxlength="500"
                placeholder="e.g. Databases for vector search"
                aria-describedby="nl-search-help" autocomplete="off" enterkeyhint="search">
            <button type="submit" class="nl-search__submit">Search</button>
        </div>
    </form>
    <div id="nl-search-examples" class="nl-search__examples" aria-label="Example searches">
        <span>Try:</span>
        <button type="button" data-search-example="Databases for vector search">Vector search databases</button>
        <button type="button" data-search-example="Web servers">Web servers</button>
        <button type="button" data-search-example="Tools for monitoring and observability">Monitoring tools</button>
    </div>
    <div class="nl-search__options">
        <label><input type="checkbox" id="nl-search-tested"> Recorded Arm64 tests only</label>
        <button type="button" id="nl-search-clear" hidden>Clear search</button>
    </div>
    <div id="nl-search-feedback" class="nl-search__feedback" hidden>
        <div class="nl-search__result-bar">
            <p id="nl-search-status" role="status" aria-live="polite" aria-atomic="true"></p>
            <div id="nl-search-refinements" class="nl-search__refinements" aria-label="Refine results" hidden>
                <button type="button" data-search-refinement="opensource">Show only open source</button>
            </div>
        </div>
        <p id="nl-search-notice" class="nl-search__notice" hidden></p>
        <details id="nl-search-details" class="nl-search__details" hidden>
            <summary>How search works</summary>
            <p id="nl-search-details-copy"></p>
        </details>
    </div>
</section>

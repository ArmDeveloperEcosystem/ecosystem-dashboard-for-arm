<section id="search-box" class="nl-search" data-conversational-search
    data-endpoint="{{ .Site.Params.conversational_search_endpoint | default "/api/search" }}"
    aria-labelledby="nl-search-heading">
    <div class="nl-search__heading">
        <h2 id="nl-search-heading">Find software for your workload</h2>
        <span class="nl-search__preview">Preview</span>
    </div>
    <p id="nl-search-help" class="nl-search__help">Describe what you need, or search by package name. Explore the matches in the catalog below.</p>
    <form id="nl-search-form" role="search">
        <label class="nl-search__sr-only" for="nl-search-input">Find Linux software for Arm</label>
        <div class="nl-search__input-row">
            <input id="nl-search-input" type="search" name="query" maxlength="500"
                placeholder="e.g. Open-source databases for vector search"
                aria-describedby="nl-search-help" autocomplete="off">
            <button type="submit" class="nl-search__submit">Search <span aria-hidden="true">→</span></button>
        </div>
    </form>
    <div class="nl-search__examples" aria-label="Example searches">
        <span>Try:</span>
        <button type="button" data-search-example="Open-source databases for vector search">Vector search databases</button>
        <button type="button" data-search-example="Web servers with recorded Arm64 tests">Web servers with tests</button>
        <button type="button" data-search-example="Tools for monitoring and observability">Monitoring tools</button>
    </div>
    <div class="nl-search__options">
        <label><input type="checkbox" id="nl-search-tested"> Recorded Arm64 tests only</label>
        <button type="button" id="nl-search-clear" class="nl-search__text-button" hidden>Clear search</button>
    </div>
    <div id="nl-search-feedback" class="nl-search__feedback" hidden>
        <p id="nl-search-status" role="status" aria-live="polite" aria-atomic="true"></p>
        <p id="nl-search-interpretation" class="nl-search__interpretation" hidden></p>
        <div id="nl-search-constraints" class="nl-search__constraints" aria-label="Search constraints"></div>
        <p id="nl-search-notice" class="nl-search__notice" hidden></p>
        <div id="nl-search-refinements" class="nl-search__refinements" hidden>
            <span>Refine:</span>
            <button type="button" data-search-refinement="Only open-source ones">Only open source</button>
            <button type="button" data-search-refinement="Only those with recorded Arm64 tests">With recorded tests</button>
        </div>
    </div>
</section>

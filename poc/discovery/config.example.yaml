# Internal bounded research. No source code, images, or release assets are executed.
# Omit state_path to keep persistent SQLite history in the output directory.
seeds:
  - source: github
    name: jqlang/jq
    selection_reason: Maintainer repository; portable CLI with published release binaries.
  - source: github
    name: BurntSushi/ripgrep
    selection_reason: Maintainer repository; cross-platform search utility with published binaries.
  - source: github
    name: redis/redis
    selection_reason: Existing dashboard package; distinguish source support from binary distribution evidence.
  - source: dockerhub
    name: library/alpine
    tag: latest
    selection_reason: Docker Official Image; broad base-image distribution, exact current tag inspected.
  - source: dockerhub
    name: library/redis
    tag: latest
    selection_reason: Docker Official Image; compare container distribution with repository evidence.
  - source: dockerhub
    name: library/mysql
    tag: latest
    selection_reason: Docker Official Image; assess the current published image and retain its exact tag and digest as evidence.
retired_candidates:
  - source: dockerhub
    name: library/mysql
    tag: "5.7"
    reason: Legacy demo fixture; current published MySQL image is assessed separately.
discovery:
  min_stars: 1000
  github_queries:
    - topic:vector-database language:Rust
limits:
  max_candidates: 8
  max_discovered: 2
  max_source_records: 40
  max_queries: 1
  max_requests: 50
  max_seconds: 180
  timeout_seconds: 15
  max_response_bytes: 2000000
  max_search_pages: 1
  max_asset_pages: 4
  max_seed_candidates: 100
  oci_fallback: true
refresh_hours:
  supported: 168
  gap: 168
  unknown: 24
force_refresh: false
ai_review:
  enabled: false
  provider: openai
  # When approved/enabled, set ARM_DISCOVERY_OPENAI_API_KEY and ARM_DISCOVERY_MODEL.
  max_calls: 4
  timeout_seconds: 30
  max_seconds: 120
  max_output_tokens: 1500

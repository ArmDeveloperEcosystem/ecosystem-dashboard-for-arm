# Internal bounded research. No source code, images, or release assets are executed.
# Omit state_path to keep persistent SQLite history in the output directory.
seeds:
  - source: github
    name: jqlang/jq
  - source: github
    name: BurntSushi/ripgrep
  - source: github
    name: redis/redis
  - source: dockerhub
    name: library/alpine
    tag: latest
  - source: dockerhub
    name: library/redis
    tag: latest
  # This selected legacy distribution demonstrates a scoped gap,
  # never a claim that current MySQL or all versions lack Arm64 support.
  - source: dockerhub
    name: library/mysql
    tag: "5.7"
discovery:
  min_stars: 1000
  github_queries:
    - topic:vector-database language:Rust
limits:
  max_candidates: 8
  max_discovered: 2
  max_queries: 1
  max_requests: 50
  max_seconds: 180
  timeout_seconds: 15
  max_response_bytes: 2000000
  max_search_pages: 1
  max_release_pages: 2
  max_asset_pages: 4
  max_seed_candidates: 100
  oci_fallback: true
refresh_hours:
  supported: 168
  gap: 168
  unknown: 24
force_refresh: false
ai_review:
  enabled: false
  provider: openai
  # When enabled, set OPENAI_API_KEY and OPENAI_MODEL in the server environment.
  max_calls: 4
  timeout_seconds: 30
  max_seconds: 120
  max_output_tokens: 1500

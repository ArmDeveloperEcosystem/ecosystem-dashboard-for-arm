# Explicitly opt in only when the same-origin backend route is provisioned.
# Merge after config.toml; default deployments remain feature-disabled.
[params]
conversational_search_enabled = true
conversational_search_endpoint = "/ecosystem-dashboard/api/search"
dashboard_base_path = "/ecosystem-dashboard"
[outputs]
home = ["HTML", "POCCatalog"]
[outputFormats.POCCatalog]
mediaType = "application/json"
baseName = "poc-catalog"
isPlainText = true
notAlternative = true
